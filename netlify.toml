[build]
  command = "npm run build"
  publish = "_site"

[images]
  remote_images = ["https://upload\\.wikimedia\\.org/.*", "https://images\\.unsplash\\.com/.*", "https://images\\.pexels\\.com/.*"]

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# www → çıplak domain
[[redirects]]
  from = "https://www.mesaimutfak.com/*"
  to = "https://mesaimutfak.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # HTTPS zorunlu (1 yıl, alt alan adları dahil)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Kamera/mikrofon/konum kapalı. Not: AdSense gelir sinyallerini (browsing-topics) BİLEREK kısıtlamıyoruz.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Hemen zorunlu, hiçbir şeyi kırmayan yapısal CSP korumaları
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests"
    # Tam CSP önce RAPOR MODUNDA — AdSense/GPT/YouTube/Sveltia CMS yığını geniş olduğu için
    # enforce'a geçmeden önce birkaç gün ihlal raporlarını konsolda izleyeceğiz.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://securepubads.g.doubleclick.net https://pubads.g.doubleclick.net https://tpc.googlesyndication.com https://partner.googleadservices.com https://www.googletagmanager.com https://www.googletagservices.com https://adservice.google.com https://imasdk.googleapis.com https://unpkg.com https://cdn.jsdelivr.net https://storage.googleapis.com https://advance-reklam.netlify.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.doubleclick.net https://*.googlesyndication.com https://pagead2.googlesyndication.com https://api.github.com https://advance-reklam.netlify.app https://mesaimutfak.b-cdn.net; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://securepubads.g.doubleclick.net https://www.google.com https://www.youtube-nocookie.com https://www.youtube.com; media-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# CANLI YAYIN
[context.production]
  # Kredi tasarrufu: yalnızca commit mesajında [deploy] varsa canlıya derle (bkz. CLAUDE.md, .github/workflows/toplu-yayin.yml)
  ignore = "git log -1 --format=%B | grep -qiE '\\[(deploy|yayinla)\\]' && exit 1 || exit 0"

# Görsel ve videolar Bunny CDN'den (scripts/cdn.mjs). Yalnızca canlı derlemede; önizlemeler etkilenmez.
[context.production.environment]
  CDN_URL = "https://mesaimutfak.b-cdn.net"
