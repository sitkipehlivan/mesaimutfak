const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), prog=(t,a,b)=>cl((t-a)/(b-a));
const e3=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const PINK='#FA5373', RED='#C8102E', DARK='#7A0A1E', CREAM='#FFF3E6';

/* ---------- train ---------- */
function wheel(cx,cy,r){return `<g class="wh" data-c="${cx} ${cy}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${DARK}"/><circle cx="${cx}" cy="${cy}" r="${r-3}" fill="${CREAM}"/><path d="M${cx-r+3} ${cy}H${cx+r-3}M${cx} ${cy-r+3}V${cy+r-3}" stroke="${DARK}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="2.2" fill="${DARK}"/></g>`}
function wagonSVG(i){const col=[PINK,'#FFFFFF','#2E9E6B'][i%3], st=[`#fff`,RED,'#fff'][i%3];
 return `<svg width="92" height="78" viewBox="0 -14 92 78"><path d="M-8 44H4" stroke="${DARK}" stroke-width="3"/><path d="M3 22H89L83 50H9Z" fill="${col}" stroke="${DARK}" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.2 32H86.8L85.6 38H6.4Z" fill="${st}" opacity=".9"/><rect x="1" y="19" width="90" height="6" rx="3" fill="${DARK}"/>${wheel(26,54,9)}${wheel(66,54,9)}</svg>`}
function locoSVG(){return `<svg width="116" height="78" viewBox="0 -14 116 78"><path d="M-8 44H8" stroke="${DARK}" stroke-width="3"/>
 <rect x="80" y="2" width="13" height="24" fill="${DARK}"/><rect x="76" y="-3" width="21" height="7" rx="3" fill="${RED}"/>
 <rect x="38" y="22" width="68" height="28" rx="11" fill="${PINK}" stroke="${DARK}" stroke-width="1.5"/>
 <rect x="60" y="14" width="12" height="9" rx="4" fill="#F5C04A" stroke="${DARK}" stroke-width="1.2"/>
 <rect x="8" y="4" width="38" height="46" rx="4" fill="${RED}" stroke="${DARK}" stroke-width="1.5"/>
 <rect x="3" y="-1" width="48" height="7" rx="3" fill="${DARK}"/>
 <rect x="15" y="12" width="24" height="16" rx="3" fill="#FFF6D8" stroke="${DARK}" stroke-width="1.2"/>
 <text x="72" y="40" text-anchor="middle" font-family="Barlow" font-weight="800" font-size="7.5" fill="#fff" letter-spacing=".6">PENTİ EXPRESS</text>
 <circle cx="106" cy="30" r="4.5" fill="#FFE27A" stroke="${DARK}" stroke-width="1.2"/>
 <path d="M104 42L117 53H104Z" fill="${DARK}"/><rect x="6" y="48" width="100" height="5" rx="2" fill="${DARK}"/>
 ${wheel(24,54,10)}${wheel(54,54,10)}${wheel(86,56,8)}</svg>`}
function makeTrain(id,prods,Hp){ // prods: [key,...] for 3 wagons
 let h=`<div class="train" id="${id}">`;
 prods.forEach((k,i)=>{h+=`<div class="veh" style="left:${i*100}px;width:92px"><div class="clip" style="height:${Hp+30}px"><img class="prod" src="${IMG[k]}" style="height:${Hp}px"></div>${wagonSVG(i)}</div>`});
 h+=`<div class="veh" style="left:300px;width:116px">${locoSVG()}<div class="puff"></div><div class="puff"></div><div class="puff"></div></div>`;
 for(let i=0;i<10;i++)h+=`<div class="spark"></div>`;
 return h+`</div>`}
function renderTrain(el,t,o){ // o:{x,y(bottom px in parent),s,enter:[a,b],from, pop0, Hp, dist}
 const pe=eio(prog(t,o.enter[0],o.enter[1])); const dx=(1-pe)*o.from;
 el.style.left=(o.x+dx)+'px'; el.style.bottom=o.y+'px'; el.style.transform=`scale(${o.s})`;
 const ang=(-dx/9)*57.3 + (t>o.enter[1]?0:0);
 $$('.wh',el).forEach(w=>w.setAttribute('transform',`rotate(${ang} ${w.dataset.c})`));
 $$('.prod',el).forEach((p,i)=>{const a=o.pop0+i*.28; const q=prog(t,a,a+.7); const b=back(q);
   const bob=q>=1?Math.sin((t-a)*2.2+i)*2.2:0; const hv=p.dataset.hv?1.08:1;
   p.style.transform=`translateY(${(1-b)*o.Hp*1.02+bob}px) rotate(${Math.sin((t-a)*1.7+i*2)*(q>=1?1.6:0)}deg) scale(${hv})`;});
 $$('.puff',el).forEach((p,i)=>{const ph=((t*.55+i/3)%1); const sz=8+ph*18; p.style.width=p.style.height=sz+'px';
   p.style.left=(86-sz/2-ph*26-dx*0)+'px'; p.style.top=(-22-ph*34-sz/2)+'px'; p.style.opacity=(1-ph)*.75;});
 $$('.spark',el).forEach((s,i)=>{const w=i%3; const a=o.pop0+w*.28+.25; const q=prog(t,a,a+.9); const an=rnd(i+3)*Math.PI-Math.PI; const r=q*(40+rnd(i)*50);
   s.style.left=(w*100+46+Math.cos(an)*r)+'px'; s.style.top=(-(o.Hp*.55)+Math.sin(an)*r*.8)+'px'; s.style.opacity=q>0&&q<1?(1-q):0; s.style.transform=`scale(${1.2-q*.6})`;});
}
function snowHTML(n){let h='';for(let i=0;i<n;i++){const sz=2+rnd(i)*4;h+=`<div class="snow" data-i="${i}" style="width:${sz}px;height:${sz}px;opacity:${.45+rnd(i+9)*.5}"></div>`}return h}
function renderSnow(root,t,W,H){$$('.snow',root).forEach(s=>{const i=+s.dataset.i;const sp=18+rnd(i+1)*34;const y=((rnd(i+2)*H+sp*t)%(H+10))-5;const x=rnd(i+5)*W+Math.sin(t*.8+i)*8;s.style.left=x+'px';s.style.top=y+'px'})}

/* ---------- masthead ---------- */
function mastHTML(){return `<div id="mh"><div class="band"><div class="bandclip">
  <div class="hill" style="left:-60px;top:118px;width:520px;height:120px;opacity:.95"></div>
  <div class="hill" style="left:330px;top:128px;width:760px;height:130px"></div>
  <div class="hill" style="left:640px;top:112px;width:460px;height:120px;opacity:.9"></div>
  ${snowHTML(30)}</div>
  <img class="abs" id="mhlogo" src="${IMG.logow}" style="left:26px;top:12px;height:28px">
  <div class="abs" style="left:26px;top:48px;width:330px"><div style="position:relative;height:60px">
    <h3 class="abs" id="mhA" style="left:0;top:0;width:330px">Asıl yolculuk,<br>birbirimize doğru.</h3>
    <h3 class="abs" id="mhB" style="left:0;top:0;width:330px">Penti bir aile.<br>Sen de ondansın.</h3></div></div>
  <div class="abs sub" id="mhsub" style="left:26px;top:101px;margin:0;color:#FFE3E8">Penti Express · 2027 Yılbaşı Koleksiyonu</div>
  <div class="cta" id="mhcta">Hediyeni Seç <span style="font-size:18px">›</span></div>
  <div class="tag" id="mhtag">Kadın · Erkek · Çocuk<br>Evcil hayvan</div>
  <div class="adlbl" style="right:12px;top:6px;color:#fff">REKLAM</div>
 </div>${makeTrain('mhtrain',['c_geyik','c_sock','c_patik'],166)}</div>`}
function renderMast(t){const T=t%12; const mh=$('#mh');
  renderSnow($('.bandclip',mh),t,970,150);
  renderTrain($('#mhtrain'),T,{x:368,y:62,s:1,enter:[.2,1.7],from:-860,pop0:1.75,Hp:166});
  const a=e3(prog(T,.3,.9)); $('#mhlogo').style.opacity=a; $('#mhsub').style.opacity=e3(prog(T,.9,1.5));
  const sw=eio(prog(T,6.6,7.2)), back2=eio(prog(T,11.4,12));
  const A=$('#mhA'),B=$('#mhB'); const pa=e3(prog(T,.5,1.1))*(1-sw); A.style.opacity=pa; A.style.transform=`translateY(${(1-e3(prog(T,.5,1.1)))*14-sw*12}px)`;
  B.style.opacity=sw*(1-back2); B.style.transform=`translateY(${(1-sw)*14}px)`;
  const c=$('#mhcta'); const cp=back(prog(T,2.6,3.2)); const pulse=1+Math.max(0,Math.sin((T-3.4)*3.2))*.05*(T>3.4?1:0);
  c.style.transform=`scale(${cp*pulse*(c.dataset.hv?1.06:1)})`; c.style.opacity=prog(T,2.6,2.8); $('#mhtag').style.opacity=e3(prog(T,3,3.6));
}

function renderVid(root,t,W){const D=2.6,n=5,ph=t/D,k=Math.floor(ph)%n,f=ph-Math.floor(ph);
  $$('.vf',root).forEach((im,i)=>{let op=0,z=1; if(i===k){op=1;z=1.06+f*.08} else if(i===(k+1)%n&&f>.82){op=(f-.82)/.18;z=1.06} im.style.zIndex=(i===(k+1)%n&&f>.82)?2:(i===k?1:0);
    im.style.opacity=op; im.style.transform=`scale(${z}) translateX(${(i%2?-1:1)*f*4}px)`});
  $('.vbar',root).style.width=((t%(D*n))/(D*n)*W)+'px'}
const VBTN=`<div class="vbar"></div><div class="vbtn" style="position:absolute;right:8px;bottom:10px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 4h2.5L7 1v10L3.5 8H1z" fill="#fff"/><path d="M9 3.5c1.4 1.4 1.4 3.6 0 5" stroke="#fff" stroke-width="1.3" fill="none"/></svg></div>`;
/* ---------- interactive masthead ---------- */
const IM={cur:0,prev:0,at:-9,user:false};
function imSel(i,t){if(i===IM.cur)return;IM.prev=IM.cur;IM.cur=i;IM.at=t}
function imHTML(){let h=`<div id="im"><img src="${IMG.logo}" style="position:absolute;left:16px;top:13px;height:28px"><div class="ttl">Yılbaşı Hediyeni Seç</div><div class="cards">`;
  PRODS.forEach((p,i)=>{h+=`<div class="pc" data-i="${i}"><img src="${IMG[p[0]]}"></div>`});
  h+=`</div><div class="nm"><span></span><b></b></div><div class="buy" id="imbuy">Hediyeni Seç <span style="font-size:18px">›</span></div><div class="vid">`;
  for(let i=0;i<5;i++)h+=`<img class="vf" src="${IMG['v'+i]}">`;
  return h+`<div class="vsh"></div><div class="vtx">Asıl yolculuk, birbirimize doğru.</div>${VBTN}<div class="adlbl" style="right:10px;top:6px;color:#fff;text-shadow:0 1px 3px #000;z-index:6">REKLAM</div></div></div>`}
function renderIM(t,o){const im=$('#im'); renderVid($('.vid',im),t,444);
  const p=e3(prog(t,IM.at,IM.at+.3));
  $$('.pc',im).forEach((c,i)=>{const on=i===IM.cur; c.classList.toggle('on',on); const k=on?p:(i===IM.prev?1-p:0); c.style.transform=`translateY(${-5*k}px) scale(${1+.05*k})`});
  const nm=$('.nm',im); if(nm.dataset.i!==String(IM.cur)){nm.dataset.i=IM.cur; $('span',nm).textContent=PRODS[IM.cur][1]; $('b',nm).textContent=PRODS[IM.cur][2]} nm.style.opacity=.3+.7*p;
  const b=$('#imbuy'); b.style.transform=`scale(${1+(o?o.buy:0)*.06+(b.dataset.hv?.04:0)})`; b.style.filter=o&&o.buy>.99?'brightness(.85)':'none';
}
/* ---------- skyscraper ---------- */
const PRODS=[['p0','ÇORAP','Geyik Desenli Yılbaşı Soket Çorap'],['p1','ÇORAP','Kırmızı Ponponlu Soket Çorap'],['p2','EV GİYİM','Winter Dream Ayı Desenli Pijama Takımı'],['p3','AKSESUAR','Yılbaşı Temalı 10’lu Küpe Seti'],['p4','EV GİYİM','Gingerbread Nakışlı Yılbaşı Ev Patiği']];
function skyHTML(){let h=`<div id="sky"><div class="top"><img src="${IMG.logow}" style="height:22px"><div class="adlbl" style="right:8px;top:4px;color:#fff">REKLAM</div></div><div class="vid">`;
  for(let i=0;i<5;i++)h+=`<img class="vf" src="${IMG['v'+i]}">`;
  h+=`${VBTN}</div>
  <div class="ttl"><b>Yılbaşı Hediyeni Seç</b><span>PENTİ EXPRESS · 2027 YILBAŞI KOLEKSİYONU</span></div>`;
  PRODS.forEach((p,i)=>{h+=`<div class="card" data-i="${i}"><img src="${IMG[p[0]]}"><div class="tx"><span class="cat">${p[1]}</span><div class="nm">${p[2]}</div></div><div class="go">İncele ›</div></div>`});
  h+=`<div class="ths">`;PRODS.forEach((p,i)=>{h+=`<div class="th" data-i="${i}"><img src="${IMG[p[0]]}"></div>`});
  return h+`</div><div class="buy" id="skybuy">Hediyeni Seç <span style="font-size:19px">›</span></div></div>`}
const SKY={cur:0,prev:0,at:-9,user:false};
function skySel(i,t){if(i===SKY.cur)return;SKY.prev=SKY.cur;SKY.cur=i;SKY.at=t}
function renderSky(t,o){ // o:{press:thumbIndex/-1, buy:0..1}
  const sk=$('#sky'); renderVid(sk,t,300);
  const p=e3(prog(t,SKY.at,SKY.at+.4));
  $$('.card',sk).forEach((c,i)=>{let op=0,tx=0; if(i===SKY.cur){op=p;tx=(1-p)*22} else if(i===SKY.prev){op=1-p;tx=-p*22} c.style.opacity=op;c.style.transform=`translateX(${tx}px)`;c.style.zIndex=i===SKY.cur?2:1;c.style.pointerEvents=i===SKY.cur?'auto':'none'});
  $$('.th',sk).forEach((th,i)=>{th.classList.toggle('on',i===SKY.cur);th.style.transform=`scale(${o&&o.press===i?.9:1})`});
  const b=$('#skybuy'); b.style.transform=`scale(${1+(o?o.buy:0)*.05+(b.dataset.hv?.03:0)})`; b.style.filter=o&&o.buy>.99?'brightness(.85)':'none';
}

/* ---------- pages ---------- */
function pageHTML(which,extra){return `<div class="abs" style="left:0;top:0;width:1920px;height:758px;background:#121714"><img src="${IMG[which]}" style="position:absolute;left:0;top:0;width:1920px;height:758px">${extra||''}</div>`}
const root=$('#root');
const CUR=`<svg id="cursor" viewBox="0 0 22 30"><path d="M2 2v22l5.5-5 3.6 8.4 3.4-1.5-3.6-8.2H18z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
let render;
if(MODE==='mast'){
  root.innerHTML=`<div id="stage"><div class="abs" id="cam" style="left:0;top:0;width:1920px;height:758px;transform-origin:0 0;transform:scale(.9499) translate(-286px,0)">${pageHTML('site_top')}<div class="abs" style="left:475px;top:163px">${mastHTML()}</div></div></div>`;
  render=t=>renderMast(t);
}
if(MODE==='sky'){
  root.innerHTML=`<div id="stage"><div class="abs" id="cam" style="left:-640px;top:-38px;width:1920px;height:758px">${pageHTML('site_scroll')}<div class="abs" id="skywrap" style="left:1600px;top:144px">${skyHTML()}</div>${CUR}</div></div>`;
  // cursor path in page coords
  const sx=1600, sy=144, th=i=>[sx+12+25+i*56.5, sy+478+34], buy=[sx+150,sy+570];
  const K=[[0,[1500,700]],[1.6,[1500,700]],[2.5,th(1)],[4.2,th(1)],[4.9,th(2)],[6.5,th(2)],[7.2,th(4)],[8.8,th(4)],[9.6,buy],[12,buy]];
  const clicks=[[2.7,1],[5.1,2],[7.4,4]];
  render=t=>{
    let pos=K[0][1]; for(let i=0;i<K.length-1;i++){if(t>=K[i][0]){const q=eio(prog(t,K[i][0],K[i+1][0]));pos=[K[i][1][0]+(K[i+1][1][0]-K[i][1][0])*q,K[i][1][1]+(K[i+1][1][1]-K[i][1][1])*q]}}
    const c=$('#cursor'); c.style.left=pos[0]+'px'; c.style.top=pos[1]+'px';
    SKY.cur=0;SKY.prev=0;SKY.at=-9; clicks.forEach(([ct,i])=>{if(t>=ct){SKY.prev=SKY.cur;SKY.cur=i;SKY.at=ct}});
    let press=-1; clicks.forEach(([ct,i])=>{if(t>=ct-.08&&t<ct+.14)press=i});
    const bh=prog(t,9.5,9.8), bc=(t>=10.3&&t<10.5)?1:0;
    $('#skywrap').style.opacity=e3(prog(t,0,.5)); $('#skywrap').style.transform=`translateY(${(1-e3(prog(t,0,.5)))*18}px)`;
    renderSky(t+3,{press,buy:bc?1:bh*.6});
  };
}
if(MODE==='imast'){
  root.innerHTML=`<div id="stage"><div class="abs" id="cam" style="left:0;top:0;width:1920px;height:758px;transform-origin:0 0;transform:scale(.9499) translate(-286px,0)">${pageHTML('site_top')}<div class="abs" id="imwrap" style="left:475px;top:163px">${imHTML()}</div>${CUR}</div></div>`;
  const cx=i=>[475+14+46+i*101,163+54+80], buy=[475+441,163+222];
  const K=[[0,[1150,560]],[.9,[1150,560]],[1.7,cx(1)],[2.9,cx(1)],[3.4,cx(2)],[4.6,cx(2)],[5.1,cx(3)],[6.3,cx(3)],[6.8,cx(4)],[7.8,cx(4)],[8.5,buy],[11,buy]];
  const sel=[[1.6,1],[3.3,2],[5.0,3],[6.7,4]];
  render=t=>{let pos=K[0][1]; for(let i=0;i<K.length-1;i++){if(t>=K[i][0]){const q=eio(prog(t,K[i][0],K[i+1][0]));pos=[K[i][1][0]+(K[i+1][1][0]-K[i][1][0])*q,K[i][1][1]+(K[i+1][1][1]-K[i][1][1])*q]}}
    const c=$('#cursor'); c.style.left=pos[0]+'px'; c.style.top=pos[1]+'px';
    IM.cur=0;IM.prev=0;IM.at=-9; sel.forEach(([ct,i])=>{if(t>=ct){IM.prev=IM.cur;IM.cur=i;IM.at=ct}});
    $('#imwrap').style.opacity=e3(prog(t,0,.5));
    renderIM(t+3,{buy:(t>=9.1&&t<9.3)?1:prog(t,8.4,8.7)*.6});};
}
function bindLive(getNow){
  $$('.th').forEach(th=>{const f=()=>{SKY.user=true;skySel(+th.dataset.i,getNow())};th.addEventListener('click',f);th.addEventListener('mouseenter',f)});
  $$('.pc').forEach(pc=>{const f=()=>{IM.user=true;imSel(+pc.dataset.i,getNow())};pc.addEventListener('click',f);pc.addEventListener('mouseenter',f)});
  const URL0='https://www.penti.com/tr/yilbasi-hediye';
  $$('.go,#skybuy,#imbuy,#mhcta,.prod').forEach(b=>{b.style.cursor='pointer';b.style.pointerEvents='auto';b.addEventListener('click',()=>{const l=document.createElement('a');l.href=URL0;l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove()});b.addEventListener('mouseenter',()=>b.dataset.hv='1');b.addEventListener('mouseleave',()=>delete b.dataset.hv)});
}
if(MODE.startsWith('cr-')){
  document.documentElement.style.background='transparent';document.body.style.background='transparent';document.body.style.overflow='hidden';
  const k=MODE.slice(3); root.innerHTML=k==='mast'?mastHTML():k==='imast'?imHTML():skyHTML();
  const t0=performance.now(); let now=0, la=0; bindLive(()=>now);
  const loop=()=>{now=(performance.now()-t0)/1000;
    if(k==='mast')renderMast(now);
    if(k==='imast'){if(!IM.user&&now-la>3){la=now;imSel((IM.cur+1)%5,now)}renderIM(now,null)}
    if(k==='sky'){if(!SKY.user&&now-la>3.2){la=now;skySel((SKY.cur+1)%5,now)}renderSky(now,null)}
    requestAnimationFrame(loop)};loop();
}
if(MODE==='tv'){
  root.innerHTML=`<div id="stage"><div class="abs" id="tvbg" style="inset:-40px;background:linear-gradient(135deg,#27405f,#5a4a6e 45%,#3c5d57)">
    <div class="blob" style="left:120px;top:90px;width:420px;height:330px;background:#e7b98c;opacity:.75"></div>
    <div class="blob" style="left:620px;top:160px;width:360px;height:420px;background:#7fb0d8;opacity:.7"></div>
    <div class="blob" style="left:930px;top:60px;width:330px;height:260px;background:#f1e3c8;opacity:.6"></div>
    <div class="blob" style="left:340px;top:420px;width:520px;height:300px;background:#2d3f52;opacity:.8"></div></div>
   <div class="osd" style="right:36px;top:30px;background:#E02020;color:#fff;font-size:15px;padding:4px 12px;border-radius:4px;letter-spacing:1px">● CANLI</div>
   <div id="tvad" class="abs" style="left:0;bottom:0;width:1280px;height:180px">
    <div id="tvband"><svg class="abs" style="left:0;top:0" width="300" height="88"><polygon points="0,0 268,0 232,88 0,88" fill="#FA5373"/><polygon points="268,0 280,0 244,88 232,88" fill="#C8102E"/></svg>
      <img class="abs" id="tvlogo" src="${IMG.logow}" style="left:44px;top:21px;height:46px">
      <div class="abs bar" id="tvA" style="left:300px;top:0;height:88px;display:flex;align-items:center;font-weight:800;font-size:33px;color:#2A1A1E;white-space:nowrap">Penti bir aile.&nbsp;<span style="color:#C8102E">Sen de ondansın.</span></div>
      <div class="abs bar" id="tvB" style="left:300px;top:0;height:88px;display:flex;align-items:center;font-weight:800;font-style:italic;font-size:33px;color:#FA5373;white-space:nowrap">Asıl yolculuk, birbirimize doğru.</div>
      <div class="abs" id="tvshine" style="top:0;width:120px;height:88px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent)"></div>
    </div>${makeTrain('tvtrain',['c_geyik','c_patik','c_sock'],166)}
    <div class="adlbl" style="left:10px;top:76px;color:#fff;text-shadow:0 1px 3px #000;font-size:10px">REKLAM</div></div></div>`;
  render=t=>{
    $('#tvbg').style.transform=`scale(${1.02+t*.004})`;
    const up=e3(prog(t,.5,1.1)); $('#tvband').style.transform=`translateY(${(1-up)*100}px)`;
    renderTrain($('#tvtrain'),t,{x:850,y:9,s:.9,enter:[.9,2.2],from:520,pop0:2.2,Hp:166});
    $('#tvtrain').style.opacity=prog(t,.85,.95);
    $('#tvlogo').style.opacity=e3(prog(t,.9,1.4));
    const sw=eio(prog(t,4.8,5.3)); const A=$('#tvA'),B=$('#tvB'); const ia=e3(prog(t,1.1,1.7));
    A.style.opacity=ia*(1-sw); A.style.transform=`translateY(${(1-ia)*16-sw*18}px)`; B.style.opacity=sw; B.style.transform=`translateY(${(1-sw)*18}px)`;
    const sh=prog(t,3.2,4.1); $('#tvshine').style.left=(280+sh*600)+'px'; $('#tvshine').style.opacity=sh>0&&sh<1?.8:0;
  };
}
if(MODE==='live'){
  document.body.style.overflowX='hidden';
  root.innerHTML=`<div id="page" style="position:relative;width:1920px;height:1188px;transform-origin:0 0;background:#121714">
    <img src="${IMG.site_scroll}" style="position:absolute;left:0;top:430px;width:1920px;height:758px;clip-path:inset(200px 0 0 0)">
    <img src="${IMG.site_top}" style="position:absolute;left:0;top:0;width:1920px;height:758px;clip-path:inset(0 0 128px 0)">
    <div class="abs" id="slotA" style="left:475px;top:163px">${mastHTML()}</div><div class="abs" id="slotB" style="left:475px;top:163px;display:none">${imHTML()}</div>
    <div class="abs" style="left:1600px;top:150px">${skyHTML()}</div></div>
    <div id="demotag">DEMO · Penti × Advance · temsili yerleşim <button id="bA" class="on">3D CGI Masthead</button><button id="bB">Interactive Masthead</button></div>`;
  const tg=b=>{$('#slotA').style.display=b?'none':'';$('#slotB').style.display=b?'':'none';$('#bA').classList.toggle('on',!b);$('#bB').classList.toggle('on',b)};$('#bA').onclick=()=>tg(false);$('#bB').onclick=()=>tg(true);
  const fit=()=>{const s=Math.min(1,innerWidth/1920);$('#page').style.transform=`scale(${s})`;root.style.height=(1188*s)+'px'};fit();addEventListener('resize',fit);
  const t0=performance.now(); let now=0;
  bindLive(()=>now);
  let lastAuto=0;
  const loop=()=>{now=(performance.now()-t0)/1000; if(now-lastAuto>3.2){lastAuto=now;if(!SKY.user)skySel((SKY.cur+1)%5,now);if(!IM.user)imSel((IM.cur+1)%5,now)} renderMast(now);renderIM(now,null);renderSky(now,null);requestAnimationFrame(loop)};loop();
}
</script></body></html>
