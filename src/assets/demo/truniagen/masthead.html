<script>// Ortak animasyon yardımcıları. Her kreatif window.render(t) tanımlar; ?manual=1 yoksa kendi kendine oynar.
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, a, d) => cl((t - a) / d);
const e3 = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const MANUAL = /[?&]manual=1/.test(location.search) || window.__manual;
const CLICK = 'https://cronospharma.com/tru-niagen';
function autoplay(dur, loopFrom) {
  if (MANUAL) { window.render(0); return; }
  const t0 = performance.now();
  (function f(n) { let t = (n - t0) / 1000; if (dur && t > dur) t = loopFrom + ((t - loopFrom) % (dur - loopFrom)); window.render(t); requestAnimationFrame(f); })(t0);
}
// Yüzen "molekül" küreleri: deterministik
function orbs(host, list) {
  return list.map(o => { const d = document.createElement('i'); d.className = 'orb' + (o.c ? ' ' + o.c : ''); d.style.cssText = `width:${o.r * 2}px;height:${o.r * 2}px;left:${o.x - o.r}px;top:${o.y - o.r}px`; if (o.t) d.textContent = o.t; host.appendChild(d); return { el: d, ...o }; });
}
function orbTick(arr, t, k) {
  arr.forEach((o, i) => { const a = e3(pr(t, o.d || 0, .7)) * (k == null ? 1 : k); const dx = Math.sin(t * (.5 + i * .07) + i) * (o.a || 5), dy = Math.cos(t * (.6 + i * .05) + i * 2) * (o.a || 5); o.el.style.opacity = a * (o.o || 1); o.el.style.transform = `translate(${dx}px,${dy + (1 - a) * 26}px) scale(${.5 + a * .5})`; });
}

$('#ad').href = (window.clickTag || CLICK);
const O = orbs($('#orbs'), [
  { x: 540, y: 34, r: 17, c: 'n', t: 'NAD⁺', d: 1.0, a: 5 }, { x: 742, y: 30, r: 9, d: 1.15 }, { x: 728, y: 222, r: 13, c: 'w', d: 1.25, a: 4 },
  { x: 552, y: 226, r: 8, d: 1.3 }, { x: 505, y: 60, r: 5, c: 'w', d: 1.4, o: .8 }, { x: 770, y: 208, r: 5, d: 1.45, o: .8 }, { x: 590, y: 14, r: 4, c: 'w', d: 1.5, o: .7 }
]);
O[0].el.style.fontSize = '10px';
const st = $$('.st'), P = 12;
window.render = function (t) {
  const bi = e3(pr(t, 0, .6));
  $('#band').style.transform = `scaleX(${.04 + bi * .96})`; $('#band').style.opacity = cl(bi * 3);
  const r = back(pr(t, .5, .9)), wob = Math.sin(t * Math.PI / 3);
  $('#bot').style.transform = `translateY(${(1 - r) * 250 + wob * 3}px) rotate(${-4 + wob * 1.6}deg)`; $('#bot').style.opacity = cl(pr(t, .5, .2));
  $('#sheen').style.transform = $('#bot').style.transform; $('#sheen').style.opacity = cl(pr(t, 1.4, .2));
  const sp = ((t - 1.6) % 6 + 6) % 6; $('#sheen i').style.left = (-60 + cl(sp / 1.1) * 260) + 'px';
  orbTick(O, t);
  const u = ((t - .8) % P + P) % P, tin = e3(pr(t, .8, .5));
  const a = u < 6 ? cl(u / .45) * (1 - cl((u - 5.55) / .45)) : 0, b = t >= 1.3 && u >= 6 ? cl((u - 6) / .45) * (1 - cl((u - 11.55) / .45)) : 0;
  const first = t < .8 + 5.55 ? tin : 1;
  $('#h1').style.opacity = (t < 1.3 ? tin : a) ; $('#h1').style.transform = `translateY(${(1 - (t < 1.3 ? tin : cl(a * 2))) * 10}px)`;
  $('#h2').style.opacity = b; $('#h2').style.transform = `translateY(${(1 - cl(b * 2)) * 10}px)`;
  $$('.kick,.legal,#logo,.tag').forEach(e => e.style.opacity = tin);
  st.forEach((e, i) => { const v = ((t - 1.2) % P + P) % P - i * 4; const o = t < 1.2 ? 0 : (v >= 0 && v < 4 ? cl(v / .4) * (1 - cl((v - 3.6) / .4)) : 0); e.style.opacity = o; e.style.transform = `translateY(${(1 - cl(o * 2)) * 8}px)`; });
  const c = back(pr(t, 1.5, .5)), pulse = 1 + Math.max(0, Math.sin(t * Math.PI / 2)) * .04; $('#cta').style.transform = `scale(${c * pulse})`; $('#cta').style.opacity = cl(pr(t, 1.5, .2));
};
autoplay(0);
