# Mesai Mutfak editör paneli (Sveltia CMS)
backend:
  name: github
  repo: sitkipehlivan/mesaimutfak
  branch: main
  commit_messages:
    create: "Yeni tarif: {{slug}}"
    update: "Güncellendi: {{slug}}"
    delete: "Silindi: {{slug}}"
    uploadMedia: "Görsel yüklendi: {{path}}"
    deleteMedia: "Görsel silindi: {{path}}"

site_url: https://mesaimutfak.com
display_url: https://mesaimutfak.com
logo_url: /favicon.svg

media_folder: src/img/tarifler
public_folder: /img/tarifler

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: tarifler
    label: Tarifler
    label_singular: Tarif
    description: Sitedeki tüm tarifler. Kaydettikten 1-2 dakika sonra sitede görünür.
    folder: src/tarifler
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{title}}"
    summary: "{{title}} · {{lvl}}"
    sortable_fields: [title, date]
    fields:
      - { name: title, label: Tarif adı, widget: string }
      - { name: date, label: Yayın tarihi, widget: datetime, time_format: false, format: "YYYY-MM-DD", default: "{{now}}", hint: "Yeni eklenenler listesi bu tarihe göre sıralanır." }
      - { name: desc, label: Kısa açıklama, widget: text, hint: "Kartlarda ve Google sonuçlarında görünen tek cümle." }
      - { name: image, label: Fotoğraf, widget: image, required: false, hint: "Yatay fotoğraf, en az 1600 px genişlik. Boş bırakılırsa illüstrasyon görünür." }
      - { name: imageAlt, label: Fotoğraf açıklaması, widget: string, required: false, hint: "Görme engelliler ve Google için: fotoğrafta ne var?" }
      - { name: imageCredit, label: Fotoğraf kaynağı, widget: string, required: false, hint: "Kendi fotoğrafınsa boş bırak. Başka kaynaktan alındıysa: Fotoğrafçı · Lisans (ör. Ali Veli · CC BY 4.0)" }
      - { name: imageCreditUrl, label: Fotoğraf kaynak linki, widget: string, required: false }
      - name: cats
        label: Kategoriler
        widget: select
        multiple: true
        min: 1
        hint: "Önce bir yemek türü seç (ilk tür ana kategori olur), sonra varsa Hızlı / Vegan / Glutensiz / Sağlıklı Tatlılar ekle."
        options:
          - { label: Ana Yemekler, value: ana }
          - { label: Zeytinyağlılar, value: zeytinyagli }
          - { label: Ara Sıcaklar, value: arasicak }
          - { label: Hamur İşleri, value: hamurisi }
          - { label: Çorbalar, value: corba }
          - { label: Pilavlar, value: pilav }
          - { label: Kahvaltılık, value: kahvalti }
          - { label: Salata & Meze, value: salata }
          - { label: Fırın Yemekleri, value: firin }
          - { label: Tatlılar, value: tatli }
          - { label: Dünya Mutfağı, value: dunya }
          - { label: Hızlı Tarifler, value: hizli }
          - { label: Vegan, value: vegan }
          - { label: Glutensiz, value: glutensiz }
          - { label: Sağlıklı Tatlılar, value: saglikli }
      - { name: lvl, label: Zorluk, widget: select, options: [Kolay, Orta, Zor], default: Kolay }
      - { name: prep, label: Hazırlık süresi (dk), widget: number, value_type: int, min: 0, default: 10 }
      - { name: cook, label: Pişirme süresi (dk), widget: number, value_type: int, min: 0, default: 20, hint: "Ocak/fırın yoksa 0 yaz." }
      - { name: serv, label: Porsiyon (kişi), widget: number, value_type: int, min: 1, default: 4 }
      - name: moods
        label: Ruh hali (Bugün ne pişirsem? aracı için)
        widget: select
        multiple: true
        required: false
        options:
          - { label: Yorgunum, value: yorgun }
          - { label: Üşüdüm, value: soguk }
          - { label: Hafif bir şey, value: hafif }
          - { label: Canım tatlı çekiyor, value: tatli }
          - { label: Misafir geliyor, value: misafir }
          - { label: Keyfim yerinde, value: keyif }
      - name: ingredients
        label: Malzemeler
        label_singular: Malzeme grubu
        widget: list
        hint: "Tek grup yeterliyse grup adını boş bırak. Miktar sayı olmalı (1,5 yerine 1.5); porsiyon ayarı bunu çarpar."
        fields:
          - { name: group, label: Grup adı (ör. İç harç), widget: string, required: false }
          - name: items
            label: Malzemeler
            label_singular: Malzeme
            widget: list
            summary: "{{a}} {{u}} {{n}}"
            fields:
              - { name: a, label: Miktar, widget: number, value_type: float, required: false }
              - { name: u, label: Birim (su bardağı, yemek kaşığı, g, adet…), widget: string, required: false }
              - { name: n, label: Malzeme, widget: string }
      - name: steps
        label: Yapılışı
        label_singular: Adım
        widget: list
        summary: "{{t}}"
        fields:
          - { name: t, label: Adım başlığı, widget: string }
          - { name: d, label: Açıklama, widget: text }
          - { name: time, label: Süre (ör. 15 dk), widget: string, required: false }
      - { name: tips, label: Püf noktaları, widget: list, required: false, field: { name: tip, label: Püf noktası, widget: string } }
      - { name: videoUrl, label: Video dosyası linki (kendi player + preroll), widget: string, required: false, hint: "MP4 ya da HLS (.m3u8) linki. Doluysa YouTube yerine kendi player'ımız açılır ve video başında reklam (preroll) gösterilebilir." }
      - { name: youtube, label: YouTube video ID, widget: string, required: false, hint: "youtube.com/watch?v= sonrasındaki kısım (ör. dQw4w9WgXcQ). Doldurulunca tarif sayfasında video görünür." }
      - { name: videoLen, label: Video süresi (ör. 0:58), widget: string, required: false }
      - name: chapters
        label: Video bölümleri
        label_singular: Bölüm
        widget: list
        required: false
        summary: "{{t}} {{l}}"
        fields:
          - { name: t, label: Zaman (ör. 0:24), widget: string }
          - { name: l, label: Başlık, widget: string }
          - { name: d, label: Kısa açıklama, widget: string, required: false }
      - name: art
        label: İllüstrasyon renkleri (fotoğraf yoksa)
        widget: select
        multiple: true
        required: false
        max: 3
        hint: "Fotoğraf yüklediysen boş bırakabilirsin."
        options:
          - { label: Pirinç / krem, value: rice }
          - { label: Tereyağı sarısı, value: sun }
          - { label: Yaprak yeşili, value: leaf }
          - { label: Fıstık yeşili, value: pis }
          - { label: Nar kırmızısı, value: pom }
          - { label: Domates, value: tomato }
          - { label: Mor soğan, value: onion }
          - { label: Beyaz, value: card }
      - { name: author, label: Tarifi yazan, widget: relation, collection: ayarlar, file: authors, value_field: "list.*.slug", search_fields: ["list.*.name"], display_fields: ["list.*.name"], required: false, hint: "Önce Site ayarları → Yazar ve editörler'e kişiyi ekle." }
      - { name: editor, label: Editör kontrolü, widget: relation, collection: ayarlar, file: authors, value_field: "list.*.slug", search_fields: ["list.*.name"], display_fields: ["list.*.name"], required: false }
      - { name: updated, label: Son güncelleme tarihi, widget: datetime, time_format: false, format: "YYYY-MM-DD", required: false, hint: "Tarifte önemli bir değişiklik yaptıysan doldur; Google'a da bildirilir." }
      - { name: sponsor, label: Sponsor marka (sponsorlu tarifse), widget: string, required: false, hint: "Doluysa tarifte 'Sponsorlu · Marka' etiketi görünür." }
      - { name: body, label: Giriş metni, widget: markdown, required: false, hint: "Tarif sayfasında başlığın altında görünen kısa hikâye." }

  - name: ayarlar
    label: Site ayarları
    editor: { preview: false }
    files:
      - name: home
        label: Ana sayfa vitrini
        file: src/_data/home.json
        fields:
          - name: hero
            label: Haftanın tarifi
            widget: object
            fields:
              - { name: slug, label: Tarif, widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
              - { name: eyebrow, label: Üst yazı, widget: string, default: "Haftanın tarifi" }
              - { name: heroImage, label: Ana sayfaya özel görsel, widget: image, required: false, hint: "Boşsa tarifin kendi fotoğrafı kullanılır." }
          - { name: popular, label: Bu hafta en çok bakılanlar, widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], multiple: true, min: 4, max: 4 }
      - name: catthumbs
        label: Kategori görselleri
        file: src/_data/catthumbs.json
        description: Her kategorinin yuvarlak küçük görseli bu tarifin fotoğrafından alınır. Seçilen tarifin fotoğrafı yoksa kategorideki ilk fotoğraflı tarif kullanılır.
        fields:
          - { name: ana, label: "Ana Yemekler", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: zeytinyagli, label: "Zeytinyağlılar", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: arasicak, label: "Ara Sıcaklar", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: hamurisi, label: "Hamur İşleri", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: corba, label: "Çorbalar", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: pilav, label: "Pilavlar", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: kahvalti, label: "Kahvaltılık", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: salata, label: "Salata & Meze", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: firin, label: "Fırın Yemekleri", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: tatli, label: "Tatlılar", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: hizli, label: "Hızlı Tarifler", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: vegan, label: "Vegan", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: glutensiz, label: "Glutensiz", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: saglikli, label: "Sağlıklı Tatlılar", widget: relation, collection: tarifler, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
      - name: authors
        label: Yazar ve editörler
        file: src/_data/authors.json
        fields:
          - name: list
            label: Kişiler
            label_singular: Kişi
            widget: list
            required: false
            summary: "{{name}} · {{role}}"
            fields:
              - { name: slug, label: Kısa ad (adres için, ör. ayse-yilmaz), widget: string, pattern: ["^[a-z0-9-]+$", "Sadece küçük harf, rakam ve tire"] }
              - { name: name, label: Ad soyad, widget: string }
              - { name: role, label: Unvan, widget: select, options: [Yazar, Editör, Şef, Diyetisyen, Yemek fotoğrafçısı], default: Yazar }
              - { name: bio, label: Kısa biyografi, widget: text, required: false, hint: "2-3 cümle: mutfak deneyimi, eğitimi, uzmanlığı. Google güven sinyali için önemli." }
              - { name: expertise, label: Uzmanlık alanları, widget: string, required: false, hint: "ör. Zeytinyağlılar, hamur işleri, vegan mutfak" }
              - { name: photo, label: Fotoğraf, widget: image, required: false }
              - { name: instagram, label: Instagram linki, widget: string, required: false }
              - { name: linkedin, label: LinkedIn linki, widget: string, required: false }
      - name: site
        label: Genel bilgiler
        file: src/_data/site.json
        fields:
          - { name: name, label: Site adı, widget: string }
          - { name: url, label: Site adresi, widget: string }
          - { name: description, label: Site açıklaması (Google), widget: text }
          - { name: youtube, label: YouTube kanal adresi, widget: string, hint: "Menüdeki ve alt bilgideki YouTube butonları buraya gider." }
          - { name: ogImage, label: Varsayılan paylaşım görseli, widget: string, required: false }
          - { name: contactEmail, label: İletişim e-postası (gizlilik sayfasında görünür), widget: string, required: false }
          - { name: ga4, label: Google Analytics ölçüm kimliği (G-XXXXXXX), widget: string, required: false, hint: "Doldurulunca çerez onayı alan ziyaretçiler ölçülmeye başlar." }
          - { name: adsenseClient, label: AdSense yayıncı kimliği (ca-pub-…), widget: string, required: false, hint: "Doluysa AdSense kodu her sayfanın head kısmına eklenir." }
          - name: ads
            label: Reklam (Google Ad Manager)
            widget: object
            fields:
              - { name: enabled, label: Reklamlar açık, widget: boolean, default: false }
              - { name: network, label: Ad Manager ağ kodu (network code), widget: string, required: false, hint: "Ad Manager → Yönetici → Genel ayarlar'daki sayı." }
              - { name: prefix, label: Reklam birimi ana klasörü, widget: string, default: mesaimutfak }
              - { name: interstitial, label: Sayfa geçişlerinde interstitial, widget: boolean, default: true }
              - { name: anchor, label: Mobilde alt sabit banner (anchor), widget: boolean, default: true }
              - { name: vastTag, label: Preroll VAST etiketi, widget: text, required: false, hint: "Ad Manager video reklam birimi ya da başka bir ad server'ın VAST linki." }
              - { name: adsTxt, label: ads.txt satırları, widget: text, required: false, hint: "Ad Manager/AdSense'in verdiği satırları yapıştır (ör. google.com, pub-xxx, DIRECT, f08c47fec0942fa0)." }
          - name: partners
            label: Sipariş butonları (tarif sayfalarında)
            widget: list
            summary: "{{name}}"
            fields:
              - { name: k, label: Kısa ad (ör. getir), widget: string }
              - { name: name, label: Buton yazısı, widget: string }
              - { name: url, label: Link, widget: string, hint: "Anlaşma sonrası partnerin verdiği takip linkiyle değiştirilir." }
              - { name: logo, label: Resmi logo (anlaşma sonrası), widget: image, required: false, hint: "Markanın verdiği logo dosyası. Boşsa buton marka adını yazıyla gösterir." }
              - { name: enabled, label: Görünsün, widget: boolean, default: true }
