# Her pazartesi 06:00 (İstanbul) haftanın tariflerini ve en çok bakılanları yeniler; değişiklik siteyi yeniden yayınlar.
name: Haftanın tarifleri
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock js-yaml@4.1.0
      - run: node scripts/haftanin-tarifleri.mjs
      - name: Kaydet
        run: |
          git config user.name "mesaimutfak-bot"
          git config user.email "hello@mesaimutfak.com"
          git add src/_data/weekly.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Haftanın tarifleri güncellendi"
          git pull --rebase origin main
          git push
