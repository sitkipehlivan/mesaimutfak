# Görseli olmayan tariflere Gemini ile sitenin tarzında yemek fotoğrafı üretir.
name: Tarif görselleri (Gemini)
on:
  push:
    branches: [main]
    paths: ['src/tarifler/**']
  schedule:
    - cron: '40 6 * * *'   # her gün 09:40 (Türkiye)
  workflow_dispatch:
    inputs:
      max:
        description: 'Parti başına görsel sayısı'
        default: '10'
      batches:
        description: 'Kaç parti (her parti ayrı kaydedilir)'
        default: '1'
permissions:
  contents: write
concurrency:
  group: tarif-gorselleri
  cancel-in-progress: false
jobs:
  gorsel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pyyaml
      - name: Görselleri üret ve parti parti kaydet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_IMAGES: ${{ github.event.inputs.max || '10' }}
          BATCHES: ${{ github.event.inputs.batches || '1' }}
        run: |
          git config user.name "mesaimutfak-bot"
          git config user.email "hello@mesaimutfak.com"
          for i in $(seq 1 "$BATCHES"); do
            echo "=== Parti $i / $BATCHES ==="
            python scripts/gorsel/tarif_gorselleri.py || true
            git add src/img/tarifler src/tarifler
            if git diff --cached --quiet; then echo "Bu partide yeni görsel yok, duruluyor"; break; fi
            git commit -m "Tarif görselleri: $(git diff --cached --name-only -- src/img/tarifler | wc -l) yeni (Gemini)"
            git pull --rebase origin main
            git push
            if grep -q "kotası" /tmp/gemini-last.log 2>/dev/null; then echo "Kota/kredi bitti, duruluyor"; break; fi
          done
