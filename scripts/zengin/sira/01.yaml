iskender:
  updated: '__BUGUN__'
  editorNote: |
    İskender'i evde döner ustası olmadan yapılabilir hale getirmek için ince dilimlenmiş bonfileyi seçtik. Tarifteki kritik adım tavayı çok iyi ısıtmak ve eti az az mühürlemek; kalabalık tavada et haşlanır ve İskender'in o tanıdık tadı oluşmaz.
  intro: |
    İskender kebap, 19. yüzyılın sonlarında Bursa'da İskender Efendi'nin yatay döneri dikine çevirmesiyle ortaya çıktığı anlatılan, Türk mutfağının en bilinen kebaplarından biri. Pide yatağı, ince dilimlenmiş et, domates sosu, yoğurt ve masada dökülen kızgın tereyağı, bu tabağın beş temel parçası.

    Evde döner makinesi olmadığı için bu tarifte çok ince dilimlenmiş bonfile ya da antrikot, rendelenmiş soğan suyunda marine edilip kızgın döküm tavada hızla mühürleniyor. Domates sosu tereyağında kavrulan salçayla ayrı hazırlanıyor.

    4 kişilik tarif 40 dakikada hazır. Servis sırası önemli: önce pide, üzerine sos ve et, yanına yoğurt, en son masada tereyağı.
  notes:
    - t: Eti ince dilimlemek
      d: |
        İskender'in dokusu etin inceliğine bağlı. Eti 30-40 dakika dondurucuda bekletip yarı donmuş haldeyken keskin bir bıçakla dilimlersen 2-3 mm kalınlığında, düzgün dilimler elde edersin. Kasabından "İskenderlik" ya da "dönerlik" dilimlemesini istemek de kolay bir yol.
    - t: Soğan suyunun görevi
      d: |
        Rendelenmiş soğanın suyu ete hem aroma verir hem de lifleri yumuşatır. Soğan posasını eti tavaya atmadan önce ayıklamak gerekir; tavada posa yanar ve acı bir tat bırakır.
    - t: Sık yapılan hatalar
      d: |
        En yaygın hata tavayı kalabalık etmek. Et aynı anda çok fazla konunca tavanın ısısı düşer, et suyunu salıp haşlanır. Eti 3-4 parti halinde, her seferinde tavayı yeniden kızdırarak sotelemek gerekir.

        Pideyi ısıtmadan kullanmak da yaygın. Isıtılmamış pide sosu emip hamurlaşır; fırında 5 dakika ısıtılan pide sosu çeker ama dokusunu korur.
    - t: Tereyağının sırrı
      d: |
        Tereyağı köpürüp hafif fındık rengi alana kadar kızdırılmalı ama yanmamalı. Masada etin üzerine dökülürken cızırdaması, tereyağının yeterince sıcak olduğunun işaretidir. Yoğurdun üzerine gelmemesine dikkat et; yoğurt soğuk ve ferah kalmalı.
  faq:
    - q: Evde İskender için hangi et kullanılır?
      a: Çok ince dilimlenmiş dana bonfile ya da antrikot en iyi sonucu verir. Kuzu but da kullanılabilir. Önemli olan etin 2-3 mm inceliğinde dilimlenmesi.
    - q: İskender sosu nasıl yapılır?
      a: Tereyağında domates salçası kavrulur, rendelenmiş domates ve sıcak su eklenip kıvam alana kadar kaynatılır. Sos ne çok koyu ne çok sulu olmalı; pideyi ıslatacak kadar akışkan.
    - q: İskender'de pide yerine ne kullanılır?
      a: Pide bulamazsan bayatlamış köy ekmeği ya da lavaş da kullanılabilir. Ekmeği küp doğrayıp fırında hafifçe ısıtmak, sosu çekip hamurlaşmamasını sağlar.
    - q: İskender tavukla yapılır mı?
      a: Evet. İnce doğranmış tavuk göğsü ya da but aynı yöntemle sotelenip sos, yoğurt ve tereyağıyla servis edilebilir. Tavuk etten daha hızlı pişer; mühürleme süresini kısa tut.

lahmacun:
  editorNote: |
    Lahmacun tarifinde fırın tepsisini önceden ısıtmayı ayrı bir adım olarak yazmamızın nedeni şu: ev fırını taş fırın kadar ısınmaz, ama kızgın tepsi alttan gelen ısıyı taklit edip hamurun çıtır pişmesini sağlıyor. Harcın ince sürülmesi de aynı derecede önemli.
  intro: |
    Lahmacun, ince açılmış hamurun üzerine kıymalı, sebzeli ve baharatlı bir harç sürülerek taş fırında pişirilen, özellikle Gaziantep ve Urfa mutfağıyla özdeşleşmiş bir hamur işi. Limon, maydanoz ve soğanla rulo yapılarak yenir.

    Evde taş fırın olmadığı için bu tarifte fırın en yüksek sıcaklığa getirilip tepsi de önceden ısıtılıyor. Harç robotta ince çekilen sebzeler, yağlı kıyma, biber salçası ve isotla hazırlanıyor ve hamurun üzerine incecik sürülüyor.

    6 kişilik tarif yaklaşık 1 saatte hazır. Hamur mayalanırken harcı hazırlamak süreyi kısaltır.
  notes:
    - t: Yağlı kıyma neden önemli?
      d: |
        Lahmacun harcındaki kıymanın yağı, fırında hamurun içine işleyerek hem lezzeti hem yumuşaklığı sağlar. Yağsız kıyma kullanırsan harç kuru, hamur ise sert olur. Kasaptan yüzde 20 civarı yağ içeren kıyma istemek iyi bir ölçü.
    - t: Harcın kıvamı
      d: |
        Harcın sebzeleri robotta ince çekilmeli ama püre haline gelmemeli. Domates çok sulu ise suyunun bir kısmını süzmek gerekir; sulu harç hamuru ıslatır ve lahmacun çıtır olmaz.

        Harcı sürerken eli ıslatmak işi kolaylaştırır. Harç, hamurun kenarlarına kadar, ince ve eşit bir tabaka halinde sürülmeli.
    - t: Sık yapılan hatalar
      d: |
        Hamuru kalın açmak lahmacunu pide gibi yapar. Hamur, altından ışık geçecek kadar ince açılmalı.

        Fırını yeterince ısıtmamak da yaygın. Fırın en az 15-20 dakika en yüksek sıcaklıkta ısınmalı; tepsi de bu sürede içeride beklemeli.
    - t: Saklama
      d: |
        Pişmiş lahmacunları üst üste koyup soğuduktan sonra dondurucu poşetine koy; 1 ay saklanabilir. Isıtırken kuru tavada ya da önceden ısıtılmış fırında birkaç dakika ısıtmak çıtırlığını geri getirir.
  faq:
    - q: Lahmacun evde nasıl çıtır olur?
      a: Fırını en yüksek sıcaklığa getirip tepsiyi de içinde önceden ısıtmak ve hamuru çok ince açmak en etkili yöntem. Harcı ince sürmek de hamurun çıtır pişmesine yardım eder.
    - q: Lahmacun harcına ne konur?
      a: Yağlı kıyma, soğan, domates, kapya ve sivri biber, sarımsak, maydanoz, biber salçası, isot ya da pul biber ve tuz. Sebzeler ince çekilip kıymayla iyice yoğrulur.
    - q: Lahmacun ile pide arasındaki fark nedir?
      a: Lahmacun çok ince açılan yuvarlak hamura ince bir harç sürülerek yapılır ve rulo yapılarak yenir. Pide ise daha kalın, kayık şeklinde hamurdur; üzerine kıyma, kaşar ya da kuşbaşı gibi daha bol malzeme konur.
    - q: Lahmacun dondurulur mu?
      a: Evet. Pişmiş lahmacunlar soğuduktan sonra dondurucuda 1 ay saklanabilir. Kuru tavada ya da fırında ısıtınca çıtırlığı geri gelir.

icli-kofte:
  editorNote: |
    İçli köftede en zor kısım kabuğu ince açmak olduğu için tarifte irmiği bulgurla birlikte kullandık; irmik hamura esneklik veriyor ve kabuk daha kolay inceltiliyor. Dondurma püf noktasını da ekledik, çünkü bir kerede çok yapıp saklamak bu tarifin en verimli hali.
  intro: |
    İçli köfte, ince bulgurdan hazırlanan bir kabuğun içine cevizli ve baharatlı kıyma harcı doldurularak yapılan, Güneydoğu Anadolu mutfağının en emek isteyen ama en sevilen lezzetlerinden. Haşlanarak ya da kızartılarak servis edilir.

    Bu tarifte dış hamur bulgur, irmik ve yağsız kıymayla yoğruluyor; irmik hamura esneklik katarak ince açılmasını kolaylaştırıyor. İç harç ise kavrulmuş kıyma, soğan, ceviz ve baharatlardan oluşuyor.

    6 kişilik tarif yaklaşık 80 dakika sürüyor. Bir kerede çok yapıp dondurmak, misafir geldiğinde kurtarıcı olur.
  notes:
    - t: İnce kabuğun sırrı
      d: |
        Kabuk ne kadar inceyse içli köfte o kadar iyidir. Dış hamur, elini sık sık ıslatarak uzun süre yoğrulmalı; hamur pürüzsüz ve ele yapışmaz hale gelmeli.

        Şekil verirken ceviz büyüklüğünde parça alıp ıslak işaret parmağınla ortasını oyarak, avucunda çevire çevire duvarları incelt. Kabukta çatlak oluşursa ıslak parmakla kapatabilirsin.
    - t: İç harcı soğutmak
      d: |
        İç harç tamamen soğumadan doldurulursa yağı kabuğu yumuşatır ve köfte kapanırken çatlar. Harcı bir gün önceden hazırlamak hem zaman kazandırır hem de doldurmayı kolaylaştırır.
    - t: Haşlama mı kızartma mı?
      d: |
        Haşlanmış içli köfte daha hafif olur ve kabuğun ince olup olmadığını hemen gösterir; kalın kabuk haşlanınca hamurumsu kalır. Kızartılmış içli köfte ise dışı çıtır bir doku kazanır. Haşlanmış köfteyi servis öncesi tavada az yağla çevirmek iki yöntemin arası bir sonuç verir.
    - t: Dondurma
      d: |
        Şekil verilmiş, pişmemiş köfteleri unlanmış tepsiye aralıklı dizip 1-2 saat dondurucuda beklet, sonra poşete aktar. 3 ay saklanabilir. Donmuş halde, çözdürmeden kaynar suya atılır ya da kızgın yağda kızartılır.
  faq:
    - q: İçli köfte neden dağılır?
      a: Genelde dış hamur yeterince yoğrulmadığı ya da iç harç sıcakken doldurulduğu için. Hamuru ele yapışmayana kadar uzun süre yoğurmak ve iç harcı tamamen soğutmak dağılmayı önler.
    - q: İçli köfte haşlanır mı, kızartılır mı?
      a: İkisi de geleneksel. Haşlama daha hafif ve sağlıklı bir sonuç verir, kızartma ise dışı çıtır yapar. Kaynar tuzlu suda yüzeye çıktıktan 2-3 dakika sonra haşlama tamamlanır.
    - q: İçli köfte hamuruna irmik konur mu?
      a: Bazı yörelerde konur. İrmik hamura esneklik katar, kabuğun ince açılmasını ve çatlamamasını kolaylaştırır. İrmiksiz yapmak istersen bulgur miktarını artırıp hamuru daha uzun yoğurmalısın.
    - q: İçli köfte nasıl dondurulur?
      a: Pişirmeden, şekil verilmiş halde tepside tek tek dondurup sonra poşete alınır. Donmuş halde doğrudan pişirilebilir.

tavuk-sote:
  editorNote: |
    Tavuk sotede tavuğun ayrı ve yüksek ateşte mühürlenmesini tarifin ilk adımı yaptık, çünkü sotenin kuru ve lastik gibi olmasının en sık sebebi tavuğun sebzelerle birlikte haşlanması. Pratik bir hafta içi yemeği olarak 30 dakikanın altında tuttuk.
  intro: |
    Tavuk sote, kuşbaşı tavuğun biber, mantar ve domatesle tavada pişirildiği, hafta içi akşamlarının en pratik ana yemeklerinden biri. Tek tava, yarım saat ve evde çoğunlukla bulunan malzemeler.

    Bu tarifte tavuk önce yüksek ateşte mühürleniyor; bu sayede dışı hafifçe kızarıyor ve suyunu içinde tutuyor. Ardından soğan, biberler ve mantar ekleniyor, en son salça ve domatesle kısa bir süre kısık ateşte pişiyor.

    4 kişilik tarif 30 dakikada hazır. Yanına bulgur pilavı, makarna ya da sade pirinç pilavı çok yakışır.
  notes:
    - t: Göğüs mü but mu?
      d: |
        Bu tarif tavuk göğsüyle yazıldı; daha yağsızdır ve hızlı pişer. Ancak göğüs fazla pişirildiğinde kolayca kurur. Daha sulu bir sote istersen kemiksiz but kullanabilirsin; pişirme süresini 5 dakika uzatman yeterli.
    - t: Mühürlemenin önemi
      d: |
        Tavuk tavaya atıldığında cızırdamalı. Tava yeterince sıcak değilse tavuk hemen su salar ve haşlanır. Tavuğu iki parti halinde mühürlemek, her parçanın kızgın tava yüzeyine temas etmesini sağlar.
    - t: Sık yapılan hatalar
      d: |
        Mantarı tuzlu tavaya erken eklemek, mantarın çok su salmasına ve sotenin sulu olmasına yol açar. Tuzu en sonda eklemek daha iyi sonuç verir.

        Domatesleri ekledikten sonra uzun pişirmek de tavuğu kurutur. Domatesler suyunu salıp çekene kadar, yaklaşık 8-10 dakika yeterli.
    - t: Saklama
      d: |
        Buzdolabında kapalı kapta 3 gün dayanır. Isıtırken birkaç kaşık su ekleyip tavada kısık ateşte ısıtmak tavuğun kurumasını önler. Dondurulmuş tavuk sote 2 aya kadar saklanabilir, ancak mantar çözülürken dokusunu biraz kaybeder.
  faq:
    - q: Tavuk sote neden kuru olur?
      a: Genelde tavuk göğsü fazla pişirildiği ya da düşük ısıda haşlandığı için. Tavuğu yüksek ateşte kısa sürede mühürlemek ve domatesten sonra fazla pişirmemek sulu kalmasını sağlar.
    - q: Tavuk soteye hangi sebzeler konur?
      a: Bu tarifte soğan, kapya ve sivri biber, mantar ve domates kullanılıyor. Kabak, patlıcan ya da bezelye de eklenebilir; sebzeleri aynı boyda doğramak eşit pişmelerini sağlar.
    - q: Tavuk sote yanına ne yapılır?
      a: Bulgur pilavı, pirinç pilavı ya da makarna en yaygın eşlikçiler. Hafif bir öğün için yanına yoğurt ve yeşil salata yeterli.
    - q: Tavuk sote fırında yapılır mı?
      a: Evet. Tüm malzemeleri bir tepside zeytinyağı ve baharatlarla karıştırıp 200°C fırında 30-35 dakika pişirebilirsin. Tavada yapılan kadar hızlı değildir ama ocak başında beklemek gerekmez.

visneli-nar-eksili-zeytinyagli-sarma:
  editorNote: |
    Bu sarmayı klasik zeytinyağlı sarmadan ayıran kuru vişne ve nar ekşisini, iç harcın ekşi-tatlı dengesini kurmak için seçtik. Sarmaların tencerede soğumaya bırakılmasını ayrı bir adım olarak yazdık; zeytinyağlıların ertesi gün daha lezzetli olmasının sebebi bu dinlenme.
  intro: |
    Zeytinyağlı yaprak sarma, Ege ve İstanbul mutfağının en zarif zeytinyağlılarından biri. Bu versiyonda iç harç, kuru vişne ve nar ekşisiyle ekşi-tatlı bir karaktere kavuşuyor; tarçın ve yenibahar da klasik dolma baharatlarının sıcaklığını katıyor.

    Pirinç önce soğan ve dolmalık fıstıkla kavruluyor, baharatlar ve vişneyle yarı pişiriliyor. Asma yaprakları bu harçla sıkıca sarılıyor ve tencereye dizilip zeytinyağlı, nar ekşili suyla kısık ateşte pişiyor.

    6 kişilik tarif yaklaşık 85 dakika sürüyor. Soğuk servis edilir ve bir gün buzdolabında beklediğinde en lezzetli haline gelir.
  notes:
    - t: Yaprak seçimi
      d: |
        Salamura asma yaprağı kullanılıyorsa sıcak suda bekletilip tuzu alınmalı. Taze yaprak kullanacaksan kaynar suda 1-2 dakika haşlamak yeterli.

        İnce ve damarları belirgin olmayan yapraklar sarmayı daha zarif yapar. Kalın ya da yırtık yapraklar atılmamalı; tencerenin dibine serilerek sarmaların yanmasını önler.
    - t: Sıkı sarmak
      d: |
        Sarma yaprağın parlak yüzü dışta kalacak şekilde, sap tarafından başlanarak sarılır. Kenarları içe katlayıp sıkıca sarmak gerekir, ama çok sıkı sarılan sarma pirinç şiştiğinde patlar. Parmak kalınlığında ve eşit boyda sarmalar eşit pişer.
    - t: Neden tencerede soğutuluyor?
      d: |
        Zeytinyağlılar pişirme suyunun içinde soğurken kalan suyu ve zeytinyağını çeker, parlak ve yumuşak bir dokuya kavuşur. Tencereden sıcakken çıkarılan sarmalar kuru ve mat görünür. Tamamen soğuduktan sonra buzdolabına almak en iyisi.
    - t: Saklama
      d: |
        Buzdolabında kapalı kapta, üzerine biraz pişirme suyu dökülerek 4-5 gün taze kalır. Servis etmeden 20-30 dakika önce dolaptan çıkarmak zeytinyağının donmuş görüntüsünü giderir.
  faq:
    - q: Zeytinyağlı sarma kaç dakika pişer?
      a: Kısık ateşte yaklaşık 40-45 dakika pişer. Pirinç tamamen yumuşadığında ve tencerede su neredeyse çekildiğinde sarmalar hazırdır.
    - q: Sarmanın üstüne neden tabak konur?
      a: Ters kapatılan tabak sarmaların pişerken açılmasını ve yerinden oynamasını engeller. Pirinç şiştikçe sarmalar yukarı doğru itilir; tabak bu hareketi dengeler.
    - q: Kuru vişne yerine ne kullanılır?
      a: Kuş üzümü en yaygın alternatif. Vişnenin ekşiliğini dengelemek için harca bir tutam sumak ya da biraz daha nar ekşisi ekleyebilirsin.
    - q: Zeytinyağlı sarma sıcak mı soğuk mu yenir?
      a: Soğuk yenir. Bir gün buzdolabında dinlendikten sonra, servis etmeden önce oda sıcaklığına yaklaştırılır ve limonla sunulur.

imam-bayildi:
  editorNote: |
    İmam bayıldıyı karnıyarık gibi fırında közlenen patlıcanla yazdık; klasik tarifte patlıcan bolca zeytinyağında kızartılır. Bol soğanı ise özellikle vurguladık, çünkü bu yemeğin tatlılığı ve gövdesi oradan geliyor.
  intro: |
    İmam bayıldı, Osmanlı mutfağından günümüze gelen en bilinen zeytinyağlılardan biri. Adının, yemeğin tadına ya da içine konan zeytinyağı miktarına hayran kalıp bayılan bir imamdan geldiği anlatılır.

    Karnıyarıktan farkı etsiz olması ve soğuk servis edilmesi. Patlıcanlar alacalı soyulup fırında yumuşatılıyor, bol soğan, sarımsak ve domatesle hazırlanan harçla dolduruluyor ve fırında pişmeyi tamamlıyor.

    4 kişilik tarif 70 dakikada hazır. Ilık ya da soğuk servis edilir; bir gün buzdolabında bekleyince lezzeti iyice oturur.
  notes:
    - t: Soğanın rolü
      d: |
        İmam bayıldıda soğan, yemeğin ana malzemesi kadar önemlidir. Yarım ay doğranıp zeytinyağında yavaş yavaş yumuşatılan soğan karamelize olarak tatlı bir lezzet kazanır ve patlıcanın hafif acılığını dengeler. Soğanı aceleyle kavurmak bu tatlılığı oluşturmaz.
    - t: Patlıcanı tuzlu suda bekletmek
      d: |
        Alacalı soyulan patlıcanları 15 dakika tuzlu suda bekletmek varsa acılığını alır ve fırında daha az yağ çekmesini sağlar. Sudan çıkardıktan sonra iyice kurulamak gerekir; ıslak patlıcan fırında közlenmez, haşlanır.
    - t: Karnıyarıktan farkı
      d: |
        İmam bayıldı etsiz ve zeytinyağlıdır, soğuk servis edilir. Karnıyarık kıymalı harçla doldurulur ve sıcak yenir. İki yemekte de patlıcan aynı şekilde hazırlanır, fark harçta ve servis sıcaklığındadır.
    - t: Saklama
      d: |
        Buzdolabında kapalı kapta 4 gün dayanır; ertesi gün daha lezzetli olur. Servis etmeden önce 20 dakika oda sıcaklığında bekletmek zeytinyağının donukluğunu giderir. Dondurmayı önermiyoruz.
  faq:
    - q: İmam bayıldı sıcak mı yenir, soğuk mu?
      a: Zeytinyağlı bir yemek olduğu için ılık ya da soğuk yenir. En lezzetli hali, bir gün buzdolabında dinlendikten sonra oda sıcaklığına yaklaştırılmış halidir.
    - q: İmam bayıldı ile karnıyarık arasındaki fark nedir?
      a: İmam bayıldı etsizdir, soğanlı ve domatesli bir harçla doldurulup zeytinyağında pişer ve soğuk servis edilir. Karnıyarık ise kıymalı harçla doldurulur ve sıcak yenir.
    - q: İmam bayıldı vegan mı?
      a: Evet, tarif bu haliyle tamamen vegan ve glutensiz. Yanına yoğurt eklersen vegan olmaktan çıkar.
    - q: Patlıcan kızartılmadan imam bayıldı yapılır mı?
      a: Evet. Bu tarifte patlıcanlar az zeytinyağıyla fırında yumuşatılıyor. Kızartmaya göre çok daha hafif bir sonuç verir.

yayla-corbasi:
  editorNote: |
    Yayla çorbasının en zor anı yoğurdun kesilmeden çorbaya karışması olduğu için terbiyeyi ılıştırma adımını ayrı yazdık. Glutensiz isteyenler için unun yerine pirinç unu seçeneğini de malzemelere ekledik.
  intro: |
    Yayla çorbası, pirinç ve yoğurdun yumurta sarısıyla terbiye edildiği, üzerine naneli tereyağı gezdirilen klasik bir Türk çorbası. Hafif ekşimsi tadı ve yumuşak dokusuyla hem kışın içi ısıtan hem de hasta olunduğunda ilk akla gelen çorbalardan.

    Bu tarifte pirinç önce suda ya da tavuk suyunda yumuşayana kadar pişiyor. Yoğurt, yumurta sarısı ve unla hazırlanan terbiye, tencereden alınan sıcak suyla ılıştırılarak çorbaya ekleniyor. Böylece yoğurt kesilmeden pürüzsüz bir kıvam elde ediliyor.

    4 kişilik tarif 30 dakikada hazır. Tavuk suyu kullanmak çorbanın tadını belirgin şekilde zenginleştirir.
  notes:
    - t: Yoğurt neden keser?
      d: |
        Yoğurt ani ısı değişimine ve yüksek ısıya maruz kalınca proteinleri pıhtılaşır ve çorba taneli bir görünüm alır. Terbiyeye un ve yumurta sarısı eklemek yoğurdu stabilize eder; tencereden alınan sıcak suyu azar azar ekleyerek ılıştırmak da ani ısı farkını önler.

        Terbiyeyi tencereye ekledikten sonra çorba kaynayana kadar tek yöne, sürekli karıştırmak gerekir.
    - t: Pirinç seçimi
      d: |
        Baldo ya da osmancık pirinç çorbaya hem tane hem de kıvam verir. Pirinç yeterince yumuşamadan terbiye eklenirse, terbiyeden sonra uzun kaynatmak gerekir ve yoğurdun kesilme riski artar.
    - t: Saklama ve tekrar ısıtma
      d: |
        Buzdolabında 3 gün dayanır. Isıtırken kısık ateşte ve karıştırarak ısıtmak gerekir; yüksek ateş yoğurdun ayrışmasına neden olabilir. Dondurmayı önermiyoruz, çözülünce yoğurt ayrışır.
  faq:
    - q: Yayla çorbası neden kesilir?
      a: Terbiye ılıştırılmadan sıcak çorbaya eklendiğinde ya da eklendikten sonra karıştırılmadığında yoğurt kesilir. Sıcak suyu azar azar terbiyeye ekleyip ılıştırmak ve sürekli karıştırmak bunu önler.
    - q: Yayla çorbasına yumurta konur mu?
      a: Geleneksel tarifte terbiyeye yumurta sarısı eklenir; yoğurdu stabilize eder ve çorbaya kremamsı bir kıvam verir. Yumurtasız versiyonda un miktarını biraz artırmak gerekir.
    - q: Yayla çorbası glutensiz yapılır mı?
      a: Evet. Terbiyedeki unu pirinç unuyla değiştirmek yeterli; pirinç zaten glutensizdir.
    - q: Yayla çorbası tavuk suyuyla mı yapılır?
      a: İkisi de olur. Tavuk suyu çorbaya daha derin bir tat verir, su ile yapılan versiyon ise daha hafif ve vejetaryen dostudur.

tarhana-corbasi:
  editorNote: |
    Tarhana çorbasında tarhanayı önceden ılık suda bekletmeyi tarifin ilk adımı yaptık; bu adım çorbanın topaklanmasını önlemenin en kolay yolu. Tarifi vegan olarak yazdık, tereyağlı versiyonu da püf noktalarında bıraktık.
  intro: |
    Tarhana çorbası, kurutulmuş tarhananın suyla pişirildiği, Anadolu'nun kış hazırlıklarından doğmuş en eski çorbalarından biri. Tarhana; un, yoğurt, domates, biber ve soğanın fermente edilip kurutulmasıyla yapılır ve kış boyunca saklanır.

    Bu tarifte toz tarhana önce ılık suda bekletilip yumuşatılıyor, ardından zeytinyağında kavrulan salçalı suya eklenerek sürekli karıştırılarak pişiriliyor. Nane ve pul biber çorbanın son dokunuşu.

    4 kişilik tarif 30 dakikada hazır. Kışın en pratik, en hızlı içi ısıtan çorbalarından biri.
  notes:
    - t: Tarhanayı ıslatmak
      d: |
        Toz tarhanayı doğrudan kaynar suya eklemek topaklanmaya yol açar. Önce ılık suda 10 dakika bekletip pürüzsüz bir karışım elde etmek, çorbanın ipeksi olmasını sağlar. Ev yapımı, iri tanelı tarhana kullanıyorsan bekleme süresini 20-30 dakikaya çıkar.
    - t: Sürekli karıştırmak
      d: |
        Tarhana içindeki un nedeniyle tencerenin dibine kolayca tutar. Kaynarken tahta kaşıkla sürekli karıştırmak ve kısık ateşte pişirmek gerekir.
    - t: Ev tarhanası ve hazır tarhana
      d: |
        Hazır toz tarhanalar genelde daha ince öğütülmüş ve tuzludur; tuz miktarını çorbayı tattıktan sonra ayarlamak gerekir. Ev tarhanası daha ekşi ve aromalı olabilir; salça miktarını azaltmak tadı dengeler.
    - t: Saklama
      d: |
        Buzdolabında 3 gün dayanır. Tarhana bekledikçe koyulaşır; ısıtırken sıcak su ekleyerek kıvamı açmak gerekir.
  faq:
    - q: Tarhana çorbası topaklanmasın diye ne yapılır?
      a: Tarhanayı önce ılık suda 10 dakika bekletip pürüzsüz hale getirmek, sonra kaynar suya karıştırarak eklemek topaklanmayı önler.
    - q: Tarhana çorbası vegan mı?
      a: Bu tarif zeytinyağıyla yapıldığı için içinde hayvansal yağ yok. Ancak tarhananın kendisi geleneksel olarak yoğurtla yapılır; kesin vegan isteyenler için tarhana paketinin içeriğini kontrol etmek gerekir.
    - q: Tarhana çorbası glutensiz mi?
      a: Hayır. Tarhana buğday unu içerdiği için glutensiz değildir.
    - q: Tarhana çorbasına ne eklenir?
      a: Klasik tarifte salça, nane ve pul biber. İsteğe göre üzerine tereyağında kızdırılmış nane, kaşar rendesi ya da kızarmış ekmek küpleri eklenebilir.

peynirli-pogaca:
  editorNote: |
    Poğaçada unu son ana kadar azar azar eklemeyi özellikle vurguladık; poğaçanın sert çıkmasının en yaygın sebebi fazla un. Dondurup sabah ısıtma püf noktasını da hafta içi kahvaltıları düşünerek ekledik.
  intro: |
    Peynirli poğaça, Türk kahvaltısının ve çay saatlerinin en sevilen hamur işlerinden biri. Yumuşacık hamuru ve ortasındaki beyaz peynirli harcıyla fırınlardan eve taşınmış bir klasik.

    Bu tarifte hamur süt, yoğurt ve sıvı yağla yoğruluyor ve kabartma tozuyla kabarıyor; maya beklemek gerekmiyor. Beyaz peynir ve maydanozla hazırlanan harç hamurun ortasına konuyor, yarım ay şeklinde kapatılıyor ve yumurta sarısı sürülüp çörek otu serpilerek fırınlanıyor.

    12 adet poğaça yaklaşık 50 dakikada hazır. Fazlasını dondurmak, hafta içi sabahları için büyük kolaylık.
  notes:
    - t: Hamurun kıvamı
      d: |
        Poğaça hamuru ele yapışmayan ama kulak memesinden biraz daha yumuşak olmalı. Unu bir kerede eklemek yerine azar azar ekleyip hamurun kıvamına göre durmak gerekir. Fazla un poğaçayı sert ve kuru yapar.
    - t: Yoğurdun görevi
      d: |
        Yoğurt, kabartma tozuyla birlikte hamurun daha yumuşak ve kabarık olmasını sağlar. Ayrıca poğaçaya hafif ekşimsi, ev yapımı bir tat verir. Yoğurt yerine kefir de kullanılabilir.
    - t: Sık yapılan hatalar
      d: |
        Harcı fazla koymak poğaçanın pişerken açılmasına neden olur. Her poğaçaya bir tatlı kaşığı harç yeterli; kenarları iyice bastırarak kapatmak gerekir.

        Poğaçaları tepsiye sık dizmek de yaygın; kabardıklarında birbirine yapışırlar. Aralarında en az 3 cm boşluk bırakmak iyi olur.
    - t: Dondurma ve ısıtma
      d: |
        Pişmiş poğaçalar soğuduktan sonra dondurucu poşetinde 1 ay saklanabilir. Sabah donmuş halde 180°C fırında 5-7 dakika ısıtmak ilk günkü yumuşaklığı geri getirir. Pişmemiş poğaçaları da tepside dondurup sonra poşete aktarabilir, donmuş halde pişirebilirsin.
  faq:
    - q: Poğaça neden sert olur?
      a: En yaygın sebep fazla un. Unu azar azar ekleyip hamur ele yapışmadığı anda durmak gerekir. Fırında fazla bekletmek de poğaçayı kurutur.
    - q: Mayasız poğaça kabarır mı?
      a: Evet. Bu tarifte kabartma tozu ve yoğurt hamuru kabartıyor; mayalanma beklemeden doğrudan fırına verilebiliyor.
    - q: Poğaçaya hangi peynir konur?
      a: Beyaz peynir en yaygın tercih. Kaşar, lor ya da tulum peyniri de kullanılabilir; tuzlu peynir kullanıyorsan hamurdaki tuzu azalt.
    - q: Poğaça dondurulur mu?
      a: Evet, hem pişmiş hem pişmemiş halde dondurulabilir. Pişmiş poğaçayı fırında 5-7 dakika ısıtmak, pişmemiş olanı ise doğrudan donmuş halde fırına vermek yeterli.

su-boregi:
  editorNote: |
    Su böreğini ev hamuruyla tam haliyle yazdık, ama pratik isteyenler için hazır baklavalık yufka versiyonunu da püf noktalarında bıraktık. Fırından çıkınca bezle örtüp dinlendirme adımı katların birbirine oturması için önemli; atlanmamasını öneriyoruz.
  intro: |
    Su böreği, ince açılan yufkaların kaynar suda haşlanıp tereyağıyla kat kat dizildiği, Türk börekçiliğinin en emek isteyen ama en yumuşak, en zarif böreklerinden biri.

    Bu tarifte hamur yumurta, su ve unla sert bir şekilde yoğruluyor, bezelere ayrılıp nişastayla ince açılıyor. Yufkalar tek tek kaynar suda haşlanıp soğuk suya alınıyor ve tepsiye kat kat diziliyor. Ortaya beyaz peynir ve maydanoz harcı konuyor.

    8 kişilik tarif yaklaşık 100 dakika sürüyor. Fırından çıktıktan sonra 15 dakika dinlendirilmesi katların oturması için şart.
  notes:
    - t: Sert hamurun önemi
      d: |
        Su böreği hamuru kulak memesi kıvamında, oldukça sert olmalı. Sert hamur hem incecik açılabilir hem de haşlanırken dağılmaz. Yumuşak hamur kaynar suda erir ve yırtılır.

        Hamuru yoğurduktan sonra en az 30 dakika dinlendirmek, açarken geri çekmesini önler.
    - t: Haşlama adımı
      d: |
        Yufkalar kaynar tuzlu suda yaklaşık 30 saniye haşlanmalı, ardından hemen soğuk suya alınmalı. Soğuk su pişmeyi durdurur ve yufkanın yapışmasını önler. Geniş bir kevgir ya da iki spatula ile tutmak işi kolaylaştırır.

        Yufka yırtılırsa endişelenme; ara katlarda bu hiç fark edilmez. En alt ve en üst yufkanın düzgün olması yeterli.
    - t: Pratik versiyon
      d: |
        Hazır baklavalık yufkayı süt, yumurta ve sıvı yağ karışımına batırarak kat kat dizmek, su böreğine benzer yumuşak bir sonuç verir. Ev hamuru kadar elastik olmaz ama hazırlık süresi yarıya iner.
    - t: Saklama
      d: |
        Buzdolabında kapalı kapta 3 gün dayanır. Isıtırken fırında üzerini folyoyla kapatıp 160°C'de 10-15 dakika ısıtmak, kurumasını önler. Dilimlenmiş su böreği dondurulabilir.
  faq:
    - q: Su böreği hamuru neden sert yoğrulur?
      a: Sert hamur çok ince açılabilir ve kaynar suda haşlanırken dağılmaz. Yumuşak hamur ise suda yırtılır ve börek katları belirgin olmaz.
    - q: Su böreği yufkası kaç saniye haşlanır?
      a: Yaklaşık 30 saniye. Yufka kaynar suda hafifçe şişip yumuşadığında hemen soğuk suya alınmalı.
    - q: Su böreği hazır yufkadan yapılır mı?
      a: Evet, pratik bir versiyon olarak hazır baklavalık yufkayı sütlü-yumurtalı karışıma batırarak kullanabilirsin. Sonuç ev hamuru kadar elastik olmaz ama oldukça yumuşak olur.
    - q: Su böreği neden dinlendirilir?
      a: Fırından çıkan böreği bezle örtüp 15 dakika dinlendirmek, katların buharla birbirine oturmasını ve kesilirken dağılmamasını sağlar.
