nohut-corbasi:
  aramaBasligi: 'Nohut çorbası tarifi: Kimyonlu, pürüzsüz, 35 dakikada'
  intro: 'Nohut çorbası, haşlanmış nohudun soğan, havuç ve salçayla birlikte pişirilip blenderdan geçirilmesiyle hazırlanan koyu ve pürüzsüz bir çorba. Kimyon ve limon tadını humusa yakın bir yere taşıyor; bir kaşık tahin eklenirse bu benzerlik daha da belirginleşiyor.


    Bu tarif hazır haşlanmış nohutla başlıyor, bu yüzden uzun ıslatma ve haşlama aşamaları yok. Zeytinyağında yumuşatılan soğan, havuç ve sarımsağa salça ekleniyor, nohut ve sıcak suyla 15 dakika pişiriliyor, ardından püre hâline getiriliyor. Tereyağı ya da et suyu kullanılmadığı için çorba vegan.


    Hazırlığı 10, pişirmesi 25 dakika; toplam 35 dakikada 4 kişilik bir tencere çıkıyor. Servis ederken bir avuç bütün nohut, pul biber ve limon eklemeyi unutma.

    '
  editorNote: 'Kimyonu ve tuzu blenderdan sonraya bıraktık; püre hâline gelmiş çorbanın tadına bakıp baharatı ona göre ayarlamak, pişerken değişen kıvam yüzünden tuzu fazla kaçırmanı önlüyor.

    '
  notes:
  - t: Kıvamı ayarlamak
    d: 'Nohut püresi pişerken ve bekledikçe koyulaşır. Blenderdan geçirdikten sonra çorba kaşıktan ağır akıyorsa biraz sıcak su ekleyip bir taşım kaynat; fazla sulu kaldıysa kapağı açık birkaç dakika daha kaynatman yeterli. Suyu bir anda değil, az az eklemek kıvamı kontrol etmeni kolaylaştırır. Tuzu da kıvamı oturttuktan sonra son kez kontrol et, çünkü eklenen su tadı hafifletir. Kimyonu en sonda eklemek kokusunun kaynarken kaybolmasını da önler.

      '
  - t: Kuru nohutla yapmak
    d: 'Hazır haşlanmış nohut yerine kuru nohut kullanacaksan bir gece önceden bol suda ıslat, ertesi gün suyunu değiştirip düdüklü tencerede yaklaşık 25 dakika haşla. Nohutların parmak arasında kolayca ezilmesi gerekir; diri kalan nohut blenderda pürüzsüz olmaz ve çorbada tanecikli bir doku bırakır. Haşlanmış nohudu tarifteki 2 su bardağı ölçüsüyle kullan. Fazlasını haşlama suyuyla birlikte kapalı bir kapta buzdolabında saklayabilir ya da porsiyonlar hâlinde dondurabilirsin.

      '
  - t: Servis ve saklama
    d: 'Bütün nohut, pul biber ve limon yalnızca süs değil; pürüzsüz çorbaya doku ve ekşilik katar. İstersen pul biberi bir kaşık zeytinyağında kısa süre kızdırıp üzerine gezdir. Artan çorbayı kapalı kapta buzdolabında 2-3 gün saklayabilirsin; ısıtırken koyulaşmış olacağı için biraz su eklemen gerekir. Çorba porsiyonlar hâlinde dondurulabilir de. Çözdükten sonra iyice karıştırıp kaynatman ve tuzunu yeniden kontrol etmen yeterli. Servis süslerini ise her zaman taze ekle; dondurulmuş çorbaya da aynı şekilde yakışırlar.

      '
  faq:
  - q: Nohut çorbası kaç dakikada pişer?
    a: 'Haşlanmış nohutla, sebzeleri kavurduktan sonra nohut ve sıcak suyu ekleyip 15 dakika pişirmen yeterli. Hazırlıkla birlikte toplam süre 35 dakika.

      '
  - q: Nohut çorbasına tahin konur mu?
    a: 'Konur. Bir kaşık tahin eklersen çorbanın tadı humusa yaklaşır ve kıvamı biraz daha koyulaşır.

      '
  - q: Nohut çorbasında salça yerine ne kullanılır?
    a: '1 yemek kaşığı salça yerine 2-3 rendelenmiş domates kullanabilirsin. Bu durumda pişirme süresini 5 dakika uzat.

      '
  - q: Nohut çorbası dondurulur mu?
    a: 'Evet, porsiyonlar hâlinde dondurulabilir. Çözdükten sonra biraz su ekleyip kaynatarak kıvamını düzelt.

      '
tavuk-suyu-corbasi:
  aramaBasligi: 'Tavuk suyu çorbası tarifi: Şehriyeli, limonlu terbiyeli'
  intro: 'Terbiyeli tavuk suyu çorbası, tavuğun sebzelerle haşlanıp didiklenmesi, süzülen suda şehriyenin pişirilmesi ve en sonda yumurta sarısı, limon ve unla hazırlanan terbiyeyle bağlanmasıyla yapılıyor. Terbiye çorbaya hem hafif bir ekşilik hem de ipeksi bir kıvam veriyor.


    Bu tarifte 2 tavuk but ya da 1 göğüs, havuç ve soğanla birlikte 40 dakika haşlanıyor. Kemikli tavuk kullanırsan suyun tadı daha dolgun olur. Tel şehriye süzülmüş suda 8 dakikada pişiyor, didiklenen tavuk tencereye geri dönüyor ve terbiye bir kepçe sıcak suyla ılıştırılarak ekleniyor.


    Hazırlık 10, pişirme 50 dakika; toplam 1 saatte 6 kişilik bir çorba hazır.

    '
  editorNote: 'Terbiyeyi ılıştırma işini ayrı bir adım olarak yazdık, çünkü yumurta sarısı kaynayan çorbaya doğrudan dökülürse pişip topaklanıyor; bir kepçe sıcak suyla ısısını yavaşça yükseltmek bu riski ortadan kaldırıyor.

    '
  notes:
  - t: Terbiye neden kesilir
    d: 'Yumurta sarısı yüksek ısıyla aniden karşılaşınca hızla pıhtılaşır ve çorbada küçük parçacıklar oluşur. Bunu önlemek için önce yumurta sarısı, limon suyu ve unu pürüzsüz olana kadar çırp, sonra sürekli çırparak bir kepçe sıcak çorba suyu ekle. Ilışan karışımı tencereye dökerken çorbayı karıştırmaya devam et ve yalnızca bir taşım kaynat. Terbiyeli çorbayı uzun süre kaynatmak da kesilmeye yol açabilir. Un, karışımın ısıya karşı biraz daha dayanıklı olmasına yardım eder.

      '
  - t: Haşlama ve köpük
    d: 'Tavuk haşlanırken suyun yüzeyinde gri bir köpük toplanır. Bunu ilk kaynamadan sonra kepçeyle almak suyun daha berrak ve temiz tatlı olmasını sağlar. Haşlama 40 dakika sürüyor; bu sürede kaynamayı hafif tutmak suyun bulanıklaşmasını engeller. Tavuğu çıkardıktan sonra suyu süzmek soğan ve havuç parçalarını ayıklar. Didiklerken deriyi ve kemikleri ayır; kemikli but kullanıyorsan küçük kemik parçalarının çorbaya karışmamasına dikkat et. Didiklenen tavuğu şehriye piştikten sonra eklemek, etin fazla kaynayıp lif lif dağılmasını da önler.

      '
  - t: Şehriye, pirinç ve saklama
    d: 'Tel şehriye çorbada bekledikçe suyu çekip şişer, bu yüzden çorbayı servise yakın pişirmek daha iyi sonuç verir. Şehriye yerine pirinç kullanmak istersen pirincin şehriyeden daha uzun sürede piştiğini hesaba kat. Artan çorbayı buzdolabında saklayabilirsin; ısıtırken kaynatmadan, orta ateşte karıştırarak ısıt ki terbiye kesilmesin. Terbiyeli çorba dondurmaya pek uygun değildir. Haşlama suyunu ise atma; donuk kalıplarda saklayıp pilavlarda kullanabilirsin. Dondurmak istersen terbiyesiz, şehriyesiz suyu ayırman en pratik yol.

      '
  faq:
  - q: Tavuk suyu çorbası kaç dakika pişer?
    a: 'Tavuk 40 dakika haşlanıyor, şehriye 8 dakikada pişiyor. Hazırlıkla birlikte toplam süre 1 saat.

      '
  - q: Terbiyeli çorba neden kesilir?
    a: 'Yumurta sarısı kaynar çorbaya doğrudan dökülünce pıhtılaşır. Terbiyeyi bir kepçe sıcak suyla ılıştırıp karıştırarak ekle ve yalnızca bir taşım kaynat.

      '
  - q: Tavuk suyu çorbası yumurtasız yapılır mı?
    a: 'Yapılır. Terbiyede yumurta sarısı yerine bir yemek kaşığı daha un ya da nişasta kullanabilirsin.

      '
  - q: Tavuk suyu çorbasında şehriye yerine ne konur?
    a: 'Şehriye yerine pirinç kullanabilirsin. Glutensiz bir terbiye için de un yerine aynı ölçü pirinç unu ya da mısır nişastası olur.

      '
sehriye-corbasi:
  aramaBasligi: 'Şehriye çorbası tarifi: Domatesli, 20 dakikada hazır'
  intro: 'Şehriye çorbası, tereyağında kavrulan tel şehriyenin salça, domates ve tavuk suyuyla pişirildiği, evlerde en sık yapılan çorbalardan biri. Az malzemeyle yapıldığı ve çabuk piştiği için hafta içi akşamlarına çok uygun.


    Bu tarifte şehriye önce 2 dakika kavrularak hafif renk alıyor; bu adım çorbaya kavrulmuş bir tat katıyor. Ardından salça ve rendelenmiş domates 2 dakika çevriliyor, tavuk suyu ve tuz eklenip şehriye yumuşayana kadar yaklaşık 10 dakika pişiriliyor. Tavuk suyun yoksa su da kullanabilirsin.


    Hazırlık 5, pişirme 15 dakika; toplam 20 dakikada 4 kişilik çorba hazır. Limon ve kıyılmış maydanozla servis et.

    '
  editorNote: 'Şehriyeyi kavurmayı ayrı bir adım olarak yazdık; şehriye tereyağında renk almadan suya girerse hem tadı düz kalıyor hem de çorbada daha kolay hamurlaşıyor.

    '
  notes:
  - t: Şehriyeyi kavurmak
    d: 'Tel şehriye çok ince olduğu için kavrulurken birkaç saniyede açık sarıdan koyu kahveye geçebilir. Orta ateşte, sürekli karıştırarak yaklaşık 2 dakika kavur ve hafif altın rengi alınca hemen salçaya geç. Yanmış şehriye çorbaya acı bir tat bırakır ve bunu sonradan düzeltmek mümkün değildir. Şehriyeler eşit renk aldıysa doğru noktadasın. Kavrulan şehriyenin yüzeyi yağla kaplandığı için suda daha geç dağılır ve çorba daha toparlı kalır.

      '
  - t: Tavuk suyu yerine su
    d: 'Tavuk suyu çorbaya derinlik verir ama her zaman elde olmayabilir. Su kullanacaksan bir kaşık daha tereyağı eklemek tadın zayıf kalmasını önler. Başka bir seçenek, sıcak suya bir tatlı kaşığı tereyağı ve bir tutam tuz katmak ya da yarım bulyon kullanmak. Bulyon tuzlu olduğu için bu durumda tarifteki tuzu azaltıp en sonda tadına bakarak ayarla. Kışın taze domates yerine konserve küp domates kullanmak çorbaya daha belirgin bir domates tadı verir.

      '
  - t: Bekletme ve ısıtma
    d: 'Şehriye pişip ocaktan alındıktan sonra da suyu çekmeye devam eder. Çorbayı birkaç saat beklettiğinde koyulaştığını ve şehriyenin şiştiğini görürsün. Bu yüzden çorbayı servise yakın pişirmek en iyisi. Artan çorbayı ısıtırken biraz sıcak su ekleyip kaynatman kıvamı toparlar. Dondurmaya uygun değil, çünkü çözülürken şehriye iyice yumuşar. Limonu tencereye değil her kaseye ayrı sıkmak, hem tadı taze tutar hem de herkesin ekşiliği kendine göre ayarlamasını sağlar.

      '
  faq:
  - q: Şehriye çorbası kaç dakikada pişer?
    a: 'Şehriye kavrulup tavuk suyu eklendikten sonra yaklaşık 10 dakikada yumuşar. Hazırlıkla birlikte toplam 20 dakika sürer.

      '
  - q: Şehriye çorbası neden lapa olur?
    a: 'Şehriye bekledikçe suyu çekip şişer. Çorbayı servise yakın pişirmek ve şehriyeyi önceden tereyağında kavurmak lapa olmasını önler.

      '
  - q: Şehriye çorbası tavuk suyu olmadan yapılır mı?
    a: 'Evet, su ile de olur. Bu durumda bir kaşık daha tereyağı ekle ya da yarım bulyon kullan.

      '
  - q: Şehriye çorbasında salça yerine ne kullanılır?
    a: '1 yemek kaşığı salça yerine 2-3 rendelenmiş domates kullanabilirsin. Bu durumda pişirme süresini 5 dakika uzat.

      '
domates-corbasi:
  aramaBasligi: 'Domates çorbası tarifi: Sütlü ve kaşarlı, 30 dakikada'
  intro: 'Domates çorbası, esnaf lokantalarının ve ev sofralarının en tanıdık çorbalarından biri. Bu tarifte rendelenmiş domates, tereyağında kavrulan pirinç unu ve salçayla pişiriliyor, blenderdan geçirilip sütle yumuşatılıyor ve üzerine kaşar rendesi serpilerek servis ediliyor.


    Buğday unu yerine pirinç unu kullanıldığı için çorba glutensiz. Domatesler salçayla birlikte önce 5 dakika pişiyor, sonra sıcak su, tuz ve bir çay kaşığı şekerle 10 dakika kaynıyor. Şeker, domatesin ekşiliğini dengelemek için var. Mevsim dışında 6 domates yerine 1 kutu konserve domates de kullanabilirsin.


    Hazırlık 10, pişirme 20 dakika; toplam 30 dakikada 4 kişilik çorba çıkıyor.

    '
  editorNote: 'Sütü blenderdan sonraya bıraktık ve yalnızca bir taşım kaynatılacak şekilde yazdık; ekşi domatesle uzun süre kaynayan süt kesilebiliyor, en sona eklenince çorba pürüzsüz kalıyor.

    '
  notes:
  - t: Süt neden en sonda
    d: 'Domates asitli bir sebzedir ve süt asitle birlikte uzun süre kaynatılırsa kesilip küçük topaklar oluşturabilir. Bu tarifte süt, çorba blenderdan geçirildikten sonra ekleniyor ve yalnızca bir taşım kaynatılıyor. Sütü eklemeden önce ateşi orta seviyeye indirmek ve sürekli karıştırmak işini kolaylaştırır. Sütü buzdolabından çıkar çıkmaz değil, biraz bekletip ılımış hâlde eklemek de ani ısı farkını azaltır. Laktozsuz süt aynı şekilde kullanılabilir.

      '
  - t: Domatesi seçmek
    d: 'Çorbanın tadını büyük ölçüde domates belirler. Yazın iyice olgun, kırmızı domatesler kullan; kabuklarını soyup rendelemek çorbayı daha pürüzsüz yapar. Kışın taze domateslerin tadı zayıf olduğundan 1 kutu konserve domates daha iyi sonuç verir. Domatesler çok ekşiyse tarifteki bir çay kaşığı şeker dengeyi sağlar; tatlı domateslerde şekeri azaltabilirsin. Pirinç ununu ve salçayı tereyağında kısa süre kavurmak çiğ un ve salça tadını giderir.

      '
  - t: Servis, peynir ve vegan versiyon
    d: 'Kaşar rendesi sıcak çorbanın üzerinde eriyip uzar; bunun için servisi ocaktan alır almaz yap. Kaşar yerine mozzarella ya da tost peyniri gibi eriyen herhangi bir peynir de olur. Kızarmış ekmek küpleri çorbaya çıtır bir doku ekler. Artan çorbayı peynirsiz saklamak ve peyniri her ısıtmada taze serpmek daha iyi sonuç verir. Vegan bir versiyon için süt yerine yulaf ya da badem sütü, tereyağı yerine zeytinyağı kullan ve peyniri atla.

      '
  faq:
  - q: Domates çorbası kaç dakikada pişer?
    a: 'Domatesler 5 dakika pişiyor, su eklendikten sonra çorba 10 dakika kaynıyor. Hazırlıkla birlikte toplam süre 30 dakika.

      '
  - q: Domates çorbasında süt neden kesilir?
    a: 'Domatesin asidi uzun süre kaynayan sütü kesebilir. Sütü blenderdan sonra ekleyip yalnızca bir taşım kaynatırsan bu sorun yaşanmaz.

      '
  - q: Domates çorbası konserve domatesle yapılır mı?
    a: 'Evet. 6 olgun domates yerine 1 kutu konserve domates kullanabilirsin; kışın daha lezzetli sonuç verir.

      '
  - q: Domates çorbasına neden şeker konur?
    a: 'Bir çay kaşığı şeker domatesin ekşiliğini dengeler. Domatesler tatlıysa şekeri azaltabilirsin.

      '
kabak-corbasi:
  aramaBasligi: 'Kabak çorbası tarifi: Yoğurtlu ve dereotlu, 35 dakikada'
  intro: 'Yoğurtlu kabak çorbası, kabak ve patatesin soğanla birlikte pişirilip dereotuyla blenderdan geçirildiği, üzerine sarımsaklı yoğurt eklenen hafif bir çorba. Patates çorbaya krema ya da un gerekmeden koyuluk veriyor, bu yüzden tarif glutensiz. Malzeme listesi kısa; mevsiminde bol ve ucuz bulunan kabağı değerlendirmek için iyi bir yol.


    Zeytinyağında yumuşatılan soğana küp doğranmış 4 kabak ve 1 patates ekleniyor, 5 dakika çevrildikten sonra sıcak suyla yaklaşık 15 dakika pişiriliyor. Dereotu en sonda, blenderdan hemen önce giriyor; böylece hem rengi hem kokusu korunuyor.


    Hazırlık 10, pişirme 25 dakika; toplam 35 dakikada 4 kişilik çorba hazır. Sıcak yenebildiği gibi yazın buzdolabında soğutup naneyle de servis edebilirsin.

    '
  editorNote: 'Yoğurdu çorbanın içine katmak yerine serviste üzerine eklenecek şekilde yazdık; sıcak çorbada kaynayan yoğurt kesilebiliyor, ayrı eklenince hem ferah kalıyor hem de çorba soğuk servise uygun oluyor.

    '
  notes:
  - t: Rengi korumak
    d: 'Kabak çorbasının yeşil rengi büyük ölçüde kabuktan gelir. Kabakları soymadan kullanırsan çorba daha yeşil ve canlı görünür; soyarsan daha açık, kremsi bir renk elde edersin. Kabakları fazla pişirmek rengi soldurur ve tadı sulandırır, bu yüzden sebzeler yumuşar yumuşamaz blenderdan geçir. Dereotunu blenderdan hemen önce eklemek de yeşil rengi ve taze kokuyu korur. Dereotu yoksa maydanoz ve biraz taze nane iyi bir alternatif.

      '
  - t: Patatesin görevi
    d: 'Kabak çok sulu bir sebze olduğu için tek başına püre yapıldığında çorba incecik kalır. Tarifteki tek patates, pişip blenderdan geçtiğinde nişastasıyla çorbayı bağlar ve krema ya da una gerek bırakmaz. Daha koyu bir kıvam istersen suyu biraz azaltabilir, daha akışkan istersen blenderdan sonra sıcak su ekleyebilirsin. Patates yerine tatlı patates de kullanılabilir; bu durumda pişirme süresi biraz kısalır ve çorba hafif tatlımsı olur.

      '
  - t: Sarımsaklı yoğurt ve soğuk servis
    d: 'Yarım su bardağı yoğurdu bir diş ezilmiş sarımsakla karıştırıp her kasenin ortasına bir kaşık koy. Yoğurdu kaynayan çorbaya eklemek kesilmesine yol açabilir, bu yüzden servis anında eklemek en güvenli yol. Bu çorba soğuk da yenir: yazın buzdolabında soğuttuktan sonra yoğurt ve naneyle servis edebilirsin. Artan çorbayı yoğurtsuz olarak kapalı kapta buzdolabında sakla; sarımsaklı yoğurdu her servis için taze hazırla. Sarımsak bekledikçe yoğurtta keskinleşir, bu yüzden taze karışım daha dengeli bir tat verir.

      '
  faq:
  - q: Kabak çorbası kaç dakikada pişer?
    a: 'Kabak ve patates sıcak su eklendikten sonra yaklaşık 15 dakikada yumuşar. Hazırlıkla birlikte toplam süre 35 dakika.

      '
  - q: Kabak çorbası soğuk içilir mi?
    a: 'Evet. Buzdolabında soğutup sarımsaklı yoğurt ve naneyle servis edebilirsin.

      '
  - q: Kabak çorbası kabuğuyla mı yapılır?
    a: 'Kabakları kabuğuyla kullanırsan çorbanın rengi daha yeşil olur. Soyarsan daha açık renkli bir çorba elde edersin.

      '
  - q: Kabak çorbasında dereotu yerine ne kullanılır?
    a: 'Dereotu yerine maydanoz ve biraz taze nane kullanabilirsin.

      '
brokoli-corbasi:
  aramaBasligi: 'Brokoli çorbası tarifi: Patatesli, kremamsı, 30 dakikada'
  intro: 'Brokoli çorbası, brokoli çiçeklerinin patates ve soğanla pişirilip blenderdan geçirildiği, sütle yumuşatılan yeşil bir çorba. Krema ya da un kullanılmıyor; kremamsı kıvamı patatesin nişastası ve yarım su bardağı süt sağlıyor.


    Zeytinyağında soğan yumuşatılıyor, küp patates eklenip 5 dakika çevriliyor, ardından yaklaşık 500 gramlık bir brokoli ve sıcak su ya da sebze suyu ekleniyor. Sebzeler 15 dakikada yumuşuyor. Blenderdan sonra süt, tuz ve karabiber eklenip bir taşım kaynatılıyor; üzerine kaşar ya da cheddar rendesi serpiliyor.


    Hazırlık 10, pişirme 20 dakika; toplam 30 dakikada 4 kişilik çorba hazır. Süt yerine bitki sütü kullanıp peyniri atlarsan vegan da yapabilirsin.

    '
  editorNote: 'Brokoliyi patatesten sonra tencereye alacak şekilde sıraladık; patates önden başlayınca brokoli yalnızca yumuşayacak kadar pişiyor ve rengini kaybetmiyor.

    '
  notes:
  - t: Rengi canlı tutmak
    d: 'Brokoli fazla piştiğinde parlak yeşil rengi grimsi bir tona döner ve keskin bir koku çıkarır. Bu yüzden tarifte patates önce tencereye giriyor, brokoli ise ona yetişecek kadar, yaklaşık 15 dakika pişiyor. Çiçekleri birbirine yakın büyüklükte doğramak eşit pişmelerini sağlar. Sapı da atma: dış kabuğunu soyup küçük küpler hâlinde patatesle birlikte eklersen hem israf etmezsin hem de çorbaya ek kıvam kazandırırsın.

      '
  - t: Kıvam ve süt
    d: 'Patates, blenderdan geçince çorbayı krema gerektirmeden bağlar. Daha koyu bir çorba istersen suyu biraz azalt, daha hafif istersen blenderdan sonra sıcak su ekle. Süt pürüzsüzleşmiş çorbaya ekleniyor ve yalnızca bir taşım kaynatılıyor; uzun süre kaynatmak sütün dibe tutmasına yol açabilir. Laktozsuz süt birebir kullanılabilir. Su yerine sebze ya da tavuk suyu kullanırsan tadı derinleşir; tuzlu bir suysa tarifteki tuzu azaltıp en sonda ayarla.

      '
  - t: Peynir ve saklama
    d: 'Kaşar ya da cheddar rendesi sıcak çorbanın üzerinde eriyip hafif tuzlu bir katman oluşturur. Peyniri tencereye değil her kaseye ayrı serpmek, artan çorbayı saklamayı kolaylaştırır. Mozzarella ya da tost peyniri de olur. Peynirsiz çorbayı buzdolabında saklayabilirsin; ısıtırken biraz su ekleyip orta ateşte karıştır. Sütlü çorbaların dokusu dondurulup çözülünce biraz ayrışabilir; dondurmak istersen sütü eklemeden önceki püreyi dondurmak daha iyi sonuç verir.

      '
  faq:
  - q: Brokoli çorbası kaç dakikada pişer?
    a: 'Brokoli eklendikten sonra sebzeler yaklaşık 15 dakikada yumuşar. Hazırlıkla birlikte toplam süre 30 dakika.

      '
  - q: Brokoli çorbası kremasız nasıl kıvamlı olur?
    a: 'Bu tarifte kıvamı patates veriyor. Pişen patates blenderdan geçince çorbayı bağlar, üzerine yarım su bardağı süt eklemek yeterli.

      '
  - q: Brokoli çorbasının rengi neden solar?
    a: 'Brokoli fazla pişince rengi solar. Sebzeler yumuşar yumuşamaz blenderdan geçirirsen çorbanın rengi canlı kalır.

      '
  - q: Brokoli çorbası vegan yapılır mı?
    a: 'Evet. Sütü yulaf ya da badem sütüyle değiştirip peyniri atlarsan çorba vegan olur.

      '
mantar-corbasi:
  aramaBasligi: 'Kremalı mantar çorbası tarifi: Kekikli, 30 dakikada'
  intro: 'Kremalı mantar çorbası, kültür mantarının tereyağında soğan ve sarımsakla kavrulup unla bağlandığı, kremayla zenginleştirilen yoğun bir çorba. Kekik ve karabiber mantarın topraksı tadını öne çıkarıyor.


    Bu tarifte 400 gram mantar suyunu salıp tekrar çekene kadar yaklaşık 8 dakika kavruluyor; çorbanın lezzetinin çoğu bu aşamada oluşuyor. Ardından un 1 dakika çevriliyor, sıcak su azar azar eklenip 10 dakika kaynatılıyor. Çorbanın yalnızca yarısı blenderdan geçiriliyor; böylece hem kadifemsi bir kıvam hem de ağızda hissedilen mantar parçaları kalıyor.


    Hazırlık 10, pişirme 20 dakika; toplam 30 dakikada 4 kişilik çorba hazır. Kızarmış ekmekle akşam yemeği yerine geçebilir.

    '
  editorNote: 'Çorbanın tamamını değil yarısını blenderdan geçirmeyi seçtik; tamamen pürüzsüz bir mantar çorbası tek düze kalıyor, yarısı parça hâlinde kalınca her kaşıkta mantarın dokusu hissediliyor.

    '
  notes:
  - t: Mantarı doğru kavurmak
    d: 'Mantar ilk başta tavaya bol su salar. Bu suyu çekmeden una geçersen çorba haşlanmış mantar tadında kalır. Ateşi orta-yüksek tut ve mantarlar suyunu salıp tekrar çekene, kenarları hafif kızarana kadar yaklaşık 8 dakika kavur. Mantarları yıkayacaksan kısa süre durulayıp hemen kurula; uzun süre suda bekleyen mantar daha çok su salar. Birkaç dilimi ayrıca kızartıp servis sırasında üzerine koymak da görüntüyü güzelleştirir.

      '
  - t: Topaklanmayı önlemek
    d: 'Un tereyağı ve mantarla 1 dakika çevrildikten sonra sıcak su bir anda değil, azar azar eklenmeli. Her eklemede iyice karıştırıp un tamamen açıldıktan sonra kalan suyu dökersen topak oluşmaz. Unu kavurmak çiğ un tadını da giderir. Küçük topaklar oluştuysa endişelenme; çorbanın yarısı zaten blenderdan geçiyor ve bu çoğu topağı açar. Glutensiz bir çorba için un yerine aynı ölçü pirinç unu ya da mısır nişastası kullanabilirsin; kıvam aynı olur.

      '
  - t: Krema ve alternatifler
    d: 'Krema çorbaya en sonda, baharatlarla birlikte ekleniyor ve yalnızca bir taşım kaynatılıyor. Uzun süre kaynatmak kremanın ayrışmasına neden olabilir. Daha hafif bir çorba istersen krema yerine süt kullanabilirsin; kıvam biraz daha incelir. Kültür mantarı yerine istiridye ya da kestane mantarı da olur; kestane mantarı daha koyu renkli ve yoğun tatlı bir çorba verir. Artan çorbayı kaynatmadan, orta ateşte karıştırarak ısıtmak kremanın dokusunu korur.

      '
  faq:
  - q: Mantar çorbası kaç dakikada pişer?
    a: 'Mantar 8 dakika kavruluyor, su eklendikten sonra çorba 10 dakika kaynıyor. Hazırlıkla birlikte toplam süre 30 dakika.

      '
  - q: Mantar çorbası kremasız yapılır mı?
    a: 'Yapılır. Krema yerine süt kullanabilirsin; çorba biraz daha hafif ve akışkan olur.

      '
  - q: Mantar çorbası neden topaklanır?
    a: 'Su una bir anda eklenince topak oluşur. Sıcak suyu azar azar ve karıştırarak eklemek bunu önler.

      '
  - q: Mantar çorbası hangi mantarla yapılır?
    a: 'Bu tarif kültür mantarıyla yazıldı. Yerine istiridye ya da kestane mantarı da kullanabilirsin.

      '
balkabagi-corbasi:
  aramaBasligi: 'Balkabağı çorbası tarifi: Zencefilli, kremalı, 40 dakikada'
  intro: 'Balkabağı çorbası, küp doğranmış balkabağının soğan, havuç ve taze zencefille pişirilip blenderdan geçirildiği, kremayla yumuşatılan turuncu bir çorba. Balkabağının doğal tatlılığını zencefilin hafif keskinliği dengeliyor.


    Tereyağında soğan, havuç ve zencefil 5 dakika kavruluyor, ardından 800 gram balkabağı ve sıcak su ekleniyor; kabak yaklaşık 20 dakikada yumuşuyor. Blenderdan sonra 100 ml krema, tuz ve karabiber ekleniyor. Üzerine serpilen kavrulmuş kabak çekirdeği, pürüzsüz çorbaya çıtır bir doku katıyor.


    Hazırlık 15, pişirme 25 dakika; toplam 40 dakikada 4 kişilik çorba hazır. Hazırlık süresinin büyük kısmı balkabağını soyup doğramaya gidiyor. Hazır küp doğranmış balkabağı alırsan bu süre kısalır.

    '
  editorNote: 'Zencefili balkabağıyla birlikte haşlamak yerine en başta tereyağında kavurmayı seçtik; kısa süre yağda ısınan zencefil kokusunu yağa ve oradan bütün çorbaya daha eşit veriyor.

    '
  notes:
  - t: Balkabağını hazırlamak
    d: 'Balkabağının kabuğu sert olduğu için önce büyük parçalara böl, düz tarafını tezgâha yatır ve kabuğu bıçakla yukarıdan aşağı keserek soy. Çekirdekleri ve lifli iç kısmı kaşıkla temizle. Küpleri birbirine yakın büyüklükte doğramak eşit pişmelerini sağlar. Daha derin ve hafif karamelimsi bir tat istersen küpleri önce fırında közleyip sonra tencereye alabilirsin; közlenmiş kabak tencerede daha kısa sürede yumuşar. Kabak hâlâ sertse blendera erken alma; iri parçalar çorbada lifli bir doku bırakır.

      '
  - t: Zencefil ayarı
    d: 'Bir tatlı kaşığı taze zencefil çorbaya belirgin ama yakıcı olmayan bir sıcaklık verir. Zencefile alışık değilsen yarım tatlı kaşığıyla başlayıp blenderdan sonra tadına bakabilirsin. Taze zencefil yoksa dörtte bir ölçüde toz zencefil kullan; toz zencefil daha yoğun olduğu için tarifteki ölçüyü birebir koyarsan çorba acılaşır. Taze zencefili kabuğunu kaşığın kenarıyla kazıyarak soyup ince rendelemek en kolay yöntem. Rendelediğin zencefilin suyunu da tencereye eklemeyi unutma; kokunun önemli bir kısmı o sudadır.

      '
  - t: Vegan versiyon ve saklama
    d: 'Çorbayı vegan yapmak istersen tereyağı yerine zeytinyağı, krema yerine hindistan cevizi sütü kullan; hindistan cevizi sütü zencefille uyumlu bir tat verir. Kremayı tencerede uzun süre kaynatma, blenderdan sonra ekleyip ısıtman yeterli. Dondurmak istersen kremayı eklemeden önceki püreyi dondur, çözdükten sonra ısıtıp kremayı o zaman ekle. Kabak çekirdeklerini kuru tavada birkaç dakika kavurmak tadını belirginleştirir ve çıtırlığını artırır. Çekirdekleri çorbaya en son, servis anında serp ki yumuşamasınlar.

      '
  faq:
  - q: Balkabağı çorbası kaç dakikada pişer?
    a: 'Balkabağı sıcak suyla yaklaşık 20 dakikada yumuşar. Hazırlıkla birlikte toplam süre 40 dakika.

      '
  - q: Balkabağı çorbasında krema yerine ne kullanılır?
    a: 'Süzme yoğurt kullanabilirsin; ocaktan alınca ekle, kaynatma. Vegan için hindistan cevizi sütü iyi bir seçenek.

      '
  - q: Balkabağı çorbasına toz zencefil konur mu?
    a: 'Konur. Taze zencefil ölçüsünün dörtte biri kadar toz zencefil kullan.

      '
  - q: Balkabağı çorbası dondurulur mu?
    a: 'Dondurulur. Kremayı eklemeden önceki püreyi dondurup çözdükten sonra kremayı eklemek daha iyi sonuç verir.

      '
kis:
  aramaBasligi: 'Kiş tarifi: Mantarlı ıspanaklı, ev yapımı tart hamuruyla'
  intro: 'Kiş, Fransız mutfağından gelen, tereyağlı tart hamurunun yumurta, krema ve süt karışımıyla doldurulup fırında pişirildiği tuzlu bir tart. İçi sebze, peynir ya da şarküteri ürünleriyle çeşitlendirilebiliyor.


    Bu tarifte hamur un, soğuk tereyağı, yumurta ve suyla hazırlanıp 30 dakika buzdolabında dinlendiriliyor, ardından kalıba serilip 190°C''de 12 dakika ön pişiriliyor. İç için mantar ve ıspanak tavada suyunu çekene kadar soteleniyor, kaşar ya da gravyerle tabana yayılıyor ve muskatlı yumurtalı karışım üzerine dökülüyor. Kiş 180°C''de ortası tutana kadar 25-30 dakika pişiyor.


    Hazırlık 30, pişirme 40 dakika; toplam 70 dakikada 8 kişilik bir tart çıkıyor. Kahvaltıda, brunch''ta ya da piknikte dilimlenip taşınabiliyor.

    '
  editorNote: 'Hamuru ön pişirmeyi atlanmasın diye ayrı bir adım olarak yazdık; sıvı yumurtalı iç çiğ hamura doğrudan dökülünce taban pişmeden kalıyor ve kişin altı hamur oluyor.

    '
  notes:
  - t: Hamurun soğuk kalması
    d: 'Tart hamurunun gevrek olması, tereyağının unla tamamen kaynaşmadan küçük parçalar hâlinde kalmasına bağlı. Bu yüzden tereyağı buzdolabından yeni çıkmış olmalı ve unla parmak uçlarında, hızlıca kum gibi ufalanmalı. Hamuru uzun süre yoğurmak tereyağını eritir ve sert bir taban verir. Malzemeler bir araya gelir gelmez topla ve 30 dakika buzdolabında dinlendir; dinlenen hamur hem daha kolay açılır hem de fırında daha az çeker.

      '
  - t: Ön pişirme ve ıslak taban
    d: 'Yumurta, krema ve süt karışımı oldukça sıvıdır. Çiğ hamura dökülürse taban bu sıvıyı emer ve pişmeden kalır. Hamuru kalıba yerleştirdikten sonra çatalla delikler açıp 190°C''de 12 dakika ön pişirmek tabanı sabitler. Sebzeleri de mutlaka suyunu çekene kadar sotele; ıspanak ve mantar fırında su salarsa iç sulanır ve taban yine ıslanır. Sotelenen sebzeleri tabana yaymadan önce süzgeçte kısa süre bekletmek de işe yarar.

      '
  - t: Pişme noktası ve çeşitler
    d: 'Kiş, kenarları sertleşmiş ve ortası hafifçe titrer ama sıvı akmaz hâle geldiğinde fırından alınır. 180°C''de 25-30 dakika genellikle yeterli; fazla pişirmek yumurtalı içi süngerimsi ve kuru yapar. Fırından çıktıktan sonra biraz dinlendirirsen iç oturur ve dilimler daha temiz kesilir. İç malzemeyi pırasa, brokoli ya da füme etle değiştirmek mümkün. Ispanak yerine pazı, kaşar yerine mozzarella ya da tost peyniri de kullanabilirsin.

      '
  faq:
  - q: Kiş kaç dakika pişer?
    a: 'Hamur 190°C''de 12 dakika ön pişiriliyor, iç eklendikten sonra 180°C''de 25-30 dakika daha pişiyor.

      '
  - q: Kişin altı neden hamur kalır?
    a: 'Taban ön pişirilmeden doldurulunca sıvı iç hamura geçer. 12 dakikalık ön pişirme ve suyunu çekmiş sebzeler bunu önler.

      '
  - q: Kiş kremasız yapılır mı?
    a: 'Yapılır. Krema yerine bir su bardağı süte 2 yemek kaşığı tereyağı karıştırarak kullanabilirsin; iç biraz daha hafif olur.

      '
  - q: Kiş dondurulur mu?
    a: 'Pişmiş kiş dilimler hâlinde dondurulabilir. Çözdükten sonra fırında ısıtırsan hamur yeniden gevrekleşir.

      '
lahana-sarmasi:
  aramaBasligi: 'Etli lahana sarması tarifi: Kıymalı pirinçli, 6 kişilik'
  intro: 'Etli lahana sarması, haşlanmış beyaz lahana yapraklarına kıymalı ve pirinçli bir harcın sarılıp salçalı suda pişirildiği bir kış yemeği. Yanına yoğurt ve kızarmış mısır ekmeği çok yakışıyor.


    Bu tarifte lahananın sapı derince oyulup bütün olarak kaynar tuzlu suya atılıyor ve yumuşayan yapraklar tek tek ayrılıyor. Harç dana kıyma, pirinç, rendelenmiş soğan, salçaların yarısı, kuru nane, pul biber ve yağla yoğruluyor. Sarmalar tencereye sıkıca dizilip kalan salça, sıcak su ve limon suyuyla, üzerine ters tabak kapatılarak kısık ateşte 45-50 dakika pişiyor.


    Hazırlık 50, pişirme 50 dakika; toplam 100 dakikada 6 kişilik bir tencere çıkıyor. En çok zaman alan kısım sarma; bunun için yaklaşık yarım saat ayır.

    '
  editorNote: 'Salçaların yarısını harca, yarısını pişirme suyuna ayırdık; böylece hem içteki pirinç hem dıştaki yaprak salçanın tadını alıyor, tencerenin dibindeki su da sos gibi koyulaşıyor.

    '
  notes:
  - t: Yaprakları yumuşatmak
    d: 'Lahana sapı derince oyulursa kaynar suda yapraklar dipten gevşer ve tek tek ayrılması kolaylaşır. Dış yapraklar yumuşadıkça maşayla çıkar, iç kısmı suya geri bırak. Yaprakların kalın orta damarını bıçağı yatırarak incelt; aksi hâlde yaprak sarılırken kırılır ve pişerken açılır. Haşlamayla uğraşmak istemiyorsan lahanayı bir gece dondurucuda bekletip çözdürebilirsin; donup çözülen yapraklar haşlanmadan da yumuşar ve kolay sarılır. Yırtılan yaprakları atma; tencerenin dibine sermek için ayır.

      '
  - t: Sıkı sarmak ve dizmek
    d: 'Her yaprağa bir parmak kadar harç koy. Pirinç pişerken şiştiği için fazla harç koymak sarmanın patlamasına neden olur. Önce alt kenarı harcın üzerine kapat, sonra yanları içe katla ve sıkıca yuvarla. Tencerenin dibine artan ya da yırtılmış yaprakları sermek sarmaların dibe tutmasını önler. Sarmaları aralarında boşluk kalmayacak şekilde sık dizmek ve üzerine ters bir tabak kapatmak, pişerken kaymalarını ve açılmalarını engeller.

      '
  - t: Pişirme ve servis
    d: 'Sarmalar kısık ateşte, pirinç pişene kadar 45-50 dakika pişer. Suyun hızlı kaynaması sarmaları birbirine çarptırıp açabilir, bu yüzden kaynama başladıktan sonra ateşi kıs. Pişme kontrolü için bir sarmayı ortadan kesip pirincin yumuşadığından emin ol. Ocaktan aldıktan sonra kapağı kapalı biraz dinlendirmek kalan suyun sarmalara çekilmesini sağlar. Kıyma yerine kuzu kıyma da kullanabilirsin; etsiz bir versiyon için haşlanmış yeşil mercimek ya da ince doğranmış mantar olur.

      '
  faq:
  - q: Lahana sarması kaç dakika pişer?
    a: 'Sarmalar kısık ateşte, pirinç pişene kadar 45-50 dakika pişer. Lahananın haşlanması ayrıca yaklaşık 15 dakika sürer.

      '
  - q: Lahana yaprağı nasıl yumuşar?
    a: 'Sapını derince oyup lahanayı bütün olarak kaynar tuzlu suya at, yumuşayan yaprakları tek tek ayır. Bir gece dondurucuda bekletip çözdürmek de yaprakları haşlamadan yumuşatır.

      '
  - q: Lahana sarması pişerken neden açılır?
    a: 'Gevşek sarılan ya da tencereye seyrek dizilen sarmalar açılır. Sıkı sar, sık diz ve üzerine ters bir tabak kapat.

      '
  - q: Lahana sarmasında biber salçası yerine ne kullanılır?
    a: 'Biber salçası yerine domates salçası ve bir tatlı kaşığı pul biber kullanabilirsin.

      '
etli-kabak-dolmasi:
  aramaBasligi: 'Etli kabak dolması tarifi: Kıymalı, yoğurtla 80 dakikada'
  intro: 'Etli kabak dolması, oyulan dolmalık kabakların kıymalı ve pirinçli bir harçla doldurulup salçalı suda pişirildiği, yaz sofralarının sevilen ana yemeklerinden biri. Sarımsaklı yoğurtla sıcak servis ediliyor.


    Bu tarifte 8 dolmalık kabak oyacakla ince bir duvar kalacak şekilde oyuluyor. Harç dana kıyma, pirinç, rendelenmiş soğan ve domates, maydanoz, dereotu ve kuru naneyle hazırlanıyor. Kabaklar pirinç şişeceği için dörtte üçüne kadar dolduruluyor, tencereye dik diziliyor ve üzerine ters tabak kapatılarak kısık ateşte 45 dakika pişiriliyor.


    Hazırlık 35, pişirme 45 dakika; toplam 80 dakikada 4 kişilik dolma hazır. Oyduğun kabak içini mücver ya da kabak sote için ayırabilirsin.

    '
  editorNote: 'Doldurma ölçüsünü dörtte üç olarak açıkça yazdık; pirinç pişerken hacmini artırdığı için ağzına kadar doldurulan kabaklarda harç taşıyor ve kabak çatlayabiliyor.

    '
  notes:
  - t: Kabağı oymak
    d: 'Kabak duvarı çok kalın kalırsa harç ile kabak aynı anda pişmez; çok ince oyarsan da kabak pişerken yırtılır. Oyacağı sap tarafından sokup döndürerek ilerle ve dibe yaklaşınca yavaşla, tabanı delmemeye dikkat et. Her yerde eşit, ince bir duvar bırakmak dengeli sonuç verir. Oyulan iç kısmı çöpe atma; suyunu sıkıp mücvere ya da kabak soteye ekleyebilirsin. Dolmalık kabaklar kısa ve tombul olduğu için oyması normal kabağa göre daha kolaydır.

      '
  - t: Harcın dengesi
    d: 'Harçtaki pirinç, kabaktan çıkan suyu ve salçalı suyu çekerek pişer. Pirinci yıkamak fazla nişastasını alır ve harcın lapa olmasını önler. Rendelenmiş soğan ve domates harca nem verir; bu yüzden harca ayrıca su eklemeye gerek yok. Maydanoz, dereotu ve kuru nane dolmaya ferah bir tat katar; dereotu yoksa maydanoz ve biraz taze nane kullanabilirsin. Dana kıyma yerine kuzu kıyma da olur; etsiz bir harç için haşlanmış yeşil mercimek ya da ince doğranmış mantar kullanılabilir.

      '
  - t: Pişirme ve servis
    d: 'Kabakları tencereye dik ve birbirine yaslanacak şekilde dizmek devrilmelerini önler. Kalan salçayı sıcak suda açıp kabakların arasına dök, üzerlerine ters bir tabak kapat ve kapağı kapalı, kısık ateşte 45 dakika pişir. Ters tabak dolmaların yerinde kalmasını ve harcın dışarı taşmamasını sağlar. Pişme sonunda bir dolmayı kontrol et; pirinç tam yumuşamadıysa biraz sıcak su ekleyip birkaç dakika daha pişir. Sarımsaklı yoğurdu ayrı bir kapta servis et.

      '
  faq:
  - q: Etli kabak dolması kaç dakika pişer?
    a: 'Kapağı kapalı, kısık ateşte 45 dakika pişer. Hazırlıkla birlikte toplam süre 80 dakika.

      '
  - q: Kabak dolması pişerken neden dağılır?
    a: 'Kabaklar fazla doldurulunca ya da tencerede seyrek durunca dağılır. Dörtte üçüne kadar doldur, dik diz ve üzerine ters tabak kapat.

      '
  - q: Kabak dolmasından çıkan iç ne yapılır?
    a: 'Oyulan kabak içini mücver ya da kabak sote yapımında kullanabilirsin.

      '
  - q: Kabak dolmasında kıyma yerine ne kullanılır?
    a: 'Dana ve kuzu kıyma birbirinin yerine geçer. Etsiz istersen haşlanmış yeşil mercimek ya da ince doğranmış mantar kullanabilirsin.

      '
zeytinyagli-lahana-dolmasi:
  aramaBasligi: 'Zeytinyağlı lahana sarması tarifi: Kuş üzümlü, fıstıklı'
  intro: 'Zeytinyağlı lahana sarması, haşlanmış beyaz lahana yapraklarına baharatlı iç pilavın sarıldığı ve soğuk servis edilen bir zeytinyağlı. Yaprak sarmanın kışlık karşılığı sayılıyor; meze tabaklarında ve misafir sofralarında sıkça yer alıyor.


    İç pilav, zeytinyağında kavrulan çam fıstığı ve soğanla başlıyor. Baldo pirinç çevrildikten sonra kuş üzümü, tarçın, yenibahar, tuz, şeker ve yarım su bardağı suyla 15 dakikada suyunu çekiyor; dereotu ve nane en sonda ekleniyor. Sarmalar limon dilimleri ve sıcak suyla kısık ateşte 45 dakika pişiriliyor ve tencerede soğutuluyor.


    Hazırlık 50, pişirme 45 dakika; toplam 95 dakikada 6 kişilik bir tabak çıkıyor. Bir gece buzdolabında bekledikten sonra tadı daha da oturuyor.

    '
  editorNote: 'İç pilavı sarmadan önce suyunu çektirecek şekilde yazdık; pirinç tencereye yarı pişmiş girince sarmaların içi daha eşit pişiyor ve yaprak pirinçten önce dağılmıyor.

    '
  notes:
  - t: İç pilavın tadı
    d: 'İç pilavın karakteri tarçın, yenibahar ve kuş üzümünün dengesinden gelir. Çam fıstığını zeytinyağında hafif renk alana kadar kavurmak tadını belirginleştirir, ancak çok çabuk yandığı için başından ayrılma. Bir tatlı kaşığı şeker tatlılık için değil, baharatları ve limonun ekşiliğini dengelemek için var. Yenibahar yoksa bir tutam tarçın ve bir tutam karanfil kullanabilirsin. Kuş üzümü yerine kıyılmış kuru üzüm ya da kuru kızılcık, çam fıstığı yerine iri kıyılmış badem ya da kaju da olur.

      '
  - t: Yaprak ve sarma
    d: 'Lahananın sapını oyup kaynar suda yaprakları yumuşadıkça tek tek ayır; haşlama yaklaşık 15 dakika sürer. Kalın damarları bıçakla incelt, aksi hâlde yaprak sarılırken kırılır. Zeytinyağlı sarmalar soğuk yendiği için incelikleri önemlidir; harcı az koyup sıkı sararsan daha zarif ve düzgün görünürler. Sarmaları tencereye aralarında boşluk bırakmadan dizmek pişerken açılmalarını önler. Üzerine kapatılan tabak da sarmaları yerinde tutar. Yırtılan ya da küçük kalan yaprakları tencerenin dibine sermek de sarmaların dibe tutmasını önler.

      '
  - t: Soğutma ve servis
    d: 'Zeytinyağlılar sıcakken değil, oda sıcaklığında ya da soğuk servis edilir. Pişen sarmaları tencereden çıkarmadan kendi suyunda soğutmak hem şekillerini korur hem de kalan suyu çekip yumuşamalarını sağlar. Soğuduktan sonra kapalı bir kapta buzdolabına kaldır; bir gece bekleyen sarmaların tadı daha da oturur. Servis ederken üzerine biraz zeytinyağı gezdirip limon dilimleriyle sunabilirsin. Baldo yerine osmancık pirinç kullanırsan iç pilavın suyunu bir parmak azalt.

      '
  faq:
  - q: Zeytinyağlı lahana sarması kaç dakika pişer?
    a: 'Sarmalar kısık ateşte 45 dakika pişer, ardından tencerede soğutulur.

      '
  - q: Zeytinyağlı lahana sarması sıcak mı yenir?
    a: 'Soğuk ya da oda sıcaklığında yenir. Bir gece buzdolabında bekletirsen daha lezzetli olur.

      '
  - q: Lahana sarmasında çam fıstığı yerine ne kullanılır?
    a: 'İri kıyılmış badem ya da kaju kullanabilirsin.

      '
  - q: Zeytinyağlı lahana sarması pişerken neden açılır?
    a: 'Gevşek sarılan ya da tencereye seyrek dizilen sarmalar pişerken açılır. Sıkı sar, aralarında boşluk bırakmadan diz ve üzerine tabak kapat.

      '
saray-sarmasi:
  aramaBasligi: 'Saray sarması tarifi: Cevizli, baklavalık yufkayla'
  intro: 'Saray sarması, baklavalık yufkaların cevizle rulo yapılıp büzüldükten sonra dilimlenerek fırınlandığı ve şerbetlendiği bir baklava çeşidi. Dilimlerin üzerindeki kırışık desen, sarma sırasında yufkanın oklava üzerinde büzülmesinden geliyor.


    Bu tarifte önce şeker, su ve limonla şerbet 15 dakika kaynatılıp soğumaya bırakılıyor. Üç yufka arasına eritilmiş tereyağı sürülerek üst üste konuyor, uzun kenara ceviz serpiliyor ve ince bir oklavayla rulo sarılıp iki uçtan büzülüyor. Rulolar 3 cm''lik dilimlere kesilip tepsiye dik diziliyor ve 170°C''de altın rengi olana kadar 40-45 dakika pişiyor. Sıcak tatlıya soğuk şerbet dökülüyor.


    Hazırlık 40, pişirme 45 dakika; toplam 85 dakikada 10 kişilik bir tepsi hazır. Şerbetin en az 3-4 saat çekmesini bekle.

    '
  editorNote: 'Şerbeti ilk adım olarak yazdık; şerbetin tatlı fırından çıkana kadar tamamen soğuması gerekiyor ve en sona bırakılırsa sıcak tatlıya sıcak şerbet dökülüp yufka hamurlaşıyor.

    '
  notes:
  - t: Sıcak tatlı, soğuk şerbet
    d: 'Şerbetli tatlılarda temel kural, tatlı ile şerbetin farklı sıcaklıkta olmasıdır. Fırından yeni çıkmış sıcak dilimlere soğumuş şerbet dökersen yufka şerbeti yavaş yavaş çeker ve katlar çıtır kalır. İkisi de sıcak olursa yufka hemen yumuşar ve dağılır. Şerbeti dökerken her dilimin üzerine eşit gelmesine dikkat et. Tatlıyı şerbeti çektikten sonra, en az 3-4 saat bekletip servis et; ertesi gün tadı daha da oturur.

      '
  - t: Büzerek sarmak
    d: 'Saray sarmasının tanınan kırışık deseni büzme aşamasından gelir. Üç kat yufkayı tereyağıyla yağlayıp uzun kenara ceviz serptikten sonra ince bir oklavaya sıkıca sar. Ardından oklavayı çekmeden ruloyu iki uçtan ortaya doğru bastırarak büz ve oklavayı yavaşça çıkar. Sıradaki yufkaları nemli bir bezle örtmek kuruyup kırılmalarını önler. Ruloyu 3 cm''lik dilimlere keserken bıçağı bastırmadan, ileri geri hareketle kesmek dilimlerin ezilmesini engeller.

      '
  - t: Tereyağı ve renk
    d: 'Yufka katlarının çıtır ve altın rengi olması tereyağına bağlıdır. Tereyağını eritip yalnızca üstteki sarı yağını alır, dipteki beyaz tortuyu bırakırsan tatlı daha parlak bir renk alır ve fırında daha geç yanar. Kalan tereyağını dilimlerin üzerine gezdirmeyi unutma; kuru kalan yufka beyaz ve sert kalır. 170°C''de 40-45 dakika, katların içine kadar eşit pişmesini sağlar. Ceviz yerine fındık ya da badem, süs için antep fıstığı yerine ceviz kullanabilirsin.

      '
  faq:
  - q: Saray sarması kaç dakika pişer?
    a: '170°C fırında altın rengi olana kadar 40-45 dakika pişer.

      '
  - q: Saray sarmasına şerbet sıcak mı soğuk mu dökülür?
    a: 'Sıcak tatlıya soğuk şerbet dökülür. Bu yüzden şerbeti en başta kaynatıp soğumaya bırakmak gerekiyor.

      '
  - q: Saray sarması kaç saat şerbet çeker?
    a: 'En az 3-4 saat beklemesi gerekir. Ertesi gün daha lezzetli olur.

      '
  - q: Saray sarmasında ceviz yerine ne kullanılır?
    a: 'Ceviz yerine fındık ya da badem kullanabilirsin.

      '
coban-kavurma:
  aramaBasligi: 'Çoban kavurma tarifi: Tavada biberli, 40 dakikada'
  intro: 'Çoban kavurma, kuşbaşı etin yüksek ateşte kavrulup soğan, biber ve domatesle kısa süre pişirildiği bir tava yemeği. Etin kızarmış yüzeyi ile sebzelerin diriliği arasındaki denge bu yemeğin karakterini oluşturuyor.


    Bu tarifte uzun pişirme gerektirmeyen dana bonfile ya da kontrfile kullanılıyor. Et iyice ısıtılmış geniş tavada, zeytinyağında iki parti hâlinde yaklaşık 10 dakika kavruluyor. Ardından tereyağı eklenip yarım ay doğranmış soğan ve biberler 3-4 dakika soldurulup küp domatesler 3 dakika pişiriliyor. Tuz, karabiber ve kekik en sonda giriyor.


    Hazırlık 15, pişirme 25 dakika; toplam 40 dakikada 4 kişilik bir tava hazır. Pilav ya da lavaşla servis edebilirsin.

    '
  editorNote: 'Eti iki parti hâlinde kavurmayı açıkça yazdık; 500 gram et tek seferde tavaya girince tavanın ısısı düşüyor, et kızarmak yerine suyunu salıp haşlanıyor.

    '
  notes:
  - t: Doğru et seçimi
    d: 'Çoban kavurma kısa sürede pişen bir yemek olduğu için etin kendiliğinden yumuşak olması gerekir. Bonfile ve kontrfile yüksek ateşte birkaç dakikada pişer ve sert kalmaz. Haşlamalık ya da sinirli bir kuşbaşı kullanırsan bu süre yetmez ve et lastik gibi olur; bu tür etler güveç gibi uzun pişen yemeklere daha uygundur. Dana eti yerine kuzu eti de kullanılabilir. Tavuk but tercih edersen pişirme süresini yarıya indir.

      '
  - t: Tavayı kızdırmak
    d: 'Etin dışının kızarması için tava çok sıcak olmalı. Tavayı iyice ısıt, zeytinyağını ekle ve eti tek kat olacak şekilde yay; ilk birkaç dakika fazla karıştırma. Et önce su salar; ateşi kısmadan bu suyun buharlaşmasını bekle, ardından et kızarmaya başlar. İkinci partiye geçmeden tavanın yeniden ısınmasını bekle. Tuzu başta değil en sonda eklemek de etin suyunu salmasını azaltır ve kızarmasını kolaylaştırır.

      '
  - t: Domatesin zamanlaması
    d: 'Domates en son eklenir ve yalnızca 3 dakika pişer. Amaç domatesin ısınıp hafif yumuşaması, ama dağılmamasıdır. Domates uzun süre pişerse suyunu salar ve kavurma sulu bir yemeğe döner. Domatesleri iri küp doğramak dağılmalarını geciktirir. Kışın taze domatesin tadı zayıfsa konserve küp domates kullanabilirsin; bu durumda suyunu süzerek eklemek fazla sıvının tavaya geçmesini önler. Kapya biber yerine kırmızı dolmalık biber de olur.

      '
  faq:
  - q: Çoban kavurma kaç dakika pişer?
    a: 'Et yaklaşık 10 dakika kavrulur, sebzeler ve domatesle birlikte 6-7 dakika daha pişer. Hazırlıkla birlikte toplam süre 40 dakika.

      '
  - q: Çoban kavurma için hangi et kullanılır?
    a: 'Dana bonfile ya da kontrfile en uygunu; uzun pişirmeye gerek bırakmaz. Kuzu eti de kullanılabilir.

      '
  - q: Çoban kavurmada et neden sert olur?
    a: 'Uzun pişmesi gereken bir et seçildiyse ya da tava kalabalık olup et haşlandıysa sertleşir. Yumuşak bir parça seç ve eti iki partide kavur.

      '
  - q: Çoban kavurma tavukla yapılır mı?
    a: 'Yapılır. Tavuk but kullan ve pişirme süresini yarıya indir.

      '
et-sote:
  aramaBasligi: 'Et sote tarifi: Biberli, tavada 25 dakikada'
  intro: 'Et sote, şerit doğranmış etin kızgın tavada hızla mühürlenip biber, soğan ve domatesle birleştirildiği pratik bir ana yemek. Yüksek ateşte kısa süre piştiği için etin içi sulu, sebzeler diri kalıyor.


    Bu tarifte 500 gram dana bonfile ya da antrikot kullanılıyor. Et zeytinyağında az az, yüksek ateşte 2-3 dakika sotelenip kenara alınıyor. Aynı tavada tereyağında soğan, kapya ve sivri biberler 4 dakika çevriliyor, ardından et, doğranmış domates ve baharatlar eklenip 3 dakika daha pişiriliyor. Tuz en sonda giriyor.


    Hazırlık 10, pişirme 15 dakika; toplam 25 dakikada 3 kişilik bir tava çıkıyor. Pilav, bulgur ya da püreyle servis edebilirsin.

    '
  editorNote: 'Eti önce sotelenip kenara alınacak şekilde yazdık; et sebzelerle birlikte baştan pişerse sebzeler yumuşayana kadar et fazla pişip sertleşiyor, ayrı mühürlenince ikisi de doğru noktada kalıyor.

    '
  notes:
  - t: Tuzu sona bırakmak
    d: 'Tuz etin yüzeyindeki suyu dışarı çeker. Eti tuzlu olarak tavaya atarsan et kısa sürede suyunu salar, tavada kızarmak yerine haşlanır ve sertleşir. Bu tarifte tuz, et ve sebzeler birleştikten sonra en sonda ekleniyor. Eti mühürlemeden önce kâğıt havluyla kurulamak da kızarmayı hızlandırır. Kekik gibi kuru otları da son aşamada eklemek, kokularının yüksek ateşte yanıp acılaşmasını önler. Tuzu ekledikten sonra yemeği uzun süre ocakta tutmadan hemen servis etmek en iyi sonucu verir.

      '
  - t: Az az mühürlemek
    d: 'Kızgın tava eti dışarıdan hızla kızartır ve içini sulu bırakır. Ancak tavaya bir anda çok et koyarsan tavanın ısısı düşer ve et suyunu salmaya başlar. Bu yüzden 500 gram eti tavanın büyüklüğüne göre birkaç partide, tek kat olacak şekilde sotele. Her parti 2-3 dakika sürer; et dışı renk alır almaz kenara al. İçinin hafif pembe kalması sorun değil, çünkü son aşamada sebzelerle birlikte 3 dakika daha pişecek.

      '
  - t: Et seçimi ve alternatifler
    d: 'Et sote kısa sürede pişen bir yemek olduğu için bonfile, antrikot ya da kontrfile gibi yumuşak parçalar gerekir. Eti liflerine dik olarak şerit doğramak çiğnemeyi kolaylaştırır. Dana eti yerine kuzu eti de kullanılabilir; tavuk but tercih edersen pişirme sürelerini yarıya indir. Kapya biber yerine kırmızı dolmalık biber ya da kavanozda közlenmiş biber olur. Kışın taze domates yerine konserve küp domates kullanabilirsin.

      '
  faq:
  - q: Et sote kaç dakikada pişer?
    a: 'Et 2-3 dakika mühürlenir, sebzeler 4 dakika sotelenir ve hepsi birlikte 3 dakika daha pişer. Hazırlıkla birlikte toplam 25 dakika.

      '
  - q: Et sote nasıl yumuşak olur?
    a: 'Bonfile ya da antrikot gibi yumuşak bir parça seç, kızgın tavada az az mühürle ve tuzu en sona bırak.

      '
  - q: Et sote için hangi et alınır?
    a: 'Dana bonfile, antrikot ya da kontrfile uygundur.

      '
  - q: Et sote tavukla yapılır mı?
    a: 'Yapılır. Tavuk but kullan ve pişirme süresini yarıya indir.

      '
tavuk-guvec:
  aramaBasligi: 'Tavuk güveç tarifi: Fırında mantarlı ve kaşarlı'
  intro: 'Tavuk güveç, kuşbaşı tavuğun sebzelerle birlikte güveçte ya da fırın kabında pişirildiği, üzerine kaşar eritilen bir fırın yemeği. Malzemeler bir kapta karıştırılıp fırına verildiği için hazırlığı kısa.


    Bu tarifte göğüs eti yerine kemiksiz tavuk but kullanılıyor; but fırında daha sulu kalıyor. 500 gram tavuk; soğan, sivri ve kapya biber, mantar, domates, biber salçası, zeytinyağı ve baharatlarla karıştırılıyor, yarım su bardağı sıcak suyla 200°C fırında 40 dakika pişiyor. Ardından üzerine kaşar serpilip kaşar kızarana kadar 10 dakika daha fırında kalıyor.


    Hazırlık 20, pişirme 50 dakika; toplam 70 dakikada 4 kişilik güveç hazır. Küçük güveç kaplarında porsiyonluk da pişirebilirsin.

    '
  editorNote: 'Kaşarı en baştan değil son 10 dakikada eklenecek şekilde ayrı adım olarak yazdık; 50 dakika fırında kalan kaşar yanıp kuruyor, sonradan eklenince eriyip kızarıyor.

    '
  notes:
  - t: Neden tavuk but
    d: 'Tavuk göğsü yağsız olduğu için fırında uzun süre kalınca kuruyup lifli bir hâl alabilir. Kemiksiz but ise daha fazla yağ ve bağ dokusu içerdiğinden aynı sürede sulu ve yumuşak kalır. Güveçte tavuk, sebzelerden çıkan su ve salçayla birlikte pişer; butun yağı bu suyla birleşip lezzetli bir sos oluşturur. Göğüs kullanmak istersen parçaları iri doğra ve pişme durumunu kontrol ederek süreyi kısalt.

      '
  - t: Sebzeleri doğramak
    d: 'Sebzeleri küp doğramak ve mantarları dörde bölmek, fırında eşit pişmelerini ve fazla küçülmemelerini sağlar. Domatesler pişerken suyunu salar ve yarım su bardağı sıcak suyla birlikte güvecin sosunu oluşturur. Bu yüzden suyu artırmana gerek yok; fazla su yemeği haşlanmış gibi yapar. Mantar yerine istiridye ya da kestane mantarı, kapya biber yerine kırmızı dolmalık biber kullanabilirsin. Biber salçan yoksa domates salçası ve bir tatlı kaşığı pul biber olur.

      '
  - t: Güveç ve fırın kabı
    d: 'Toprak güveç ısıyı yavaş ve eşit dağıtır, ancak ani ısı değişiminde çatlayabilir. Toprak güveç kullanıyorsan soğuk fırına koyup fırınla birlikte ısıtmak daha güvenlidir; bu durumda fırının ısınma süresi pişirmeye eklenir, tavuğun pişip pişmediğini kontrol et. Cam ya da seramik bir fırın kabıyla da aynı tarifi yapabilirsin. Küçük porsiyonluk güveç kaplarında pişirip her kişiye ayrı servis etmek sofrada şık durur. Kaşar yerine mozzarella ya da tost peyniri de olur.

      '
  faq:
  - q: Tavuk güveç fırında kaç dakika pişer?
    a: '200°C fırında 40 dakika pişer, kaşar eklendikten sonra 10 dakika daha fırında kalır.

      '
  - q: Tavuk güveç için göğüs mü but mu kullanılır?
    a: 'Kemiksiz but daha uygun; göğüs etine göre çok daha sulu kalır.

      '
  - q: Tavuk güveçte kaşar yerine ne kullanılır?
    a: 'Mozzarella ya da tost peyniri gibi eriyen herhangi bir peynir kullanabilirsin.

      '
  - q: Tavuk güveç güveç kabı olmadan yapılır mı?
    a: 'Yapılır. Karışımı herhangi bir fırın kabında aynı sıcaklıkta pişirebilirsin.

      '
et-guvec:
  aramaBasligi: 'Et güveç tarifi: Fırında sebzeli, toprak güveçte 2 saat'
  intro: 'Et güveç, kuşbaşı etin sebzelerle birlikte toprak güveçte, fırında uzun süre pişirildiği sulu bir yemek. Fırında yavaş pişen et yumuşarken patlıcan, kabak, domates ve biberin suyu güvecin içinde koyu bir sosa dönüşüyor.


    Bu tarifte 500 gram dana kuşbaşı; iri küp doğranmış patlıcan, kabak, domates, sivri biber, soğan ve bütün sarımsak dişleriyle salça, zeytinyağı ve baharatlarla karıştırılıyor. Güvece alınan karışıma bir su bardağı sıcak su ekleniyor, kapak kapatılıyor ve güveç soğuk fırına konup 180°C''ye ayarlanıyor. Et yumuşayana kadar yaklaşık 2 saat pişiyor; son 15 dakika kapak açılıp üzeri kızartılıyor.


    Hazırlık 20, pişirme 120 dakika; toplam 2 saat 20 dakikada 4 kişilik güveç hazır. Fırın çalışırken başka işlerine bakabilirsin.

    '
  editorNote: 'Güvecin soğuk fırına konmasını ayrıca vurguladık; toprak güveç önceden ısıtılmış fırına girince ani ısı farkından çatlayabiliyor.

    '
  notes:
  - t: Soğuk fırın kuralı
    d: 'Toprak güveç ısıyı yavaş alır ve yavaş verir. Önceden ısıtılmış fırına soğuk bir güveç koymak ya da sıcak güveci soğuk bir zemine bırakmak ani ısı farkı yaratır ve kabın çatlamasına neden olabilir. Bu yüzden güveç soğuk fırına yerleştirilip fırınla birlikte ısıtılır. Fırından çıkan güveci de mermer tezgâh yerine tahta bir nihale ya da katlanmış bir bezin üzerine koy. Toprak güvecin yoksa kapaklı bir fırın kabı ya da folyoyla örtülmüş bir kap da olur.

      '
  - t: Uzun pişirmenin nedeni
    d: 'Kuşbaşı doğranan dana eti genellikle bağ dokusu içeren bölgelerden gelir. Bu doku kısa sürede pişirilince sert kalır, kapalı kapta uzun süre pişince ise yumuşar. Bu tarifte 180°C''de yaklaşık 2 saat, etin çatalla kolayca ayrılacak kıvama gelmesi için gereken süre. Pişirmenin sonuna doğru bir parçayı kontrol et; hâlâ sertse kapağı kapatıp biraz daha pişir. Kapağı son 15 dakika açmak sosun koyulaşmasını ve üstün kızarmasını sağlar.

      '
  - t: Sebzeler ve ertesi gün
    d: 'Sebzeleri iri küp doğramak, uzun pişirmede tamamen dağılmalarını önler; patlıcan ve kabak yumuşar ama şeklini büyük ölçüde korur. Sarımsakları bütün bırakmak, pişerken yumuşayıp tatlanmalarını sağlar. Dana eti yerine kuzu eti kullanabilirsin; tavuk but tercih edersen süreyi yarıya indir. Güveç bir gün sonra ısıtıldığında tatlar birbirine daha çok geçer ve daha lezzetli olur. Kışın taze domates yerine konserve küp domates kullanabilirsin.

      '
  faq:
  - q: Et güveç fırında kaç saat pişer?
    a: '180°C''de, et yumuşayana kadar yaklaşık 2 saat pişer. Son 15 dakika kapağını açıp üzerini kızart.

      '
  - q: Toprak güveç fırına nasıl konur?
    a: 'Güveci her zaman soğuk fırına koy ve fırını sonra 180°C''ye ayarla. Önceden ısıtılmış fırın güveci çatlatabilir.

      '
  - q: Et güveç tavukla yapılır mı?
    a: 'Yapılır. Tavuk but kullan ve pişirme süresini yarıya indir.

      '
  - q: Et güveç güveç kabı olmadan yapılır mı?
    a: 'Yapılır. Kapaklı bir fırın kabında ya da üzerini folyoyla örttüğün bir kapta pişirebilirsin.

      '
firinda-tavuk-but:
  aramaBasligi: 'Fırında tavuk but tarifi: Yoğurtlu marine, 200°C''de'
  intro: 'Fırında tavuk but, yoğurt, biber salçası ve baharatlarla marine edilen butların fırında derisi kızarana kadar pişirildiği pratik bir ana yemek. Yoğurt eti yumuşatıyor, salça ve toz kırmızı biber rengi veriyor.


    Bu tarifte 8 tavuk baget ya da 4 bütün but kullanılıyor. Butların derisi çatalla delinip yoğurt, salça, zeytinyağı, ezilmiş sarımsak, kimyon ve kekikli sosla ovuluyor ve en az 30 dakika buzdolabında bekletiliyor. Ardından pişirme kâğıdı serili tepsiye aralıklı dizilip 200°C fırında, yarısında bir kez çevrilerek 45-50 dakika pişiriliyor.


    Hazırlık 10, pişirme 50 dakika; toplam 1 saatte 4 kişilik tepsi hazır, buna marinasyon için en az 30 dakika ekle. Airfryer''da da pişirebilirsin.

    '
  editorNote: 'Butların derisini çatalla delmeyi marinasyon adımına ekledik; delinmeyen deri sosun ete geçmesini engelliyor ve yoğurtlu sos yalnızca yüzeyde kalıyor.

    '
  notes:
  - t: Yoğurtlu marinasyon
    d: 'Yoğurdun hafif asitli yapısı tavuğun yüzeyini yavaşça gevşeterek eti yumuşatır. Tarifte en az 30 dakika beklemek yeterli, ama butları bir gece önceden marine edersen etki çok daha belirgin olur. Marinasyonu mutlaka buzdolabında yap. Yoğurt yerine kefir ya da ayran da kullanılabilir. Sosun fazlası tepsiye akarsa fırında yanabilir, bu yüzden butları tepsiye dizerken üzerlerindeki fazla sosu hafifçe sıyırmak iyi olur. Pişirme kâğıdı da yanan sosun tepsiye yapışmasını önler.

      '
  - t: Kızarmış deri ve pişme kontrolü
    d: 'Butları tepside aralıklı dizmek, aralarında sıcak havanın dolaşmasını sağlar. Birbirine değen butlar buharda pişer ve derileri yumuşak kalır. Yarısında bir kez çevirmek iki tarafın da eşit renk almasını sağlar. Butun içinin pişip pişmediğini kemiğe yakın bir yerden keserek kontrol et; suyu berrak akıyorsa ve et pembe değilse hazırdır. Bütün butlar bagetlerden daha iri olduğu için sürenin üst sınırına, yani 50 dakikaya yakın pişmeleri gerekebilir.

      '
  - t: Tek tepside akşam yemeği ve airfryer
    d: 'Tepsiye iri doğranmış patates ve soğan eklersen butlardan akan yağ ve sosla birlikte pişerler ve ayrı bir garnitüre gerek kalmaz. Patatesleri butlarla aynı sürede pişecek büyüklükte doğra. Airfryer kullanacaksan marine edilmiş butları derisi yukarı gelecek şekilde diz, 190°C''de 22-25 dakika pişir; yarısında çevir ve son 3 dakika derili taraf üste gelsin. Biber salçan yoksa domates salçası ve bir tatlı kaşığı pul biber kullanabilirsin.

      '
  faq:
  - q: Fırında tavuk but kaç dakikada pişer?
    a: '200°C fırında, yarısında bir kez çevirerek 45-50 dakika pişer. Marinasyon için ayrıca en az 30 dakika gerekir.

      '
  - q: Tavuk but airfryer'da kaç dakika pişer?
    a: '190°C''de 22-25 dakika pişer. Yarısında çevir, son 3 dakika derili taraf üste gelsin.

      '
  - q: Fırında tavuk but nasıl yumuşak olur?
    a: 'Yoğurtlu sosla en az 30 dakika, mümkünse bir gece buzdolabında marine et. Yoğurt eti yumuşatır.

      '
  - q: Tavuk but marinasyonunda yoğurt yerine ne kullanılır?
    a: 'Kefir ya da ayran kullanabilirsin.

      '
firinda-tavuk-kanat:
  aramaBasligi: 'Fırında tavuk kanat tarifi: Ballı acılı, 210°C''de çıtır'
  intro: 'Fırında tavuk kanat, ballı ve acılı bir sosla marine edilen kanatların fırında kızarıp çıtırlaşana kadar pişirildiği bir tarif. Kızartma yağı gerektirmediği için kalabalık sofralarda ve maç akşamlarında pratik bir atıştırmalık.


    Sos zeytinyağı, biber salçası, bal, ezilmiş sarımsak, tatlı toz biber, pul biber, kekik ve limon suyuyla hazırlanıyor. 1 kilo kanat bu sosla bulanıp en az 30 dakika bekletiliyor, ardından pişirme kâğıdı serili tepsiye aralıklı diziliyor. 210°C fırında önce 20 dakika pişiyor, çevrilip kızarıp çıtırlaşana kadar 20 dakika daha fırında kalıyor.


    Hazırlık 10, pişirme 40 dakika; toplam 50 dakikada 4 kişilik bir tepsi çıkıyor, marinasyon için ayrıca 30 dakika ayır. Airfryer''da da yapılabiliyor.

    '
  editorNote: 'Pişirmeyi 20 artı 20 dakika olarak iki aşamada yazdık; arada çevirmek kanatların iki yüzünün de çıtırlaşmasını sağlıyor ve ballı sosun karamelleşmesini kontrol etmek için doğal bir an yaratıyor.

    '
  notes:
  - t: Kurulamak ve aralık bırakmak
    d: 'Kanatların derisi kuruysa fırında daha hızlı ve daha çıtır kızarır. Kanatları yıkadıysan sosla bulamadan önce kâğıt havluyla iyice kurula; ıslak deri sosu da tutmaz. Tepsiye dizerken aralarında boşluk bırak; birbirine değen kanatlar buhar yapar ve derileri yumuşak kalır. Bir kilo kanat tek tepsiye rahat sığmıyorsa iki tepsi kullanmak daha iyi sonuç verir. Pişirme kâğıdı, ballı sosun tepsiye yapışıp yanmasını da önler.

      '
  - t: Ballı sosu yakmamak
    d: 'Bal ve salça şeker içerdiği için yüksek ısıda hızla karamelleşir. Karamelleşme kanatlara parlak bir renk ve hoş bir tat verir, ancak birkaç dakikalık gecikme acı bir yanık tadına dönüşebilir. Bu yüzden 210°C''deki pişirmenin son 10 dakikasında fırına göz kulak ol. Kanatlar istediğin renge ulaştıysa ama hâlâ pişmesi gerekiyorsa üzerlerini gevşekçe folyoyla örtebilirsin. Bal yerine üzüm pekmezi, akçaağaç ya da hurma şurubu kullanılabilir.

      '
  - t: Airfryer ve acılık ayarı
    d: 'Airfryer kullanacaksan kanatları sepete tek kat diz ve 200°C''de 18-20 dakika pişir; 10. dakikada çevir. Airfryer''da sosu son 2 dakikada sürmek, yoğun sıcak hava altında balın yanmasını önler. Acılığı azaltmak istersen pul biberi azaltıp tatlı toz biberi artırabilirsin; daha acı seviyorsan pul biberi artır. Limon suyu sosun tatlılığını dengeler, bu yüzden atlama. Biber salçan yoksa domates salçası ve bir tatlı kaşığı pul biber olur.

      '
  faq:
  - q: Fırında tavuk kanat kaç dakika pişer?
    a: '210°C fırında 20 dakika pişer, çevrildikten sonra 20 dakika daha pişer; toplam 40 dakika.

      '
  - q: Tavuk kanat fırında nasıl çıtır olur?
    a: 'Kanatları kâğıt havluyla kurula, tepsiye aralıklı diz ve yarısında çevir.

      '
  - q: Tavuk kanat airfryer'da kaç dakika pişer?
    a: '200°C''de 18-20 dakika pişer. 10. dakikada çevir ve sosu son 2 dakikada sür.

      '
  - q: Tavuk kanat sosunda bal yerine ne kullanılır?
    a: 'Üzüm pekmezi, akçaağaç ya da hurma şurubu kullanabilirsin.

      '
tavuk-pirzola:
  aramaBasligi: 'Tavuk pirzola tarifi: Yoğurtlu, döküm tavada 25 dakikada'
  intro: 'Izgara tavuk pirzola, kemiksiz tavuk butun yoğurtlu ve salçalı bir sosla marine edilip döküm tavada ya da ızgarada kızartıldığı hızlı bir ana yemek. Kemiksiz but, göğüs etine göre daha sulu kaldığı için pirzolada tercih ediliyor.


    Bu tarifte 600 gram tavuk pirzola yoğurt, zeytinyağı, biber salçası, sarımsak, toz kırmızı biber, karabiber ve kekikle ovuluyor. En az 15 dakika, mümkünse 2 saat buzdolabında bekledikten sonra iyice ısıtılmış tavada her yüzü 5-6 dakika pişiyor, ardından 3 dakika dinlendirilip dilimleniyor.


    Hazırlık 10, pişirme 15 dakika; toplam 25 dakikada 4 kişilik tabak hazır, marinasyon süresini de hesaba kat. Yanına bulgur pilavı ve közlenmiş biber yakışıyor.

    '
  editorNote: 'Dinlendirmeyi ayrı bir adım olarak yazdık; tavadan çıkan tavuk hemen kesilirse içindeki su tabağa akıyor, 3 dakika bekleyince et suyunu içinde tutuyor ve dilimler sulu kalıyor.

    '
  notes:
  - t: Tavayı iyice ısıtmak
    d: 'Tavuğun dışının koyu, ızgara izine benzer bir renk alması için döküm tava ya da ızgara çok sıcak olmalı. Tavayı önceden iyice ısıt, pirzolaları koyduktan sonra hemen oynatma; et tavadan kendiliğinden ayrılınca çevirme zamanı gelmiştir. Fazla sosu tavaya koymadan önce sıyırmak, salçalı ve yoğurtlu sosun yanıp acılaşmasını önler. Tavaya sığmayan pirzolaları iki partide pişirmek sıcaklığın düşmesini engeller. Kalabalık tavada tavuk kızarmak yerine suyunu salıp haşlanır.

      '
  - t: Pişme kontrolü
    d: 'Her yüzü 5-6 dakika, ortalama kalınlıktaki kemiksiz but için genellikle yeterlidir. Emin olmak için en kalın yerinden kesip bak: et tamamen beyazlaşmış ve suyu berrak akıyorsa hazırdır. Pembe kalan tavuk yenmemelidir. Pirzolalar eşit kalınlıkta değilse, pişirmeden önce streç film arasında hafifçe döverek düzleştirmek eşit pişmelerini sağlar. İnceltilen pirzolalar daha kısa sürede pişer, bu yüzden süreyi kontrol ederek kısalt. Kesip kontrol ettikten sonra yine de 3 dakikalık dinlendirmeyi atlama.

      '
  - t: Marinasyon ve airfryer
    d: 'En az 15 dakikalık marinasyon tat için yeterlidir, ancak 2 saat bekleyen tavuk belirgin şekilde daha yumuşak olur. Akşam yemeği planlıyorsan eve gelir gelmez tavukları marine edip buzdolabına kaldırmak işini kolaylaştırır. Airfryer kullanacaksan pirzolaları sepete tek kat diz, 200°C''de 12-14 dakika pişir ve 7. dakikada çevir. Yoğurt yerine süzme yoğurt kullanabilirsin; biber salçan yoksa domates salçası ve bir tatlı kaşığı pul biber olur.

      '
  faq:
  - q: Tavuk pirzola kaç dakikada pişer?
    a: 'Döküm tavada her yüzü 5-6 dakika pişer. Ardından 3 dakika dinlendirip dilimle.

      '
  - q: Tavuk pirzola nasıl yumuşak olur?
    a: 'Yoğurtlu sosla en az 15 dakika, mümkünse 2 saat marine et ve pişirdikten sonra 3 dakika dinlendir.

      '
  - q: Tavuk pirzola airfryer'da kaç dakika pişer?
    a: '200°C''de 12-14 dakika pişer; 7. dakikada çevir.

      '
  - q: Tavuk pirzola için göğüs mü but mu kullanılır?
    a: 'Bu tarifte kemiksiz but kullanılıyor; but göğüs etine göre daha sulu kalır.

      '
citir-tavuk:
  aramaBasligi: 'Çıtır tavuk tarifi: Mısır gevreğiyle, fırında ya da tavada'
  intro: 'Çıtır tavuk, şerit doğranmış tavuk göğsünün baharatlı bir kaplamayla kızartıldığı, fast food menülerinden tanıdığın bir atıştırmalık. Bu tarifte kaplamanın çıtırlığını galeta unu yerine ezilmiş şekersiz mısır gevreği sağlıyor; gevrek daha iri bir doku veriyor ve fırında pişirmeye de uygun.


    Tavuk önce yoğurt, tuz, toz kırmızı biber ve sarımsak tozuyla 15 dakika marine ediliyor. Ardından un, çırpılmış yumurta ve gevrekten oluşan üç kaplık hattan geçiyor. Pişirme için üç yol var: kızgın yağda her yüzü 3 dakika, yağlanmış tepside 200°C fırında 15 dakika ya da airfryer''da 200°C''de 12-15 dakika.


    4 kişilik tarif toplam 35 dakikada hazır. Ballı hardal ya da yoğurtlu bir sosla servis edebilirsin.

    '
  editorNote: 'Kaplamada galeta unu yerine mısır gevreği seçtik; fırında da airfryer''da da kızartmaya yakın bir çıtırlık veriyor. Pişirme adımına üç yöntemi birden yazdık, çünkü hafta içi akşamlarında herkes yağ kızdırmak istemiyor.

    '
  notes:
  - t: Yoğurtlu marinenin işi
    d: 'Yoğurdun hafif asitliği tavuk göğsünün liflerini yumuşatır; göğüs eti kızartmada çabuk kurur, bu yüzden 15 dakikalık bekleme boşa değil. Marineden çıkan tavuğu una bulamadan önce fazla yoğurdunu kabın kenarında sıyır. Üzerinde çok yoğurt kalırsa un topaklanır, kaplama kalınlaşır ve pişerken yer yer kabarıp tavuktan ayrılır. Daha uzun marine etmek istersen kabı buzdolabında tut; baharat oranını değiştirmene gerek yok. Yoğurt yerine kefir ya da ayran da aynı işi görür, ama kıvamı daha akışkan olduğu için tavuğu una bulamadan önce iyice süzdür.

      '
  - t: Kaplamanın dağılmaması
    d: 'Un, yumurta, gevrek sırası rastgele değil: un yüzeydeki nemi alır, yumurta una tutunur, gevrek de yumurtaya yapışır. Bir elini kuru malzemeler, diğerini yumurta için kullanırsan parmakların hamurla kaplanmaz. Gevreği toz haline getirmeden, irili ufaklı parçalar kalacak şekilde ez; çok ince olursa galeta unundan farkı kalmaz. Kaplanmış parçaları pişirmeden önce birkaç dakika tezgahta bekletmek kaplamanın oturmasına yardım eder. Gevreğin şekersiz olmasına da dikkat et; şekerli gevrek kızgın yağda ve fırında çabuk koyulaşıp yanık bir tat verir.

      '
  - t: Kızartma mı, fırın mı?
    d: 'Tavada kızartacaksan 2 su bardağı yağı iyice kızdır ve parçaları az az at; tava kalabalıklaşınca yağın ısısı düşer, kaplama yağ çeker. Kızaranları bir tel ızgaraya alırsan alt yüzleri buharda yumuşamaz. Fırında yağlanmış tepside 200°C''de 15 dakika pişirirken parçaların birbirine değmemesine dikkat et. Sosu ayrı bir kapta servis et; doğrudan üzerine dökülen sos kaplamayı kısa sürede ıslatır. Airfryer''da pişireceksen parçaları tek kat diz ve iki yüzüne de yağ sprey et; yarısında çevirmek iki yüzün eşit kızarmasını sağlar.

      '
  faq:
  - q: Çıtır tavuk fırında kaç dakika pişer?
    a: Yağlanmış tepside 200°C fırında 15 dakika pişer. Airfryer kullanıyorsan 200°C'de 12-15 dakika, yarısında çevirerek pişirmen yeterli.
  - q: Çıtır tavukta mısır gevreği yerine ne kullanılır?
    a: Galeta unu ya da ezilmiş kraker kullanabilirsin. Mısır gevreği kadar iri ve çıtır olmasa da aynı un, yumurta ve kaplama sırasıyla uygulanır.
  - q: Çıtır tavuk marine edilmeden yapılır mı?
    a: Yapılır ama tavuk göğsü daha kuru olur. Tarifteki 15 dakikalık yoğurtlu marine hem lezzet verir hem de eti yumuşatır.
  - q: Çıtır tavuk tavada kaç dakika kızartılır?
    a: Kızgın yağda her yüzü 3 dakika kızartılır. Şerit doğranmış tavuk göğsü bu sürede pişer.
ev-usulu-tavuk-doner:
  aramaBasligi: 'Tavuk döner tarifi: Evde döküm tavada, lavaşta dürüm'
  intro: 'Tavuk döner, marine tavuğun dikey şişte pişip ince dilimlendiği ve dürüm ya da ekmek arası servis edildiği, sokak yemeklerinin en yaygınlarından biri. Evde döner ocağı olmadığı için bu tarifte kemiksiz tavuk but, iyice ısınmış döküm tavada kenarları kızarana kadar pişiriliyor ve sonra ince şeritler halinde kesiliyor.


    Marinede yoğurt, biber salçası, sıvı yağ, sarımsak, kimyon, tatlı toz biber ve kekik var. Tavuğun buzdolabında en az 1 saat beklemesi gerekiyor; hazırlık ve pişirme ise toplam 30 dakika sürüyor. Dürüm için lavaş, domates, kırmızı soğan, turşu ve mayonezli sarımsaklı sos kullanılıyor.


    Tarif 4 kişilik; her kişiye bir lavaş dürüm düşüyor. Fırın ve airfryer seçenekleri de aşağıda.

    '
  editorNote: 'Göğüs yerine but seçtik; yüksek ateşte pişerken suyunu koruyor ve dönerdeki yumuşak dokuya daha çok yaklaşıyor. Dinlendirme adımını ayrı yazdık, çünkü tavadan çıkar çıkmaz kesilen tavuk suyunu tahtaya bırakıyor.

    '
  notes:
  - t: Tavanın ısısı
    d: 'Dönerin tadını veren şey kenarlardaki kızarıklık. Bunu yakalamak için döküm tavayı tavuğu koymadan önce birkaç dakika boş ısıt. Tavukları aralıklı yerleştir; birbirine değen parçalar buhar yapar ve kızarmak yerine haşlanır. Her yüzü 5-6 dakika pişirirken parçaları sık sık çevirme, tavaya değen yüz kendiliğinden kalkana kadar beklemek kabuk oluşturur. Marinedeki salça ve yoğurt yanmaya yatkın olduğu için ateşi en yükseğe değil, orta-yüksek seviyeye ayarla.

      '
  - t: Marinenin süresi
    d: 'Tarifte en az 1 saat yazıyor, ama tavuğu sabah marine edip akşam pişirmek de olur; yoğurt eti yumuşatır, baharatlar daha derine işler. Marine kabını mutlaka buzdolabında tut. Pişirmeden önce tavuğun üzerindeki fazla marineyi hafifçe sıyır; tavaya fazla sıvı girerse ısı düşer. Kimyon ve kekik döner aromasının temelini oluşturur, bu ikisini azaltma. Biber salçası bulamazsan domates salçası ve bir tatlı kaşığı pul biber kullanabilirsin.

      '
  - t: Dürümü toparlamak
    d: 'Lavaşı sarmadan önce kuru tavada birkaç saniye ısıtırsan esner ve sararken yırtılmaz. Sosu lavaşın ortasına ince bir şerit halinde sür, tavuğu ve sebzeleri bir kenara yığmak yerine boylu boyunca dağıt. Domatesin suyu dürümü ıslatmasın diye çekirdeklerini ayıklayabilirsin. Sardıktan sonra iki yüzünü tavada kısa süre ısıtmak dürümü kapatır ve dışını hafif çıtırlaştırır. Daha hafif bir sos istersen mayonez yerine süzme yoğurt kullan.

      '
  faq:
  - q: Evde tavuk döner nasıl yapılır?
    a: Kemiksiz tavuk but yoğurt, biber salçası ve baharatlarla en az 1 saat marine edilir, döküm tavada her yüzü 5-6 dakika pişirilir. 5 dakika dinlendirilip ince şeritler halinde kesilir.
  - q: Tavuk döner için göğüs mü but mu kullanılır?
    a: But daha iyi sonuç verir; yüksek ateşte kurumaz ve sulu kalır. Göğüs kullanırsan pişirme süresini kısa tut.
  - q: Tavuk döner fırında yapılır mı?
    a: Evet, marine tavuğu 220°C fırında 25 dakika pişirebilirsin. Airfryer'da ise 200°C'de 14-16 dakika yeterli.
  - q: Tavuk dönerde mayonezli sos yerine ne kullanılır?
    a: Mayonezli sarımsaklı sos yerine süzme yoğurt kullanabilirsin; daha hafif olur.
etli-ekmek:
  aramaBasligi: 'Konya etli ekmek tarifi: Evde fırın tepsisinde, 250°C''de'
  intro: 'Etli ekmek, Konya''nın en bilinen yemeklerinden biri: uzun ve incecik açılmış hamurun üzerine kıymalı harç yayılıp taş fırında pişirilir. Pideden ince, lahmacundan bol etlidir; Konya''da boyu bir metreye yaklaşan etli ekmekler dilimlenip servis edilir.


    Bu tarifte etli ekmek ev fırınına göre küçültüldü. Hamur 40 dakika mayalandıktan sonra 4 parçaya bölünüp yağlı kağıt üzerinde 60x20 cm boyunda açılıyor. Harçta orta yağlı kıyma, rendelenmiş soğan, kabuğu soyulmuş domates, sivri biber ve maydanoz var; harç pişirilmeden, çiğ olarak hamura yayılıyor. Fırın en yüksek dereceye, 250°C''ye ısıtılırken tepsi de içeride ısınıyor ve etli ekmekler 8-10 dakikada pişiyor.


    Hazırlık ve pişirme toplam 55 dakika, tarif 4 kişilik.

    '
  editorNote: 'Tepsiyi fırınla birlikte ısıtma adımını pişirme talimatının içine özellikle yazdık; taş fırının alttan verdiği çıtırlığa evde bu şekilde yaklaşılıyor. Harcı da çiğ bıraktık, çünkü ince yayılan kıyma hamurla aynı sürede pişiyor.

    '
  notes:
  - t: Harcın kalınlığı
    d: 'Etli ekmekte harç ince ve eşit yayılmalı. Kalın bir kat, 8-10 dakikalık kısa pişirmede ortası çiğ kalırken hamurun kenarlarının yanmasına yol açar. Harcı kenarlara kadar götür ve elinle bastırarak hamura yapıştır; böylece pişerken kıyma büzüşüp ortada toplanmaz. Domatesin kabuğunu soyup ince doğramak da bu yüzden önemli: iri domates parçaları su salar ve hamurun ortasını ıslatır. Orta yağlı kıyma seç; yağsız kıyma kuru kalır, çok yağlı kıyma ise yağ bırakır.

      '
  - t: İncecik açmanın yolu
    d: 'Hamuru doğrudan yağlı kağıdın üzerinde açmak, 60x20 cm gibi uzun ve ince bir şekli taşımayı kolaylaştırır; kağıtla birlikte sıcak tepsiye kaydırırsın. Hamur açarken geri çekiliyorsa birkaç dakika dinlendir, gluten gevşeyince kolayca uzar. Kenarları ortasından kalın bırakma, etli ekmeğin kenarı da incedir. Fırın tepsin daha kısaysa hamuru tepsi boyuna göre aç; burada ölçüden çok kalınlık önemli. Kağıdın üzerine az un serpmek hamurun kaymasını önler, ama fazlası pişerken alt yüzde kuruluk yapar.

      '
  - t: Servis ve saklama
    d: 'Etli ekmek fırından çıkar çıkmaz eritilmiş tereyağı sürülür; tereyağı hamuru yumuşatır ve kenarların kurumasını önler. Enine şeritler halinde dilimleyip sıcak servis et. Yanına ayran ve közlenmiş biber iyi gider. Artanı buzdolabında saklayabilirsin; yeniden ısıtırken mikrodalga hamuru lastikleştirir, önceden ısıtılmış fırında ya da kapağı kapalı tavada birkaç dakika ısıtmak daha iyi sonuç verir. Harcı önceden hazırlayacaksan buzdolabında beklet ve hamura yaymadan hemen önce çıkar.

      '
  faq:
  - q: Etli ekmek kaç derecede pişer?
    a: Fırının en yüksek derecesinde, yaklaşık 250°C'de pişer. Önceden ısıtılmış tepsiye kaydırılan etli ekmekler 8-10 dakikada hazır olur.
  - q: Etli ekmek harcı pişirilir mi?
    a: Hayır, harç çiğ olarak hamura yayılır. Kıyma ince yayıldığı için hamurla aynı anda pişer.
  - q: Etli ekmek ile pide arasındaki fark nedir?
    a: Etli ekmeğin hamuru pideden çok daha ince açılır ve harç kenarlara kadar yayılır. Pidenin kenarları ise kıvrılıp kabarık bırakılır.
  - q: Etli ekmek için hangi kıyma kullanılır?
    a: Orta yağlı kuzu ya da dana kıyma kullanılır. İkisi birbirinin yerine geçer; önemli olan kıymanın çok yağsız olmaması.
ramazan-pidesi:
  aramaBasligi: 'Ramazan pidesi tarifi: Evde kabarık, çörek otlu ve susamlı'
  intro: 'Ramazan pidesi, Ramazan ayında fırınların önünde iftar öncesi kuyruk oluşturan, kenarları kabarık, yüzeyi kafes desenli yumuşak pide. Üzerine sürülen yumurta sarısı ve yoğurt karışımı ona parlak, açık kızıl rengini; susam ve çörek otu da tanıdık kokusunu veriyor.


    Bu tarifte hamur 4 su bardağı un, instant kuru maya, ılık su ve zeytinyağıyla yoğruluyor ve iki katına çıkana kadar yaklaşık 60 dakika mayalanıyor. Ardından ikiye bölünüp tepside yağlı elle yayılıyor ve parmak uçlarıyla desen bastırılıyor. 230°C fırında 12-15 dakika pişiyor.


    Hazırlık ve pişirme süresi toplam 35 dakika; buna mayalanma ve 15 dakikalık dinlendirme ekleniyor. İki pide 6 kişiye yetiyor.

    '
  editorNote: 'Hamurun yumuşak ve biraz yapışkan kalmasını özellikle belirttik; un eklemeye direnmek pidenin kabarık olmasının ön koşulu. Fırından sonra bezle örtme adımını da yazdık, çünkü açıkta soğuyan pidenin kabuğu sertleşiyor.

    '
  notes:
  - t: Yapışkan hamurdan korkma
    d: 'Ramazan pidesinin hamuru ekmek hamurundan daha yumuşak olmalı. Yoğururken ele yapışıyor diye un eklersen pide sıkı ve tok olur, kenarlar da yeterince kabarmaz. Bunun yerine ellerini zeytinyağıyla ya da suyla ıslat. Hamuru tepsiye de yağlı elle yay; merdane kullanmak içindeki havayı söndürür. Mayalanma süresi mutfağın sıcaklığına bağlı; saate değil, hamurun iki katına çıkmasına bak. Serin günlerde hamuru kapalı ve kapağı açılmayan, ışığı yanan bir fırının içinde mayalandırmak süreci hızlandırır.

      '
  - t: Kafes desenini bastırmak
    d: 'Desen sadece süs değil: hamurun bastırılan yerleri ince kalır, aradaki karelerse kabarır ve pidenin tanıdık dokusu buradan gelir. Kenardan iki parmak içeriden başla ki kabarık bir çerçeve kalsın. Önce parmak uçlarınla bir yönde paralel çizgiler, sonra çapraz çizgiler bastır. Parmaklarını ıslatmak hamurun yapışmasını önler. Bastırırken hamuru delmemeye dikkat et; delinen yerlerden sürdüğün yumurta tepsiye akar ve pide oraya yapışır. Deseni bastırdıktan sonra sürdüğün yumurta ve yoğurt karışımının çukurlarda birikmemesine dikkat et; biriken karışım o noktaları koyulaştırır.

      '
  - t: Yumuşak kalması için
    d: 'Pide 230°C''de hızlı pişer; açık kızıl rengini alınca çıkar, fazla beklersen kabuğu kalınlaşır. Fırından alır almaz temiz bir bezle örtmek buharı içeride tutar ve kabuğu yumuşatır. Ertesi güne kalan pideyi buzdolabına değil, ağzı kapalı bir poşette oda sıcaklığında sakla. Daha uzun saklamak istersen dilimleyip dondurabilirsin; kullanmadan önce fırında birkaç dakika ısıtman yeterli. Isıtmadan önce üzerine birkaç damla su serpmek kabuğun tazelenmesine yardım eder.

      '
  faq:
  - q: Ramazan pidesi kaç derecede pişer?
    a: 230°C fırında, açık kızıl rengini alana kadar 12-15 dakika pişer.
  - q: Ramazan pidesinin üzerine ne sürülür?
    a: 1 yumurta sarısı ve 1 yemek kaşığı yoğurt karıştırılıp sürülür, ardından susam ve çörek otu serpilir.
  - q: Ramazan pidesi nasıl yumuşak olur?
    a: Hamuru yumuşak ve biraz yapışkan bırakmak, fazla un eklememek gerekir. Fırından çıkınca pideyi hemen bir bezle örtmek de kabuğun yumuşak kalmasını sağlar.
  - q: Ramazan pidesi dondurulur mu?
    a: Evet, soğuduktan sonra poşete koyup dondurabilirsin. Kullanmadan önce fırında birkaç dakika ısıtman yeterli.
ev-ekmegi:
  aramaBasligi: 'Ev ekmeği tarifi: Kabuğu çıtır, içi yumuşak mayalı somun'
  intro: 'Ev ekmeği, un, maya, su ve tuzun yoğrulup mayalandırıldıktan sonra fırında pişirildiği, kabuğu çıtır ve içi yumuşak bir somun. Bu tarifte ekmeklik un, instant kuru maya, bir tatlı kaşığı şeker ve iki yemek kaşığı zeytinyağı kullanılıyor; tarif tamamen bitkisel.


    Hamur 10 dakika yoğruluyor, 60 dakikalık ilk mayalanmanın ardından şekillendirilip 30 dakika daha bekletiliyor. Pişirirken fırının altına konan bir kap kaynar su buhar oluşturuyor; bu buhar kabuğun çıtır ve parlak olmasına yardım ediyor. Ekmek 220°C''de yaklaşık 35 dakika pişiyor.


    Hazırlık ve pişirme toplam 55 dakika, mayalanma süreleri buna dahil değil. Bir somun 8 kişiye yetiyor.

    '
  editorNote: 'Pişme kontrolü için süreye ek olarak alttan vurunca tok ses gelmesini yazdık; fırınlar farklı ısındığı için bu, saatten daha güvenilir bir işaret. Soğutmayı da tel ızgarada önerdik, çünkü tezgahta soğuyan ekmeğin altı terleyip yumuşuyor.

    '
  notes:
  - t: Yoğurmanın amacı
    d: '10 dakikalık yoğurma, unun içindeki glutenin gelişmesi için gerekli. Gelişmiş gluten mayanın ürettiği gazı tutar ve ekmeğin kabarmasını sağlar. Hamurun hazır olup olmadığını anlamak için küçük bir parçayı parmaklarınla gerdir: yırtılmadan ince bir zar oluşuyorsa yoğurma yeterli. Ekmeklik un protein oranı yüksek olduğu için bu sonucu daha kolay verir. Hamur başta yapışkan gelebilir, yoğurdukça toparlanır; hemen un eklemek ekmeği sıkılaştırır.

      '
  - t: Çizik ve buhar
    d: 'İkinci mayalanmadan sonra üzerine atılan çizikler, fırında kabaran ekmeğin nereden açılacağını belirler. Çizik atılmazsa ekmek en zayıf noktasından düzensizce çatlar. Keskin bir bıçakla tek hamlede, yarım santim kadar derinlikte çiz. Fırının altına koyduğun kaynar su, ilk dakikalarda kabuğun nemli kalmasını sağlar; ekmek kabuk sertleşmeden önce iyice kabarır. Kabı fırına koyarken ve fırın kapağını açarken çıkan buhara dikkat et. Su için fırına dayanıklı, metal bir kap kullan; cam kap ani ısı farkında çatlayabilir.

      '
  - t: Pişip pişmediğini anlamak
    d: 'Ekmek 220°C''de yaklaşık 35 dakika pişer ama kabuk rengi tek başına yeterli bir işaret değil. Ekmeği tepsiden alıp alt yüzüne parmağınla vur; tok ve boş bir ses çıkıyorsa pişmiştir, donuk ses geliyorsa birkaç dakika daha fırında tut. Fırından çıkan ekmeği hemen kesme; içi pişmeye devam eder ve sıcakken kesilen ekmek hamurlaşır. Tel ızgarada tamamen soğut, sonra bez torbada ya da kağıt poşette sakla.

      '
  faq:
  - q: Ev ekmeği kaç dakika pişer?
    a: 220°C fırında yaklaşık 35 dakika pişer. Altına vurduğunda tok ses çıkıyorsa ekmek hazırdır.
  - q: Ev ekmeği neden kabarmaz?
    a: Genellikle hamur yeterince yoğrulmadığında ya da mayalanma kısa tutulduğunda kabarmaz. Hamurun ilk mayalanmada iki katına çıkmasını bekle; tarifte bu süre 60 dakika.
  - q: Ev ekmeğinin kabuğu nasıl çıtır olur?
    a: Fırının altına bir kap kaynar su koyup buharla pişirmek ve ekmeği tel ızgarada soğutmak kabuğu çıtır tutar.
  - q: Ev ekmeği tam buğday unuyla yapılır mı?
    a: Unun üçte birini tam buğday unuyla değiştirebilirsin. Hamur biraz daha fazla su çeker, suyu bir iki kaşık artırman gerekebilir.
ev-simidi:
  aramaBasligi: 'Simit tarifi: Evde pekmezli ve kavrulmuş susamlı, çıtır'
  intro: 'Simit, pekmezli suya batırılıp susama bulanan, burgu şeklinde halka ekmek. Sokak simidinin koyu rengi ve çıtır kabuğu, susamı tutan pekmezden ve yüksek fırın ısısından geliyor.


    Bu tarifte hamur ele yapışmayan, sıkı bir kıvamda yoğruluyor ve 45 dakika mayalanıyor. 8 parçaya bölünen hamurun her biri ikiye ayrılıp 40 cm''lik ince şeritler halinde açılıyor, iki şerit birbirine burulup halka yapılıyor. Simitler önce suyla açılmış üzüm pekmezine batırılıyor, sonra kuru tavada hafifçe kavrulmuş susama bulanıyor. 15 dakika dinlendikten sonra 220°C fırında 18-20 dakika pişiyor.


    Hazırlık ve pişirme toplam 60 dakika sürüyor, mayalanma ayrı. Tarif 8 simit çıkarıyor ve 8 kişiye yetiyor.

    '
  editorNote: 'Hamuru bilerek sıkı tuttuk; yumuşak hamur burulurken şeklini kaybediyor ve simit yerine yuvarlak bir çöreğe dönüyor. Susamı kavurma işini de pekmez adımına ayrıca yazdık, çünkü simidin kokusunun büyük kısmı buradan geliyor.

    '
  notes:
  - t: Hamurun kıvamı
    d: 'Simit hamuru açma ya da poğaça hamuru gibi yumuşak değil, sıkıdır. Tarifteki 1,25 su bardağı su, 4 su bardağı una göre bilinçli olarak az. Sıkı hamur 40 cm''lik ince şeritlere açılırken incelir ama kopmaz, burgu deseni de fırında belirgin kalır. Şerit açarken hamur geri çekiliyorsa üzerini örtüp 5 dakika dinlendir. Unlu tezgah yerine unsuz bir tezgahta yuvarlamak hamurun kaymadan uzamasını sağlar.

      '
  - t: Pekmez ve susam
    d: 'Pekmezi suyla açmak hem simidin her yerine eşit sürülmesini sağlar hem de susamın tutunacağı yapışkan bir yüzey oluşturur. Pekmez fırında karamelleşir ve simide koyu rengini verir; pekmezsiz suya batırılan simit soluk kalır. Susamı kuru tavada sürekli karıştırarak hafifçe renk alana kadar kavur, sonra geniş bir tabağa yay. Simidi pekmezden çıkarınca fazlasını süzdür, ardından susama bastırarak iki yüzünü de kapla. Susam tabağını tepsiye yakın tut ki pekmezli simidi taşırken tezgaha damlatmayasın.

      '
  - t: Çıtır kabuk ve saklama
    d: 'Fırının altına bir kap su koyarsan çıkan buhar kabuğun daha çıtır olmasına yardım eder. Simitleri tepsiye aralıklı diz; birbirine yapışanların yan yüzleri iyi pişmez. Simit en iyi aynı gün yenir. Ertesi güne kalanları ağzı kapalı bir poşette sakla ve servis etmeden önce fırında birkaç dakika ısıt. Uzun süre saklamak için pişmiş simitleri soğuttuktan sonra dondurabilirsin. Donmuş simidi çözdürmeden fırına koyabilirsin; ısıtma süresini birkaç dakika uzatman yeterli olur.

      '
  faq:
  - q: Simit kaç derecede pişer?
    a: 220°C fırında, kızarana kadar 18-20 dakika pişer. Fırına vermeden önce tepside 15 dakika dinlendirilir.
  - q: Simitte pekmez yerine ne kullanılır?
    a: Üzüm pekmezi yerine bal ya da hurma şurubu kullanabilirsin. Suyla aynı şekilde açılıp simitler bu karışıma batırılır.
  - q: Simidin susamı neden dökülür?
    a: Simit pekmezli suya yeterince batırılmadığında ya da susama bastırılmadan bulandığında susam tutunmaz. Pekmezden çıkan simidi susama iyice bastırarak bula.
  - q: Ev simidi airfryer'da yapılır mı?
    a: Evet. Simitleri ikişer üçer yağlı kağıda koyup 180°C'de 14-16 dakika pişir; son 3 dakikada çevir.
zeytinli-pogaca:
  aramaBasligi: 'Zeytinli poğaça tarifi: Kekikli, yumuşak ve mayalı'
  intro: 'Zeytinli poğaça, pastane vitrinlerinin ve kahvaltı sofralarının klasik mayalı hamur işi. Bu tarifte doğranmış siyah zeytin, kekik ve pul biber iç harç olarak doldurulmuyor, doğrudan hamura yediriliyor; böylece her lokmada zeytin geliyor ve şekillendirme kolaylaşıyor.


    Hamur ılık süt, sıvı yağ, yoğurt ve yumurta beyazıyla yoğruluyor. Yoğurt hamura yumuşaklık, sıvı yağ ise poğaçanın tanıdık dağılan dokusunu veriyor. 30 dakika mayalanan hamurdan ceviz büyüklüğünde parçalar koparılıp yuvarlanıyor, 15 dakika daha dinlendiriliyor. Üzerine yumurta sarısı sürülüp çörek otu serpiliyor ve 180°C fırında 20-25 dakika pişiyor.


    Hazırlık ve pişirme toplam 55 dakika. Tarif 12 kişilik; kahvaltı ya da çay saati için bol çıkıyor.

    '
  editorNote: 'Zeytini iç harç yerine hamura yedirmeyi seçtik; poğaçaları tek tek doldurmak zaman alıyor ve harç pişerken kenarlardan taşabiliyor. Yumurtanın beyazını hamura, sarısını üzerine ayırdık ki tek yumurtayla iki iş görülsün.

    '
  notes:
  - t: Zeytinin suyu
    d: 'Zeytinlerin salamura suyunu iyice süzmeden hamura eklersen hamur sulanır, ayrıca fazla tuz hamurun tadını bastırır. Doğradıktan sonra zeytinleri kağıt havluya yayıp birkaç dakika beklet. Zeytinlerin çok tuzlu olduğunu düşünüyorsan hamurdaki tuzu azaltabilirsin. Zeytini yoğurmanın sonunda ekle ve sadece eşit dağılacak kadar yoğur; uzun yoğrulursa zeytin ezilir ve hamuru mora boyar. Zeytini ince doğramak da önemli; iri parçalar şekillendirirken hamurdan dışarı çıkar ve fırında kurur. Kekik ve pul biberi zeytinle birlikte eklemek baharatın hamura eşit dağılmasını sağlar.

      '
  - t: Yumuşak poğaçanın sırrı
    d: 'Poğaça hamuru ekmek hamuru gibi uzun yoğrulmaz; amaç esnek değil, yumuşak ve kolay dağılan bir doku. Unu azar azar ekle ve hamur ele yapışmayı bıraktığı anda dur. Fazla un poğaçayı fırında kurutur ve ertesi gün sertleştirir. Tarif 4 su bardağı un veriyor ama unların su çekme oranı değişir, bu yüzden son yarım bardağı kontrollü ekle. Pişirme süresini de uzatma; üzeri kızarınca fırından çıkar.

      '
  - t: Önceden hazırlamak ve saklamak
    d: 'Poğaçaları akşamdan şekillendirip üzeri kapalı tepside buzdolabında bekletebilirsin. Sabah fırın ısınırken tepsiyi dışarı al, yumurta sarısını sür ve doğrudan pişir. Pişmiş poğaçalar soğuduktan sonra ağzı kapalı bir kapta oda sıcaklığında bir iki gün yumuşak kalır. Dondurmak istersen pişmiş ve tamamen soğumuş poğaçaları poşete koy; kullanmadan önce fırında birkaç dakika ısıtman yeterli. Buzdolabından çıkan çiğ poğaçalar soğuk olduğu için biraz daha uzun pişebilir; süreyi kızarmaya bakarak ayarla. Bu yöntem kalabalık kahvaltılarda sabah işini ciddi ölçüde kısaltır.

      '
  faq:
  - q: Zeytinli poğaça kaç dakika pişer?
    a: 180°C fırında, üzeri kızarana kadar 20-25 dakika pişer. Airfryer'da 170°C'de 14-16 dakika yeterli.
  - q: Poğaça nasıl yumuşak olur?
    a: Unu azar azar ekleyip hamuru yumuşak bırakmak ve fazla pişirmemek gerekir. Tarifteki yoğurt ve sıvı yağ da poğaçanın yumuşak kalmasını sağlar.
  - q: Zeytinli poğaçaya hangi zeytin konur?
    a: Çekirdeksiz siyah zeytin kullanılır. Suyunu iyice süzüp doğradıktan sonra hamura yedirmek gerekir.
  - q: Zeytinli poğaça dondurulur mu?
    a: Evet, pişmiş poğaçalar soğuduktan sonra dondurulabilir. Kullanmadan önce fırında birkaç dakika ısıtmak yeterli.
acma:
  aramaBasligi: 'Açma tarifi: Pastane usulü, tereyağlı ve yumuşacık'
  intro: 'Açma, simitçilerin ve pastanelerin kahvaltılık mayalı hamur işi; simitten farklı olarak yumuşak, hafif tatlımsı ve katmanlı bir dokusu var. Bu katmanlar, açılan hamurun üzerine tereyağı sürülüp rulo yapılmasından geliyor.


    Bu tarifte hamur ılık süt, su, instant maya, şeker, sıvı yağ ve yumurtayla 10 dakika yoğruluyor ve 45 dakika mayalanıyor. 12 parçaya bölünen hamurun her biri dikdörtgen açılıp oda sıcaklığında tereyağıyla kaplanıyor, rulo yapılıp kendi etrafında burularak halka şeklinde birleştiriliyor. 20 dakikalık ikinci mayalanmanın ardından üzerine yumurta sarısı ve susam geliyor, açmalar 180°C fırında 25 dakika pişiyor.


    Hazırlık ve pişirme toplam 55 dakika, mayalanma süreleri ayrı. Tarif 12 açma çıkarıyor, 12 kişilik.

    '
  editorNote: 'Ara yağ için eritilmiş değil, oda sıcaklığında tereyağı seçtik; sürülebilir kıvamdaki yağ hamurun katları arasında kalıyor, eritilmiş yağ ise hamura emiliyor. Hamur yapışırsa un yerine eli yağlamayı önerdik, çünkü fazla un açmanın yumuşaklığını götürüyor.

    '
  notes:
  - t: Ara yağın görevi
    d: 'Açmanın içindeki ince katmanlar, rulo yaparken hamurun arasında kalan tereyağından oluşur. Tereyağı oda sıcaklığında, krem gibi sürülebilir olmalı. Buzdolabından yeni çıkmış yağ hamuru yırtar, eritilmiş yağ ise hamura işler ve katmanları birbirine yapıştırır. Yağı dikdörtgenin tamamına ince bir kat halinde sür, ama uzun kenarlardan birinde bir parmaklık boşluk bırak; rulo bu kenarda kapanırken yağsız hamur birbirine yapışır ve açılmaz. Mutfak çok sıcaksa tereyağı hızla yumuşar; bu durumda yağı sürdükten sonra beklemeden rulo yap.

      '
  - t: Halka şeklini vermek
    d: 'Rulo yaptığın hamuru iki ucundan tutup ters yönlere çevirerek bur; bu burgu açmanın üzerindeki spiral deseni verir. Sonra iki ucu üst üste getirip parmaklarınla sıkıca bastır. Uçları zayıf birleştirirsen ikinci mayalanmada ya da fırında halka açılır. Birleşim noktasını altta kalacak şekilde tepsiye yerleştir. Açmalar fırında büyüyeceği için tepsiye aralıklı diz; birbirine değenlerin yanları pişmez ve soluk kalır. İkinci mayalanma sırasında üzerlerini örtmeyi unutma; açıkta kalan hamurun yüzeyi kurur ve çatlar.

      '
  - t: Varyasyonlar ve saklama
    d: 'Tereyağını sürdükten sonra üzerine zeytin ezmesi ya da rendelenmiş kaşar ekleyerek farklı açmalar yapabilirsin; rulo ve burgu adımları aynı kalır. Pişmiş açmalar soğuduktan sonra ağzı kapalı bir poşette oda sıcaklığında bir iki gün yumuşak kalır. Dondurmak istersen tamamen soğumuş açmaları tek tek poşetle. Servisten önce fırında birkaç dakika ısıtmak, ilk günkü yumuşaklığı büyük ölçüde geri getirir. Kaşarlı açmaları sıcak servis etmek peynirin akışkan kalmasını sağlar.

      '
  faq:
  - q: Açma kaç derecede pişer?
    a: 180°C fırında, altın rengi olana kadar yaklaşık 25 dakika pişer. Airfryer'da 170°C'de 14-16 dakika yeterli.
  - q: Açma neden yumuşak olmaz?
    a: Genellikle hamura fazla un eklendiğinde ya da açmalar fazla piştiğinde sertleşir. Hamur yapışkan gelirse un yerine elini yağla ve altın rengini alınca fırından çıkar.
  - q: Açma ile simit arasındaki fark nedir?
    a: Simit sıkı bir hamurdan yapılır, pekmezle susama bulanır ve çıtırdır. Açmanın hamuru süt, yumurta ve yağla yumuşak yoğrulur, içinde tereyağı katmanları vardır.
  - q: Açmanın içine ne konur?
    a: Sade açmanın içinde yalnızca tereyağı vardır. İstersen tereyağının üzerine zeytin ezmesi ya da kaşar ekleyebilirsin.
kete:
  aramaBasligi: 'Kete tarifi: Kavrulmuş un içli, kat kat ve kıyır kıyır'
  intro: 'Kete, Doğu Anadolu''nun, özellikle Kars ve Erzurum kahvaltılarının bilinen çöreği. Onu sıradan bir mayalı çörekten ayıran, tereyağında kavrulmuş undan yapılan iç harç: bu harç fırında kıyır kıyır bir doku alıyor ve çöreğe kat kat bir görünüm veriyor.


    Bu tarifte hamur süt, yoğurt ve sıvı yağla yoğrulup 40 dakika mayalanıyor. İç harç için tereyağında un, kısık ateşte açık kahve rengi olana kadar yaklaşık 12 dakika kavruluyor ve soğutuluyor. Hamur 3 parçaya bölünüp ince açılıyor, harç yayılıp rulo yapılıyor ve salyangoz gibi sarılıyor. Üzerine yumurta sarısı sürülüp çörek otu serpilen keteler 180°C fırında 25-30 dakika pişiyor.


    Hazırlık ve pişirme toplam 70 dakika, tarif 10 kişilik.

    '
  editorNote: 'İç harcın kıvamını ıslak kum olarak tarif ettik; renk kadar kıvam da harcın doğru kavrulduğunu gösteriyor. Harcı soğutma şartını ayrıca vurguladık, çünkü sıcak harç hamurun içinde eriyip katları yok ediyor.

    '
  notes:
  - t: Unu doğru kavurmak
    d: 'Ketenin lezzeti büyük ölçüde iç harçta. Tereyağını erittikten sonra unu ekle ve kısık ateşte, tahta kaşıkla hiç bırakmadan karıştır. Un önce topaklanır, sonra tereyağıyla birleşip ıslak kum kıvamına gelir; renk açık kahveye döndüğünde ve kavrulmuş bir koku yayıldığında ocaktan al. Yüksek ateşte un dipte yanar ve acı bir tat bırakır. Tavadan çıkardıktan sonra geniş bir kaba yay ki kendi sıcaklığıyla kavrulmaya devam etmesin.

      '
  - t: Kat kat görünüm
    d: 'Katlar, ince açılmış hamurun üzerine kavrulmuş un yayılıp sarılmasından oluşur. Hamuru ne kadar ince açarsan o kadar çok kat elde edersin. Harcı yayarken kenarlarda bir parmaklık boşluk bırak ki rulo kapanırken yapışsın. Ruloyu sıkı sar ama ezme; ardından salyangoz gibi kendi etrafında kıvırıp avucunla hafifçe bastır. Bastırırken harcın biraz kenardan çıkması normal. Dilimleyerek pişireceksen keskin bir bıçak kullan ki katlar ezilmesin.

      '
  - t: Servis ve saklama
    d: 'Kete hem sıcak hem soğuk yenebilir; sıcakken iç harç daha yumuşak, soğuyunca daha kıyır kıyırdır. Kars ve Erzurum''da yanına çay ve kaşar peyniri konur. Soğuduktan sonra ağzı kapalı bir kapta oda sıcaklığında birkaç gün saklanabilir. Daha uzun saklamak istersen pişmiş keteleri tek tek sarıp dondur; servis etmeden önce fırında birkaç dakika ısıtmak dokusunu geri getirir. Kesmeden önce ketenin tamamen soğumasını beklersen katlar daha düzgün ayrılır.

      '
  faq:
  - q: Kete içi nasıl yapılır?
    a: 150 g tereyağında 1 su bardağı un, kısık ateşte sürekli karıştırılarak açık kahve rengi olana kadar yaklaşık 12 dakika kavrulur. Yarım tatlı kaşığı tuz eklenip soğutulur.
  - q: Kete kaç derecede pişer?
    a: Üzerine yumurta sarısı sürülüp çörek otu serpilen kete, 180°C fırında kızarana kadar 25-30 dakika pişer.
  - q: Ketenin katları neden kaybolur?
    a: İç harç soğumadan hamura konduğunda tereyağı hamuru yumuşatır ve katlar birbirine karışır. Kavrulmuş unu tamamen soğuttuktan sonra kullan.
  - q: Kete tereyağı yerine margarinle yapılır mı?
    a: Hamur işlerinde tereyağı yerine aynı ölçü margarin kullanılabilir. Ancak iç harçtaki kavrulmuş tereyağı aroması azalır.
kayseri-yaglamasi:
  aramaBasligi: 'Kayseri yağlaması tarifi: Ev yufkalı, kıymalı ve yoğurtlu'
  intro: 'Kayseri yağlaması, ince yufkaların arasına bol ve sulu kıymalı sos sürülerek kat kat dizildiği ve pasta gibi dilimlenerek yenen bir Kayseri yemeği. Kalabalık sofralar için hazırlanan, sarımsaklı yoğurtla tamamlanan doyurucu bir tabak.


    Bu tarifte yufkalar evde yapılıyor: un, su ve tuzla yoğrulan hamur 10 parçaya bölünüp tabak büyüklüğünde açılıyor ve kuru tavada her yüzü 30 saniye pişiriliyor. Kıymalı sos tereyağında soğan ve kıymanın kavrulmasıyla başlıyor; biber, iki çeşit salça ve rendelenmiş domatesle 15 dakika, sulu kalacak şekilde pişiyor. Yufka ve sos kat kat dizildikten sonra 10 dakika dinlendiriliyor.


    Hazırlık ve pişirme toplam 80 dakika, tarif 6 kişilik. Zamanın kısıtlıysa hazır lavaşla daha pratik bir versiyon da yapılabiliyor.

    '
  editorNote: 'Sosun sulu kalması gerektiğini hem pişirme adımına hem ipuçlarına yazdık; yağlamanın tamamı yufkaların bu sosu çekmesine dayanıyor. Dinlendirmeyi ayrı bir adım yaptık, çünkü hemen kesilen yağlama kuru kalıyor ve katları kayıyor.

    '
  notes:
  - t: Yufkaları pişirmek
    d: 'Ev yufkası ince açılmalı ama yırtılmamalı. Hamuru açmadan önce birkaç dakika dinlendirmek açmayı kolaylaştırır. Kuru tavada her yüzü 30 saniye pişirmek yeterli; yufka hafif benekler almalı ama kurumamalı. Fazla pişen yufka sertleşir, sosu çekemez ve dilimlerken kırılır. Pişen yufkaları üst üste koyup üzerini temiz bir bezle ört; buharları içeride kalır ve kat kat dizilene kadar yumuşak kalırlar. Yufkaları önceden yapacaksan soğuduktan sonra poşete koyup sakla; böylece kurumazlar.

      '
  - t: Sosun kıvamı
    d: 'Yağlamada sos, yufkaları ıslatacak kadar bol ve sulu olmalı; tarifteki 1 su bardağı sıcak su bu yüzden var. Sos çok koyulaşırsa yufkalar kuru kalır, çok sulu olursa yufkalar dağılır ve dilim tutmaz. Kıvamı akışkan bir kıymalı sos gibi düşün. Soğanı ve kıymayı tereyağında iyice kavurmak, sosun suyu bol olsa bile tadının sulanmamasını sağlar. Sosu yufkalara sıcakken sür; sıcak sos daha kolay emilir.

      '
  - t: Dilimleme ve servis
    d: 'Kat kat dizilen yağlamayı üzeri kapalı şekilde 10 dakika beklet. Bu süre yufkaların sosu çekip birbirine tutunmasını sağlar; pasta gibi düzgün dilimler bu sayede çıkar. Keskin bir bıçakla ortadan dışa doğru üçgen dilimler kes. Sarımsaklı yoğurdu ayrı bir kapta ya da dilimlerin üzerine kaşıkla koyarak servis et. Pratik bir versiyon istersen ev yufkası yerine hazır lavaş kullan; sos ve diziliş aynı kalır.

      '
  faq:
  - q: Kayseri yağlaması hazır lavaşla yapılır mı?
    a: Evet, ev yufkası yerine hazır lavaşla pratik bir versiyon yapılabilir. Sos ve kat kat diziliş aynı kalır; lavaşlar sosu çeksin diye yine 10 dakika dinlendirilir.
  - q: Yağlama sosu nasıl olmalı?
    a: Bol ve sulu olmalı. Kıyma, soğan, biber, salça ve domates 1 su bardağı sıcak suyla 15 dakika pişirilir ki yufkalar sosu çekip yumuşasın.
  - q: Kayseri yağlamasının yanına ne yenir?
    a: Sarımsaklı yoğurtla servis edilir. Tarifteki 2 su bardağı sarımsaklı yoğurt 6 kişiye yeter.
  - q: Yağlama için yufka kaç saniye pişirilir?
    a: Kuru tavada her yüzü yaklaşık 30 saniye pişirilir. Fazla pişen yufka sertleşir ve sosu çekmez.
