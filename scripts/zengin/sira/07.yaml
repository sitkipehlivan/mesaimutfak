muzlu-yulafli-kurabiye:
  aramaBasligi: 'Muzlu yulaflı kurabiye tarifi: Şekersiz ve unsuz, 20 dakika'
  intro: 'Muzlu yulaflı kurabiye, un, yumurta ve şeker kullanmadan yalnızca olgun muz ve yulaf ezmesiyle yapılan yumuşak bir kurabiye. Tatlılığını tamamen muzdan aldığı için kabuğu kararmaya başlamış muzları değerlendirmenin pratik bir yolu.


    Bu tarifte iki muz çatalla ezilip 1,5 su bardağı yulaf, tarçın ve kuru üzüm ya da bitter çikolata parçasıyla karıştırılıyor. Karışım 5 dakika bekletilerek yulafın muzun nemini çekmesi sağlanıyor, sonra kaşıkla tepsiye bırakılıyor. Kurabiyeler 180°C fırında 15 dakikada, airfryer''da 170°C''de 8-10 dakikada pişiyor.


    5 dakika hazırlık ve 15 dakika pişirmeyle toplam 20 dakikada 12 kurabiye çıkıyor. Bitter çikolatayı sütsüz seçersen tarif vegan kalıyor.

    '
  editorNote: 'Un ve yumurta kullanmadığımız için bağlayıcılığı tamamen muza bıraktık; bu yüzden muzun olgun olması bu tarifte süs değil şart. Karıştırdıktan sonraki 5 dakikalık beklemeyi de ayrı yazdık, çünkü yulaf muzun nemini çekmeden şekillendirilen kurabiyeler tepside dağılıyor.

    '
  notes:
  - t: Neden olgun muz
    d: 'Kabuğu kahverengi lekelenmiş muz hem daha tatlıdır hem de çatalla kolayca pürüzsüz bir püreye dönüşür. Bu tarifte şeker olmadığı için kurabiyenin bütün tatlılığı muzdan geliyor; sarı ve sert bir muzla yaparsan kurabiye yavan ve kuru olur. Muz püresi aynı zamanda yulafı bir arada tutan tek bağlayıcı. Bu yüzden ezerken iri topak bırakmamaya çalış; topaklı kısımlar pişince ıslak kalır, püre ince olursa kurabiye her yerde eşit pişer.

      '
  - t: Şekillendirme ve pişme
    d: 'Bu kurabiyeler fırında yayılmaz, kaşıkla bıraktığın şekli korur. O yüzden tepsiye koyduktan sonra kaşığın sırtıyla hafifçe bastırıp hepsini benzer kalınlığa getirmek gerekir; kalın kalan kurabiyelerin ortası hamurumsu kalır. Kenarları kızarmaya başladığında fırından çıkar; ilk anda yumuşak görünseler de tepside soğurken toparlanırlar. Çok uzun pişirirsen dışı sertleşir ve muz aroması kaybolur. Tepsiye yağlı kağıt sermek, kurabiyelerin yapışmadan kalkmasını sağlar. Fırının ısısı eşit değilse pişirmenin ortasında tepsiyi çevir.

      '
  - t: Saklama ve çeşitleme
    d: 'Kurabiyeler un ve şeker içermediği için çıtır değil, yumuşak bir dokudadır ve oda sıcaklığında çabuk nemlenir. Soğuduktan sonra kapaklı bir kapta buzdolabında saklamak daha güvenli. Kuru üzüm yerine bitter çikolata, iri kıyılmış ceviz ya da doğranmış kuru kayısı kullanabilirsin. Bitter çikolata yerine sütlü çikolata da olur, ama tatlılık artar. Tarifin vegan kalmasını istiyorsan çikolatanın etiketinde süt bulunmadığını kontrol et. Tarçın miktarını damak tadına göre azaltabilirsin.

      '
  faq:
  - q: Muzlu yulaflı kurabiye kaç dakika pişer?
    a: 180°C fırında kenarları kızarana kadar yaklaşık 15 dakika pişer. Airfryer'da yağlı kağıt üzerinde 170°C'de 8-10 dakika yeterli.
  - q: Muzlu yulaflı kurabiye neden dağılır?
    a: Genellikle karışım bekletilmeden şekillendirildiği ya da muz yeterince olgun olmadığı için dağılır. Yulafı ekledikten sonra karışımı 5 dakika beklet ve muzu iyice püre yap.
  - q: Muzlu kurabiyeye şeker eklenir mi?
    a: Gerekmez; olgun muz yeterli tatlılığı verir. Daha tatlı istersen kuru üzümü artırabilir ya da sütlü çikolata kullanabilirsin.
  - q: Muzlu yulaflı kurabiye vegan mı?
    a: Muz, yulaf, tarçın ve kuru üzümle tamamen vegandır. Bitter çikolata kullanıyorsan etiketinde süt olmadığından emin ol.
narli-roka-salatasi:
  aramaBasligi: 'Narlı roka salatası tarifi: Cevizli, nar ekşili sosla'
  intro: 'Narlı roka salatası, rokanın acımsı tadını nar tanelerinin ekşi-tatlı suyu, cevizin yağlı dokusu ve beyaz peynirin tuzuyla dengeleyen bir salata. Nar ve rokanın tezgahlarda bol bulunduğu sonbahar ve kış aylarında sofraya en kolay renk katan tabaklardan biri.


    Bu tarifte iki demet roka yıkanıp kurulanıyor ve iri doğranıyor. Sos zeytinyağı, nar ekşisi, limon suyu ve bir tutam tuzla ayrı bir kapta çırpılıyor. Roka, yarım narın taneleri ve ceviz sosla karıştırılıyor, beyaz peynir en son üzerine ufalanıyor. Pişirme gerektirmiyor.


    4 kişilik salata 10 dakikada hazır. Et yemeklerinin, pilavların ya da bir kase çorbanın yanına hafif bir eşlikçi olarak uygun.

    '
  editorNote: 'Peyniri sosla karıştırmak yerine en son üzerine ufalamayı seçtik; böylece peynir dağılıp sosu bulandırmıyor ve her lokmada ayrı bir tuz tadı olarak kalıyor. Sosu ayrı bir adımda çırpmamızın nedeni, nar ekşisinin yağla karışmadan rokaya dökülünce dibe çökmesi.

    '
  notes:
  - t: Rokayı kuru tutmak
    d: 'Yıkandıktan sonra yaprakların üzerinde kalan su, sosun yağının yapraklara tutunmasını engeller ve kasenin dibinde sulu bir birikinti oluşturur. Rokayı salata kurutucusunda çevirmek ya da temiz bir havluya sarıp hafifçe bastırmak bu sorunu çözer. Kalın saplar sert ve daha acı olabilir; onları ayıklayıp yaprakları iri doğramak yemeyi kolaylaştırır. Sosu servisten hemen önce ekle, çünkü roka hassas bir yeşillik ve sosla birkaç dakika bekleyince söner, hacmini kaybeder.

      '
  - t: Narı kolay ayıklamak
    d: 'Yarım narın tanelerini çıkarmanın pratik yolu, narı kesik yüzü avucuna gelecek şekilde bir kasenin üzerinde tutup kabuğuna tahta kaşıkla vurmaktır; taneler doğrudan kaseye dökülür. Aradaki beyaz zarlar acı olduğu için salataya karışmamalı, kasede yüzeye çıkanları ayıkla. Nar suyu elleri ve tezgahı boyayabilir; işi kasenin içinde yapmak sıçramayı azaltır. Nar ekşisi alırken içindekiler listesine bakıp yalnızca nardan yapılanı seçmek, sosun daha yoğun ve dengeli olmasını sağlar.

      '
  - t: Malzeme alternatifleri
    d: 'Beyaz peynir yerine tuzlanmış lor ya da tulum peyniri kullanabilirsin; tulum daha keskin bir tat verir. Ceviz yerine fındık ya da badem olur; fındığı tavada birkaç dakika kuru kavurmak aromasını belirginleştirir. Limon yoksa misket limonu ya da yarı ölçü elma sirkesi sosu dengeler. Rokanın acılığı sana fazla geliyorsa yarısını marul ya da göbek salatayla değiştirebilirsin; nar, ceviz ve peynir salatanın karakterini yine korur.

      '
  faq:
  - q: Narlı roka salatası sosu nasıl yapılır?
    a: 3 yemek kaşığı zeytinyağı, 1 yemek kaşığı nar ekşisi, yarım limonun suyu ve bir tutam tuz bir kapta çırpılır. Sos servisten hemen önce salataya eklenir.
  - q: Roka salatası önceden hazırlanır mı?
    a: Rokayı, narı ve cevizi ayrı ayrı hazırlayıp buzdolabında bekletebilirsin. Sosu ve peyniri servisten hemen önce ekle; soslu roka kısa sürede söner.
  - q: Roka salatasına hangi peynir yakışır?
    a: Bu tarifte beyaz peynir kullanılıyor; tuzlanmış lor ya da tulum peyniri de iyi gider. Peyniri karıştırmadan, en son üzerine ufala.
  - q: Narlı roka salatası kaç kişilik?
    a: 2 demet roka ve yarım narla hazırlanan bu ölçü 4 kişiye yetiyor ve 10 dakikada hazır oluyor.
nohutlu-pirinc-pilavi:
  aramaBasligi: 'Nohutlu pirinç pilavı tarifi: Tereyağlı, lokanta usulü'
  intro: 'Nohutlu pirinç pilavı, tereyağında kavrulan pirincin haşlanmış nohutla birlikte pişirildiği, lokantaların vazgeçilmez yan yemeği. Kuru fasulyeden tavuk ve et yemeklerine kadar pek çok tabağın yanına gider; nohut pilava hem doku hem tokluk katar.


    Bu tarifte baldo pirinç önce ılık tuzlu suda 30 dakika bekletilip suyu duru akana kadar yıkanıyor. Ardından 3 yemek kaşığı tereyağında 4 dakika kavruluyor, nohut, tuz ve 3 su bardağı sıcak tavuk suyu ya da suyla kısık ateşte suyunu çekene kadar pişiyor. Son olarak kapağın altına havlu konup 15 dakika demleniyor.


    4 kişilik pilav, 5 dakika hazırlık ve 25 dakika pişirmeyle toplam 30 dakikada hazır; pirinci ıslatma süresi buna dahil değil.

    '
  editorNote: 'Islatma ve yıkama adımını ayrı yazdık, çünkü pirincin yüzeyindeki nişasta gitmeden pişirilen pilav tane tane olmuyor, birbirine yapışıyor. Suyun sıcak eklenmesini de bu yüzden şart koyduk; soğuk su kavrulmuş pirincin ısısını düşürüp pişmeyi düzensizleştiriyor.

    '
  notes:
  - t: Tane tane pilavın mantığı
    d: 'Baldo pirinç nişastası bol bir pirinçtir. Ilık tuzlu suda bekletmek taneleri hafifçe nemlendirip eşit pişmesini sağlar, yıkamak ise yüzeydeki serbest nişastayı alır. Kavurma sırasında pirinç şeffaflaşmaya başladığında taneler yağla kaplanır ve pişerken birbirine yapışmaz. Suyu ekledikten sonra pilavı karıştırma; kaşık taneleri kırar ve nişastayı yeniden açığa çıkarır. Demleme sırasında kapağın altına konan havlu, buharın damlayıp pilavın üstünü ıslatmasını önler. Demleme bitmeden kapağı açma.

      '
  - t: Nohutu hazırlamak
    d: 'Tarifte haşlanmış nohut kullanılıyor. Kuru nohuttan başlıyorsan bir gece önceden ıslatıp ayrıca haşlaman gerekir; çiğ nohut pirinçle aynı sürede pişmez. Konserve ya da kavanoz nohut kullanacaksan süzüp bir kez yıka ki salamura suyu pilavın tadını değiştirmesin. Nohutu pirinçle birlikte suya eklemek, tereyağının ve tavuk suyunun lezzetini çekmesini sağlar. Kabuklarını soymak zorunlu değil, ama daha yumuşak bir doku istersen avucunda ovalayıp ayıklayabilirsin.

      '
  - t: Su oranı ve değişiklikler
    d: '2 su bardağı baldo pirince 3 su bardağı sıcak sıvı kullanılıyor. Osmancık pirinç kullanırsan suyu bir parmak azalt; bu pirinç baldo kadar su çekmez ve fazla suda lapalaşır. Tavuk suyu pilava lokanta tadını veren asıl malzeme; yoksa sıcak suya bir tatlı kaşığı tereyağı ve bir tutam tuz ya da yarım bulyon ekleyebilirsin. Şehriye eklemek istersen önce şehriyeyi kavur, ama bu durumda pilav glutensiz olmaz. Kalan pilavı ısıtırken üzerine birkaç kaşık su serp.

      '
  faq:
  - q: Pilav için pirinç kaç dakika ıslatılır?
    a: Bu tarifte pirinç ılık tuzlu suda 30 dakika bekletilir, ardından suyu duru akana kadar yıkanıp süzülür.
  - q: 2 su bardağı pirince kaç su bardağı su konur?
    a: 2 su bardağı baldo pirince 3 su bardağı sıcak tavuk suyu ya da su konur. Osmancık pirinç kullanırsan suyu bir parmak azalt.
  - q: Pilav neden lapa olur?
    a: Pirinç yıkanmadığında, fazla su konduğunda ya da pişerken karıştırıldığında pilav lapalaşır. Pirinci yıka, ölçüye uy ve suyu ekledikten sonra karıştırma.
  - q: Nohutlu pilav glutensiz mi?
    a: Pirinç, nohut, tereyağı ve suyla yapıldığında glutensizdir. Şehriye eklersen glutensiz olmaz; hazır bulyon kullanacaksan etiketini kontrol et.
pacanga-boregi:
  aramaBasligi: 'Paçanga böreği tarifi: Pastırmalı, kaşarlı ve çıtır'
  intro: 'Paçanga böreği, pastırma ve kaşarın yufkaya sarılıp kızartıldığı bir ara sıcak. Meyhane sofralarında sıcak mezelerin arasında sıkça yer alır; dışı çıtır, içi erimiş peynirli ve pastırmanın baharatlı tadıyla öne çıkar.


    Bu tarifte 2 yufka 8''er üçgene kesiliyor. Her üçgenin geniş ucuna bir dilim pastırma, rendelenmiş kaşar, çekirdeği alınmış küp domates ve ince doğranmış sivri biber konuyor. Sigara böreği gibi sarılan börekler çırpılmış yumurtayla yapıştırılıp orta ateşte kızgın yağda altın rengini alana kadar kızartılıyor. Airfryer''da üzerine yağ sürerek 190°C''de 10-12 dakikada da pişirilebiliyor.


    10 dakika hazırlık ve 15 dakika pişirmeyle 4 kişilik börekler toplam 25 dakikada hazır.

    '
  editorNote: 'Domatesin çekirdeklerini çıkarma işini iç harç adımına özellikle ekledik, çünkü domates suyu yufkayı içeriden ıslatıp kızartırken yırtılmasına ve yağ çekmesine yol açıyor. Sigara gibi ince sarmayı seçtik; ince rulo yağda her yüzünün eşit kızarmasını kolaylaştırıyor.

    '
  notes:
  - t: Kızartma ısısı
    d: 'Yağ yeterince ısınmadan börekleri atarsan yufka yağı emer, ağır ve yumuşak olur. Yağın hazır olduğunu anlamak için küçük bir yufka parçası at; hemen cızırdayıp yüzeye çıkıyorsa doğru sıcaklıktadır. Tavayı kalabalık etme, birkaç böreği aynı anda kızartıp çevir; çok sayıda börek yağın ısısını düşürür. Ateşi fazla yükseltmek de hata: dış yüzey hızla koyulaşırken içerideki kaşar erimeye fırsat bulamaz. Kızaran börekleri kağıt havluya alıp fazla yağı süzdür.

      '
  - t: İç harçta dikkat edilecekler
    d: 'Pastırmanın çemen kaplaması yoğun ve baskın bir tat verir; daha yumuşak bir aroma istiyorsan dilimlerin kenarındaki çemeni biraz sıyırabilirsin. Kaşarı rendelemek, dilim kullanmaya göre daha hızlı ve eşit erimesini sağlar. Domatesin hem çekirdeklerini hem fazla suyunu almak önemli; aksi halde yufka yumuşar. İç malzemeyi fazla koymaktan kaçın, eriyen kaşar taşar ve yağa karışır. Kenarları içe katlayıp sıkıca sarmak peynirin dışarı akmasını önler.

      '
  - t: Alternatifler ve servis
    d: 'Pastırma yerine sucuk ya da füme hindi, kaşar yerine mozzarella ya da tost peyniri kullanabilirsin; önemli olan eriyen bir peynir seçmek. Kızartma istemiyorsan börekleri yağlı kağıda dizip üzerine yağ sür ve airfryer''da 190°C''de 10-12 dakika, yarısında çevirerek pişir. Paçanga sıcakken en lezzetlidir; peynir soğudukça sertleşir. Börekleri önceden sarıp buzdolabında kısa süre bekletebilir, misafir geldiğinde kızartabilirsin. Yanına közlenmiş biber ya da ayran yakışır.

      '
  faq:
  - q: Paçanga böreği airfryer'da kaç dakika pişer?
    a: Yağlı kağıda dizilip üzerine yağ sürülen börekler 190°C'de 10-12 dakika, yarısında çevrilerek pişer.
  - q: Paçanga böreği neden yağ çeker?
    a: Yağ yeterince kızgın olmadığında ya da domatesin suyu alınmadığında yufka yağ emer. Börekleri kızgın yağda kızart ve domatesin çekirdeklerini çıkar.
  - q: Paçanga böreğinde pastırma yerine ne kullanılır?
    a: Sucuk ya da füme hindi kullanılabilir. Kaşar yerine de mozzarella ya da tost peyniri olur.
  - q: Paçanga böreği önceden hazırlanır mı?
    a: Börekleri sarıp buzdolabında kısa süre bekletebilir, servisten hemen önce kızartabilirsin. Kızarmış börek en iyi sıcakken yenir.
paella:
  aramaBasligi: 'Paella tarifi: Tavuklu, karidesli ve safranlı'
  intro: 'Paella, İspanya''nın Valensiya bölgesinden çıkan, geniş ve sığ bir tavada pişirilen safranlı pirinç yemeği. Adını da pişirildiği tavadan alır. Geleneksel olarak sofranın ortasına tavasıyla konur ve herkes oradan alır.


    Bu tarifte kuşbaşı tavuk but, karides, isteğe bağlı midye ve bezelye bir arada kullanılıyor. Önce tavuk kızartılıyor, ardından soğan, kapya biber, sarımsak, domates ve paprikayla sofrito adı verilen sos tabanı hazırlanıyor. Pirinç safranlı tavuk suyuyla eklendikten sonra hiç karıştırılmadan 15 dakika, deniz ürünleriyle 10 dakika daha pişiyor ve 5 dakika dinleniyor.


    4 kişilik paella, 20 dakika hazırlık ve 40 dakika pişirmeyle toplam 60 dakikada hazır; limonla servis ediliyor.

    '
  editorNote: 'Pirinci ekledikten sonra "bundan sonra karıştırma" uyarısını adımın içine açıkça yazdık, çünkü pilav ve risotto alışkanlığıyla tavayı karıştırmak paellanın dokusunu ve dipteki kızarmayı bozan en yaygın hata. Deniz ürünlerini sona bırakmamızın nedeni de karidesin uzun pişince sertleşmesi.

    '
  notes:
  - t: Socarrat ve tava
    d: 'Paellanın dibinde hafifçe kızarıp çıtırlaşan pirinç tabakasına socarrat denir ve yemeğin en sevilen kısmıdır. Bunun oluşması için pirinç ince bir katman halinde geniş bir tavaya yayılmalı ve su eklendikten sonra karıştırılmamalı. Pişirmenin sonuna doğru tavadan hafif bir çıtırtı sesi gelir; bu, dipteki tabakanın kızardığını gösterir. Yanık kokusu almaya başlarsan ocağı hemen kapat. Derin bir tencere kullanırsan pirinç katmanı kalınlaşır; üst kısım lapalaşırken alt kısım yanabilir.

      '
  - t: Safranı doğru kullanmak
    d: 'Safran sıvıda çözündükçe rengini ve aromasını bırakır; bu yüzden tarifte önce sıcak tavuk suyunda demleniyor. İplikleri doğrudan tavaya atmak, rengin pirince eşit dağılmamasına yol açar. Az miktarı yeterlidir; fazlası yemeğe acımsı bir tat verebilir. Safran bulamazsan bir tutam zerdeçal rengi yakalar, ama aroması aynı olmaz. Tatlı toz kırmızı biber ise sofritoya hem renk hem hafif bir derinlik katar; yerine acı pul biber kullanma, tadı değiştirir.

      '
  - t: Malzeme alternatifleri
    d: 'Paella pirinci bulamazsan baldo pirinç kullanabilirsin; osmancık kullanırsan suyu bir parmak azalt. Tavuk but yerine göğüs kullanacaksan pişirme süresini biraz kısalt, göğüs eti çabuk kurur. Karides yerine kalamar halkası ya da kuşbaşı tavuk göğsü olur; midye isteğe bağlı. Dondurulmuş bezelyeyi pişirmenin son 10 dakikasında eklemek rengini korur. Midyeleri kullanmadan önce iyice temizle ve pişince kabuğu açılmayanları ayır. Limonu servis sırasında herkes kendi tabağına sıksın.

      '
  faq:
  - q: Paella kaç dakikada pişer?
    a: Pirinç safranlı suyla 15 dakika, deniz ürünleri eklendikten sonra 10 dakika daha pişer ve 5 dakika dinlenir. Hazırlıkla birlikte toplam süre 60 dakika.
  - q: Paella yapılırken pirinç karıştırılır mı?
    a: Hayır. Pirinci 1 dakika çevirip safranlı suyu döktükten sonra karıştırma; karıştırırsan risottoya döner ve dipteki kızarık tabaka oluşmaz.
  - q: Paella için hangi pirinç kullanılır?
    a: En iyisi paella pirinci; bulamazsan baldo pirinç kullanabilirsin. Osmancık pirinçte suyu bir parmak azalt.
  - q: Paellada safran yerine ne kullanılır?
    a: Renk için bir tutam zerdeçal kullanılabilir. Göze benzer görünür, ama safranın aromasını vermez.
papaz-yahnisi:
  aramaBasligi: 'Papaz yahnisi tarifi: Arpacık soğanlı, sirkeli dana yahni'
  intro: 'Papaz yahnisi, bol soğan ve sirkeyle uzun süre pişirilen, sulu ve hafif ekşimtırak bir et yemeği. Eski İstanbul mutfağıyla anılan bu yahninin karakterini defne, yenibahar ve kimyonun oluşturduğu sıcak baharat dengesi belirler.


    Bu tarifte 600 g dana kuşbaşı tereyağında suyunu çekene kadar kavruluyor, ardından arpacık soğanlar bütün olarak ya da kuru soğan iri doğranarak sarımsakla ekleniyor. Salça, üzüm sirkesi ve baharatlar konduktan sonra 2 su bardağı sıcak suyla kapağı kapalı, kısık ateşte 75 dakika pişiyor.


    4 kişilik yahni, 20 dakika hazırlık ve 90 dakika pişirmeyle toplam 110 dakikada hazır. Yanına sade pilav ya da patates püresi yakışıyor.

    '
  editorNote: 'Soğanı et kavrulduktan sonra ayrı bir adımda eklemeyi seçtik; arpacıkların bütün kalıp sosta dağılmadan pişmesi bu yemeğin görüntüsünü belirliyor. Sirkeyi suyla birlikte değil baharatlarla aynı anda koyduk ki uzun pişirmede keskinliği yumuşasın.

    '
  notes:
  - t: Arpacık soğanı soymak
    d: 'Arpacık soğanlar küçük olduğu için soyması zahmetli olabilir. Kolay yol, soğanları 1-2 dakika kaynar suda bekletip soğuk suya almak; kabuk gevşer ve kolayca sıyrılır. Kök kısmını tamamen kesip atma, yalnızca ince bir dilim al; kök soğanı bir arada tutar ve uzun pişirmede dağılmasını önler. Arpacık bulamazsan 3 kuru soğanı iri doğrayarak kullanabilirsin; bu durumda soğanlar sosa daha çok karışır ve yemek daha koyu kıvamlı olur.

      '
  - t: Uzun ve kısık pişirme
    d: 'Dana kuşbaşı kısık ateşte, kapağı kapalı pişirildiğinde bağ dokusu yavaş yavaş çözülür ve et yumuşar. Ateşi yükseltip süreyi kısaltmaya çalışmak eti sertleştirir. 75 dakikalık pişirme boyunca birkaç kez kontrol et; su çok azalırsa biraz sıcak su ekle, soğuk su pişmeyi yavaşlatır. Sirke etin yumuşamasına da yardım eder. Sosun koyulaşması ve etin çatalla kolayca bölünmesi yemeğin hazır olduğunu gösterir. Düdüklü tencerede süre kısalır, ama soğanlar daha çok dağılabilir.

      '
  - t: Baharat ve alternatifler
    d: 'Yenibahar tanesi, defne ve kimyon bu yahninin kendine has kokusunu verir. Yenibahar yoksa bir tutam tarçın ve bir tutam karanfille benzer bir sıcaklık elde edebilirsin. Sirke yerine yarı ölçü limon suyu kullanılabilir, ama sirkenin ekşiliği daha belirgindir. Dana yerine kuzu eti olur; tavuk but kullanırsan süreyi yarıya indir. Defne yapraklarını ve yenibahar tanelerini servisten önce çıkarmak, yerken ağza gelmelerini önler. Yahni ertesi gün ısıtıldığında tatlar daha da oturur.

      '
  faq:
  - q: Papaz yahnisi kaç dakika pişer?
    a: Et 10 dakika kavrulduktan sonra sıcak su eklenip kısık ateşte 75 dakika pişer. Toplam pişirme süresi 90 dakika.
  - q: Papaz yahnisine neden sirke konur?
    a: Sirke yemeğe kendine has ekşimtırak tadını verir ve etin yumuşamasına yardım eder. Bu tarifte 2 yemek kaşığı üzüm sirkesi kullanılıyor.
  - q: Papaz yahnisi hangi etle yapılır?
    a: Bu tarifte dana kuşbaşı kullanılıyor; kuzu eti de olur. Tavuk butla yaparsan pişirme süresini yarıya indir.
  - q: Papaz yahnisinin yanına ne gider?
    a: Sade pirinç pilavı ya da patates püresi, yahninin sulu sosunu iyi çeker.
patates-corbasi:
  aramaBasligi: 'Patates çorbası tarifi: Sütlü, kremasız, 35 dakikada'
  intro: 'Patates çorbası, haşlanan patatesin blenderdan geçirilip sütle inceltildiği, kremamsı kıvamlı bir çorba. Malzemesi neredeyse her evde bulunduğu için soğuk günlerde ve yorgun akşamlarda sık yapılan, çocukların da sevdiği çorbalardan.


    Bu tarifte tereyağında yumuşatılan soğan ve havuca 4 küp patates, 4 su bardağı sıcak su ve tuz ekleniyor; patatesler dağılana kadar 20 dakika pişiyor. Sonra çorba blenderdan geçiriliyor, 1 su bardağı süt eklenip bir taşım kaynatılıyor. Krema ya da un kullanılmıyor; kıvamı patatesin kendi nişastası veriyor. İsteyen üzerine rendelenmiş kaşar serpebilir.


    4 kişilik çorba, 10 dakika hazırlık ve 25 dakika pişirmeyle toplam 35 dakikada hazır.

    '
  editorNote: 'Sütü blenderdan sonra ekleyip yalnızca bir taşım kaynatmayı seçtik; süt uzun kaynarsa dibi tutabiliyor ve kesilme riski artıyor. Havucu tarifte tutmamızın nedeni, çorbaya hafif bir tatlılık ve sıcak bir renk vermesi.

    '
  notes:
  - t: Kıvamı ayarlamak
    d: 'Bu çorbada kıvam tamamen patatesten gelir. Patatesler iyice dağılmadan blenderdan geçirirsen çorba taneli ve sulu olur; çatalla bastırdığında kolayca eziliyorsa hazırdır. Blenderdan sonra çorba sana koyu gelirse biraz sıcak su ya da süt ekleyerek incelt; çok sulu kaldıysa kapağı açık birkaç dakika daha kaynat. El blenderı kullanırken tencereyi ocaktan al ve bıçağı tamamen çorbanın içinde tut; böylece sıçrama ve yanma riski azalır.

      '
  - t: Patates seçimi
    d: 'Unlu, nişastası yüksek patatesler pişince kolay dağılır ve çorbaya kadifemsi bir kıvam verir. Sert, mumsu patatesler şeklini korumaya eğilimlidir ve daha uzun pişmeleri gerekir. Patatesleri eşit boyda küp doğramak, hepsinin aynı anda pişmesini sağlar. Patatesi blenderda gereğinden uzun çekmek dokuyu yapışkanlaştırabilir, pürüzsüz olduğu an dur. Kalan haşlanmış patatesin varsa onu da kullanabilirsin; bu durumda pişirme süresi kısalır. Biraz kekik ya da muskat çorbaya çok yakışır.

      '
  - t: Saklama ve alternatifler
    d: 'Çorba buzdolabında kapalı bir kapta saklanabilir; soğudukça koyulaşır, ısıtırken biraz su ya da süt eklemen gerekir. Süt yerine laktozsuz süt birebir kullanılabilir. Vegan bir versiyon için yulaf ya da badem sütü ve tereyağı yerine ¾ ölçü zeytinyağı kullan, kaşarı da atla. Kaşar yerine mozzarella ya da tost peyniri olur. Kuru soğan yerine arpacık ya da mor soğan çorbaya biraz daha tatlı bir tat verir. Peyniri tencereye değil her kaseye ayrı serpmek, saklanacak çorbanın kıvamını bozmaz.

      '
  faq:
  - q: Patates çorbası kaç dakikada pişer?
    a: Patatesler sıcak suda dağılana kadar yaklaşık 20 dakika pişer. Hazırlıkla birlikte toplam süre 35 dakika.
  - q: Patates çorbası unsuz nasıl koyulaşır?
    a: Patatesin nişastası yeterli kıvamı verir. Patatesleri iyice dağılana kadar pişirip blenderdan geçirmen yeterli.
  - q: Patates çorbasına süt ne zaman eklenir?
    a: Çorba blenderdan geçirildikten sonra 1 su bardağı süt eklenir ve yalnızca bir taşım kaynatılır.
  - q: Patates çorbası vegan yapılır mı?
    a: Evet. Süt yerine yulaf ya da badem sütü, tereyağı yerine zeytinyağı kullan ve kaşarı ekleme.
patates-gnocchi:
  aramaBasligi: 'Patates gnocchi tarifi: Evde, tereyağlı adaçayı sosla'
  intro: 'Gnocchi, İtalyan mutfağının patates ve unla yapılan küçük hamur topları. Haşlandıktan sonra sosla çevrilir; yumuşak ve hafif dokusuyla makarnadan farklı bir tabak sunar. En sade servis şekillerinden biri, tereyağında kızdırılan adaçayı ve parmesanla.


    Bu tarifte 700 g unlu patates kabuğuyla haşlanıyor ya da fırınlanıyor, sıcakken soyulup eziliyor. Ilık patatese tuz, yumurta sarısı ve yaklaşık 1,5 su bardağı un azar azar eklenerek yumuşak bir hamur toplanıyor. Hamur şeritler halinde yuvarlanıp 2 cm''lik parçalara kesiliyor, çatalla çizgi verilip kaynar tuzlu suda yüzeye çıkana kadar haşlanıyor.


    4 kişilik gnocchi, 40 dakika hazırlık ve 15 dakika pişirmeyle toplam 55 dakikada hazır.

    '
  editorNote: 'Un miktarını "yaklaşık" diye yazdık, çünkü patatesin taşıdığı nem her seferinde farklı ve gereken un buna göre değişiyor. Hamuru fazla yoğurmama uyarısını adıma koymamızın nedeni, fazla yoğrulan ve fazla un alan gnocchinin sertleşmesi.

    '
  notes:
  - t: Patates ve nem
    d: 'Gnocchinin yumuşak olması patatesin ne kadar kuru olduğuna bağlı. Unlu patatesler pişince kuru ve kabarık bir iç verir; sulu patates daha çok un ister ve hamur ağırlaşır. Patatesi kabuğuyla haşlamak ya da fırınlamak içine su girmesini engeller. Sıcakken soyup ezmek, buharın çıkıp fazla nemin uçmasını sağlar. Ezdikten sonra patatesi tezgaha yayıp ılımaya bırakmak hem yumurta sarısının pişmesini önler hem de hamurun daha az un çekmesine yardım eder.

      '
  - t: Hamurun kıvamı
    d: 'Unu bir anda değil, azar azar ekle ve hamur ele yapışmayı bıraktığı an dur. Yumuşak, hafif nemli bir hamur doğru kıvamdır. Fazla un ve uzun yoğurma hamurdaki glüteni geliştirir; gnocchi lastik gibi ve sert olur. Kıvamdan emin değilsen tek bir parçayı kaynar suya atıp dene: dağılıyorsa biraz daha un ekle, sağlam kalıyorsa devam et. Çatalla verilen çizgiler yalnızca süs değil; sosun gnocchiye tutunmasını kolaylaştırır.

      '
  - t: Haşlama ve saklama
    d: 'Gnocchileri kaynayan tuzlu suya küçük partiler halinde at; tencereyi kalabalık edersen su soğur ve parçalar birbirine yapışır. Yüzeye çıktıktan 1 dakika sonra kevgirle al. Şekillendirdiğin ama haşlamadığın gnocchileri unlanmış bir tepsiye tek kat dizip dondurabilir, donunca poşete aktarabilirsin; pişirirken çözdürmeden doğrudan kaynar suya at. Parmesan yerine eski kaşar ya da kuru tulum peyniri olur. Domates sosu ya da pesto da adaçayına iyi bir alternatif.

      '
  faq:
  - q: Gnocchi kaç dakika haşlanır?
    a: Kaynayan tuzlu suya atılan gnocchiler yüzeye çıktıktan sonra 1 dakika daha haşlanır; toplamda yaklaşık 3 dakika sürer.
  - q: Gnocchi neden sert olur?
    a: Hamura fazla un eklendiğinde ya da hamur fazla yoğrulduğunda gnocchi sertleşir. Unu azar azar ekle ve hamur ele yapışmayı bırakınca dur.
  - q: Gnocchi için hangi patates kullanılır?
    a: Unlu, nişastası yüksek patatesler en iyi sonucu verir. Patatesi kabuğuyla haşlamak ya da fırınlamak su çekmesini önler.
  - q: Gnocchi dondurulur mu?
    a: Evet, haşlanmadan önce unlu tepsiye tek kat dizilip dondurulabilir. Pişirirken çözdürmeden doğrudan kaynar suya at.
patlicanli-pilav:
  aramaBasligi: 'Patlıcanlı pilav tarifi: Domatesli, zeytinyağlı ve vegan'
  intro: 'Patlıcanlı pilav, kızartılmış patlıcan küplerinin domatesli pirinç pilavıyla birlikte demlendiği bir yaz yemeği. Patlıcanın bol olduğu yaz sonunda sık yapılır; tek başına bir öğün olacak kadar doyurucudur ve soğuk da yenebilir.


    Bu tarifte 2 patlıcan küp doğranıp tuzlu suda 15 dakika bekletiliyor, kurulanıp fırında ya da az yağda kızartılıyor. Zeytinyağında soğanla kavrulan pirince rendelenmiş domates, yenibahar, karabiber, tuz ve 2,5 su bardağı sıcak su ekleniyor. Pilav suyunu çekince patlıcanlar ve dereotu üzerine yayılıp kapak kapalı 15 dakika demleniyor.


    4 kişilik pilav, 25 dakika hazırlık ve 30 dakika pişirmeyle toplam 55 dakikada hazır. Zeytinyağıyla yapıldığı için vegan ve glutensiz.

    '
  editorNote: 'Patlıcanları pirinçle birlikte pişirmek yerine demlenme aşamasında üzerine yaymayı seçtik; böylece küpler dağılmıyor ve pilavın içinde ayrı ayrı seçiliyor. Patlıcanı tuzlu suda bekletme adımını da ayrı yazdık, çünkü kızartırken daha az yağ çekmesini sağlıyor.

    '
  notes:
  - t: Patlıcanı hazırlamak
    d: 'Küp doğranmış patlıcanı tuzlu suda bekletmek, kızartırken daha az yağ emmesine ve acılığının azalmasına yardım eder. Bekledikten sonra küpleri temiz bir havluyla iyice kurula; ıslak patlıcan yağda sıçrar ve kızarmak yerine haşlanır. Daha hafif bir sonuç istiyorsan küpleri fırın tepsisine yayıp üzerine biraz zeytinyağı gezdir ve fırında kızarana kadar pişir. Tavada kızartıyorsan patlıcanlar altın rengini aldığında kağıt havluya alıp fazla yağı süzdür.

      '
  - t: Pirinç ve demleme
    d: 'Pirinci ıslatıp süzerek kullanmak yüzeydeki nişastayı azaltır ve pilavın tane tane olmasını sağlar. Soğanla birlikte 3 dakika kavurmak taneleri yağla kaplar. Rendelenmiş domates pilavın rengini ve hafif ekşiliğini verir; kışın taze domates yerine konserve küp domates kullanabilirsin. Suyu ekledikten sonra kısık ateşte, karıştırmadan pişir. Patlıcan ve dereotunu ekledikten sonraki 15 dakikalık demleme, patlıcanın pilavın buharıyla ısınıp tadını pirince geçirmesi için gerekli. Osmancık pirinçte suyu bir parmak azalt.

      '
  - t: Servis ve alternatifler
    d: 'Patlıcanlı pilav zeytinyağlı olduğu için sıcak, ılık ya da soğuk yenebilir; soğukken meze gibi servis edebilirsin. Yanına yoğurt ya da cacık yakışır; vegan kalmasını istiyorsan bitkisel yoğurt seç. Pilav buzdolabında kapalı bir kapta saklanabilir. Dereotu yoksa maydanoz ve biraz taze nane kullanabilirsin. Yenibahar yerine bir tutam tarçın ve bir tutam karanfil benzer bir aroma verir. Kuru soğan yerine arpacık ya da mor soğan pilava biraz daha tatlılık katar.

      '
  faq:
  - q: Patlıcanlı pilav için patlıcan nasıl kızartılır?
    a: Küp doğranan patlıcan tuzlu suda 15 dakika bekletilir, kurulanır ve fırında ya da az yağda kızartılır.
  - q: Patlıcanlı pilavda patlıcan ne zaman eklenir?
    a: Pilav suyunu çektikten sonra patlıcanlar dereotuyla birlikte üzerine yayılır ve kapak kapalı 15 dakika demlenir. Böylece dağılmazlar.
  - q: 1,5 su bardağı pirince kaç bardak su konur?
    a: Bu tarifte 1,5 su bardağı baldo pirince 2,5 su bardağı sıcak su kullanılıyor.
  - q: Patlıcanlı pilav soğuk yenir mi?
    a: Evet. Zeytinyağıyla yapıldığı için soğuk da yenir ve meze gibi servis edilebilir.
pazi-kavurmasi:
  aramaBasligi: 'Pazı kavurması tarifi: Karadeniz usulü, soğanlı ve yoğurtlu'
  intro: 'Pazı kavurması, Karadeniz mutfağının en pratik yeşil yemeklerinden biri. Pazının yaprakları ve sapları soğan ve tereyağıyla kavrulur; üzerine yoğurt, yanında mısır ekmeğiyle sade ama doyurucu bir öğün olur.


    Bu tarifte yaklaşık 750 g''lık bir demet pazı yıkanıp sapları ince, yaprakları iri doğranıyor, tuzlu kaynar suda 3 dakika haşlanıp suyu elle sıkılıyor. Tereyağı ve zeytinyağında soğan ve sarımsak yumuşatıldıktan sonra pazı ekleniyor; istenirse biraz pirinç ya da mısır unu serpilip 8-10 dakika kavruluyor, tuz ve pul biberle tatlandırılıyor.


    4 kişilik kavurma, 15 dakika hazırlık ve 15 dakika pişirmeyle toplam 30 dakikada hazır. Ilık olarak yoğurt, limon ve mısır ekmeğiyle servis ediliyor.

    '
  editorNote: 'Pazıyı kavurmadan önce 3 dakika haşlama adımını ayrı yazdık; ön haşlama yaprağın acımsı tadını alıyor ve rengini canlı tutuyor. Sapları ince, yaprakları iri doğramayı da bu yüzden seçtik: saplar daha geç yumuşadığı için ince kıyılınca yapraklarla aynı anda pişiyor.

    '
  notes:
  - t: Haşlayıp sıkmak
    d: 'Pazı çok su tutan bir yeşilliktir. Haşladıktan sonra suyunu elinle iyice sıkmazsan tavada kavrulmak yerine kendi suyunda haşlanır ve yemek sulu kalır. Sıcak pazıyı biraz ılıtıp avuçlarının arasında top yapar gibi sıkmak en kolay yöntem. Haşlama süresini uzatma; 3 dakika yaprağı yumuşatmaya yeter, fazlası rengini koyulaştırır ve dokuyu lapalaştırır. Bol suda yıkama adımı da önemli, çünkü kıvrımlı yapraklarda toprak ve kum kalabilir.

      '
  - t: Un serpmenin görevi
    d: 'İsteğe bağlı olarak serpilen pirinç ya da mısır unu, pazının bıraktığı son suyu çeker ve kavurmaya hafif bir bağ verir. Bu, yemeği Karadeniz''de pazı diblesi diye de bilinen yapılışa yaklaştırır. Unu serptikten sonra karıştırmaya devam et ki topaklanmasın ve dibe yapışmasın. Glutensiz kalması gerekiyorsa pirinç ya da mısır unu kullan; ince irmik ya da buğday unu da olur, ama tarif glutensiz olmaktan çıkar. Unsuz yapılan kavurma daha hafif ve dağınık olur.

      '
  - t: Servis ve değişiklikler
    d: 'Pazı kavurması ılık servis edildiğinde yoğurtla daha iyi uyum sağlar; çok sıcak kavurmanın üzerine konan yoğurt sulanabilir. Limon suyu tereyağının ağırlığını dengeler. Üzerine bir yumurta kırıp kapağı kapatarak pişirirsen kahvaltılık bir tabağa dönüşür. Pul biberin miktarını damak tadına göre ayarlayabilirsin. Vegan bir tabak için yoğurt yerine soya ya da hindistan cevizi yoğurdu, tereyağı yerine ¾ ölçü zeytinyağı kullanılabilir. Kuru soğan yerine arpacık ya da mor soğan da olur.

      '
  faq:
  - q: Pazı kaç dakika haşlanır?
    a: Doğranmış pazı tuzlu kaynar suda 3 dakika haşlanır, ardından süzülüp suyu elle sıkılır.
  - q: Pazı kavurması neden sulu olur?
    a: Haşlanan pazının suyu iyice sıkılmadığında tavada kavrulmak yerine haşlanır. Suyunu sık; istersen kavururken biraz pirinç ya da mısır unu serp.
  - q: Pazının acılığı nasıl alınır?
    a: Kavurmadan önce tuzlu kaynar suda 3 dakika haşlamak acılığı alır ve rengini canlı tutar.
  - q: Pazı kavurmasının yanına ne gider?
    a: Yoğurt, limon ve mısır ekmeği klasik eşlikçileridir. Üzerine yumurta kırarak kahvaltılık da yapabilirsin.
pitaya-chia-bowl:
  aramaBasligi: 'Pitaya chia bowl tarifi: Chia pudingli pembe smoothie bowl'
  intro: 'Pitaya chia bowl, dondurulmuş ejder meyvesiyle (pitaya) hazırlanan koyu kıvamlı bir smoothie''nin chia pudingin üzerine yayıldığı, granola ve tropik meyvelerle süslenen bir kase. Canlı pembe rengini pitayadan, tokluğunu alttaki chia puding katmanından alıyor. Kahvaltı olarak da öğleden sonra tatlısı olarak da yenebiliyor.


    Bu tarifte chia tohumu hindistan cevizi sütü, şurup ve vanilyayla karıştırılıp buzdolabında en az 2 saat bekletiliyor. Servis anında dondurulmuş pitaya, dondurulmuş muz ve hindistan cevizi suyu blenderda kaşıkla yenecek kıvama getirilip pudingin üzerine yayılıyor.


    2 kişilik kaselerin hazırlığı 10 dakika, pişirme yok; chia pudingin en az 2 saatlik dinlenme süresi buna ek. Tarif vegan; glutensiz granolayla glutensiz de oluyor.

    '
  editorNote: 'Chia pudingi ayrı ve önceden yapılan bir adım olarak yazdık, çünkü tohumların sıvıyı çekip koyulaşması en az 2 saat sürüyor; sabah hızlı bir kahvaltı için akşamdan hazırlamak en pratiği. Smoothie''de sıvıyı azar azar ekleme uyarısını da kasede akmayan, yoğun bir kıvam için koyduk.

    '
  notes:
  - t: Chia pudingin kıvamı
    d: 'Chia tohumları sıvıyla karıştırıldığında yüzeylerinde jel benzeri bir tabaka oluşur ve sıvıyı çekerek koyulaşır. İlk karıştırmadan 5 dakika sonra bir kez daha karıştırmak önemli; aksi halde tohumlar dipte topaklanır ve pudingin bir kısmı sulu kalır. En az 2 saat buzdolabında bekletmek gerekir, bir gece beklerse kıvam daha düzgün olur. Puding çok koyulaştıysa biraz hindistan cevizi sütü ekleyip karıştır; sulu kaldıysa biraz daha bekletip tekrar kontrol et.

      '
  - t: Yoğun smoothie için
    d: 'Smoothie bowl''un bardakta içilen smoothie''den farkı, kaşıkla yenecek kadar yoğun olması ve süslerin üstünde batmadan durmasıdır. Bunun için hem pitaya hem muz donmuş olmalı; taze muz kullanırsan karışım sulanır. Blenderı sıvıyı azar azar ekleyerek çalıştır, gerekirse durdurup kenarları kaşıkla indir. Ne kadar az sıvıyla çekersen kasede o kadar yoğun durur. Pitaya püresi bulamazsan donmuş çilek ve ahududu benzer bir pembe verir; böğürtlen de kullanılabilir, ama renk mora çalar.

      '
  - t: Süsleme ve servis
    d: 'Granolayı servisten hemen önce ekle; smoothie''nin üstünde beklerse nemlenip çıtırlığını kaybeder. Etiketinde glutensiz yazan bir granola seçersen tarif glutensiz kalır. Meyveleri ve hindistan cevizi pulunu sıralar halinde dizmek hem görünümü düzenler hem de her kaşıkta farklı bir tat almanı sağlar. Smoothie katmanı hızla erir, bu yüzden kaseyi hazırladıktan sonra bekletme. Daha tatlı istersen üzerine fıstık ezmesi gezdirebilirsin; bal eklersen tarif vegan olmaktan çıkar.

      '
  faq:
  - q: Chia puding kaç saat bekletilir?
    a: Buzdolabında en az 2 saat bekletilmesi gerekir. En iyi sonuç için bir gece önceden hazırlayabilirsin.
  - q: Smoothie bowl nasıl koyu olur?
    a: Dondurulmuş pitaya ve dondurulmuş muz kullan, sıvıyı blenderda azar azar ekle. Ne kadar az sıvı kullanırsan kıvam o kadar yoğun olur.
  - q: Pitaya yerine ne kullanılır?
    a: Donmuş çilek ve ahududu benzer bir pembe renk verir. Dondurulmuş böğürtlen ya da frambuaz da kullanılabilir.
  - q: Pitaya chia bowl vegan mı?
    a: Evet, hindistan cevizi sütü ve bitkisel şurupla hazırlandığı için vegan. Üzerine bal eklersen vegan olmaz.
ratatouille:
  aramaBasligi: 'Ratatouille tarifi: Fırında spiral dizilmiş sebze yemeği'
  intro: 'Ratatouille, Fransa''nın Provence bölgesine ait, patlıcan, kabak, biber ve domatesle hazırlanan bir sebze yemeği. Yaz sebzelerinin bol olduğu dönemin yemeğidir; bizdeki türlüye benzer, ama zeytinyağı, sarımsak, kekik ve biberiye gibi otlarla daha belirgin bir aroma taşır.


    Bu tarifte sebzeler tencerede karıştırılarak değil, fırın kabında dizilerek pişiyor. Önce soğan, kapya biber, sarımsak ve iki domatesin rendesiyle bir taban sos hazırlanıyor. Patlıcan, kabak ve kalan domatesler ince yuvarlaklar halinde dilimlenip sosun üzerine spiral şeklinde diziliyor, pişirme kağıdıyla örtülüp 180°C''de 35 dakika, kağıt alınınca 10 dakika daha pişiyor.


    4 kişilik ratatouille, 25 dakika hazırlık ve 45 dakika pişirmeyle toplam 70 dakikada hazır. Vegan ve glutensiz.

    '
  editorNote: 'Sebzeleri dilimleyip spiral dizdiğimiz bu fırın versiyonunu seçtik; dilimlerin eşit kalınlıkta olması her sebzenin aynı sürede pişmesini sağlıyor. Pişirme kağıdıyla örtme adımını da ekledik, çünkü sebzeler önce kendi buharında yumuşuyor, kağıt alınınca üstleri hafifçe kızarıyor.

    '
  notes:
  - t: Eşit dilimlemek
    d: 'Bu yemeğin görüntüsü ve dokusu dilimlerin eşitliğine bağlı. Kalın dilimler pişmeden kalırken ince olanlar dağılabilir. Patlıcan, kabak ve domatesi aynı kalınlıkta kesmek için keskin bir bıçak ya da mandolin kullanabilirsin; mandolinde parmak koruyucusunu ihmal etme. Mümkünse çapları birbirine yakın sebzeler seç; böylece spiral dizerken dilimler düzgün sıralanır. Dilimleri birbirine yaslayarak, hafifçe üst üste bindirerek dizmek pişerken açılmalarını önler. Dizmeye kabın dış kenarından başlayıp içe doğru ilerlemek işini kolaylaştırır.

      '
  - t: Taban sosun önemi
    d: 'Fırın kabının dibine yayılan sos sebzelerin altını yanmaktan korur ve pişerken onlara nem ve tat verir. Soğan, biber ve sarımsağı acele etmeden yumuşatmak, domatesi ekledikten sonra 10 dakika pişirerek suyunu biraz çektirmek sosu koyulaştırır. Sulu kalan bir sos kabın dibinde birikir ve sebzeler fırınlanmak yerine haşlanır. Kapya biber yerine kırmızı dolmalık biber ya da közlenmiş kavanoz biber kullanabilirsin; közlenmiş biber sosa hafif is aroması katar. Kışın konserve küp domates daha lezzetli olur.

      '
  - t: Servis ve saklama
    d: 'Ratatouille sıcak, ılık ya da soğuk yenebilir ve dinlendikçe tatları birbirine geçer; ertesi gün çoğu zaman daha lezzetli olur. Buzdolabında kapalı bir kapta saklanabilir. Ana yemek olarak yanına pilav, bulgur ya da kızarmış ekmek koyabilirsin; ızgara et ya da tavuğun yanında garnitür olarak da servis edilebilir. Servis anında üzerine biraz çiğ zeytinyağı gezdirmek aromayı canlandırır. Biberiye dalını servisten önce çıkarmayı unutma.

      '
  faq:
  - q: Ratatouille fırında kaç dakika pişer?
    a: Pişirme kağıdıyla örtülü olarak 180°C'de 35 dakika, ardından kağıt alınıp 10 dakika daha pişer.
  - q: Ratatouille ile türlü arasındaki fark nedir?
    a: İkisi de yaz sebzeleriyle yapılır; ratatouille zeytinyağı, sarımsak, kekik ve biberiye gibi otlarla daha aromatiktir. Bu tarifte sebzeler dilimlenip fırın kabına spiral şeklinde diziliyor.
  - q: Ratatouille soğuk yenir mi?
    a: Evet, sıcak, ılık ya da soğuk yenebilir. Ertesi gün tatları daha da oturur.
  - q: Ratatouille için sebzeler nasıl dilimlenir?
    a: Patlıcan, kabak ve domates ince ve eşit yuvarlaklar halinde dilimlenir. Eşit dilimler aynı sürede pişer.
sambali:
  aramaBasligi: 'Şambali tarifi: Yoğurtlu, yumurtasız irmik tatlısı'
  intro: 'Şambali, irmik, yoğurt ve şekerle yapılan, fırında pişirildikten sonra şerbetle ıslatılan bir tatlı. Revaniye benzer, ama yumurta kullanılmadığı için daha yoğun ve nemli bir dokusu vardır; her dilimin ortasına konan fındık ya da badem onu kolayca tanıtır.


    Bu tarifte önce şerbet 15 dakika kaynatılıp soğumaya bırakılıyor. İrmik, yoğurt, şeker, sıvı yağ ve kabartma tozu karıştırılıp 15 dakika bekletiliyor, yağlanmış tepsiye yayılıp kareler halinde dilimleniyor ve her dilime bir fındık konuyor. Tatlı 180°C fırında 30-35 dakika kızarana kadar pişiyor, sıcakken soğuk şerbetle ıslatılıyor.


    12 dilimlik şambali, 15 dakika hazırlık ve 35 dakika pişirmeyle toplam 50 dakikada hazır; şerbetini çekmesi için ayrıca beklemesi gerekiyor.

    '
  editorNote: 'Şerbeti ilk adım olarak yazdık, çünkü tatlı fırından çıktığında şerbetin soğumuş olması gerekiyor; sıcak tatlıya soğuk şerbet, tatlının hamurlaşmadan şerbeti çekmesini sağlıyor. Hamuru pişirmeden önce dilimlemeyi de fındıklar her karenin ortasına otursun diye seçtik.

    '
  notes:
  - t: Hamuru bekletmek
    d: 'Malzemeleri karıştırdıktan sonraki 15 dakikalık bekleme, irmiğin yoğurdun nemini çekip şişmesi için gerekli. Beklemeden pişirilen şambalide irmik taneleri sert kalabilir ve doku kumlu olur. Bu sürede kabartma tozu da yoğurdun ekşiliğiyle tepkimeye girmeye başlar; karışımın hafifçe kabardığını görebilirsin. Tepsiye yayarken hamuru bastırmadan, spatulayla düzgünce yay. Kabartma tozu yoksa 1 tatlı kaşığı karbonat ve 1 yemek kaşığı sirke ya da limon suyu kullanabilirsin.

      '
  - t: Şerbet ve sıcaklık dengesi
    d: 'Şerbetli tatlılarda genel kural sıcaklıkların zıt olmasıdır: sıcak tatlıya soğuk şerbet ya da soğuk tatlıya sıcak şerbet. İkisi de sıcak olursa tatlı hamurlaşır, ikisi de soğuk olursa şerbet içeri işlemez. Bu tarifte şerbet 15 dakika kaynatılıp soğutuluyor, tatlı ise fırından çıkar çıkmaz ıslatılıyor. Şerbeti kepçe kepçe ve tüm yüzeye eşit dökersen her dilim aynı oranda ıslanır. Limon suyu şerbetin şekerlenmesini önler; istersen şerbete biraz portakal kabuğu ekleyebilirsin.

      '
  - t: Servis ve saklama
    d: 'Şambali şerbetini tamamen çektikten sonra servis edilmeli; sıcakken kesilirse dilimler dağılabilir. Pişirmeden önce açtığın çizgilerin üzerinden bıçağı bir kez daha geçirerek kareleri kolayca ayırabilirsin. Tatlıyı üzeri kapalı olarak serin bir yerde saklayabilirsin; buzdolabında bekletirsen dokusu sıkılaşır, servisten önce bir süre oda sıcaklığında beklet. Fındık yerine ceviz ya da badem kullanabilirsin. Yanına kaymak ya da dondurma yakışır. Badem kullanacaksan kabuklu ya da kabuksuz olması fark etmez.

      '
  faq:
  - q: Şambali kaç dakika pişer?
    a: 180°C fırında 30-35 dakika, üzeri kızarana kadar pişer.
  - q: Şambali ile revani arasındaki fark nedir?
    a: Şambali yumurtasız yapılır, bu yüzden revaniden daha yoğun ve nemli bir dokusu vardır. Her dilimine bir fındık ya da badem konur.
  - q: Şambali şerbeti sıcak mı soğuk mu dökülür?
    a: Fırından yeni çıkmış sıcak tatlıya soğuk şerbet dökülür. Böylece tatlı hamurlaşmadan şerbetini çeker.
  - q: Şambali neden hamur gibi olur?
    a: Tatlı ve şerbet aynı sıcaklıkta olduğunda ya da tatlı yeterince pişmeden şerbetlendiğinde hamurlaşır. Tatlıyı kızarana kadar pişir ve şerbeti önceden soğut.
sarimsakli-yogurtlu-makarna:
  aramaBasligi: 'Sarımsaklı yoğurtlu makarna tarifi: Tereyağlı, 15 dakikada'
  intro: 'Sarımsaklı yoğurtlu makarna, haşlanmış makarnanın üzerine sarımsaklı yoğurt ve pul biberli tereyağı dökülerek hazırlanan pratik bir yemek. Mantı sosunu makarnayla buluşturan bu tabak, dolapta az malzeme olduğunda akşam yemeğini kurtaran tariflerden.


    Bu tarifte 250 g makarna bol tuzlu suda paketteki süre kadar haşlanırken yoğurt ezilmiş sarımsak ve bir tutam tuzla çırpılıyor. Ayrı bir tavada tereyağı köpürene kadar eritiliyor, ocaktan alınıp pul biber ve kuru nane ekleniyor. Süzülen sıcak makarna tabağa alınıyor, üzerine önce yoğurt, sonra tereyağlı sos dökülüyor.


    2 kişilik makarna, 5 dakika hazırlık ve 10 dakika pişirmeyle toplam 15 dakikada hazır; sos makarna haşlanırken tamamlanıyor.

    '
  editorNote: 'Yoğurdun oda sıcaklığında olması gerektiğini adımın içine yazdık, çünkü buzdolabından yeni çıkmış yoğurt sıcak makarnayı bir anda soğutuyor. Tereyağını köpürünce ocaktan alıp baharatları sonra ekleme sırasını da pul biber yanmasın diye seçtik.

    '
  notes:
  - t: Yoğurdun sıcaklığı
    d: 'Bu tarifte yoğurt pişirilmiyor, yalnızca sıcak makarnanın üzerine konuyor. Soğuk yoğurt makarnanın ısısını hızla düşürür ve tabak ılık, hatta soğuk servis edilir. Yoğurdu makarnayı haşlamaya başlamadan önce buzdolabından çıkarırsan haşlama süresince oda sıcaklığına yaklaşır. Yoğurt çok koyuysa bir iki kaşık makarna suyu ekleyerek çırp; akışkanlaşan yoğurt makarnayı daha eşit kaplar. Ezilmiş sarımsağı yoğurtla birkaç dakika bekletmek aromasının yoğurda geçmesini sağlar.

      '
  - t: Tereyağlı sosu yakmamak
    d: 'Pul biber ve kuru nane çok kısa sürede yanar ve acı bir tat bırakır. Bu yüzden tereyağını eritip köpürdüğü an ocaktan al, baharatları ondan sonra ekle; tavadaki ısı baharatları cızırdatıp aromalarını açmaya yeter. Tereyağı kahverengileşmeye başladıysa fazla ısınmış demektir. Sosu makarna süzülmeden hemen önce hazırlarsan servis sırasında sıcak kalır. Tereyağı yerine ¾ ölçü zeytinyağı kullanabilirsin, ama tat daha hafif olur.

      '
  - t: Makarna seçimi ve eklemeler
    d: 'Burgu, kalem ya da fiyonk gibi kısa makarnalar yoğurdu ve sosu girintilerinde tuttuğu için bu tarifte uzun makarnalardan daha pratiktir. Makarnayı bol tuzlu suda haşlamak önemli, çünkü sosta tuz az. Üzerine dövülmüş ceviz ya da tavada kızarmış ekmek kırıntısı serpmek çıtır bir doku katar. Daha doyurucu bir tabak istersen yanına tavada kavrulmuş kıyma ekleyebilirsin. Makarna en iyi taze yenir; bekledikçe yoğurdu çeker ve kurur.

      '
  faq:
  - q: Yoğurtlu makarna nasıl yapılır?
    a: Makarna bol tuzlu suda haşlanır, üzerine ezilmiş sarımsaklı yoğurt ve pul biber ile nane eklenmiş kızgın tereyağı dökülür. Tarif 15 dakikada hazır.
  - q: Yoğurtlu makarnaya hangi makarna olur?
    a: Burgu, kalem ya da fiyonk gibi kısa makarnalar sosu daha iyi tutar. Tarifte 2 kişi için 250 g makarna kullanılıyor.
  - q: Yoğurtlu makarna neden soğuk olur?
    a: Buzdolabından yeni çıkmış yoğurt sıcak makarnayı soğutur. Yoğurdu önceden dışarı çıkarıp oda sıcaklığına getir.
  - q: Yoğurtlu makarna önceden yapılır mı?
    a: En iyi taze yenir; bekledikçe makarna yoğurdu çeker. Sosları makarna haşlanırken hazırlayıp hemen servis et.
sebze-corbasi:
  aramaBasligi: 'Sebze çorbası tarifi: Taneli, zeytinyağlı ve vegan'
  intro: 'Sebze çorbası, havuç, patates, kabak ve bezelye gibi temel sebzelerin küçük küpler halinde suyla pişirildiği taneli bir çorba. Buzdolabının sebze çekmecesinde ne varsa değerlendirmeye uygun, hafif ama doyurucu bir başlangıç.


    Bu tarifte zeytinyağında önce soğan, ardından küp doğranmış havuç kavruluyor ve salça ekleniyor. Patates, kabak ve bezelye 2 dakika çevrildikten sonra 6 su bardağı sıcak su, tuz ve karabiberle sebzeler yumuşayana kadar 20 dakika pişiyor. Servisten önce maydanoz serpiliyor; istersen çorbanın yarısını blenderdan geçirerek kıvamını artırabilirsin.


    6 kişilik çorba, 15 dakika hazırlık ve 25 dakika pişirmeyle toplam 40 dakikada hazır. Zeytinyağıyla yapıldığı için vegan ve glutensiz.

    '
  editorNote: 'Sebzeleri pişme sürelerine göre sırayla ekledik; havuç daha geç yumuşadığı için soğanla birlikte önce kavruluyor, kabak ve bezelye sonra geliyor. Yarısını blenderdan geçirme seçeneğini de taneli ile kremamsı arasında bir kıvam isteyenler için koyduk.

    '
  notes:
  - t: Doğrama ve sıralama
    d: 'Sebzeleri aynı boyda küçük küpler halinde doğramak, hepsinin eşit pişmesini ve kaşığa kolay gelmesini sağlar. Havuç sert bir sebze olduğu için en başta soğanla kavrulur; kabak ise çabuk piştiği için sonradan eklenir. Kabağı çok küçük doğrarsan pişerken dağılabilir; havuçla aynı boyda ya da biraz daha iri kesmek iyi sonuç verir. Salçayı soğan ve havuçla birlikte kısa süre kavurmak çiğ tadını giderir ve çorbanın rengini açar.

      '
  - t: Kıvam ve doyuruculuk
    d: 'Taneli sebze çorbası hafif bir kıvamdadır. Daha yoğun bir çorba istersen pişirme sonunda yarısını blenderdan geçirip kalan taneli kısımla karıştırabilirsin; patatesin nişastası çorbayı doğal olarak koyulaştırır. Doyuruculuğu artırmak için bir avuç şehriye ekleyebilirsin, ama bu durumda çorba glutensiz olmaz. Tuzu başta az koyup pişirmenin sonunda tadına bakarak ayarlamak daha güvenli. Servis ederken üzerine biraz limon sıkmak çorbaya ferahlık katar. Maydanozu en son eklersen rengi canlı kalır.

      '
  - t: Sebze değişimleri ve saklama
    d: 'Bu çorba esnek bir tarif; elindeki sebzelere göre değiştirebilirsin. Patates yerine tatlı patates kullanırsan pişirme süresi biraz kısalır. Dondurulmuş bezelyeyi pişirmenin son 10 dakikasında ekle. Salça yoksa 2-3 rendelenmiş domates kullanıp pişirme süresini 5 dakika uzat. Çorba buzdolabında kapalı bir kapta saklanabilir; ısıtırken koyulaştıysa biraz sıcak su ekle. Patatesli çorbalar dondurulup çözüldüğünde patatesin dokusu değişebilir, bu yüzden taze tüketmek daha iyi.

      '
  faq:
  - q: Sebze çorbası kaç dakika pişer?
    a: Sıcak su eklendikten sonra sebzeler yumuşayana kadar yaklaşık 20 dakika pişer. Hazırlıkla birlikte toplam süre 40 dakika.
  - q: Sebze çorbasına hangi sebzeler konur?
    a: Bu tarifte soğan, havuç, patates, kabak ve bezelye kullanılıyor. Elindeki başka sebzeleri de pişme sürelerine göre ekleyebilirsin.
  - q: Sebze çorbası nasıl koyulaştırılır?
    a: Pişirme sonunda çorbanın yarısını blenderdan geçirip kalanıyla karıştır. Bir avuç şehriye de doyuruculuğunu artırır.
  - q: Sebze çorbası dondurulur mu?
    a: Dondurulabilir, ama patatesin dokusu çözüldükten sonra değişebilir. Buzdolabında kapalı kapta saklayıp kısa sürede tüketmek daha iyi.
sebzeli-spring-roll:
  aramaBasligi: 'Sebzeli spring roll tarifi: Yufkayla da olur, çıtır ve vegan'
  intro: 'Spring roll, ince bir hamur yaprağına sarılan sebze içinin kızartılmasıyla yapılan bir Asya ara sıcağı; Türkiye''de en çok Çin restoranlarından tanınıyor. Dışı çıtır, içi lahana ve havucun tazeliğini koruyan bir atıştırmalık.


    Bu tarifte sarımsak, ince kıyılmış lahana, jülyen havuç ve fasulye filizi yağda 3 dakika çevriliyor; haşlanmış cam erişte ve soya sosu eklenip süzülüyor ve soğutuluyor. 12 spring roll yaprağı ya da dörde kesilmiş 3 yufka elmas gibi konup iç harçla sarılıyor, ucu unlu suyla yapıştırılıyor. Rulolar orta-yüksek ateşte altın rengi alana kadar kızartılıyor; airfryer''da yağ sürerek 200°C''de 10 dakikada da pişiyor.


    4 kişilik 12 rulo, 30 dakika hazırlık ve 15 dakika pişirmeyle toplam 45 dakikada hazır; tatlı ekşi ya da tatlı chili sosla servis ediliyor.

    '
  editorNote: 'İç harcı süzüp soğutma şartını ilk adıma ekledik, çünkü sıcak ve sulu iç yaprağı yumuşatıp sararken ya da kızartırken yırtılmasına neden oluyor. Spring roll yaprağı her yerde kolay bulunmadığı için dörde kesilmiş yufkayı da malzemeye alternatif olarak yazdık.

    '
  notes:
  - t: İç harcı kuru tutmak
    d: 'Lahana ve fasulye filizi tavada kısa sürede su bırakır. Sebzeleri yalnızca 3 dakika çevirmek hem çıtırlıklarını korur hem de fazla su salmalarını önler. Harcı süzgece alıp birkaç dakika bekletmek, soya sosuyla gelen sıvının da akmasını sağlar. İç tamamen soğumadan sarmaya başlarsan buhar yaprağı yumuşatır. Cam eriştenin uzun lifleri sarmayı zorlaştırabilir; haşladıktan sonra makasla birkaç yerinden kesmek işi kolaylaştırır. Erişteyi de iyice süzmeyi unutma.

      '
  - t: Sıkı sarma tekniği
    d: 'Yaprağı elmas şeklinde, bir köşesi sana bakacak biçimde koy ve iç harcı alt köşeye yakın yerleştir. Alt köşeyi harcın üzerine kapat, yan köşeleri içe katla ve havayı dışarı iterek sıkıca rulo yap. Gevşek sarılan rulolar kızarırken açılır ve içine yağ dolar. Fazla iç koymak da yırtılmaya yol açar; bir kaşık yeterli. Unu biraz suyla karıştırarak yaptığın macun yapıştırıcı görevi görür. Sarılan ruloları kızartana kadar kurumasınlar diye nemli bir bezle örtebilirsin.

      '
  - t: Kızartma ve alternatifler
    d: 'Yağın orta-yüksek ateşte iyice ısınması önemli; ılık yağda rulolar yağ çeker. Ruloları ek yerleri altta kalacak şekilde yağa bırakmak açılmalarını önler. Daha az yağlı bir sonuç için airfryer''da yağ sürerek 200°C''de 10 dakika pişirebilirsin. Yufkayla yapılan rulolar biraz daha kalın olur, ama çok çıtırdır. Soya sosu yerine tamari kullanabilirsin; elinde ikisi de yoksa biraz tuz ve bir kaşık pekmez iç harca benzer bir derinlik verir.

      '
  faq:
  - q: Spring roll kaç dakika kızartılır?
    a: Orta-yüksek ateşte altın rengi olana kadar yaklaşık 8 dakika kızartılır. Airfryer'da yağ sürerek 200°C'de 10 dakika pişer.
  - q: Spring roll yaprağı yerine ne kullanılır?
    a: Dörde kesilmiş yufka kullanılabilir; 3 yufka 12 rulo için yeterli. Yufka biraz daha kalın olur ama çok çıtırdır.
  - q: Spring roll neden yırtılır?
    a: İç harcın suyu iyi süzülmediğinde ya da harç sıcakken sarıldığında yaprak yumuşar ve yırtılır. Harcı süzüp tamamen soğut.
  - q: Spring roll hangi sosla yenir?
    a: Tatlı ekşi sos ya da tatlı chili sos en yaygın eşlikçileridir.
sebzeli-yumurta-muffin:
  aramaBasligi: 'Sebzeli yumurta muffin tarifi: Peynirli, fırında 20 dakika'
  intro: 'Sebzeli yumurta muffin, çırpılmış yumurtanın sebze ve peynirle birlikte muffin kalıbında pişirildiği küçük, taşınabilir yumurta kekleri. Un içermediği için kekten çok kalıpta pişen bir omlet gibi düşünülebilir; sabah koşturmasında elde yenebilen pratik bir kahvaltı.


    Bu tarifte 6 yumurta süt, tuz ve karabiberle çırpılıyor. Yağlanmış muffin kalıbına küp kapya biber, doğranmış ıspanak, taze soğan ve ufalanmış beyaz peynir paylaştırılıyor, üzerine yumurtalı karışım dökülüyor. Muffinler 180°C fırında kabarıp ortası pişene kadar 18-20 dakika pişiyor; airfryer''da silikon kaplarda 170°C''de 12-14 dakika yeterli.


    6 kişilik muffinler, 10 dakika hazırlık ve 20 dakika pişirmeyle toplam 30 dakikada hazır ve buzdolabında 3 gün saklanabiliyor.

    '
  editorNote: 'Sebzeleri yumurtayla karıştırmak yerine önce kalıba paylaştırıp yumurtayı üstüne dökmeyi seçtik; böylece her muffine eşit miktarda sebze ve peynir düşüyor. Tarifi hafta içi kahvaltı hazırlığı için yazdığımızdan saklama ve ısıtma bilgisini de ekledik.

    '
  notes:
  - t: Kalıptan kolay çıkarmak
    d: 'Yumurta pişerken metal kalıplara kolayca yapışır. Kalıbın her gözünü kenarları dahil iyice yağla ya da kağıt muffin kapsülü kullan; silikon kalıplar yapışmayı azaltır. Pişen muffinleri fırından çıkarınca birkaç dakika kalıpta beklet; kabarık yumurtalar biraz söner ve kenarlardan ayrılır. Ardından ince bir bıçağı kenarda gezdirerek çıkar. Kalıbın gözlerini ağzına kadar doldurma, muffinler pişerken kabarıp taşabilir. Gözlerin dörtte üçünü doldurmak genellikle yeterlidir. Kalıbı fırının orta rafına koymak, alt ve üstün eşit pişmesini sağlar.

      '
  - t: Sebzelerin suyu
    d: 'Ispanak ve biber pişerken su bırakır. Sebzeleri iri doğrarsan muffinlerin içinde sulu cepler oluşabilir; küçük doğramak bunu önler. Daha kuru bir doku istersen ıspanağı tavada kısa süre soteleyip suyunu çektirdikten sonra kalıba koyabilirsin. Beyaz peynir tuzlu olduğu için yumurtaya eklediğin tuzu peynirin tuzuna göre ayarla. Ispanak yerine pazı, beyaz peynir yerine tuzlanmış lor ya da tulum peyniri, kapya biber yerine kırmızı dolmalık biber kullanılabilir.

      '
  - t: Saklama ve ısıtma
    d: 'Muffinler tamamen soğuduktan sonra kapaklı bir kapta buzdolabında 3 gün saklanabilir. Sıcakken kapatırsan buhar yoğunlaşır ve muffinler nemlenir. Isıtmak için mikrodalgada yaklaşık 30 saniye yeterli; uzun ısıtmak yumurtayı lastik gibi yapar. İşe giderken bir ya da iki muffini kaba koyup yanına bir dilim ekmek, domates ve salatalık eklersen doyurucu bir kahvaltı olur. Süt yerine laktozsuz süt birebir kullanılabilir. Muffinleri tek tek sarmak, çantada taşırken dağılmalarını önler.

      '
  faq:
  - q: Yumurta muffin fırında kaç dakika pişer?
    a: 180°C fırında kabarıp ortası pişene kadar 18-20 dakika pişer. Airfryer'da 170°C'de 12-14 dakika yeterli.
  - q: Yumurta muffin neden söner?
    a: Fırından çıktıktan sonra içindeki buhar azaldığı için hafifçe sönmesi normaldir. Fazla pişirme sönmeyi ve kurumayı artırır.
  - q: Yumurta muffin kaç gün saklanır?
    a: Soğuduktan sonra kapaklı kapta buzdolabında 3 gün saklanır. Mikrodalgada 30 saniyede ısınır.
  - q: Yumurta muffin kalıba yapışmaması için ne yapılır?
    a: Kalıbı iyice yağla ya da kağıt kapsül kullan. Pişince birkaç dakika bekletip kenarından ince bir bıçakla ayır.
siveydiz:
  aramaBasligi: 'Şiveydiz tarifi: Antep usulü yoğurtlu, taze sarımsaklı'
  intro: 'Şiveydiz, Gaziantep mutfağına ait, et, nohut ve taze sarımsağın yoğurtla terbiye edildiği sulu bir ana yemek. Taze sarımsağın çıktığı bahar aylarıyla anılır, ama kışın da sevilir; kaşıkla yenen, çorba ile yemek arasında bir kıvamı vardır.


    Bu tarifte 500 g kuzu ya da dana kuşbaşı tereyağında kavrulup 5 su bardağı sıcak suyla kısık ateşte 50 dakika pişiyor. 3 cm boyunda doğranan taze sarımsak ve haşlanmış nohut eklenip 10 dakika daha pişiriliyor. Yoğurt, yumurta ve pirinç unuyla hazırlanan terbiye, tencereden alınan sıcak suyla ılıtılıp sürekli karıştırılarak ekleniyor. Üzerine tereyağında kızdırılmış kuru nane gezdiriliyor.


    4 kişilik şiveydiz, 20 dakika hazırlık ve 70 dakika pişirmeyle toplam 90 dakikada hazır.

    '
  editorNote: 'Terbiyeyi ılıtma ve tek yöne karıştırma adımlarını ayrıntılı yazdık, çünkü yoğurtlu yemeklerde en sık görülen sorun yoğurdun kesilmesi ve şiveydizin bütün karakteri bu pürüzsüz terbiyeye bağlı. Taze sarımsak bulamayanlar için yeşil soğanlı alternatifi de malzeme listesine ekledik.

    '
  notes:
  - t: Yoğurdu kesmeden eklemek
    d: 'Yoğurt yüksek ısıyla aniden karşılaştığında proteinleri topaklanır ve yemek keser. Terbiyedeki yumurta ve pirinç unu bunu önlemeye yardım eden bağlayıcılardır. Yoğurt karışımını iyice çırpıp tencereden bir kepçe sıcak suyu yavaş yavaş, çırpmaya devam ederek ekle; böylece terbiye kademeli ısınır. Ardından terbiyeyi tencereye dökerken ve yemek kaynayana kadar tek yöne karıştırmayı bırakma. Kaynadıktan sonra ateşi kıs. Tarifteki sırayla tuzu en son, terbiyeden sonra ekle.

      '
  - t: Eti yumuşatmak
    d: 'Kuşbaşı et kısık ateşte 50 dakika pişirildiğinde yumuşar ve suyuna lezzet verir. Eti önce tereyağında suyunu çekene kadar kavurmak hem rengini hem aromasını güçlendirir. Su eklerken sıcak su kullan; soğuk su pişmeyi yavaşlatır. Etin yumuşaklığını çatalla kontrol et, gerekirse birkaç dakika daha pişir. Kuzu yerine dana eti kullanırsan pişirme süresi benzerdir. Haşlanmış nohut yerine konserve nohut olur; kuru nohuttan başlıyorsan önceden ıslatıp ayrıca haşlaman gerekir.

      '
  - t: Taze sarımsak ve servis
    d: 'Taze sarımsak, olgun sarımsağa göre daha yumuşak ve hafif bir aromaya sahiptir; yeşil kısımları da yemekte kullanılır. 3 cm boyunda doğranması, yemekte hem görünmesini hem de dağılmadan pişmesini sağlar. Bulamazsan yeşil soğanla birlikte 1-2 diş sarımsak kullan. Şiveydiz sıcak servis edilir; yanına pirinç ya da bulgur pilavı klasik eşlikçidir. Tereyağında kızdırılan naneyi servis anında gezdir ki kokusu canlı kalsın. Kalanı ısıtırken kısık ateşte ve karıştırarak ısıt; yüksek ateşte yoğurt kesilebilir.

      '
  faq:
  - q: Şiveydiz kaç dakika pişer?
    a: Et kısık ateşte 50 dakika, taze sarımsak ve nohut eklendikten sonra 10 dakika daha pişer; terbiye eklenince yaklaşık 5 dakika kaynatılır.
  - q: Şiveydizde yoğurt neden keser?
    a: Yoğurt ılıtılmadan sıcak yemeğe eklendiğinde ya da karıştırılmadan kaynatıldığında keser. Terbiyeyi bir kepçe sıcak suyla ılıt ve kaynayana kadar tek yöne karıştır.
  - q: Şiveydizde taze sarımsak yerine ne kullanılır?
    a: Yeşil soğan ve 1-2 diş sarımsak kullanılabilir.
  - q: Şiveydizin yanına ne yenir?
    a: Pirinç pilavı ya da bulgur pilavı klasik eşlikçileridir.
sogan-dolmasi:
  aramaBasligi: 'Soğan dolması tarifi: Antep usulü, nar ekşili ve kıymalı'
  intro: 'Soğan dolması, haşlanarak yumuşatılan kuru soğan katmanlarının baharatlı kıymalı pirinç içle sarıldığı ve ekşili salçalı sosta pişirildiği bir dolma. Gaziantep mutfağıyla özdeşleşen bu yemekte nar ekşisi, soğanın haşlanınca kazandığı tatlılığı dengeler.


    Bu tarifte 5 iri soğan bir yanından merkeze kadar kesilip kaynar suda 8-10 dakika haşlanıyor ve katmanları ayrılıyor. Kıyma, pirinç, domates ve biber salçası, maydanoz, baharatlar ve zeytinyağıyla hazırlanan iç her katmana konup soğanın kendi kıvrımıyla sarılıyor. Dolmalar tencereye sıkıca dizilip biber salçası, nar ekşisi, tereyağı ve sıcak sudan oluşan sosla kısık ateşte 45-50 dakika pişiyor ve 10 dakika demleniyor.


    6 kişilik dolma, 50 dakika hazırlık ve 50 dakika pişirmeyle toplam 100 dakikada hazır. Yoğurtla servis ediliyor.

    '
  editorNote: 'Soğanlara tek kesik atıp öyle haşlama yöntemini seçtik; bu sayede katmanlar haşlandıktan sonra kesik yerinden kolayca ayrılıyor ve yırtılmadan çıkıyor. Küçük iç katmanları atmak yerine tencerenin dibine döşemeyi de yazdık, çünkü hem dolmaların dibinin tutmasını önlüyor hem de sosa tat veriyor.

    '
  notes:
  - t: Soğanı doğru haşlamak
    d: 'Soğan dolmasının en hassas aşaması haşlamadır. Soğan az haşlanırsa katmanlar sert kalır ve sararken kırılır; fazla haşlanırsa yumuşayıp yırtılır. Kaynar suda 8 dakika sonra bir katmanı kontrol et, kolayca bükülüyorsa hemen sudan al. Soğanları biraz ılıttıktan sonra kesik attığın yerden katmanları dışarıdan içe doğru tek tek ayır. İri soğan seçmek daha büyük ve sarması kolay katmanlar verir; en içteki küçük katmanlar sarmaya uygun olmadığı için tencerenin dibine döşenir.

      '
  - t: İç harç ve sarma
    d: 'İç harçtaki pirinç pişerken şişer; bu yüzden her katmana bir kaşıktan fazla koyma ve çok sıkı sarma, yoksa dolmalar pişerken açılabilir. Kıymayı salçalar, baharatlar ve zeytinyağıyla iyice yoğurmak harcın homojen olmasını ve baharatın her lokmaya eşit dağılmasını sağlar. Soğan katmanını harcın üzerine kendi kıvrımı doğrultusunda kapatmak ayrıca bağlamaya gerek bırakmaz. Dolmaları tencereye birbirine yaslayarak dizmek ve üzerine ters bir tabak kapatmak pişerken açılmalarını önler.

      '
  - t: Sos, pişirme ve alternatifler
    d: 'Nar ekşisi bu yemeğin imzasıdır; bulamazsan limon suyu ile bir tatlı kaşığı bal ya da pekmez benzer bir ekşi-tatlı denge verir. Biber salçası yoksa domates salçası ve bir tatlı kaşığı pul biber kullanabilirsin. Kısık ateş, pirincin tam pişmesi için önemli; ateşi yükseltirsen sos çabuk çeker ve dip tutabilir. Fırında 180°C''de 40 dakika pişirirsen dolmaların üstü hafifçe karamelize olur. Pişirmeden sonraki 10 dakikalık demlenme, pirincin sosu çekip yumuşamasını tamamlar.

      '
  faq:
  - q: Soğan dolması için soğan kaç dakika haşlanır?
    a: Soğanlar kaynar suda 8-10 dakika, yumuşayana kadar haşlanır. Fazla haşlanırsa katmanlar yırtılır.
  - q: Soğan dolması kaç dakika pişer?
    a: Dolmalar kısık ateşte 45-50 dakika pişer ve ocaktan alındıktan sonra 10 dakika demlenir. Fırında 180°C'de 40 dakika da pişirilebilir.
  - q: Soğan dolmasında nar ekşisi yerine ne kullanılır?
    a: Limon suyuna bir tatlı kaşığı bal ya da pekmez karıştırarak kullanabilirsin.
  - q: Soğan dolması için soğan katmanları nasıl ayrılır?
    a: Soğanın bir yanından merkeze kadar tek kesik atılıp haşlanır. Haşlandıktan sonra katmanlar kesik yerinden tek tek ayrılır.
tabule:
  aramaBasligi: 'Tabule tarifi: Bol maydanozlu Lübnan salatası, 20 dakika'
  intro: 'Tabule, Lübnan mutfağının bol maydanoz, nane, domates ve az miktarda ince bulgurla yapılan salatası. Bizdeki kısıra benzese de oran tam tersidir: tabulede yıldız maydanozdur, bulgur salatanın içinde yalnızca küçük bir yer tutar.


    Bu tarifte 3 yemek kaşığı ince bulgur, limon suyu ve doğranmış domatesin suyuyla 10 dakika ıslatılıyor; böylece pişirmeye gerek kalmadan yumuşuyor. 3 demet maydanoz ve yarım demet nane iyice kurulanıp keskin bıçakla ince kıyılıyor. Yeşillikler küp domates, taze soğan, bulgur, zeytinyağı ve tuzla karıştırılıyor.


    4 kişilik tabule toplam 20 dakikada hazır. Pişirme gerektirmiyor ve vegan; ızgara etlerin ve köftelerin yanında ferah bir eşlikçi oluyor.

    '
  editorNote: 'Bulguru suyla değil, limon suyu ve domatesin kendi suyuyla ıslatmayı seçtik; bulgur hem yumuşuyor hem de salatanın ekşi aromasını içine çekiyor. Yeşillikleri kurulama uyarısını ayrıca yazdık, çünkü ıslak maydanoz salatayı kısa sürede sulandırıyor.

    '
  notes:
  - t: Maydanozu doğru kıymak
    d: 'Tabulenin dokusu maydanozun nasıl kıyıldığına bağlı. Yıkadıktan sonra yaprakları salata kurutucusunda ya da havluda iyice kurula; ıslak yeşillik bıçakta ezilir ve salata sulanır. Keskin bir bıçak kullan; kör bıçak yaprakları kesmek yerine ezer, maydanoz koyulaşır ve acımsı bir tat verir. Kalın sapları ayıkla, ince sapları yapraklarla birlikte kıyabilirsin. Maydanozu demet halinde sıkıca tutup ince ince dilimlemek, doğrayıcıda çekmekten daha iyi sonuç verir.

      '
  - t: Bulgur ve domates
    d: 'Tabulede ince bulgur kullanılır; pilavlık iri bulgur bu kısa ıslatmada yumuşamaz. Domatesi küp doğrarken çıkan suyu bulgura eklemek, bulgurun hem nemlenmesini hem tatlanmasını sağlar. Bulgur az olduğu için limon suyu ve domates suyu yeterli; ayrıca su eklersen salata hamurlaşabilir. Glutensiz bir tabule istersen bulgur yerine ince kinoa kullanabilirsin; kinoayı önceden haşlayıp soğutman gerekir. Limon yoksa misket limonu ya da yarı ölçü elma sirkesi kullanılabilir.

      '
  - t: Servis ve saklama
    d: 'Tabule en lezzetli haliyle taze yenir. Yeşillikleri ve domatesi önceden hazırlayıp ayrı kaplarda buzdolabında saklayabilir, zeytinyağı ve tuzu servisten hemen önce ekleyebilirsin; tuz domatesin suyunu çıkarır ve bekleyen salata sulanır. Marul yaprağıyla servis edip yaprağı kaşık gibi kullanmak pratik bir yoldur. Izgara etlerin, köftelerin ve falafelin yanına çok yakışır. Nane miktarını damak tadına göre artırıp azaltabilirsin. Taze soğanın yeşil kısmını da kullanmak salataya ek bir tazelik katar.

      '
  faq:
  - q: Tabule ile kısır arasındaki fark nedir?
    a: Kısırda bulgur ana malzemedir; tabulede ise bol maydanoz ön plandadır ve bulgur az kullanılır. Bu tarifte salça da yok.
  - q: Tabule için bulgur haşlanır mı?
    a: Hayır. İnce bulgur limon suyu ve domatesin suyuyla 10 dakika ıslatılarak yumuşatılır.
  - q: Tabule için hangi bulgur kullanılır?
    a: İnce, köftelik bulgur kullanılır. Glutensiz bir versiyon için ince kinoa tercih edebilirsin.
  - q: Tabule önceden hazırlanır mı?
    a: Yeşillikleri ve domatesi önceden doğrayıp ayrı saklayabilirsin. Zeytinyağı ve tuzu servisten hemen önce ekle, yoksa salata sulanır.
tarcinli-firin-elma:
  aramaBasligi: 'Tarçınlı fırın elma tarifi: Cevizli ve ballı, 40 dakikada'
  editorNote: 'Elmaların dibine su dökme adımını ayrı yazdık, çünkü bu su fırında bal ve elma suyuyla birleşip servisteki şurubu oluşturuyor; kap kuru kalırsa şurup yanar.

    '
  intro: 'Tarçınlı fırın elma, çekirdek yuvası oyulan elmaların ceviz, kuru üzüm, bal ve tarçınla doldurulup fırında yumuşatıldığı sade bir kış tatlısı. Hamur, şeker şurubu ya da un gerektirmiyor; tatlılığı elmanın kendisinden ve iki kaşık baldan geliyor.


    Bu tarifte elmaları altını delmeden oyuyoruz ki iç harcı pişerken akıp gitmesin. Fırın kabının dibine dökülen yarım su bardağı su, elmaların buharda yumuşamasını sağlıyor ve pişme sonunda kabın dibinde ballı, tarçınlı bir şurup bırakıyor. Elmalar 180°C fırında 25-30 dakikada kaşıkla bölünecek kıvama geliyor.


    4 kişilik tarif toplam 40 dakikada hazır: 10 dakika hazırlık, 30 dakika pişirme. Fırın yerine airfryer kullanırsan 180°C''de 15-18 dakika yeterli.

    '
  notes:
  - t: Elma seçimi
    d: 'Fırında şeklini koruyan elma, ekşi ve sert olanıdır; granny smith gibi yeşil elmalar bu yüzden iyi sonuç verir. Çok sulu ve unlu dokulu tatlı elmalar fırında çabuk çöker, kabuğu yarılır ve iç harç dışarı taşar. Ekşi elma kullanınca baldaki tatlılık da daha dengeli hissedilir. Elinde yalnızca tatlı elma varsa pişirme süresini kısa tut ve 25. dakikadan itibaren bir kürdanla yoklayarak kontrol et.

      '
  - t: Oyarken altını delme
    d: 'Elmanın çekirdek yuvasını üstten bir çay kaşığı ya da elma oyacağıyla çıkarırken dibe yaklaşık bir parmak boğumu kalınlık bırak. Alt delinirse bal eriyip kaba akar, iç harç kurur ve şurup tabanda yanabilir. Yanlışlıkla delersen deliği küçük bir elma parçasıyla tıkaman yeterli. Oyulan kısmı biraz geniş tutmak daha fazla ceviz ve üzüm sığdırmanı sağlar; tarifteki yarım su bardağı ceviz dört elma için hesaplandı.

      '
  - t: Servis ve saklama
    d: 'Elmalar en güzel ılıkken, kabın dibindeki şurup üzerine gezdirilerek yenir. Bir kaşık yoğurtla servis etmek tatlının sıcaklığını ve tatlılığını dengeler. Kalan elmaları kapalı bir kapta buzdolabında saklayabilir, ertesi gün fırında ya da airfryer''da birkaç dakika ısıtabilirsin. Bal yerine üzüm pekmezi ya da hurma şurubu, ceviz yerine fındık veya badem kullanmak da mümkün; ölçüler aynı kalır. Ceviz ve üzümü önceden hazırlayıp kapalı kapta saklarsan elmaları doldurmak yalnızca birkaç dakikanı alır.

      '
  faq:
  - q: Fırında elma kaç dakika pişer?
    a: '180°C fırında 25-30 dakika pişer. Kürdan elmaya kolayca giriyorsa ve kabuğu hafif buruşmaya başladıysa hazırdır.

      '
  - q: Fırın elma için hangi elma kullanılır?
    a: 'Granny smith gibi ekşi ve sert elmalar en iyisidir, çünkü fırında şeklini korur. Çok tatlı ve yumuşak elmalar çabuk dağılır.

      '
  - q: Fırın elma airfryer'da yapılır mı?
    a: 'Evet. Doldurulmuş elmaları 180°C''de 15-18 dakika pişirmen yeterli.

      '
  - q: Fırın elmada bal yerine ne kullanılır?
    a: 'Üzüm pekmezi, akçaağaç şurubu ya da hurma şurubu aynı ölçüde kullanılabilir.

      '
tatli-eksi-tavuk:
  aramaBasligi: 'Tatlı ekşi tavuk tarifi: Ananaslı sosla, 40 dakikada'
  editorNote: 'Tavuğu sosa son anda eklemeyi ayrı bir adım olarak vurguladık, çünkü nişastalı kaplama sosla birkaç dakikadan fazla kalırsa yumuşar ve yemeğin çıtırlığı kaybolur.

    '
  intro: 'Tatlı ekşi tavuk, Çin lokantalarının menüsünden tanıdığın, parlak kırmızı soslu bir yemek: nişastayla kaplanıp kızartılan kuşbaşı tavuk, iri doğranmış biber ve soğan, ananas ve ketçap, sirke, şeker ile soya sosundan yapılan bir sos.


    Bu tarifte tavuğu yumurta ve mısır nişastasıyla kaplayıp parti parti kızartıyoruz. Sebzeler wok''ta yalnızca 3 dakika çevriliyor ki diri kalsın. Sos, bir tatlı kaşığı nişastayla bağlandığı için birkaç saniyede koyulaşıyor ve tavuk en son eklenip hızla harmanlanıyor. Böylece sos parlak, tavuk çıtır kalıyor.


    4 kişilik tarif 20 dakika hazırlık ve 20 dakika pişirmeyle toplam 40 dakikada hazır. Daha az yağlı bir versiyon istersen tavukları yağlı tepside 200°C fırında 15 dakika pişirebilirsin.

    '
  notes:
  - t: Kaplama ve kızartma
    d: 'Tavuğu yumurtaya buladıktan sonra nişastayı iyice yedir; nişasta kızartmada ince ve çıtır bir kabuk oluşturur. Kızartırken tencereyi kalabalık etme. Bir su bardağı yağa aynı anda çok parça girerse yağın ısısı düşer, kaplama yağ çeker ve yumuşak kalır. Tavukları parti parti, toplam 10 dakika civarında kızart ve kâğıt havluya alarak fazla yağını süzdür. Tavuk göğsü çabuk kuruduğu için parçaları çok uzun yağda bekletme.

      '
  - t: Sosun dengesi
    d: 'Sosun tatlı ve ekşi tarafı ketçap ile şekerden, ekşiliği elma sirkesinden, tuzluluğu soya sosundan geliyor. Malzemeleri wok''a dökmeden önce nişastayla birlikte karıştır; nişasta sıcak tavaya doğrudan atılırsa topaklanır. Sos kaynamaya başlayıp koyulaştığı anda tavukları ekle. Sirke yoksa yarı ölçü limon suyu, ketçap yoksa domates salçası, bir tutam şeker ve birkaç damla sirke kullanabilirsin. Glutensiz için soya sosu yerine tamari tercih et.

      '
  - t: Servis ve saklama
    d: 'Tatlı ekşi tavuk sade pirinç pilavıyla çok iyi gider; sos pilava geçtiğinde yemeğin dengesi tamamlanır. En iyi halini hemen servis edildiğinde verir. Kalanı buzdolabında saklayabilirsin, ancak kaplama sosu çektiği için ertesi gün çıtır olmaz. Önceden hazırlamak istiyorsan tavukları ve sosu ayrı sakla, servisten önce sosu ısıtıp tavukları son anda ekle. Ananası konserveden kullanıyorsan iyice süzmeyi unutma. Kalanı ısıtırken mikrodalga yerine tava kullanmak, kaplamanın bir kısmını yeniden canlandırır.

      '
  faq:
  - q: Tatlı ekşi sos nasıl yapılır?
    a: '4 yemek kaşığı ketçap, 3 yemek kaşığı elma sirkesi, 3 yemek kaşığı şeker, 2 yemek kaşığı soya sosu, 1 tatlı kaşığı nişasta ve yarım su bardağı su karıştırılıp wok''ta koyulaşana kadar pişirilir.

      '
  - q: Tatlı ekşi tavuk nasıl çıtır olur?
    a: 'Tavuğu yumurta ve nişastayla kaplayıp kızgın yağda parti parti kızartmak ve sosa servisten hemen önce eklemek çıtırlığı korur.

      '
  - q: Tatlı ekşi tavuk fırında yapılır mı?
    a: 'Evet. Kaplanmış tavukları yağlı tepside 200°C fırında 15 dakika pişirip sonra sosla harmanlayabilirsin.

      '
  - q: Tatlı ekşi tavukta ananas yerine ne konur?
    a: 'Ananas sosa meyvemsi bir ekşilik katar; yoksa yemeği yalnızca biber ve soğanla da yapabilirsin. Tarifin geri kalanı değişmez.

      '
tatli-patates-corbasi:
  aramaBasligi: 'Tatlı patates çorbası tarifi: Zencefilli, 35 dakikada'
  editorNote: 'Hindistan cevizi sütünü pişirmenin sonunda, blenderdan hemen önce ekledik; böylece kaynarken ayrışmıyor ve çorbaya kremamsı dokusunu son anda veriyor.

    '
  intro: 'Tatlı patates çorbası, tatlı patates ve havucun soğan, sarımsak ve zencefille pişirilip pürüzsüz hale getirildiği, turuncu renkli bir kış çorbası. Kıvamı un ya da krema yerine sebzelerin kendisinden geliyor; hindistan cevizi sütü ise çorbayı yumuşatıp kadife bir doku kazandırıyor.


    Bu tarifte önce soğanı zeytinyağında kavurup sarımsak, taze zencefil ve kimyonu bir dakika çeviriyoruz; baharatlar yağda açıldığı için aroma tüm çorbaya yayılıyor. Küp doğranmış sebzeler sıcak suyla 20 dakika pişiyor, ardından el blenderıyla çekiliyor. Kabak çekirdeği ve pul biber, üzerine çıtırlık ve hafif acılık ekliyor.


    4 kişilik tarif 10 dakika hazırlık ve 25 dakika pişirmeyle toplam 35 dakikada hazır. Vegan ve glutensiz bir çorba.

    '
  notes:
  - t: Kıvamı ayarlamak
    d: 'Tatlı patatesin nişasta oranı türüne ve boyutuna göre değiştiği için çorbanın kıvamı her seferinde biraz farklı olabilir. Blenderdan geçirdikten sonra koyu geliyorsa azar azar sıcak su ekleyip karıştır; soğuk su eklemek çorbayı soğutur ve tadı sulandırır. Çok sulu kaldıysa kapağı açık birkaç dakika daha kaynatabilirsin. Tuzu blender sonrasında ayarlamak daha doğru, çünkü kıvam değiştikçe tuz algısı da değişir. Blenderı tencereye daldırmadan önce ocağı kapat, sıcak çorba sıçrayabilir.

      '
  - t: Zencefil ve baharat
    d: 'Taze zencefil çorbaya hem ısıtan bir acılık hem de tatlı patatesin şekerini dengeleyen ferah bir koku verir. Rendeyi ince tutarsan liflerle uğraşmazsın. Taze zencefil yoksa dörtte bir ölçü toz zencefil kullanabilirsin; toz zencefil daha keskindir, fazlası çorbayı acılaştırır. Kimyonu ve zencefili yağda bir dakikadan uzun kavurma, sarımsakla birlikte yanarsa çorbaya acı bir tat geçer. Zencefil miktarını damak zevkine göre artırabilirsin, ama ilk denemede tarifteki bir tatlı kaşığıyla başla.

      '
  - t: Saklama ve dondurma
    d: 'Çorba buzdolabında kapalı kapta birkaç gün iyi kalır; bekledikçe koyulaştığı için ısıtırken biraz sıcak su eklemen gerekebilir. Porsiyonlayıp dondurabilirsin, iki ay dayanır. Dondurulmuş çorbayı buzdolabında çözdürüp kısık ateşte karıştırarak ısıt. Kabak çekirdeği ve pul biberi saklamadan önce değil, servis sırasında ekle; çekirdek bekleyince yumuşar. Daha derin bir tat için tatlı patatesleri önceden fırında közleyebilirsin. Çorbayı kaselere paylaştırdıktan sonra bir tur hindistan cevizi sütü gezdirmek görünüşünü de tamamlar.

      '
  faq:
  - q: Tatlı patates çorbası kaç dakikada pişer?
    a: 'Sebzeler sıcak suyla kapağı kapalı orta ateşte yaklaşık 20 dakikada yumuşar. Kavurma ile birlikte toplam pişirme 25 dakika sürer.

      '
  - q: Tatlı patates çorbasında hindistan cevizi sütü yerine ne kullanılır?
    a: 'Krema ya da süt kullanabilirsin, ancak çorba vegan olmaz. Vegan kalsın istersen bir avuç kajuyu bir su bardağı suyla blenderdan geçirip ekle.

      '
  - q: Tatlı patates çorbası dondurulur mu?
    a: 'Evet, porsiyonlayıp dondurulabilir ve iki ay dayanır. Isıtırken kıvamı sıcak suyla açabilirsin.

      '
  - q: Tatlı patates çorbası blendersız yapılır mı?
    a: 'Sebzeler iyice yumuşadığı için patates ezicisiyle de ezebilirsin. Doku pürüzsüz değil, hafif taneli olur.

      '
tatli-patates-tostu:
  aramaBasligi: 'Tatlı patates tostu tarifi: Ekmeksiz, glutensiz kahvaltı'
  editorNote: 'Tek tarifte iki farklı üst malzeme verdik; aynı tepsi dilimle hem tuzlu hem tatlı bir kahvaltı çıkıyor ve hafta içi sabahları seçim yapmak kolaylaşıyor.

    '
  intro: 'Tatlı patates tostu, ekmek dilimi yerine uzunlamasına kesilip fırınlanan tatlı patates dilimlerinin kullanıldığı bir kahvaltı. Dilimler fırında yumuşayıp kenarlarından kızarınca üzerine istediğin malzemeyi taşıyacak sağlamlıkta bir taban oluyor.


    Bu tarifte bir büyük tatlı patatesten 4-6 dilim çıkarıyoruz ve iki farklı üst hazırlıyoruz. Tuzlu tarafta limonla ezilmiş avokado ve göz ya da kayısı kıvamında yumurta, tatlı tarafta fıstık ezmesi, muz, bal ve tarçın var. Dilimler 200°C fırında 20 dakika pişerken üst malzemeler hazırlanıyor.


    2 kişilik tarif 5 dakika hazırlık ve 20 dakika pişirmeyle toplam 25 dakikada hazır. Airfryer kullanırsan dilimleri 200°C''de 10-12 dakikada kızartabilirsin.

    '
  notes:
  - t: Dilim kalınlığı
    d: 'Dilimleri yaklaşık 1 cm kalınlığında kesmek önemli. Daha kalın dilimler fırında dışı kızarırken ortası sert kalır, daha ince olanlar ise üst malzemenin ağırlığını taşıyamayıp kırılır. Kabuğu soymana gerek yok; kabuk dilimin şeklini korumasına yardım eder. Uzun ve düz bir tatlı patates seçersen dilimler ekmek boyutuna yakın olur. Bıçak kaymasın diye önce patatesin bir yanından ince bir parça kesip düz bir taban oluşturabilirsin.

      '
  - t: Önceden hazırlamak
    d: 'Fırınlanmış dilimler buzdolabında 4 gün dayanır. Pazar akşamı bir tepsi dilim hazırlayıp hafta içi sabahları kızartma makinesinde ya da airfryer''da kısa süre ısıtırsan kahvaltı beş dakikada hazır olur. Dilimleri ince kestiysen pişirmeden doğrudan kızartma makinesinde en yüksek ayarda 2-3 tur kızartmak da işe yarar. Avokadoyu ise önceden ezme; limonlu da olsa kararır, sabah taze hazırlamak daha iyi. Dilimleri saklarken aralarına pişirme kâğıdı koyarsan birbirine yapışmazlar.

      '
  - t: Üst malzeme alternatifleri
    d: 'Tuzlu tarafta avokado yerine labne ya da beyaz peynir, yumurta yerine haşlanmış yumurta dilimleri kullanabilirsin. Tatlı tarafta fıstık ezmesi yerine başka bir kuruyemiş ezmesi, bal yerine üzüm pekmezi ya da hurma şurubu olur. Limon suyu yoksa misket limonu ya da yarı ölçü elma sirkesi avokadonun rengini korur. Dilimler glutensiz olduğu için ekmekten kaçınanlar için pratik bir tost tabanıdır. Üst malzemeleri dilimler sıcakken koyarsan fıstık ezmesi hafifçe erir ve muz daha iyi tutunur.

      '
  faq:
  - q: Tatlı patates fırında kaç dakikada pişer?
    a: '1 cm kalınlığındaki dilimler 200°C fırında yaklaşık 20 dakikada, yarısında çevrilerek pişer.

      '
  - q: Tatlı patates tostu airfryer'da yapılır mı?
    a: 'Evet. Dilimleri 200°C''de 10-12 dakika, yarısında çevirerek kızartman yeterli.

      '
  - q: Tatlı patates kabuğuyla pişirilir mi?
    a: 'Evet, bu tarifte dilimler kabuğuyla pişiriliyor. Kabuk dilimin dağılmadan şeklini korumasına yardım eder.

      '
  - q: Fırınlanmış tatlı patates dilimleri kaç gün saklanır?
    a: 'Buzdolabında kapalı kapta 4 gün saklanır. Sabahları kızartma makinesinde ısıtıp kullanabilirsin.

      '
tatli-patatesli-yumurtali-kahvalti-tavasi:
  aramaBasligi: 'Tatlı patatesli yumurta tavası: Tek tavada, 28 dakikada'
  editorNote: 'Tatlı patatesi önce kapağı kapalı, sonra kapağı açık pişirmeyi iki ayrı adım olarak yazdık; ilki içini yumuşatıyor, ikincisi kenarlarını kızartıyor.

    '
  intro: 'Tatlı patatesli yumurtalı kahvaltı tavası, küp doğranmış tatlı patates, kapya biber ve soğanın tek tavada kızartılıp üzerine yumurta kırıldığı doyurucu bir kahvaltı. Ufalanmış beyaz peynir ve maydanozla tamamlanıyor, tavada masaya geliyor.


    Bu tarifte tatlı patatesi 1 cm''lik küplere kesip önce kapağı kapalı 8 dakika pişiriyoruz; buhar içini yumuşatıyor. Ardından kapağı açıp soğan, biber, tatlı toz biber ve kimyonu ekliyoruz ve küplerin kenarları kızarana kadar 6 dakika daha pişiriyoruz. Son adımda açılan dört çukura yumurtalar kırılıyor ve kapak altında 4 dakikada beyazları pişiyor, sarıları akışkan kalıyor.


    2 kişilik tarif 8 dakika hazırlık ve 20 dakika pişirmeyle toplam 28 dakikada hazır. Glutensiz bir kahvaltı.

    '
  notes:
  - t: Kızarmanın sırrı
    d: 'Kapağı açtıktan sonra patatesleri sık sık karıştırma. Küpler tavanın tabanına uzun süre temas ettikçe kenarları karamelize olup kızarır; sürekli çevirirsen ezilir ve buharda kalır. Arada bir, geniş bir spatulayla toplu halde çevirmek yeterli. Geniş bir tava kullanmak da önemli, çünkü üst üste binen küpler kızarmaz. Tuzu ve baharatları kapak açıldıktan sonra eklemek, tatlı toz biberin yanmadan rengini vermesini sağlar. Küplerin hepsini aynı boyda doğramak, aynı anda yumuşayıp kızarmalarını sağlar.

      '
  - t: Yumurtaların kıvamı
    d: 'Yumurtaları kırmadan önce kaşıkla açtığın çukurlar sarıların yerinde kalmasını sağlar. Kapağı kapatınca üstteki buhar beyazları pişirir; böylece yumurtayı çevirmeden üstten de pişirmiş olursun. Sarıların akışkan kalması için 4 dakika genelde yeterli, daha katı seviyorsan bir iki dakika uzatabilirsin. Ateşi orta seviyede tut; çok yüksek ateşte alttaki patatesler yanarken yumurta beyazı hâlâ çiğ kalabilir. Yumurtaları önce küçük bir kaseye kırıp oradan çukura dökersen sarının dağılma riski azalır.

      '
  - t: Malzeme alternatifleri
    d: 'Feta yerine tam yağlı beyaz peynir kullanabilirsin; peynirin tuzu tatlı patatesin tatlılığını dengeler. Kapya biber yoksa kırmızı dolmalık biber ya da süzülmüş közlenmiş kavanoz biberi olur. Kuru soğan yerine arpacık ya da mor soğan daha tatlı bir sonuç verir. Biraz acı seviyorsan servis sırasında pul biber ya da acı sos ekle. Yumurtasız hali, akşam yemeğinde et ya da tavuğun yanında garnitür olarak da kullanılabilir.

      '
  faq:
  - q: Tatlı patates tavada kaç dakikada pişer?
    a: '1 cm''lik küpler kapağı kapalı 8 dakikada yumuşar, kapağı açıp 6 dakika daha pişirince kenarları kızarır.

      '
  - q: Tatlı patates kahvaltıda nasıl yapılır?
    a: 'Küp doğranıp biber ve soğanla tavada kızartılır, üzerine yumurta kırılıp kapak altında pişirilir. Beyaz peynir ve maydanozla servis edilir.

      '
  - q: Tatlı patatesli yumurtada sarılar nasıl akışkan kalır?
    a: 'Yumurtaları kırdıktan sonra kapağı kapatıp yaklaşık 4 dakika pişir. Bu sürede beyazlar pişer, sarılar akışkan kalır.

      '
  - q: Tatlı patates yerine normal patates kullanılır mı?
    a: 'Kullanılabilir, ancak normal patates daha geç yumuşar; kapağı kapalı pişirme süresini birkaç dakika uzatman gerekir. Tat da daha az tatlı olur.

      '
tavuk-fajita:
  aramaBasligi: 'Tavuk fajita tarifi: Döküm tavada, 30 dakikada'
  editorNote: 'Sebzeleri ve tavuğu aynı tavada ayrı ayrı pişirmeyi seçtik; ikisi birlikte konursa tava soğur, biberler suyunu salıp haşlanır ve fajitanın isli, hafif kömürleşmiş tadı oluşmaz.

    '
  intro: 'Tavuk fajita, Tex-Mex mutfağının bilinen yemeklerinden biri: baharatla marine edilen şerit tavuk ve renkli biberler kızgın tavada sotelenir, masada tortillaya sarılarak yenir. Ekşi krema ve avokado yanında servis edilir, herkes kendi dürümünü hazırlar.


    Bu tarifte tavuğu kimyon, toz kırmızı biber, füme paprika, sarımsak tozu ve misket limonu suyuyla 10 dakika bekletiyoruz. Biber ve soğanı döküm tavada yüksek ateşte 4-5 dakika sotelemek onları diri tutuyor; tavuk aynı tavada 6-7 dakikada kızarıyor ve sebzeler en son geri ekleniyor. Tortillalar kuru tavada ısıtılıyor.


    4 kişilik tarif 15 dakika hazırlık ve 15 dakika pişirmeyle toplam 30 dakikada hazır. Misafire de hafta içi akşamına da uyan pratik bir yemek.

    '
  notes:
  - t: Yüksek ateş ve döküm tava
    d: 'Fajitanın karakteri yüksek ateşten gelir. Döküm tava ısıyı iyi tuttuğu için biberler kısa sürede hafif kömürleşir ama içleri diri kalır. Tavayı malzemeyi atmadan önce iyice ısıt ve sebzeleri tek seferde çok fazla koyma; tava kalabalıklaşırsa ısı düşer ve sebzeler suyunu salar. Döküm tavan yoksa kalın tabanlı geniş bir tava kullan. Tavuğu da aynı mantıkla, gerekirse iki partide pişir. Yağı tavaya, tava iyice kızdıktan sonra ekle; soğuk tavaya konan yağ sebzelere sinip onları yumuşatır.

      '
  - t: Tavuk göğsü mü but mu
    d: 'Tarif tavuk göğsüyle yazıldı; göğüs ince şeritlere kolay kesilir ve hızla pişer, ancak fazla kalırsa kurur. Bu yüzden 6-7 dakikalık süreyi aşmamaya dikkat et. Tavuk but kullanırsan et daha sulu olur ve biraz fazla pişmeyi tolere eder. Hangisini seçersen seç, şeritleri aynı kalınlıkta kesmek eşit pişmesini sağlar. Marine süresini uzatmana gerek yok; limon suyunun asidi uzun beklemede tavuğun dokusunu bozabilir.

      '
  - t: Malzeme alternatifleri
    d: 'Füme paprika yoksa tatlı toz biber ve bir tutam isot kullanabilirsin; isot o isli tadı kısmen verir. Misket limonu yerine normal limon olur. Ekşi krema yerine süzme yoğurda bir tatlı kaşığı limon suyu ekleyerek benzer bir sos elde edersin. Tortilla bulamazsan lavaş iyi bir alternatif. Kalan fajitayı ertesi gün pilav ya da salata üzerine koyarak öğle yemeği kutusunda değerlendirebilirsin. Avokadoyu servisten hemen önce kes ya da biraz misket limonu suyuyla ez, kararmasını geciktirir.

      '
  faq:
  - q: Tavuk fajita kaç dakikada pişer?
    a: 'Sebzeler yüksek ateşte 4-5 dakika, tavuk 6-7 dakika pişer. 10 dakikalık marineyle birlikte yemek toplam 30 dakikada hazır olur.

      '
  - q: Fajita baharatı nasıl yapılır?
    a: '1 tatlı kaşığı kimyon, 1 tatlı kaşığı toz kırmızı biber, 1 tatlı kaşığı füme paprika, yarım tatlı kaşığı sarımsak tozu ve 1 tatlı kaşığı tuz karıştırılır.

      '
  - q: Fajitada tortilla yerine ne kullanılır?
    a: 'Lavaş kullanabilirsin. Kuru tavada kısa süre ısıtırsan daha kolay sarılır.

      '
  - q: Fajitada füme paprika yerine ne konur?
    a: 'Tatlı toz biber ve bir tutam isot kullanabilirsin. İsot, füme paprikanın isli tadına yaklaşır.

      '
tavuklu-kori:
  aramaBasligi: 'Tavuklu köri tarifi: Hindistan cevizi sütüyle, 35 dakikada'
  editorNote: 'Baharatları tavuktan önce yağda bir dakika kavurmayı ayrı yazdık, çünkü köri tozu ve zerdeçal yağda açılmadan sosa girerse çiğ ve tozlu bir tat bırakır.

    '
  intro: 'Tavuklu köri, köri tozu, zerdeçal, sarımsak ve zencefille baharatlanan tavuğun hindistan cevizi sütünde pişirildiği kremamsı bir yemek. Köri adı Hint ve Güneydoğu Asya mutfaklarıyla özdeşleşse de bu tarif evdeki dolapla yapılabilecek sade bir versiyon.


    Bu tarifte kuşbaşı tavuk but kullanıyoruz; but, sosta pişerken kurumadan yumuşak kalıyor. Soğan yağda yumuşadıktan sonra baharatlar bir dakika kavruluyor, tavuk 5 dakika çevrilip salçayla birleşiyor. Ardından hindistan cevizi sütü ekleniyor ve kısık ateşte 15-20 dakika, sos koyulaşana kadar pişiyor. Kişnişle süsleyip basmati pilavıyla servis ediyoruz.


    4 kişilik tarif 10 dakika hazırlık ve 25 dakika pişirmeyle toplam 35 dakikada hazır. Glutensiz bir ana yemek.

    '
  notes:
  - t: Neden tavuk but
    d: 'Köri gibi sosta pişen yemeklerde tavuk but göğse göre daha iyi sonuç verir. Butun yağ ve bağ dokusu kısık ateşteki 15-20 dakikalık pişirmede eti sulu tutar, göğüs ise aynı sürede kuruyup lif lif dağılabilir. Göğüs kullanmak istersen tavuğu sos koyulaşmaya yakın ekleyip süreyi kısa tut. Kuşbaşıları eşit boyda doğramak da hepsinin aynı anda pişmesini sağlar. Tavuğu baharatlarla 5 dakika çevirmek etin dışını kaplar ve sosun tavuğa daha iyi tutunmasını sağlar.

      '
  - t: Sosun kıvamı
    d: 'Hindistan cevizi sütü kısık ateşte pişerken suyunu bırakarak koyulaşır. Ateşi yüksek tutarsan süt ayrışabilir ve sosun yüzeyinde yağ tabakası oluşur; bu yüzden hafif fokurdama yeterli. Sos çok koyulaşırsa bir iki kaşık sıcak suyla açabilirsin. Salça yerine 2-3 rendelenmiş domates kullanırsan pişirme süresini 5 dakika uzat ki domatesin suyu çeksin. Tuzu en son tadına bakarak ayarla. Kişnişi pişirmeye değil, servis sırasında eklemek tazeliğini korur; kişniş yoksa maydanoz ve biraz limon kabuğu rendesi kullan.

      '
  - t: Çeşitlemeler ve saklama
    d: 'Sosa bir avuç ıspanak ya da haşlanmış nohut ekleyerek yemeği zenginleştirebilirsin; ıspanağı son dakikalarda koy. Hindistan cevizi sütü yerine yoğurt kullanırsan köri Hint usulüne yaklaşır, ancak soğuk yoğurdu önce biraz sıcak sosla ılıştırarak ekle, yoksa keser. Köri buzdolabında kapalı kapta saklanır ve ertesi gün baharatlar daha oturmuş olur. Isıtırken biraz su eklemen gerekebilir. Basmati pilavını köri pişerken hazırlarsan iki yemek aynı anda masaya gelir.

      '
  faq:
  - q: Tavuklu köri kaç dakika pişer?
    a: 'Hindistan cevizi sütü eklendikten sonra kısık ateşte 15-20 dakika, sos koyulaşana kadar pişer. Toplam süre 35 dakikadır.

      '
  - q: Tavuklu köride hindistan cevizi sütü yerine ne kullanılır?
    a: 'Krema kullanabilirsin. Yoğurt da olur, ama soğuk yoğurdu sıcak sosla ılıştırarak eklemen gerekir.

      '
  - q: Tavuklu köri yanına ne gider?
    a: 'Basmati pilavı en uyumlu eşlikçidir; sos pilava geçerek yemeği tamamlar.

      '
  - q: Köri için tavuk göğsü mü but mu kullanılır?
    a: 'But daha iyi sonuç verir, çünkü sosta pişerken kurumaz. Göğüs kullanırsan pişirme süresini kısa tut.

      '
tavuklu-quesadilla:
  aramaBasligi: 'Tavuklu quesadilla tarifi: Tavada çıtır, 25 dakikada'
  editorNote: 'Peyniri harcın hem altına hem üstüne koymayı adımın içinde ayrıca belirttik; eriyen peynir iki kat tortillayı birbirine yapıştırarak quesadillanın kesilirken dağılmasını önlüyor.

    '
  intro: 'Quesadilla, Meksika mutfağından gelen, tortilla arasına peynir ve harç konup tavada kızartılan bir yemek. Adı içindeki peynirden geliyor; peynir eriyip tortillanın iki yüzünü birbirine yapıştırıyor.


    Bu tarifte şerit tavuk göğsünü kimyon ve toz kırmızı biberle pişirip kapya biber, soğan ve konserve mısırla birleştiriyoruz. Harç tortillanın yarısına, iki kat peynirin arasına yerleştiriliyor ve tortilla ikiye katlanıyor. Kuru tavada her yüzü 2 dakika pişince peynir eriyor, tortilla çıtırlaşıyor. Üçgen kesilip guacamole ve yoğurtla servis ediliyor.


    2 kişilik tarif 10 dakika hazırlık ve 15 dakika pişirmeyle toplam 25 dakikada hazır. Dolapta kalan pişmiş tavuğu değerlendirmek için de pratik bir yol.

    '
  notes:
  - t: Kuru tavada pişirmek
    d: 'Quesadillayı yağsız tavada pişirmek tortillanın yağ çekmeden çıtırlaşmasını sağlar. Ateşi orta seviyede tut; çok yüksek ateşte tortilla yanarken içteki peynir erimeye zaman bulamaz. Her yüz için 2 dakika genelde yeterli, peynirin kenarlardan hafifçe akmaya başlaması iyi bir işaret. Çevirirken geniş bir spatula kullan ve bir elinle üstten bastır, böylece harç dökülmez. İki quesadillayı ayrı ayrı pişir. Pişen quesadillayı kesmeden önce bir kesme tahtasına alıp birkaç saniye bekletmek de kesmeyi kolaylaştırır.

      '
  - t: Harcı kuru tutmak
    d: 'Islak harç tortillayı yumuşatır ve quesadillanın çıtırlığını bozar. Konserve mısırı iyice süzmek ve tavuklu harcı biber ile soğanın suyunu çekene kadar pişirmek bu yüzden önemli. Harç sıcakken doldurursan peynir daha hızlı erir, ama harcın çok sulu olmamasına dikkat et. Haşlanıp tanelenmiş taze mısır da kullanılabilir. Kalan tavuk ya da kıyma kullanacaksan baharatlarla kısa süre çevirip ısıtman yeterli. Tavuk şeritlerini ince kesmek, tortilla içinde katlanırken harcın düz yayılmasına da yardım eder.

      '
  - t: Peynir ve tortilla seçimi
    d: 'Tarifte rendelenmiş kaşar ya da çedar kullanıyoruz; ikisi de iyi erir ve uzar. Mozzarella ya da tost peyniri de olur, önemli olan eriyen bir peynir seçmek. Beyaz peynir gibi erimeyen peynirler tortillaları birbirine yapıştırmaz. Büyük tortilla bulamazsan lavaş kullanabilirsin; lavaş daha ince olduğu için pişirme süresini biraz kısalt. Kesmeden önce bir dakika dinlendirmek peynirin hafifçe toparlanmasını sağlar. Peyniri tortilla kenarlarına kadar yaymamak, tavada taşıp yanmasını önler.

      '
  faq:
  - q: Quesadilla tavada kaç dakika pişer?
    a: 'Kuru tavada her yüzü yaklaşık 2 dakika, peynir eriyip tortilla kızarana kadar pişer.

      '
  - q: Quesadilla için hangi peynir kullanılır?
    a: 'Rendelenmiş kaşar ya da çedar en pratik seçimdir. Mozzarella ya da tost peyniri gibi eriyen herhangi bir peynir de olur.

      '
  - q: Quesadilla neden dağılır?
    a: 'Peynir yalnızca bir katta olursa tortillalar birbirine yapışmaz. Harcı iki kat peynirin arasına koyarsan quesadilla kesilirken dağılmaz.

      '
  - q: Quesadillada tortilla yerine ne kullanılır?
    a: 'Lavaş kullanabilirsin. Lavaş daha ince olduğu için tavada daha çabuk kızarır.

      '
tek-tepside-tavuk-ve-kok-sebze:
  aramaBasligi: 'Fırında tavuk ve sebze tarifi: Tek tepside, 50 dakikada'
  editorNote: 'Marineyi ayrı bir kapta değil doğrudan tepside karıştırmayı seçtik; hem bulaşık azalıyor hem de tepsiye sinen salçalı yağ, sebzelerin altında kalıp kızarmalarına yardım ediyor.

    '
  intro: 'Tek tepside tavuk ve kök sebze, tavuk but ya da bagetin patates, havuç, kabak, kırmızı soğan ve sarımsakla aynı tepside fırınlandığı bir akşam yemeği. Hazırlığı bir kez doğramaktan ibaret; geri kalanını fırın yapıyor.


    Bu tarifte zeytinyağı, biber salçası, kekik, pul biber ve limondan oluşan marineyi tepside karıştırıp tavuk ve sebzeleri içinde buluyoruz. Sebzeleri pişme sürelerine göre doğruyoruz: patates ve havuç iri, kabak daha iri, çünkü kabak daha çabuk yumuşuyor. Her şey tek kat halinde yayılıyor ve 200°C fırında 40 dakika pişiyor, yarısında bir kez çevriliyor.


    3 kişilik tarif 10 dakika hazırlık ve 40 dakika pişirmeyle toplam 50 dakikada hazır. Glutensiz ve kalanı ertesi gün ofis kutusuna uygun bir yemek.

    '
  notes:
  - t: Tek kat yaymak
    d: 'Tepsideki malzemeler üst üste binerse alttakiler kendi buharında haşlanır, kızarmaz. Bu yüzden tavuk ve sebzeleri tek kat halinde yay, aralarında biraz boşluk kalsın. Tepsin küçükse malzemeyi iki tepsiye böl; iki tepsi aynı anda pişecekse yarısında yerlerini değiştir. Tavuk parçalarını derili tarafı üstte olacak şekilde yerleştirirsen deri fırının üst ısısıyla daha iyi kızarır. Marineyi tepside karıştırdığın için malzemeleri yaymadan önce her parçanın yağla kaplandığından emin ol; kuru kalan sebze kızarmaz, kurur.

      '
  - t: Doğrama boyutu
    d: 'Kök sebzeler ve kabak aynı sürede pişmez. Patates ve havuç daha sert olduğu için iri doğranır; kabak çok çabuk yumuşadığı için daha iri parçalar halinde bırakılır ki 40 dakikanın sonunda dağılmasın. Soğanı dörde bölmek katmanlarının ayrılmadan pişmesini sağlar. Sarımsakları kabuğuyla bırakınca içleri yanmadan yumuşar; servis sırasında kabuğundan sıkıp tavuğa sürebilirsin. Patates yerine tatlı patates kullanırsan süre biraz kısalır. Havuçları ince doğrarsan patateslerden önce yumuşar, bu yüzden ikisini yakın boyda tut.

      '
  - t: Pişip pişmediğini anlamak
    d: 'Tavuk but ve baget, kemiğe yakın kısmı bıçakla kesildiğinde pembe değil berrak su çıkarıyorsa pişmiştir. Sebzelerin ise çatal kolayca girmeli ve kenarları kızarmış olmalı. Fırınların ısısı farklı olduğu için 40 dakikanın sonunda bir kez kontrol et. Biber salçası yoksa domates salçası ve bir tatlı kaşığı pul biber, limon yoksa misket limonu ya da yarı ölçü elma sirkesi kullanabilirsin. Tavuk pişmiş ama sebzeler hâlâ sertse tavuğu bir tabağa alıp sebzeleri birkaç dakika daha fırında bırak.

      '
  faq:
  - q: Fırında tavuk but kaç dakikada pişer?
    a: 'Bu tarifte tavuk but ya da baget, sebzelerle birlikte 200°C fırında 40 dakikada pişer. Yarısında bir kez çevrilir.

      '
  - q: Fırında sebzeler neden kızarmaz?
    a: 'Tepsi kalabalıksa sebzeler üst üste biner ve buharda haşlanır. Tek kat yaymak ya da iki tepsiye bölmek kızarmalarını sağlar.

      '
  - q: Fırında tavuk ve sebze için hangi sıcaklık kullanılır?
    a: '200°C. Bu sıcaklıkta tavuk dışından kızarırken sebzeler de yumuşar.

      '
  - q: Tek tepside tavukta patates yerine ne kullanılır?
    a: 'Tatlı patates kullanabilirsin. Tatlı patates daha çabuk yumuşadığı için pişirme süresi biraz kısalır.

      '
topik:
  aramaBasligi: 'Topik tarifi: Nohut ve patatesli vegan meze, 8 kişilik'
  editorNote: 'Bu versiyonda dış hamura haşlanmış patates ekledik; patates nohut hamurunu bağladığı için toplar ayrıca pişirilmeden, buzdolabında dinlenerek şekil tutuyor.

    '
  intro: 'Topik, İstanbul Ermeni mutfağının bilinen mezelerinden biri: nohut hamurundan bir dış katman, içinde uzun süre kavrulmuş soğan, dolmalık fıstık, kuş üzümü, tarçın ve yenibahar. Servis sırasında dilimlenip üzerine tahin gezdirilir ve tarçın serpilir.


    Bu tarifte iç harç için beş kuru soğanı kısık ateşte 30 dakika, koyu karamel rengi alana kadar kavuruyoruz; topiğin tatlılığı buradan geliyor. Dış hamur, kabuğu soyulmuş haşlanmış nohut ve haşlanmış patatesin robotta çekilmesiyle hazırlanıyor. Islak bir tülbent ya da streç film yardımıyla portakal büyüklüğünde toplar yapılıyor ve buzdolabında en az 3 saat dinlendiriliyor.


    8 kişilik tarif 40 dakika hazırlık ve 60 dakika pişirmeyle toplam 100 dakika sürüyor; buna 3 saatlik dinlenme ekleniyor. Vegan ve glutensiz bir meze.

    '
  notes:
  - t: Soğanı sabırla kavurmak
    d: 'Topiğin tadının büyük kısmı iç harçtaki soğandan gelir. Soğanları zeytinyağında kısık ateşte, ara ara karıştırarak 30 dakika kavurmak şekerlerinin karamelize olmasını sağlar. Ateşi yükseltirsen soğan dışından yanar, içi pişmez ve acı bir tat kalır. Tava kurursa bir iki kaşık su ekleyip devam edebilirsin. Fıstık, üzüm, baharatlar, şeker ve tahin ateşten aldıktan sonra eklenir; harcı şekil vermeden önce tamamen soğut. Kavrulmuş soğanı bir gün önceden hazırlayıp buzdolabında saklayabilir, ertesi gün şekil vermeye geçebilirsin.

      '
  - t: Pürüzsüz dış hamur
    d: 'Nohutların kabuğunu tek tek soymak zahmetli ama dış hamurun ince ve pürüzsüz olmasının yolu bu. Kabuklu nohut robotta lifli kalır ve hamur kolay çatlar. Konserve haşlanmış nohut kullanıyorsan ıslatma ve haşlama adımını atlayabilirsin, ancak kabukları yine soy. Patatesler sıcakken değil, ılınınca nohutla çekilirse hamur daha az yapışır. Hamur ele yapışıyorsa ellerini ıslatarak çalış. Kabukları kolay soymak için nohutları avuçlarının arasında hafifçe ovarak suyun içinde yıkayabilirsin; kabuklar yüzeye çıkar.

      '
  - t: Şekil verme ve servis
    d: 'Islak tülbent ya da streç filmin üzerine bir avuç hamuru düz bir daire halinde yay, ortasına iki kaşık iç koy ve kenarları toplayarak sıkıca bük. Bu bükme hem topu kapatır hem şeklini sabitler. Toplar tülbentleriyle birlikte buzdolabında en az 3 saat dinlenmeli; hamur bu sürede sertleşir ve kesildiğinde dağılmaz. Servis ederken dörde kes, üzerine tahin gezdirip tarçın serp. Dörde keserken her kesimden sonra bıçağı ıslatmak, hamurun bıçağa yapışmasını önler.

      '
  faq:
  - q: Topik nedir?
    a: 'Nohut ve patates hamurunun içine kavrulmuş soğan, fıstık, kuş üzümü ve baharat doldurularak yapılan, tahin ve tarçınla servis edilen İstanbul Ermeni mutfağına ait bir mezedir.

      '
  - q: Topik ne kadar dinlendirilir?
    a: 'Toplar tülbentlerinin içinde buzdolabında en az 3 saat dinlendirilmelidir. Bu süre hamurun sertleşip kesildiğinde dağılmamasını sağlar.

      '
  - q: Topik için soğan kaç dakika kavrulur?
    a: 'Kısık ateşte yaklaşık 30 dakika, koyu karamel rengi alana kadar kavrulur.

      '
  - q: Topikte konserve nohut kullanılır mı?
    a: 'Evet, konserve haşlanmış nohut kullanabilirsin; ıslatma ve haşlama adımını atlarsın. Pürüzsüz bir hamur için kabuklarını yine soy.

      '
