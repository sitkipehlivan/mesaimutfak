ispanakli-borek:
  updated: '__BUGUN__'
  editorNote: |
    Ispanaklı börekte en sık karşılaşılan "altı hamur kaldı" sorununu önlemek için ıspanağın suyunu tamamen çektirmeyi ilk adıma koyduk. Fırına vermeden önceki 15 dakikalık dinlendirmeyi de bu yüzden ayrı bir adım olarak yazdık.
  intro: |
    Ispanaklı börek, hazır yufkayla yapılan tepsi böreklerinin en sevilenlerinden biri. Sütlü yumurtalı sos yufkaların arasına işleyerek börek yumuşak ama katlı bir doku kazanıyor; ıspanaklı peynirli harç da ortada katman oluşturuyor.

    Bu tarifte ıspanak soğanla birlikte suyunu salıp çekene kadar pişiriliyor, soğuyunca beyaz peynirle karıştırılıyor. Yufkalar tepsiye sos sürülerek seriliyor, ara yufka buruşturularak dağıtılıyor ve harç iki kat halinde yayılıyor.

    8 kişilik tarif yaklaşık 65 dakikada hazır. Bir gün önceden hazırlayıp sabah fırınlamak da mümkün.
  notes:
    - t: Ispanağın suyu
      d: |
        Ispanak pişerken çok su salar. Bu suyun tamamen çekilmesi gerekir; aksi halde harç yufkaları ıslatır ve böreğin altı pişmeden hamur gibi kalır. Pişen ıspanağı süzgece alıp kaşıkla bastırmak fazla suyu almak için kolay bir yol.
    - t: Yufkayı buruşturmak
      d: |
        Ara katta yufkayı parçalayıp buruşturarak dağıtmak, sosun yufka katmanları arasına daha iyi işlemesini sağlar. Böylece börek hem daha yumuşak hem de daha kabarık olur. Düz serilen yufka sosu üstte tutar ve sertleşir.
    - t: Dinlendirmenin önemi
      d: |
        Fırına vermeden önce 15 dakika beklemek, yufkaların sosu çekmesine zaman tanır. Bu adımı atlarsan yufka kuru kalır, sos tepsinin dibinde toplanır.
    - t: Saklama ve ısıtma
      d: |
        Buzdolabında 3 gün dayanır. Fırında 160°C'de 10 dakika ısıtmak çıtırlığını geri getirir; mikrodalga böreği yumuşatır. Pişmiş börek dilim dilim dondurulabilir.
  faq:
    - q: Ispanaklı börek neden hamur kalır?
      a: Genelde ıspanağın suyu yeterince çekilmediği ya da fırın yeterince sıcak olmadığı için. Ispanağı iyice süzmek ve 190°C önceden ısıtılmış fırında pişirmek sorunu çözer.
    - q: Ispanak haşlanır mı, kavrulur mu?
      a: Bu tarifte soğanla birlikte tavada kavruluyor; böylece hem suyunu çekiyor hem de soğanın tadını alıyor. Haşlanan ıspanak ise daha çok su tutar ve iyice süzülmesi gerekir.
    - q: Ispanaklı börek bir gün önceden hazırlanır mı?
      a: Evet. Böreği tepside hazırlayıp üzerini kapatarak buzdolabında bir gece bekletebilir, sabah doğrudan fırına verebilirsin. Pişirme süresine 5 dakika ekle.
    - q: Ispanaklı böreğe peynir yerine ne konur?
      a: Lor peyniri, kaşar ya da tulum peyniri kullanılabilir. Peynirsiz versiyon için ıspanağa biraz daha soğan ve pul biber eklemek tadı dengeler.

sigara-boregi:
  updated: '__BUGUN__'
  editorNote: |
    Sigara böreğinde sardıktan sonra 10 dakika buzdolabında bekletmeyi püf noktası olarak ekledik; kızartırken açılmalarının önüne geçen en basit adım bu. Airfryer seçeneğini de daha hafif bir versiyon isteyenler için tarifin içinde tuttuk.
  intro: |
    Sigara böreği, beyaz peynirli harcın yufkaya ince ince sarılıp kızartıldığı, misafir sofralarının ve çay saatlerinin en hızlı hamur işlerinden biri. Adını incecik sarılmış sigara şeklinden alıyor.

    Bu tarifte yufkalar üçgen dilimlere kesiliyor, geniş kenarına peynirli maydanozlu harç konup kenarlar içe katlanarak sıkıca sarılıyor. Uçları yumurtayla yapıştırılıp kızgın yağda altın rengi olana kadar kızartılıyor.

    4 kişilik tarif 25 dakikada hazır. Sarılmış börekler dondurulabilir; misafir geldiğinde doğrudan kızartılır.
  notes:
    - t: Sıkı sarmak
      d: |
        Sigara böreği gevşek sarılırsa kızarırken yağ içine dolar ve börek ağırlaşır. Kenarları içe katlayıp sıkıca sarmak hem yağ çekmesini azaltır hem de harcın taşmasını önler.
    - t: Yağın sıcaklığı
      d: |
        Yağ orta sıcaklıkta olmalı. Çok sıcak yağda yufka hemen kararır, içindeki peynir erimeden börek yanmış görünür. Soğuk yağda ise yufka yağı emer ve börek yumuşak kalır. Bir parça yufkayı yağa attığında hemen kabarcıklanıp yüzeye çıkıyorsa sıcaklık doğrudur.
    - t: Harç çeşitleri
      d: |
        Beyaz peynir ve maydanoz klasik harç. Kaşar, patates püresi, kıymalı harç ya da pastırmalı kaşar da kullanılabilir. Harcın kuru olması önemli; sulu harç yufkayı yumuşatır ve börek kızarırken açılır.
    - t: Dondurma
      d: |
        Sarılmış ama kızartılmamış börekleri tepsiye tek tek dizip dondurucuda beklet, donunca poşete al. 2 ay saklanabilir. Çözdürmeden doğrudan kızgın yağda ya da airfryer'da pişirilir.
  faq:
    - q: Sigara böreği neden açılır?
      a: Gevşek sarılması ya da ucunun iyi yapıştırılmaması yüzünden. Sıkıca sarıp ucunu yumurtayla yapıştırmak ve kızartmadan önce 10 dakika buzdolabında bekletmek açılmayı önler.
    - q: Sigara böreği fırında yapılır mı?
      a: Evet. Börekleri yağlı kâğıt serili tepsiye dizip üzerlerine yağ sürerek 200°C fırında 15-20 dakika pişirebilirsin. Kızartma kadar çıtır olmaz ama daha hafif olur.
    - q: Sigara böreği airfryer'da kaç dakika pişer?
      a: Üzerlerine yağ sürülmüş börekler 190°C'de yaklaşık 8-10 dakika pişer; yarısında çevirmek her tarafın eşit kızarmasını sağlar.
    - q: Sigara böreği için hangi yufka kullanılır?
      a: Normal hazır yufka kullanılır. Baklavalık yufka çok ince olduğu için kızartırken kolayca yanar ve yırtılır.

gozleme:
  updated: '__BUGUN__'
  editorNote: |
    Gözlemenin evde sac olmadan da yapılabildiğini göstermek için tarifi geniş tavaya göre yazdık. Ispanağı soğanla ovup suyunu sıkmak, gözlemenin içinin sulanmaması için en önemli adım.
  intro: |
    Gözleme, ince açılan hamurun içine harç konulup sacda pişirildiği, Anadolu köy kahvaltılarının ve yol üstü molalarının simgesi olmuş bir hamur işi. Adını, sacda pişerken üzerinde oluşan benekli kızarıklıklardan, yani "gözlerden" aldığı söylenir.

    Bu tarifte mayasız, yumuşak bir hamur un, su, tuz ve yağla yoğruluyor. Ispanak rendelenmiş soğanla ovulup suyu sıkılıyor ve beyaz peynirle karıştırılıyor. Hamur ince açılıp harç konuyor, katlanıp tereyağı sürülerek tavada pişiriliyor.

    4 kişilik tarif 50 dakikada hazır. Sac yoksa geniş, kalın tabanlı bir tava da iş görür.
  notes:
    - t: Hamurun inceliği
      d: |
        Gözlemenin çıtır olması hamurun inceliğine bağlı. Hamur, oklavayla neredeyse yufka inceliğinde açılmalı. Kalın açılan hamur pişerken içi hamur kalır ve gözleme ağırlaşır.

        Hamuru yoğurduktan sonra en az 20 dakika dinlendirmek, açarken geri çekmesini önler.
    - t: Harcın kuru olması
      d: |
        Ispanağı rendelenmiş soğanla ovup suyunu sıkmak hem ıspanağı yumuşatır hem de fazla suyu alır. Sulu harç hamuru ıslatır ve gözleme tavaya yapışır.
    - t: Sac yerine tava
      d: |
        Geniş, kalın tabanlı bir tava ya da döküm tava kullanılabilir. Tava orta-yüksek ateşte iyice ısıtılmalı; gözleme tavaya konduğunda hafifçe cızırdamalı. Her yüzüne tereyağı sürerek, benek benek kızarana kadar çevirerek pişirmek gerekir.
    - t: Harç çeşitleri
      d: |
        Patatesli, kıymalı, sadece peynirli ya da otlu gözleme de yapılabilir. Yöntem aynıdır; sadece harcın kuru ve önceden pişmiş (patates ve kıyma için) olması gerekir.
  faq:
    - q: Gözleme hamuru mayalı mı olur?
      a: Geleneksel gözleme hamuru mayasızdır; un, su, tuz ve az yağla yoğrulur. Mayalı versiyonlar da vardır ama daha kalın ve yumuşak olur.
    - q: Gözleme tavada nasıl yapılır?
      a: Geniş ve kalın tabanlı bir tavayı orta-yüksek ateşte iyice ısıt, gözlemeyi koy, her yüzüne tereyağı sürerek benekli kızarıklar oluşana kadar pişir.
    - q: Gözlemeye hangi harçlar konur?
      a: En yaygınları peynirli ıspanaklı, patatesli, kıymalı ve sadece peynirli. Harç kuru olmalı; kıyma ve patates önceden pişirilmeli.
    - q: Gözleme neden sert olur?
      a: Hamura fazla un eklendiği ya da çok uzun pişirildiği için. Hamur yumuşak olmalı ve gözleme her yüzü kızarınca hemen tavadan alınmalı.

kazandibi:
  updated: '__BUGUN__'
  editorNote: |
    Kazandibinin en hassas anı, tabanın karamelize edildiği ocak üstü aşaması. Tarifte şekerin acılaşmaya başladığını kokusundan anlamayı özellikle yazdık; rengin koyulaştığı an çok hızlı geçiyor.
  intro: |
    Kazandibi, Osmanlı saray mutfağından günümüze gelen, adını tencerenin dibinde karamelize olan muhallebiden alan bir sütlü tatlı. Üstü beyaz ve pürüzsüz, altı karamelize ve hafif yanık tadında; rulo yapılarak servis ediliyor.

    Bu tarifte süt, şeker, pirinç unu ve nişastayla klasik bir muhallebi pişiriliyor. Tereyağı ve pudra şekeriyle hazırlanan fırın kabına dökülüp ocağın üzerinde kabı döndürerek tabanı karamelize ediliyor.

    8 kişilik tarif yaklaşık 45 dakikada hazır, ama en az 4 saat buzdolabında beklemesi gerekiyor.
  notes:
    - t: Karamelize etme
      d: |
        Kabın tabanı ocakta kısık-orta ateşte, kabı sürekli döndürerek ısıtılmalı ki şeker eşit karamelize olsun. Kenarlarda kahverengileşme görüldüğünde ve hafif karamel kokusu geldiğinde işlem tamamdır.

        Koku keskin ve yanık şekere döndüğünde hemen ocağı kapat; daha fazlası tatlıyı acılaştırır.
    - t: Kap seçimi
      d: |
        Doğrudan ocağa konabilen metal ya da teflon fırın kabı kullanılmalı. Cam ya da seramik kap ocakta çatlayabilir. Kabın tabanı düz olmalı ki karamelizasyon eşit olsun.
    - t: Rulo yapma
      d: |
        Kazandibi tamamen soğuyup en az 4 saat buzdolabında beklemeli. Kare kesilen dilimler, spatula ile tabandan kaldırılıp karamelli yüz dışta kalacak şekilde rulo yapılır. Yeterince soğumamış kazandibi rulo yaparken dağılır.
    - t: Saklama
      d: |
        Buzdolabında, üzeri streç filmle kapalı olarak 3 gün taze kalır. Dondurmayı önermiyoruz; muhallebi çözülürken su salar.
  faq:
    - q: Kazandibi nasıl karamelize edilir?
      a: Muhallebi dökülmüş metal kabı ocağın üzerine koyup kısık-orta ateşte, kabı döndürerek 10-15 dakika ısıtmak tabanın karamelize olmasını sağlar.
    - q: Kazandibi neden acı olur?
      a: Taban fazla yakıldığında şeker acılaşır. Kenarlar kahverengileştiğinde ve karamel kokusu geldiğinde ocağı kapatmak gerekir.
    - q: Kazandibi fırında yapılır mı?
      a: Geleneksel yöntem ocak üstüdür. Fırının üst ızgarasında üstü kızartılan muhallebi daha çok fırında sütlaca benzer; kazandibinin karakteristik karamelize tabanı ocakta oluşur.
    - q: Kazandibi kaç gün dayanır?
      a: Buzdolabında, üzeri kapalı olarak 3 gün taze kalır.

kunefe:
  updated: '__BUGUN__'
  editorNote: |
    Künefeyi iki kişilik, küçük tava ölçüsünde yazdık; künefenin en iyi hali sıcakken ve hemen yenen hali olduğu için büyük tepsi yerine porsiyonluk yapmak daha iyi sonuç veriyor. Tuzlu peynir uyarısını da bu yüzden en başa koyduk.
  intro: |
    Künefe, tel kadayıf ve tuzsuz peynirin tereyağıyla kızartılıp şerbetle buluştuğu, Hatay mutfağının en ünlü tatlısı. Sıcakken kesildiğinde uzayan peynir ve çıtır kadayıf, künefeyi diğer şerbetli tatlılardan ayırıyor.

    Bu tarifte tel kadayıf ince doğranıp eritilmiş tereyağıyla ovuluyor, tavaya iki kat halinde peynirle birlikte bastırılıyor. Kısık ateşte iki yüzü de kızartılıp sıcakken ılık şerbet gezdiriliyor ve Antep fıstığı serpiliyor.

    2 kişilik tarif 35 dakikada hazır. Künefe sıcak yenir; beklediğinde peynir sertleşir.
  notes:
    - t: Peynir seçimi
      d: |
        Künefe için tuzsuz künefe peyniri ya da Hatay peyniri kullanılır; bu peynirler ısıtıldığında uzar ve eriyip yağ salmaz. Tuzlu peynir kullanılacaksa bir gece suda bekletip tuzunu almak gerekir.

        Taze kaşar ya da mozzarella da alternatif olarak kullanılabilir, ancak tat ve doku farklı olur.
    - t: Kadayıfı tereyağıyla ovmak
      d: |
        Tel kadayıfın tereyağıyla iyice ovulması, her telin yağla kaplanmasını ve pişerken eşit kızarmasını sağlar. Yeterince yağlanmamış kadayıf beyaz ve kuru kalır.
    - t: Sıcak tatlı, ılık şerbet
      d: |
        Künefede şerbet ılık olmalı ve sıcak tatlının üzerine dökülmeli. Soğuk şerbet peynirin hemen sertleşmesine neden olur; çok sıcak şerbet ise kadayıfın çıtırlığını yok eder.
    - t: Fırında pişirmek
      d: |
        Ocakta ters çevirmek zor gelirse künefe 200°C fırında da pişirilebilir. Tava fırına uygun olmalı; alt kısım kızardığında üst kısmın da kızarması için son birkaç dakika üst ızgarayı açabilirsin.
  faq:
    - q: Künefeye hangi peynir konur?
      a: Tuzsuz künefe peyniri ya da Hatay peyniri. Bu peynirler ısıtıldığında uzar ve yağ salmaz. Bulunamazsa taze kaşar ya da mozzarella kullanılabilir.
    - q: Künefe şerbeti sıcak mı soğuk mu dökülür?
      a: Ilık şerbet sıcak künefenin üzerine dökülür. Böylece kadayıf çıtırlığını korur, peynir de sertleşmez.
    - q: Künefe fırında yapılır mı?
      a: Evet. Fırına uygun bir tavada 200°C'de alt ve üstü kızarana kadar pişirilebilir; ters çevirmeye gerek kalmaz.
    - q: Künefe önceden hazırlanır mı?
      a: Kadayıf ve peynir tavaya dizilip buzdolabında birkaç saat bekletilebilir. Ancak pişirme ve şerbetleme servis anında yapılmalı; künefe sıcak yenir.

ev-baklavasi:
  updated: '__BUGUN__'
  editorNote: |
    Ev baklavasını hazır baklavalık yufkayla yazdık; ev mutfağında 40 kat ince yufka açmak gerçekçi değil. Tarifte en çok vurguladığımız iki şey, fırına vermeden önce kesmek ve soğuk şerbeti sıcak baklavaya dökmek.
  intro: |
    Baklava, Türk tatlıcılığının en bilinen ve en köklü tatlısı. İncecik yufka katları, aralarında ceviz ya da fıstık, bol tereyağı ve şerbet; bayram sofralarının ve özel günlerin vazgeçilmezi.

    Bu tarifte hazır baklavalık yufka kullanılıyor. Yufkalar tek tek, tereyağı ve sıvı yağ karışımı sürülerek tepsiye diziliyor, ortaya ceviz yayılıyor. Fırından önce kesiliyor ve altın rengi olana kadar pişirildikten sonra soğuk şerbet dökülüyor.

    20 dilimlik tarif yaklaşık 85 dakikada hazır, ama şerbeti çekmesi için en az 4 saat beklemesi gerekiyor.
  notes:
    - t: Yufkayı kurutmamak
      d: |
        Baklavalık yufka çok ince olduğu için havayla temas ettiğinde hızla kurur ve kırılır. Çalışırken kullanmadığın yufkaların üzerini nemli bir bezle örtmek gerekir.
    - t: Yağ karışımı
      d: |
        Sadece tereyağı kullanmak baklavaya en iyi tadı verir, ancak tereyağı içindeki süt katıları yanabilir. Tereyağını sıvı yağla karıştırmak hem yanmayı önler hem de yufkaların daha çıtır olmasını sağlar. Tereyağını eritip köpüğünü almak (sade yağ) da iyi bir yöntem.
    - t: Fırından önce kesmek
      d: |
        Baklava pişirildikten sonra yufkalar kırılgan olduğu için temiz kesilmez. Fırına vermeden önce keskin bir bıçakla, tepsinin dibine kadar kesmek gerekir.
    - t: Şerbetin sıcaklığı
      d: |
        Kural basit: sıcak baklava, soğuk şerbet. Fırından yeni çıkmış sıcak baklavanın üzerine tamamen soğumuş şerbet dökülürse baklava şerbeti çeker ama çıtırlığını korur. İkisi de sıcak olursa baklava hamurlaşır.
    - t: Saklama
      d: |
        Oda sıcaklığında, üzeri kapalı olarak 1 hafta dayanır. Buzdolabında saklamak yufkaları sertleştirir.
  faq:
    - q: Baklava şerbeti sıcak mı soğuk mu dökülür?
      a: Sıcak baklavanın üzerine soğuk şerbet dökülür. Bu, baklavanın şerbeti çekip çıtırlığını korumasını sağlar.
    - q: Baklava neden hamur olur?
      a: Genelde şerbet ve baklava aynı sıcaklıkta olduğu ya da baklava yeterince pişmediği için. Baklava altın rengi olana kadar pişmeli ve soğuk şerbet kullanılmalı.
    - q: Baklava kaç derecede pişer?
      a: Bu tarifte 170°C fırında yaklaşık 40-45 dakika pişiyor. Üstü altın rengi alıp tepsinin kenarlarından cızırtı sesi geldiğinde hazır.
    - q: Ev baklavası kaç gün dayanır?
      a: Oda sıcaklığında, üzeri kapalı olarak yaklaşık 1 hafta dayanır. Buzdolabında saklamak önerilmez.

sekerpare:
  updated: '__BUGUN__'
  editorNote: |
    Şekerparede hamura irmik ekledik; irmik tatlıya o tanıdık hafif kumlu dokuyu veriyor ve şerbeti daha iyi çekmesini sağlıyor. Şerbeti çekmesi için en az 2 saat beklemeyi ayrıca vurguladık.
  intro: |
    Şekerpare, irmikli tereyağlı hamurun yuvarlanıp fırında pişirildiği ve şerbete bulandığı, Türk mutfağının en bilinen şerbetli tatlılarından. Ortasındaki fındık ya da bademle tanınıyor.

    Bu tarifte tereyağı ve pudra şekeri krema kıvamında çırpılıyor, yumurta, irmik ve kabartma tozu ekleniyor. Un azar azar eklenerek yumuşak bir hamur elde ediliyor. Yuvarlanan hamura fındık bastırılıp yumurta sarısı sürülüyor ve fırınlanıyor.

    20 adetlik tarif yaklaşık 55 dakikada hazır. Şerbeti çekmesi için en az 2 saat dinlendirilmeli.
  notes:
    - t: İrmiğin görevi
      d: |
        İrmik şekerpareye hafif kumlu, gevrek bir doku kazandırır ve şerbeti daha iyi çekmesini sağlar. Sadece unla yapılan şekerpare daha yumuşak ve kek gibi olur.
    - t: Hamurun kıvamı
      d: |
        Şekerpare hamuru ele yapışmayan, yumuşak bir kıvamda olmalı. Fazla un eklenirse hamur sertleşir ve şerbeti çekmez. Unu azar azar eklemek ve hamur ele yapışmadığı anda durmak gerekir.
    - t: Şerbetleme
      d: |
        Sıcak şekerparenin üzerine soğuk şerbet dökülür. Şerbet tatlıların yarısına kadar gelmeli; tamamen boğulmaları hamurlaşmalarına neden olabilir. En az 2 saat, tercihen bir gece bekletmek tatlının şerbeti tamamen çekmesini sağlar.
    - t: Saklama
      d: |
        Oda sıcaklığında, üzeri kapalı olarak 4-5 gün dayanır. Buzdolabında saklamak tatlıyı sertleştirebilir.
  faq:
    - q: Şekerpare neden sert olur?
      a: Genelde hamura fazla un eklendiği ya da şerbeti yeterince çekmediği için. Unu azar azar eklemek ve şerbeti en az 2 saat çektirmek gerekir.
    - q: Şekerpare şerbeti nasıl dökülür?
      a: Sıcak şekerparelerin üzerine soğuk şerbet dökülür. Şerbet tatlıların yarısına kadar gelmeli.
    - q: Şekerpareye irmik konur mu?
      a: Evet, irmik şekerpareye hafif kumlu ve gevrek bir doku verir ve şerbeti daha iyi çekmesini sağlar.
    - q: Şekerpare önceden yapılır mı?
      a: Evet, hatta bir gün önceden yapılması önerilir; şerbeti tamamen çekmiş şekerpare daha lezzetli olur.

tulumba:
  updated: '__BUGUN__'
  editorNote: |
    Tulumbanın patlamaması için ılık yağda kızartmaya başlamayı tarifin merkezine koyduk; kızgın yağa atılan tulumba dışı hızla pişip içi buhar yaptığı için çatlıyor. Hamurun soğuduktan sonra yumurta eklenmesi de aynı derecede önemli.
  intro: |
    Tulumba tatlısı, haşlanmış hamurun yıldız uçlu bir sıkma torbasından çıkarılıp kızartıldığı ve şerbete batırıldığı, Türk mutfağının en sevilen sokak tatlılarından biri. Çıtır dışı, yumuşak içi ve şerbetiyle bilinir.

    Bu tarifte su ve tereyağı kaynatılıp un, irmik ve nişasta bir kerede eklenerek hamur pişiriliyor. Soğuduktan sonra yumurtalar tek tek eklenerek pürüzsüz bir hamur elde ediliyor. Hamur ılık yağa sıkılıp yavaş yavaş kızartılıyor.

    8 kişilik tarif yaklaşık 50 dakikada hazır. Tulumbalar sıcakken soğuk şerbete atılıyor.
  notes:
    - t: Ilık yağda başlamak
      d: |
        Tulumbanın patlamaması ve içinin pişmesi için yağın ılıkken hamurun sıkılması gerekir. Yağ yavaş yavaş ısındıkça tulumba kabarır ve içi pişer. Kızgın yağa atılan tulumbanın dışı hemen kızarır, içi pişmeden buhar oluşur ve tatlı patlar.
    - t: Hamuru soğutmak
      d: |
        Pişen hamur yumurtalar eklenmeden önce ılımalı. Sıcak hamura yumurta eklenirse yumurta pişer ve hamur topaklanır. Yumurtaları tek tek, her biri tamamen yedirildikten sonra eklemek gerekir.
    - t: Şerbetleme
      d: |
        Sıcak tulumbalar soğuk şerbete atılıp yaklaşık 5 dakika bekletilir, ardından süzülür. Şerbette fazla bekleyen tulumba yumuşar ve çıtırlığını kaybeder.
    - t: Saklama
      d: |
        Tulumba en iyi taze yenir. Oda sıcaklığında 1-2 gün dayanır; zamanla çıtırlığını kaybeder. Buzdolabında saklamak hamurun sertleşmesine yol açar.
  faq:
    - q: Tulumba neden patlar?
      a: Kızgın yağa atıldığında dışı hemen pişip içi buhar yaptığı için patlar. Ilık yağda kızartmaya başlamak ve ateşi yavaş yavaş artırmak bunu önler.
    - q: Tulumba hamuru neden sulu olur?
      a: Genelde yumurtalar fazla eklendiği ya da hamur yeterince pişirilmediği için. Hamur tencereden ayrılıp topak olana kadar pişirilmeli, yumurtalar tek tek eklenmeli.
    - q: Tulumba şerbette ne kadar bekletilir?
      a: Sıcak tulumbalar soğuk şerbette yaklaşık 5 dakika bekletilir. Fazla beklerse yumuşar.
    - q: Tulumba için hangi uç kullanılır?
      a: Yıldız (tırtıklı) uçlu sıkma torbası kullanılır; tulumbaya karakteristik çizgili görünümünü bu uç verir.

revani:
  updated: '__BUGUN__'
  editorNote: |
    Revanide yoğurt ve limon kabuğunu bir arada kullanmayı tercih ettik; yoğurt kekin yumuşak ve nemli olmasını, limon kabuğu ise şerbetli tatlının ağırlığını dengeleyen ferahlığı sağlıyor.
  intro: |
    Revani, irmikli bir kekin şerbete batırılmasıyla yapılan, Türk mutfağının en kolay şerbetli tatlılarından biri. Adının, 17. yüzyılda Revan seferinin ardından yapılan kutlamalardan geldiği anlatılır.

    Bu tarifte yumurta ve şeker köpürtülüp yoğurt ve sıvı yağla birleştiriliyor; irmik, un, kabartma tozu ve limon kabuğu eklenerek tepside pişiriliyor. Sıcakken soğuk şerbet dökülüyor ve hindistan ceviziyle servis ediliyor.

    12 dilimlik tarif 50 dakikada hazır. Şerbeti çektikten sonra dilimlenmeli; ertesi gün daha lezzetli olur.
  notes:
    - t: İrmik ve un dengesi
      d: |
        Revaniye karakteristik dokusunu veren irmiktir. İrmik ve unun eşit oranda kullanılması kekin hem şerbeti çekmesini hem de dağılmamasını sağlar. Sadece irmikle yapılan revani daha kumlu, sadece unla yapılan ise kek gibi olur.
    - t: Şerbet miktarı
      d: |
        Revani bol şerbetli bir tatlıdır, ama şerbetin tamamı bir kerede dökülmemeli. Önce yarısını döküp çekmesini bekleyip kalanını eklemek, kekin eşit ıslanmasını sağlar.
    - t: Limon kabuğu
      d: |
        Limon kabuğu rendesi şerbetli tatlının ağırlığını dengeler ve ferah bir koku katar. Sadece kabuğun sarı kısmını rendelemek gerekir; beyaz kısım acılık verir.
    - t: Saklama
      d: |
        Oda sıcaklığında, üzeri kapalı olarak 3 gün; buzdolabında 5 gün dayanır. Soğuk da sıcak da servis edilebilir.
  faq:
    - q: Revani neden sert olur?
      a: Genelde şerbet yeterince dökülmediği ya da şerbet sıcak dökülüp kek tarafından çekilemediği için. Sıcak revaniye soğuk şerbet dökmek ve yeterince bekletmek gerekir.
    - q: Revaniye irmik konur mu?
      a: Evet, revaninin temel malzemelerinden biri irmiktir. Kekin şerbeti çekmesini ve kendine has dokusunu sağlar.
    - q: Revani şerbeti nasıl hazırlanır?
      a: Su ve şeker kaynatılıp limon eklenerek 10 dakika kaynatılır ve soğutulur. Soğuk şerbet sıcak kekin üzerine dökülür.
    - q: Revani üzerine ne serpilir?
      a: Klasik olarak hindistan cevizi. Antep fıstığı ya da kaymakla da servis edilebilir.

brownie:
  updated: '__BUGUN__'
  editorNote: |
    Brownie tarifinde "ortası hafif titrek olmalı" ifadesini bilerek kullandık; brownie'yi kek gibi kuru yapan en sık hata fazla pişirmek. Tamamen soğumadan kesmemeyi de aynı sebeple ayrı adım olarak yazdık.
  intro: |
    Brownie, bitter çikolata ve tereyağıyla yapılan, dışı ince bir kabukla kaplı, içi yoğun ve nemli Amerikan usulü bir çikolatalı tatlı. 19. yüzyılın sonlarında Amerika'da ortaya çıktığı kabul edilir ve bugün dünyanın her yerinde pastanelerin klasiği.

    Bu tarifte bitter çikolata ve tereyağı benmari usulü eritiliyor, yumurta ve şekerle çırpılıyor. Un, kakao ve tuz eleyerek ekleniyor ve ceviz katılıyor. Kare kalıpta pişirilip tamamen soğuduktan sonra kesiliyor.

    12 kare için tarif 40 dakikada hazır. Buzdolabında soğutulursa çok daha temiz kesilir.
  notes:
    - t: Neden fazla pişirilmemeli?
      d: |
        Brownie'nin yoğun ve nemli dokusu, ortasının tam pişmeden fırından alınmasından gelir. Kürdan batırıldığında kuru çıkıyorsa brownie fazla pişmiştir. Doğru zamanda kürdana birkaç nemli kırıntı yapışmalı. Brownie fırından çıktıktan sonra da kendi sıcaklığıyla pişmeye devam eder.
    - t: Yumurta ve şekeri çırpmak
      d: |
        Yumurta ve şekeri 3 dakika çırpmak, brownie'nin üzerinde oluşan ince ve parlak kabuğu sağlar. Bu kabuk, şekerin yumurtayla iyi karışmasından oluşur.
    - t: Çikolata seçimi
      d: |
        En az yüzde 50-60 kakao içeren bitter çikolata en iyi sonucu verir. Sütlü çikolata brownie'yi fazla tatlı ve yumuşak yapar. Kakao ekleyerek çikolata tadını derinleştirmek de mümkün.
    - t: Saklama
      d: |
        Oda sıcaklığında, kapalı kapta 3 gün; buzdolabında 1 hafta dayanır. Kare kesilmiş brownie dondurulabilir; tek tek sarılarak 2 aya kadar saklanabilir.
  faq:
    - q: Brownie neden kuru olur?
      a: Genelde fazla pişirildiği için. Brownie ortası hafif titrek, kürdana nemli kırıntılar yapışırken fırından alınmalı.
    - q: Brownie'nin üstündeki parlak kabuk nasıl olur?
      a: Yumurta ve şekeri birkaç dakika iyice çırpmak, şekerin tamamen erimesini ve pişerken üzerinde parlak, ince bir kabuk oluşmasını sağlar.
    - q: Brownie hangi çikolatayla yapılır?
      a: En az yüzde 50-60 kakao içeren bitter çikolata önerilir. Sütlü çikolata daha tatlı ve yumuşak bir sonuç verir.
    - q: Brownie ne zaman kesilir?
      a: Tamamen soğuduktan sonra. Buzdolabında 1 saat bekletmek çok daha temiz kesilmesini sağlar.
