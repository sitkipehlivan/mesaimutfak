perde-pilavi:
  aramaBasligi: 'Perde pilavı tarifi: Bademli, tavuklu, fırında 40 dakika'
  intro: 'Perde pilavı, tavuklu ve bademli pilavın ince bir hamurla kaplanıp fırında pişirildiği, ters çevrilip kesildiğinde içi görünen bir şölen yemeği. Siirt mutfağıyla özdeşleşmiş, düğünlerde ve özel günlerde sofranın ortasına konan bir tabak.


    Bu tarifte iş üç aşamaya bölünüyor: önce tavuk butları haşlanıp didikleniyor ve suyu pilav için saklanıyor, sonra baldo pirinç tereyağında kavrulan bademle, tarçın ve yenibahar eşliğinde suyunu çekene kadar pişiriliyor. Yoğurtlu, tereyağlı hamur kalıbın dibine ve kenarlarına serilip pilavla dolduruluyor, kapatılıyor ve 180°C fırında üzeri kızarana kadar pişiyor.


    Hazırlık 40, pişirme 50 dakika; toplam 90 dakikada 8 kişilik bir kalıp çıkıyor. Zorluk seviyesi zor, ama adımlara tek tek bakınca hiçbiri karmaşık değil.

    '
  editorNote: 'Pilavı kalıba girmeden önce yalnızca suyunu çekene kadar pişirmeyi seçtik, çünkü fırında hamurun içinde pişmeye devam ediyor. Kalıbın dibine dizilen dilim bademleri ayrı yazdık; ters çevirdiğinde perdenin üst yüzü onlarla süslenmiş oluyor.

    '
  notes:
  - t: Hamuru ince açmak
    d: 'Perdenin iyi pişmesi için hamurun ince açılması gerekir. Kalın açılan hamur, içindeki pilavın nemiyle alttan hamur kalırken üstten kızarır. Hamurun üçte ikisini kalıbın kenarlarından taşacak büyüklükte aç; taşan kısım kapakla birleşip kenarları kapatırken işine yarar. Hamuru 15 dakika dinlendirmek glutenin gevşemesini sağlar, böylece oklavada geri çekmeden açılır. Açarken yırtılırsa küçük bir parçayla yamamak yeterli; ama yırtık yeri kalıbın dibine denk getirme, ters çevirdiğinde görünen yüz orası olacak.

      '
  - t: Kalıbı yağlamak ve ters çevirmek
    d: 'Kalıbı bolca tereyağıyla yağlamak hem perdenin yapışmamasını hem de dış yüzün parlak ve kızarık çıkmasını sağlar. Fırından aldıktan sonra kalıbı 10 dakika dinlendir; bu sürede hamur hafifçe çekilir ve kalıptan kolay ayrılır. Ters çevirirken servis tabağını kalıbın üstüne kapatıp ikisini birlikte tek hareketle çevir. Bakır kalıp geleneksel tercih olsa da döküm tencere de ısıyı eşit dağıttığı için iyi sonuç verir.

      '
  - t: Pilavın kıvamı
    d: 'Pilav kalıba girdikten sonra fırında hamurun içinde 40 dakika daha ısı görür. Bu yüzden ocakta yalnızca suyunu çekene kadar pişirmek yeterli; tamamen pişmiş pilav fırında lapalaşabilir. Üç su bardağı tavuk suyu, iki su bardağı baldo pirinç için ölçülmüş. Osmancık kullanırsan suyu bir parmak azalt. Didiklenmiş tavuğu ve kuş üzümünü pilav suyunu çektikten sonra ekle ki tavuk dağılmasın, üzümler de suda şişip parçalanmasın.

      '
  faq:
  - q: Perde pilavı hangi pirinçle yapılır?
    a: Bu tarifte baldo pirinç kullanılıyor. Osmancık pirinç de olur; o durumda tavuk suyunu bir parmak azalt.
  - q: Perde pilavı fırında kaç dakika pişer?
    a: 180°C fırında üzeri kızarana kadar yaklaşık 40 dakika pişer. Fırından aldıktan sonra ters çevirmeden önce 10 dakika dinlendir.
  - q: Perde pilavı neden kalıba yapışır?
    a: Genellikle kalıp yeterince yağlanmadığında ya da fırından çıkar çıkmaz ters çevrildiğinde yapışır. Kalıbı bolca tereyağıyla yağla ve 10 dakika bekledikten sonra çevir.
  - q: Perde pilavında badem yerine ne kullanılır?
    a: Badem yerine fındık ya da ceviz kullanabilirsin. Kalıbın dibine dizilen süs için de aynı kuruyemişi kullanabilirsin.
beyti-kebabi:
  aramaBasligi: 'Beyti kebabı tarifi: Lavaşta köfte, domates sosu ve yoğurt'
  intro: 'Beyti kebabı, baharatlı kıymanın lavaşa sarılıp dilimlendiği, üzerine domates sosu ve eritilmiş tereyağı dökülerek yoğurtla servis edilen bir kebap. Adını İstanbul''daki bir kebapçıdan aldığı biliniyor; bugün pek çok kebap menüsünde yer alıyor.


    Evde mangal olmadığını varsayarak bu tarifte köfteleri döküm tavada ya da fırın ızgarasında pişiriyoruz. Soğanın suyu sıkılıyor, kıyma sarımsak, pul biber ve kimyonla yoğruluyor, buzdolabında dinlendikten sonra parmak kalınlığında uzun köftelere şekilleniyor. Lavaşa sarılan rulolar dilimlenip sosla birlikte 200°C fırında 8 dakika ısıtılıyor.


    Hazırlık 30, pişirme 25 dakika; 4 kişilik. Kıymanın buzdolabındaki 30 dakikalık dinlenmesini de planına ekle.

    '
  editorNote: 'Soğanın suyunu sıkmayı ve harcı 30 dakika dinlendirmeyi ayrı yazdık, çünkü sulu harç lavaşı ıslatır ve dilimlerken rulonun dağılmasına yol açar.

    '
  notes:
  - t: Harcın sıkı olması
    d: 'Beytinin dilimlendiğinde dağılmaması harcın sıkılığına bağlı. Rendelenmiş soğanın suyunu iyice sıkmazsan harç yumuşar, köfte tavada şeklini kaybeder ve lavaşı ıslatır. Kıymayı 5 dakika yoğurmak etin proteinlerinin birbirine bağlanmasını sağlar; harç ele yapışan bir kıvama gelir. Ardından buzdolabında 30 dakika dinlenen harçtaki yağ sertleşir ve köfteyi şekillendirmek kolaylaşır. Orta yağlı kıyma seçmek de önemli; çok yağsız kıyma kuru ve sert olur, çok yağlısı ise pişerken fazla yağ salar.

      '
  - t: Lavaşa sarma ve dilimleme
    d: 'Köfteyi lavaşın kenarına koyup sıkı bir rulo yap; gevşek sarılan rulo kesince açılır. Lavaşı önceden kısa süre ısıtmak onu esnetir ve sararken kırılmasını önler. Ruloları 3-4 cm''lik dilimlere keserken ıslak ve keskin bir bıçak kullan; kör bıçak lavaşı ezer, köfteyi dışarı iter. Lavaş bulamazsan tortilla ya da yufka da olur. Yufka daha ince olduğu için sararken yırtılmamasına dikkat et ve ruloyu birleşim yeri alta gelecek şekilde kes.

      '
  - t: Servis sırası
    d: 'Dilimleri fırın kabına dik dizip domates sosunu üzerine gezdir ve 200°C''de 8 dakika ısıt; daha uzun tutarsan lavaş sosu çekip yumuşar. Sarımsaklı yoğurdu fırına sokma, tabağın yanına soğuk olarak koy. Kalan tereyağını en son eritip dilimlerin üzerine dök; sıcak tereyağı tabağa o tanıdık kokuyu verir. Artan dilimleri buzdolabında saklayıp ertesi gün fırında ısıtabilirsin, ama yoğurdu ve tereyağını o zaman taze ekle.

      '
  faq:
  - q: Beyti kebabı evde nasıl yapılır?
    a: Baharatlı kıymayı uzun köfteler halinde tavada ya da fırın ızgarasında pişir, lavaşa sarıp dilimle. Domates sosunu gezdirip 200°C fırında 8 dakika ısıt, yoğurt ve tereyağıyla servis et.
  - q: Beyti köftesi kaç dakika pişer?
    a: Döküm tavada ya da fırın ızgarasında her yüzü 4 dakika pişer. Lavaşa sarıldıktan sonra sosla birlikte 8 dakika daha fırında ısınır.
  - q: Beyti kebabında lavaş yerine ne kullanılır?
    a: Tortilla ya da yufka kullanabilirsin. Hangisini seçersen seç, sarmadan önce hafifçe ısıtmak kırılmasını önler.
  - q: Beyti için hangi kıyma kullanılır?
    a: Orta yağlı dana kıyma bu tarif için uygun. Dana ve kuzu kıyma birbirinin yerine kullanılabilir.
yogurtlu-kebap:
  aramaBasligi: 'Yoğurtlu kebap tarifi: Çıtır pide, köfte ve tereyağlı sos'
  intro: 'Yoğurtlu kebap, kızartılmış pide ya da ekmek küplerinin üzerine domates sosu, sarımsaklı yoğurt ve köfte dizilip en son kızgın tereyağıyla tamamlanan bir tabak. İskender''e benzeyen katları var, ama evde hazırlaması çok daha kolay.


    Bu tarifte et olarak kimyonlu, soğanlı parmak köfte kullanıyoruz; taban için bir pide ya da 4 dilim bayat ekmek yeterli. Ekmek fırında ya da tavada çıtırlaşana kadar kızartılıyor, sos tereyağında kavrulan salça ve rendelenmiş domatesle 5 dakikada hazırlanıyor. Son adımda kalan tereyağı pul biberle kızdırılıp tabağın üstüne dökülüyor.


    Hazırlık 20, pişirme 25 dakika; toplam 45 dakikada 4 kişilik. Bayat ekmeği değerlendirmek için de iyi bir yol.

    '
  editorNote: 'Pideyi ayrı bir adımda çıtırlaşana kadar kızartmayı seçtik, çünkü kuru ve çıtır taban sos ile yoğurdu çekerken hamurlaşmadan yumuşar. Servis adımında "hemen" dememizin nedeni de bu.

    '
  notes:
  - t: Tabanın çıtır kalması
    d: 'Yoğurtlu kebabın en sık bozulan yeri taban. Pide ya da ekmek küpleri yeterince kızarmazsa sosu çeker çekmez lapaya döner. Küpleri fırında ya da tavada rengi dönüp kuruyana kadar kızart; bayat ekmek bu iş için tazesinden daha iyidir, çünkü zaten nemini kaybetmiştir. Tabağa yaydıktan sonra domates sosunun yalnızca bir kısmını gezdir; hepsini dökersen ekmek yoğurt gelmeden yumuşar. Kalan sosu köftelerin üstüne ya da yanına koyabilirsin.

      '
  - t: Yoğurdun sulanmaması
    d: 'Sarımsaklı yoğurdu oda sıcaklığında kullan ve ateşe hiç koyma. Üzerine dökülen tereyağı sıcak olduğu için yoğurdun yüzeyi hafifçe ısınır, bu normal. Ama yoğurdu sıcak sosla karıştırırsan sulanıp kesilebilir. Bu yüzden katları sırayla diz: önce ekmek, sonra biraz sos, ardından yoğurt, en üstte köfte. Daha koyu bir yoğurt katmanı istersen yoğurdu kısa süre süzebilirsin; böylece ekmeğe daha az su geçer ve taban daha uzun süre çıtır kalır.

      '
  - t: Köfte yerine başka et
    d: 'Tarifin temeli parmak köfte, ama aynı tabak kuşbaşı ya da tavuk şişle de yapılabilir. Kuşbaşını yüksek ateşte suyunu çekene kadar sotelemek, tavuğu ise kısa sürede pişirip kurutmamak gerekir. Dana kıyma yerine kuzu kıyma da olur; ikisi birbirinin yerine geçer. Etsiz bir versiyon için haşlanmış yeşil mercimek ya da ince doğranmış mantarla harç hazırlanabilir. Bu harç kıymadan daha yumuşak olduğu için tavada dikkatli çevirmek gerekir.

      '
  faq:
  - q: Yoğurtlu kebap için hangi ekmek kullanılır?
    a: Bir pide ya da 4 dilim bayat ekmek yeterli. Bayat ekmek daha kuru olduğu için kızartınca daha çıtır kalır.
  - q: Yoğurtlu kebapta ekmek neden yumuşar?
    a: Ekmek yeterince kızartılmazsa ya da tabak beklerse sosu çekip yumuşar. Küpleri iyice kızart ve tereyağını döktükten sonra hemen servis et.
  - q: Yoğurtlu kebap sosu nasıl yapılır?
    a: Tereyağının yarısında 1 yemek kaşığı salçayı kavur, 2 rendelenmiş domatesi ekleyip 5 dakika pişir. Kalan tereyağı pul biberle kızdırılıp en son tabağa dökülür.
  - q: Yoğurtlu kebap tavukla yapılır mı?
    a: Evet, köfte yerine tavuk şiş ya da kuşbaşı da kullanılabilir. Tabağın diğer katları aynı kalır.
alinazik:
  aramaBasligi: 'Ali nazik tarifi: Közlenmiş patlıcanlı yoğurtta kuşbaşı'
  intro: 'Ali nazik, közlenmiş patlıcanın sarımsaklı yoğurtla karıştırılıp tabağa yayıldığı, ortasına tereyağında kavrulmuş kuşbaşı et konan bir Gaziantep yemeği. Patlıcanın is kokusu ile yoğurdun ferahlığı tabağın temelini oluşturuyor.


    Bu tarifte patlıcanlar ocak ateşinde ya da fırın ızgarasında kabukları kömürleşene kadar közleniyor, soyulup bıçakla ince kıyılıyor ve süzme yoğurtla buluşuyor. Küçük doğranmış kuzu ya da dana eti yüksek ateşte suyunu çekene kadar kavruluyor, ardından soğan, salça ve pul biber ekleniyor. Yanına közlenmiş sivri biber ve domates geliyor.


    Hazırlık 25, pişirme 30 dakika; toplam 55 dakikada 4 kişilik. Tarif glutensiz; yanına sade pilav ya da ekmek koyabilirsin.

    '
  editorNote: 'Patlıcanı blenderda değil bıçakla kıymayı seçtik; bıçakla kıyılan patlıcan lifli dokusunu korur ve yoğurtla karışınca püre gibi sulanmaz.

    '
  notes:
  - t: Patlıcanı doğru közlemek
    d: 'Ali nazikin aroması közden gelir. Patlıcanı ocak ateşinde ya da fırın ızgarasında, kabuğu her yönden kömürleşene ve içi tamamen yumuşayana kadar çevir; yaklaşık 20 dakika sürer. Kabuk tam yanmadan çıkarırsan içi çiğ kalır ve tadı sertleşir. Közlenen patlıcanı soyduktan sonra bir süre süzgeçte bekletmek acı suyunu akıtır ve yoğurdun sulanmasını önler. Soyarken kabuktan kalan yanık parçaları temizle; birkaç kırıntı aroma verir ama fazlası tadı acılaştırır.

      '
  - t: Etin yumuşak kalması
    d: 'Kuşbaşının küçük doğranmış olması önemli; büyük parçalar 15 dakikada yumuşamaz. Eti tencereye yüksek ateşte at; önce suyunu salar, sonra o suyu çekip kavrulmaya başlar. Soğanı et suyunu çektikten sonra eklemek, soğanın haşlanmadan kavrulmasını sağlar. Salça ve baharatlar en son girer ve yalnızca 2 dakika çevrilir; daha uzun tutarsan salça yanar, pul biber acılaşır. Kuzu eti Gaziantep usulüne daha yakın bir tat verir, dana da benzer sürede pişer.

      '
  - t: Süzme yoğurt ve servis
    d: 'Ali nazikte normal yoğurt yerine süzme yoğurt kullanmamızın nedeni kıvam. Közlenmiş patlıcan zaten nemli olduğu için sulu yoğurtla karışınca tabakta akar. Elinde süzme yoğurt yoksa normal yoğurdu tülbentte 2 saat süzebilir ya da labne kullanabilirsin. Patlıcanlı yoğurdu tabağa yayarken ortasını hafifçe çukurlaştır ve sıcak eti oraya koy. Yoğurdu ısıtma; sıcak et ile serin yoğurt arasındaki fark bu yemeğin keyfi. Servisi bekletmeden yap.

      '
  faq:
  - q: Ali nazik için patlıcan nasıl közlenir?
    a: Ocak ateşinde ya da fırın ızgarasında, kabuğu kömürleşene kadar çevirerek yaklaşık 20 dakika közle. Ardından soyup bıçakla ince kıy.
  - q: Ali nazik hangi etle yapılır?
    a: Küçük doğranmış kuzu ya da dana kuşbaşı kullanılır. Kuzu Gaziantep usulüne daha yakın olur, dana da benzer sürede pişer.
  - q: Ali nazikte yoğurt neden sulanır?
    a: Patlıcanın acı suyu süzülmezse ya da normal yoğurt kullanılırsa sulanır. Közlenmiş patlıcanı süzgeçte beklet ve süzme yoğurt kullan.
  - q: Ali nazik glutensiz mi?
    a: Evet, tarifteki malzemelerde gluten bulunmuyor. Yanında ekmek servis edeceksen glutensiz ekmek seçmen gerekir.
kagit-kebabi:
  aramaBasligi: 'Kağıt kebabı tarifi: Fırında sebzeli kuşbaşı, 60 dakika'
  intro: 'Kağıt kebabı, kuşbaşı etin patates, havuç, bezelye ve domatesle birlikte pişirme kâğıdına sarılıp fırında kendi buharında piştiği bir yemek. Kâğıt bohça içerideki suyu tuttuğu için et kurumadan yumuşar, sebzeler de etin suyunu çeker.


    Bu tarifte tüm malzemeler bir kapta tuz, karabiber ve kekikle karıştırılıp dört ayrı bohçaya paylaştırılıyor; her bohçanın üstüne birer parça tereyağı konuyor. Bohçalar 180°C fırında 60 dakika pişiyor ve tabakta açılarak servis ediliyor. Pişerken başında beklemek ya da karıştırmak gerekmiyor.


    Hazırlık 20, pişirme 60 dakika; toplam 80 dakikada 4 kişilik. Tarif kolay ve glutensiz; fırın çalışırken salatayı hazırlamaya vaktin kalır.

    '
  editorNote: 'Her kişiye ayrı bohça hazırlamayı seçtik; tek büyük paket yerine dört küçük bohça daha eşit pişer ve sofrada herkes kendi bohçasını açar.

    '
  notes:
  - t: Bohçayı sıkı kapatmak
    d: 'Kağıt kebabının pişme yöntemi buhar. Kâğıdın kenarları iyi kapanmazsa buhar kaçar, et kurur ve sebzeler fırında kavrulur. Kenarları yukarı toplayıp iple bağlayabilir ya da üst üste birkaç kez katlayarak kapatabilirsin. Kâğıdı iki kat kullanmak, sebzelerden çıkan suyun tepsiye akmasını önler. Bohçanın içinde biraz boşluk bırak; çok sıkı paketlenmiş bohçada buhar dolaşamaz ve üstteki malzemeler alttakilerden geç pişer. Tepsiyi fırının orta rafına koy.

      '
  - t: Doğrama boyutu
    d: 'Et ve sebzeler aynı bohçada aynı sürede pişeceği için doğrama boyutu dengeli olmalı. Patates ve havucu kuşbaşıyla yaklaşık aynı boyda küp doğra; havuç daha sert olduğu için biraz küçük doğramak iyi olur. Domates çabuk dağılır ve suyunu salar, bu su da bohçanın içindeki buharın kaynağıdır. Dondurulmuş bezelye kullanacaksan bütün pişirme boyunca bohçada kalması onu ezer; son 10 dakikada bohçayı açıp eklemek daha iyi sonuç verir.

      '
  - t: Eti yumuşatmak ve alternatifler
    d: 'Dana kuşbaşı 60 dakikada bohça içinde yumuşar, ama et sertse bir gece önceden soğan suyunda marine etmek fark yaratır. Soğan suyu etin liflerini gevşetir ve aroma katar. Dana yerine kuzu eti de kullanabilirsin. Tavuk but tercih edersen süreyi yarıya indir, aksi halde tavuk lifleşip kurur. Patates yerine tatlı patates de olur; o biraz daha çabuk pişer. Bohçaları açınca çıkan sıcak buhara dikkat et, kâğıdı kendinden uzağa doğru aç.

      '
  faq:
  - q: Kağıt kebabı fırında kaç dakika pişer?
    a: 180°C fırında 60 dakika pişer. Tavuk but kullanırsan süreyi yarıya indir.
  - q: Kağıt kebabında hangi kâğıt kullanılır?
    a: Pişirme kâğıdı kullanılır. Sular akmasın diye kâğıdı iki kat kullanabilirsin.
  - q: Kağıt kebabında et nasıl yumuşak olur?
    a: Bohçanın sıkı kapanması buharın içeride kalmasını sağlar ve eti yumuşatır. Eti bir gece önceden soğan suyunda marine etmek de etkili.
  - q: Kağıt kebabı tavukla yapılır mı?
    a: Evet, tavuk butla yapılabilir. Tavuk etten çabuk piştiği için fırın süresini yarıya indir.
inegol-kofte:
  aramaBasligi: 'İnegöl köfte tarifi: Az malzemeli, 1 saat dinlenmiş harç'
  intro: 'İnegöl köfte, adını Bursa''nın İnegöl ilçesinden alan, iki kez çekilmiş kıyma, soğan, galeta unu, tuz ve karabiberle yapılan sade bir ızgara köfte. Kimyon, pul biber gibi baharatlar kullanılmadığı için lezzet büyük ölçüde etten geliyor.


    Bu tarifin sırrı yoğurma ve bekleme. Harç 5-6 dakika yapış yapış olana kadar yoğruluyor, sonra buzdolabında en az 1 saat dinleniyor. Islak elle parmak boyunda dikdörtgen köfteler şekillendirilip iyice kızdırılmış döküm tavada ya da ızgarada her yüzü 3-4 dakika pişiyor. Airfryer''da 200°C''de 10-12 dakikada da olur.


    Hazırlık 15, pişirme 12 dakika; 4 kişilik. Bunlara harcın en az 1 saatlik dinlenme süresini ekle.

    '
  editorNote: 'Dinlendirmeyi ayrı bir adım olarak yazdık, çünkü İnegöl köftesinin sıkı ve sulu dokusu bu beklemeden geliyor; atlanırsa köfte pişerken dağılabilir.

    '
  notes:
  - t: Neden iki kez çekilmiş kıyma
    d: 'İnegöl köftesinin pürüzsüz ve sıkı dokusu iki kez çekilmiş kıymadan gelir. Tek çekilmiş kıyma daha iri tanelidir ve köfte ızgarada çatlayabilir. Kasabından orta yağlı kıymayı iki kez çekmesini iste; yağ oranı çok düşük olursa köfte kuru olur. Harcı 5-6 dakika yoğurmak etin proteinlerinin bağlanmasını sağlar ve kıvam yapış yapış olur. Bu yapışkanlık iyi bir işaret; köfte pişerken şeklini korur ve içindeki suyu tutar.

      '
  - t: Karbonat ve soğan suyu
    d: 'Tarifteki yarım çay kaşığı karbonat, köftenin hafif kabarık ve yumuşak olmasına yardım eder. Daha fazlası köfteye sabunumsu bir tat verebilir, bu yüzden ölçüyü artırma. Rendelenmiş soğanın suyunu iyice sıkman gerekiyor; soğan suyu harcı sulandırır ve köfte tavaya yapışır. Soğanın posası aromayı verir, fazla suyu ise harcın dağılmasına neden olur. Galeta unu harçtaki nemi tutar; yerine rendelenmiş bayat ekmek içi ya da yulaf ezmesi kullanabilirsin.

      '
  - t: Pişirme ve servis
    d: 'Tavanın ya da ızgaranın iyice ısınmış olması önemli. Soğuk tavaya konan köfte suyunu salar ve yüzeyi kızarmaz. Köfteleri sık sık çevirme; her yüzü 3-4 dakika pişip kabuk bağladıktan sonra çevirmek, köftenin tavaya yapışmadan ayrılmasını sağlar. Harcı bir gece dinlendirirsen tadı daha da oturur. Yanına piyaz ve közlenmiş biber yakışır. Pişmemiş köfteleri tepside tek sıra halinde dondurup sonra torbaya aktararak saklayabilirsin.

      '
  faq:
  - q: İnegöl köfte neden dağılır?
    a: Harç yeterince yoğrulmazsa, soğanın suyu sıkılmazsa ya da dinlendirilmeden pişirilirse dağılır. Harcı 5-6 dakika yoğur ve buzdolabında en az 1 saat beklet.
  - q: İnegöl köftenin içinde ne var?
    a: Bu tarifte iki kez çekilmiş orta yağlı dana kıyma, rendelenmiş soğan, galeta unu, tuz, karabiber ve yarım çay kaşığı karbonat var. Başka baharat eklenmiyor.
  - q: İnegöl köfte airfryerda kaç dakika pişer?
    a: 200°C'de 10-12 dakika pişer. Köfteleri sepete aralıklı diz ve 6. dakikada çevir.
  - q: İnegöl köfte harcı ne kadar dinlendirilir?
    a: En az 1 saat buzdolabında dinlendir. Bir gece bekletirsen tadı daha da oturur.
patates-koftesi:
  aramaBasligi: 'Patates köftesi tarifi: Kaşarlı, galeta ununda çıtır'
  intro: 'Patates köftesi, haşlanmış patatesin yumurta, kaşar, maydanoz ve taze soğanla yoğrulup galeta ununa bulandıktan sonra kızartıldığı bir ara sıcak. Dışı çıtır, içi yumuşak ve peynirli; artan haşlanmış patatesi değerlendirmenin de pratik bir yolu.


    Bu tarifte harca pul biber ve kimyon da giriyor. Ceviz büyüklüğünde parçalar yassı köfte şeklinde açılıyor, galeta ununa bulanıyor ve kızgın yağda iki yüzü kızarana kadar kızartılıyor. Daha az yağla yapmak istersen köfteleri airfryer''da 190°C''de 12-14 dakika pişirebilirsin.


    Hazırlık 25, pişirme 15 dakika; toplam 40 dakikada 4 kişilik. Patatesleri önceden haşlarsan hazırlık kısalır ve harç daha kolay şekil alır.

    '
  editorNote: 'Patateslerin soğuk olması gerektiğini özellikle vurguladık; sıcak patates nemli ve yapışkan olduğu için zor şekil alır ve galeta ununu iyi tutmaz.

    '
  notes:
  - t: Patatesin soğuk ve kuru olması
    d: 'Patates köftesinin dağılmaması büyük ölçüde patatesin durumuna bağlı. Sıcakken ezilen patates buhar ve nem bırakır, harç yumuşar ve köfteler yağda açılır. Patatesleri bir gece önceden haşlayıp buzdolabında bekletmek en iyi sonucu verir; soğuyan patates sıkılaşır ve harç kolay şekil alır. Haşlarken patatesleri suda fazla bırakma, çok yumuşayan patates fazla su çeker. Harç hâlâ yumuşaksa biraz galeta unu ekleyerek kıvamı toparlayabilirsin.

      '
  - t: Kızartma yağı ve sıcaklık
    d: 'Yağın yeterince kızgın olması, köftenin dışının hemen kabuk bağlamasını sağlar. Yağ soğuksa köfte yağı çeker ve ağırlaşır, galeta unu da yağda dağılır. Önce bir köfteyi deneme olarak at; hemen cızırdıyorsa yağ hazırdır. Tavayı kalabalık etme, köfteleri birkaç parti halinde kızart. Kızaranları kâğıt havluya alarak fazla yağı süz. Airfryer''da pişireceksen köftelere yağ sprey etmek, galeta ununun kuru kalmadan kızarmasına yardım eder.

      '
  - t: Peynir ve alternatifler
    d: 'Kaşar eriyerek köftenin içinde yumuşak bir doku oluşturur. Yerine mozzarella ya da tost peyniri de olur; eriyen herhangi bir peynir iş görür. Yumurta harcı bağlar; yumurtasız yapmak istersen 2 yemek kaşığı galeta unu ya da 1 yemek kaşığı nişasta kullanabilirsin. Kaplama için galeta unu bulamazsan rendelenmiş bayat ekmek içi ya da yulaf ezmesi kullanılabilir. Köfteler en iyi sıcakken yenir; artanları airfryer''da ya da fırında ısıtmak tavada ısıtmaktan daha çıtır bir sonuç verir.

      '
  faq:
  - q: Patates köftesi neden dağılır?
    a: Patates sıcakken ezilirse harç nemli olur ve köfteler yağda dağılır. Patatesleri önceden haşlayıp soğut, harcı yumurtayla iyice yoğur.
  - q: Patates köftesi airfryerda kaç dakika pişer?
    a: Galeta ununa bulanmış köfteleri yağ sprey edip 190°C'de 12-14 dakika pişir, yarısında çevir.
  - q: Patates köftesinde yumurta yerine ne kullanılır?
    a: Harcı bağlamak için 2 yemek kaşığı galeta unu ya da 1 yemek kaşığı nişasta kullanabilirsin.
  - q: Patates köftesine hangi peynir konur?
    a: Bu tarifte 60 gram rendelenmiş kaşar kullanılıyor. Mozzarella ya da tost peyniri gibi eriyen bir peynir de olur.
patlican-oturtma:
  aramaBasligi: 'Patlıcan oturtma tarifi: Kıymalı, fırında domatesli'
  intro: 'Patlıcan oturtma, yuvarlak dilimlenip kızartılan patlıcanların üzerine kıymalı harç ve domates dilimi konarak fırında salçalı suyla pişirildiği bir ana yemek. Karnıyarığa benzer bir tadı var, ama patlıcan bütün değil dilim olduğu için hem hazırlaması hem servisi daha kolay.


    Bu tarifte patlıcanlar alacalı soyulup 1,5 cm kalınlığında dilimleniyor ve tuzlu suda 20 dakika bekletiliyor. Kızartılan dilimler kaba dizilip üzerlerine soğan, biber ve domatesle kavrulmuş kıyma konuyor. Kenardan dökülen salçalı sıcak suyla 190°C fırında 30 dakika pişiyor. Daha hafif bir versiyon için patlıcanları kızartmak yerine yağlayıp fırında pişirebilirsin.


    Hazırlık 30, pişirme 35 dakika; toplam 65 dakikada 4 kişilik.

    '
  editorNote: 'Salçalı suyu kenardan dökmeyi özellikle belirttik; üstten dökülen su harcı ve domates dilimini yıkar, patlıcanın üst yüzünü de sulandırır.

    '
  notes:
  - t: Tuzlu suda bekletmenin nedeni
    d: 'Patlıcanı kızartmadan önce tuzlu suda 20 dakika bekletmek iki işe yarar: acımsı tadını hafifletir ve daha az yağ çekmesini sağlar. Bekletmeden sonra dilimleri iyice kurula; ıslak patlıcan kızgın yağa girince sıçratır ve kızarmak yerine haşlanır. Alacalı soymak, yani kabuğu şeritler halinde bırakmak, dilimlerin fırında dağılmamasına yardım eder. Dilim kalınlığını 1,5 cm''de tut; ince dilimler fırında eriyip kaybolur, kalın dilimler ise içten pişmeyebilir.

      '
  - t: Kızartma ya da fırın
    d: 'Kızartılan patlıcan daha yumuşak ve lezzetli olur, ama kızartma yağının bir kısmını çeker. Kızardıktan sonra dilimleri kâğıt havluya alarak fazla yağı süzmek yemeğin ağırlaşmasını önler. Daha hafif bir sonuç istersen dilimleri tepsiye dizip yüzeylerini yağla ve fırında kızarana kadar pişir; bu yöntemde doku biraz daha kuru olur ama yemek hafifler. İki yöntemde de patlıcanın önceden pişmiş olması gerekir, çünkü fırındaki 30 dakika çiğ patlıcanı yumuşatmaya yetmez.

      '
  - t: Harç, servis ve saklama
    d: 'Kıymalı harcı fazla sulu bırakma; soğan ve kıymayı kavurduktan sonra biber ve domatesi ekleyip suyunu biraz çektir. Sulu harç patlıcanın üstünde durmaz, kaba akar. Fırından çıkan yemeği birkaç dakika dinlendirmek sosun oturmasını sağlar ve dilimleri tabağa almak kolaylaşır. Yanına pilav ya da yoğurt yakışır. Artan oturtmayı buzdolabında kapalı kapta saklayıp ertesi gün fırında ısıtabilirsin; mikrodalgada ısıtılan patlıcan daha çabuk sulanır.

      '
  faq:
  - q: Patlıcan oturtma fırında kaç dakika pişer?
    a: 190°C fırında 30 dakika pişer. Patlıcanlar fırına girmeden önce kızartılmış ya da fırında pişirilmiş olmalı.
  - q: Patlıcan oturtma kızartmadan yapılır mı?
    a: Evet, patlıcan dilimlerini yağlayıp fırında pişirerek de yapabilirsin. Yemek daha hafif olur, doku biraz daha kuru kalır.
  - q: Patlıcanın acısı nasıl alınır?
    a: Dilimleri tuzlu suda 20 dakika bekletmek acılığı alır ve daha az yağ çekmelerini sağlar. Ardından dilimleri iyice kurula.
  - q: Patlıcan oturtma ile karnıyarık arasındaki fark ne?
    a: Karnıyarıkta patlıcan bütün olarak yarılıp doldurulur, oturtmada ise yuvarlak dilimlerin üzerine harç konur. Dilimler sayesinde oturtmayı servis etmek daha kolaydır.
kiymali-kabak:
  aramaBasligi: 'Kıymalı kabak yemeği tarifi: Dereotlu, 40 dakikada'
  intro: 'Kıymalı kabak yemeği, kabağın az kıyma, soğan, biber ve domatesle tencerede pişirildiği hafif bir yaz yemeği. Kabak kendi suyunu saldığı için az suyla pişiyor, sonunda eklenen dereotu da ferah bir koku veriyor.


    Bu tarifte 200 gram kıyma zeytinyağında soğan ve biberle kavruluyor, rendelenmiş domatesle 3 dakika pişiyor. Ardından alacalı soyulup iri küp doğranan kabaklar, tuz, karabiber ve yarım su bardağı sıcak suyla kapağı kapalı 15 dakika pişiyor. Ocağı kapatırken dereotu ekleniyor ve yemek yoğurtla servis ediliyor.


    Hazırlık 15, pişirme 25 dakika; toplam 40 dakikada 4 kişilik. Tarif kolay ve glutensiz.

    '
  editorNote: 'Suyu yarım su bardağıyla sınırlı tuttuk, çünkü kabak pişerken bolca su salıyor; fazla su yemeği çorbaya çevirir ve kabağın tadını sulandırır.

    '
  notes:
  - t: Kabağın dağılmaması
    d: 'Kabak çabuk pişen ve çabuk dağılan bir sebze. İri küp doğramak ve alacalı soymak, yani kabuğun bir kısmını bırakmak, parçaların şeklini korumasına yardım eder. Kabakları ekledikten sonra sık sık karıştırma; kapağı kapalı bırakmak yeterli. 15 dakikanın sonunda bir parçayı çatalla kontrol et: kolayca batıyor ama parça bütün kalıyorsa yemek hazır. Daha uzun pişirirsen kabak püreleşir ve tencerenin dibinde suya karışır.

      '
  - t: Az su, doğru zamanda tuz
    d: 'Kabağın büyük kısmı sudur ve tuzla birlikte bu suyu hızla salar. Bu yüzden tarifte yalnızca yarım su bardağı sıcak su var. Yemeğin sulu kaldığını görürsen son birkaç dakikayı kapağı açık pişirerek suyu azaltabilirsin. Tuzu kabaklarla birlikte koymak, kıymanın kavrulma aşamasında su salmasını önler. Domatesi rendelemek, sosun kabak parçalarının arasına eşit dağılmasını sağlar. Kışın taze domates yerine konserve doğranmış domates kullanılabilir.

      '
  - t: Servis ve çeşitleme
    d: 'Dereotu ısıya dayanıksız bir ot; uzun pişirilirse rengi ve kokusu kaybolur. Bu yüzden ocak kapatılırken ekleniyor. Dereotu sevmiyorsan maydanoz ve biraz taze nane kullanabilirsin. Yemeği daha doyurucu yapmak istersen kabaklarla birlikte bir avuç pirinç ekle; pirinç suyu çekeceği için gerekirse biraz daha sıcak su ilave et. Yoğurtla servis etmek yemeğin hafifliğini dengeler. Ertesi gün kabak biraz daha yumuşar ama tadı oturur.

      '
  faq:
  - q: Kıymalı kabak yemeği kaç dakika pişer?
    a: Kıyma soğan ve biberle 8 dakika kavrulur, domatesle 3 dakika pişer. Kabaklar eklendikten sonra kapağı kapalı yaklaşık 15 dakika pişer.
  - q: Kabak yemeği neden sulu olur?
    a: Kabak pişerken çok su salar. Tarifteki yarım su bardağı sıcak suyu artırma; sulu kalırsa son dakikaları kapağı açık pişir.
  - q: Kıymalı kabak yemeğine pirinç konur mu?
    a: Evet, bir avuç pirinç eklersen daha doyurucu olur. Pirinç suyu çektiği için gerekirse biraz sıcak su ekle.
  - q: Kabak yemeğinde dereotu yerine ne kullanılır?
    a: Maydanoz ve biraz taze nane kullanabilirsin. Otları ocağı kapatırken ekle.
turlu:
  aramaBasligi: 'Türlü tarifi: Fırında yaz sebzeleri, zeytinyağlı ve etsiz'
  intro: 'Türlü, patlıcan, kabak, patates, taze fasulye ve biberin domates ve zeytinyağıyla birlikte pişirildiği bir sebze yemeği. Adına uygun olarak içine türlü türlü sebze giriyor; yazın pazarda ne bulursan eklenebilen esnek bir tarif.


    Bu tarifte sebzeler iri küp doğranıp geniş bir kapta zeytinyağı, salça, tuz ve bir çay kaşığı şekerle harmanlanıyor. Fırın kabına yayılan karışımın üzerine doğranmış domatesler dağıtılıyor ve sıcak su dökülüyor. Üzeri folyoyla kapalı 200°C''de 35 dakika, folyo açılarak 15 dakika daha pişiyor. Tencerede olduğu gibi başında beklemek gerekmiyor.


    Hazırlık 25, pişirme 50 dakika; toplam 75 dakikada 6 kişilik. Tarif vegan ve glutensiz; sıcak da ılık da yenebilir.

    '
  editorNote: 'Türlüyü tencere yerine fırında pişirmeyi seçtik; sebzeler karıştırılmadan piştiği için dağılmıyor, son 15 dakikada folyo açılınca da üstleri hafifçe kızarıyor.

    '
  notes:
  - t: Aynı boyda doğramak
    d: 'Türlüde farklı sürelerde pişen sebzeler aynı kapta pişiyor. Patates ve taze fasulye en geç pişenler, kabak ve patlıcan ise en çabuk yumuşayanlar. Hepsini benzer iri küpler halinde doğramak dengeyi sağlar; patatesi biraz daha küçük doğramak iyi bir ayar. Kabağı çok küçük doğrarsan 50 dakikanın sonunda eriyip kaybolur. Taze fasulyenin uçlarını kesip iki üç parçaya bölmek yeterli. Sebzeleri elinle harmanlamak, salça ve zeytinyağının her parçaya eşit sinmesini sağlar.

      '
  - t: Folyonun görevi
    d: 'İlk 35 dakika folyo kapalı tutulduğunda kabın içinde buhar oluşur ve sebzeler bu buharla yumuşar. Folyosuz başlarsan üstteki sebzeler kururken alttakiler çiğ kalabilir. Son 15 dakikada folyoyu açmak fazla suyun buharlaşmasını ve üst yüzeyin hafifçe kızarmasını sağlar. Folyoyu açarken çıkan sıcak buhara dikkat et. Fırından aldığında suyu fazla görünüyorsa endişelenme; türlü ılıdıkça sebzeler sosun bir kısmını çeker ve kıvam toparlanır.

      '
  - t: Patlıcan, şeker ve etli versiyon
    d: 'Patlıcanı tuzlu suda 10 dakika bekletmek acılığını alır ve fazla zeytinyağı çekmesini önler. Bir çay kaşığı şeker yemeği tatlandırmak için değil, domates ve salçanın ekşiliğini dengelemek için ekleniyor. Etli türlü yapmak istersen kuşbaşı eti önceden ayrı bir tavada kavurup sebzelerin arasına yerleştir; çiğ et bu sürede yumuşamaz. Etli versiyon artık vegan olmaz. Türlü buzdolabında kapalı kapta saklanabilir ve ertesi gün tadı daha da oturur.

      '
  faq:
  - q: Türlü fırında kaç dakika pişer?
    a: Üzeri folyoyla kapalı 200°C fırında 35 dakika, folyo açılarak 15 dakika daha, toplam 50 dakika pişer.
  - q: Türlüye hangi sebzeler konur?
    a: Bu tarifte patlıcan, kabak, patates, taze fasulye, kapya ve sivri biber, soğan ve domates var. Elindeki yaz sebzelerini aynı boyda doğrayarak ekleyebilirsin.
  - q: Türlü etli yapılır mı?
    a: Evet. Kuşbaşı eti önceden kavurup sebzelerin arasına ekleyerek etli türlü yapabilirsin.
  - q: Türlüye neden şeker konur?
    a: Bir çay kaşığı şeker domates ve salçanın ekşiliğini dengeler. Yemeği tatlandırmaz, sadece tadı yumuşatır.
kapuska:
  aramaBasligi: 'Kapuska tarifi: Kıymalı lahana yemeği, 50 dakikada'
  intro: 'Kapuska, beyaz lahananın kıyma, salça ve bir miktar pirinç ya da bulgurla tencerede pişirildiği bir kış yemeği. Asker yemeği olarak da bilinir; lahananın ucuz ve bol olduğu aylarda evlerde sık pişirilir.


    Bu tarifte kıyma zeytinyağında suyunu çekene kadar kavruluyor, ardından soğan, domates ve biber salçası ekleniyor. Şerit halinde doğranan lahana tencerede sönene kadar 5 dakika çevriliyor, sonra pirinç ya da bulgur, baharatlar ve iki su bardağı sıcak su giriyor. Kapağı kapalı, kısık ateşte 25 dakika pişiyor.


    Hazırlık 15, pişirme 35 dakika; toplam 50 dakikada 4 kişilik. Yanına yoğurt ve turşu yakışır.

    '
  editorNote: 'Lahanayı suyla pişirmeden önce kıymayla birlikte 5 dakika çevirmeyi ayrı adım yaptık; bu kavurma lahananın keskin kokusunu yumuşatıyor ve hacmini azaltıp tencereye sığmasını kolaylaştırıyor.

    '
  notes:
  - t: Lahanayı hazırlamak
    d: 'Orta boy bir beyaz lahana yaklaşık 1 kg gelir ve doğrandığında tencereyi dolduracak kadar hacim yapar. Sert göbeğini çıkarmak gerekir, çünkü göbek yapraklardan çok daha geç pişer. Yaprakları şerit halinde iri doğra; çok ince doğranan lahana pişince lapalaşır. Yıkadıktan sonra suyunu iyice süz. Tencereye ilk eklediğinde lahana çok yer kaplar, ama 5 dakika çevirince söner. Tencere küçükse lahanayı iki seferde, ilk kısım sönünce ikinciyi ekleyerek koyabilirsin.

      '
  - t: Pirinç mi bulgur mu
    d: 'Tarifte 3 yemek kaşığı pirinç ya da bulgur var; bu miktar yemeği pilava çevirmez, sadece suyu biraz bağlar ve doyuruculuğu artırır. Bulgur daha taneli bir doku verir, pirinç ise daha yumuşak bir kıvam oluşturur. İkisi de kısık ateşteki 25 dakikada pişer. Etsiz bir kapuska istersen kıyma yerine bir su bardağı haşlanmış nohut kullanabilirsin; nohut zaten pişmiş olduğu için lahanayla birlikte koyman yeterli. Haşlanmış yeşil mercimek ya da ince doğranmış mantar da olur.

      '
  - t: Ekşilik ve saklama
    d: 'Kapuskanın ekşimsi tadı salçalardan gelir. Daha belirgin bir ekşilik istersen bir tatlı kaşığı limon suyu ya da sirke ekle. Biber salçan yoksa domates salçasına bir tatlı kaşığı pul biber katarak benzer bir tat yakalayabilirsin. Kapuska ertesi gün daha lezzetli olan yemeklerden; lahana sosu çektikçe tadı oturur. Buzdolabında kapalı kapta sakla, ısıtırken kuruduysa birkaç kaşık sıcak su ekle. Yanına yoğurt ve turşu klasik eşlikçi.

      '
  faq:
  - q: Kapuska kaç dakika pişer?
    a: Lahana eklendikten sonra 5 dakika çevrilir, ardından kapağı kapalı kısık ateşte 25 dakika pişer.
  - q: Kapuskaya pirinç mi bulgur mu konur?
    a: İkisi de olur; bu tarifte 3 yemek kaşığı pirinç ya da bulgur kullanılıyor. Bulgur daha taneli, pirinç daha yumuşak bir kıvam verir.
  - q: Kapuska etsiz yapılır mı?
    a: Evet, kıyma yerine bir su bardağı haşlanmış nohut kullanabilirsin. Haşlanmış yeşil mercimek ya da ince doğranmış mantar da olur.
  - q: Lahana yemeğinin kokusu nasıl azalır?
    a: Lahanayı suyla pişirmeden önce kıymayla 5 dakika kavurmak kokusunu yumuşatır. Sert göbeği çıkarmak da işe yarar.
etli-bamya:
  aramaBasligi: 'Etli bamya tarifi: Limonlu, kuşbaşı etli ve dağılmayan'
  intro: 'Etli bamya, kuşbaşı etin domates ve salçayla pişirilip bamyayla buluştuğu, limonla ekşitilen bir tencere yemeği. Bamyanın salyalı yapısı yüzünden zor bir yemek olarak bilinir, ama doğru ayıklama ve pişirme tekniğiyle taneler bütün ve diri kalır.


    Bu tarifte bamyaların başı külah gibi yontularak, içleri açılmadan temizleniyor ve limonlu sirkeli suda 15 dakika bekletiliyor. Et yağda kavrulup soğan, salça ve domatesle pişiyor, yarım su bardağı sıcak suyla 20 dakika yumuşatılıyor. Bamyalar eklendikten sonra kaşıkla değil tencere sallanarak karıştırılıyor ve limon suyuyla kısık ateşte 25 dakika pişiyor.


    Hazırlık 25, pişirme 50 dakika; toplam 75 dakikada 4 kişilik.

    '
  editorNote: 'Eti bamyadan önce ayrıca 20 dakika pişirmeyi seçtik; bamya etten çok daha çabuk yumuşadığı için ikisi birlikte başlarsa et sertken bamya dağılır.

    '
  notes:
  - t: Külah gibi ayıklamak
    d: 'Bamyanın salya yapan kısmı kapsülün içinde. Başını düz keserek kopardığında iç açılır ve pişerken salya tencereye karışır. Bıçağı bamyanın sapının etrafında döndürerek, külah ucu gibi ince ince yontmak kapsülü kapalı tutar. Bu iş biraz zaman alır; hazırlık süresinin büyük kısmı burada geçer. Küçük ve taze bamyalar hem daha kolay ayıklanır hem daha az lifli olur. Ayıkladıktan sonra limonlu sirkeli suda beklettiğin bamyaları iyice süzerek tencereye ekle.

      '
  - t: Karıştırmadan pişirmek
    d: 'Bamya kaşıkla karıştırıldığında kabuğu zedelenir, içi açılır ve yemek sümüksü bir kıvama döner. Bunun yerine tencereyi kulplarından tutup hafifçe sallayarak ya da dairesel hareketle çevirerek malzemeleri karıştır. Ateşi kısık tut; fokur fokur kaynayan su bamyaları birbirine çarptırır. Limon suyu hem salyayı keser hem bamyanın yeşil rengini korumasına yardım eder. Limon yoksa misket limonu ya da yarı ölçü elma sirkesi kullanabilirsin.

      '
  - t: Kuru bamya ve et seçimi
    d: 'Bu tarif taze bamyayla yazıldı. Kışın ipe dizilmiş kuru bamya kullanacaksan önce haşlayıp süzmen gerekir; kuru bamya kendine has, daha yoğun bir aroma verir. Et olarak dana kuşbaşı kullanılıyor; kuzu eti de aynı yöntemle olur. Tavuk but tercih edersen etin ön pişirme süresini yarıya indir. Etli bamya buzdolabında kapalı kapta saklanabilir; ısıtırken de kaşıkla karıştırmak yerine tencereyi sallayarak ısıt ki bamyalar dağılmasın.

      '
  faq:
  - q: Bamya nasıl salya yapmaz?
    a: Bamyanın başını içini açmadan külah gibi yontarak ayıkla ve limonlu sirkeli suda 15 dakika beklet. Pişirirken kaşıkla karıştırma, tencereyi salla ve limon suyu ekle.
  - q: Etli bamya kaç dakika pişer?
    a: Et önce yaklaşık 20 dakika pişer, bamyalar eklendikten sonra limonla birlikte kısık ateşte 25 dakika daha pişer.
  - q: Etli bamya kuru bamyayla yapılır mı?
    a: Evet, ama ipe dizilmiş kuru bamyayı önce haşlayıp süzmen gerekir. Ardından tarifteki gibi ete ekleyebilirsin.
  - q: Bamya yemeğinde limon yerine ne kullanılır?
    a: Misket limonu ya da yarı ölçü elma sirkesi kullanabilirsin.
zeytinyagli-bamya:
  aramaBasligi: 'Zeytinyağlı bamya tarifi: Domatesli, limonlu, soğuk servis'
  intro: 'Zeytinyağlı bamya, bamyanın soğan, domates, zeytinyağı ve limon suyuyla kısık ateşte pişirilip soğuk yendiği bir yaz yemeği. Etli bamyanın etsiz ve daha hafif hali; yaz sofralarında tek başına ya da başka yemeklerin yanında servis edilebilir.


    Bu tarifte bamyaların başları külah gibi yontulup limonlu suda 15 dakika bekletiliyor. Zeytinyağında yumuşayan soğana rendelenmiş domates ekleniyor ve 5 dakika pişiyor. Ardından bamyalar şeker, tuz, limon suyu ve bir su bardağı sıcak suyla birlikte giriyor; karıştırılmadan, tencere sallanarak kısık ateşte 30 dakika pişiyor ve tencerede soğutuluyor.


    Hazırlık 25, pişirme 35 dakika; toplam 60 dakikada 4 kişilik. Tarif vegan ve glutensiz.

    '
  editorNote: 'Bamyayı tencerede soğutmayı ayrı adım olarak yazdık; sıcakken başka bir kaba aktarılan bamyalar dağılır, tencerede soğurken de sosu daha iyi çeker.

    '
  notes:
  - t: Salyasız bamya için ayıklama
    d: 'Bamyanın sap kısmını düz kesmek yerine bıçağı etrafında döndürerek ince ince yontmak gerekir; böylece tohumların bulunduğu iç kısım kapalı kalır. İçi açılan bamya pişerken salya salar ve yemek kıvamını kaybeder. Ayıkladıktan sonra limonlu suda 15 dakika bekletmek de salyayı azaltır. Bu iş sabır ister, ama hazırlık süresinin büyük kısmı burada geçer ve pişirme aşaması kolaydır. Küçük, taze ve parlak yeşil bamyalar seçmek ayıklamayı kolaylaştırır.

      '
  - t: Tencereyi sallamak ve kısık ateş
    d: 'Bamyalar tencereye girdikten sonra kaşık kullanma. Kaşık bamyanın kabuğunu zedeleyip içini açar ve yemek sümüksü olur. Bunun yerine tencereyi kulplarından tutup arada bir hafifçe salla. Ateşin kısık olması da önemli; hızlı kaynayan su bamyaları birbirine çarptırıp dağıtır. Limon suyu salyayı azaltır ve bamyanın yeşil kalmasını sağlar. Bir tatlı kaşığı şeker ise domates ve limonun ekşiliğini dengeler, yemeği tatlandırmaz. Tencereyi her sallayışta kapağı hemen geri kapat.

      '
  - t: Servis ve saklama
    d: 'Zeytinyağlılar soğuk ya da oda sıcaklığında servis edilir, çünkü soğudukça sebze sosunu çeker ve zeytinyağının aroması belirginleşir. Bamyayı pişirdiğin tencerede soğut, sonra servis tabağına dikkatle aktar. Buzdolabında kapalı kapta saklayabilirsin; çok soğuk yemek istemiyorsan servisten biraz önce dolaptan çıkar. Limon yoksa misket limonu ya da yarı ölçü elma sirkesi kullanılabilir. Kışın taze domates yerine konserve doğranmış domates daha iyi sonuç verir.

      '
  faq:
  - q: Zeytinyağlı bamya kaç dakika pişer?
    a: Soğan ve domates 5 dakika pişer, bamyalar eklendikten sonra kısık ateşte 30 dakika pişer.
  - q: Zeytinyağlı bamya neden sümüksü olur?
    a: Bamya içi açılacak şekilde ayıklanırsa ya da kaşıkla karıştırılırsa sümüksü olur. Başlarını külah gibi yont ve pişirirken tencereyi salla.
  - q: Zeytinyağlı bamya sıcak mı soğuk mu yenir?
    a: Soğuk ya da oda sıcaklığında yenir. Pişirdiğin tencerede soğutup servis et.
  - q: Bamyanın yeşil rengi nasıl korunur?
    a: Limon suyu bamyanın yeşil kalmasına yardım eder. Bu tarifte bir limonun suyu bamyalarla birlikte ekleniyor.
zeytinyagli-bezelye:
  aramaBasligi: 'Zeytinyağlı bezelye tarifi: Havuçlu, dereotlu, 40 dakikada'
  intro: 'Zeytinyağlı bezelye, bezelyenin havuç, patates ve soğanla zeytinyağında pişirildiği, ılık ya da soğuk yenen bir sebze yemeği. Bezelyenin kendi tatlılığı, bir tatlı kaşığı şeker ve en son eklenen dereotuyla öne çıkıyor.


    Bu tarifte soğan zeytinyağında yumuşatılıyor, küp doğranmış havuç ve patates 3 dakika çevriliyor. Ardından bezelye, şeker, tuz ve bir su bardağı sıcak su ekleniyor ve kapağı kapalı yaklaşık 25 dakika pişiyor. Ocağı kapatırken dereotu giriyor. Taze bezelye de dondurulmuş bezelye de kullanılabiliyor; dondurulmuşla süre kısalıyor.


    Hazırlık 10, pişirme 30 dakika; toplam 40 dakikada 4 kişilik. Tarif vegan ve glutensiz.

    '
  editorNote: 'Havuç ve patatesi bezelyeden önce kısa süre kavurmayı seçtik; daha sert olan bu sebzeler öne geçince bezelyeyle aynı anda yumuşuyor.

    '
  notes:
  - t: Taze ya da dondurulmuş bezelye
    d: 'Tarif iki türle de çalışır, ama pişme süreleri farklı. Taze bezelye yaklaşık 25 dakikada yumuşar; iri ve yaşlı taneler biraz daha uzun sürebilir. Dondurulmuş bezelyede ise pişme süresi 15 dakikaya iner. Bu durumda havuç ve patatesi sıcak suyla önce pişirmeye başlayıp bezelyeyi sonradan eklemek, sebzelerin aynı anda yumuşamasını sağlar. Dondurulmuş bezelyeyi çözdürmeden doğrudan tencereye atabilirsin; çözdürmek tanelerin buruşmasına yol açabilir.

      '
  - t: Renk ve doku
    d: 'Bezelyenin yeşil rengi uzun pişirmede solar ve taneler buruşur. Kapağı kapalı ve orta-kısık ateşte pişirmek suyun hızla buharlaşmasını önler ve taneleri dolgun tutar. Havuç ve patatesi küçük küp doğra ki bezelyeyle aynı sürede yumuşasın; iri doğranan patates bezelye ezilmeye başladığında hâlâ sert olabilir. Bir tatlı kaşığı şeker yemeği tatlı yapmak için değil, bezelyenin doğal tadını öne çıkarmak için ekleniyor. Dereotu en son girer ki rengi ve kokusu kaybolmasın.

      '
  - t: Servis ve çeşitleme
    d: 'Zeytinyağlı bezelye ılık ya da soğuk yenir. Soğudukça zeytinyağı ve sebze suyu birleşip hafif bir sos oluşturur. Buzdolabında kapalı kapta saklayabilirsin. Dereotu sevmiyorsan maydanoz ve biraz taze nane kullan. Daha zengin bir zeytinyağlı istersen enginar kalbi ekleyerek İstanbul usulü bir versiyon yapabilirsin. Patates yerine tatlı patates de olur; o biraz daha çabuk pişer. Yanına yoğurt ve ekmek koyarsan hafif bir öğle yemeği olur.

      '
  faq:
  - q: Zeytinyağlı bezelye kaç dakika pişer?
    a: Sıcak su eklendikten sonra kapağı kapalı yaklaşık 25 dakika pişer. Dondurulmuş bezelye kullanırsan süre 15 dakikaya iner.
  - q: Dondurulmuş bezelyeyle zeytinyağlı yapılır mı?
    a: Evet, tarif taze ya da dondurulmuş bezelyeyle yapılabilir. Dondurulmuş bezelyeyi çözdürmeden kullanabilirsin.
  - q: Bezelye yemeğine neden şeker konur?
    a: Bir tatlı kaşığı şeker bezelyenin doğal tatlılığını belirginleştirir ve sebzelerin tadını dengeler.
  - q: Zeytinyağlı bezelye sıcak mı yenir?
    a: Ilık ya da soğuk servis edilir. Soğudukça tadı oturur.
zeytinyagli-kuru-fasulye:
  aramaBasligi: 'Zeytinyağlı kuru fasulye tarifi: Etsiz, bol soğanlı'
  intro: 'Zeytinyağlı kuru fasulye, etin yerini zeytinyağı ve bol soğanın aldığı, salçalı ve doyurucu bir tencere yemeği. Etsiz olduğu için hafif, ama baklagil sayesinde ana yemek olarak tek başına yetiyor. Pek çok tencere yemeği gibi ertesi gün daha lezzetli.


    Bu tarifte fasulyeler bir gece önceden ıslatılıyor, taze suyla 10 dakika haşlanıp süzülüyor. Zeytinyağında iki soğan ve küp doğranmış havuç kavruluyor, domates ve biber salçası ekleniyor. Fasulye ve altı su bardağı sıcak suyla kapağı aralık, kısık ateşte 50 dakika pişiyor; tuz son 10 dakikada giriyor. Ocaktan aldıktan sonra en az yarım saat dinlendiriliyor.


    Hazırlık 15, pişirme 60 dakika; toplam 75 dakikada 6 kişilik. Bir gecelik ıslatmayı önceden planla. Tarif vegan ve glutensiz.

    '
  editorNote: 'Islanmış fasulyeyi 10 dakika ön haşlayıp suyunu dökmeyi ayrı adım yaptık; bu adım pişme süresini kısaltıyor ve yemeği daha hafif yapıyor.

    '
  notes:
  - t: Islatma ve ön haşlama
    d: 'Kuru fasulyeyi bir gece bol suda ıslatmak tanelerin su çekip eşit pişmesini sağlar. Islatmadan pişirilen fasulyenin dışı dağılırken içi sert kalabilir. Sabah ıslatma suyunu dök, fasulyeyi taze suyla 10 dakika haşla ve bu suyu da dök. Ön haşlama hem pişme süresini kısaltır hem de fasulyenin daha hafif olmasını sağlar; yüzeye çıkan köpüklü ilk su atılmış olur. Sonra soğanlı, salçalı karışıma eklenen fasulye sıcak suyla kısık ateşte yumuşayana kadar pişer.

      '
  - t: Tuzu neden sona bırakıyoruz
    d: 'Tuzu baştan eklemek fasulyenin geç pişmesine yol açar; bu yüzden tarifte tuz son 10 dakikada giriyor. Kapağı aralık bırakmak suyun yavaş yavaş azalıp sosun koyulaşmasını sağlar. Su erken azalırsa sıcak su ekle; soğuk su kaynamayı keser ve pişmeyi uzatır. Fasulyenin piştiğini anlamak için bir taneyi parmaklarının arasında ez; kolayca eziliyorsa hazır. Düdüklü tencerede pişirme süresi 20 dakikaya iner, bu durumda suyu biraz azaltman gerekebilir.

      '
  - t: Dinlendirme ve servis
    d: 'Ocaktan aldıktan sonra en az yarım saat dinlendirmek, fasulyenin sosu çekmesini ve tadının oturmasını sağlar. Zeytinyağlı kuru fasulye ılık ya da oda sıcaklığında da yenebilir. Ertesi gün daha lezzetli olur, bu yüzden bir gün önceden pişirmek iyi bir plan. Buzdolabında kapalı kapta sakla; ısıtırken kıvamı koyulaştıysa biraz sıcak su ekle. Yanına bulgur pilavı ve turşu klasik eşlikçi. Biber salçası yoksa domates salçasına bir tatlı kaşığı pul biber katabilirsin.

      '
  faq:
  - q: Kuru fasulye ıslatılmadan pişer mi?
    a: Pişer ama çok daha uzun sürer ve taneler eşit pişmez. Bu tarifte fasulyeler bir gece önceden ıslatılıyor.
  - q: Zeytinyağlı kuru fasulye kaç dakika pişer?
    a: Ön haşlamadan sonra kısık ateşte yaklaşık 50 dakika pişer. Düdüklü tencerede süre 20 dakikaya iner.
  - q: Kuru fasulyeye tuz ne zaman atılır?
    a: Tuzu son 10 dakikada ekle. Baştan eklenen tuz fasulyenin geç pişmesine neden olur.
  - q: Kuru fasulye neden ön haşlanır?
    a: Islanmış fasulyeyi 10 dakika haşlayıp suyunu dökmek pişme süresini kısaltır ve yemeği daha hafif yapar.
zeytinyagli-borulce:
  aramaBasligi: 'Zeytinyağlı börülce tarifi: Taze börülce, sarımsaklı'
  intro: 'Zeytinyağlı börülce, taze börülcenin soğan, sarımsak ve domatesle zeytinyağında pişirilip soğuk yendiği bir yaz yemeği. Ege mutfağında sık görülen bir zeytinyağlı; görünüşü taze fasulyeye benzer ama daha ince ve uzundur. Taze haliyle yalnızca yaz aylarında bulunur.


    Bu tarifte börülcelerin uçları kırılıp 4 cm boyunda doğranıyor. Zeytinyağında soğan ve sarımsak yumuşatılıyor, rendelenmiş domates ekleniyor. Ardından börülce, şeker, tuz ve bir su bardağı sıcak suyla kapağı kapalı 30 dakika pişiyor ve tencerede soğutuluyor. Servis ederken üzerine limon sıkmak tadı canlandırıyor.


    Hazırlık 15, pişirme 35 dakika; toplam 50 dakikada 4 kişilik. Tarif vegan ve glutensiz.

    '
  editorNote: 'Sarımsağı soğanla birlikte en başta yumuşatmayı seçtik; böylece keskinliği gidiyor ve aroması zeytinyağına geçerek bütün tencereye yayılıyor.

    '
  notes:
  - t: Taze börülce seçmek
    d: 'Taze börülce yaz aylarında pazarda bulunur. İnce, esnek ve canlı yeşil olanları seç; kalınlaşmış, içindeki taneleri belirginleşmiş börülceler daha lifli olur. Uçlarını kırarken lif çıkıyorsa onu da çekip al. 4 cm boyunda doğramak hem eşit pişmesini hem de çatalla rahat yenmesini sağlar. Börülceyi yıkadıktan sonra iyice süz; fazla su yemeğin sulu kalmasına neden olur. Pişirirken 30 dakikanın sonunda bir parçayı tadarak kontrol et.

      '
  - t: Zeytinyağlı pişirme mantığı
    d: 'Zeytinyağlılarda su az kullanılır; sebze kendi suyu ve zeytinyağıyla yavaşça pişer. Kapağı kapalı tutmak, bir su bardağı sıcak suyun yeterli olmasını sağlar. Bir tatlı kaşığı şeker domatesin ekşiliğini dengeler ve sebzenin tadını yumuşatır. Pişirdikten sonra tencerede soğutmak, börülcenin sosu çekmesine ve zeytinyağının aromasının oturmasına izin verir. Kışın taze domates yerine konserve doğranmış domates kullanabilirsin. Soğanı mor soğan ya da arpacıkla değiştirirsen tat biraz daha tatlı olur.

      '
  - t: Kuru börülce ve servis
    d: 'Bu tarif taze börülceyle yazıldı. Kuru börülce farklı bir malzeme; kurutulmuş tanelerden oluşur ve bir gece ıslatılıp haşlanması gerekir. Kuru börülceyi haşladıktan sonra soğanla soslandırıp salata olarak hazırlamak daha uygun bir kullanım. Taze börülceyi soğuk servis et ve üzerine limon sık; limon zeytinyağlının tadını canlandırır. Buzdolabında kapalı kapta saklayabilirsin. Yanına yoğurt ya da taze ekmek koyarak hafif bir öğle yemeği çıkarabilirsin.

      '
  faq:
  - q: Zeytinyağlı börülce kaç dakika pişer?
    a: Börülceler eklendikten sonra kapağı kapalı yaklaşık 30 dakika pişer.
  - q: Taze börülce nasıl ayıklanır?
    a: Uçlarını kırıp 4 cm boyunda doğra. Lif çıkıyorsa onu da çekip al.
  - q: Kuru börülceyle zeytinyağlı yapılır mı?
    a: Kuru börülceyi bir gece ıslatıp haşlaman gerekir. Haşlanmış kuru börülceyi soğanla soslandırarak salata yapmak daha uygun olur.
  - q: Zeytinyağlı börülce sıcak mı soğuk mu yenir?
    a: Tencerede soğutulup soğuk servis edilir. Üzerine limon sıkabilirsin.
zeytinyagli-bakla:
  aramaBasligi: 'Zeytinyağlı taze bakla tarifi: Kabuğuyla, dereotlu'
  intro: 'Zeytinyağlı taze bakla, baklanın kabuğuyla birlikte doğranıp zeytinyağı, soğan ve limonla pişirildiği, soğuk yenen bir bahar yemeği. Taze baklanın mevsimi kısa olduğu için ilkbaharda pazarda görüldüğünde pişirilen zeytinyağlılardan; İstanbul mutfağında da sıkça yer alır.


    Bu tarifte baklaların uçları ve kenar lifleri çekilip 3-4 cm doğranıyor, kararmaması için limonlu suya atılıyor. Zeytinyağında soğan yumuşatıldıktan sonra baklalar şeker, tuz, limon ve bir buçuk su bardağı sıcak suyla kapağı kapalı, kısık ateşte 35-40 dakika pişiyor. Dereotu ocaktan almadan ekleniyor ve yemek tencerede soğutuluyor.


    Hazırlık 20, pişirme 40 dakika; toplam 60 dakikada 4 kişilik. İsteyen sarımsaklı yoğurtla servis edebilir.

    '
  editorNote: 'Sarımsaklı yoğurdu malzemelere değil servis adımına koyduk; böylece yoğurt eklemeyen için yemek vegan kalıyor, isteyen tabağında ekliyor.

    '
  notes:
  - t: Ayıklama ve kararmayı önlemek
    d: 'Taze bakla kabuğuyla pişirildiği için kenarlarındaki sert lifleri çekmek önemli; bu lifler pişince yumuşamaz ve ağızda kalır. Ucunu bıçakla kesip kenar boyunca aşağı çekerek lifi ayır, diğer kenar için de aynısını yap. Doğradığın baklalar havayla temas edince kararır, bu yüzden hemen limonlu suya at. Bakla ellerini de karartabilir; ayıklarken eldiven kullanmak işini kolaylaştırır. Genç ve ince baklaları seç; yaşlı baklaların kabuğu sert olur ve uzun pişse de yumuşamaz.

      '
  - t: Kısık ateş ve limon
    d: 'Bakla kabuğuyla piştiği için diğer zeytinyağlılardan biraz daha uzun sürer; bu tarifte 35-40 dakika. Kapağı kapalı ve ateşi kısık tutmak, bir buçuk su bardağı suyun yetmesini ve baklanın dağılmadan yumuşamasını sağlar. Limon suyu hem rengin açık kalmasına yardım eder hem de yemeğe ferah bir ekşilik katar. Bir tatlı kaşığı şeker bu ekşiliği dengeler. Limon yoksa misket limonu ya da yarı ölçü elma sirkesi kullanabilirsin.

      '
  - t: Dereotu ve servis
    d: 'Bakla ile dereotu klasik bir eşleşme. Dereotu ocaktan almadan hemen önce eklenir ki rengini ve kokusunu korusun; yemekle birlikte tencerede soğurken aroması bütün sosa geçer. Dereotu bulamazsan maydanoz ve biraz taze nane kullanabilirsin. Zeytinyağlı bakla soğuk servis edilir. İstersen yanına sarımsaklı yoğurt koy; yoğurt eklendiğinde yemek vegan olmaktan çıkar. Buzdolabında kapalı kapta saklanır ve ertesi gün tadı daha da oturur.

      '
  faq:
  - q: Zeytinyağlı bakla kaç dakika pişer?
    a: Kapağı kapalı, kısık ateşte 35-40 dakika pişer.
  - q: Taze bakla nasıl ayıklanır?
    a: Uçlarını ve kenar liflerini çekerek al, 3-4 cm doğra. Kararmasın diye doğradıkça limonlu suya at.
  - q: Bakla neden kararır?
    a: Doğranan bakla havayla temas edince kararır. Limonlu suda bekletmek ve limonla pişirmek rengini korur.
  - q: Zeytinyağlı bakla yoğurtla mı yenir?
    a: Soğuk olarak, isteyene sarımsaklı yoğurtla servis edilir. Yoğurt eklendiğinde yemek vegan olmaz.
kemalpasa:
  aramaBasligi: 'Kemalpaşa tatlısı tarifi: Peynirli, şerbetli, kaymaklı'
  intro: 'Kemalpaşa tatlısı, tuzsuz taze peynir ya da lorla yoğrulan irmikli hamurdan yapılan, fırında pişirilip şerbete atılan küçük, yuvarlak bir tatlı. Adını Bursa''nın Mustafakemalpaşa ilçesinden alıyor ve genellikle kaymakla servis ediliyor.


    Bu tarifte önce şeker ve su 15 dakika kaynatılıp limonla şerbet hazırlanıyor ve soğumaya bırakılıyor. Ezilmiş peynir; yumurta, ince irmik, un ve kabartma tozuyla yumuşak bir hamur oluyor ve 15 dakika dinleniyor. Ceviz büyüklüğünde yuvarlanan parçalar 180°C fırında 20-25 dakika, açık altın rengi alana kadar pişiyor, sıcakken soğuk şerbete atılıp 1 saat bekletiliyor.


    Hazırlık 30, pişirme 25 dakika; toplam 55 dakikada 6 kişilik. Şerbeti çekme süresini de hesaba kat.

    '
  editorNote: 'Şerbeti ilk adım olarak yazdık, çünkü tatlılar fırından sıcak çıktığında şerbetin soğumuş olması gerekiyor; sıcak tatlı soğuk şerbetle buluşunca dağılmadan şerbeti çekiyor.

    '
  notes:
  - t: Peynirin seçimi
    d: 'Kemalpaşa tatlısının hamurunda tuzsuz taze peynir ya da lor kullanılıyor. Tuzlu peynir şerbetle birleşince tadı bozar, bu yüzden peynirin tuzsuz olması şart. Elindeki peynir tuzluysa bir süre suda bekletip tuzunu almak mümkün, ama sonuç tuzsuz peynir kadar iyi olmaz. Peyniri iyice ezmek hamurun pürüzsüz olmasını sağlar; topak kalan peynir fırında çatlaklara yol açabilir. Lor bulamazsan ricotta ya da ezilmiş tuzsuz beyaz peynir de kullanılabilir.

      '
  - t: Hamur kıvamı ve pişirme
    d: 'Hamur yumuşak olmalı ama ele yapışmamalı. İrmik dinlenme süresinde nemi çekip şişer; 15 dakika beklemek hamurun kıvamını toparlar ve şekil vermeyi kolaylaştırır. Ceviz büyüklüğünde parçalar alıp yuvarla ve hafifçe bastır; tatlılar fırında kabaracağı için tepside aralarına boşluk bırak. 180°C''de açık altın rengi aldıklarında çıkar. Fazla kızarırsa yüzeyi sertleşir ve şerbeti iyi çekmez. Fırınlar farklı ısındığı için ilk tepside 20. dakikadan itibaren rengi kontrol et.

      '
  - t: Şerbetleme ve servis
    d: 'Sıcak tatlıları soğuk şerbete atmak, tatlının şerbeti dağılmadan ve hamurlaşmadan çekmesini sağlar. İkisi de sıcak olursa tatlı yumuşayıp dağılır, ikisi de soğuk olursa şerbet içeri işlemez. Tatlıları şerbette 1 saat beklet, ara ara kaşıkla üzerlerine şerbet gezdir. Servis ederken kaymakla sun; kaymak yoksa mascarpone ya da kıvamında çırpılmış krema iyi bir alternatif. Markette bulunan hazır Kemalpaşa tatlısını da sadece şerbetle haşlayarak hazırlayabilirsin.

      '
  faq:
  - q: Kemalpaşa tatlısı fırında kaç dakika pişer?
    a: 180°C fırında açık altın rengi alana kadar 20-25 dakika pişer.
  - q: Kemalpaşa tatlısında şerbet sıcak mı soğuk mu olmalı?
    a: Şerbet soğuk, tatlı sıcak olmalı. Sıcak tatlıları soğuk şerbete atıp 1 saat beklet.
  - q: Kemalpaşa tatlısı hangi peynirle yapılır?
    a: Tuzsuz taze peynir ya da lorla yapılır. Ricotta ya da ezilmiş tuzsuz beyaz peynir de kullanılabilir.
  - q: Kemalpaşa tatlısı kaymak yerine neyle servis edilir?
    a: Mascarpone ya da kıvamında çırpılmış kremayla servis edebilirsin.
kalburabasti:
  aramaBasligi: 'Kalburabastı tarifi: Cevizli şerbetli tatlı, 180°C fırında'
  intro: 'Kalburabastı, cevizle doldurulan yumuşak hamur parçalarının kalbur üzerinde bastırılarak desenlendirildiği, fırında pişirilip şerbetlenen bir tatlı. Adını bu desenin verildiği kalburdan alıyor; misafir sofralarına yakışan ev usulü şerbetlilerden.


    Bu tarifte şerbet önce kaynatılıp soğutuluyor. Un, sıvı yağ, yoğurt, yumurta, kabartma tozu ve vanilinle ele yapışmayan yumuşak bir hamur yoğruluyor. Ceviz büyüklüğündeki parçalar avuçta açılıp iri çekilmiş cevizle dolduruluyor, kalburun ya da rendenin üzerinde bastırılıp iki ucu kıvrılıyor. 180°C fırında 25-30 dakika açık altın rengi alana kadar pişen tatlıya soğuk şerbet dökülüyor.


    Hazırlık 30, pişirme 30 dakika; toplam 60 dakikada 10 kişilik bir tepsi.

    '
  editorNote: 'Kalbur yerine rende ya da çatal sırtıyla desen verme seçeneğini ekledik; çoğu mutfakta kalbur bulunmuyor ve desen, tatlının görüntüsü kadar şerbeti tutmasına da yarıyor.

    '
  notes:
  - t: Hamur kıvamı
    d: 'Kalburabastının hamuru sıvı yağlı ve yoğurtlu olduğu için yumuşak ve kolay şekil alır. Yoğururken ele yapışıyorsa biraz daha un ekleyebilirsin, ama fazla un hamuru sertleştirir ve tatlı şerbeti iyi çekmez. Doğru kıvam, bastırdığında desen tutan ama çatlamayan bir hamurdur. Hamuru çok uzun yoğurmaya gerek yok; malzemeler bir araya gelip pürüzsüz olunca yeterli. Kabartma tozu hamuru fırında hafifçe kabartır, bu yüzden tepside parçaların arasında boşluk bırak.

      '
  - t: Desen ve dolgu
    d: 'Avucunda açtığın hamurun ortasına cevizi koyup kenarlarını kapat, birleşim yeri alta gelecek şekilde kalbura bastır. Bastırırken hamuru hafifçe ileri doğru kaydırmak deseni belirginleştirir. Desen yalnızca görüntü için değil; yüzeydeki çizgiler şerbetin tatlıya işlemesine de yardım eder. Kalbur yoksa rendenin üzerinde bastırarak ya da çatalın sırtıyla çizgi deseni yapabilirsin. Ceviz yerine fındık ya da badem kullanılabilir; iri çekilmiş olması iç dokuyu korur.

      '
  - t: Şerbetleme ve sunum
    d: 'Şerbet önceden hazırlanıp tamamen soğumalı, tatlı ise fırından yeni çıkmış ve sıcak olmalı. Bu sıcaklık farkı tatlının şerbeti dağılmadan çekmesini sağlar. Şerbeti dökerken her parçanın üstünden geçecek şekilde gezdir ve tatlının şerbetini çekmesini bekle. Üzerine hindistan cevizi ya da fıstık serpilebilir. Kalburabastıyı oda sıcaklığında, üzeri kapalı olarak saklayabilirsin; şerbetli tatlılar buzdolabında hamur kısmı sertleşebildiği için genellikle dışarıda, serin bir yerde tutulur.

      '
  faq:
  - q: Kalburabastı fırında kaç dakika pişer?
    a: 180°C fırında açık altın rengi alana kadar 25-30 dakika pişer.
  - q: Kalburabastı kalbur olmadan nasıl yapılır?
    a: Kalbur yoksa rendenin üzerinde bastırarak ya da çatalın sırtıyla çizgi deseni vererek yapabilirsin.
  - q: Kalburabastıya şerbet sıcak mı dökülür?
    a: Hayır, sıcak tatlıya soğuk şerbet dökülür. Şerbeti önceden 15 dakika kaynatıp soğut.
  - q: Kalburabastıda ceviz yerine ne kullanılır?
    a: Fındık ya da badem kullanabilirsin.
gullac:
  aramaBasligi: 'Güllaç tarifi: Gül sulu sütlü, cevizli ve narlı'
  intro: 'Güllaç, ince güllaç yapraklarının şekerli ve gül suyu kokulu sütle ıslatılıp kat kat dizildiği, arasına ceviz serpilen hafif bir sütlü tatlı. Ramazan ayıyla özdeşleşmiş; yapraklar da en kolay bu dönemde bulunuyor.


    Bu tarifte süt ve şeker, şeker eriyene kadar ılıtılıyor ve gül suyu ekleniyor; süt kaynatılmıyor. Geniş tepsiye yapraklar tek tek konup kepçeyle süt gezdirilerek ıslatılıyor, beş katın ardından ortaya iri çekilmiş ceviz yayılıyor ve kalan yapraklar aynı şekilde diziliyor. Buzdolabında en az 3 saat bekledikten sonra dilimlenip nar taneleri ve antep fıstığıyla süsleniyor.


    Hazırlık 25, pişirme 10 dakika; toplam 35 dakikada 8 kişilik. Buzdolabındaki 3 saatlik bekleme süresini önceden planla.

    '
  editorNote: 'Sütün ılık olması gerektiğini hem adımda hem notta vurguladık; sıcak süt ince yaprakları dağıtıyor, soğuk süt ise yapraklara iyi işlemiyor.

    '
  notes:
  - t: Sütün sıcaklığı
    d: 'Güllaç yaprakları çok ince ve kurudur; sütü çekerek yumuşar. Süt sıcak olursa yapraklar hızla hamurlaşıp dağılır, soğuk olursa yaprakların içine yeterince işlemez ve yer yer sert kalır. Bu yüzden süt ve şekeri yalnızca şeker eriyene kadar ılıt, kaynatma. Gül suyunu ocaktan aldıktan sonra eklemek kokusunun uçmasını önler. Gül suyunun miktarını artırma; fazlası tatlıya keskin, parfümsü bir koku verir. 1,5 litre süt için 2 yemek kaşığı yeterli.

      '
  - t: Yaprakları ıslatmak ve dizmek
    d: 'Her yaprağı tepsiye koyduktan sonra kepçeyle sütü yaprağın bütün yüzeyine gezdir; kuru kalan köşeler servis sırasında kırılır. Yenisini koymadan önce bir önceki yaprağın sütü emip yumuşamasını kısa süre bekle. Yapraklar çok kırılgan olduğu için paketten çıkarırken dikkatli ol; küçük kırıklar ıslanınca birleşir ve sorun olmaz. Ceviz katmanını ortaya eşit yay. Kalan sütü en son üstüne dökmek, üst katların da tamamen yumuşamasını sağlar.

      '
  - t: Bekletme, servis ve alternatifler
    d: 'Güllacın en az 3 saat buzdolabında beklemesi şart; bu sürede yapraklar sütü çeker ve dilimlenebilir bir kıvam oluşur. Nar taneleri bekledikçe sütü renklendirebilir, bu yüzden nar ve fıstığı dilimledikten sonra, servis öncesinde ekle. Antep fıstığı yerine ceviz ya da fındık, ceviz yerine fındık ya da badem kullanabilirsin. Laktozsuz süt birebir olur; vegan bir versiyon için yulaf ya da badem sütü denenebilir. Güllaç buzdolabında saklanır, ama uzun beklerse yapraklar fazla yumuşar.

      '
  faq:
  - q: Güllaç için süt kaynatılır mı?
    a: Hayır, süt ve şeker yalnızca şeker eriyene kadar ılıtılır. Sıcak süt yaprakları dağıtır.
  - q: Güllaç buzdolabında ne kadar bekletilir?
    a: Servis etmeden önce en az 3 saat buzdolabında bekletilmelidir. Bu sürede yapraklar sütü çeker ve dilimlenebilir hale gelir.
  - q: Güllaç neden sulu olur?
    a: Yapraklar sütü çekecek kadar beklemediyse tatlı sulu kalır. En az 3 saat bekletmek bunu önler.
  - q: Güllaç yaprağı nereden bulunur?
    a: Güllaç yaprakları özellikle Ramazan döneminde marketlerde kolayca bulunur.
un-helvasi:
  aramaBasligi: 'Un helvası tarifi: Sütlü şerbetle, 30 dakikada'
  intro: 'Un helvası, tereyağında sabırla kavrulan unun sıcak şerbetle buluşup kaşıkla şekillendirildiği geleneksel bir Anadolu tatlısı. Helva günlerinde ve kandil gecelerinde pişirilip komşuya dağıtılması, onu bir tatlıdan çok paylaşma geleneğinin parçası yapar.


    Bu tarifte şerbet yalnızca sudan değil, yarı yarıya süt ve sudan hazırlanıyor; süt helvaya daha yumuşak bir doku ve hafif karamelimsi bir tat veriyor. Çam fıstığı unla birlikte kavrulduğu için kokusu helvanın tamamına siniyor, ama istersen hiç koymadan da yapabilirsin.


    Hazırlığı 5, pişirmesi 25 dakika; toplam yarım saatte 6 kişilik bir helva çıkıyor. Zamanın büyük kısmı unu kısık ateşte kavurmaya gidiyor ve tadı belirleyen asıl adım da bu.

    '
  editorNote: 'Şerbeti en başta hazırlayıp sıcak tutmayı ilk adım olarak yazdık, çünkü kavrulmuş unun üzerine soğuk şerbet dökülürse helva topaklanır ve şerbeti eşit çekmez.

    '
  notes:
  - t: Unun kavrulma rengi
    d: 'Helvanın tadı tamamen kavurmaya bağlı. Un ilk dakikalarda beyaz ve hamurumsu durur, sonra tereyağıyla birlikte gevşeyip akışkan bir kıvama geçer. Açık kahve rengini ve fındık kokusunu aldığında hazırdır; tarifteki 20 dakika kısık ateş için geçerli. Ateşi açıp süreyi kısaltmaya çalışırsan dışı yanar, içi çiğ kalır ve helva acı bir tat bırakır. Tahta kaşıkla tencerenin dibini ve kenarlarını sürekli kazıyarak karıştır, birkaç saniye bile ayrılma.

      '
  - t: Şerbeti eklerken dikkat
    d: 'Kızgın un ve tereyağının üzerine sıcak sıvı döküldüğünde karışım bir anda köpürür ve yoğun buhar çıkarır. Bu yüzden şerbeti eklemeden önce ocağı kapatıyoruz. Şerbeti tek seferde değil, kepçe kepçe ve tencereden biraz uzak durarak ekle; elini buhardan korumak için uzun saplı bir kaşık kullan. Şerbet eklendikten sonra kısık ateşte yaklaşık 3 dakika karıştırınca helva şerbetini çeker ve tencerenin kenarından ayrılan yumuşak bir kıvama gelir.

      '
  - t: Servis ve saklama
    d: 'Un helvası en güzel ılıkken, kapağı kapalı 10 dakika demlendikten hemen sonra yenir. Islak bir kaşıkla bastırıp kayık şeklinde koparmak geleneksel servis biçimidir; kaşığı her seferinde suya batırırsan helva yapışmaz. Artan helvayı kapalı kapta buzdolabında saklayabilirsin. Soğukta sertleşir; yemeden önce kısık ateşte bir kaşık sütle ısıtırsan ilk günkü yumuşaklığına yakın bir kıvama döner. Üzerine tarçın serpmek de yaygın bir seçenek.

      '
  faq:
  - q: Un helvası kaç dakika kavrulur?
    a: 'Kısık ateşte, sürekli karıştırarak yaklaşık 20 dakika. Un açık kahve rengi alıp fındık gibi kokmaya başladığında ocağı kapatıp şerbeti ekleyebilirsin.

      '
  - q: Un helvası neden topak olur?
    a: 'Çoğunlukla şerbet soğuk eklendiğinde ya da ekledikten sonra yeterince karıştırılmadığında. Şerbeti sıcak tut ve ekledikten sonra kısık ateşte 3 dakika durmadan karıştır.

      '
  - q: Un helvası sütsüz yapılır mı?
    a: 'Evet, şerbeti 1 su bardağı süt yerine 1 su bardağı daha suyla hazırlayabilirsin. Sütlü şerbet daha yumuşak, sulu şerbet daha hafif bir helva verir.

      '
  - q: Un helvasında çam fıstığı yerine ne konur?
    a: 'İri kıyılmış badem ya da kaju kullanabilirsin; unla birlikte kavurmak aromasını açar. Hiç kuruyemiş koymadan da yapılabilir.

      '
zerde:
  aramaBasligi: 'Zerde tarifi: Safranlı, gül suyu kokulu pirinç tatlısı'
  intro: 'Zerde, safranla altın sarısına boyanan, pirinçle koyulaşan ve gül suyuyla kokulandırılan geleneksel bir Türk tatlısı. Düğün ve mevlit sofralarında ikram edilmesiyle bilinir. Adı, Farsçada sarı anlamına gelen kelimeden gelir.


    Bu tarif süt, yumurta ya da tereyağı içermediği için vegan; un yerine pirinç ve mısır nişastasıyla koyulaştığı için de glutensiz. Pirinç önce bol suda yumuşayana kadar haşlanıyor, sonra şeker, demlenmiş safran ve nişastayla kıvam alıyor. Safran bulamazsan zerdeçalla da rengini yakalayabilirsin; aroması farklı olur ama görüntüsü yine çekici.


    Hazırlık 10, pişirme 30 dakika; toplam 40 dakikada 6 kişilik zerde hazır. Kâselere paylaştırıp soğuduktan sonra kuş üzümü, çam fıstığı ve nar taneleriyle süslüyorsun.

    '
  editorNote: 'Safranı demleme adımını en başa koyduk, çünkü safran rengini ve kokusunu ancak sıcak suda bir süre bekleyince bırakır; doğrudan tencereye atılırsa tatlı soluk kalır.

    '
  notes:
  - t: Safranı doğru kullanmak
    d: 'Safran pahalı ama çok az miktarı yeter; bu tarifte yarım çay kaşığı 6 kişilik zerdeyi renklendiriyor. Telleri yarım çay bardağı sıcak suda 15 dakika bekletince su koyu turuncuya döner; bu suyu tellerle birlikte tencereye ekle. Zerdeçal kullanacaksan en fazla bir tatlı kaşığı koy, fazlası tatlıya topraksı ve hafif acımsı bir tat verir. Gerçek safranla renk altın sarısı, zerdeçalla daha turuncu çıkar; gül suyu ise her iki durumda da kokuyu tamamlar.

      '
  - t: Kıvamı ayarlamak
    d: 'Zerde sıcakken akışkan görünür, soğudukça koyulaşır; bu yüzden ocakta muhallebi kıvamına getirmeye çalışma. Nişastayı mutlaka biraz soğuk suyla açıp ekle, doğrudan sıcak tencereye atarsan topaklanır. Nişastayı ekledikten sonra 5 dakika durmadan karıştırarak pişir; çiğ nişasta tadı bu sürede gider. Şekeri pirinç iyice yumuşadıktan sonra eklemek de önemli, tarifteki sıra bu yüzden böyle. Gül suyunu en sonda koy ki kokusu uçmasın. Tencerenin dibini sık sık kazı, pirinç dibe yapışmaya eğilimlidir.

      '
  - t: Süsleme ve saklama
    d: 'Süslemeyi zerde soğuduktan sonra yap; sıcak tatlının üzerine konan kuş üzümü ve fıstık dibe çöker. Kuş üzümünü birkaç dakika ılık suda bekletirsen şişip yumuşar. Nar taneleri hem renk hem hafif bir ekşilik katar ve tatlının şekerini dengeler. Zerdeyi kâselerde, üzeri kapalı olarak buzdolabında saklayabilirsin. Süslemeyi servisten hemen önce eklersen nar suyunu salmaz, çam fıstığı da tazeliğini korur. Nar bulamazsan süslemeyi yalnızca kuş üzümü ve çam fıstığıyla yapabilirsin, görünüşü yine güzel olur.

      '
  faq:
  - q: Zerde neden sarı olur?
    a: 'Rengini safrandan alır. Safran bulamazsan zerdeçal da sarı renk verir, ama tonu daha turuncu ve aroması farklı olur.

      '
  - q: Zerde kaç dakika pişer?
    a: 'Pirinç önce suyla yumuşayana kadar yaklaşık 20 dakika haşlanır. Şeker, safranlı su ve nişasta eklendikten sonra 5 dakika daha karıştırarak pişirilir.

      '
  - q: Zerdede safran yerine ne kullanılır?
    a: 'En yaygın alternatif zerdeçal. Renk için bir tutam ile bir tatlı kaşığı arası yeterli; fazlası tadı acılaştırır.

      '
  - q: Zerde vegan mı?
    a: 'Evet, bu tarifte süt, yumurta ya da tereyağı yok. Pirinç ve mısır nişastasıyla koyulaştığı için aynı zamanda glutensiz.

      '
sufle:
  aramaBasligi: 'Sufle tarifi: İçi akan çikolatalı, 22 dakikada'
  intro: 'Türkiye''de sufle denince çoğu kişinin aklına gelen, dışı kek gibi pişmiş, kaşığı batırınca içinden sıcak çikolata akan bu tatlı; lava kek adıyla da biliniyor. Çırpılmış yumurta akıyla kabartılan klasik suflelerden farklı olarak sırrı kısa sürede ve yüksek ısıda pişmesinde.


    Bu tarifte bitter çikolata ve tereyağı benmaride eritiliyor, iki bütün yumurta ve iki yumurta sarısı şekerle çırpılıp yalnızca 2 yemek kaşığı unla bağlanıyor. Az un, ortanın akışkan kalmasını sağlıyor.


    Hazırlık 10, pişirme 12 dakika; toplam 22 dakikada 4 kişilik sufle hazır. Harcı önceden kalıplara koyup buzdolabında bekletebilir, tatlı zamanı geldiğinde fırına verebilirsin.

    '
  editorNote: 'Kalıpları yağlayıp kakao serpme adımını ayrı yazdık, çünkü sufle ters çevrildiğinde kalıba yapışırsa akışkan ortası daha tabağa oturmadan dağılır.

    '
  notes:
  - t: Süreyi tutturmak
    d: 'Suflede tek bir dakika fark yaratır. 200°C fırında 10-12 dakika aralığında kenarlar pişip sertleşir, orta ise hâlâ hafifçe titrer; tam bu noktada çıkarman gerekir. Fırınlar farklı ısıtır, bu yüzden ilk denemede 10. dakikada kontrol et. Ortası da kabarıp çatlamaya başladıysa iç kısım büyük ihtimalle katılaşmıştır. Kalıp boyutu da süreyi etkiler; küçük kalıplar daha çabuk pişer, büyük kalıplarda süre uzar. Fırını mutlaka önceden 200°C''ye ısıt; soğuk fırında kenarlar geç pişer ve orta da katılaşır.

      '
  - t: Ters çevirirken
    d: 'Fırından çıkan sufleyi kalıpta 1 dakika beklet. Bu kısa süre kenarların toparlanmasını sağlar; hemen çevirirsen kabuk yırtılabilir, çok beklersen içi pişmeye devam eder. Tabağı kalıbın üzerine kapatıp tek hamlede ters çevir, kalıbı yavaşça kaldır. Kalıpları tereyağıyla iyice yağlayıp kakao serpmek hem yapışmayı önler hem de un serpmenin bırakacağı beyaz izi engeller; koyu renkli sufle tabakta temiz görünür. Sufleyi ters çevirdikten sonra beklemeden servis et, sıcaklığı azaldıkça ortası da koyulaşır.

      '
  - t: Önceden hazırlık ve çikolata seçimi
    d: 'Misafir için en pratik yol harcı kalıplara doldurup buzdolabında bekletmek. Soğuk harçla pişirirken süreye 2 dakika ekle. Çikolata seçimi tadı doğrudan belirler: bitter çikolata yoğun ve dengeli bir tat verir, sütlü çikolata kullanırsan tatlılık belirgin biçimde artar. Kalıpları dörtte üçüne kadar doldurmak taşmayı önler. Sufleyi sıcak servis et; yanına dondurma koymak sıcak ve soğuk arasında hoş bir karşıtlık yaratır. Çikolatayı ve unu spatulayla katarak karıştırmak dokunun yoğun kalmasını sağlar.

      '
  faq:
  - q: Sufle kaç dakika pişer?
    a: '200°C fırında 10-12 dakika. Kenarları pişip ortası hâlâ yumuşak titrerken çıkarmalısın; daha uzun pişerse içi akmaz.

      '
  - q: Suflenin içi neden akmaz?
    a: 'En sık neden fazla pişirmek; bir dakikalık fark bile ortayı katılaştırır. Fırınından emin değilsen ilk denemede 10. dakikada kontrol et.

      '
  - q: Sufle önceden hazırlanır mı?
    a: 'Evet. Harcı kalıplara doldurup buzdolabında bekletebilir, servisten önce pişirebilirsin; soğuk harç için pişirme süresine 2 dakika ekle.

      '
  - q: Sufle kalıba neden yapışır?
    a: 'Kalıp yeterince yağlanmadığında ya da sufle fırından çıkar çıkmaz çevrildiğinde. Kalıpları tereyağıyla yağlayıp kakao serp ve çevirmeden önce 1 dakika beklet.

      '
tiramisu-toplari:
  aramaBasligi: 'Tiramisu topları tarifi: Pişirmeden, mascarponeli lokmalar'
  intro: 'Tiramisu, kahveye batırılmış bisküvi ile mascarpone kremasının kat kat dizilmesiyle yapılan bir İtalyan tatlısı. Bu tarif aynı tatları bir kaba dizmek yerine lokmalık toplara dönüştürüyor: kırıntı haline getirilen bisküvi, mascarpone, pudra şekeri ve soğuk espresso ile yoğrulup kakaoya bulanıyor.


    Fırın da ocak da gerekmiyor. Kedi dili ya da petibör bisküvi kullanabilirsin; hamurun kıvamını kahve miktarıyla ayarlıyorsun. İstersen her topun ortasına biraz rendelenmiş bitter çikolata saklayabilirsin.


    Hazırlık süresi 25 dakika, pişirme yok; tarif 20 top çıkarıyor. Toplar kakaoya bulandıktan sonra 30 dakika buzdolabında dinlenince şeklini tam alıyor, misafirden önce bu bekleme süresini de hesaba kat.

    '
  editorNote: 'Kahveyi tek seferde değil, kıvama göre artırılacak şekilde yazdık; kullandığın bisküviye göre kırıntının nem çekişi değişiyor ve fazla kahve hamuru yapışkan, şekil almaz hale getiriyor.

    '
  notes:
  - t: Hamurun kıvamı
    d: 'Doğru hamur avucunda sıkınca dağılmayan ama ele de yapışmayan bir kıvamda olmalı. Kuru ve çatlayan bir hamur görürsen bir kaşık daha kahve ekle; yapışıyorsa 10 dakika buzdolabında beklet, mascarpone soğuyunca hamur sıkılaşır. Bisküviyi robotta ince kırıntıya çekmek de önemli; iri parçalar kalırsa toplar pürüzlü olur ve yuvarlarken çatlar. Robot yoksa bisküviyi bir poşete koyup merdaneyle iyice ezebilirsin. Yuvarlarken ellerini hafifçe nemlendirmek hamurun avucuna yapışmasını azaltır.

      '
  - t: Mascarpone yerine
    d: 'Mascarpone yağlı ve hafif tatlı bir krem peynir; tiramisunun yumuşak tadı ondan gelir. Bulamazsan labne aynı kıvamı verir, tadı ise biraz daha ekşimsi olur. Daha hafif bir sonuç istersen yarı yarıya krem peynir ve çırpılmış krema karıştırabilirsin. Hangi peyniri kullanırsan kullan soğuk ve suyu süzülmüş olsun; sulu bir peynir hamuru yumuşatır ve toplar tabakta dik durmaz, yayılır. Labne kullanırsan pudra şekerini tadına bakarak biraz artırabilirsin.

      '
  - t: Saklama ve servis
    d: 'Toplar kapalı kapta buzdolabında 3 gün dayanır. Kakao zamanla nemi çekip koyulaşabilir; servis etmeden önce topları bir kez daha kakaoya bulayarak taze görünümlerini geri kazandırabilirsin. Küçük kâğıt kapsüllere koymak hem tutmayı kolaylaştırır hem de kakaonun parmaklara bulaşmasını azaltır. Kahvenin tadı bekledikçe hamura daha iyi oturduğu için topları bir gün önceden hazırlamak tadı bozmaz, misafir günü işini de hafifletir. Topları buzdolabından çıkarır çıkarmaz servis et; oda sıcaklığında uzun süre beklerlerse yumuşarlar.

      '
  faq:
  - q: Tiramisu topları için hangi bisküvi kullanılır?
    a: 'Kedi dili ya da petibör bisküvi kullanabilirsin. Pandispanya dilimleri de olur; hangisini seçersen seç robotta ince kırıntı haline getir.

      '
  - q: Tiramisu topları kaç gün dayanır?
    a: 'Kapalı bir kapta buzdolabında 3 gün dayanır. Servisten önce kakaoya yeniden bulamak görüntüsünü tazeler.

      '
  - q: Tiramisu toplarında mascarpone yerine ne kullanılır?
    a: 'Labne aynı kıvamı verir, tadı biraz daha ekşimsi olur. Daha hafif bir sonuç için yarı yarıya krem peynir ve çırpılmış krema da kullanılabilir.

      '
  - q: Tiramisu topları neden dağılır?
    a: 'Hamur fazla kuruysa toplar çatlayıp dağılır; bir kaşık daha kahve ekle. Hamur yapışıyorsa 10 dakika buzdolabında beklet, sonra şekil ver.

      '
new-york-cheesecake:
  aramaBasligi: 'New York cheesecake tarifi: Su banyosunda, kremamsı dolgulu'
  intro: 'New York cheesecake, adını aldığı şehirle özdeşleşmiş, krem peynirin bol kullanıldığı yoğun ve kremamsı bir fırın cheesecake. Hafif ve köpüklü versiyonlardan farkı, dolgunun ağır ve kadife dokulu olması; bisküvi tabanı da bu yoğunluğu dengeliyor.


    Bu tarifte 600 g krem peynir, krema, yumurta ve az miktarda unla hazırlanan dolgu, 24 cm kelepçeli kalıpta su banyosunda 160°C''de pişiyor. Limon kabuğu rendesi yoğun tadı ferahlatıyor, üzerine frambuaz ya da vişne sosu geliyor.


    Hazırlık 30, pişirme 70 dakika; toplam 100 dakikada 10 kişilik bir cheesecake. Asıl bekleme fırından sonra başlıyor: kapağı aralık fırında 1 saat yavaş soğuma ve bir gece buzdolabı. Bu yüzden servisten bir gün önce yapmak en rahatı.

    '
  editorNote: 'Yavaş soğutmayı ayrı bir adım olarak yazdık, çünkü cheesecake''in çatlamasının en yaygın nedeni fırından çıkar çıkmaz ani bir sıcaklık farkıyla karşılaşması.

    '
  notes:
  - t: Oda sıcaklığı ve hava
    d: 'Krem peynir, yumurta ve krema buzdolabından yeni çıkmışsa çırparken topaklanır ve pürüzsüz bir dolgu için daha uzun çırpman gerekir. Uzun ve hızlı çırpmak ise dolguya hava katar; bu hava fırında kabarıp soğurken söner ve yüzeyde çatlak bırakır. Malzemeleri pişirmeden önce bir süre tezgahta bekletip oda sıcaklığına getir, yumurtaları tek tek ekle ve mikseri düşük hızda çalıştır. Amaç kabarık değil, yoğun ve kadife bir doku.

      '
  - t: Su banyosu
    d: 'Kalıbı sıcak su dolu bir tepsiye koymak, dolgunun kenarlarının ortadan çok önce pişip kurumasını önler ve fırındaki nemi artırır. Kelepçeli kalıplar tam sızdırmaz olmadığı için dışını alüminyum folyoyla iyice sarmak şart; su içeri sızarsa bisküvi taban ıslanıp hamurlaşır. Kalıbı önce tepsiye yerleştirip suyu sonra dökmek daha kolay ve güvenlidir. Tabanı pişirmeden önce 10 dakika buzdolabında bekletmek de onun sıkı durmasını sağlar.

      '
  - t: Pişme noktası ve dilimleme
    d: 'Cheesecake''in piştiğini anlamak için kürdan kullanılmaz. 160°C''de 60-70 dakika sonunda kenarlar tutmuş, ortası ise kalıbı hafifçe salladığında jöle gibi titriyor olmalı. Bu titrek orta, fırında yavaş soğuma ve buzdolabında geçen gece boyunca sertleşir. Ortası tamamen sertleşene kadar pişirirsen dolgu kuru ve tanecikli olur, üstü de çatlar. Dilimlerken bıçağı sıcak suya batırıp kurularsan temiz kesimler elde edersin. Meyve sosunu dilimlerin üzerine servis anında dök; önceden dökülen sos yüzeyi ıslatıp dilimlemeyi zorlaştırır.

      '
  faq:
  - q: New York cheesecake kaç dakika pişer?
    a: '160°C''de su banyosunda 60-70 dakika. Ardından fırın kapalı, kapağı aralık şekilde 1 saat bekler, sonra bir gece buzdolabında dinlenir.

      '
  - q: Cheesecake neden çatlar?
    a: 'Dolguyu hızlı çırpıp hava katmak, fazla pişirmek ve ani sıcaklık değişimi en yaygın nedenler. Düşük hızda karıştırmak, su banyosu ve fırında yavaş soğutma çatlamayı önler.

      '
  - q: Cheesecake'te krem peynir yerine ne kullanılır?
    a: 'Labne birebir olur. Krem peynirin yarısı yerine süzme yoğurt da kullanabilirsin; doku biraz daha hafif çıkar.

      '
  - q: Cheesecake aynı gün yenir mi?
    a: 'Önerilmez; dolgu ancak bir gece buzdolabında beklediğinde tam sertleşir ve düzgün dilimlenir. Bu yüzden servisten bir gün önce pişirmek gerekir.

      '
creme-brulee:
  aramaBasligi: 'Crème brûlée tarifi: Vanilyalı krema, çıtır karamel kabuk'
  intro: 'Crème brûlée, Fransız mutfağının bilinen tatlılarından biri: vanilyalı, ipeksi bir yumurta kreması ve üzerinde kaşıkla kırılan ince bir karamel kabuk. Adı Fransızcada yanık krema anlamına geliyor ve bu ad doğrudan tarifin son adımını anlatıyor.


    Bu tarif yalnızca beş malzemeyle hazırlanıyor: krema, yumurta sarısı, toz şeker, vanilya ve üzeri için esmer şeker. Karışım su banyosunda 150°C gibi düşük bir ısıda pişirildiği için kesilmeden, pürüzsüz bir kıvam alıyor. Un ya da nişasta içermediği için de glutensiz.


    Hazırlık 15, pişirme 40 dakika; toplam 55 dakikada 4 kişilik. Bunun üzerine en az 4 saatlik buzdolabı beklemesi geliyor; bir gün önceden hazırlayıp şekeri servisten hemen önce yakmak en pratik yol.

    '
  editorNote: 'Karışımı kaplara paylaştırmadan önce süzmeyi pişirme adımına özellikle ekledik; bu, pıhtılaşmış yumurta parçacıklarını ve köpüğü ayırarak kremanın yüzeyinin düz ve ipeksi çıkmasını sağlıyor.

    '
  notes:
  - t: Kremayı yumurtaya alıştırmak
    d: 'Sıcak kremayı yumurta sarılarına bir anda dökersen sarılar pişip topaklanır. Bu yüzden kremayı ince bir akıntı halinde, sürekli karıştırarak ekliyorsun; böylece yumurtanın sıcaklığı yavaş yavaş yükselir. Kremayı ısıtırken kaynatma, kenarlarında küçük kabarcıklar belirmesi yeterli. Bu aşamada hızlı çırpmak yerine nazikçe karıştırmak da önemli; fazla köpük pişince yüzeyde kabarcıklı bir tabaka bırakır ve karamel kabuk düzgün oturmaz. Vanilya çubuğu kullanıyorsan çubuğu ikiye yarıp tohumlarını kremaya kazı, çubuğu da ısıtırken içinde bırak.

      '
  - t: Pişme kıvamı
    d: '150°C fırında 35-40 dakika sonunda kremanın kenarları tutmuş, ortası ise kabı hafifçe salladığında titrek olmalı. Tamamen sertleşene kadar pişirirsen soğuduğunda dokusu ipeksi değil süngerimsi olur. Kapları sıcak su olan bir tepsiye dizmek ısının yumuşak ve eşit dağılmasını sağlar, kremanın kesilmesini önler. Pişen kremaları sudan çıkarıp ılımaya bırak, ardından buzdolabına kaldır ve en az 4 saat beklet. Sığ ve geniş kaplar kremanın eşit pişmesine yardım eder, derin kaplarda süre uzar.

      '
  - t: Şekeri yakmak
    d: 'Esmer şekeri ince ve eşit bir tabaka halinde serp; kalın yerler yanmadan erimez, ince yerler çabuk yanar. Mutfak şalumosu en kontrollü sonucu verir. Şalumo yoksa fırının ızgarasını çalıştırıp kapları üst rafa koy ve hiç ayrılmadan izle; şeker birkaç saniyede karamelden yanığa geçebilir. Yaktıktan sonra birkaç dakika beklet ki kabuk sertleşip çıtırlaşsın. Kabuk buzdolabında nem çekip yumuşadığı için şekeri servisten hemen önce yak.

      '
  faq:
  - q: Crème brûlée kaç derecede pişer?
    a: '150°C fırında, sıcak su banyosunda 35-40 dakika. Kenarları tutup ortası hafif titrek olduğunda çıkarılır.

      '
  - q: Şalumo olmadan crème brûlée nasıl yapılır?
    a: 'Fırının ızgara özelliğini kullanabilirsin. Esmer şekeri serpip kapları üst rafa koy ve şeker karamelize olana kadar başından ayrılmadan izle.

      '
  - q: Crème brûlée neden kesilir?
    a: 'Sıcak krema yumurtaya hızlı eklendiğinde ya da karışım yüksek ısıda piştiğinde kesilir. Kremayı yavaş yavaş ekle ve su banyosunda 150°C''de pişir.

      '
  - q: Crème brûlée önceden hazırlanır mı?
    a: 'Evet, hatta hazırlanması gerekir; pişen kremalar buzdolabında en az 4 saat beklemeli. Yalnızca şekeri yakma işini servisten hemen önceye bırak.

      '
ekler:
  aramaBasligi: 'Ekler tarifi: Choux hamuru, pastacı kreması ve çikolata sos'
  intro: 'Ekler, Fransız pastacılığından gelen ve Türkiye''de pastane vitrinlerinin klasiği olan uzun, içi kremalı bir hamur tatlısı. Temeli choux hamuru: ocakta pişirilip yumurtayla açılan, fırında buharla kabarıp içi boş kalan bir hamur. Profiterol de aynı hamurdan yapıldığı için bu tekniği bir kez öğrenmek birçok tatlının kapısını açıyor.


    Tarif üç parçadan oluşuyor: 4 yumurtalı choux hamuru, vanilyalı pastacı kreması ve bitter çikolatayla sıvı kremadan yapılan parlak sos. Hamur 200°C''de başlayıp 180°C''de pişmesini tamamlıyor.


    Hazırlık 40, pişirme 30 dakika; toplam 70 dakikada 16 ekler çıkıyor. Zorluk seviyesi yüksek görünse de kritik noktalar belli: hamuru tencerede yeterince kurutmak, yumurtaları tek tek eklemek ve fırın kapağını açmamak.

    '
  editorNote: 'Hamuru tencerede pişirme ve yumurta yedirme adımlarını ayrı ayrı yazdık; ekler tarifinde hataların çoğu bu iki aşamada oluyor ve her birinin kendine ait bir kıvam işareti var.

    '
  notes:
  - t: Hamuru kurutmak ve yumurta
    d: 'Un eklendikten sonra hamuru 2 dakika karıştırmak gereksiz gibi görünür ama asıl iş budur: fazla su buharlaşır ve tencerenin dibinde ince bir zar oluşur. Kuru bir hamur fırında daha iyi kabarır ve içi boş kalır. Ardından hamuru 5 dakika ılıt; çok sıcak hamura eklenen yumurta pişer. Yumurtaları tek tek yedir ve kıvamı izle: kaşıktan V şeklinde düşen parlak bir hamur hedef. Yumurtalar iriyse sonuncusunun tamamına gerek kalmayabilir.

      '
  - t: Fırın kapağını açmamak
    d: 'Choux hamuru, içindeki suyun buhara dönüşmesiyle kabarır. İlk 15 dakika 200°C''de bu buhar hamuru şişirir, sonraki 15 dakika 180°C''de kabuk sertleşip kurur. Bu sürede fırın kapağını açarsan içeri giren soğuk hava ve kaçan buhar yüzünden ekler söner ve bir daha kabarmaz. Rengi koyu altın sarısı olana kadar sabret; soluk renkte çıkarılan ekler soğuyunca yumuşar ve çöker. Pişen eklerlerin yanını kürdanla delmek içerdeki buharın çıkmasını ve kabuğun kuru kalmasını sağlar.

      '
  - t: Doldurma ve saklama
    d: 'Pastacı kremasını tamamen soğumadan doldurursan kabuk yumuşar. Kremayı streç filmi yüzeyine değecek şekilde kapatıp soğutmak kabuk bağlamasını önler. Doldurmak için eklerlerin altına ince bir uçla delik açıp kremayı torbayla sık. Çikolata sosu için bitter çikolatayı sıcak kremayla eritip eklerlerin üstünü sosa batır. Doldurulmuş ekler aynı gün yenmeli; boş kabuklar kapalı kutuda 2 gün dayandığı için kabukları önceden pişirip servis günü doldurabilirsin.

      '
  faq:
  - q: Ekler neden söner?
    a: 'En sık nedenler fırın kapağını erken açmak, hamuru tencerede yeterince kurutmamak ve az pişirmek. Ekler koyu altın rengini alana kadar fırını açma.

      '
  - q: Ekler hamuru kaç dakika pişer?
    a: 'Önce 200°C''de 15 dakika, ardından 180°C''de 15 dakika daha; toplam 30 dakika.

      '
  - q: Ekler kreması nasıl yapılır?
    a: 'Süt, şeker, un, mısır nişastası, yumurta sarısı ve vanilin koyulaşana kadar yaklaşık 10 dakika pişirilir. Ocaktan alınınca tereyağı eklenir ve yüzeyine streç film değdirilerek soğutulur.

      '
  - q: Ekler önceden yapılır mı?
    a: 'Boş kabuklar kapalı kutuda 2 gün dayanır, bu yüzden önceden pişirilebilir. Doldurulmuş ekler ise aynı gün yenmeli.

      '
mermer-kek:
  aramaBasligi: 'Mermer kek tarifi: Kakaolu desenli, su bardağı ölçülü'
  intro: 'Mermer kek, sade ve kakaolu iki hamurun aynı kalıpta dalgalanarak birleştiği, kesildiğinde mermer desenini andıran klasik bir çay saati keki. Her dilimde desenin farklı çıkması onu sade bir kekten biraz daha özel kılıyor.


    Bu tarifte tek bir hamur hazırlanıp üçte biri ayrılıyor ve içine kakao ile 2 kaşık süt ekleniyor. Bu fazladan süt iki hamurun kıvamını eşitliyor; böylece kakaolu hamur ağır kalıp dibe çökmüyor ve desen belirgin oluyor. Ölçüler su bardağıyla, yağ olarak ayçiçek yağı kullanılıyor.


    Hazırlık 15, pişirme 45 dakika; toplam bir saatte 10 kişilik bir baton kek hazır. Fırından sonra kalıpta 10 dakika dinlendirip tamamen soğuyunca dilimlemek deseni temiz gösterir.

    '
  editorNote: 'Kakaolu hamura 2 kaşık süt eklemeyi ayrıca belirttik, çünkü kakao hamuru koyulaştırır ve iki hamur farklı kıvamda olunca zikzak çizildiğinde desen yerine bulanık bir karışım oluşur.

    '
  notes:
  - t: Deseni oluşturmak
    d: 'Hamurları kat kat dökmek ve bıçakla 3-4 kez zikzak çizmek deseni oluşturmak için yeterli. Daha fazla karıştırırsan iki renk birbirine geçer ve kek tek tip açık kahverengiye döner. Bıçağı kalıbın dibine kadar batırıp uzun kenar boyunca tek hamlede zikzak çiz, sonra bırak. Daha belirgin ve düzensiz bir desen istersen sade ve kakaolu hamuru kaşık kaşık, sırayla dökmeyi de deneyebilirsin. Kalıbı yağladıktan sonra hafifçe unlarsan kek kalıptan daha temiz çıkar.

      '
  - t: Fırın kapağı ve pişme kontrolü
    d: '170°C fırında 40-45 dakika pişen kekin ilk 30 dakikasında fırın kapağını açma; içeri dolan soğuk hava kabarmayı keser ve kek ortadan söner. Pişip pişmediğini anlamak için kekin en kalın yerine kürdan batır, kuru çıkıyorsa hazırdır. Üstü erken kızarıyorsa üzerini folyoyla gevşekçe örtebilirsin; bu, içinin pişmesini engellemeden rengini korur. Baton kalıp derin olduğu için orta kısmın pişmesi kenarlardan daha uzun sürer.

      '
  - t: Yumurta ve şekeri çırpmak
    d: 'Tarifin ilk adımındaki 5 dakikalık çırpma, kekin kabarıklığının temelidir. Yumurta ve şeker rengi açılıp hacmi artana kadar çırpıldığında hamura hava hapsolur. Unu ekledikten sonra ise uzun süre çırpma; fazla karıştırılan hamurdan çıkan kek sertleşir ve içinde tüneller oluşur. Un, kabartma tozu ve vanilini eleyerek eklemek de topak kalmasını önler. Yumurtaların oda sıcaklığında olması çırpmayı kolaylaştırır. Kabartma tozunu en son, unla birlikte eklemek de kabarma gücünün fırına kadar korunmasını sağlar.

      '
  faq:
  - q: Mermer kek kaç dakika pişer?
    a: '170°C fırında 40-45 dakika. Kekin ortasına batırdığın kürdan kuru çıktığında pişmiştir.

      '
  - q: Mermer kekte desen neden belli olmaz?
    a: 'Genellikle zikzağı fazla yapmaktan ya da iki hamurun kıvamı farklı olduğundan. Kakaolu hamura 2 kaşık süt ekle ve bıçakla yalnızca 3-4 kez zikzak çiz.

      '
  - q: Mermer kek neden söner?
    a: 'En sık neden fırın kapağını erken açmak. İlk 30 dakika kapağı açma ve keki kürdan kuru çıkana kadar pişir.

      '
  - q: Mermer kekte süt yerine ne kullanılır?
    a: 'Laktozsuz süt birebir olur. Vegan bir seçenek için yulaf ya da badem sütü de kullanabilirsin.

      '
kakaolu-kek:
  aramaBasligi: 'Kakaolu kek tarifi: Yumuşacık, su bardağı ölçüsüyle'
  intro: 'Kakaolu kek, Türkiye''de neredeyse her evde pişen, ölçüleri su bardağıyla verilen pratik bir çay saati keki. Özel bir malzeme ya da ekipman gerektirmiyor; yumurta, şeker, süt, sıvı yağ, un ve kakao dolapta varsa kek de hazır demek.


    Bu tarifte yumurta ve şeker 5 dakika çırpılarak hamura hava katılıyor, sonra süt ve sıvı yağ ekleniyor. Un, 3 yemek kaşığı kakao ve kabartma tozu eleyerek ekleniyor ve spatulayla topaksız karıştırılıyor. Elemek hem kakao topaklarını açıyor hem de keki hafifletiyor.


    Hazırlık 15, pişirme 40 dakika; toplam 55 dakikada 10 kişilik bir kek. İstersen hamurun yarısını kakaosuz bırakıp kalıba sırayla dökerek iki renkli bir kek de yapabilirsin.

    '
  editorNote: 'Kuru malzemeleri eklerken mikser yerine spatula önerdik, çünkü un eklendikten sonra hızlı çırpmak glüteni geliştirir ve kekin yumuşak yerine sıkı ve kuru çıkmasına yol açar.

    '
  notes:
  - t: Kekin yumuşak olması
    d: 'Yumuşak bir kakaolu kekin iki koşulu var: yumurtanın iyice çırpılması ve unun az karıştırılması. Yumurta ve şeker 5 dakika boyunca rengi açılıp köpürene kadar çırpılmalı; bu adımı kısaltırsan kek az kabarır. Un eklendikten sonra ise spatulayla, yalnızca topaklar kaybolana kadar karıştır. Fazla pişirmek de kuruluğa yol açar; 40. dakikada kürdan temiz çıkıyorsa keki hemen fırından al, beklemesine izin verme. Kalıbı ağzına kadar doldurma; kek kabarırken taşar ve ortası çöker.

      '
  - t: Kakaonun etkisi
    d: 'Kakao undan daha fazla sıvı çeker; bu yüzden kakao miktarını artırmak hamuru koyulaştırır ve keki kurutabilir. Tarifteki 3 yemek kaşığı, 2,5 su bardağı unla dengeli bir oran. Daha koyu bir tat istersen kakaoyu biraz artırıp unu aynı miktarda azaltabilirsin. Kakaoyu mutlaka unla birlikte ele; kakao kolay topaklanır ve elenmezse kekin içinde kuru, acımsı lekeler kalır. Kakaonun şekersiz olduğundan emin ol; şekerli kakaolu içecek tozları hem tadı hem kıvamı değiştirir.

      '
  - t: Kalıptan çıkarma ve saklama
    d: 'Fırından çıkan keki kalıpta 10 dakika beklet. Sıcakken hemen çevirirsen kek kırılabilir, çok uzun beklersen kalıbın içinde terleyip yapışır. 10 dakika sonra ters çevirip tel ızgara üzerinde tamamen soğut. Soğuyan keki streç filme sararak ya da kapalı bir kapta oda sıcaklığında saklarsan kurumadan birkaç gün yumuşak kalır. İlk 25 dakika fırın kapağını açmamak da kekin çökmeden kabarık kalmasının şartı. Tamamen soğumadan dilimlersen kek ezilir ve dilimler dağılır.

      '
  faq:
  - q: Kakaolu kek kaç dakika pişer?
    a: 'Önceden ısıtılmış 170°C fırında yaklaşık 40 dakika. Kürdan temiz çıktığında kek pişmiştir.

      '
  - q: Kakaolu kek neden çöker?
    a: 'Çoğunlukla fırın kapağı erken açıldığı için. İlk 25 dakika kapağı açma; kek tam pişmeden çıkarılırsa da soğurken çöker.

      '
  - q: Kakaolu kek nasıl yumuşak olur?
    a: 'Yumurta ve şekeri 5 dakika iyice çırp, unu ekledikten sonra spatulayla az karıştır ve keki fazla pişirme.

      '
  - q: Kakaolu kekte kabartma tozu yerine ne kullanılır?
    a: '1 paket kabartma tozu yerine 1 tatlı kaşığı karbonat ve 1 yemek kaşığı sirke ya da limon suyu kullanabilirsin.

      '
limonlu-kek:
  aramaBasligi: 'Limonlu kek tarifi: Yoğurtlu, limon sırlı ve nemli'
  intro: 'Limonlu kek, hem limon kabuğu rendesi hem limon suyuyla kokulandırılan ferah bir kek. Bu tarifte hamura yoğurt da giriyor; yoğurt kekin içini nemli ve yumuşak tutuyor, limonun ekşiliğiyle de iyi bir uyum kuruyor.


    İki limonun kabuk rendesi ve yarım su bardağı limon suyu doğrudan hamura ekleniyor. Kek ılıyınca üzerine 1 su bardağı pudra şekeri ile 3 yemek kaşığı limon suyundan hazırlanan bir sır dökülüyor; sır katılaştığında kekin üzerinde ince, hafif ekşi bir kabuk bırakıyor.


    Hazırlık 15, pişirme 40 dakika; toplam 55 dakikada 10 kişilik bir baton kek. Sırın katılaşmasını beklemen gerektiği için dilimlemeden önce biraz zaman ayır.

    '
  editorNote: 'Sırı kek ılıdıktan sonra dökmeyi ayrı bir adım yaptık; kek çok sıcakken dökülen sır eriyip tamamen içine çekilir ve yüzeyde o ince şekerli kabuk oluşmaz.

    '
  notes:
  - t: Kabuğu doğru rendelemek
    d: 'Limonun aroması büyük ölçüde kabuğundaki yağlardan gelir. Rendeyi yalnızca sarı kısımda gezdir; altındaki beyaz zar acıdır ve keke istenmeyen bir tat verir. İnce rendenin küçük gözünü kullanmak kabuğun hamurda eşit dağılmasını sağlar. Rendelemeden önce limonları iyice yıka ve kurula. Kabuğu, çırpmaya başlamadan önce şekerle birlikte parmaklarınla ovarsan şeker kabuğun yağını çeker ve koku hamura daha iyi yayılır. Kabuğu rendeledikten sonra limonları sıkarak hamura gereken suyu da aynı meyvelerden alabilirsin.

      '
  - t: Yoğurt ve limon suyu
    d: 'Hamurdaki yoğurt keki nemli ve yumuşak tutar; limon suyuyla birlikte hamurun sıvısını oluşturur. Yoğurt yerine kefir ya da ayran kullanabilirsin, sonuç benzer olur. Vegan bir seçenek için soya ya da hindistan cevizi yoğurdu da olur. Limon suyunu ekledikten sonra hamurun hafifçe kesilmiş gibi görünmesi normaldir, un eklenince toparlanır. Taze sıkılmış limon suyu kullan; hazır limon sosları aynı aromayı vermez. Yoğurdun oda sıcaklığında olması hamurun daha homojen karışmasını sağlar.

      '
  - t: Sırın kıvamı
    d: 'Sır için pudra şekerine limon suyunu kaşık kaşık ekleyerek karıştır. Kıvam akışkan ama kaşıktan şerit gibi düşecek yoğunlukta olmalı; çok sulu sır kekin içine çekilip kaybolur, çok koyu sır yüzeye yayılmaz. Sırı kek ılıyınca dök ve tamamen katılaşmasını bekle, sonra dilimle; erken kesersen sır bıçağa yapışır ve dilimlerden akar. Pudra şekerin yoksa toz şekeri blenderda 1 dakika çekerek hazırlayabilirsin. Sırın üzerine biraz limon kabuğu rendesi serpmek hem görüntüyü hem kokuyu güzelleştirir.

      '
  faq:
  - q: Limonlu kek kaç dakika pişer?
    a: 'Yağlanmış baton kalıpta, 170°C fırında yaklaşık 40 dakika.

      '
  - q: Limonlu kek neden acı olur?
    a: 'Kabuk rendelenirken limonun beyaz kısmı da hamura karıştığında. Rendeyi yalnızca sarı kabukta gezdir.

      '
  - q: Limonlu kek sosu nasıl yapılır?
    a: '1 su bardağı pudra şekeriyle 3 yemek kaşığı limon suyunu karıştır ve kek ılıyınca üzerine dök. Sır katılaştıktan sonra dilimle.

      '
  - q: Limonlu kekte yoğurt yerine ne kullanılır?
    a: 'Kefir ya da ayran kullanabilirsin. Vegan bir seçenek için soya ya da hindistan cevizi yoğurdu olur.

      '
