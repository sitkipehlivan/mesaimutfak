atom:
  aramaBasligi: 'Atom meze tarifi: Kızgın tereyağı ve kuru acı biberle'
  intro: 'Atom, süzme yoğurdun üzerine kızgın tereyağında çevrilmiş kuru acı biberin döküldüğü, acı sevenlerin meze tabağı. Meyhane sofralarında sık görülür; az malzemeyle yapılır ama tadı oldukça iddialıdır.


    Bu tarifte sarımsak ve tuzla çırpılan süzme yoğurt tabağa yayılıyor, ortası kaşıkla çukurlaştırılıyor. Kuru biberler tereyağında yalnızca 30 saniye, kararmadan kızartılıyor ve tereyağıyla birlikte o çukura dökülüyor. Böylece her kaşıkta hem serin yoğurt hem de acılı, kokulu yağ geliyor.


    4 kişilik tarif toplam 8 dakikada hazır: 5 dakika hazırlık, 3 dakika pişirme. Acı seviyesini biber türüyle kendine göre ayarlayabilirsin. Kuru biber bulamazsan 1 yemek kaşığı pul biberle de yapabilirsin.

    '
  editorNote: 'Biberi kızartma adımını ayrı yazdık ve süresini 30 saniyeyle sınırladık, çünkü bu mezenin tadını en çok bozan şey kararıp acılaşmış biber.

    '
  notes:
  - t: Biberi yakmadan kızartmak
    d: 'Kuru biber çok ince olduğu için kızgın yağda saniyeler içinde rengi koyulaşır. Tereyağı eriyip köpürmeye başladığında biberleri at, 30 saniye çevir ve ocaktan al. Biber kararırsa hem acılaşır hem de yanık kokusu yoğurda geçer; böyle olursa yağı dökmek ve yeniden başlamak daha iyi sonuç verir. Pul biber kullanıyorsan dikkatli ol, çünkü pul biber yağa değdiği anda renk verir. Tavayı ocaktan alıp pul biberi sonra eklemek güvenli bir yol.

      '
  - t: Yoğurdun kıvamı
    d: 'Atomda süzme yoğurt kullanmamızın nedeni, üzerine dökülen kızgın tereyağının yoğurdu sulandırmaması. Normal yoğurt kullanırsan tabakta su salar ve yağ yüzeyde dağılır. Evde süzme yoğurdun yoksa normal yoğurdu tülbentte 2 saat süzerek kendin hazırlayabilir ya da labne kullanabilirsin. Sarımsağı ezip yoğurtla iyice çırpmak, tadın her kaşıkta eşit dağılmasını sağlar. Yoğurdu tabağa yaydıktan sonra ortasını çukurlaştırmak ise tereyağının kenarlara akmadan bir havuz gibi toplanmasına yardım eder.

      '
  - t: Acıyı ayarlamak ve servis
    d: 'Mezenin acısı tamamen kullandığın biberin türüne bağlı. Daha yumuşak bir tat istiyorsan kuru biberlerin bir kısmını pul biberle değiştirebilir ya da çekirdeklerini ayıklayabilirsin. Atom en iyi, tereyağı henüz sıcakken servis edilir; yağın cızırtısı geçmeden masaya gelmesi gerekir. Yanına kızarmış ekmek, lavaş ya da çiğ sebze iyi gider. Artanı buzdolabında kapalı kapta saklayabilirsin ama tereyağı soğuyunca donacağı için tazesi kadar keyifli olmaz.

      '
  faq:
  - q: Atom mezesi nasıl yapılır?
    a: Süzme yoğurdu sarımsak ve tuzla çırpıp tabağa yay, ortasını çukurlaştır. 2 yemek kaşığı tereyağında 4 kuru acı biberi 30 saniye kızartıp yoğurdun ortasına dök.
  - q: Atomda kuru biber yerine ne kullanılır?
    a: 1 yemek kaşığı pul biber kullanabilirsin. Pul biber daha çabuk renk verdiği için tereyağı köpürünce hemen ocaktan al.
  - q: Atom için süzme yoğurt yerine ne kullanılır?
    a: Labne ya da tülbentte 2 saat süzülmüş normal yoğurt kullanabilirsin. Süzülmemiş yoğurt su salar ve meze dağılır.
  - q: Atom kaç dakikada hazırlanır?
    a: 'Toplam 8 dakika: 5 dakika hazırlık, 3 dakika pişirme. Biberler tereyağında yalnızca 30 saniye kızarır.'
avokadolu-yumurtali-tost:
  aramaBasligi: 'Avokadolu yumurtalı tost tarifi: Poşe yumurtayla 11 dakikada'
  intro: 'Avokadolu yumurtalı tost, kızarmış ekmeğin üzerine ezilmiş avokado ve yumurta konan, kafelerin kahvaltı menülerinden evlere geçmiş bir tabak. Hazırlığı kısa, doyurucu ve hafif olduğu için iş günü sabahlarına uygun.


    Bu tarifte ekşi maya ya da tam buğday ekmeği kızartılıyor, avokado limon suyu ve tuzla çatalla eziliyor. Yumurta, sirkeli kaynar suda 3 dakika pişirilen poşe yumurta olarak hazırlanıyor; sarısı akışkan kaldığı için avokadoya sos gibi karışıyor. Üzerine serpilen pul biber tabağın tek baharatı.


    2 kişilik tarif toplam 11 dakikada hazır: 5 dakika hazırlık, 6 dakika pişirme. Poşe yumurta sana zor gelirse göz yumurta da aynı keyifle gider.

    '
  editorNote: 'Poşe yumurtayı ayrı bir adım olarak, süresiyle birlikte yazdık; çünkü bu tostta avokadoyla birleşen asıl sosu, akışkan kalan yumurta sarısı oluşturuyor.

    '
  notes:
  - t: Poşe yumurtanın püf noktası
    d: 'Sirke, yumurta akının suya değdiği anda daha hızlı pıhtılaşmasına yardım eder; bu yüzden ak dağılmadan sarının etrafında toplanır. Suyu kaşıkla girdap gibi karıştırıp yumurtayı tam ortaya bırakmak, akın merkeze sarılmasını sağlar. Yumurtayı önce küçük bir kâseye kırıp oradan suya kaydırmak işini kolaylaştırır. Su çok sert kaynamamalı; fazla hareketli su akı parçalar. 3 dakika sonunda delikli kaşıkla alıp kâğıt havluda suyunu süzdürmek ekmeğin ıslanmasını önler.

      '
  - t: Avokadonun olgunluğu
    d: 'Avokado olgun değilse çatalla ezilmez, sert ve tatsız kalır. Olgun avokado elle hafifçe bastırıldığında biraz yumuşar ama içi göçmez. Limon suyu hem tadı dengeler hem de ezilmiş avokadonun kısa sürede kararmasını yavaşlatır. Avokadoyu tamamen pürüzsüz yapmak yerine biraz iri bırakmak tosta daha iyi bir doku verir. Limonun yoksa misket limonu ya da yarı ölçü elma sirkesi kullanabilirsin; sirke kullanırsan tadına bakarak azar azar ekle.

      '
  - t: Ekmek seçimi ve servis
    d: 'Ekşi maya ya da tam buğday ekmeği, avokadonun ağırlığını taşıyacak kadar sıkı bir dokuya sahip. Yumuşak tost ekmeği kullanırsan avokado ve yumurta sarısıyla birlikte çabuk hamurlaşır; ekmeği iyice kızartmak bu yüzden önemli. Tost hazırlandıktan sonra hemen yenmeli, çünkü bekledikçe ekmek nem çeker ve çıtırlığını kaybeder. Üzerine beyaz peynir, domates ya da çörek otu ekleyerek tabağı çeşitlendirebilirsin. Avokadoyu ezip hazır tutarsan yumurta pişerken tostu birleştirmek bir dakikanı alır.

      '
  faq:
  - q: Poşe yumurta kaç dakika pişer?
    a: 3 dakika. Sirkeli kaynar suyu girdap gibi karıştırıp yumurtayı ortasına bırak, süre dolunca delikli kaşıkla al.
  - q: Avokadolu tost için hangi ekmek kullanılır?
    a: Ekşi maya ya da tam buğday ekmeği. Sıkı dokulu ekmek kızartıldığında avokado ve yumurtanın altında hamurlaşmaz.
  - q: Poşe yumurtada sirke yerine ne kullanılır?
    a: Yarım ölçü limon suyu kullanabilirsin. Sirke ya da limon, akın suda dağılmadan toplanmasına yardım eder.
  - q: Ezilmiş avokado nasıl kararmaz?
    a: Avokadoyu limon suyuyla ezmek kararmayı yavaşlatır. Yine de en iyisi tostu hazırladıktan hemen sonra servis etmek.
ayran-asi-corbasi:
  aramaBasligi: 'Ayran aşı çorbası tarifi: Buğdaylı, nohutlu soğuk yaz çorbası'
  intro: 'Ayran aşı, yoğurdun soğuk suyla açılıp haşlanmış buğday, nohut ve yeşilliklerle buluştuğu, soğuk servis edilen bir yaz çorbası. İç Anadolu''da, özellikle Yozgat ve Çorum çevresinde bilinen bu çorba, sıcak günlerde hem doyurucu hem ferah bir öğün sunar.


    Bu tarifte aşurelik buğday ya da iri bulgur yumuşayana kadar haşlanıp soğutuluyor. Yoğurt ayran kıvamında açılıyor; buğday, nohut, küp doğranmış salatalık, dereotu, maydanoz ve kuru naneyle karıştırılıyor. En az 1 saat buzdolabında beklemesi, tatların birbirine geçmesi için gerekli.


    6 kişilik tarifin hazırlığı 20 dakika, pişirmesi 40 dakika; toplam 60 dakika, buna buzdolabında bekleme süresi ekleniyor. Hazır haşlanmış buğday kullanırsan hazırlık on dakikaya iner.

    '
  editorNote: 'Buğdayı haşlayıp soğutmayı, yoğurtla birleştirmeden önceki ayrı bir adım olarak yazdık; sıcak buğday yoğurda karışırsa çorba ılır ve bu çorbadan beklenen serinlik kaybolur.

    '
  notes:
  - t: Buğday mı bulgur mu
    d: 'Aşurelik buğday daha iri ve dişe gelen bir doku verir ama yumuşaması zaman alır; tarifteki 40 dakikalık haşlama süresi buğday içindir. İri bulgur daha çabuk yumuşar, bu yüzden haşlarken sık sık kontrol etmen gerekir. Hangisini kullanırsan kullan, haşladıktan sonra süzüp tamamen soğutmak önemli. Sıcak tahıl yoğurda karışırsa çorba ılır ve beklenen serinliği vermez. Hazır haşlanmış buğday bulursan bu adımı tamamen atlayabilirsin.

      '
  - t: Yoğurdu açarken
    d: 'Yoğurdu soğuk suyla açarken önce yoğurdu tek başına pürüzsüz olana kadar çırp, suyu sonra azar azar ekle. Suyu bir kerede dökersen yoğurt topak topak kalır. Hedef kıvam içilebilir bir ayran; ne çok koyu ne de sulu. Tuzu bu aşamada ekleyip tadına bak, çünkü buğday ve nohut da tuz ister. Çorba buzdolabında bekledikçe tahıllar suyu biraz çeker ve koyulaşır; servis öncesi gerekirse bir miktar soğuk su ekleyebilirsin.

      '
  - t: Saklama ve servis
    d: 'Ayran aşı, buzdolabında bekledikçe yeşilliklerin ve nanenin aroması yoğurda geçtiği için ertesi gün daha lezzetli olur; kapalı bir kapta saklayabilirsin. Servis ederken kâselere buz küpü eklemek çorbayı uzun süre serin tutar. Dereotu bulamazsan maydanoz ve biraz taze naneyle devam edebilirsin. Nohudu kuru alıyorsan önceden ıslatıp haşlaman gerekir; konserve haşlanmış nohut bu adımı ortadan kaldırır. Salatalığı servis gününde doğramak çıtırlığını korur.

      '
  faq:
  - q: Ayran aşı çorbası sıcak mı soğuk mu içilir?
    a: Soğuk içilir. En az 1 saat buzdolabında bekletilir ve buz küpüyle servis edilir.
  - q: Ayran aşı için buğday kaç dakika haşlanır?
    a: Aşurelik buğday yaklaşık 40 dakikada yumuşar. İri bulgur daha çabuk piştiği için erken kontrol et.
  - q: Ayran aşında dövme buğday yerine ne kullanılır?
    a: Aşurelik buğday ya da iri bulgur kullanabilirsin; ıslatmaya gerek yok. Hazır haşlanmış buğday hazırlığı on dakikaya indirir.
  - q: Ayran aşı çorbası bir gün bekletilir mi?
    a: Evet, kapalı kapta buzdolabında bekletilebilir. Bir gün sonra tatlar birbirine geçtiği için daha lezzetli olur.
beyran:
  aramaBasligi: 'Beyran çorbası tarifi: Kuzu etli, sarımsaklı Antep usulü'
  intro: 'Beyran, Gaziantep''te sabahları içilen; kuzu eti, pirinç, bol sarımsak ve acılı tereyağıyla hazırlanan yoğun bir çorba. Antep''te bakır kâselerde, ateşte kaynatılarak servis edilir ve güne başlamanın en doyurucu yollarından biri sayılır.


    Bu tarifte kemikli kuzu gerdan ya da kol, köpüğü alınarak et kemikten ayrılana kadar yaklaşık 2 saat haşlanıyor. Et didikleniyor, pirinç ayrı tencerede az suyla pişiriliyor. Her kâseye pirinç, et ve ezilmiş sarımsak konuyor, üzerine fokur fokur kaynayan et suyu dökülüyor; en son pul biberle kızdırılmış tereyağı gezdiriliyor.


    4 kişilik tarifin hazırlığı 15 dakika, pişirmesi 120 dakika; toplam 2 saat 15 dakika. Et suyunu bir gün önceden hazırlarsan sabah on dakikada sofraya koyabilirsin.

    '
  editorNote: 'Pirinci et suyunda değil ayrı tencerede haşlamayı seçtik; böylece et suyu pirincin nişastasıyla bulanmıyor ve her kâseye konan pirinç miktarını kendin ayarlayabiliyorsun.

    '
  notes:
  - t: Eti haşlarken köpük
    d: 'Kuzu eti haşlanmaya başladığında yüzeye gri bir köpük çıkar. Bu köpüğü kaşıkla düzenli almak et suyunun berrak ve temiz tatlı olmasını sağlar. İlk kaynamadan sonra ateşi kısıp suyu hafif hafif kaynatmak, etin sertleşmeden yumuşamasına yardım eder. Gerdan ve kol gibi kemikli parçalar hem daha lezzetli bir su verir hem de uzun pişirmede dağılarak kolayca didiklenir. Et kemikten kendiliğinden ayrılıyorsa hazırdır.

      '
  - t: Sarımsak ve kızgın tereyağı
    d: 'Beyranın karakterini veren iki şey sarımsak ve acılı tereyağı. Sarımsağı ezip doğrudan kâseye koymak, üzerine dökülen kaynar et suyuyla aromasını hemen salmasını sağlar; bu yüzden pişirmeye eklenmiyor. Tereyağını pul biberle kızdırırken biberin yanmamasına dikkat et; tereyağı köpürdüğünde ocaktan almak yeterli. Acıyı sevmiyorsan pul biber miktarını azaltabilirsin. Limon masada ayrıca sıkılır ve çorbanın yağlı tadını dengeler. Sarımsak miktarı bu tarifte bilerek yüksek tutuldu; 6 diş dört kâseye paylaştırılınca her kâseye belirgin ama boğmayan bir aroma düşer.

      '
  - t: Önceden hazırlamak
    d: 'Beyranın uzun süren kısmı yalnızca etin haşlanması. Eti ve suyunu bir gün önce hazırlayıp ayrı kaplarda buzdolabında saklayabilirsin. Soğuyan et suyunun yüzeyinde donan yağı istersen alabilirsin. Sabah et suyunu kaynatıp kâseleri kurmak on dakikanı alır. Kâseleri önceden ısıtmak çorbanın uzun süre sıcak kalmasını sağlar. Kuzu eti yerine dana eti de kullanılabilir; pişirme süresi benzerdir. Pirinci de önceden haşlayabilirsin; servis sırasında kaynar et suyu dökülünce pirinç kendiliğinden ısınır.

      '
  faq:
  - q: Beyran çorbası için hangi et kullanılır?
    a: Kemikli kuzu gerdan ya da kol. Dana eti de olur; pişirme süresi benzer.
  - q: Beyran eti kaç saat haşlanır?
    a: Yaklaşık 2 saat, et kemikten ayrılana kadar. Köpüğünü alarak kısık ateşte haşla.
  - q: Beyran önceden hazırlanır mı?
    a: Evet. Eti ve suyunu bir gün önce hazırlarsan sabah on dakikada servis edebilirsin.
  - q: Beyranın acılı sosu nasıl yapılır?
    a: 2 yemek kaşığı tereyağını 1 yemek kaşığı pul biberle kızdırıp kâselerin üzerine gezdir. Biberi yakmamak için tereyağı köpürünce ocaktan al.
biskuvili-pasta:
  aramaBasligi: 'Bisküvili pasta tarifi: Fırınsız, muhallebili ve kremalı'
  intro: 'Bisküvili pasta, sütlü bisküvi katlarının muhallebiyle buluşup buzdolabında yumuşadığı, fırına girmeyen bir ev pastası. Doğum günlerinde ve misafir sofralarında sıkça yapılır; malzemesi bulunması kolay, tekniği basittir.


    Bu tarifte süt, şeker, un, nişasta ve yumurta sarısıyla koyu bir muhallebi pişiriliyor, soğuduktan sonra çırpılmış sıvı kremayla mikserde birleştiriliyor. Petibör bisküviler süte hızlıca batırılıp dikdörtgen kaba diziliyor; üç kat bisküvi, üç kat krema olacak şekilde ilerleniyor. Üzerine kakao elenip en az 4 saat buzdolabında dinlendiriliyor.


    10 kişilik pastanın hazırlığı 25 dakika, pişirmesi 10 dakika; toplam 35 dakika, buna buzdolabında bekleme ekleniyor. Bir gece beklerse dilimler pasta gibi düzgün kesilir.

    '
  editorNote: 'Muhallebiye çırpılmış krema eklemeyi ayrı bir adım yaptık; krema, soğuyan muhallebiyi hafifletip bisküvi katlarına daha kolay yayılan, daha yumuşak bir dolguya çeviriyor.

    '
  notes:
  - t: Muhallebiyi doğru pişirmek
    d: 'Un ve nişastayı süte ocak yanmadan önce, soğukken çırpmak topaklanmayı önler. Orta ateşte sürekli karıştırarak pişir; dibi tutarsa yanık tadı bütün pastaya geçer. Muhallebi koyulaşıp kaşığın arkasını kaplayınca ocaktan al, tereyağı ve vanilini ekle. Soğurken yüzeyinin kabuk bağlamaması için üzerine streç film yapıştırabilirsin. Kremayla birleştirmeden önce muhallebinin tamamen soğuması gerekir; ılık muhallebi çırpılmış kremayı söndürür. Muhallebi topaklanırsa ocaktan alıp mikserle kısa süre çırpmak pürüzsüzlüğünü geri getirir.

      '
  - t: Bisküviyi ıslatmak
    d: 'Bu pastada en sık yapılan hata bisküviyi sütte fazla bekletmek. Petibör bisküvi çok çabuk sıvı çeker; bir saniyeden uzun kalırsa dağılır ve katlar çamurlaşır. Bisküviyi süte batırıp hemen çıkarmak yeterli, çünkü buzdolabında beklerken kremadan nem çekip yumuşamaya devam eder. Bisküvileri kabın tabanına aralarında boşluk kalmayacak şekilde dizmek, dilimlerin kesildiğinde düzgün durmasını sağlar. Islatma sütünü soğuk kullanmak da bisküvinin daha yavaş su çekmesini sağlar. Kabın ölçüsüne göre bisküvileri kırarak boşlukları doldurabilirsin; kırık parçalar da kremanın altında görünmez.

      '
  - t: Dinlendirme ve çeşitleme
    d: 'En az 4 saatlik dinlenme bisküvilerin kek gibi yumuşaması için şart. Bir gece beklettiğinde dilimler dağılmadan, tam pasta gibi kesilir. Kakaoyu servisten hemen önce elemek, nemlenip lekelenmesini önler. Krema kısmına bir kaşık hazır kahve eklersen tiramisuyu andıran bir tat elde edersin. Kakao yerine aynı ölçü keçiboynuzu tozu da kullanılabilir; tadı daha tatlı ve hafif karamelli olur. Pastayı kesmeden önce bıçağı sıcak suya batırıp silmek dilimlerin kenarlarını düzgün tutar.

      '
  faq:
  - q: Bisküvili pasta kaç saat buzdolabında bekler?
    a: En az 4 saat. Bir gece beklerse dilimler daha düzgün kesilir.
  - q: Bisküvili pasta neden dağılır?
    a: Genellikle bisküvi sütte fazla bekletildiği için. Bisküviyi süte bir saniyeden kısa batırıp hemen diz.
  - q: Bisküvili pasta kreması nasıl yapılır?
    a: Süt, şeker, un, nişasta ve yumurta sarısıyla muhallebi pişirilir, soğuyunca 200 ml çırpılmış sıvı kremayla mikserde birleştirilir.
  - q: Bisküvili pastada kakao yerine ne kullanılır?
    a: Aynı ölçü keçiboynuzu (harnup) tozu kullanabilirsin; tadı daha tatlı ve hafif karamelli olur.
bruschetta:
  aramaBasligi: 'Bruschetta tarifi: Domatesli, sarımsaklı ve fesleğenli'
  intro: 'Bruschetta, kızarmış ekmek dilimlerine sarımsak sürülüp üzerine domates, fesleğen ve zeytinyağı konan bir İtalyan aperitif lokması. Az malzemeyle yapılır; bu yüzden domatesin olgunluğu ve zeytinyağının kalitesi tadı belirler.


    Bu tarifte domatesler çekirdekleri alınarak küçük küp doğranıyor, kıyılmış fesleğen, zeytinyağı, tuz ve bir tatlı kaşığı balzamik sirkeyle karıştırılıyor. Baget ya da ekşi maya ekmeği fırın ızgarasında veya tavada kızartılıyor, bir yüzüne yarım diş sarımsak sürülüyor. Domatesli harç servis anında ekmeklere paylaştırılıyor.


    4 kişilik tarif toplam 15 dakikada hazır: 10 dakika hazırlık, 5 dakika pişirme. Airfryer kullanıyorsan ekmekleri zeytinyağı sürerek 180°C''de 4-5 dakikada kızartabilirsin. Tarif tamamen bitkisel.

    '
  editorNote: 'Domatesin çekirdeklerini almayı adımın içine özellikle yazdık; çekirdekli kısım su salar ve ekmek, servis edilmeden yumuşar.

    '
  notes:
  - t: Domatesi hazırlamak
    d: 'Domatesin çekirdekli, sulu iç kısmı bruschettanın en büyük düşmanı. Domatesi dörde bölüp çekirdeklerini kaşıkla aldıktan sonra doğramak, harcın daha kuru ve yoğun olmasını sağlar. Küpleri küçük tutmak, ekmeğin üzerinde dağılmadan durmalarına yardım eder. Tuz domatesten su çektiği için harcı önceden karıştırıp uzun süre bekletme; servise yakın hazırlamak en iyisi. Buzdolabından yeni çıkmış domates yerine oda sıcaklığındaki domates daha aromatik olur.

      '
  - t: Ekmek ve sarımsak
    d: 'Ekmeğin iyice kızarmış, dışının çıtır olması gerekir; böylece sarımsağı sürdüğünde kızarmış yüzey bir rende gibi davranır ve sarımsağı ince bir tabaka halinde tutar. Yarım diş sarımsağı kesik yüzünden ekmeğe sürmek, çiğ sarımsağı doğrayıp eklemekten çok daha hafif bir aroma verir. Baget ya da ekşi maya gibi sıkı dokulu ekmekler domatesin suyunu çekse de dağılmaz. Yumuşak somun ekmeği ise kısa sürede hamurlaşır.

      '
  - t: Malzeme alternatifleri
    d: 'Balzamik sirke yoksa nar ekşisi kullanabilirsin; harca hafif ekşi bir tatlılık verir. Taze fesleğen bulamazsan üçte bir ölçü kuru fesleğen yeterli, ama tadı taze yaprak kadar canlı olmaz. Üzerine küçük doğranmış mozzarella ya da beyaz peynir ekleyerek daha doyurucu bir meze yapabilirsin; bu durumda tarif vegan olmaktan çıkar. Misafir için hazırlıyorsan ekmekleri önceden kızartıp harcı ayrı kapta tutmak ve servis anında birleştirmek pratik olur.

      '
  faq:
  - q: Bruschetta ekmeği nasıl kızartılır?
    a: Fırın ızgarasında ya da tavada kızartabilirsin. Airfryer'da zeytinyağı sürülmüş dilimler 180°C'de 4-5 dakikada kızarır.
  - q: Bruschetta neden yumuşar?
    a: Domates harcı ekmeğe erken konduğu için. Harcı servis anında koy ve domatesin çekirdeklerini çıkar.
  - q: Bruschettada balzamik sirke yerine ne kullanılır?
    a: Nar ekşisi kullanabilirsin. Bu tarif için bir tatlı kaşığı yeterli.
  - q: Bruschetta önceden hazırlanır mı?
    a: Ekmekleri ve domates harcını ayrı ayrı hazırlayabilirsin. Birleştirmeyi servisten hemen önce yap.
burrito-bowl:
  aramaBasligi: 'Burrito bowl tarifi: Tavuklu, fasulyeli, limonlu pilavla'
  intro: 'Burrito bowl, burritonun içindeki malzemelerin tortillaya sarılmadan bir kâsede yan yana dizildiği doyurucu bir öğün. Meksika mutfağından esinlenen bu kâsede pirinç, fasulye, mısır, tavuk ve taze bir domates salsası bir araya geliyor.


    Bu tarifte pirinç haşlanıp misket limonu suyu ve kabuğu rendesiyle karıştırılıyor. Tavuk göğsü kimyon, toz kırmızı biber ve tuzla ovulup tavada her yüzü 5 dakika pişiriliyor. Domates ve kırmızı soğandan limonlu bir salsa hazırlanıyor; hepsi kâseye fasulye, mısır ve dilimlenmiş avokadoyla birlikte diziliyor, yoğurtla servis ediliyor.


    2 kişilik tarif toplam 40 dakikada hazır: 15 dakika hazırlık, 25 dakika pişirme. Kavanoza kat kat koyarak ofise de götürebilirsin.

    '
  editorNote: 'Malzemeleri karıştırmadan, kâsede yan yana dizmeyi seçtik; böylece her bileşen kendi tadını ve dokusunu koruyor, kavanoza koyduğunda da katlar birbirine karışmıyor.

    '
  notes:
  - t: Limonlu pirinç
    d: 'Pirinci haşladıktan sonra misket limonu suyu ve kabuğu rendesiyle karıştırmak, kâsenin tamamına taze ve ekşimsi bir taban verir. Kabuk rendesini alırken yalnızca yeşil kısmı al; altındaki beyaz zar acıdır. Pirinci haşlamadan önce birkaç kez yıkamak nişastasını azaltır ve tanelerin yapışmasını önler. Misket limonu bulamazsan normal limon da kullanılabilir. Pirinç soğuk da sıcak da yenebildiği için kâseyi önceden hazırlamak mümkün. Limonu pirinç sıcakken eklemek aromanın tanelere daha iyi geçmesini sağlar.

      '
  - t: Tavuğu sulu pişirmek
    d: 'Tavuk göğsü çabuk kurur; tavada her yüzü 5 dakika pişirdikten sonra dilimlemeden önce kısa bir süre dinlendirmek suyunu içinde tutar. Tavanın iyice ısınmış olması baharatların yüzeyde kızarıp aroma vermesini sağlar. Göğüs etinin bir ucu kalın, diğeri inceyse eşit pişmesi için eti hafifçe yassılaştırabilirsin. Daha sulu bir sonuç istersen tavuk but kullan. Vejetaryen bir kâse için tavuk yerine fırınlanmış tatlı patates iyi bir seçenek.

      '
  - t: Ofis için kavanozda
    d: 'Kâseyi kavanozda taşıyacaksan sıralama önemli. En alta salsa ve fasulye gibi sulu malzemeleri, üzerine pirinç ve mısırı, en üste tavuğu koy. Avokadoyu sabah hazırlarken değil, yemekten hemen önce dilimlemek kararmasını önler; mümkünse bütün ya da ayrı küçük bir kapta götür. Yoğurdu da ayrı tutmak kâsenin dokusunu korur. Konserve fasulye kullanıyorsan iyice yıkayıp süzmek kutunun suyundaki tuzu ve kıvamı azaltır. Kavanozu yemek saatine kadar buzdolabında tutmak tazeliğini korur.

      '
  faq:
  - q: Burrito bowl'da hangi fasulye kullanılır?
    a: Haşlanmış barbunya ya da siyah fasulye. Konserve haşlanmış fasulye de olur.
  - q: Burrito bowl için tavuk kaç dakika pişer?
    a: Tavada her yüzü 5 dakika, toplam 10 dakika. Dilimlemeden önce kısa süre dinlendir.
  - q: Burrito bowl'da misket limonu yerine ne kullanılır?
    a: Normal limon kullanabilirsin. Pirinçte ve salsada aynı şekilde kullan.
  - q: Burrito bowl önceden hazırlanır mı?
    a: Evet, kavanoza kat kat koyup ofise götürebilirsin. Avokadoyu yemekten hemen önce dilimle.
caprese-salata:
  aramaBasligi: 'Caprese salata tarifi: Domates, mozzarella ve fesleğen'
  intro: 'Caprese salata, domates, taze mozzarella ve fesleğen yapraklarının sırayla dizildiği, adını İtalya''daki Capri adasından alan bir salata. Kırmızı, beyaz ve yeşil renkleriyle İtalyan bayrağını andırır. Pişirme gerektirmez; malzemeleri kaliteli olduğunda başka bir şeye ihtiyaç duymaz.


    Bu tarifte olgun domatesler ve mozzarella 1 cm kalınlığında dilimlenip fesleğenle sırayla tabağa diziliyor. Üzerine tuz ve karabiber serpiliyor, sızma zeytinyağı ve bir yemek kaşığı balzamik sirke gezdiriliyor. Balzamik, salataya tatlı ekşi bir derinlik katıyor.


    2 kişilik tarif 10 dakikada hazır; pişirme yok. Mozzarella bulamazsan taze kaşar, dil peyniri ya da taze beyaz peynirle de yapabilirsin.

    '
  editorNote: 'Domates ve peyniri aynı kalınlıkta, 1 cm dilimlemeyi tarife özellikle yazdık; eşit dilimler hem tabağı düzenli gösteriyor hem de her lokmada iki malzemenin dengeli gelmesini sağlıyor.

    '
  notes:
  - t: Domatesin sıcaklığı ve olgunluğu
    d: 'Caprese''nin tadı neredeyse tamamen domatese bağlı. Buzdolabından yeni çıkmış domatesin aroması bastırılmış olur; domatesi servisten önce oda sıcaklığında bekletmek tadını belirgin biçimde artırır. Olgun, kokulu ve etli domatesler tercih et; çok sulu ve çekirdekli olanlar tabakta su salar. Kış aylarında domates zayıf olduğundan bu salata en iyi yaz mevsiminde yapılır. Tuzu servise yakın serpmek domatesin su salmasını geciktirir. Domatesi keskin, tırtıklı bir bıçakla dilimlemek dilimlerin ezilmeden düzgün çıkmasını sağlar.

      '
  - t: Mozzarella seçimi
    d: 'Bu salatada rendelemeye uygun sert mozzarella değil, salamura içinde satılan taze ve yumuşak mozzarella kullanılır. Peyniri salamurasından çıkarıp kâğıt havluyla hafifçe kurulamak, dilimlerin tabakta su bırakmasını önler. Taze mozzarella bulamazsan taze kaşar ya da dil peyniri kullanabilirsin; dil peynirini dilimlemek yerine iri parçalar halinde ayırmak daha iyi durur. Taze beyaz peynir de tuzlu ve ferah bir alternatif olur. Mozzarellayı da domates gibi servisten bir süre önce buzdolabından çıkarmak tadını açar.

      '
  - t: Sos ve servis
    d: 'Zeytinyağı bu salatada sos görevini neredeyse tek başına üstlendiği için iyi bir sızma zeytinyağı kullanmak fark yaratır. Balzamik sirkeyi tabağın tamamına dökmek yerine ince bir şekilde gezdir; fazlası domatesin tadını bastırır. Balzamik yoksa nar ekşisi kullanabilirsin. Fesleğen yapraklarını bıçakla doğramak yerine bütün ya da elle yırtılmış bırakmak kararmalarını önler. Salata hazırlandıktan sonra bekletilmeden servis edilmeli; bekledikçe domates suyunu salar. Karabiberi taze çekmek bu kadar sade bir tabakta fark edilir bir aroma katar.

      '
  faq:
  - q: Caprese salata için hangi mozzarella kullanılır?
    a: Taze, yumuşak mozzarella. Bulamazsan taze kaşar ya da dil peyniri kullanabilirsin.
  - q: Caprese salatada balzamik sirke yerine ne kullanılır?
    a: Nar ekşisi kullanabilirsin. Az miktarda gezdirmek yeterli.
  - q: Caprese salata önceden hazırlanır mı?
    a: Hazırlandıktan sonra hemen servis etmek en iyisi; bekledikçe domates su salar. Dizmeyi servisten hemen önce yap.
  - q: Caprese salatada kuru fesleğen olur mu?
    a: Taze fesleğen yerine üçte bir ölçü kuru fesleğen kullanabilirsin, ancak bu salatada taze yaprak tadı belirgin şekilde değiştirir.
chili-con-carne:
  aramaBasligi: 'Chili con carne tarifi: Kıymalı, barbunyalı ve kimyonlu'
  intro: 'Chili con carne, kıyma, fasulye, domates ve baharatla pişirilen acılı bir güveç. İspanyolcada "etli acı biber" anlamına gelen bu yemek, özellikle ABD''nin Teksas eyaletiyle özdeşleşmiştir. Bizim etli kuru fasulyeye benzer ama kimyon ve kırmızı biberin öne çıktığı, daha koyu ve baharatlı bir kıvamı vardır.


    Bu tarifte soğan, sarımsak ve kapya biber yağda yumuşatılıp dana kıymayla kavruluyor. Salça, kimyon, toz kırmızı biber ve pul biber 1 dakika çevrilerek aromaları açılıyor. Ardından konserve domates, haşlanmış barbunya ve sıcak su eklenip kısık ateşte 35-40 dakika, koyulaşana kadar pişiriliyor.


    4 kişilik tarif toplam 60 dakikada hazır: 15 dakika hazırlık, 45 dakika pişirme. Pilav, yoğurt ve rendelenmiş peynirle servis edebilirsin.

    '
  editorNote: 'Baharatları sıvılardan önce salçayla birlikte 1 dakika çevirme adımını ayrı yazdık; kimyon ve kırmızı biber yağda ısındığında aromalarını çok daha belirgin biçimde veriyor.

    '
  notes:
  - t: Kıymayı kavurmak
    d: 'Kıymayı tencereye attıktan sonra hemen karıştırmak yerine bir süre dokunmadan bırakmak, altının kızarmasını sağlar; kızaran kıyma yemeğe derin bir tat verir. Kıyma önce suyunu salar; bu su tamamen çekilip kıyma tane tane olana kadar kavurmaya devam et. Suyunu çekmeden sıvıları eklersen kıyma haşlanmış gibi olur. Kalabalık bir tencerede bu süre uzar, sabırlı olmak gerekir. Etsiz bir versiyon için kıyma yerine haşlanmış yeşil mercimek ya da ince doğranmış mantar kullanabilirsin.

      '
  - t: Kıvam ve pişirme süresi
    d: '35-40 dakikalık kısık ateşte pişirme, domatesin ekşiliğini yumuşatır ve barbunyaların sosu emmesini sağlar. Chili sulu bir çorba değil, kaşıkla alınabilecek koyulukta olmalı. Pişerken ara ara karıştır, çünkü fasulye ve domates dibe tutmaya yatkındır. Fazla koyulaşırsa biraz sıcak su ekleyebilirsin. Konserve fasulye kullanıyorsan iyice süzüp yıkamak gerekir. Acıyı ayarlamak için pul biber miktarını tadına göre artırabilir ya da azaltabilirsin. Kapağı aralık bırakmak fazla suyun buharlaşmasına ve sosun daha çabuk koyulaşmasına yardım eder.

      '
  - t: Servis ve saklama
    d: 'Chili con carne bekledikçe baharatlar oturduğu için ertesi gün daha lezzetli olur; bu yüzden önceden pişirmeye çok uygun. Soğuduktan sonra kapalı kapta buzdolabında saklayabilir ya da porsiyonlara bölerek dondurabilirsin. Isıtırken biraz su eklemek kıvamını geri getirir. Pilav, yoğurt ve rendelenmiş peynirle servis edilir. Pişirmenin sonunda küçük bir parça bitter çikolata eklemek, sosa hafif bir derinlik katar ve acıyı yuvarlar. Çikolatayı eklersen iyice erimesi için birkaç dakika karıştırmaya devam et.

      '
  faq:
  - q: Chili con carne kaç dakika pişer?
    a: Domates ve fasulye eklendikten sonra kısık ateşte 35-40 dakika pişer. Toplam pişirme süresi 45 dakika.
  - q: Chili con carne'de hangi fasulye kullanılır?
    a: Bu tarifte 2 su bardağı haşlanmış barbunya kullanılıyor. Konserve haşlanmış fasulye de olur.
  - q: Chili con carne'ye çikolata konur mu?
    a: İstersen pişirmenin sonunda küçük bir parça bitter çikolata ekleyebilirsin; sosa derinlik katar.
  - q: Chili con carne dondurulur mu?
    a: Evet, soğuduktan sonra porsiyonlara bölüp dondurabilirsin. Isıtırken biraz su ekle.
churros:
  aramaBasligi: 'Churros tarifi: Tarçınlı şekerli, çikolata soslu'
  intro: 'Churros, sıcak hamurun yıldız uçlu sıkma torbasıyla kızgın yağa sıkılıp tarçınlı şekere bulandığı bir İspanyol tatlısı. İspanya''da çoğu zaman koyu sıcak çikolataya banılarak yenir. Ocakta pişirilen hamuruyla bizim tulumba tatlısının hamuruna benzer.


    Bu tarifte su, tereyağı, şeker ve tuz kaynatılıyor, un bir kerede eklenip hamur toparlanana kadar karıştırılıyor. Hamur ılıyınca yumurta eklenip pürüzsüz olana kadar çırpılıyor. 180°C yağa 10-12 cm boyunda sıkılan hamur altın rengi olana kadar kızartılıyor, sıcakken tarçınlı şekere bulanıyor ve sıcak kremada eritilen bitter çikolatayla servis ediliyor.


    4 kişilik tarif toplam 30 dakikada hazır: 15 dakika hazırlık, 15 dakika pişirme. Airfryer''da 190°C''de 10-12 dakikada da pişirebilirsin.

    '
  editorNote: 'Yumurtayı eklemeden önce hamurun ılımasını adımın içine yazdık; çok sıcak hamura giren yumurta pişer ve hamur pürüzsüz bir kıvama gelmez.

    '
  notes:
  - t: Hamurun kıvamı
    d: 'Churros hamuru, un kaynayan sıvıya bir kerede eklendiğinde nişastanın hemen şişmesiyle oluşur. Unu azar azar eklersen topaklanır; tek seferde ekleyip hamur tencerenin kenarlarından ayrılıp top haline gelene kadar karıştırmak gerekir. Ardından birkaç dakika ılımasını beklemek, yumurtanın pişmeden hamura karışmasını sağlar. Doğru hamur sıkma torbasından zorlanmadan çıkar ama şeklini korur. Çok sıkıysa torbadan çıkmaz, çok yumuşaksa yıldız çizgileri kaybolur. Yumurtayı ekledikten sonra hamur önce kayganlaşıp dağılmış gibi görünür; çırpmaya devam ettikçe yeniden toparlanır ve parlaklaşır.

      '
  - t: Yağın sıcaklığı
    d: 'Yağın 180°C olması önemli. Daha soğuk yağda hamur yağ çeker ve ağırlaşır; çok sıcak yağda ise dışı hızla kararırken içi çiğ kalır. Termometren yoksa küçük bir parça hamur at: hemen kabarcıklanıp yüzeye çıkıyorsa yağ hazır. Tencereye aynı anda çok fazla hamur sıkma, yağın ısısı düşer. Yıldız uçlu sıkma ucu yalnızca görüntü için değil; oluşan çizgiler yüzey alanını artırıp churrosun daha eşit ve çıtır pişmesine yardım eder.

      '
  - t: Kaplama, sos ve airfryer
    d: 'Tarçınlı şeker, churros yağdan yeni çıkmışken yüzeye en iyi yapışır; soğuyunca şeker tutmaz. Bu yüzden kızaran parçaları kâğıt havluda kısa süre süzdürüp hemen şekere bula. Çikolata sosu için bitter çikolatayı sıcak kremada karıştırarak erit; daha tatlı bir sos istersen sütlü çikolata kullanabilirsin. Airfryer''da hamuru yağlı kâğıda sıkıp bolca yağ sprey etmek gerekir; aksi halde yüzeyi kuru ve soluk kalır. Churros en iyi taze yenir, bekledikçe yumuşar.

      '
  faq:
  - q: Churros hangi sıcaklıkta kızartılır?
    a: 180°C yağda, altın rengi olana kadar kızartılır.
  - q: Churros airfryer'da yapılır mı?
    a: Evet. Hamuru yağlı kâğıda sık, bolca yağ sprey et ve 190°C'de 10-12 dakika pişir; sıcakken tarçınlı şekere bula.
  - q: Churros hamuru neden pürüzsüz olmaz?
    a: Yumurta çok sıcak hamura eklendiğinde pişer ve hamur topaklanır. Hamurun ılımasını bekleyip yumurtayı sonra çırp.
  - q: Churros çikolata sosu nasıl yapılır?
    a: 100 g bitter çikolatayı yarım su bardağı sıcak kremada karıştırarak erit.
cokertme-kebabi:
  aramaBasligi: 'Çökertme kebabı tarifi: Kibrit patatesli, sarımsaklı yoğurtlu'
  intro: 'Çökertme kebabı, çıtır kibrit patatesin üzerine sarımsaklı yoğurt, ince şerit sotelenmiş et ve kızdırılmış sosun dizildiği, Bodrum''la özdeşleşmiş bir kebap. Dışarıda en çok sipariş edilenlerden biri olsa da her parçası ayrı hazırlandığı için evde de rahatça yapılabiliyor.


    Bu tarifte patatesler kibrit inceliğinde kesilip soğuk suda nişastası alınıyor ve parti parti kızartılıyor. Süzme yoğurt sarımsakla çırpılıp oda sıcaklığında bekletiliyor. Dana bonfile ya da antrikot şeritler yüksek ateşte iki partide sotelenip kekikle tatlandırılıyor. Tereyağında salça ve pul biberle hazırlanan sos en son üzerine dökülüyor.


    4 kişilik tarifin hazırlığı 25 dakika, pişirmesi 25 dakika; toplam 50 dakika. Patatesi servisten hemen önce kızartırsan çıtırlığını uzun süre korur.

    '
  editorNote: 'Yoğurdun oda sıcaklığında beklemesini ayrı bir adım olarak yazdık; çok soğuk yoğurt sıcak patatesle buluştuğunda onu hemen yumuşatıyor ve çökertmenin çıtırlığı kayboluyor.

    '
  notes:
  - t: Kibrit patatesin çıtırlığı
    d: 'Patatesi soğuk suda 10 dakika bekletmek yüzeydeki nişastayı alır; nişastası alınmış patates kızarırken birbirine yapışmaz ve daha çıtır olur. Yağa atmadan önce kâğıt havluyla iyice kurulamak şart, çünkü ıslak patates yağı sıçratır ve yağın ısısını düşürür. Patatesleri parti parti kızartmak da aynı nedenle önemli. Tuzu kızartmadan sonra serp. Daha az yağlı bir seçenek için kibrit patatesleri az yağla 220°C fırında 25 dakika, arada karıştırarak pişirebilirsin.

      '
  - t: Eti sotelemek
    d: 'Etin yumuşak kalması için iki şey belirleyici: kesim ve ateş. Şeritler en fazla yarım parmak kalınlığında olmalı; daha kalın kesilen et hızlı sotede sertleşir. Tavayı yüksek ateşte iyice kızdırıp eti iki partide pişirmek, etin suyunu salıp kısa sürede çekmesini ve kenarlarının kızarmasını sağlar. Hepsini birden atarsan tava soğur ve et haşlanır. Dana yerine kuzu eti ya da tavuk but kullanabilirsin; tavukta süreyi yarıya indir.

      '
  - t: Tabağı kurmak
    d: 'Çökertmenin keyfi, sıcak patates, serin yoğurt ve sıcak etin aynı anda masaya gelmesinde. Bu yüzden her şeyi önceden hazırlayıp son anda kat kat dizmek gerekir: önce patates, üzerine yoğurt, ortasına et, en üste kızdırılmış sos. Sosu hazırlarken salçayı tereyağında 30 saniye çevirmek çiğ tadını alır; pul biberi ocaktan almadan hemen önce eklemek yanmasını önler. Kebap beklemeye gelmez; patates yoğurtla temas ettikçe yumuşar, bu yüzden dizer dizmez servis et.

      '
  faq:
  - q: Çökertme kebabı için hangi et kullanılır?
    a: İnce şerit doğranmış dana bonfile ya da antrikot. Kuzu eti ya da tavuk but da olur; tavukta süreyi yarıya indir.
  - q: Çökertme patatesi nasıl çıtır olur?
    a: Kibrit inceliğinde kesip soğuk suda 10 dakika beklet, iyice kurula ve parti parti kızart. Servisten hemen önce kızartmak çıtırlığı korur.
  - q: Çökertme kebabı fırında patatesle yapılır mı?
    a: Evet. Kibrit patatesleri az yağla 220°C fırında 25 dakika, arada karıştırarak pişirebilirsin.
  - q: Çökertme sosu nasıl yapılır?
    a: 2 yemek kaşığı tereyağını erit, 1 tatlı kaşığı salçayı 30 saniye çevir, 1 tatlı kaşığı pul biberi ekleyip ocaktan al.
deniz-borulcesi:
  aramaBasligi: 'Deniz börülcesi salatası tarifi: Sarımsaklı ve limonlu'
  intro: 'Deniz börülcesi, deniz kıyısındaki tuzlu topraklarda yetişen, ince ve etli dallarıyla tanınan bir bitki. Ege mutfağında zeytinyağı, sarımsak ve limonla hazırlanan bir meze ya da salata olarak sofraya gelir. Kendisi doğal olarak tuzlu olduğu için bu salatada tuz kullanılmıyor.


    Bu tarifte deniz börülcesi yıkanıp kaynar suda 3-4 dakika haşlanıyor ve hemen soğuk sudan geçiriliyor. Ardından sert sap kısmından tutulup parmaklarla sıyrılarak yumuşak kısmı ayrılıyor. Son olarak zeytinyağı, ezilmiş sarımsak ve limon suyuyla karıştırılıyor.


    4 kişilik tarif toplam 15 dakikada hazır: 10 dakika hazırlık, 5 dakika pişirme. Balık yemeklerinin yanına özellikle yakışır.

    '
  editorNote: 'Ayıklama adımını haşlamadan sonraya koyduk; haşlanan börülcenin yumuşak kısmı sert sap üzerinden parmakla kolayca sıyrılıyor, çiğken bu iş hem zor hem uzun sürüyor.

    '
  notes:
  - t: Haşlama süresi
    d: 'Deniz börülcesini kaynar suda 3-4 dakikadan fazla tutmamak gerekir. Fazla haşlanırsa canlı yeşil rengini kaybeder, grileşir ve çıtırlığı gider. Süre dolar dolmaz soğuk sudan geçirmek pişmeyi durdurur ve rengi korur. Haşlama suyuna tuz ekleme; börülce zaten tuzlu. Haşlamadan önce iyice yıkamak, dalların arasında kalabilecek kumu ve toprağı temizler. Birkaç kez su değiştirerek yıkamak en garantili yöntem. Haşlanmış börülceyi süzdükten sonra iyice silkelemek, fazla suyun sosu sulandırmasını önler.

      '
  - t: Ayıklamak
    d: 'Deniz börülcesinin ortasında, haşlandıktan sonra da sert kalan ince bir sap bulunur. Dalı sert ucundan tutup diğer elinin parmaklarıyla sap boyunca sıyırdığında yumuşak, etli kısım saptan ayrılır. Sapı atıp yalnızca yumuşak kısmı salataya almak, yerken lif hissini ortadan kaldırır. Genç ve ince dallarda sap daha yumuşaktır; bunları bütün bırakabilirsin. Ayıklama biraz zaman alsa da salatanın dokusunu belirleyen asıl adım budur.

      '
  - t: Sos ve servis
    d: 'Sos için zeytinyağı, ezilmiş sarımsak ve limon suyu yeterli. Limon suyunu servise yakın eklemek börülcenin rengini daha iyi korur, çünkü asit yeşil sebzelerin rengini zamanla soldurur. Limon yoksa misket limonu ya da yarı ölçü elma sirkesi kullanabilirsin. Tuz eklemeden önce mutlaka tadına bak; çoğu zaman gerek kalmaz. Salata balık ve deniz ürünlerinin yanında çok iyi gider. En canlı haliyle, hazırlandığı gün yenmesi en iyisi.

      '
  faq:
  - q: Deniz börülcesi kaç dakika haşlanır?
    a: Kaynar suda 3-4 dakika. Ardından hemen soğuk sudan geçir.
  - q: Deniz börülcesine tuz konur mu?
    a: Hayır, kendisi tuzlu olduğu için tuz eklemene gerek yok.
  - q: Deniz börülcesi nasıl ayıklanır?
    a: Haşladıktan sonra sert sap kısmından tut ve parmaklarınla sıyırarak yumuşak kısmı ayır.
  - q: Deniz börülcesi salatasında limon yerine ne kullanılır?
    a: Misket limonu ya da yarı ölçü elma sirkesi kullanabilirsin.
domates-soslu-feslegenli-makarna:
  aramaBasligi: 'Domates soslu fesleğenli makarna tarifi: 20 dakikada'
  intro: 'Domates soslu fesleğenli makarna, sarımsaklı zeytinyağında pişen domates sosunun spagettiyle buluştuğu, İtalyan usulü en sade tabaklardan biri. Malzemesi az, tekniği basit; dolapta bir kutu domates konservesi varsa akşam yemeği hazır demektir.


    Bu tarifte spagetti bol tuzlu suda haşlanırken yarım bardak makarna suyu ayrılıyor. Sarımsak zeytinyağında rengi dönmeden çevriliyor, pul biber ekleniyor; ardından doğranmış domates, tuz ve bir tutam şekerle sos koyulaşana kadar pişiriliyor. Süzülen makarna sosa alınıp ayrılan suyla karıştırılıyor, en son elle yırtılmış fesleğen ve istersen parmesan ekleniyor.


    3 kişilik tarif toplam 20 dakikada hazır: 5 dakika hazırlık, 15 dakika pişirme. Parmesanı atlarsan tarif vegan olur.

    '
  editorNote: 'Makarna suyunu ayırmayı haşlama adımına bilerek ekledik; suyundaki nişasta sosu makarnaya bağlıyor ve sosu sulandırmadan parlak bir kıvam veriyor.

    '
  notes:
  - t: Makarna suyunun görevi
    d: 'Haşlama suyu, makarnadan geçen nişasta sayesinde hafif bulanık ve kıvamlıdır. Süzülen makarnayı sosa alırken bu sudan azar azar eklemek, domates sosunun makarnanın yüzeyine tutunmasını sağlar. Su yerine yağ eklemek sosu ağırlaştırır, düz su eklemek ise sulandırır. Haşlama suyunu bol tuzlu yapmanın nedeni, makarnanın tuzunu pişerken içine alması. Makarnayı sosla birleştirdikten sonra ocakta birkaç kez çevirmek, sosun her teli eşit kaplamasını sağlar.

      '
  - t: Sarımsak ve domates
    d: 'Sarımsağı kısık ateşte, rengi dönmeden çevirmek önemli; yanan sarımsak acılaşır ve bütün sosa bu tat geçer. Pul biberi sarımsakla birlikte yağa eklemek, acının yağa geçip sosa eşit dağılmasını sağlar. Konserve domates, mevsim dışında taze domatesten daha tutarlı bir tat verir. Bir tutam şeker, konserve domatesin ekşiliğini dengelemek için eklenir; sosu tatlandırmaz. Sos, kaşıkla tavanın dibine çizgi çektiğinde hemen kapanmayacak kadar koyulaşınca hazırdır.

      '
  - t: Fesleğen ve peynir
    d: 'Fesleğeni bıçakla doğramak yerine elle yırtmak yapraklarının kararmasını azaltır; servis anında eklemek de aromasını korur, çünkü fesleğen sıcakta çabuk solar. Parmesan bulamazsan eski kaşar ya da kuru tulum peynirini ince rendeleyerek kullanabilirsin. Peyniri hiç kullanmazsan tarif vegan olur. Makarna en iyi taze yenir; artanını ısıtırken bir iki kaşık su eklemek sosun kurumasını ve makarnanın tavaya yapışmasını engeller. Parmesanı tabakta rendelemek, sosun içinde topaklanmasını önler.

      '
  faq:
  - q: Domates soslu makarna kaç dakikada hazırlanır?
    a: Toplam 20 dakika. Makarna 10 dakikada haşlanırken sos da 10 dakikada pişer.
  - q: Domates sosuna neden şeker konur?
    a: Bir tutam şeker konserve domatesin ekşiliğini dengeler; sosu tatlandırmaz.
  - q: Makarnada parmesan yerine ne kullanılır?
    a: Eski kaşar ya da kuru tulum peyniri kullanabilirsin; ince rendele.
  - q: Makarna suyu neden atılmaz?
    a: Suyundaki nişasta sosu makarnaya yapıştırır. Yarım bardak ayırıp karıştırırken azar azar ekle.
elmali-crumble:
  aramaBasligi: 'Elmalı crumble tarifi: Tarçınlı, yulaflı kıtır harçla'
  intro: 'Crumble, meyvelerin üzerine un, şeker ve tereyağıyla hazırlanan iri kırıntılı bir harcın serpilip fırınlandığı bir İngiliz tatlısı. Turtaya göre çok daha az uğraştırır: hamur açmak, kalıba yaymak yok; harç elle ufalanıp meyvenin üzerine serpiliyor.


    Bu tarifte elmalar küp doğranıp şeker, tarçın ve limon suyuyla karıştırılarak fırın kabına yayılıyor. Un, yulaf ezmesi, esmer şeker ve soğuk tereyağı parmak uçlarıyla ufalanıp elmaların üzerine serpiliyor. 180°C fırında üzeri kızarıp elma suyu kenarlardan köpürene kadar pişiyor.


    6 kişilik tarif toplam 50 dakikada hazır: 15 dakika hazırlık, 35 dakika pişirme. Ilık olarak vanilyalı dondurma ya da yoğurtla servis edebilirsin. Aynı yöntemle armut ya da ayvayla da yapılır.

    '
  editorNote: 'Pişme ölçüsünü yalnızca süreyle değil, elma suyunun kenarlardan köpürmesiyle de tarif ettik; bu işaret elmaların içten yumuşadığını gösteriyor ve fırından fırına değişen süreler için daha güvenilir.

    '
  notes:
  - t: Soğuk tereyağı ve kıtır harç
    d: 'Harcın kıtır olması tereyağının soğuk kalmasına bağlı. Soğuk tereyağı unla ufalandığında küçük parçalar halinde kalır; fırında bu parçalar eriyip çevresindeki unu kızartır ve kıtır topaklar oluşturur. Tereyağı ellerinin sıcaklığıyla erirse harç hamura döner ve fırında sertleşir. Bu yüzden parmak uçlarıyla hızlı çalış, gerekirse harcı serpmeden önce kısa bir süre buzdolabına koy. Yulaf ezmesi harca ayrıca dişe gelen bir doku katar.

      '
  - t: Elma seçimi
    d: 'Fırında dağılmadan yumuşayan, hafif ekşi elmalar crumble için en uygunu. Çok sulu elmalar fırında fazla su salar ve harcın altını ıslatabilir. Elmaları eşit büyüklükte küp doğramak, hepsinin aynı anda pişmesini sağlar. Limon suyu hem elmaların kararmasını yavaşlatır hem de şeker ve tarçının tadını dengeler. Elma yerine armut ya da ayva kullanabilirsin; ayva daha sert olduğu için yumuşaması daha uzun sürebilir, fırından almadan önce kontrol et.

      '
  - t: Servis, saklama ve airfryer
    d: 'Crumble fırından çıktıktan sonra birkaç dakika dinlenince elma suyu biraz koyulaşır ve kaşıkla servis etmek kolaylaşır. Ilık crumble ile soğuk vanilyalı dondurma ya da yoğurt arasındaki sıcaklık farkı tatlının keyfini artırır. Artanı buzdolabında saklayabilirsin; harç zamanla nem çekip yumuşar, fırında kısa süre ısıtmak çıtırlığını kısmen geri getirir. Airfryer''da küçük bir fırın kabında 170°C''de 15-18 dakika, üstü altın rengi olana kadar pişirebilirsin.

      '
  faq:
  - q: Elmalı crumble kaç dakika pişer?
    a: 180°C fırında yaklaşık 35 dakika, üzeri kızarıp elma suyu kenarlardan köpürene kadar.
  - q: Crumble harcı neden kıtır olmaz?
    a: Tereyağı soğuk değilse ya da ufalarken erirse harç hamurlaşır. Soğuk tereyağıyla, parmak uçlarınla hızlı çalış.
  - q: Crumble airfryer'da yapılır mı?
    a: Evet, küçük bir fırın kabında 170°C'de 15-18 dakika, üstü altın rengi olana kadar pişir.
  - q: Crumble'da yulaf ezmesi yerine ne kullanılır?
    a: Glutensiz yulaf ya da kinoa gevreği kullanabilirsin.
elmali-turta:
  aramaBasligi: 'Elmalı turta tarifi: Kıyır hamurlu, cevizli ve kafes üstlü'
  intro: 'Elmalı turta, tereyağlı kıyır bir hamurun içine tarçınlı elma harcı doldurulup fırınlandığı klasik bir ev tatlısı. Fırından çıkarken evi saran tarçın kokusuyla her mevsim yapılabilir; misafir sofralarında da çay saatlerinde de yerini bulur.


    Bu tarifte soğuk tereyağı unla kum gibi ufalanıp şeker, yumurta, yoğurt ve tuzla hızlıca toplanıyor ve 30 dakika buzdolabında dinlendiriliyor. Küp doğranan elmalar şeker, tarçın ve limonla 8-10 dakika suyunu çekene kadar pişirilip nişasta ve cevizle karıştırılıyor. Hamurun üçte ikisi kalıba yayılıyor, harç dolduruluyor ve kalan hamurdan şeritlerle kafes yapılıyor.


    8 kişilik turtanın hazırlığı 30 dakika, pişirmesi 40 dakika; toplam 70 dakika. 180°C fırında 35-40 dakika pişen turtayı soğuyunca kesmek gerekiyor.

    '
  editorNote: 'Elma harcını fırından önce ocakta pişirip soğutmayı seçtik; suyunu önceden çeken harç hamurun tabanını ıslatmıyor, turta kesildiğinde de dağılmıyor.

    '
  notes:
  - t: Kıyır hamurun sırrı
    d: 'Hamurun kıyır, yani ağızda dağılan bir dokuda olması tereyağının soğuk kalmasına bağlı. Tereyağını unla parmak uçlarında kum kıvamına gelene kadar ufala, sıvıları ekledikten sonra yalnızca toparlanacak kadar karıştır. Fazla yoğurmak hem tereyağını eritir hem de unun glutenini geliştirip hamuru sertleştirir. 30 dakikalık buzdolabı dinlenmesi tereyağını yeniden sıkılaştırır ve hamurun açılırken yapışmasını önler. Tabana çatalla delik açmak pişerken kabarmasını engeller. Hamur açarken kırılırsa parçaları kalıbın içinde parmaklarınla bastırarak birleştirebilirsin.

      '
  - t: Harcı önceden pişirmek
    d: 'Çiğ elma fırında bol su salar; bu su hamurun tabanını ıslatıp pişmemiş gibi bırakabilir. Elmaları şeker, tarçın ve limonla 8-10 dakika pişirip suyunu çektirmek bu sorunu ortadan kaldırır. Nişasta, kalan suyu bağlayarak harcın kesildiğinde akmamasını sağlar. Harcı hamura koymadan önce mutlaka soğut; sıcak harç hamurdaki tereyağını eritir. Ceviz yerine fındık ya da badem kullanabilirsin; hepsini iri kırarak eklemek harca doku katar.

      '
  - t: Pişirme ve servis
    d: 'Turtanın kafes üstü kızardığında içinin de pişmiş olduğunu anlarsın; 180°C fırında bu 35-40 dakika sürer. Turtayı sıcakken kesmeye çalışma; harç henüz akışkandır ve dilimler dağılır. Biraz soğuyunca harç oturur, hamur da sıkılaşır. Sıcak servis etmek istersen dilimi vanilyalı dondurmayla birlikte tabağa al. Artanı üstü kapalı olarak saklayabilir, servis öncesi fırında kısa süre ısıtarak hamurun kıyırlığını tazeleyebilirsin. Kafesin üzerine sürülecek biraz yumurta sarısı kenarlara daha parlak bir renk verir, ama tarif bunu gerektirmez.

      '
  faq:
  - q: Elmalı turta kaç dakika pişer?
    a: 180°C fırında 35-40 dakika, üzeri kızarana kadar pişer.
  - q: Turta hamuru neden sert olur?
    a: Fazla yoğrulduğu ya da tereyağı eridiği için. Hamuru hızlıca topla ve 30 dakika buzdolabında dinlendir.
  - q: Elmalı turtanın altı neden hamur kalır?
    a: Elma harcı suyunu çekmeden konduğunda taban ıslanır. Harcı 8-10 dakika pişirip nişastayla bağla ve soğut.
  - q: Elmalı turtada ceviz yerine ne kullanılır?
    a: Fındık ya da badem kullanabilirsin.
ev-lavasi:
  aramaBasligi: 'Ev lavaşı tarifi: Mayasız, tavada pişen ince lavaş'
  intro: 'Lavaş, ince açılıp sıcak bir yüzeyde kısa sürede pişirilen yassı bir ekmek. Dürümün, tantuninin ve kebapların yanında en çok kullanılan ekmeklerden biri. Bu tarifteki lavaş mayasız olduğu için mayalanmasını beklemek gerekmiyor.


    Tarifte un, ılık su, zeytinyağı ve tuz yumuşak bir hamur olana kadar yoğrulup 10 dakika dinlendiriliyor. Hamur 8 bezeye bölünüyor ve her biri oklavayla çok ince, büyük daireler halinde açılıyor. Yağsız döküm tavada her yüzü kabarcıklanıp benekleninceye kadar 30-40 saniye pişiriliyor. Pişenler üst üste konup temiz bir bezle örtülerek yumuşak tutuluyor.


    8 kişilik tarif 8 lavaş çıkarıyor ve toplam 30 dakikada hazır: 15 dakika hazırlık, 15 dakika pişirme.

    '
  editorNote: 'Pişen lavaşları bezle örtme adımını ayrı yazdık; lavaşlar birbirinin buharıyla yumuşak kalıyor, açıkta bırakıldıklarında ise kısa sürede kuruyup kırılgan hale geliyor.

    '
  notes:
  - t: Hamurun dinlenmesi
    d: 'Yoğrulan hamur ilk anda gergindir ve açarken geri çeker. 10 dakikalık dinlenme, yoğurma sırasında gerilen glutenin gevşemesini sağlar; böylece hamur oklavayla çok ince açılırken yırtılmaz ve geri büzülmez. Hamuru dinlendirirken üzerini örtmek yüzeyinin kurumasını önler. Hamur yumuşak olmalı ama ele yapışmamalı; çok yapışkansa azar azar un ekle. Unun üçte biri yerine tam buğday unu kullanırsan hamura bir iki kaşık daha su gerekir.

      '
  - t: Tavanın ısısı
    d: 'Lavaşın kurumadan yumuşak kalması yüksek ısıda kısa süre pişmesine bağlı. Tava yeterince sıcak değilse lavaş kabarcıklanmadan nemini kaybeder, kurur ve katlarken çatlar. Döküm tava ısıyı iyi tuttuğu için en uygun seçenek. Tavayı yağlamaya gerek yok; yağ lavaşı kızartır ve dokusunu değiştirir. Her yüz için 30-40 saniye yeterli; kabarcıklar ve kahverengi benekler oluştuğunda çevir. Tavanın her lavaş arasında yeniden ısınmasına fırsat ver.

      '
  - t: Saklama ve kullanım
    d: 'Pişen lavaşları üst üste koyup temiz bir bezle örtmek, aralarında kalan buharla yumuşak kalmalarını sağlar. Tamamen soğuduktan sonra hava almayan bir poşette saklamak yumuşaklığını daha uzun korur. Kuruyan lavaşı birkaç saniye sıcak tavada ısıtmak ya da hafifçe nemlendirmek esnekliğini geri getirir. Lavaşlar dürüm, tantuni ve kebapların yanında kullanılabilir; mayasız olduğu için akşam yemeğinden hemen önce hazırlanabilir. Lavaşları dürüm için kullanacaksan ılıkken sarmak, soğumuş lavaşa göre çatlama riskini azaltır.

      '
  faq:
  - q: Lavaş tavada kaç saniye pişer?
    a: Her yüzü 30-40 saniye, kabarcıklanıp benekleninceye kadar pişer.
  - q: Lavaş neden kuruyup çatlar?
    a: Tava yeterince sıcak olmadığında lavaş pişmeden kurur. Döküm tavayı iyice ısıt ve pişenleri bezle ört.
  - q: Mayasız lavaş nasıl yumuşak kalır?
    a: Çok sıcak tavada kısa süre pişir, pişenleri üst üste koyup temiz bir bezle ört.
  - q: Lavaşta tam buğday unu kullanılır mı?
    a: Evet, unun üçte biri yerine tam buğday unu kullanabilirsin; suyu bir iki kaşık artır.
ev-usulu-ramen:
  aramaBasligi: 'Ev usulü ramen tarifi: Tavuk sulu, jöle kıvamında yumurtalı'
  intro: 'Ramen, et suyunun içinde erişte ve çeşitli üstlüklerle servis edilen bir Japon çorbası. Ramen dükkanlarında et suyu saatlerce kaynatılır; bu ev usulü tarif ise tavuk suyunu sarımsak, zencefil ve soya sosuyla demleyerek kısa sürede derin bir tat elde ediyor.


    Bu tarifte yumurtalar 6,5 dakika haşlanıp buzlu suya alınıyor, böylece sarısı jöle kıvamında kalıyor. Tavuk suyu sarımsak, zencefil ve soya sosuyla 15 dakika demleniyor; istersen miso ezmesi en sonda açılıyor. Erişte ayrı suda haşlanıp kâselere konuyor, üzerine sıcak et suyu dökülüyor; haşlanmış tavuk, mantar, ıspanak, yumurta, taze soğan ve susamla tamamlanıyor.


    2 kişilik tarif toplam 40 dakikada hazır: 15 dakika hazırlık, 25 dakika pişirme.

    '
  editorNote: 'Erişteyi et suyunda değil ayrı suda haşlamayı seçtik; eriştenin nişastası et suyunu bulandırıp koyulaştırmıyor ve erişte kâseye geldiğinde fazla yumuşamış olmuyor.

    '
  notes:
  - t: Yumurtanın kıvamı
    d: 'Ramendeki yumurtanın beyazı pişmiş, sarısı ise jöle kıvamında olmalı. Bunun için yumurtaları kaynar suya dikkatle bırakıp 6,5 dakika haşla, ardından hemen buzlu suya al. Buzlu su pişmeyi anında durdurur ve kabuğun daha kolay soyulmasına yardım eder. Buzdolabından yeni çıkmış yumurtalar sonucu biraz etkileyebilir, bu yüzden ilk denemede birini kesip kontrol edebilirsin. Yumurtaları soya-su karışımında bir gece marine edersen ajitama denen tatlı-tuzlu yumurtayı elde edersin.

      '
  - t: Et suyunu demlemek
    d: 'Ramenin kalbi et suyu; kendi hazırladığın tavuk suyunu kullanırsan tat belirgin biçimde derinleşir. Sarımsak ve zencefili ezerek ya da dilimleyerek eklemek aromalarını suya daha hızlı verir. Et suyunu fokurdatmadan, hafif kaynayarak 15 dakika demlemek yeterli. Miso''yu en sonda, ocak kısılmışken bir kepçe et suyunda açıp tencereye eklemek topaklanmasını önler ve kaynayıp aromasını kaybetmesine engel olur. Soya sosu tuzlu olduğu için ayrıca tuz eklemeden önce tadına bak.

      '
  - t: Üstlükler ve alternatifler
    d: 'Kâseyi kurarken önce erişteyi koyup üzerine sıcak et suyunu dökmek, ıspanağın sıcaklıkla kendiliğinden solmasını sağlar. Mantarları çiğ koyabilir ya da kısa süre tavada çevirebilirsin. Ramen eriştesi bulamazsan fettuccine ya da tagliatelle kullanılabilir; glutensiz bir kâse için pirinç eriştesi ve soya sosu yerine tamari tercih et. Taze zencefil yoksa dörtte bir ölçü toz zencefil yeterli. Tavuk göğsü yerine tavuk but daha sulu kalır.

      '
  faq:
  - q: Ramen yumurtası kaç dakika haşlanır?
    a: Kaynar suda 6,5 dakika haşlanıp buzlu suya alınır; sarısı jöle kıvamında kalır.
  - q: Ramende hangi erişte kullanılır?
    a: Ramen eriştesi. Bulamazsan fettuccine ya da tagliatelle, glutensiz için pirinç eriştesi kullanabilirsin.
  - q: Ramen et suyu nasıl yapılır?
    a: Tavuk suyunu sarımsak, zencefil ve soya sosuyla 15 dakika demle; miso ezmesi kullanıyorsan en sonda aç.
  - q: Ramende soya sosu yerine ne kullanılır?
    a: Glutensiz tüketiyorsan tamari; yoksa biraz tuz ve bir kaşık pekmez.
ev-yapimi-burger:
  aramaBasligi: 'Ev yapımı burger tarifi: Karamelize soğanlı, çedarlı'
  intro: 'Ev yapımı burger, yağlı dana kıymadan hazırlanan köftenin kızgın tavada pişirilip ekmek, peynir, sebze ve sosla bir araya geldiği bir tabak. Hamburgercideki tadı evde yakalamanın sırrı, yüzde 20 yağlı kıyma ve çok kızgın bir döküm tava.


    Bu tarifte önce soğan tereyağında kısık ateşte karamelize ediliyor. Kıyma fazla yoğrulmadan 4 eşit parçaya bölünüp ekmekten biraz büyük, ortası hafif çukur yassı köfteler yapılıyor; tuz ve karabiber pişirmeden hemen önce serpiliyor. Köfteler döküm tavada her yüzü 3 dakika pişiriliyor, son dakikada üzerine çedar konup kapak kapatılıyor. Mayonez, ketçap, hardal ve turşuyla hazırlanan sos burgeri tamamlıyor.


    4 kişilik tarif toplam 30 dakikada hazır: 15 dakika hazırlık, 15 dakika pişirme. Airfryer''da köfteler 200°C''de 9-11 dakikada pişer.

    '
  editorNote: 'Tuzu kıymaya yoğururken değil, pişirmeden hemen önce serpmeyi tarife özellikle yazdık; kıymaya erken karışan tuz eti sıkılaştırıp burgeri köfte dokusuna yaklaştırıyor.

    '
  notes:
  - t: Kıyma ve köfte şekli
    d: 'Yüzde 20 yağlı kıyma, pişerken eriyen yağıyla köftenin sulu kalmasını sağlar; daha yağsız kıyma kuru ve sert bir burger verir. Kıymayı yalnızca şekil verecek kadar elle; fazla yoğurmak lifleri sıkılaştırır ve burgeri sertleştirir. Köfteleri ekmekten biraz büyük yapmak gerekir, çünkü pişerken çekip küçülürler. Ortadaki hafif çukur, köftenin pişerken ortasından şişip top gibi olmasını engeller ve düz kalmasını sağlar. Köfteleri şekillendirdikten sonra pişirene kadar buzdolabında tutmak, tavada dağılmadan durmalarına yardım eder.

      '
  - t: Kızgın tava ve pişirme
    d: 'Döküm tavayı köfteyi koymadan önce çok iyi ısıtmak, köftenin yüzeyinde koyu, kıtır bir kabuk oluşmasını sağlar; burgerin tadının büyük kısmı bu kabuktan gelir. Köfteyi tavaya koyduktan sonra sürekli çevirme ya da spatulayla bastırma; bastırmak suyunu dışarı akıtır. Her yüzü 3 dakika pişirmek yeterli. Son dakikada çedarı koyup kapağı kapatmak, buharla peynirin eşit erimesini sağlar. Ekmeklerin iç yüzünü kızartmak sosun ekmeği ıslatmasını geciktirir.

      '
  - t: Karamelize soğan ve sos
    d: 'Soğanı karamelize etmenin tek kuralı sabır. Kısık ateşte, ara ara karıştırarak 12 dakika pişen soğan şekerini salıp altın rengine döner ve tatlı bir tat kazanır. Ateşi yükseltirsen soğan karamelize olmak yerine kenarlarından yanar. Sos için mayonez, ketçap, hardal ve ince kıyılmış turşuyu karıştırmak yeterli; önceden hazırlayıp buzdolabında bekletmek tatların oturmasını sağlar. Daha hafif bir sos için mayonez yerine süzme yoğurt kullanabilirsin.

      '
  faq:
  - q: Burger köftesi kaç dakika pişer?
    a: Çok kızgın döküm tavada her yüzü 3 dakika, toplam 6-7 dakika pişer.
  - q: Burger için kıyma kaç yağlı olmalı?
    a: Yüzde 20 yağlı dana kıyma, köftenin sulu kalmasını sağlar.
  - q: Burger köftesi pişerken neden şişer?
    a: Köftenin ortası pişerken kabarır. Ortasını hafifçe çukurlaştırmak bunu engeller.
  - q: Burger airfryer'da yapılır mı?
    a: Evet. Köfteleri 200°C'de 9-11 dakika, yarısında çevirerek pişir; son 1 dakikada peyniri koy.
ev-yapimi-dondurma:
  aramaBasligi: 'Makinesiz ev yapımı dondurma tarifi: Karıştırmadan donan'
  intro: 'Bu ev yapımı dondurma, dondurma makinesi gerektirmeyen ve dondurucuda beklerken her yarım saatte karıştırılmak zorunda olmayan bir yöntemle hazırlanıyor. Çırpılmış kremanın içine hapsolan hava, dondurmanın buz kalıbı gibi değil, kaşıklanabilir bir dokuda donmasını sağlıyor.


    Bu tarifte soğuk sıvı krema pudra şekeriyle yumuşak tepe olana kadar çırpılıyor. Süzme yoğurt ya da mascarpone ve vanilin eklenip 30 saniye daha çırpılıyor. İstersen ezilmiş çilek ya da vişne spatulayla dalga dalga katılıyor. Karışım kapaklı kaba ya da baton kalıba dökülüp yüzeyi streçle kapatılarak en az 6 saat dondurucuda bekletiliyor.


    8 kişilik tarifin hazırlığı 15 dakika; pişirme yok. Buna dondurucuda en az 6 saatlik bekleme ekleniyor.

    '
  editorNote: 'Kremayı yumuşak tepe aşamasında bırakmayı seçtik; fazla çırpılan krema yoğurtla karışırken taneleniyor, yumuşak tepe ise karışıma hava taşıyıp pürüzsüz kalıyor.

    '
  notes:
  - t: Soğukluk ve çırpma
    d: 'Krema ne kadar soğuksa o kadar iyi kabarır; kremayı çırpmadan hemen önce buzdolabından çıkar, mümkünse kabı ve mikserin uçlarını da önceden soğut. Yumuşak tepe, mikseri kaldırdığında kremanın ucunun hafifçe kıvrılıp düştüğü aşamadır. Bu aşamadan sonra fazla çırparsan krema tanecikli bir hal alır ve sonunda tereyağına dönmeye başlar. Yoğurdu ekledikten sonra yalnızca 30 saniye çırpmak, içerideki havanın kaçmasını önler. Yaz günlerinde mutfak sıcaksa çırpma kabını buzlu suyla dolu daha büyük bir kabın içine koymak işini kolaylaştırır.

      '
  - t: Pürüzsüz doku için
    d: 'Makinesiz dondurmada asıl sorun buz kristalleri. Yağlı süzme yoğurt ya da mascarpone, karışımdaki yağ oranını yükselterek kristalleşmeyi azaltır ve dondurmanın sertleşmeden kaşıklanmasını sağlar. Pudra şekeri toz şekere göre kremada daha kolay erir ve dokuda tanecik bırakmaz; elinde yoksa toz şekeri blenderda 1 dakika çekerek pudra şekeri yapabilirsin. Yüzeye doğrudan streç film yapıştırmak da üstte buz tabakası oluşmasını engeller. Dondurmayı geniş ve sığ bir kap yerine baton kalıpta dondurmak, servis ederken düzgün dilim ya da top almayı kolaylaştırır.

      '
  - t: Meyve eklemek ve servis
    d: 'Meyve dondurmaya lezzet katar ama suyu fazlaysa donarken buz kristali oluşturur. Bunu önlemek için çilek ya da vişneyi önce şekerle birkaç dakika pişirip soğutabilirsin; pişirmek suyunu azaltır ve tadını yoğunlaştırır. Meyveyi tamamen karıştırmak yerine spatulayla dalga dalga katmak hem görüntüyü güzelleştirir hem de dokuyu korur. Servisten 5 dakika önce dondurucudan çıkarmak ve kaşığı sıcak suya batırarak top yapmak düzgün toplar almanı sağlar.

      '
  faq:
  - q: Ev yapımı dondurma kaç saatte donar?
    a: En az 6 saat dondurucuda bekletilmeli.
  - q: Makinesiz dondurma neden buz tutar?
    a: Krema yeterince çırpılmadıysa ya da meyve çok sulu eklendiyse buz kristali oluşur. Yağlı süzme yoğurt ve yüzeye yapıştırılan streç bunu azaltır.
  - q: Dondurmada mascarpone yerine ne kullanılır?
    a: Süzme yoğurt ya da labne kullanabilirsin; daha hafif olsun istersen yarı yarıya krem peynir ve çırpılmış krema.
  - q: Ev yapımı dondurma nasıl kolay kaşıklanır?
    a: Servisten 5 dakika önce dondurucudan çıkar ve kaşığı sıcak suya batırarak top yap.
ev-yapimi-yas-pasta:
  aramaBasligi: 'Ev yapımı yaş pasta tarifi: Muzlu, çilekli pandispanyayla'
  intro: 'Yaş pasta, pandispanya katlarının şekerli sütle ıslatılıp krema ve meyveyle doldurulduğu, doğum günlerinin en bilinen pastası. Pastaneden almak yerine evde yapmak birkaç aşama gerektirir ama her aşama kendi içinde basittir.


    Bu tarifte pandispanya için yumurta ve şeker 8-10 dakika çırpılıp üç katına çıkarılıyor, un ve kabartma tozu spatulayla katılıyor ve 24 cm kalıpta 170°C''de pişiriliyor. Süt, şeker, un, nişasta ve yumurta sarısıyla pişirilen muhallebi soğuyunca çırpılmış kremayla birleştiriliyor. Kek üç kata bölünüyor, her kat şekerli sütle ıslatılıp krema, muz ve çilekle dolduruluyor; pasta dışından da kremayla kaplanıyor.


    12 kişilik pastanın hazırlığı 50 dakika, pişirmesi 30 dakika; toplam 80 dakika. Buna en az 4 saatlik buzdolabı dinlenmesi ekleniyor.

    '
  editorNote: 'Pandispanyada kabartma tozu olsa da asıl kabarmayı 8-10 dakikalık yumurta çırpma adımına bıraktık; pastanın hafif ve süngerimsi olmasını sağlayan şey yumurtaya giren hava.

    '
  notes:
  - t: Pandispanyanın kabarması
    d: 'Yumurta ve şekeri rengi açılıp üç katına çıkana kadar çırpmak, pandispanyanın iskeletini oluşturan havayı karışıma katar; bu yüzden 8-10 dakikalık çırpma süresini kısaltma. Elenmiş unu spatulayla alttan üste, yavaş hareketlerle katmak bu havanın kaçmasını önler; mikserle karıştırırsan karışım söner. Fırında ilk 20 dakika kapağı açmamak da önemli, çünkü ani sıcaklık düşüşü kekin ortasının çökmesine neden olabilir. Keki bir gün önce pişirirsen daha kolay kesilir.

      '
  - t: Kremanın kıvamı
    d: 'Muhallebi koyulaşana kadar pişirildikten sonra üzerine streç film yapıştırılarak soğutulur; streç yüzeyde kabuk oluşmasını engeller. Çırpılmış kremayı muhallebi tamamen soğuduktan sonra eklemek gerekir; ılık muhallebi kremayı eritir ve pasta akar. 200 ml kremanın soğuk olması iyi kabarması için şart. Muhallebiyi kremayla birleştirdikten sonra mikserle kısa süre çırpmak pürüzsüz, sürülebilir bir krema verir. Bu krema hem katlar arasına hem de pastanın dışına yetecek miktardadır.

      '
  - t: Islatma, kat ve dinlendirme
    d: 'Keki üç kata bölmek için tamamen soğumuş olması gerekir; sıcak kek ufalanır. Şekerli sütü katlara kaşıkla eşit dağıt; fazla ıslatılan kat dağılır, az ıslatılan ise kuru kalır. Muzları kararmaması için son anda dilimle. Pastanın en az 4 saat buzdolabında dinlenmesi katların krema ve sütle birleşip yumuşamasını sağlar; bu süre olmadan dilimler düzgün kesilmez. Krema içerdiği için pastayı buzdolabında sakla ve uzun süre dışarıda bekletme.

      '
  faq:
  - q: Yaş pasta pandispanyası kaç dakika pişer?
    a: 24 cm kalıpta 170°C fırında 30 dakika pişer; ilk 20 dakika fırın kapağını açma.
  - q: Pandispanya neden kabarmaz?
    a: Yumurta ve şeker yeterince çırpılmadığında ya da un karıştırılırken karışım söndüğünde. Yumurtayı 8-10 dakika çırp ve unu spatulayla alttan üste kat.
  - q: Yaş pasta kaç saat dinlenmeli?
    a: En az 4 saat buzdolabında dinlendirilmeli.
  - q: Yaş pasta bir gün önceden hazırlanır mı?
    a: Keki bir gün önce pişirmek kesmeyi kolaylaştırır. Kremayı ve katları servis gününden en az 4 saat önce tamamla.
falafel:
  aramaBasligi: 'Falafel tarifi: Kuru nohuttan çıtır, tahin soslu'
  intro: 'Falafel, ıslatılmış nohudun yeşillik ve baharatlarla çekilip kızartılmasıyla yapılan, Ortadoğu mutfağının en bilinen sokak lezzetlerinden biri. Dışı çıtır, içi yeşil ve yumuşak olur; lavaşa dürüm yapılabilir, salataya protein olarak eklenebilir ya da meze tabağında servis edilebilir.


    Bu tarifte kuru nohut bir gece ıslatılıyor ama haşlanmıyor. Soğan, sarımsak, maydanoz, isteğe bağlı kişniş, kimyon ve kişniş tohumuyla robotta iri kum kıvamına çekiliyor, karbonat eklenip 30 dakika buzdolabında dinlendiriliyor. Yanına tahin, limon suyu ve sudan oluşan hafif bir sos geliyor.


    4 kişilik tarif 20 dakika hazırlık ve 15 dakika pişirmeyle toplam 35 dakika sürüyor; buna harcın 30 dakikalık dinlenmesi ve önceki gecenin ıslatması ekleniyor.

    '
  editorNote: 'Nohudun haşlanmadan, yalnızca ıslatılarak kullanılacağını hem malzeme listesine hem ilk adıma ayrıca yazdık, çünkü falafelin yağda dağılmasının en sık nedeni haşlanmış nohut. Dinlendirme adımını da ayrı tuttuk; harcın sıkılaşması için zaman gerekiyor.

    '
  notes:
  - t: Neden haşlanmamış nohut?
    d: 'Islatılmış çiğ nohut, çekildiğinde nişastasını ve sıkı yapısını korur; kızarırken bu yapı harcı bir arada tutar. Haşlanmış ya da konserve nohut ise fazla nem ve yumuşak bir doku getirir, toplar kızgın yağa girdiğinde dağılmaya başlar. İkame listesindeki konserve nohut seçeneği pratik görünse de kızartmada riskli; kullanacaksan köfteleri yassı yapıp fırında ya da airfryer''da pişirmek daha güvenli. Nohudu ıslatmayı unuttuysan aynı gün için iyi bir kestirme yok, en sağlamı bir gece önceden suya koymak.

      '
  - t: Harcın doğru kıvamı
    d: 'Robotu fazla çalıştırıp macun gibi bir hamur elde edersen falafelin içi yoğun ve hamursu olur; çok iri bırakırsan toplar şekil tutmaz. Doğru kıvam, avucunda sıktığında bir arada duran ama tanecikleri hissedilen iri kum gibi bir harç. Robotu kısa aralıklarla çalıştırıp kenarlara yapışanları spatulayla indirmek eşit bir doku verir. Dinlendirme sonrası harç biraz daha sıkılaşır; şekil verirken ellerini hafifçe ıslatmak yapışmayı azaltır. Ceviz büyüklüğünde toplar eşit pişer, yassı köfteler daha çabuk kızarır.

      '
  - t: Kızartma ve servis
    d: 'Yağın yeterince kızgın olması çıtırlığın anahtarı. Soğuk yağa giren falafel yağ çeker ve dağılmaya başlar. Tavayı kalabalık etmeden, parti parti yaklaşık 4 dakika koyu altın rengi olana kadar kızart ve kâğıt havluya al. Tahin sosu ilk karıştırmada koyulaşıp kesilmiş gibi görünebilir; suyu yavaş yavaş ekleyip çırpmaya devam edince akışkanlaşır. Falafel en iyi sıcakken yenir; artanları ertesi gün fırında ya da airfryer''da kısa süre ısıtırsan çıtırlığının bir kısmı geri gelir.

      '
  faq:
  - q: Falafel neden dağılır?
    a: Genellikle haşlanmış ya da konserve nohut kullanıldığı ya da yağ yeterince kızgın olmadığı için. Bu tarifte nohut yalnızca ıslatılıyor ve harç 30 dakika buzdolabında dinlendiriliyor; bu iki adım dağılmayı önler.
  - q: Falafel için nohut ne kadar ıslatılır?
    a: Tarifte kuru nohut bir gece suda bekletiliyor. Nohut suyu çekip şişmeli ama haşlanmamalı.
  - q: Falafel airfryer'da yapılır mı?
    a: Evet. Topları hafifçe yassılaştırıp yağ sprey et, 190°C'de 12-14 dakika, yarısında çevirerek pişir.
  - q: Falafel kaç dakika kızartılır?
    a: Kızgın yağda her parti yaklaşık 4 dakika, koyu altın rengi olana kadar kızartılır.
fattus:
  aramaBasligi: 'Fattuş tarifi: Çıtır lavaşlı, nar ekşili salata'
  intro: 'Fattuş, kızarmış ekmek parçalarının taze sebzeler ve ekşi bir sosla buluştuğu bir Levant salatası. Bayat lavaş ya da pideyi değerlendirmenin en lezzetli yollarından biri; marul, domates, salatalık, turp, maydanoz, nane ve taze soğan salataya bol ve ferah bir doku veriyor.


    Bu tarifte lavaş az zeytinyağıyla fırında ya da tavada çıtırlaşana kadar kızartılıyor. Sos zeytinyağı, limon suyu, nar ekşisi, sumak, sarımsak ve tuzla hazırlanıyor. Ekmek salataya servisten hemen önce ekleniyor ki yumuşamasın, üzerine de sumak serpiliyor.


    4 kişilik fattuş 15 dakika hazırlık ve 5 dakika pişirmeyle toplam 20 dakikada hazır. Izgara etlerin yanına ya da tek başına hafif bir öğle yemeği olarak uygun.

    '
  editorNote: 'Ekmeği kızartma adımını en başa, salataya eklemeyi ise en sona yazdık; fattuşun karakteri ekmeğin çıtırlığında ve sosla erken buluşan lavaş birkaç dakikada yumuşuyor.

    '
  notes:
  - t: Ekmeği çıtır tutmak
    d: 'Lavaşı yağa boğmadan, az zeytinyağıyla kurutarak kızartmak gerekir; fazla yağ ekmeğin sosu daha hızlı emmesine yol açar. Parçalar renk alınca hemen tavadan ya da fırından al ve tamamen soğumaya bırak, çünkü sıcak ekmek salatanın içinde buhar yapar. Salatayı önceden hazırlamak istiyorsan sebzeleri ve sosu ayrı kaplarda, kızarmış ekmeği de ayrı bir kutuda sakla. Ofise götürürken de aynı yöntem geçerli: sos ve ekmek yemekten hemen önce eklenirse salata ilk hazırlandığı andaki gibi çıtır olur.

      '
  - t: Sosun ekşi dengesi
    d: 'Fattuşun sosunda üç ekşi kaynak var: limon suyu, nar ekşisi ve sumak. Nar ekşilerinin tatlılığı ve ekşiliği birbirinden epey farklı olabildiği için önce tarifteki 1 yemek kaşığıyla başlayıp tadına bakmak iyi olur. Sumak hem sosun içinde hem de servis anında üstte kullanılıyor; üstteki sumak renk ve koku verir. Nar ekşisi yoksa limon suyuna bir tatlı kaşığı bal ya da pekmez ekleyebilirsin. Ezilmiş sarımsağı sosta birkaç dakika bekletmek aromasının sosa yayılmasını sağlar.

      '
  - t: Sebzeleri hazırlamak
    d: 'Sebzeleri iri doğramak fattuşa özgü bir ayrıntı; küçük doğranmış sebzeler çabuk su salar ve ekmeği ıslatır. Domatesin çok sulu çekirdekli kısmını bir miktar ayıklamak salatanın dibinde su birikmesini azaltır. Marul, nane ve maydanozu yıkadıktan sonra iyice kurulamak gerekir; ıslak yapraklar sosu tutmaz ve salatayı sulandırır. Turp hem hafif acılık hem çıtırlık katar, atlamamaya çalış. Nane ve maydanozu son anda kıymak tazeliklerini korur. Lavaş yerine tortilla ya da yufka da kullanılabilir.

      '
  faq:
  - q: Fattuş sosu nasıl yapılır?
    a: 4 yemek kaşığı zeytinyağı, 1 limonun suyu, 1 yemek kaşığı nar ekşisi, 1 tatlı kaşığı sumak, 1 diş ezilmiş sarımsak ve yarım tatlı kaşığı tuzu çırpman yeterli.
  - q: Fattuşta lavaş yerine ne kullanılır?
    a: Pide, tortilla ya da yufka kullanabilirsin. Hangisini seçersen seç, az zeytinyağıyla çıtırlaşana kadar kızart.
  - q: Fattuş önceden hazırlanır mı?
    a: Sebzeleri ve sosu önceden ayrı ayrı hazırlayabilirsin. Kızarmış ekmeği ise servisten hemen önce ekle, yoksa yumuşar.
  - q: Fattuşun çoban salatasından farkı nedir?
    a: Fattuşta kızarmış lavaş parçaları, turp, nane, nar ekşisi ve sumak bulunur. Ekmek salataya hem doku hem doyuruculuk katar.
firik-pilavi:
  aramaBasligi: 'Firik pilavı tarifi: Salçalı, biberli Antep usulü'
  intro: 'Firik, henüz tam olgunlaşmamış yeşil buğdayın ateşte kavrulmasıyla elde edilen, isli aromalı bir tahıl. Güneydoğu Anadolu mutfağında, özellikle Gaziantep''te pilavı sevilerek yapılır. Görünüşü bulgura benzese de tadı daha derin ve hafif dumanlıdır.


    Bu tarifte firik önce birkaç kez yıkanıp süzülüyor. Soğan ve sivri biber tereyağı ile zeytinyağında yumuşatılıyor, biber salçası ve rendelenmiş domatesle kavruluyor. Firik bu karışımda 2 dakika çevrildikten sonra sıcak et suyu ya da suyla kısık ateşte suyunu çekene kadar pişiyor ve 10 dakika demleniyor.


    4 kişilik pilav 10 dakika hazırlık ve 30 dakika pişirmeyle toplam 40 dakika sürüyor. Kuzu ya da tavukla servis edildiğinde doyurucu bir sofra oluyor.

    '
  editorNote: 'Firiği yıkama adımını ayrı yazdık, çünkü kavrulmuş tanelerdeki toz ve kabuk kalıntıları pilavın suyunu bulandırıp tadını ağırlaştırabiliyor. Suyun sıcak eklenmesini de özellikle belirttik; soğuk su pişme ritmini bozuyor.

    '
  notes:
  - t: Su oranı ve pişirme
    d: 'Tarifte 1,5 su bardağı firiğe 3 su bardağı sıcak et suyu ya da su kullanılıyor, yani oran yaklaşık bire iki. Firik bulgurdan daha sert bir tahıl olduğu için kısık ateşte yaklaşık 25 dakika pişmesi gerekiyor. Bu sürede kapağı sık açmamak buharın kaçmamasını sağlar. Su bittiğinde taneler hâlâ sert geliyorsa çok az sıcak su ekleyip birkaç dakika daha pişirebilirsin. Suyu soğuk eklemek pişmeyi yavaşlatır ve tanelerin bir kısmı dağılırken bir kısmı çiğ kalabilir.

      '
  - t: İsli aromayı korumak
    d: 'Firik pilavını özel kılan, tanelerin dumanlı tadı. Bu yüzden salçayı tarifteki ölçünün üstüne çıkarmamak iyi olur; fazla salça isli aromayı bastırır ve pilavı yemek gibi ağırlaştırır. Firiği salçalı karışımda 2 dakika çevirmek tanelerin yağla kaplanmasını ve pişerken birbirine yapışmamasını sağlar. Et suyu pilava derinlik katar; yalnızca su kullanacaksan sıcak suya bir tatlı kaşığı tereyağı ve bir tutam tuz eklemek ya da yarım bulyon kullanmak lezzeti dengeler.

      '
  - t: Demlendirme ve servis
    d: 'Ocaktan alınan firik pilavı 10 dakika demlenmeden servis edilirse taneler nemli ve dağınık olur. Demlenirken kapağın altına temiz bir kâğıt havlu koymak fazla buharı emer ve taneleri tane tane bırakır. Pilavı karıştırırken çatal kullanmak taneleri ezmeden kabartır. Firik, kuzu ve tavuk yemeklerinin yanına çok yakışır; yanına yoğurt ya da cacık eklemek isli tadı dengeler. Artan pilavı buzdolabında kapalı kapta saklayabilir, ısıtırken birkaç kaşık su ekleyebilirsin.

      '
  faq:
  - q: Firik pilavı kaç dakika pişer?
    a: Kısık ateşte yaklaşık 25 dakika, suyunu çekene kadar pişer. Ardından ocaktan alıp 10 dakika demlendirmek gerekir.
  - q: Firik pilavının suyu ne kadar olmalı?
    a: Bu tarifte 1,5 su bardağı firik için 3 su bardağı sıcak et suyu ya da su kullanılıyor.
  - q: Firik ile bulgurun farkı nedir?
    a: Firik olgunlaşmamış yeşil buğdayın ateşte kavrulmasıyla elde edilir, bu yüzden isli bir tadı vardır. Bulgur ise haşlanıp kurutulmuş buğdayın kırılmasıyla yapılır.
  - q: Firik yıkanır mı?
    a: Evet. Firiği pişirmeden önce bol suyla birkaç kez yıkayıp süzmek gerekir.
firinda-kasarli-mantar:
  aramaBasligi: 'Fırında kaşarlı mantar tarifi: Tereyağlı, 20 dakikada'
  intro: 'Fırında kaşarlı mantar, meyhane ve kebapçı sofralarının bilinen ara sıcaklarından biri: tereyağında sotelenmiş mantar, sarımsak ve biberle tatlandırılıp toprak kapta erimiş kaşarla fırından çıkıyor.


    Bu tarifte 400 g kültür mantarı dilimlenip yüksek ateşte suyunu salıp çekene kadar tereyağında sotelenir. Ardından sivri biber ve sarımsak eklenip 2 dakika çevrilir, tuz, karabiber ve kekikle tatlandırılır. Karışım toprak kaplara paylaştırılıp rendelenmiş kaşarla 200°C fırında kaşar eriyip kızarana kadar pişer.


    2 kişilik tarif 5 dakika hazırlık ve 15 dakika pişirmeyle toplam 20 dakikada hazır. Toprak kabın yoksa küçük fırın kapları ya da kapaklı bir tava da iş görür.

    '
  editorNote: 'Mantarı fırına vermeden önce tavada suyunu çektirme adımını ayrı ve süreli yazdık; bu adım atlanırsa mantar fırında su salıyor ve kaşar sulu bir karışımın üzerinde eriyor.

    '
  notes:
  - t: Mantarı sulandırmamak
    d: 'Mantar süngerimsi bir yapıya sahip ve suyu kolay emer. Bu yüzden yıkamak yerine nemli bir bezle silmek gerekir; yıkanmış mantar tavada önce kendi suyunda haşlanır. Sotelerken ateşi yüksek tutmak ve tavayı kalabalık etmemek de önemli; tava doluysa mantarı iki seferde pişir. Tarifte tuz, mantar suyunu çektikten sonra biber ve sarımsakla birlikte ekleniyor. Tuzu en başta eklersen mantar daha fazla su salar ve kızarmak yerine haşlanmış gibi kalır.

      '
  - t: Peynir seçimi ve tuz dengesi
    d: 'Tarifte 100 g rendelenmiş kaşar kullanılıyor. Taze kaşar daha iyi erir ve uzar; eski kaşar daha keskin ve tuzlu bir tat verir. Eski kaşar kullanıyorsan mantara eklediğin tuzu biraz azaltmak iyi olur, çünkü peynir de tuz getirir. Peyniri kaba rendelemek, fırında daha eşit erimesini sağlar. Mantarı toprak kaplara paylaştırırken çok bastırma; aradaki boşluklar peynirin içeri doğru erimesine izin verir. Kültür mantarı yerine istiridye ya da kestane mantarı da kullanılabilir.

      '
  - t: Tavada ve airfryer'da yapmak
    d: 'Fırının yoksa mantarı aynı tavada soteledikten sonra üzerine kaşarı serpip kapağı kapatman yeterli; kalan ısı ve buhar kaşarı eritir. Bu yöntemde peynir kızarmaz ama birkaç dakikada erir. Airfryer kullanıyorsan doldurulmuş mantarları ya da hazırladığın karışımı sepete yerleştirip 180°C''de 8-10 dakika, kaşar eriyip kızarana kadar pişirebilirsin. Kaşarlı mantar en iyi fırından çıkar çıkmaz yenir; bekledikçe peynir sertleşir. Yanına taze ekmek koymak, kaptaki tereyağlı suyu değerlendirmenin en iyi yolu.

      '
  faq:
  - q: Fırında kaşarlı mantar kaç derecede pişer?
    a: Sotelenmiş mantar ve kaşar 200°C fırında yaklaşık 7 dakika, kaşar eriyip kızarana kadar pişer.
  - q: Mantar yıkanır mı?
    a: Bu tarifte mantarı yıkamak yerine nemli bezle silmeni öneriyoruz. Yıkanan mantar su çeker ve tavada sulanır.
  - q: Kaşarlı mantar tavada yapılır mı?
    a: Evet. Mantarı soteledikten sonra üzerine kaşarı serp ve tavanın kapağını kapat; kaşar birkaç dakikada erir.
  - q: Kaşarlı mantar için hangi mantar kullanılır?
    a: Tarifte kültür mantarı kullanılıyor. İstiridye ya da kestane mantarı da aynı şekilde olur.
firinda-tatli-patates-ve-nohut:
  aramaBasligi: 'Fırında tatlı patates ve nohut tarifi: Tahinli soslu'
  intro: 'Tatlı patates ve nohudun aynı tepside baharatla kızardığı, üzerine limonlu tahin sosu gezdirilen etsiz ama doyurucu bir fırın yemeği. Roka yatağında, nar taneleri ve maydanozla servis ediliyor; tatlı, ekşi ve baharatlı tatlar aynı tabakta buluşuyor.


    Tatlı patatesler kabuğuyla iri küp doğranıyor, nohutlar süzülüp kurulanıyor ve kırmızı soğanla birlikte zeytinyağı, kimyon, tatlı toz biber, pul biber ve tuzla tepsiye tek kat yayılıyor. 210°C fırında, yarısında bir kez karıştırılarak pişiyor. Sos tahin, limon suyu, sarımsak, su ve tuzla birkaç dakikada hazırlanıyor.


    3 kişilik tarif 10 dakika hazırlık ve 30 dakika pişirmeyle toplam 40 dakika sürüyor. Fırına verdikten sonra seni bekleten pek bir iş kalmıyor.

    '
  editorNote: 'Nohutları kâğıt havluyla kurulamayı hazırlık adımına ayrıca ekledik, çünkü ıslak nohut fırında çıtırlaşmak yerine buharda pişiyor. Sosu da fırın çalışırken hazırlanacak şekilde sona yerleştirdik.

    '
  notes:
  - t: Tepsiyi tek kat yaymak
    d: 'Tatlı patates ve nohudun kızarması için aralarında hava dolaşması gerekir. Tepsi kalabalık olursa sebzeler birbirinin buharında pişer, yumuşar ama renk almaz. Malzemeler tepsine sığmıyorsa iki tepsi kullanmak daha iyi sonuç verir. Yarısında bir kez karıştırmak her yüzün eşit kızarmasını sağlar. Tatlı patatesi kabuğuyla doğramak hem zaman kazandırır hem de küplerin fırında şeklini korumasına yardım eder. Küpleri olabildiğince eşit boyda kesersen hepsi aynı anda pişer.

      '
  - t: Tahin sosunun kıvamı
    d: 'Tahine limon suyu eklediğinde sos önce koyulaşıp kesilmiş gibi görünebilir; bu normal. Suyu kaşık kaşık ekleyip karıştırmaya devam ettiğinde pürüzsüz ve akışkan bir kıvama gelir. Tarifteki 3 yemek kaşığı su genelde yeterli, ama tahinin yoğunluğuna göre biraz daha gerekebilir. Sos, kaşıktan şerit halinde akacak kıvamda olmalı. Ezilmiş sarımsak sosa keskinlik verir; daha yumuşak bir tat istiyorsan sarımsağı azaltabilirsin. Limon yerine misket limonu ya da yarı ölçü elma sirkesi de olur.

      '
  - t: Ofis kutusu ve saklama
    d: 'Bu yemek ertesi gün öğle yemeği için uygun, ama bileşenleri ayrı tutmak gerekir. Tahinli sosu ayrı bir kapta götür; önceden dökülen sos tatlı patatesi yumuşatır. Roka ya da ıspanak sıcak sebzeyle temas edince söner, bu yüzden yeşillikleri de yemekten hemen önce ekle. Fırın karışımı soğuk da yenebilir; ısıtmak istersen fırında ya da airfryer''da kısa süre ısıtmak nohudun çıtırlığını mikrodalgaya göre daha iyi korur. Ispanak yerine pazı da kullanabilirsin.

      '
  faq:
  - q: Fırında tatlı patates kaç dakikada pişer?
    a: Bu tarifte iri küp doğranmış tatlı patatesler 210°C fırında yaklaşık 30 dakikada, yarısında bir kez karıştırılarak pişer.
  - q: Fırında nohut nasıl çıtır olur?
    a: Nohutları süzüp kâğıt havluyla iyice kurula ve tepside tek kat yay. Islak ya da üst üste duran nohut çıtırlaşmaz.
  - q: Tatlı patates soyulur mu?
    a: Bu tarifte tatlı patatesler kabuğuyla iri küp doğranıyor. İyice yıkaman yeterli.
  - q: Tatlı patates ve nohut airfryer'da yapılır mı?
    a: Evet. Tatlı patates ve nohutları tek kat yayıp 200°C'de 18-20 dakika, arada sallayarak pişir.
firinda-tavuklu-patates:
  aramaBasligi: 'Fırında tavuklu patates tarifi: Tek tepside salçalı baget'
  intro: 'Fırında tavuklu patates, tavuk baget, patates ve sebzelerin aynı tepside salçalı bir sosla piştiği, evlerin en pratik fırın yemeklerinden biri. Az bulaşıkla kalabalık bir sofrayı doyurur; hazırlık bittikten sonra işi fırın yapar.


    Bu tarifte 6 tavuk baget; elma dilim patates, iri doğranmış soğan, halka sivri ve kapya biber ve dilim domatesle birlikte biber salçası, zeytinyağı, sıcak su, kekik, pul biber ve tuzdan oluşan sosla karıştırılıyor. Tepsi önce folyoyla kapalı olarak 200°C''de 30 dakika, ardından folyo açılarak 20 dakika daha pişiyor.


    4 kişilik yemek 15 dakika hazırlık ve 50 dakika pişirmeyle toplam 1 saat 5 dakikada hazır. Yanına yoğurt ya da bir salata yeterli.

    '
  editorNote: 'Pişirmeyi folyolu ve folyosuz iki aşamaya ayırdık: ilk 30 dakikada tavuk ve patates kendi buharında yumuşuyor, son 20 dakikada ise üstleri kızarıyor. Tek aşamada pişirmek ya kuru patates ya da soluk bir tavuk bırakıyor.

    '
  notes:
  - t: Patatesi doğru boyda doğramak
    d: 'Tavuk baget ile patatesin aynı sürede pişmesi için patatesleri iri elma dilim doğramak gerekir. İnce doğranan patates tavuk pişmeden dağılır ve tepsinin dibinde sosla birlikte püreye döner. Patatesleri yıkayıp kurulamak, folyo açıldıktan sonra daha iyi kızarmalarını sağlar. Soğanı iri doğramak da aynı mantıkla önemli; ince soğan uzun pişmede yanar. Tüm malzemeleri tepsiye mümkün olduğunca tek kat yaymak, sosun her parçaya eşit ulaşmasına ve tavuğun derisinin güzelce kızarmasına yardım eder.

      '
  - t: Tavuğun piştiğini anlamak
    d: 'Tavuk bagetin en geç pişen yeri kemiğe yakın kısımdır. Pişip pişmediğini anlamak için en kalın yerinden kemiğe kadar bıçakla kes; et pembe değilse ve çıkan su berraksa tavuk pişmiştir. İyi pişen bagetin eti kemikten kolayca ayrılır. Folyoyu açtıktan sonraki 20 dakikada tavukların üstü kuruyor gibi görünürse tepsinin dibindeki sostan bir kaşık alıp üzerlerine gezdirebilirsin. Fırınlar farklı ısındığı için son birkaç dakikada tepsiyi kontrol etmek iyi olur.

      '
  - t: Marine, saklama ve airfryer
    d: 'Daha yoğun bir tat istiyorsan sosun yarısıyla tavukları bir gece önceden buzdolabında marine edebilir, kalan sosu pişirmeden önce sebzelerle birlikte ekleyebilirsin. Artan yemeği buzdolabında kapalı kapta saklayıp ertesi gün fırında ısıtabilirsin; bu sırada biraz sıcak su eklemek patateslerin kurumasını önler. Airfryer kullanacaksan önce patatesleri 200°C''de 10 dakika pişir, sonra tavukları ekleyip birlikte 15 dakika daha pişir ve arada sepeti salla. Biber salçası yerine domates salçası ve pul biber kullanılabilir.

      '
  faq:
  - q: Fırında tavuk baget kaç dakika pişer?
    a: Bu tarifte tavuk bagetler 200°C'de önce folyolu 30 dakika, sonra folyosuz 20 dakika olmak üzere toplam 50 dakika pişiyor.
  - q: Fırında tavuklu patates folyoyla mı pişirilir?
    a: İlk 30 dakika folyoyla kapalı pişirilir, böylece tavuk ve patates yumuşar. Son 20 dakikada folyo açılır ve üstleri kızarır.
  - q: Fırında tavuklu patatesin sosu nasıl yapılır?
    a: 1 yemek kaşığı biber salçası, 4 yemek kaşığı zeytinyağı, yarım su bardağı sıcak su, kekik, pul biber ve tuz karıştırılarak hazırlanır.
  - q: Fırında tavuklu patates önceden hazırlanır mı?
    a: Evet. Sosun yarısıyla tavukları bir gece önceden marine edebilir, ertesi gün sebzelerle birlikte tepsiye dizip pişirebilirsin.
fransiz-sogan-corbasi:
  aramaBasligi: 'Fransız soğan çorbası tarifi: Karamelize soğanlı, kaşarlı'
  intro: 'Fransız soğan çorbası, uzun süre karamelize edilen soğanın et suyuyla pişirildiği, üzerine kızarmış ekmek ve peynir konup fırınlanan klasik bir Fransız çorbası. Paris bistrolarıyla özdeşleşmiş bu kâse, birkaç basit malzemeden derin bir tat çıkarır.


    Bu tarifte 5 kuru soğan ince yarım ay doğranıp tereyağında kısık ateşte yaklaşık 40 dakika, koyu altın rengi olana kadar pişiriliyor; şeker ortalarda ekleniyor. Ardından un, sıcak et suyu, taze kekik ve tuzla 15 dakika kaynatılıyor. Fırına dayanıklı kâselere paylaştırılan çorba, baget dilimleri ve rendelenmiş kaşar ya da gravyerle fırın ızgarasında kızartılıyor.


    4 kişilik çorba 15 dakika hazırlık ve 60 dakika pişirmeyle toplam 1 saat 15 dakikada hazır. Sürenin büyük bölümü soğanın sabırla pişmesine ayrılıyor.

    '
  editorNote: 'Soğanı karamelize etme adımına 40 dakikalık süreyi açıkça yazdık, çünkü bu çorbanın tadı neredeyse tamamen o adımdan geliyor ve süre kısaltıldığında soğan tatlanmak yerine yanıyor.

    '
  notes:
  - t: Karamelizasyonda sabır
    d: 'Soğanın tatlanıp koyu altın rengine dönmesi zaman ister; ateşi yükseltmek bu süreci hızlandırmaz, yalnızca soğanı yakar. Kısık ateşte, ara ara karıştırarak pişirmek gerekir. Tencerenin dibinde oluşan kahverengi tabaka lezzetin kaynağıdır; yanmadığı sürece birkaç kaşık su ya da et suyuyla kazıyıp soğana karıştırabilirsin. Siyahlaşmış ve acı kokan bir tabaka oluştuysa onu kazıma, çorbaya acılık verir. Şekeri ortalarda eklemek renk almayı kolaylaştırır ama soğanın kendi tatlılığının yerini tutmaz.

      '
  - t: Et suyu ve kıvam
    d: 'Unu soğana ekledikten sonra 1 dakika çevirmek çiğ un tadını giderir ve çorbaya hafif bir gövde kazandırır. Bu çorbada sıvının neredeyse tamamı et suyu olduğu için et suyunun tadı sonucu doğrudan etkiler. Et suyu yoksa sebze suyu ya da sıcak suya bir tatlı kaşığı tereyağı ve bir tutam tuz eklemek ya da yarım bulyon kullanmak iş görür. Bulyon kullanıyorsan tuzu sona bırakıp tadına bakarak ekle. Glutensiz bir çorba için unun yerine aynı ölçü pirinç unu ya da mısır nişastası kullanabilirsin.

      '
  - t: Fırınlama ve servis
    d: 'Son aşamada fırına dayanıklı kâseler gerekiyor; çorba fırın ızgarasının altında yaklaşık 5 dakika kalıyor ve peynir hızla kızarıyor, bu yüzden fırının başından ayrılmamak iyi olur. Baget dilimlerini önceden kızartmak, ekmeğin çorbanın üzerinde hemen dağılmasını önler. Peynir olarak kaşar ya da gravyer kullanılıyor; mozzarella ya da tost peyniri gibi eriyen peynirler de olur. Kâseleri bir tepsi üzerinde fırına vermek çıkarmayı kolaylaştırır. Soğanlı çorba bazını önceden hazırlayıp servis öncesinde ısıtarak fırınlayabilirsin.

      '
  faq:
  - q: Fransız soğan çorbası için soğan kaç dakika karamelize edilir?
    a: Bu tarifte soğanlar kısık ateşte yaklaşık 40 dakika, koyu altın rengi olana kadar pişiriliyor.
  - q: Fransız soğan çorbasına hangi peynir konur?
    a: Rendelenmiş kaşar ya da gravyer kullanılıyor. Mozzarella ya da tost peyniri gibi iyi eriyen bir peynir de olur.
  - q: Fransız soğan çorbasında et suyu yerine ne kullanılır?
    a: Sebze suyu kullanabilirsin. Ya da sıcak suya bir tatlı kaşığı tereyağı ve bir tutam tuz ekleyebilir, yarım bulyonla tatlandırabilirsin.
  - q: Fransız soğan çorbası önceden yapılır mı?
    a: Evet. Soğanlı çorbayı önceden pişirip servis öncesinde ısıtabilir, kâselere paylaştırıp ekmek ve peynirle 5 dakika fırınlayabilirsin.
gazpacho:
  aramaBasligi: 'Gazpacho tarifi: Pişirmeden soğuk domates çorbası'
  intro: 'Gazpacho, İspanya''nın Endülüs bölgesine ait, ocak görmeyen soğuk bir domates çorbası. Olgun domates, salatalık, biber, soğan, sarımsak, bayat ekmek, zeytinyağı ve sirkenin blenderdan geçirilmesiyle yapılır; sıcak yaz günlerinde ferahlatıcı bir başlangıçtır.


    Bu tarifte sebzeler iri doğranıyor ve suda ıslatılıp sıkılmış bir dilim bayat ekmekle birlikte tüm malzemeler pürüzsüz olana kadar çekiliyor. Daha ince bir doku istersen çorbayı süzgeçten geçirebilirsin. Ardından en az 2 saat buzdolabında soğutuluyor ve üzerine küp salatalık, biber ve zeytinyağı gezdirilerek servis ediliyor.


    4 kişilik gazpacho 15 dakikalık hazırlıkla yapılıyor ve pişirme gerektirmiyor; yalnızca soğuma süresini hesaba katman gerekiyor.

    '
  editorNote: 'Soğutmayı ayrı bir adım olarak ve süresiyle yazdık; gazpacho blenderdan çıktığı anda değil, en az 2 saat dinlendikten sonra tatları birbirine geçmiş ve gerçekten soğuk haliyle tadına varıyor.

    '
  notes:
  - t: Domates seçimi
    d: 'Gazpachoda pişirme olmadığı için tat neredeyse tamamen domatesten gelir. Yaz aylarının olgun, kırmızı ve kokulu domatesleri çorbayı tatlı ve dolgun yapar; soluk, sert domatesler ise sulu ve ekşi bir sonuç verir. Kış aylarında taze domates yerine konserve küp doğranmış domates daha lezzetli olabilir. Domateslerin tatlılığı değiştiği için tuz ve sirkeyi blenderdan sonra tadına bakarak son kez ayarlamak iyi olur. Kapya biber yoksa kırmızı dolmalık biber ya da közlenmiş kavanoz biber kullanabilirsin.

      '
  - t: Ekmeğin ve zeytinyağının görevi
    d: 'Islatılıp sıkılmış bayat ekmek gazpachoya gövde verir ve zeytinyağının çorbayla bütünleşmesine yardım eder; ekmeksiz gazpacho daha sulu ve ince olur. Ekmeği suda kısa süre bekletip iyice sıkmak gerekir, yoksa çorbaya fazladan su katar. Zeytinyağını tüm malzemelerle birlikte blenderdan geçirmek çorbaya kremamsı bir doku ve hafif turuncu bir renk kazandırır. Glutensiz bir gazpacho için ekmeği tamamen çıkarabilirsin. Sirke yerine yarı ölçü limon suyu da kullanılabilir.

      '
  - t: Soğutma, saklama ve servis
    d: 'Soğuk servis edilen yemeklerde tat algısı azalır; bu yüzden buzdolabından çıkan gazpachonun tuzunu servisten önce bir kez daha kontrol etmek iyi olur. Çorbayı kapalı bir kapta buzdolabında saklayabilirsin, bekledikçe tatlar birbirine daha çok geçer. Servis ederken kâse ya da bardak kullanabilirsin. Üzerine küçük küp doğranmış salatalık, biber ve birkaç damla zeytinyağı eklemek hem görüntü hem doku katar. Çorbayı servis kaplarına koymadan önce iyice karıştır, çünkü beklerken bir miktar ayrışabilir.

      '
  faq:
  - q: Gazpacho pişirilir mi?
    a: Hayır. Gazpacho ocak görmeyen bir çorba; tüm malzemeler çiğ olarak blenderdan geçirilir ve soğutulur.
  - q: Gazpacho ne kadar soğutulur?
    a: Blenderdan geçirdikten sonra en az 2 saat buzdolabında bekletmek gerekir.
  - q: Gazpacho ekmeksiz yapılır mı?
    a: Evet. Glutensiz yapmak için ekmeği çıkarabilirsin; çorba biraz daha sulu ve ince olur.
  - q: Gazpachoda sirke yerine ne kullanılır?
    a: Üzüm sirkesi yerine yarı ölçü limon suyu kullanabilirsin.
grip-dusmani-tatli:
  aramaBasligi: 'Grip düşmanı tatlı tarifi: Portakallı, bisküvili kup tatlısı'
  intro: 'Grip düşmanı tatlı, portakal kabuklu muhallebi, portakal sosu ve kırılmış yulaflı bisküvinin kupta kat kat dizildiği soğuk bir kış tatlısı. Adını içindeki portakaldan alıyor; adı iddialı olsa da bu bir tatlı, herhangi bir hastalığa iyi gelmesini beklememek gerek.


    Krema; süt, şeker, un, nişasta, yumurta sarısı ve portakal kabuğuyla pişirilip tereyağı ve vanilinle tamamlanan muhallebinin, soğuduktan sonra çırpılmış sıvı kremayla birleştirilmesiyle hazırlanıyor. Portakal sosu taze portakal suyu, su, şeker ve nişastayla berraklaşıp koyulaşana kadar kaynatılıyor. Kupalara bisküvi, krema ve sos sırasıyla iki kat diziliyor.


    4 kişilik tatlı 20 dakika hazırlık ve 15 dakika pişirmeyle toplam 35 dakika sürüyor; servis öncesinde en az 1 saat buzdolabında dinlenmesi gerekiyor.

    '
  editorNote: 'Kremayı muhallebiye ancak soğuduktan sonra eklemeyi ayrı bir adım yaptık; sıcak muhallebiye eklenen çırpılmış krema söner ve tatlının hafif dokusu kaybolur.

    '
  notes:
  - t: Muhallebiyi topaksız pişirmek
    d: 'Un ve nişastayı süt henüz soğukken çırpmak topaklanmayı önler; sıcak süte eklenen nişasta anında topak yapar. Pişirme boyunca sürekli karıştırmak, özellikle tencerenin dibini ve kenarlarını sıyırmak gerekir, çünkü yumurta sarılı muhallebi kolay dip tutar. Koyulaşınca ocaktan alıp tereyağı ve vanilini eklemek yeterli. Portakal kabuğunu ince rendelerken yalnızca turuncu kısmı al; altındaki beyaz zar acı bir tat bırakır. Soğurken muhallebinin yüzeyine streç film değdirmek kabuk bağlamasını önler.

      '
  - t: Portakal sosunun kıvamı
    d: 'Sos, nişasta pişince bulanık görüntüsünden berrak ve parlak bir görüntüye geçer; bu, sosun hazır olduğunun işaretidir. Berraklaşmadan ocaktan alınan sos nişasta tadı bırakır ve katlar arasında sulanır. Sos soğudukça biraz daha koyulaşır, bu yüzden ocakta çok koyu görünene kadar beklemene gerek yok. Taze sıkılmış portakal suyu kullanmak tatlının kokusunu belirgin kılar. Portakal suyu yerine mandalina suyuyla da aynı şekilde yapabilirsin; tadı biraz daha tatlı ve yumuşak olur.

      '
  - t: Katlama ve saklama
    d: 'Bisküvileri iri kırmak katlar arasında doku bırakır; çok ince kırılan bisküvi kremanın içinde kaybolur. En az 1 saatlik dinlenme sırasında bisküviler kremanın ve sosun nemini çekip yumuşar, katlar birbirine oturur. Tatlıyı servis gününden önce hazırlamak mümkün, ama çok uzun bekleyen bisküvi tamamen hamurlaşır; en iyisi aynı gün tüketmek. Kupaları buzdolabında üzeri kapalı sakla. Yulaflı bisküvi yerine petibör ya da bebe bisküvisi de kullanılabilir.

      '
  faq:
  - q: Grip düşmanı tatlı neden bu adı taşıyor?
    a: Adını içindeki portakal kabuğu, portakal suyu ve portakal dilimlerinden alıyor. Bir tatlı olduğu için herhangi bir hastalığa iyi gelmesini beklememek gerekir.
  - q: Grip düşmanı tatlı kaç saat buzdolabında bekler?
    a: Servis etmeden önce en az 1 saat buzdolabında beklemesi gerekir; bu sürede bisküviler yumuşar ve katlar oturur.
  - q: Grip düşmanı tatlıda bisküvi yerine ne kullanılır?
    a: Yulaflı bisküvi yerine petibör ya da bebe bisküvisi kullanabilirsin.
  - q: Grip düşmanı tatlı krema olmadan yapılır mı?
    a: Tarifte sıvı krema çırpılarak kullanıldığı için birebir yerine geçecek bir malzeme yok. Bitkisel krema kullanabilirsin.
guacamole:
  aramaBasligi: 'Guacamole tarifi: Misket limonlu, 10 dakikada'
  intro: 'Guacamole, ezilmiş avokado, misket limonu, soğan, domates ve kişnişle yapılan, Meksika mutfağına ait bir sos. Tortilla cipsiyle, taco ve dürümlerin içinde ya da sebze çubuklarıyla servis edilir.


    Bu tarifte 2 olgun avokado çatalla iri parçalı kalacak şekilde eziliyor ve misket limonu suyu hemen ekleniyor. Ardından çok ince kıyılmış kırmızı soğan, çekirdeksiz küp domates, isteğe bağlı yeşil acı biber, kişniş ya da maydanoz ve tuz karıştırılıyor. Blender kullanılmıyor; dokunun iri kalması bu sosun karakterini oluşturuyor.


    4 kişilik guacamole 10 dakikada hazır ve pişirme gerektirmiyor. Tek şart avokadonun gerçekten olgun olması; gerisi birkaç doğrama işi.

    '
  editorNote: 'Limonu ezme adımının içine, avokadoyla aynı anda yazdık; avokado havayla temas ettiği anda kararmaya başlıyor ve limonun asidi bunu yavaşlatıyor.

    '
  notes:
  - t: Olgun avokado seçmek
    d: 'Guacamolenin tadı ve kıvamı avokadonun olgunluğuna bağlı. Olgun avokado parmakla hafifçe bastırıldığında biraz yumuşar ama içe çökmez. Taş gibi sert avokado çatalla ezilmez ve tatsız olur; birkaç gün oda sıcaklığında bekletildiğinde olgunlaşır. Çok yumuşak, bastırınca iz kalan avokadonun içi ise kahverengi lekeli ve lifli olabilir. Avokadoyu kesince kararmış bölgeler varsa kaşıkla ayıklayabilirsin. Misafir için yapacaksan avokadoları birkaç gün önceden alıp olgunlaşmaya bırakmak işini kolaylaştırır.

      '
  - t: Kararmayı geciktirmek
    d: 'Avokado havayla temas edince kararır; bu tatı çok değiştirmese de görüntüyü bozar. Misket limonu suyunu ezme sırasında hemen eklemek bu süreci yavaşlatır. Guacamoleyi bir süre bekleteceksen avokadonun çekirdeğini sosun içine koymak ve streç filmi doğrudan sosun yüzeyine değdirerek kapatmak hava temasını azaltır. Buna rağmen guacamole en iyi taze hazırlandığında olur. Üst yüzeyde hafif bir kararma olursa servisten önce o ince tabakayı kaşıkla alabilirsin.

      '
  - t: Doku ve tat ayarı
    d: 'Avokadoyu iri parçalı ezmek, guacamolenin püreden farkını oluşturur. Domatesin çekirdekli kısmını çıkarmak sosun sulanmasını önler; tarifte bu yüzden çekirdeksiz küp domates kullanılıyor. Kırmızı soğanı çok ince kıymak, keskinliğinin sosa eşit dağılmasını sağlar. Yeşil acı biber isteğe bağlı; acı sevenler artırabilir, sevmeyenler çıkarabilir. Kişniş sevmiyorsan maydanoz ve biraz limon kabuğu rendesi kullanabilirsin. Misket limonu bulamazsan normal limon da olur. Tuzu sona bırakıp tadına bakarak ekle.

      '
  faq:
  - q: Guacamole nasıl kararmaz?
    a: Misket limonu suyunu avokadoyu ezerken hemen ekle. Bekleteceksen çekirdeği sosun içine koy ve streç filmi yüzeye değdirerek kapat.
  - q: Guacamole önceden hazırlanır mı?
    a: En iyi sonuç taze hazırlandığında alınır. Kısa süre bekleteceksen yüzeyini streç filmle kapatıp buzdolabında tut.
  - q: Guacamolede misket limonu yerine ne kullanılır?
    a: Normal limon kullanabilirsin; tadı biraz daha keskin olur.
  - q: Olgun avokado nasıl anlaşılır?
    a: Parmakla hafifçe bastırdığında biraz yumuşuyorsa avokado olgundur. Sertse birkaç gün oda sıcaklığında beklet.
