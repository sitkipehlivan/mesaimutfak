hacapuri:
  aramaBasligi: 'Acaruli haçapuri tarifi: Peynirli, yumurtalı kayık ekmek'
  intro: 'Acaruli haçapuri, Gürcistan''ın Acara bölgesine özgü, kayık şeklinde açılıp ortası peynirle doldurulan ve yumurta ile tereyağıyla servis edilen bir ekmek. Sofrada yumurta, peynir ve tereyağı karıştırılır, ekmeğin kenarları koparılıp bu karışıma batırılarak yenir. Kaşarlı pidenin yakın bir akrabası gibi düşünebilirsin.


    Bu tarifte hamur un, instant kuru maya, ılık süt, sıvı yağ, şeker ve tuzla yoğrulup 45 dakika mayalandırılıyor. İç için mozzarella ya da kaşar ile beyaz peynir ya da lor karıştırılıyor. Hamur dörde bölünüp oval açılıyor ve kenarları rulo yapılarak kayık şekli veriliyor. 220°C fırında 10 dakika pişen haçapurilerin ortasına yumurta kırılıp 3-4 dakika daha pişiriliyor.


    4 kişilik tarif 30 dakika hazırlık ve 15 dakika pişirmeyle toplam 45 dakika sürüyor; buna hamurun 45 dakikalık mayalanması ekleniyor.

    '
  editorNote: 'Yumurtayı en başta değil, haçapuri 10 dakika piştikten sonra eklemeyi ayrı yazdık; böylece hamur kızarırken yumurta sarısı akışkan kalıyor ve bu tabağın asıl keyfi de orada.

    '
  notes:
  - t: Kayık şeklini vermek
    d: 'Oval açtığın hamurun iki uzun kenarını içe doğru rulo yapıp iki ucu sıkıca birbirine bastırman gerekir. Uçlar iyi sıkıştırılmazsa hamur fırında açılır ve eriyen peynir tepsiye akar. Kenarların kalın, ortanın ince olması hem kayığın şeklini korur hem de yumurtanın oturacağı bir çukur oluşturur. Peyniri ortaya bolca koy ama kenarların üzerine taşırma. Şekil verirken hamur geri çekiliyorsa birkaç dakika dinlendirip tekrar açmak işini kolaylaştırır.

      '
  - t: Peynir dengesi
    d: 'İç harcında iki peynirin ayrı görevleri var: mozzarella ya da kaşar eriyip uzar, beyaz peynir ya da lor ise tuz ve hafif ekşilik katar. Beyaz peynirin tuzlu olabileceğini düşünerek harca ayrıca tuz ekleme. Rendelenmiş, kuru mozzarella kullanmak önemli; sulu taze mozzarella hamuru ıslatabilir. Mozzarella yerine taze kaşar ya da dil peyniri, lor yerine ricotta ya da ezilmiş tuzsuz beyaz peynir kullanılabilir. Peynirleri önceden karıştırmak, her haçapuriye eşit dağıtmayı kolaylaştırır.

      '
  - t: Yumurta ve servis
    d: 'Yumurta, haçapuri 10 dakika pişip kenarları kızardıktan sonra ekleniyor ve yalnızca 3-4 dakika daha fırında kalıyor. Amaç beyazın hafifçe pişmesi, sarının ise akışkan kalması; fazla pişen yumurta sofrada karıştırılamaz. Yumurtayı önce küçük bir kaba kırıp oradan peynirin ortasına dökmek kabuk kaçmasını ve sarının dağılmasını önler. Fırından çıkınca üzerine bir parça tereyağı koy ve sıcakken servis et. Sofrada her şeyi çatalla karıştırıp ekmeğin kenarından koparak ye.

      '
  faq:
  - q: Haçapuri kaç derecede pişer?
    a: 220°C fırında kenarları kızarana kadar 10 dakika pişer, ardından ortasına yumurta kırılıp 3-4 dakika daha pişirilir.
  - q: Haçapuri hamuru ne kadar mayalanır?
    a: Bu tarifte hamur yoğrulduktan sonra 45 dakika mayalandırılıyor.
  - q: Haçapuriye hangi peynir konur?
    a: Mozzarella ya da kaşar ile beyaz peynir ya da lor karıştırılır. Mozzarella yerine taze kaşar ya da dil peyniri de olur.
  - q: Acaruli haçapuri nasıl yenir?
    a: Sofrada yumurta, peynir ve tereyağı karıştırılır; ekmeğin kenarları koparılıp bu karışıma batırılarak yenir.
havuc-corbasi:
  aramaBasligi: 'Zencefilli havuç çorbası tarifi: Portakallı, 35 dakikada'
  intro: 'Zencefilli havuç çorbası, havucun tatlılığını taze zencefilin keskinliği ve portakal suyunun ferahlığıyla dengeleyen, parlak turuncu renkli bir püre çorba. Et, süt ve un kullanılmadan hazırlandığı için vegan ve glutensiz.


    Bu tarifte soğan ve rendelenmiş taze zencefil zeytinyağında 3 dakika çevriliyor. Doğranmış havuç ve patates, sıcak su ve tuz eklenip sebzeler yumuşayana kadar yaklaşık 20 dakika pişiriliyor. Patates, çorbaya krema kullanmadan kadifemsi bir kıvam veriyor. Blenderdan geçirildikten sonra portakal suyu ve kimyon ekleniyor ve çorba bir taşım kaynatılıyor.


    4 kişilik çorba 10 dakika hazırlık ve 25 dakika pişirmeyle toplam 35 dakikada hazır. Kış akşamları için hafif bir başlangıç.

    '
  editorNote: 'Portakal suyunu en sona, çorba püre haline geldikten sonra eklettik; uzun süre kaynayan portakal suyu tazeliğini ve kokusunu kaybediyor, bir taşım kaynatmak ise tatları birleştirmeye yetiyor.

    '
  notes:
  - t: Zencefili hazırlamak
    d: 'Tarifte yaklaşık 2 cm''lik bir parça taze zencefil kullanılıyor. Zencefilin ince kabuğunu bir çay kaşığının kenarıyla kazıyarak kolayca soyabilirsin. İnce rendelemek, aromasının çorbaya eşit dağılmasını sağlar ve blenderdan sonra lifli parçalar kalmaz. Zencefili soğanla birlikte yağda çevirmek keskinliğini biraz yumuşatır. Acı ve keskin tatları seviyorsan miktarı artırabilirsin; çocuklar için yapıyorsan biraz azaltmak iyi olur. Taze zencefil, toz zencefile göre çok daha canlı bir aroma verir.

      '
  - t: Kıvamı ayarlamak
    d: 'Çorbanın kadifemsi kıvamı patatesten ve havucun pürüzsüz çekilmesinden gelir. Sıcak çorbayı sürahi tipi blenderda çekerken blenderı yarıdan fazla doldurma ve kapağı bir bezle tutarak düşük hızda başla; sıcak buhar kapağı itebilir. El blenderı kullanırsan çorbayı doğrudan tencerede çekebilirsin. Çorba çok koyu olursa biraz sıcak su ekleyerek açabilirsin. Patates yerine tatlı patates kullanırsan çorba daha tatlı olur ve pişme süresi biraz kısalır.

      '
  - t: Servis ve saklama
    d: 'Üzerine bir kaşık yoğurt ve kabak çekirdeği eklemek hem görüntü hem doku katar; vegan kalmasını istiyorsan yoğurt yerine biraz hindistan cevizi sütü gezdirebilirsin. Hindistan cevizi sütünü çorbanın içine eklemek de ona Asya esintili bir tat verir. Portakal suyu yerine mandalina suyu kullanılabilir. Artan çorbayı kapalı bir kapta buzdolabında saklayabilirsin; bekledikçe koyulaştığı için ısıtırken biraz su ekleyip karıştır. Isıtırken uzun süre kaynatmamak portakal aromasını korur.

      '
  faq:
  - q: Havuç çorbası kaç dakika pişer?
    a: Havuç ve patates sıcak suda yaklaşık 20 dakikada yumuşar. Kavurma ve son kaynatmayla birlikte pişirme toplam 25 dakika sürer.
  - q: Havuç çorbası nasıl kremamsı olur?
    a: Bu tarifte krema yerine patates kullanılıyor. Sebzeleri iyice yumuşatıp blenderdan pürüzsüz geçirince kadifemsi bir kıvam oluşur.
  - q: Havuç çorbasında portakal suyu yerine ne kullanılır?
    a: Mandalina suyu kullanabilirsin.
  - q: Havuç çorbasının üzerine ne konur?
    a: Bir kaşık yoğurt ve kabak çekirdeği çok yakışır. Vegan bir servis için biraz hindistan cevizi sütü gezdirebilirsin.
hint-dal:
  aramaBasligi: 'Hint usulü dal tarifi: Kırmızı mercimekli, tadkalı'
  intro: 'Dal, Hint mutfağında mercimek ve benzeri baklagillerden yapılan, günlük sofraların temelini oluşturan yemeklerin genel adı. Bu tarifteki versiyon, mercimek çorbasını andıran ama daha koyu ve baharatlı bir kırmızı mercimek yemeği.


    Mercimek su, zerdeçal ve doğranmış domatesle dağılıp kremamsı olana kadar yaklaşık 20 dakika pişiriliyor. Ayrı bir tavada tadka hazırlanıyor: bütün kimyon kızgın yağda 20 saniye cızırdatılıyor, soğan kızartılıyor, ardından sarımsak, taze zencefil, garam masala ve pul biber 1 dakika çevriliyor. Bu baharatlı yağ mercimeğin üzerine dökülüp karıştırılıyor.


    4 kişilik dal 10 dakika hazırlık ve 25 dakika pişirmeyle toplam 35 dakikada hazır. Pilav ya da lavaşla tam bir öğün oluyor.

    '
  editorNote: 'Tadka için gereken malzemeleri listede ayrı bir grup olarak yazdık, çünkü baharatların aromasını açan bu kızgın yağ, dalı sıradan bir mercimek yemeğinden ayıran asıl adım.

    '
  notes:
  - t: Tadka nedir, nasıl yapılır?
    d: 'Tadka, baharatların kızgın yağda kısa süre pişirilip yemeğin üzerine dökülmesi tekniği. Bütün kimyon gibi baharatlar sıcak yağda aromalarını yağa bırakır ve bu yağ yemeğe derin bir koku verir. Süreler kısa olduğu için soğanı, sarımsağı, zencefili ve baharatları önceden hazırlayıp tezgâha dizmek gerekir. Kimyon 20 saniyede yanabilir; koyulaşıp acı kokmaya başlarsa yağı atıp baştan yapmak daha iyi olur. Tadkayı en sona bırakmak aromanın taze kalmasını sağlar.

      '
  - t: Doğru kıvam
    d: 'Dalın kıvamı çorba ile püre arasında bir yerde olmalı. Kırmızı mercimek pişince dağılır ve kendiliğinden kremamsı bir doku oluşturur; ayrıca blenderdan geçirmene gerek yok. Pişirme sırasında fazla koyulaşırsa biraz sıcak su ekleyebilirsin. Dal bekledikçe koyulaşır, bu yüzden ocaktan alırken biraz akışkan bırakmak iyi olur. Mercimeği pişirmeden önce birkaç kez yıkamak üstte oluşan köpüğü azaltır. Kırmızı mercimek yerine sarı mercimek kullanırsan pişme süresi uzayabilir.

      '
  - t: Servis ve saklama
    d: 'Dal servis edilirken üzerine limon sıkmak ve kişniş serpmek tatlarını canlandırır. Pilavla ya da lavaşla tam bir öğün olur. Garam masala bulamazsan eşit ölçü kimyon ve kişniş tohumu ile birer tutam tarçın, karanfil ve karabiber karıştırabilirsin. Taze zencefil yoksa dörtte bir ölçü toz zencefil kullanılabilir. Artan dalı kapalı kapta buzdolabında saklayabilirsin. Isıtırken koyulaşmış olacağı için biraz su ekleyip karıştırarak ısıt; istersen küçük bir tadka daha hazırlayıp üzerine dökebilirsin.

      '
  faq:
  - q: Dal nedir?
    a: Dal, Hint mutfağında mercimek ve benzeri baklagillerden yapılan yemeklerin genel adı. Bu tarif kırmızı mercimekle hazırlanıyor.
  - q: Hint usulü dal kaç dakikada pişer?
    a: Mercimek yaklaşık 20 dakikada dağılıp kremamsı olur. Tadkayla birlikte pişirme toplam 25 dakika sürer.
  - q: Garam masala yerine ne kullanılır?
    a: Eşit ölçü kimyon ve kişniş tohumu ile birer tutam tarçın, karanfil ve karabiber karıştırabilirsin.
  - q: Dal neyle yenir?
    a: Pilavla ya da lavaşla servis edilir. Üzerine limon sıkıp kişniş serpebilirsin.
hosmerim:
  aramaBasligi: 'Höşmerim tarifi: Tuzsuz peynirli, şerbetli sıcak tatlı'
  intro: 'Höşmerim, tuzsuz taze peynirin tereyağında eritilip irmikle pişirildiği, şerbetle tatlandırılan sıcak bir tatlı. Balıkesir ile özdeşleşmiş bu yöresel lezzet, sünen ve peynirli dokusuyla tanınır.


    Bu tarifte 250 g tuzsuz taze peynir ya da lor, eritilmiş tereyağında kısık ateşte suyunu salıp eriyene kadar karıştırılıyor. İrmik eklenip tereyağı kenardan ayrılana kadar yaklaşık 10 dakika pişiriliyor. Ayrı bir kapta kaynatılan şeker ve su şerbeti tatlıya ekleniyor ve suyunu çekene kadar karıştırılıyor. Üzerine ceviz ya da fıstık serpilerek sıcak servis ediliyor.


    4 kişilik höşmerim 5 dakika hazırlık ve 20 dakika pişirmeyle toplam 25 dakikada hazır. Az malzemeyle kısa sürede yapılan bir tatlı.

    '
  editorNote: 'Tuzsuz peynir şartını hem malzeme listesine hem ipuçlarına yazdık; höşmerimde tatlılık yalnızca şerbetten geldiği için tuzlu peynir bütün dengeyi bozuyor.

    '
  notes:
  - t: Peynir seçimi
    d: 'Höşmerimin tadı ve dokusu peynire bağlı. Tuzsuz taze peynir ya da lor en iyi sonucu verir; ricotta ya da ezilmiş tuzsuz beyaz peynir de kullanılabilir. Elinde yalnızca tuzlu beyaz peynir varsa bir gece suda bekletip tuzunu almak gerekir; yoksa şerbetle birleştiğinde tuzlu ve tatlı birbirine karışır. Peyniri tereyağına eklerken ezmek erimesini hızlandırır. Peynirin önce su salması normal; kısık ateşte karıştırmaya devam ettikçe bu su buharlaşır ve peynir erir.

      '
  - t: Pişme anını yakalamak
    d: 'İrmik eklendikten sonra en önemli iş sürekli karıştırmak. Peynir ve irmik karışımı tencerenin dibine kolay yapışır ve yanar; kısık ateş ve geniş tabanlı bir tencere işini kolaylaştırır. Tatlının hazır olduğunu tereyağının kenarlardan ayrılmasından anlarsın; bu, irmiğin pişip peynirin suyunun çekildiği anlamına gelir. Bu aşamadan önce şerbet eklersen tatlı cıvık kalır. Tarifte bu süre yaklaşık 10 dakika, ama peynirin nemine göre biraz değişebilir.

      '
  - t: Şerbet ve servis
    d: 'Şerbeti ayrı bir kapta kaynatıp tatlıya sıcakken eklemek, karışımın hızla şerbeti çekmesini sağlar. Şerbet eklendikten sonra tatlı önce sulanır, karıştırmaya devam ettikçe suyunu çeker ve parlak bir görünüm alır. Höşmerim sıcak yenen bir tatlı; soğudukça sıkılaşır, bu yüzden servis etmeden hemen önce hazırlamak iyi olur. Üzerine ceviz ya da fıstık serpilir; fındık ya da badem de olur. Balıkesir''de kaymakla servis edildiği de bilinir.

      '
  faq:
  - q: Höşmerim için hangi peynir kullanılır?
    a: Tuzsuz taze peynir ya da lor kullanılır. Ricotta ya da ezilmiş tuzsuz beyaz peynir de olur.
  - q: Höşmerim tuzlu peynirle yapılır mı?
    a: Tuzlu peynir kullanacaksan bir gece suda bekletip tuzunu alman gerekir. Aksi halde tatlının dengesi bozulur.
  - q: Höşmerim sıcak mı soğuk mu yenir?
    a: Höşmerim sıcak servis edilen bir tatlı. Soğudukça sıkılaştığı için pişer pişmez servis etmek en iyisi.
  - q: Höşmerim kaç dakikada pişer?
    a: Peynirin erimesi yaklaşık 5 dakika, irmikle pişmesi yaklaşık 10 dakika sürer; şerbetle birlikte toplam pişirme 20 dakika.
hurmali-enerji-toplari:
  aramaBasligi: 'Hurmalı enerji topları tarifi: Pişmeden, yulaflı ve kakaolu'
  intro: 'Hurmalı enerji topları, hurma, yulaf ezmesi ve kuruyemişin rondoda çekilip yuvarlanmasıyla yapılan, fırın ya da ocak gerektirmeyen bir atıştırmalık. Tatlılığı hurmadan geldiği için ayrıca şeker eklenmiyor.


    Bu tarifte çekirdeksiz hurma, yulaf ezmesi, badem ya da fındık, kakao, fıstık ezmesi ya da tahin ve bir tutam tuz yapışkan bir hamur olana kadar çekiliyor. Hurmalar sertse önce 10 dakika ılık suda bekletiliyor. Hamur ceviz büyüklüğünde toplar haline getirilip hindistan cevizine bulanıyor ve 30 dakika buzdolabında sıkılaşıyor.


    Tarif 15 dakikalık hazırlıkla 16 top çıkarıyor ve pişirme gerektirmiyor. Kapaklı bir kutuya koyup çantada taşımak kolay.

    '
  editorNote: 'Hurmaları yumuşatma adımını koşullu yazdık; hurmanın cinsi ve tazeliği çok değiştiği için sert hurmayla rondo hamuru bağlayamıyor, yumuşak hurmada ise bu adım gereksiz.

    '
  notes:
  - t: Hamurun kıvamını tutturmak
    d: 'Doğru kıvamdaki hamur avuçta sıkıldığında bir arada durur ve parmaklara hafifçe yapışır. Hamur dağılıyorsa hurmalar yeterince yumuşak değildir ya da kuruyemiş oranı fazladır; birkaç hurma ya da biraz daha tahin eklemek hamuru bağlar. Çok yapışkan ve şekil tutmayan bir hamurda ise biraz daha yulaf ezmesi eklemek dengeyi sağlar. Rondoyu kısa aralıklarla çalıştırıp kenarlara yapışanları indirmek eşit bir karışım verir. Kuruyemişin bir kısmının iri kalması toplara hoş bir doku katar.

      '
  - t: Şekil vermek ve kaplamak
    d: 'Hamur ellerine yapışıyorsa avuçlarını hafifçe ıslatmak yuvarlamayı kolaylaştırır. Ceviz büyüklüğünde toplar yapmak hem tarifte belirtilen 16 adedi verir hem de tek seferde yenecek bir boyut sağlar. Topları hindistan cevizine bularken hafifçe bastırırsan kaplama daha iyi tutunur. Buzdolabında geçen 30 dakika topların sıkılaşmasını sağlar; hemen yenen toplar daha yumuşak ve yapışkan olur. Fıstık ezmesi ve tahin birbirinin yerine kullanılabilir, tahinle yapılan toplar biraz daha az tatlı olur.

      '
  - t: Saklama ve alternatifler
    d: 'Enerji toplarını kapalı bir kapta buzdolabında bir hafta, dondurucuda bir ay saklayabilirsin. Dondurucudan çıkan topları birkaç dakika oda sıcaklığında bekletmek yeterli. Glutensiz bir versiyon için glutensiz yulaf ya da kinoa gevreği kullanabilirsin. Kakao yerine aynı ölçü keçiboynuzu tozu kullanırsan tat daha tatlı ve hafif karamelli olur. Fındık yerine ceviz ya da badem de olur. Topların içinde hurmanın doğal şekeri bulunduğu için ölçüyü yine de göz önünde tutmak iyi olur.

      '
  faq:
  - q: Hurmalı enerji topları ne kadar saklanır?
    a: Kapalı bir kapta buzdolabında bir hafta saklanır.
  - q: Enerji topları dondurulur mu?
    a: Evet, dondurucuda bir ay saklanabilir. Yemeden önce birkaç dakika oda sıcaklığında bekletmek yeterli.
  - q: Enerji topları glutensiz yapılır mı?
    a: Yulaf ezmesi yerine glutensiz yulaf ya da kinoa gevreği kullanarak glutensiz yapabilirsin.
  - q: Enerji toplarında kakao yerine ne kullanılır?
    a: Aynı ölçü keçiboynuzu (harnup) tozu kullanabilirsin; tadı daha tatlı ve hafif karamelli olur.
jalapeno-tursusu:
  aramaBasligi: 'Jalapeno turşusu tarifi: Sirkeli, 24 saatte hazır'
  intro: 'Jalapeno turşusu, halka doğranmış acı biberlerin sıcak sirkeli salamurayla kavanozda bekletildiği, fermantasyon gerektirmeyen hızlı bir turşu. Burger, taco, pizza ve dürümlerin yanına çıtır ve keskin bir eşlikçi oluyor.


    Bu tarifte 300 g jalapeno ya da acı sivri biber 5 mm halkalara doğranıp ezilmiş sarımsak ve defne yaprağıyla temiz bir kavanoza bastırılıyor. Sirke, su, tuz, şeker ve isteğe bağlı kişniş tohumu 3 dakika kaynatılıyor ve sıcakken biberlerin üzerine dökülüyor. Kavanoz oda sıcaklığında soğuduktan sonra buzdolabına kaldırılıyor.


    15 dakika hazırlık ve 5 dakika pişirmeyle toplam 20 dakikalık bir iş; 8 kişilik bir kavanoz çıkıyor. Turşu 24 saat sonra yenmeye hazır.

    '
  editorNote: 'Eldiven uyarısını ipuçlarına değil doğrudan doğrama adımının içine yazdık; acı biberin yakıcı özü ellerde uzun süre kalabiliyor ve göze değdiğinde ciddi yanma yapıyor.

    '
  notes:
  - t: Bir buzdolabı turşusu
    d: 'Bu tarif fermente bir turşu ya da uzun süre dolapta saklanacak bir konserve değil; sirkeli salamurayla yapılan, buzdolabında saklanan hızlı bir turşu. Bu yüzden kavanozu soğuduktan sonra mutlaka buzdolabına kaldırman ve orada saklaman gerekir; bu şekilde bir ay dayanır. Temiz ve kuru bir kavanoz kullanmak ve biberlerin tamamen salamuranın altında kalmasını sağlamak önemli. Turşuyu her alışında temiz bir çatal kullanmak, kavanoza dışarıdan bir şey bulaşmasını önler.

      '
  - t: Çıtırlığı korumak
    d: 'Sıcak salamura biberleri hafifçe pişirir ama çıtırlıklarını korur; bu yüzden biberleri salamurayla birlikte tencerede kaynatma. Salamurayı ocaktan alır almaz biberlerin üzerine dökmek yeterli. Biberleri 5 mm kalınlığında eşit halkalar halinde doğramak, salamuranın her parçaya aynı hızda işlemesini sağlar; çok ince halkalar çabuk yumuşar. Biberleri kavanoza bastırarak doldurmak hem daha fazla biber sığdırır hem de salamuranın hepsini kaplamasını kolaylaştırır. Turşu 24 saat sonra hazır olur, sonraki günlerde tadı daha da oturur.

      '
  - t: Acıyı ayarlamak ve kullanmak
    d: 'Jalapenonun acısının büyük bölümü çekirdeklerde ve iç zarlarda bulunur; daha hafif bir turşu istiyorsan doğradıktan sonra çekirdekleri çıkarabilirsin. Jalapeno bulamazsan acı sivri biberle aynı yöntemi uygulayabilirsin. Doğrama sırasında eldiven kullanmak ve işin bitince bıçağı, kesme tahtasını ve tezgâhı iyice yıkamak gerekir. Bu turşu burger, taco, pizza ve dürümlerle iyi gider; ince doğranıp salatalara ya da sandviçlere de eklenebilir. Kişniş tohumu isteğe bağlı, hafif çiçeksi bir koku verir.

      '
  faq:
  - q: Jalapeno turşusu kaç günde olur?
    a: Sıcak salamura döküldükten ve kavanoz buzdolabına kaldırıldıktan 24 saat sonra yenmeye hazır olur.
  - q: Jalapeno turşusu ne kadar dayanır?
    a: Buzdolabında bir ay dayanır. Bu bir buzdolabı turşusu olduğu için oda sıcaklığında saklanmamalı.
  - q: Jalapeno yerine hangi biber kullanılır?
    a: Acı sivri biber kullanabilirsin; yöntem aynı kalır.
  - q: Jalapeno turşusunun acısı nasıl azaltılır?
    a: Biberleri doğradıktan sonra çekirdeklerini çıkarırsan turşunun acısı azalır.
kadayif-dolmasi:
  aramaBasligi: 'Kadayıf dolması tarifi: Cevizli, şerbetli rulo kadayıf'
  intro: 'Kadayıf dolması, tel kadayıfın bir tutamının cevizle sarılıp rulo ya da yuva şeklinde fırınlandığı, ardından şerbetle buluşan bir ikram tatlısı. Tepsi kadayıfından farklı olarak her porsiyon ayrı şekillendirildiği için misafir sofralarında servis etmesi kolay.


    Bu tarifte önce şeker ve su 15 dakika kaynatılıp limon eklenerek şerbet hazırlanıyor ve soğumaya bırakılıyor. 400 g tel kadayıf tutam tutam tezgâhta uzunlamasına yayılıp bir ucuna bir kaşık iri çekilmiş ceviz konarak sıkıca sarılıyor. Dolmalar yağlı tepsiye dizilip eritilmiş tereyağı gezdiriliyor ve 180°C fırında 30-35 dakika kızarana kadar pişiriliyor. Sıcak tatlının üzerine soğuk şerbet dökülüyor.


    10 kişilik tarif 30 dakika hazırlık ve 35 dakikaya kadar pişirmeyle toplam yaklaşık 1 saat 5 dakika sürüyor.

    '
  editorNote: 'Şerbeti ilk adıma koyduk; tatlı fırından çıktığında şerbetin tamamen soğumuş olması gerekiyor ve sona bırakıldığında beklemek zorunda kalıyorsun.

    '
  notes:
  - t: Sıcak tatlı, soğuk şerbet
    d: 'Şerbetli tatlılarda sıcaklık farkı önemlidir. Fırından yeni çıkmış sıcak kadayıfın üzerine soğuk şerbet dökmek, şerbetin tellere yavaş ve eşit işlemesini sağlar; tatlı hem şerbetli hem çıtır kalır. İkisi de sıcak olursa kadayıf yumuşayıp hamurlaşabilir, ikisi de soğuk olursa şerbet yeterince emilmez. Şerbeti tepsiye bir anda boşaltmak yerine kepçeyle her dolmanın üzerine eşit dağıtmak iyi olur. Şerbeti çekmesi için tatlıyı bir süre bekletip sonra servis et.

      '
  - t: Sarma tekniği
    d: 'Kadayıfı sarmadan önce eritilmiş tereyağının bir kısmıyla elle harmanlamak telleri yumuşatır ve sarmayı kolaylaştırır. Tutamı tezgâhta uzunlamasına yaydıktan sonra cevizi bir uca koyup sıkıca sarmak gerekir; gevşek sarılan dolmalar fırında açılır ve ceviz dökülür. Dolmaları tepsiye birbirine yaslanacak şekilde sıkıca dizmek de şekillerini korumalarına yardım eder. Kadayıf açıkta kaldıkça kurur ve kırılır; kullanmadığın kısmın üzerini temiz bir bezle örtmek telleri esnek tutar.

      '
  - t: Çeşitleme ve saklama
    d: 'Fıstıklı bir versiyon için cevizi Antep fıstığıyla değiştirebilirsin; fındık ya da badem de kullanılabilir. Tel kadayıf bulamazsan tereyağında kavrulmuş tel şehriye ya da ezilmiş kadayıf yufkası farklı bir dokuyla da olsa iş görür. Dolmaların fırında altın rengini alması, tellerin çıtırlaştığını gösterir; soluk kalırsa birkaç dakika daha pişirmek gerekebilir. Kadayıf dolmasını üzeri kapalı olarak serin bir yerde saklamak iyi olur; buzdolabında tereyağı katılaşır ve tatlı sertleşebilir.

      '
  faq:
  - q: Kadayıf dolması kaç derecede pişer?
    a: 180°C fırında kızarana kadar 30-35 dakika pişer.
  - q: Kadayıf dolmasına şerbet sıcak mı soğuk mu dökülür?
    a: Fırından yeni çıkmış sıcak tatlının üzerine soğuk şerbet dökülür. Bu yüzden şerbet ilk adımda hazırlanıp soğutuluyor.
  - q: Kadayıf dolmasında ceviz yerine ne kullanılır?
    a: Antep fıstığı, fındık ya da badem kullanabilirsin.
  - q: Kadayıf dolması nasıl dağılmaz?
    a: Kadayıfı tereyağıyla harmanlayıp sıkıca sar ve dolmaları tepsiye birbirine yaslanacak şekilde diz.
kakaolu-puding:
  aramaBasligi: 'Kakaolu puding tarifi: Bitter çikolatalı, 15 dakikada'
  intro: 'Kakaolu puding, süt, şeker, kakao ve nişastanın birlikte pişirilmesiyle yapılan koyu kıvamlı bir sütlü tatlı. Hazır paket puding yerine evdeki malzemelerle kısa sürede hazırlanabiliyor.


    Bu tarifte 500 ml soğuk süt şeker, kakao ve mısır nişastasıyla tencerede pürüzsüz olana kadar çırpılıyor, ardından orta ateşte sürekli karıştırılarak koyulaşana ve ilk kabarcıklar çıkana kadar yaklaşık 8 dakika pişiriliyor. Ocaktan alınınca 50 g bitter çikolata, tereyağı ve vanilin ekleniyor ve puding parlayana kadar karıştırılıyor.


    4 kişilik puding 5 dakika hazırlık ve 10 dakika pişirmeyle toplam 15 dakikada hazır. Kaselere paylaştırıldıktan sonra yaklaşık 1 saat soğuması gerekiyor.

    '
  editorNote: 'Çikolata ve tereyağını ocaktan aldıktan sonra eklettik; ocakta çikolata dibe yapışıp yanabiliyor, ocak dışında ise pudingin kalan ısısı onları eritmeye ve parlatmaya yetiyor.

    '
  notes:
  - t: Topaksız puding
    d: 'Nişastanın ve kakaonun topaklanmaması için ikisini de soğuk sütte açmak gerekir; sıcak süte eklenen nişasta anında topak yapar. Ocağı açmadan önce süt, şeker, kakao ve nişastayı iyice çırpıp pürüzsüz bir karışım elde et. Pişirme sırasında sürekli karıştırmak, özellikle tencerenin dibini ve köşelerini sıyırmak önemli; puding koyulaşmaya başladığı anda dibe yapışmaya meyillidir. Tel çırpıcı kullanmak, kaşığa göre daha pürüzsüz bir sonuç verir. Yine de küçük topaklar oluşursa pudingi süzgeçten geçirebilirsin.

      '
  - t: Doğru kıvam
    d: 'Pudingin koyulaşması nişastanın pişmesine bağlı. Karışım koyulaşıp ilk kabarcıkları çıkardığında nişasta pişmiş olur; daha erken ocaktan alınan puding soğuyunca sulu kalabilir ve nişasta tadı verir. Puding soğudukça daha da koyulaşır, bu yüzden ocakta çok katı görünmesini bekleme. Tarif glutensiz olarak hazırlanıyor, bunun için mısır nişastası kullanman gerekir; buğday nişastası glutensiz değildir. Nişasta yerine aynı ölçü pirinç unu da kullanılabilir. Laktozsuz süt birebir yerine geçer.

      '
  - t: Kaymak bağlamaması ve servis
    d: 'Puding soğurken yüzeyinde kaymak oluşur. Bunu önlemek için kaselere paylaştırdıktan hemen sonra streç filmi doğrudan pudingin yüzeyine değdirerek kapat. Yaklaşık 1 saat buzdolabında beklettikten sonra soğuk servis edebilirsin. Üzerine fındık ya da muz dilimleri yakışır. Bitter çikolata yerine sütlü çikolata kullanırsan puding daha tatlı olur; çikolatan yoksa her 30 g için 3 yemek kaşığı kakao ve 1 yemek kaşığı tereyağı kullanabilirsin. Kaseleri buzdolabında kapalı saklamak tazeliğini korur.

      '
  faq:
  - q: Puding neden topaklanır?
    a: Nişasta ya da kakao sıcak süte eklendiğinde topaklanır. Bu tarifte tüm kuru malzemeler soğuk sütte çırpılarak açılıyor.
  - q: Kakaolu puding nasıl koyu olur?
    a: Orta ateşte sürekli karıştırarak ilk kabarcıklar çıkana kadar, yaklaşık 8 dakika pişir. Puding soğudukça daha da koyulaşır.
  - q: Pudingde bitter çikolata yerine ne kullanılır?
    a: Sütlü çikolata kullanabilirsin, tatlılığı artar. Ya da her 30 g çikolata için 3 yemek kaşığı kakao ve 1 yemek kaşığı tereyağı ekle.
  - q: Kakaolu puding kaç saatte soğur?
    a: Kaselere paylaştırıp yüzeyini streç filmle kapattıktan sonra yaklaşık 1 saat buzdolabında bekletmek yeterli.
karalahana-corbasi:
  aramaBasligi: 'Karalahana çorbası tarifi: Barbunyalı, mısır unlu'
  intro: 'Karalahana çorbası, Karadeniz mutfağının kış sofralarında sık pişen, karalahana ve fasulyeyle hazırlanıp mısır unuyla koyulaştırılan doyurucu bir çorba. Yanına mısır ekmeği ve turşu eklendiğinde Karadeniz usulü bir akşam yemeği oluyor.


    Bu tarifte yaklaşık 600 g''lık bir demet karalahananın kalın sapları ayıklanıp yaprakları ince şeritler halinde doğranıyor. Soğan ve sarımsak yağda yumuşatılıp biber salçası ekleniyor, lahana 5 dakika çevrilerek söndürülüyor. Sıcak su ve haşlanmış barbunya eklenip kısık ateşte 35 dakika pişiriliyor. Son olarak soğuk suda açılan mısır unu, tuz ve pul biberle 10 dakika daha kaynatılıyor.


    6 kişilik çorba 15 dakika hazırlık ve 50 dakika pişirmeyle toplam 1 saat 5 dakikada hazır.

    '
  editorNote: 'Mısır ununu soğuk suyla açma ayrıntısını koyulaştırma adımının içine yazdık; doğrudan sıcak çorbaya serpilen mısır unu anında topaklanıyor ve sonradan dağıtmak çok zor.

    '
  notes:
  - t: Karalahanayı hazırlamak
    d: 'Karalahana yapraklarının ortasındaki kalın sap, yaprağın geri kalanından çok daha sert ve geç pişer; bu yüzden çıkarmak gerekir. Yaprağı ikiye katlayıp sapı bıçakla boydan kesmek en kolay yöntem. Yaprakları ince şeritler halinde doğramak, 35 dakikalık pişirmede eşit yumuşamalarını sağlar. Karalahananın kıvrımlı yaprakları arasında toprak kalabilir, doğradıktan sonra bol suda birkaç kez yıkamak iyi olur. Karalahananın ilk ayazlardan sonra daha lezzetli olduğu bilinir.

      '
  - t: Fasulye seçimi
    d: 'Tarifte haşlanmış barbunya ya da kuru fasulye kullanılıyor; ikisi de çorbaya doyuruculuk ve kremamsı bir doku katar. Kuru baklagil kullanacaksan önceden ıslatıp ayrı bir tencerede haşlaman gerekir, çünkü çiğ fasulye çorbadaki 35 dakikalık sürede pişmez. Pratik olsun istersen konserve haşlanmış fasulye de kullanabilirsin; süzüp yıkadıktan sonra eklemek fazla tuzu ve kıvamlı suyu giderir. Fasulyelerin bir kısmının pişerken dağılması normaldir ve çorbanın kıvamını zenginleştirir.

      '
  - t: Kıvam ve saklama
    d: 'Mısır unu çorbayı koyulaştırırken ona hafif tatlımsı bir tat ve Karadeniz mutfağına özgü bir karakter verir. Mısır ununu bir kase soğuk suda açıp karıştırarak eklemek topaklanmayı önler. Çorba bekledikçe daha da koyulaşır; ertesi gün ısıtırken biraz sıcak su ekleyip karıştırman gerekebilir. Mısır unu yerine ince irmik ya da un kullanılabilir, ama bu durumda çorba glutensiz olmaz; glutensiz için pirinç unu tercih et. Artan çorbayı buzdolabında kapalı kapta saklayabilirsin.

      '
  faq:
  - q: Karalahana çorbası kaç dakika pişer?
    a: Lahana sıcak su ve barbunyayla kısık ateşte 35 dakika pişer, mısır unu eklendikten sonra 10 dakika daha kaynatılır.
  - q: Karalahana çorbasında mısır unu neden topaklanır?
    a: Mısır unu doğrudan sıcak çorbaya eklendiğinde topaklanır. Önce bir kase soğuk suyla açıp sonra karıştırarak eklemek gerekir.
  - q: Karalahana çorbasında mısır unu yerine ne kullanılır?
    a: İnce irmik ya da un kullanabilirsin. Glutensiz olması gerekiyorsa pirinç unu tercih et.
  - q: Karalahana çorbası hangi fasulyeyle yapılır?
    a: Bu tarifte haşlanmış barbunya ya da kuru fasulye kullanılıyor. Konserve haşlanmış fasulye de olur.
karisik-izgara:
  aramaBasligi: 'Evde karışık ızgara tarifi: Adana, tavuk şiş ve pirzola'
  intro: 'Karışık ızgara, kebapçılarda tek tabakta sunulan farklı etlerin evde hazırlanmış hali. Bu tarifte Adana kebap, yoğurtlu tavuk şiş ve kuzu pirzola döküm ızgara tavada ya da fırın ızgarasında sırayla pişiriliyor; lavaş, közlenmiş domates ve biber, sumaklı soğan ve isteğe bağlı bulgur pilavıyla servis ediliyor.


    Tavuk yoğurt, biber salçası, zeytinyağı, tuz ve kekikle; pirzolalar zeytinyağı, tuz ve kekikle ayrı ayrı en az 30 dakika marine ediliyor. Adana harcı yağlı kıyma, kapya biber, pul biber ve tuzla sakızlaşana kadar yoğruluyor. Pişirme sırası tavuk şiş, Adana ve pirzola şeklinde.


    4 kişilik tabak 40 dakika hazırlık ve 25 dakika pişirmeyle toplam 1 saat 5 dakika sürüyor. Üç farklı eti doğru sırayla pişirmek işin özü.

    '
  editorNote: 'Pişirme adımında her etin süresini ve sırasını ayrı ayrı yazdık; üç farklı et aynı tavaya aynı anda girince biri kururken diğeri çiğ kalıyor, sırayla pişirince hepsi sofraya sıcak geliyor.

    '
  notes:
  - t: Adana harcının sırrı
    d: 'Adana kebabın şişte ya da köfte halinde dağılmadan pişmesi için yağlı kıyma şart; yağsız kıyma kuru olur ve pişerken çatlar. Kıymayı biber, pul biber ve tuzla birlikte uzun süre yoğurmak gerekir; harç sakızlaşıp ellerine yapışmaya başladığında hazırdır. İnce kıyılmış kapya biberin suyunu biraz sıkmak, harcın fazla nem yüzünden şişten kaymasını önler. Yassı şişlere sararken ellerini ıslatmak işini kolaylaştırır. Şişin yoksa uzun köfteler yapıp tavada aynı sürede pişirebilirsin.

      '
  - t: Pişirme sırası ve süreler
    d: 'Döküm ızgara tavayı yüksek ateşte iyice ısıtmak, etlerin yapışmadan mühürlenmesini sağlar. Önce en uzun pişen tavuk şiş her yüzü 4 dakika, ardından Adana her yüzü 4 dakika, en son pirzolalar her yüzü 3 dakika pişer. Tavuğun içi tamamen pişmiş olmalı; kestiğinde pembe kalmamalı. Pişen etleri sıcak bir tabağa alıp üzerini folyoyla örtmek, diğerleri pişerken sıcak kalmalarını sağlar. Domates ve biberleri de etlerin arasında ya da sonunda aynı tavada közleyebilirsin.

      '
  - t: Fırın ızgarası ve servis
    d: 'Döküm tavan yoksa etleri fırın ızgarasında 250°C''de pişirebilirsin; alttaki tepsiye su koymak yağ damlaları yandığında oluşan dumanı azaltır. Tahta şiş kullanıyorsan şişleri önceden 20 dakika suda bekletmek yanmalarını önler. Servis ederken lavaşı etlerin yağına bastırıp tabağa sermek, ekmeğe etin lezzetini geçirir. Kalabalık bir sofrada lavaşları fırında 1 dakika ısıtıp üst üste koymak sıcak kalmalarını sağlar. Mor soğanı ince doğrayıp sumak ve maydanozla karıştırmak tabağı tamamlar.

      '
  faq:
  - q: Adana kebap evde nasıl dağılmaz?
    a: Yağlı kıyma kullan ve harcı biber, pul biber ve tuzla sakızlaşana kadar yoğur. Yağsız kıyma ve az yoğrulmuş harç şişten düşer.
  - q: Tavuk şiş tavada kaç dakika pişer?
    a: Bu tarifte tavuk şiş iyice ısıtılmış döküm ızgara tavada her yüzü 4 dakika pişiriliyor.
  - q: Karışık ızgara fırında yapılır mı?
    a: Evet. Fırın ızgarasında 250°C'de pişirebilirsin; alttaki tepsiye su koyarsan duman azalır.
  - q: Tahta şiş yanmaması için ne yapılır?
    a: Tahta şişleri kullanmadan önce 20 dakika suda bekletmek yeterli.
karnabahar-corbasi:
  aramaBasligi: 'Karnabahar çorbası tarifi: Sütlü, muskatlı, 35 dakikada'
  editorNote: 'Çorbaya un ya da krema koymadık; kıvamı tek bir patatesin nişastasıyla ve blenderla aldık. Sütü püreden sonra ekleyip yalnızca bir taşım kaynatmayı ayrı adım olarak yazdık, çünkü uzun kaynayan süt çorbanın tadını ağırlaştırır.

    '
  intro: 'Karnabahar çorbası, haşlanmış karnabaharın blenderdan geçirilip sütle yumuşatıldığı, kadifemsi bir sebze çorbası. Karnabaharı sevmeyenlerin bile kolayca içtiği bir tarif, çünkü pişip püre haline gelince o keskin kokusu büyük ölçüde kayboluyor.


    Bu tarifte un, krema ya da hazır bulyon yok. Tereyağında yumuşatılan soğanın üzerine karnabahar çiçekleri, küp doğranmış bir patates ve sıcak su ekleniyor; patates çorbaya doğal bir koyuluk veriyor. Blenderdan sonra eklenen süt ve bir tutam muskat, tadı yuvarlayıp hafif bir kış çorbasına dönüştürüyor.


    4 kişilik tarif, 10 dakika hazırlık ve 25 dakika pişirmeyle toplam 35 dakikada hazır. Glutensiz bir çorba; akşam yemeğinin başına ya da hafif bir öğün olarak tek başına uygun.

    '
  notes:
  - t: Patatesin görevi
    d: 'Tarifte tek bir patates var ama kıvamın asıl sorumlusu o. Patatesin nişastası blenderda karnabaharla birleşince çorbayı un ya da krema kullanmadan koyulaştırır. Patatesi karnabaharla aynı boyda küp doğrarsan ikisi aynı anda yumuşar ve püre pürüzsüz olur. Tatlı patates kullanırsan çorba hafif tatlımsı ve turuncumsu olur, pişme süresi de biraz kısalır. Çorbayı daha koyu istersen suyu bir miktar azaltmak, patates eklemekten daha dengeli sonuç verir.

      '
  - t: Sütü ne zaman eklemeli
    d: 'Süt, sebzeler pişip blenderdan geçtikten sonra ekleniyor ve çorba yalnızca bir taşım kaynatılıyor. Sütü baştan suyla birlikte koyarsan 20 dakikalık kaynama boyunca dibe tutma ve kesilme riski artar, tadı da pişmiş süt tadına döner. Sütü eklerken ocağı orta ateşe al ve karıştır. Laktozsuz süt birebir olur; vegan yapmak istersen tereyağı yerine zeytinyağı, süt yerine yulaf ya da badem sütü kullanabilirsin.

      '
  - t: Koku ve sunum
    d: 'Karnabahar pişerken kükürtlü bir koku salar. Tencerenin kapağını aralık bırakmak bu kokunun mutfakta birikmesini azaltır; çiçekleri gereğinden uzun pişirmemek de kokuyu sınırlar. Servis için birkaç çiçeği ayırıp fırında kızarana kadar pişirmek ve çorbanın üzerine koymak hem çıtır bir doku hem şık bir görüntü verir. Muskatı tutam ölçüsünde tut; fazlası çorbada acımsı ve baskın bir tat bırakır. Muskatı en son, sütle birlikte eklemek aromasının uçmasını da önler.

      '
  faq:
  - q: Karnabahar çorbası kaç dakikada pişer?
    a: 'Sebzeler sıcak suda yaklaşık 20 dakikada yumuşar. Hazırlık dahil çorba toplam 35 dakikada hazır olur.

      '
  - q: Karnabahar çorbası unsuz nasıl koyu olur?
    a: 'Bu tarifte kıvamı patates veriyor. Karnabaharla birlikte pişen patates blenderdan geçince çorbayı un ve krema olmadan koyulaştırır.

      '
  - q: Karnabahar çorbasının kokusu nasıl azaltılır?
    a: 'Pişirirken tencerenin kapağını aralık bırak ve karnabaharı yumuşadığı anda ocaktan al. Püre haline gelip sütle buluştuğunda koku belirgin biçimde azalır.

      '
  - q: Karnabahar çorbasında süt yerine ne kullanılır?
    a: 'Laktozsuz süt birebir olur. Vegan için yulaf ya da badem sütü kullanabilir, tereyağını da zeytinyağıyla değiştirebilirsin.

      '
kaymakli-kayisi-tatlisi:
  aramaBasligi: 'Kaymaklı kayısı tatlısı tarifi: Şerbetli, Antep fıstıklı'
  editorNote: 'Limon suyunu şerbetin başına değil son 5 dakikaya koyduk; böylece şerbet kristalleşmeden parlak kalıyor ve kayısının tadını bastırmıyor. Kaymağı doldurmayı kayısılar soğuduktan sonraya bıraktık, çünkü sıcak kayısıda kaymak erir.

    '
  intro: 'Kaymaklı kayısı tatlısı, şerbette yumuşatılmış kuru kayısıların yanından açılıp kaymakla doldurulduğu ve toz Antep fıstığına batırıldığı küçük, zarif bir tatlı. Fırın gerektirmiyor, hamur işi yok; ikramlık bir tabak için az malzeme yetiyor.


    Tarif gün kurusu kayısıyla yazıldı. Kayısılar önce birkaç saat ya da bir gece suda bekletiliyor, sonra şeker ve sudan kaynatılan şerbette kısık ateşte yumuşayana kadar pişiriliyor. Soğuyan kayısıların içine birer tatlı kaşığı kaymak konuyor, üzerine biraz şerbet gezdiriliyor.


    6 kişilik tarifin hazırlığı 20, pişirmesi 25 dakika; toplam 45 dakika. Buna kayısıları ıslatmak için gereken en az 4 saati eklemelisin. Glutensiz bir tatlı ve bir gün önceden hazırlanmaya uygun.

    '
  notes:
  - t: Kayısıyı ıslatmak neden şart
    d: 'Gün kurusu kayısı oldukça sert ve kurudur. Suda en az 4 saat ya da bir gece bekletilmezse şerbette dışı pişip içi sert kalır ve yanından açarken yırtılır. Islatılmış kayısı şerbeti daha eşit çeker, 20-25 dakikada içi yumuşar. Islatma suyunu atmak zorunda değilsin; şerbetin suyunun bir kısmı olarak kullanabilirsin. Kayısıları pişirirken kısık ateşi koru; fokur fokur kaynayan şerbette kayısılar dağılır ve şekli bozulur.

      '
  - t: Kaymak yerine ne koyulur
    d: 'Tarifin yıldızı kaymak, ama bulamadığında krem şanti iyi bir alternatif olur. Şantiyi şekersiz ya da az şekerli çırp; şerbetli kayısının yanında fazla tatlı kalabilir. Daha yoğun bir dolgu istersen süzme yoğurtla karıştırılmış mascarpone da kullanılabilir. Hangi dolguyu seçersen seç, kayısılar tamamen soğumuş olmalı. Antep fıstığı yerine toz ceviz ya da fındık kullanabilirsin; fındık tatlıya daha toprak bir tat verir. Dolguyu küçük bir kaşıkla koymak kayısının şeklini bozmadan düzgün bir görüntü sağlar.

      '
  - t: Saklama ve servis
    d: 'Şerbetli kayısıları kaymak koymadan önce buzdolabında kapalı bir kapta saklayabilirsin; bu yüzden misafir öncesi bir gün önceden pişirmek pratik bir yol. Kaymağı servise yakın doldur, fıstığa da son anda batır; bekleyen kaymak kayısının nemiyle yumuşar ve fıstık rengini kaybeder. Şerbeti tabağa döküp üstüne kayısıları dizmek yerine, kayısıların üzerine birkaç damla gezdirmek tatlının ağırlaşmasını önler. Kalan şerbeti atma; buzdolabında saklayıp başka bir tatlıda ya da yoğurdun üzerinde kullanabilirsin.

      '
  faq:
  - q: Kaymaklı kayısı tatlısı için kayısı ne kadar ıslatılır?
    a: 'Gün kurusu kayısıyı en az 4 saat, mümkünse bir gece suda beklet. Böylece şerbette 20-25 dakikada içi yumuşar.

      '
  - q: Kayısı tatlısında şerbet neden şekerlenir?
    a: 'Şerbet uzun ve yüksek ateşte kaynarsa kristalleşebilir. Bu tarifte limon suyu son 5 dakikada ekleniyor; limon şerbetin şekerlenmesini önlemeye yardım eder.

      '
  - q: Kaymak yerine ne kullanılır?
    a: 'Krem şanti en yaygın alternatif. Az şekerli çırpmak, şerbetli kayısının yanında tatlıyı dengede tutar.

      '
  - q: Kaymaklı kayısı tatlısı önceden yapılır mı?
    a: 'Evet. Kayısıları bir gün önceden şerbette pişirip buzdolabında sakla; kaymağı ve fıstığı servisten hemen önce ekle.

      '
kereviz-corbasi:
  aramaBasligi: 'Kereviz çorbası tarifi: Portakallı, kremasız ve vegan'
  editorNote: 'Portakal suyunu pişirmenin sonuna, blenderdan sonraya bıraktık; kaynarsa ferah kokusu gider, sona eklenince kerevizin keskinliğini yumuşatıyor. Çorbayı zeytinyağıyla yazdık ki vegan ve glutensiz kalsın.

    '
  intro: 'Kereviz çorbası, kök kerevizin patatesle birlikte pişirilip blenderdan geçirildiği kremamsı bir kış çorbası. Kerevizin kendine özgü, biraz keskin aroması herkese hitap etmeyebilir; bu tarifte o kokuyu portakal suyu dengeliyor.


    Krema ya da süt kullanılmıyor. Zeytinyağında yumuşatılan soğanın üzerine küp doğranmış kereviz, patates, sıcak su ve tuz ekleniyor; sebzeler yumuşayınca hepsi püre haline getiriliyor. Kıvamı patates veriyor, ferahlığı ise en son eklenen yarım portakalın suyu ve karabiber.


    4 kişilik tarif 15 dakika hazırlık ve 25 dakika pişirmeyle toplam 40 dakikada hazır. Vegan ve glutensiz; üzerine biraz zeytinyağı ve kavrulmuş ceviz serperek servis edebilirsin.

    '
  notes:
  - t: Kerevizi soymak ve korumak
    d: 'Kök kerevizin kabuğu kalın ve topraklıdır; soyacağına bıçakla dilimler halinde kesip atmak daha kolaydır. Doğranan kereviz havayla temas edince kısa sürede kararır. Tarifte bu yüzden küpleri doğradıkça limonlu suya atmanı öneriyoruz. Kararma tadı bozmaz ama çorbanın rengini grileştirir. Pişirmeye geçerken küpleri süzmen yeterli. Artan kerevizi zeytinyağlı kereviz gibi başka bir yemekte değerlendirebilirsin. Kerevizi patatesle aynı boyda küp doğramak, ikisinin aynı anda yumuşamasını sağlar ve püreyi pürüzsüz yapar.

      '
  - t: Portakalın zamanlaması
    d: 'Portakal suyu çorbada tat düzeltici gibi çalışır; kerevizin hafif acımsı tarafını tatlı bir ekşilikle kapatır. Ancak uzun süre kaynarsa aroması uçar ve geriye pişmiş meyve tadı kalır. Bu yüzden çorba blenderdan geçtikten sonra, ocak kapalıyken ya da çok kısıkken ekle. Portakal yoksa mandalina suyu birebir olur. Tadına bakarak artırabilirsin, ama fazlası çorbayı tatlı çorbaya çevirir. Taze sıkılmış portakal suyu, hazır meyve suyuna göre daha ferah ve daha az şekerli bir sonuç verir.

      '
  - t: Kıvam ve servis
    d: 'Çorba blenderdan sonra fazla koyu geldiyse biraz sıcak su ekleyip karıştır; sulu geldiyse birkaç dakika açık kapakta kaynatıp suyunu azalt. Patatesi tatlı patatesle değiştirirsen pişme süresi kısalır ve çorba hafif tatlanır. Servis ederken bir tutam karabiber, üzerine zeytinyağı ve kavrulmuş ceviz koymak hem görünümü hem dokuyu zenginleştirir. Ceviz, çorbanın yumuşak dokusuna çıtır bir karşıtlık katar. Kalan çorbayı ısıtırken de portakalın kokusunu korumak için kaynatmadan, orta ateşte ısıt.

      '
  faq:
  - q: Kereviz çorbası kaç dakikada pişer?
    a: 'Sebzeler yaklaşık 20 dakikada yumuşar. Hazırlıkla birlikte çorba toplam 40 dakikada hazır olur.

      '
  - q: Kereviz çorbası kremasız nasıl kremamsı olur?
    a: 'Kerevizle birlikte pişen patates, blenderdan geçince çorbaya krema gerektirmeyen yumuşak bir kıvam verir.

      '
  - q: Kereviz çorbasına portakal ne zaman eklenir?
    a: 'Çorba blenderdan geçtikten sonra eklenir. Kaynamazsa portakalın ferah kokusu korunur.

      '
  - q: Kereviz neden kararır?
    a: 'Doğranan kereviz havayla temas edince oksitlenir. Doğradığın küpleri limonlu suya atarsan kararma büyük ölçüde önlenir.

      '
keskek:
  aramaBasligi: 'Keşkek tarifi: Aşurelik buğday ve etle, dövülerek'
  editorNote: 'Eti ve buğdayı ayrı aşamalarda pişirmeyi seçtik; buğday et suyunda pişince tadı derinleşiyor ve et didiklenmeye hazır oluyor. Dövme adımını ayrı ve süresiyle yazdık, çünkü keşkeğin uzayan kıvamı tamamen o 15-20 dakikalık emeğe bağlı.

    '
  intro: 'Keşkek, buğday ile etin uzun süre birlikte pişirilip dövülerek lapa kıvamına getirildiği geleneksel bir yemek. Düğünlerde, bayramlarda ve imecelerde kazanlarla pişirilmesiyle bilinir; Türkiye''nin keşkek geleneği UNESCO Somut Olmayan Kültürel Miras listesinde yer alıyor.


    Bu tarif büyük kazan yerine ev tenceresine göre yazıldı. Bir gece ıslatılan aşurelik buğday, haşlanan kemikli kuzu ya da tavuk butunun suyunda lapalaşana kadar pişiriliyor. Didiklenen et eklendikten sonra keşkek tahta kaşık ya da patates eziciyle güçlüce dövülüyor; üzerine pul biberli kızdırılmış tereyağı geliyor.


    6 kişilik tarifin hazırlığı 20 dakika, pişirmesi 180 dakika; toplam 3 saat 20 dakika. Buğdayı bir gece önceden ıslatmayı unutma.

    '
  notes:
  - t: Doğru buğday
    d: 'Keşkek kabuğu soyulmuş, iri taneli buğdayla yapılır; tarifte aşurelik buğday kullanılıyor. Dövme buğday da aynı işi görür. Buğdayı bir gece ıslatmak, 90 dakikalık pişirmede tanelerin eşit açılmasını sağlar. İri bulgur kullanırsan ıslatmaya gerek kalmaz ve pişme kısalır, ama keşkeğin karakteristik uzayan kıvamı daha zayıf olur. Düdüklü tencere buğdayın pişme süresini yaklaşık yarıya indirir; dövme adımını yine de normal tencerede, kısık ateşte yapman gerekir.

      '
  - t: Dövmenin önemi
    d: 'Keşkeği lapadan ayıran şey dövmedir. Buğday iyice pişip lapalaşınca et eklenir ve ocak kısıkken 15-20 dakika tahta kaşık ya da patates eziciyle güçlüce karıştırılır. Bu sırada buğdayın nişastası açığa çıkar, etin lifleri dağılır ve karışım kaşıktan uzayarak düşen homojen bir kıvama gelir. Bu adımı kısa kesersen tane tane, sulu bir yemek elde edersin. Dibi tutmaması için gerekirse az sıcak su ekle.

      '
  - t: Kuzu mu tavuk mu
    d: 'Tarif kemikli kuzu ya da tavuk butla yazıldı. Kuzuyla yapılan keşkek daha yoğun ve geleneksel bir tat verir; tavuk butla yapılan daha hafif olur ve didiklemesi kolaydır. Dana eti de kullanılabilir, pişme süresi benzerdir. Hangisini seçersen seç kemikli et kullan; kemik, buğdayın içinde piştiği suya gövde verir. Haşlarken köpüğü almak suyun berrak ve temiz tatlı olmasını sağlar. Didiklerken kemik, kıkırdak ve sinirleri iyice ayıkla; dövme sırasında bunlar keşkeğin pürüzsüz kıvamını bozar.

      '
  faq:
  - q: Keşkek kaç saatte pişer?
    a: 'Eti haşlamak yaklaşık 60 dakika, buğdayı pişirmek 90 dakika, dövmek 15-20 dakika sürer. Hazırlıkla birlikte toplam 3 saat 20 dakika ayırmalısın.

      '
  - q: Keşkek için hangi buğday kullanılır?
    a: 'Aşurelik ya da dövme buğday kullanılır ve bir gece önceden ıslatılır. İri bulgur da olur ama keşkeğin uzayan kıvamı daha zayıf kalır.

      '
  - q: Keşkek düdüklü tencerede yapılır mı?
    a: 'Evet. Düdüklü tencerede buğdayın pişme süresi yarıya iner. Dövme adımını ise kapağı açık, kısık ateşte yapmalısın.

      '
  - q: Keşkek neden uzamaz?
    a: 'Buğday tam lapalaşmadan dövmeye geçildiyse ya da dövme kısa tutulduysa keşkek uzamaz. Buğdayı iyice pişirip 15-20 dakika güçlüce döv.

      '
kesme-corba:
  aramaBasligi: 'Kesme çorba tarifi: Ev eriştesi, yeşil mercimek ve nane'
  editorNote: 'Hamuru ince açtıktan sonra 20 dakika kurutma adımını ayrı yazdık; kurumayan hamur kesilirken yapışır ve çorbada dağılır. Mercimeği ayrıca haşlattık, çünkü kesmeler 10 dakikada pişerken mercimek çiğ kalırdı.

    '
  intro: 'Kesme çorba, evde yoğrulup ince kesilen erişte benzeri hamurla, mercimek ve nohutla pişirilen eski usul bir Anadolu çorbası. Bazı yörelerde kesme aşı olarak da anılır; naneli, salçalı ve doyurucudur.


    Bu tarifte kesme hamuru un, yumurta, tuz ve az suyla sert bir hamur olarak yoğruluyor, ince açılıp kurutuluyor ve kibrit çöpü inceliğinde kesiliyor. Yeşil mercimek önce sıcak suda haşlanıyor, ardından tereyağında kavrulan soğan ve salça, haşlanmış nohut ve kesmeler ekleniyor. En son tuz ve kuru nane geliyor.


    6 kişilik tarifin hazırlığı 20 dakika, pişirmesi 40 dakika; toplam 60 dakika. Vaktin dar olduğu günlerde ev kesmesi yerine hazır erişte kullanabilirsin.

    '
  notes:
  - t: Sert hamur, ince kesme
    d: 'Kesme hamurunun sert olması gerekir; yumuşak hamur ince açılmaz ve kesilirken yapışır. Bir su bardağı una bir yumurta ve iki yemek kaşığı su genelde yeterlidir, hamur yapışırsa az un ekle. Açtığın hamuru 20 dakika kurumaya bırakmak yüzeyini sertleştirir; böylece rulo yapıp kestiğinde şeritler birbirine yapışmaz. Şeritleri kibrit çöpü inceliğinde kesmek, kesmelerin 10 dakikada pişmesini sağlar. Kalın kesilen kesmeler hem geç pişer hem çorbayı bulandırır.

      '
  - t: Mercimek ve nohut
    d: 'Yeşil mercimek kırmızı mercimek gibi dağılmaz, tane tane kalır; bu yüzden ayrıca 20 dakika haşlanması gerekir. Nohut tarifte haşlanmış olarak giriyor; kuru nohut kullanacaksan bir gece ıslatıp ayrıca haşlaman lazım. Konserve nohut bu adımı tamamen ortadan kaldırır. Mercimeği haşladığın suyu dökmeden çorbanın tabanı olarak kullan; mercimekten geçen tat çorbaya derinlik verir. Yeşil mercimek yerine kahverengi ya da beluga mercimek de olur.

      '
  - t: Kıvam ve bekleyen çorba
    d: 'Kesmeler pişerken un salar ve çorbayı kendiliğinden koyulaştırır. Çorba bekledikçe kesmeler suyu çekmeye devam eder; ertesi gün ısıtırken biraz sıcak su eklemen gerekebilir. Bu yüzden kesmeleri eklemeden önce çorbanın kıvamı sana biraz sulu gelmeli. Naneyi en sona koymak aromasını korur. Servis ederken tereyağında kızdırılmış naneyi üzerine gezdirmek çorbanın kokusunu belirgin biçimde canlandırır. Tuzu kesmeler piştikten sonra eklemek, nohut ve salçanın tuzunu da hesaba katarak doğru ayarlamanı sağlar.

      '
  faq:
  - q: Kesme çorba kaç dakikada pişer?
    a: 'Mercimek 20 dakika haşlanır, kesmeler eklendikten sonra 10 dakika kaynar. Hamur hazırlığıyla birlikte toplam 60 dakika sürer.

      '
  - q: Kesme hamuru nasıl yapılır?
    a: 'Un, yumurta, tuz ve iki yemek kaşığı suyla sert bir hamur yoğrulur, ince açılıp 20 dakika kurutulur. Sonra rulo yapılıp kibrit çöpü inceliğinde kesilir.

      '
  - q: Kesme çorbada ev kesmesi yerine ne kullanılır?
    a: 'Hazır erişte kullanabilirsin. Pişme süresine paketten bakıp kesmeleri eklediğin aşamada çorbaya koy.

      '
  - q: Kesme çorba glutensiz yapılır mı?
    a: 'Kesme hamurundaki un yerine aynı ölçü pirinç unu kullanılabilir. Pirinç unlu hamur daha kırılgan olur, bu yüzden kalınca kesmek işini kolaylaştırır.

      '
kiymali-taco:
  aramaBasligi: 'Kıymalı taco tarifi: Baharatlı kıymayla 30 dakikada'
  editorNote: 'Kıymaya hazır taco baharatı yerine kimyon, toz kırmızı biber ve kekik koyduk; üçü de her mutfakta bulunur. Tortillayı kuru tavada ısıtma adımını ayrı yazdık, çünkü soğuk tortilla katlanırken kırılır.

    '
  intro: 'Taco, mısır ya da buğday tortillasının içine et, sebze ve sos konup elde yenen bir Meksika yemeği. Bu tarifte en bilinen haliyle, baharatlı kıymalı dolgu ve taze üstlüklerle hazırlanıyor.


    Soğan ve sarımsakla kavrulan dana kıyma kimyon, toz kırmızı biber, kekik ve salçayla suyunu çekene kadar pişiriliyor. Tortillalar kuru tavada her yüzü 20 saniye ısıtılıyor. Marul, küp domates, rendelenmiş kaşar ya da çedar, yoğurt ya da ekşi krema ve misket limonu ise sofraya ayrı ayrı konuyor; herkes kendi tacosunu dolduruyor.


    4 kişilik tarifin hazırlığı 15, pişirmesi 15 dakika; toplam 30 dakika. 8 mini tortilla ya da taco kabuğu için hesaplandı. Hafta içi akşamları için hızlı, misafirliğe de uygun bir sofra.

    '
  notes:
  - t: Kıymanın suyunu çekmesi
    d: 'Taco dolgusu sulu olursa tortillayı ıslatır ve taco elde dağılır. Kıymayı geniş bir tavada, yüksek ateşte pişirmeye başla; dar tavada kıyma kendi suyunda haşlanır. Baharatları ve salçayı kıyma rengini değiştirdikten sonra ekle ki salça kavrulsun ve çiğ tadı gitsin. 12 dakikanın sonunda tavada sıvı kalmamalı. Kıyma kuru gelirse bir iki kaşık su ekleyip hemen çektirmek, dolguyu yapışkan ve sulu olmadan nemli tutar.

      '
  - t: Tortilla mı taco kabuğu mu
    d: 'Yumuşak mini tortilla katlanabilir ve doldurulması kolaydır; çıtır taco kabuğu ise hazır şeklinde gelir ama ilk ısırıkta kırılmaya meyillidir. Yumuşak tortillayı kuru tavada her yüzü 20 saniye ısıtmak esnekliğini artırır, hafif kızarmış bir koku da verir. Isıttığın tortillaları temiz bir bezle sararsan sofrada sıcak ve yumuşak kalır. Tortilla bulamazsan lavaşı küçük daireler halinde kesip aynı şekilde ısıtabilirsin. Taco kabuğu kullanacaksan dolguyu servis anında koy; bekleyen kabuk dolgunun nemiyle yumuşar.

      '
  - t: Üstlükler ve sos
    d: 'Tarifte ekşi krema yerine yoğurt da var; süzme yoğurda bir tatlı kaşığı limon suyu eklersen ekşi kremaya yakın bir tat alırsın. Kaşar yerine mozzarella ya da eriyen herhangi bir peynir olur. Domatesi küp doğradıktan sonra süzgece almak tacoya fazla su gitmesini önler. Misket limonunu son anda sıkmak tüm tabağı canlandırır. Guacamole ya da ince doğranmış kırmızı soğan da bu sofraya iyi gider.

      '
  faq:
  - q: Kıymalı taco içi nasıl yapılır?
    a: 'Soğan ve sarımsak kavrulur, kıyma eklenir; kimyon, toz kırmızı biber, kekik, tuz ve salçayla suyunu çekene kadar yaklaşık 12 dakika pişirilir.

      '
  - q: Tortilla nasıl ısıtılır?
    a: 'Kuru bir tavada her yüzünü 20 saniye ısıtman yeterli. Isıttıklarını bir bezle sararsan yumuşak kalır.

      '
  - q: Taco için tortilla yerine ne kullanılır?
    a: 'Lavaş kullanabilirsin. Küçük daireler halinde kesip tortilla gibi kuru tavada ısıt.

      '
  - q: Taco sosu yerine ne konur?
    a: 'Yoğurt ya da ekşi krema ve misket limonu yeterli bir sos olur. Süzme yoğurda biraz limon suyu eklersen ekşi kremaya yakın bir tat elde edersin.

      '
kizarmis-pilav:
  aramaBasligi: 'Kızarmış pilav tarifi: Dünkü pilavla 20 dakikada fried rice'
  editorNote: 'Tarifi bilinçli olarak bir gün önceden pişmiş soğuk pirinçle yazdık; taze pirinç tavada yapışıp lapalaşıyor. Yumurtayı ayrı bir kapta değil, sebzeleri kenara itip aynı wok''ta pişirdik ki tek tava kirlensin.

    '
  intro: 'Kızarmış pilav (fried rice), önceden pişmiş pirincin yüksek ateşte yumurta, sebze ve soya sosuyla kavrulduğu, Çin mutfağıyla bilinen pratik bir yemek. Dünden kalan pilavı değerlendirmenin en hızlı yollarından biri.


    Bu tarifte wok''ta kızdırılan yağda sarımsak, minik küp havuç ve bezelye 3 dakika çevriliyor. Sebzeler kenara itilip yumurtalar aynı tavada karıştırılarak pişiriliyor. Ardından soğuk pirinç eklenip topakları dağıtılarak 3-4 dakika yüksek ateşte kavruluyor; soya sosu, isteğe bağlı susam yağı ve taze soğanla tamamlanıyor.


    2 kişilik tarif 10 dakika hazırlık ve 10 dakika pişirmeyle toplam 20 dakikada hazır. Kalan tavuk, karides ya da et ekleyerek daha doyurucu hale getirebilirsin.

    '
  notes:
  - t: Neden dünkü pirinç
    d: 'Taze pişmiş pirinç sıcakken nemli ve yumuşaktır; tavaya girince taneler birbirine yapışır ve lapa olur. Buzdolabında bir gece bekleyen pirinç ise yüzeyindeki nemi kaybeder, taneleri sertleşir ve yüksek ateşte ayrı ayrı kavrulur. Elinde dünkü pilav yoksa pirinci pişirip geniş bir tepsiye yay ve tamamen soğut; sonuç tam aynı olmasa da yaklaşır. Kavurmadan önce soğuk pirinci elinle ufalayıp topakları açmak işini kolaylaştırır.

      '
  - t: Yüksek ateş ve hız
    d: 'Kızarmış pilav birkaç dakikada pişer, bu yüzden tüm malzemeyi ocağı açmadan önce doğrayıp hazırla. Wok ya da geniş bir tava kullan ve yağı iyice kızdır; ısı düşük olursa pirinç kavrulmak yerine buharlanır. Pirinci ekledikten sonra sürekli karıştır ama tavayı aşırı doldurma. Porsiyonu iki katına çıkaracaksan iki partide yapmak daha iyi sonuç verir. Soya sosunu tavanın kenarından dökersen hafifçe karamelize olur.

      '
  - t: Soya sosu ve alternatifler
    d: 'Soya sosu hem tuz hem renk verir; bu yüzden tarifte ayrıca tuz yok. Tadına bakmadan fazladan soya ekleme, pilav kolayca tuzlu olur. Glutensiz tüketiyorsan buğday içermeyen tamari kullanabilirsin. Susam yağı isteğe bağlı ama koyu, kavrulmuş aroması tabağın Asya karakterini belirgin hale getirir; ısıyla bozulduğu için en sonda ekle. Dondurulmuş bezelye kullanacaksan çözdürmeden doğrudan tavaya atabilirsin. Taze soğanı en son eklemek rengini ve hafif keskin tadını korur.

      '
  faq:
  - q: Kızarmış pilav için hangi pirinç kullanılır?
    a: 'Bir gün önceden pişirilip buzdolabında soğutulmuş pirinç en iyi sonucu verir. Taze pişmiş pirinç tavada yapışıp lapalaşır.

      '
  - q: Fried rice kaç dakikada hazır olur?
    a: 'Hazırlık 10, pişirme 10 dakika; toplam 20 dakika. Pirinç tavada yüksek ateşte 3-4 dakika kavrulur.

      '
  - q: Kızarmış pilava ne eklenir?
    a: 'Havuç, bezelye, yumurta ve taze soğan temel malzemeler. Kalan tavuk, karides ya da et ekleyerek tam bir öğün yapabilirsin.

      '
  - q: Soya sosu yerine ne kullanılır?
    a: 'Glutensiz için tamari kullanılabilir. Hiç soya sosu yoksa biraz tuz ve bir kaşık pekmezle renk ve tat verebilirsin.

      '
kung-pao-tavuk:
  aramaBasligi: 'Kung pao tavuk tarifi: Yer fıstıklı, kuru biberli wok'
  editorNote: 'Tavuk göğsü yerine butu seçtik; yüksek ateşte kurumadan sulu kalıyor. Kuru biber, sarımsak ve zencefili 30 saniyelik ayrı bir adım olarak yazdık, çünkü biber yanarsa tüm tava acılaşıyor.

    '
  intro: 'Kung pao tavuk, Çin''in Sichuan bölgesinden çıkan, küp doğranmış tavuğun kuru acı biber ve yer fıstığıyla wok''ta hızla pişirildiği bir yemek. Tadı acı, tatlı ve ekşinin bir arada olduğu parlak bir sostan gelir.


    Bu tarifte küçük küp doğranmış tavuk but, mısır nişastası ve bir kaşık soya sosuyla karıştırılıp wok''ta kızarana kadar çevriliyor ve ayrılıyor. Aynı tavada kuru biber, sarımsak ve taze zencefil 30 saniye kokusunu salıyor. Tavuk geri dönüyor; soya sosu, pirinç sirkesi, şeker ve nişastadan çırpılan sos koyulaşınca kavrulmuş yer fıstığı ve taze soğanla tamamlanıyor.


    3 kişilik tarifin hazırlığı 15, pişirmesi 10 dakika; toplam 25 dakika. Yanına sade pilav iyi gider.

    '
  notes:
  - t: Nişastalı tavuk
    d: 'Tavuğu pişirmeden önce mısır nişastası ve biraz soya sosuyla karıştırmak, yüzeyinde ince bir kaplama oluşturur. Bu kaplama yüksek ateşte tavuğun suyunu içinde tutar ve sosun etin üzerine tutunmasını sağlar. Tavukları wok''a tek kat halinde koy; üst üste yığılırsa kızarmak yerine haşlanır. Gerekirse iki partide pişir. Tavuk 5 dakikada dışı kızarıp içi pişmiş olmalı, sonra tabağa ayrılır ve en sonda sosla buluşur.

      '
  - t: Kuru biberle çalışmak
    d: 'Kuru acı biberler yağa aromasını çok hızlı verir ama aynı hızla yanar. Yanmış biber acı ve is kokulu bir tat bırakır. Bu yüzden biber, sarımsak ve zencefil yalnızca 30 saniye çevrilir; tüm malzeme önceden elinin altında olmalı. Daha az acı istersen biberleri bütün bırak, çekirdeklerini ayıkla. Sichuan biberi bulursan bir tutam eklemek ağızda hafif uyuşturan, bu yemeğe özgü hissi verir.

      '
  - t: Sosun kıvamı
    d: 'Sos malzemelerini önceden bir kasede çırpmak, wok''a döktüğünde nişastanın topaklanmasını önler. Nişasta dibe çöktüğü için dökmeden hemen önce bir kez daha karıştır. Sos birkaç saniyede koyulaşır ve tavukları parlak bir tabakayla kaplar. Pirinç sirkesi yoksa yarı ölçü limon suyu kullanabilirsin. Yer fıstığını en sona eklemek çıtırlığını korur; sosla uzun süre bekleyen fıstık yumuşar. Sos fazla koyulaşırsa bir iki kaşık su ekleyerek hemen açabilirsin.

      '
  faq:
  - q: Kung pao tavuk acı mı?
    a: 'Kuru acı biberle yapıldığı için acıdır. Acıyı azaltmak için biber sayısını düşürebilir ya da çekirdeklerini ayıklayabilirsin.

      '
  - q: Kung pao tavuk kaç dakikada pişer?
    a: 'Tavuk wok''ta yaklaşık 5 dakikada kızarır, toplam pişirme 10 dakikayı geçmez. Hazırlıkla birlikte 25 dakikada hazır olur.

      '
  - q: Pirinç sirkesi yerine ne kullanılır?
    a: 'Yarı ölçü limon suyu kullanabilirsin. Ekşilik biraz daha keskin olur ama sosun dengesi korunur.

      '
  - q: Kung pao tavuk wok olmadan yapılır mı?
    a: 'Evet, geniş ve kalın tabanlı bir tava da olur. Önemli olan tavayı çok iyi ısıtmak ve tavukları tek kat halinde pişirmek.

      '
kuru-patlican-dolmasi:
  aramaBasligi: 'Kuru patlıcan dolması tarifi: Antep usulü, nar ekşili'
  editorNote: 'Kurutmaları yalnızca 5 dakika haşlamayı seçtik; daha uzunu kabukları yumuşatıp yırtıyor. Harcı gevşek doldurmayı ayrıca vurguladık, çünkü pirinç pişerken şişer ve sıkı doldurulan dolma patlar.

    '
  intro: 'Kuru patlıcan dolması, yazın oyulup ipe dizilerek kurutulan patlıcan ve biberlerin kışın kıymalı pirinçli harçla doldurulduğu bir yemek. Gaziantep başta olmak üzere Güneydoğu Anadolu mutfağıyla özdeşleşmiştir.


    Bu tarifte 20 kuru patlıcan ve 10 kuru biber önce kaynar suda kısa süre haşlanıp yumuşatılıyor. Dana kıyma, pirinç, rendelenmiş soğan, salçaların yarısı, isot, nane, tuz ve yağdan yoğrulan harç gevşekçe dolduruluyor. Dolmalar tencereye dik ve sıkı diziliyor; kalan salça, nar ekşisi ve sıcak su üzerine dökülüp kısık ateşte pişiriliyor. Nar ekşisi Antep usulünün belirgin ekşi-tatlı tadını veriyor.


    6 kişilik tarifin hazırlığı 40, pişirmesi 50 dakika; toplam 90 dakika. Glutensiz bir ana yemek.

    '
  notes:
  - t: Kurutmaları haşlamak
    d: 'Kuru patlıcan ve biberler sert ve kırılgandır; doğrudan doldurulmaya çalışılırsa çatlar. Kaynar suda 5 dakika haşlamak onları esnek hale getirir. Haşlama sonrası soğuk sudan geçirmek pişmeyi durdurur ve kabukların elde dağılmasını önler. Fazla haşlanan kurutma yumuşar, doldururken yırtılır ve tencerede şeklini kaybeder. Haşladıktan sonra suyunu iyice süzmek de önemli; içinde kalan su harcı sulandırır. Haşlamaya başlamadan önce kurutmaların tozunu almak için kısa süre ılık suda çalkalamak iyi bir alışkanlıktır.

      '
  - t: Gevşek doldurma
    d: 'Harçtaki pirinç çiğ girer ve pişerken şişer. Dolmaları sıkı doldurursan pirinç genişleyecek yer bulamaz, kabuk patlar ve harç tencereye dağılır. Harcı kaşıkla ya da parmak ucuyla hafifçe yerleştir, ağızlarını içe doğru bastırarak kapat. Dolmaları tencereye dik ve sıkı dizmek ise pişerken devrilip açılmalarını engeller. Üzerine ters bir tabak koymak dolmaları yerinde tutar ve suyun eşit dolaşmasını sağlar. Tencerede dolmalar arasında boşluk kalırsa haşlanmış kurutma artıklarıyla doldurabilirsin.

      '
  - t: Nar ekşisi ve isot
    d: 'Nar ekşisi bu dolmanın imzasıdır; tencereye dökülen suya karışır ve pişme boyunca dolmalara ekşi-tatlı bir tat geçirir. Yoksa limon suyu ve bir tatlı kaşığı bal ya da pekmez benzer bir denge sağlar. İsot, Urfa''ya özgü koyu renkli, hafif isli bir biberdir; bulamazsan pul biber ve bir tutam füme paprika kullanabilirsin. Kıymayı yeşil mercimek ya da ince doğranmış mantarla değiştirerek etsiz bir harç da hazırlayabilirsin.

      '
  faq:
  - q: Kuru patlıcan kaç dakika haşlanır?
    a: 'Kaynar suda 5 dakika haşlamak yeterli. Yumuşayınca soğuk sudan geçirip süz; fazla haşlanırsa yırtılır.

      '
  - q: Kuru patlıcan dolması kaç dakika pişer?
    a: 'Dolmalar üzerine tabak kapatılarak kısık ateşte 50 dakika pişer. Hazırlıkla birlikte toplam 90 dakika sürer.

      '
  - q: Kuru patlıcan dolması neden patlar?
    a: 'Harç sıkı doldurulduğunda pirinç pişerken şişip kabuğu yırtar. Gevşek doldurup ağızlarını hafifçe içe bastırmak bunu önler.

      '
  - q: Nar ekşisi yerine ne kullanılır?
    a: 'Limon suyu ve bir tatlı kaşığı bal ya da pekmez karışımı kullanılabilir.

      '
kuskus-salatasi:
  aramaBasligi: 'Kuskus salatası tarifi: Narlı ve limonlu, 20 dakikada'
  editorNote: 'Kuskusu kaynatmak yerine kaynar suda bekleterek şişirmeyi seçtik; ocak neredeyse hiç kullanılmıyor ve taneler lapalaşmıyor. Çatalla ayırma adımını özellikle yazdık, çünkü atlanırsa kuskus topak topak kalıyor.

    '
  intro: 'Kuskus salatası, kaynar suda şişirilen kuskusun bol yeşillik, sebze ve limonlu bir sosla karıştırıldığı ferah bir yaz salatası. Kısıra benzer ama bulgur yerine kuskusla yapıldığı için daha hafif ve çok daha hızlı hazırlanır.


    Bu tarifte kuskus tuzla bir kaba alınıp üzerine kaynar su dökülüyor ve kapağı kapalı 5 dakika bekletiliyor. Çatalla tanelerine ayrılıp soğutulan kuskus; küp salatalık, domates, yeşil soğan, maydanoz ve taze naneyle buluşuyor. Zeytinyağı, limon suyu, nar ekşisi ve pul biberden çırpılan sos ekleniyor, üzerine nar taneleri serpiliyor.


    4 kişilik tarif 15 dakika hazırlık ve 5 dakika beklemeyle toplam 20 dakikada hazır. Vegan bir salata; soğuk servis edilir ve ofise götürmeye uygundur.

    '
  notes:
  - t: Kuskusu doğru şişirmek
    d: 'Tarifteki kuskus, kaynar suyu emerek pişen ince taneli türdendir. Kuskus ve su oranı birebir; fazla su taneleri yapışkan yapar, az su ise sert bırakır. Kaynar suyu döktükten sonra kabın üzerini hemen kapat ki buhar içeride kalsın. 5 dakika sonra taneleri çatalla kabartarak ayır; kaşıkla karıştırmak taneleri ezer. Sebzelerle karıştırmadan önce kuskusun tamamen soğumasını bekle, yoksa yeşillikler solar. Tuzu kuskusla birlikte, suyu dökmeden önce eklemek tanelerin eşit tuzlanmasını sağlar.

      '
  - t: Sulanmayı önlemek
    d: 'Domates ve salatalık doğrandıktan sonra su salar. Salatayı hemen yemeyeceksen domatesin çekirdekli sulu kısmını ayırmak işe yarar. Salatalığı da küçük küp doğramak suyunu dengeli dağıtır. Salata bir saat dinlenirse kuskus sosu iyice çeker ve tatlar birbirine geçer; bu yüzden önceden hazırlamak avantajlıdır. Nar tanelerini servis anında serpmek hem rengini hem çıtırlığını korur. Sosu salatayla karıştırmadan önce ayrı bir kasede iyice çırpmak, zeytinyağı ve limonun her yere eşit dağılmasını sağlar.

      '
  - t: Glutensiz ve diğer seçenekler
    d: 'Kuskus buğdaydan yapıldığı için gluten içerir. Glutensiz bir salata istersen kuskus yerine kinoa kullanabilirsin; kinoayı paketteki süreye göre haşlayıp süzdükten sonra soğutman gerekir. Taze nane bulamazsan üçte bir ölçü kuru nane yeterli olur. Nar ekşisi yoksa limon suyu ve bir tatlı kaşığı bal ya da pekmez benzer bir tat verir. Limon yerine misket limonu da kullanılabilir. Pul biberi azaltarak ya da artırarak salatanın acısını kendi damak tadına göre ayarlayabilirsin.

      '
  faq:
  - q: Kuskus salatası için kuskus nasıl pişirilir?
    a: 'Kuskusa tuz ekleyip aynı miktarda kaynar su dök, üzerini kapatıp 5 dakika beklet. Sonra çatalla tanelerini ayırıp soğut.

      '
  - q: Kuskus salatası ile kısır arasındaki fark ne?
    a: 'Kısır ince bulgurla, bu salata kuskusla yapılır. Kuskus 5 dakikada şiştiği için salata daha hızlı hazırlanır ve dokusu daha hafiftir.

      '
  - q: Kuskus salatası önceden yapılır mı?
    a: 'Evet. Bir saat dinlenirse sosu iyice çeker. Nar tanelerini servisten hemen önce eklemek daha iyi olur.

      '
  - q: Kuskus salatası glutensiz olur mu?
    a: 'Kuskus buğday ürünü olduğu için gluten içerir. Glutensiz için kuskus yerine kinoa kullanabilirsin.

      '
lalanga:
  aramaBasligi: 'Lalanga tarifi: Yoğurtlu hamurdan tavada kahvaltı pişisi'
  editorNote: 'Hamuru 10 dakika dinlendirmeyi ayrı bir adım olarak yazdık; kabartma tozu bu sürede çalışmaya başlıyor ve lalanga daha kabarık oluyor. Tavaya her seferinde yalnızca bir kaşık yağ koymayı seçtik, çünkü bol yağda hamur ağırlaşıyor.

    '
  intro: 'Lalanga, yumurta, yoğurt, süt ve undan hazırlanan akışkan bir hamurun tavada iki yüzü kızartılarak pişirildiği eski usul bir kahvaltılık. Pankeke benzer ama yoğurt sayesinde daha yumuşak ve hafif ekşimsi bir tadı vardır.


    Bu tarifte yumurta, yoğurt ve süt çırpılıyor; un, kabartma tozu ve tuz eklenerek krep hamurundan biraz koyu bir kıvam elde ediliyor. Hamur 10 dakika dinlendikten sonra az yağlı tavaya kepçeyle dökülüyor, tava büyüklüğünde ya da avuç içi boyunda yayılıyor. Altı kızarıp üstü kabarcıklanınca çevriliyor. Sıcakken üzüm pekmezi ya da bal gezdirilip beyaz peynirle servis ediliyor.


    4 kişilik tarifin hazırlığı 10, pişirmesi 15 dakika; toplam 25 dakika. Hafta sonu kahvaltısı için hızlı bir seçenek.

    '
  notes:
  - t: Hamurun kıvamı
    d: 'Lalanga hamuru krep hamurundan biraz koyu, ama kepçeden akacak kadar akışkan olmalı. Çok koyu hamur tavada yayılmaz, kalın ve hamurumsu kalır; çok sulu hamur ise krep gibi incelir ve kabarmaz. Hamur koyu gelirse bir iki kaşık süt, sulu gelirse bir kaşık un ekle. Unu eklerken topak kalmaması için çırpma telini kullan. 10 dakikalık dinlenme unun sıvıyı emmesini ve kabartma tozunun etkinleşmesini sağlar.

      '
  - t: Ne zaman çevirmeli
    d: 'Lalangayı çevirmek için doğru an, yüzeyinde kabarcıklar oluşup patlamaya başladığı ve kenarların kurumaya başladığı andır. Daha erken çevirirsen hamur dağılır, geç kalırsan alt yüz kararır. Tava orta ateşte olmalı; yüksek ateşte dışı yanarken içi çiğ kalır. Diğer yüzü 1-2 dakikada pişer. İlk lalanga genelde tavanın ısısını ayarlamak için deneme olur; sonrakiler daha düzgün çıkar. Spatulayı lalanganın altına tamamen geçirip tek hareketle çevirmek, yumuşak hamurun katlanmasını önler.

      '
  - t: Tatlı ya da tuzlu servis
    d: 'Klasik servis, sıcak lalanganın üzerine üzüm pekmezi ya da bal gezdirip yanında beyaz peynirle yemektir. Tatlı ve tuzlunun bir arada olması lalanganın sevilen tarafıdır. Tuzlu bir versiyon istersen hamura ince kıyılmış dereotu ve ufalanmış beyaz peynir ekleyebilirsin. Beyaz peynir yerine tuzlu lor ya da tulum da olur. Pişen lalangaları üst üste koyup üzerini bezle örtmek, servise kadar yumuşak kalmalarını sağlar.

      '
  faq:
  - q: Lalanga ile pankek arasındaki fark ne?
    a: 'Lalanga hamurunda yoğurt bulunur, bu da ona daha yumuşak bir doku ve hafif ekşimsi bir tat verir. Genellikle pekmez ya da bal ve beyaz peynirle yenir.

      '
  - q: Lalanga nasıl kabarık olur?
    a: 'Hamuru kabartma tozuyla hazırlayıp 10 dakika dinlendir ve orta ateşte pişir. Hamurun krep hamurundan biraz koyu olması da kabarmasına yardım eder.

      '
  - q: Lalanga kaç dakikada pişer?
    a: 'Her biri alt yüzü kızarınca çevrilip diğer yüzü 1-2 dakika pişirilir. Tüm hamur yaklaşık 15 dakikada biter.

      '
  - q: Lalanga hamurunda yoğurt yerine ne kullanılır?
    a: 'Kefir ya da ayran kullanabilirsin. Vegan bir versiyon için soya ya da hindistan cevizi yoğurdu olur.

      '
lebeniye-corbasi:
  aramaBasligi: 'Lebeniye çorbası tarifi: Minik köfteli, nohutlu Antep usulü'
  editorNote: 'Terbiyeyi önce birkaç kepçe sıcak suyla ılıştırmayı ayrı adım olarak yazdık; doğrudan kaynayan tencereye dökülen yoğurt kesilir. Unu terbiyeye koyduk ve pirinç ununu öne çıkardık, çünkü yoğurdun kesilmesini daha iyi önlüyor.

    '
  intro: 'Lebeniye, minik köftelerin ve nohudun yumurtalı yoğurt terbiyesiyle pişirildiği sıcak bir yoğurt çorbası. Gaziantep mutfağının bilinen çorbalarından biridir; adı Arapçada yoğurt anlamına gelen kelimeden türemiştir.


    Bu tarifte dana kıyma, ince bulgur, rendelenmiş soğan, tuz ve karabiber yoğrulup nohut büyüklüğünde köfteler yuvarlanıyor. Köfteler ve haşlanmış nohut kaynayan suda 10 dakika pişiyor. Yoğurt, yumurta ve un çırpılıp sıcak suyla ılıştırılarak sürekli karıştırılarak tencereye ekleniyor. Çorba kaynayınca 5 dakika daha pişiriliyor ve üzerine tereyağında kızdırılmış nane gezdiriliyor.


    6 kişilik tarifin hazırlığı 30, pişirmesi 30 dakika; toplam 60 dakika. Köfteleri önceden yapıp dondurarak süreyi kısaltabilirsin.

    '
  notes:
  - t: Yoğurdun kesilmemesi
    d: 'Yoğurt aniden yüksek ısıyla karşılaşırsa proteinleri topaklanır ve çorba kesilir. Bunu önlemenin yolu terbiyedir: yoğurt, yumurta ve unu iyice çırp, tencereden birkaç kepçe sıcak suyu yavaşça ekleyerek karışımı ılıştır. Sonra terbiyeyi sürekli karıştırarak tencereye dök ve kaynayana kadar karıştırmayı bırakma. Un, özellikle pirinç unu, yoğurdu dengeler. Yoğurdu buzdolabından önceden çıkarıp oda sıcaklığına getirmek de yardımcı olur. Terbiye eklendikten sonra çorbayı yüksek ateşte fokurdatmamak da kesilme riskini azaltır.

      '
  - t: Minik köfteler
    d: 'Köftelerin nohut büyüklüğünde olması hem hızlı ve eşit pişmelerini hem de çorbanın kaşıkta zarif durmasını sağlar. Köfte harcına konan ince bulgur köftelerin dağılmasını önler. Ellerini hafifçe ıslatarak yuvarlarsan harç yapışmaz ve iş hızlanır. Köfteleri bir tepsiye dizip dondurucuda tek tek dondurduktan sonra torbaya aktarabilirsin; böylece birbirine yapışmaz ve gerektiğinde doğrudan kaynayan suya atılır. Glutensiz için bulgur yerine ince kinoa kullanılabilir.

      '
  - t: Su mu et suyu mu
    d: 'Tarifte çorbanın tabanı su ya da et suyu olarak verildi. Et suyu çorbaya daha derin bir tat verir; köfteler de kendi lezzetini suya bıraktığı için su ile de iyi sonuç alınır. Hazır et suyun yoksa sıcak suya bir tatlı kaşığı tereyağı ve bir tutam tuz eklemek ya da yarım bulyon kullanmak yeterli olur. Bulyon kullanırsan tuzu azaltarak başla. Nohut için konserve haşlanmış nohut pratik bir seçimdir.

      '
  faq:
  - q: Lebeniye çorbası neden kesilir?
    a: 'Yoğurt terbiyesi ılıştırılmadan kaynar suya dökülürse kesilir. Terbiyeyi önce birkaç kepçe sıcak suyla ılıştır, sonra sürekli karıştırarak ekle.

      '
  - q: Lebeniye çorbası kaç dakikada pişer?
    a: 'Köfteler ve nohut 10 dakika haşlanır, terbiye eklendikten sonra çorba kaynayınca 5 dakika daha pişer. Köfte hazırlığıyla toplam 60 dakika sürer.

      '
  - q: Lebeniye köfteleri dondurulur mu?
    a: 'Evet. Köfteleri yuvarlayıp tepside tek tek dondurduktan sonra torbaya aktar; gerektiğinde doğrudan kaynayan suya ekleyebilirsin.

      '
  - q: Lebeniye çorbasında un yerine ne kullanılır?
    a: 'Pirinç unu kullanabilirsin; yoğurdun kesilmesini normal undan daha iyi önler.

      '
lor-ezmesi:
  aramaBasligi: 'Lor ezmesi tarifi: Otlu, zeytinyağlı, 10 dakikada kahvaltılık'
  editorNote: 'Loru yoğurtla ezmeyi seçtik; tek başına lor kuru ve dağınık kalıyor, iki kaşık yoğurt onu sürülebilir hale getiriyor. Zeytinyağını karışıma katmak yerine üzerine gezdirdik ki kokusu taze kalsın.

    '
  intro: 'Otlu lor ezmesi, lor peynirinin yoğurt ve bol yeşillikle ezilip zeytinyağıyla tatlandırıldığı hafif bir kahvaltılık. Ocak gerektirmiyor; birkaç dakikada hazırlanıp hem kahvaltı sofrasına hem meze tabağına konabiliyor.


    Bu tarifte 250 gram lor, iki yemek kaşığı yoğurtla çatal yardımıyla eziliyor. İnce doğranmış dereotu, maydanoz ve taze soğan ekleniyor; tuz ve pul biberle tatlandırılan ezmenin üzerine zeytinyağı gezdiriliyor. Lorun hafif tadı yeşilliklerin ferahlığıyla dengeleniyor.


    4 kişilik tarif yalnızca 10 dakikalık hazırlık istiyor, pişirme yok. Glutensiz bir tarif; ekmek, galeta ya da çıtır ekmekle servis edebilirsin. Ezmeyi akşamdan hazırlarsan sabah sofrası birkaç dakikada kurulur, yeşillikleri ise servis anında karıştırmak tazeliğini korur.

    '
  notes:
  - t: Lorun nemi
    d: 'Lor peynirinin nemi markaya ve tazeliğine göre değişir. Çok kuru bir lor kullanıyorsan yoğurdu bir kaşık artırabilirsin; çok sulu bir lorsa önce bir süzgeçte birkaç dakika süzmek ezmenin cıvık olmasını önler. Loru ezerken çatal kullanmak hafif taneli bir doku bırakır; tamamen pürüzsüz bir ezme istersen kısa süre blenderdan geçirebilirsin. Tuzu en son, tadına bakarak ekle; bazı lorlar hafif tuzlu gelir.

      '
  - t: Yeşilliklerin hazırlığı
    d: 'Dereotu, maydanoz ve taze soğanı yıkadıktan sonra iyice kurula. Islak yeşillik ezmeye su bırakır ve kısa sürede sulanmasına neden olur. Yeşillikleri keskin bir bıçakla ince doğramak hem aromalarını açar hem de ezmeye eşit dağılmalarını sağlar. Dereotu bulamazsan maydanoz ve biraz taze nane kullanabilirsin. Daha doyurucu bir ezme için biraz kırılmış ceviz ya da çökelek eklemek de iyi bir seçenek. Taze soğanın yeşil kısmını da kullanmak ezmeye hem renk hem hafif bir keskinlik katar.

      '
  - t: Saklama ve servis
    d: 'Lor ezmesi en iyi taze hazırlandığında yenir. Artanı kapalı bir kapta buzdolabında saklayabilirsin, ancak yeşillikler zamanla solar ve ezme biraz su bırakabilir; tüketmeden önce karıştırman yeterli. Zeytinyağını ve pul biberi servis anında üzerine gezdirmek görünümü canlı tutar. Kahvaltı dışında galeta ya da çıtır ekmekle meze olarak, ya da tam buğday ekmeğine sürülerek pratik bir ara öğün olarak da sunulabilir. Pul biber yerine biraz kekik ya da sumak kullanmak da ezmeye farklı bir tat verir.

      '
  faq:
  - q: Lor ezmesi nasıl yapılır?
    a: 'Lor peyniri iki yemek kaşığı yoğurtla ezilir, ince doğranmış dereotu, maydanoz ve taze soğan eklenir. Tuz ve pul biberle tatlandırılıp üzerine zeytinyağı gezdirilir.

      '
  - q: Lor ezmesi kaç dakikada hazırlanır?
    a: 'Pişirme olmadığı için yaklaşık 10 dakikada hazırlanır.

      '
  - q: Lor ezmesinde yoğurt yerine ne kullanılır?
    a: 'Süzme yoğurt kullanabilirsin; ezme biraz daha koyu ve kremamsı olur. Yoğurt hiç yoksa bir kaşık daha zeytinyağı eklemek kıvamı yumuşatır.

      '
  - q: Lor ezmesi kaç gün dayanır?
    a: 'Kapalı kapta buzdolabında saklanabilir, ancak yeşillikler solduğu için en iyi taze tüketilir. Bir iki gün içinde bitirmeye çalış.

      '
mahluta-corbasi:
  aramaBasligi: 'Mahluta çorbası tarifi: Bulgurlu, kimyonlu, Hatay usulü'
  editorNote: 'Kimyonu pişirmenin başına değil blenderdan sonraya koyduk; uzun kaynayan kimyon acılaşıyor. Limonu çorbaya katmadık, servis için ayrı verdik ki herkes ekşiliğini kendisi ayarlasın.

    '
  intro: 'Mahluta, kırmızı mercimekle bulgurun birlikte pişirildiği, kimyonlu ve bol limonla içilen bir çorba. Hatay mutfağıyla anılır ve mercimek çorbasının daha baharatlı, hafif taneli bir yorumu olarak bilinir.


    Bu tarifte zeytinyağında küp soğan ve havuç yumuşatılıyor; yıkanmış kırmızı mercimek, pilavlık bulgur ve sıcak su eklenip mercimek dağılana kadar pişiriliyor. Çorba blenderdan geçirildikten sonra kimyon ve tuz eklenip bir taşım kaynatılıyor. Servis ederken pul biber, bol limon ve isteğe bağlı kızarmış ekmek ya da lavaş cipsi ekleniyor.


    6 kişilik tarif 10 dakika hazırlık ve 30 dakika pişirmeyle toplam 40 dakikada hazır. Vegan bir çorba; soğuk kış akşamları için hızlı bir seçenek.

    '
  notes:
  - t: Bulgurun katkısı
    d: 'Mahlutayı sade mercimek çorbasından ayıran bulgurdur. Pilavlık bulgur mercimekle birlikte pişip blenderdan geçince çorbaya kadifemsi ama hafif taneli bir doku verir; ayrıca kıvamı biraz daha koyulaştırır. İnce bulgur kullanırsan bu doku kaybolur. Glutensiz bir çorba istersen bulgur yerine aynı ölçü kinoa ya da pirinç kullanabilirsin; servis ederken de ekmek yerine sade bırakmak gerekir. Mercimeği pişirmeden önce suyu berraklaşana kadar yıkamak köpüğü azaltır.

      '
  - t: Kimyon ve limon
    d: 'Kimyon bu çorbanın karakterini belirleyen baharattır, ancak uzun kaynarsa acımsı bir tat bırakabilir. Bu yüzden blenderdan sonra eklenip yalnızca bir taşım kaynatılıyor. Limon ise çorbanın sonradan eklenen ikinci önemli parçası; mercimeğin yoğun tadını açar ve çorbayı ferahlatır. Tarifte servis için bir limon var, yani her kaseye cömertçe sıkılması bekleniyor. Limon yerine misket limonu ya da yarı ölçü elma sirkesi de kullanılabilir.

      '
  - t: Kıvam ve ısıtma
    d: 'Kırmızı mercimek soğudukça koyulaşır. Çorba ertesi gün jöle kıvamına gelmiş gibi görünebilir; ısıtırken biraz sıcak su ekleyip karıştırman yeterli. Blenderdan sonra çorba sana koyu geliyorsa yine sıcak suyla açabilirsin. Kıtır ekmek ya da lavaş cipsini servis anında eklemek çıtırlığını korur; çorbanın içinde bekleyen ekmek hızla yumuşar. Kırmızı mercimek yerine sarı mercimek de kullanılabilir, renk biraz daha açık olur. Isıtırken dibe tutmaması için ara ara karıştır.

      '
  faq:
  - q: Mahluta çorbası nedir?
    a: 'Kırmızı mercimek ve bulgurla yapılan, kimyonlu ve limonla servis edilen bir çorbadır. Hatay mutfağıyla anılır.

      '
  - q: Mahluta çorbası kaç dakikada pişer?
    a: 'Soğan ve havuç 5 dakika kavrulur, mercimek ve bulgur 25 dakika pişer. Toplam 40 dakikada hazır olur.

      '
  - q: Mahluta ile mercimek çorbası arasındaki fark ne?
    a: 'Mahlutada mercimeğe bulgur eklenir ve kimyon belirgin şekilde kullanılır. Bu da çorbaya daha baharatlı ve hafif taneli bir doku verir.

      '
  - q: Mahluta çorbası glutensiz yapılır mı?
    a: 'Evet. Bulgur yerine kinoa ya da pirinç kullan ve ekmeksiz servis et.

      '
mangolu-hindistan-cevizli-chia-bowl:
  aramaBasligi: 'Mangolu hindistan cevizli chia bowl tarifi: Vegan puding'
  editorNote: 'Chia karışımını 5 dakika sonra ikinci kez karıştırmayı ayrı yazdık; bu adım atlanırsa tohumlar dipte topaklanıyor. Mangonun yarısını püre, yarısını küp yaparak tek meyveden iki farklı doku çıkardık.

    '
  intro: 'Mangolu hindistan cevizli chia bowl, hindistan cevizi sütünde bekletilen chia tohumlarından yapılan bir pudingin mango püresi ve tropik meyvelerle katlandığı soğuk bir kase. Hem kahvaltı hem hafif bir tatlı olarak yenebilir; ocak gerektirmez.


    Bu tarifte chia tohumu, hindistan cevizi sütü, akçaağaç ya da hurma şurubu ve vanilya karıştırılıp buzdolabında en az 2 saat bekletiliyor. Olgun mangonun yarısı limon suyuyla püre yapılıyor, kalanı küp doğranıyor. Hindistan cevizi pulu kuru tavada hafifçe kavruluyor. Kaselere önce puding, sonra mango püresi koyulup mango küpleri, isteğe bağlı çarkıfelek, kavrulmuş hindistan cevizi, kaju ve naneyle bitiriliyor.


    2 kişilik tarifin hazırlığı 10 dakika; pudingin buzdolabında en az 2 saat beklemesi gerekiyor. Vegan ve glutensiz.

    '
  notes:
  - t: Chia pudinginin kıvamı
    d: 'Chia tohumları sıvıyla temas edince dış yüzeylerinde jel benzeri bir tabaka oluşturur ve pudingi koyulaştırır. İlk birkaç dakikada tohumlar bir araya toplanmaya eğilimlidir; bu yüzden 5 dakika sonra karışımı bir kez daha karıştırmak eşit bir kıvam sağlar. En az 2 saat buzdolabında bekleyen puding kaşıkla alınacak kadar koyulaşır. Bir gece bekletmek de olur. Puding fazla koyu olursa biraz hindistan cevizi sütü ekleyip karıştır.

      '
  - t: Olgun mango seçimi
    d: 'Bu kasenin tadı büyük ölçüde mangonun olgunluğuna bağlı. Olgun mangonun kabuğu parmakla bastırınca hafifçe yumuşar ve sap kısmından tatlı bir koku gelir. Sert ve kokusuz mango hem ekşi olur hem pürüzsüz bir püreye dönüşmez. Taze mango bulamazsan 200 gram donuk mango kullanabilirsin; püre için biraz çözülmesini beklemek yeterli. Püreye eklenen limon suyu rengi canlı tutar ve tatlılığı dengeler. Mangoyu doğrarken ortadaki yassı çekirdeğin iki yanından dilimleyip etini kabuğundan kaşıkla ayırmak işini kolaylaştırır.

      '
  - t: Önceden hazırlama
    d: 'Chia bowl önceden hazırlanmaya çok uygundur. Pudingi ve mango püresini kavanozlara katlayıp kapağını kapatırsan buzdolabında 3 gün dayanır ve ofise götürülebilir bir kahvaltı olur. Kavrulmuş hindistan cevizi, kaju ve nane gibi üst malzemeleri ise ayrı bir kapta tutup yemeden hemen önce ekle; aksi halde nemden yumuşarlar. Çarkıfelek bulamazsan bir tutam misket limonu kabuğu rendesi benzer bir ferahlık verir. Badem yerine fındık ya da ceviz de kullanılabilir.

      '
  faq:
  - q: Chia puding kaç saat bekletilir?
    a: 'Buzdolabında en az 2 saat bekletilmelidir. Bir gece bekletirsen daha koyu bir kıvam elde edersin.

      '
  - q: Chia puding neden topaklanır?
    a: 'Tohumlar ilk dakikalarda bir araya toplanır. Karıştırdıktan 5 dakika sonra bir kez daha karıştırırsan topaklanma önlenir.

      '
  - q: Chia bowl kaç gün saklanır?
    a: 'Kapalı kavanozda buzdolabında 3 gün dayanır. Kavrulmuş hindistan cevizi ve kajuyu yemeden hemen önce eklemek daha iyi olur.

      '
  - q: Taze mango yerine ne kullanılır?
    a: '200 gram donuk mango kullanabilirsin. Püre için biraz çözülmesini beklemek yeterli.

      '
mantarli-risotto:
  aramaBasligi: 'Mantarlı risotto tarifi: Parmesanlı, kremamsı, 40 dakikada'
  editorNote: 'Mantarları pirinçle birlikte pişirmek yerine önce yüksek ateşte kızartıp ayırdık; böylece mantar su salıp haşlanmıyor, sonda eklenince rengi ve dokusu korunuyor. Suyu kepçe kepçe eklemeyi ayrı adım olarak yazdık, çünkü risottonun kıvamı tamamen bu sabra bağlı.

    '
  intro: 'Risotto, nişastası bol kısa taneli pirincin sıcak et ya da sebze suyuyla azar azar ve sürekli karıştırılarak pişirildiği kremamsı bir İtalyan pilavı. Kuzey İtalya mutfağının bilinen yemeklerinden biridir.


    Bu tarifte kültür ve istiridye mantarı karışımı önce zeytinyağında yüksek ateşte kızartılıp ayrılıyor. Aynı tavada tereyağının yarısında soğan yumuşatılıyor, yıkanmamış pirinç eklenip 2 dakika çevriliyor. Ardından sıcak sebze ya da tavuk suyu kepçe kepçe eklenip 18-20 dakika sürekli karıştırılıyor. Mantarlar, kalan tereyağı ve rendelenmiş parmesanla bitirilip 2 dakika dinlendiriliyor.


    3 kişilik tarifin hazırlığı 10, pişirmesi 30 dakika; toplam 40 dakika. Arborio bulamazsan baldo pirinç de iyi sonuç verir.

    '
  notes:
  - t: Pirinç seçimi ve yıkamamak
    d: 'Risottonun kremamsı dokusu pirincin yüzeyindeki nişastadan gelir. Arborio bu iş için yetiştirilmiş bir çeşittir; baldo pirinç de nişastası bol olduğu için iyi bir yerli alternatiftir. Osmancık kullanırsan suyu bir parmak azalt. Pirinci kesinlikle yıkama; yıkamak yüzeydeki nişastayı alır ve risotto pilav gibi tane tane kalır. Pirinci soğanla 2 dakika çevirmek tanelerin dışını hafifçe mühürler ve pişerken dağılmalarını önler. Soğanı ince doğramak önemlidir; risottoda soğan görünmemeli, pirincin arasında erimiş gibi kaybolmalıdır.

      '
  - t: Sıcak su ve karıştırmak
    d: 'Eklenen suyun sıcak olması şart. Soğuk su tencerenin ısısını düşürür, pişmeyi keser ve pirinç eşit pişmez. Suyu ayrı bir tencerede kısık ateşte sıcak tut. Her kepçeyi pirinç tamamen çekince ekle ve sürekli karıştır; karıştırma pirincin nişastasını salmasını sağlar. 18-20 dakikanın sonunda pirinç kremamsı ama ortası hafif diri olmalı. Tüm suyu kullanmak zorunda değilsin; kıvamı tadarak takip et. Tuzu pişirmenin sonuna doğru ve tadına bakarak ekle; hazır bulyon ve parmesan da tuz getirir.

      '
  - t: Mantar ve peynir
    d: 'Mantarı ayrı ve yüksek ateşte kızartmak, suyunu hızla buharlaştırıp yüzeyini kızartır. Tavayı kalabalık edersen mantar su salar ve haşlanır; gerekirse iki partide kızart. Kültür mantarı yerine istiridye ya da kestane mantarı da kullanılabilir. Parmesan ve tereyağı ocak kapalıyken eklenir; bu, risottoya parlak ve akışkan bir son kıvam verir. Parmesan yerine ince rendelenmiş eski kaşar ya da kuru tulum peyniri olur.

      '
  faq:
  - q: Risotto için hangi pirinç kullanılır?
    a: 'Arborio en yaygın seçimdir. Bulamazsan baldo pirinç iyi bir alternatif; osmancık kullanacaksan suyu bir parmak azalt.

      '
  - q: Risotto kaç dakikada pişer?
    a: 'Su eklendikten sonra pirinç 18-20 dakika sürekli karıştırılarak pişer. Hazırlıkla birlikte toplam 40 dakika sürer.

      '
  - q: Risotto pirinci yıkanır mı?
    a: 'Hayır. Pirincin yüzeyindeki nişasta risottoyu kremamsı yapar; yıkarsan bu nişasta gider.

      '
  - q: Parmesan yerine ne kullanılır?
    a: 'İnce rendelenmiş eski kaşar ya da kuru tulum peyniri kullanabilirsin.

      '
mercimek-salatasi:
  aramaBasligi: 'Yeşil mercimek salatası tarifi: Nar ekşili, doyurucu'
  editorNote: 'Mercimeği diri kalacak şekilde haşlamayı özellikle belirttik; salatayı lapadan ayıran tek şey bu. Sosladıktan sonra 15 dakika dinlendirme adımını ekledik, çünkü mercimek sosu bu sürede çekiyor.

    '
  intro: 'Yeşil mercimek salatası, diri haşlanmış yeşil mercimeğin küp sebzeler ve nar ekşili bir sosla karıştırıldığı doyurucu bir salata. Bakliyat temelli olduğu için yalnız başına bir öğle yemeği olacak kadar tok tutar.


    Bu tarifte yeşil mercimek tanelerini kaybetmeyecek şekilde haşlanıp süzülüyor ve soğutuluyor. Kırmızı soğan, domates, salatalık ve kapya biber küçük küp doğranıyor, maydanozla birleştiriliyor. Zeytinyağı, nar ekşisi, limon suyu, tuz ve pul biberden hazırlanan sosla karıştırılan salata 15 dakika dinlendiriliyor.


    4 kişilik tarifin hazırlığı 15, pişirmesi 25 dakika; toplam 40 dakika. Vegan ve glutensiz bir salata; kavanozda taşınmaya uygun olduğu için ofis öğle yemeği için de iyi bir seçenek.

    '
  notes:
  - t: Mercimeği diri haşlamak
    d: 'Yeşil mercimek fazla haşlanırsa kabukları açılır, içi un gibi dağılır ve salata lapalaşır. 20 dakikadan itibaren bir iki tane alıp tadına bak; tane yumuşamış ama şeklini koruyor olmalı. Haşlama suyuna tuzu sona doğru eklemek kabukların sertleşmeden pişmesine yardım eder. Pişince hemen süz ve geniş bir kaba yayarak soğut; sıcak suda bekleyen mercimek pişmeye devam eder. Mercimeği önceden yıkayıp taşlarını ayıklamayı unutma.

      '
  - t: Sosun dinlenmesi
    d: 'Mercimek kendi başına oldukça sade bir tada sahiptir; sos bu salatanın bütün karakterini verir. Sosla karıştırdıktan sonraki 15 dakikalık dinlenme, mercimeğin sosu emmesine ve soğanın keskinliğinin yumuşamasına imkan tanır. Mercimek hala hafif ılıkken soslarsan sosu daha iyi çeker. Nar ekşisi yoksa limon suyu ve bir tatlı kaşığı bal ya da pekmez kullanabilirsin. Kapya biber yerine közlenmiş kavanoz biber de olur.

      '
  - t: Taşıma ve saklama
    d: 'Mercimek salatası birçok yeşil salatadan farklı olarak bekledikçe solmaz, aksine tatları birbirine geçer. Bu yüzden akşamdan hazırlayıp ertesi gün öğle yemeğine götürmek için uygundur. Kavanozda taşıyacaksan domates ve salatalığın suyu salatayı sulandırabilir; bu iki sebzeyi ayrı bir kapta tutup yemeden önce eklemek tazeliği korur. Maydanozu da servis anında katmak rengini canlı tutar. Kırmızı soğanın keskinliğini azaltmak istersen doğradıktan sonra birkaç dakika soğuk suda bekletip süzebilirsin.

      '
  faq:
  - q: Yeşil mercimek kaç dakikada haşlanır?
    a: 'Salata için diri kalacak şekilde 20-25 dakika haşlanır. Tane yumuşamış ama şeklini korumuşsa hazırdır.

      '
  - q: Mercimek salatası neden lapa olur?
    a: 'Mercimek fazla haşlandığında kabukları açılıp dağılır. 20. dakikadan itibaren tadına bak ve pişince hemen süz.

      '
  - q: Mercimek salatası önceden hazırlanır mı?
    a: 'Evet, bekledikçe sosu daha iyi çeker. Domates ve salatalığı servise yakın eklersen salata sulanmaz.

      '
  - q: Nar ekşisi yerine ne kullanılır?
    a: 'Limon suyu ve bir tatlı kaşığı bal ya da pekmez karışımı kullanılabilir.

      '
mevlana-corbasi:
  aramaBasligi: 'Mevlana çorbası tarifi: Bakliyatlı, kuşbaşı etli Konya usulü'
  editorNote: 'Nohut, fasulye ve buğdayı ayrı haşlayıp süzmeyi ilk adım olarak yazdık; bakliyatın köpüğü ve bulanık suyu çorbaya geçmesin diye. Yeşil mercimeği haşlamaya katmadık, çünkü o et ve diğer bakliyatla birlikte 45 dakikada yumuşuyor.

    '
  intro: 'Mevlana çorbası, nohut, kuru fasulye, dövme buğday ve yeşil mercimeğin kuşbaşı etle pişirildiği, Konya ile özdeşleşmiş yoğun bir kış çorbası. Bakliyatı ve etiyle bir kasede tam bir öğün sayılır.


    Bu tarifte bir gece önceden ıslatılan nohut, fasulye ve buğday önce ayrı haşlanıp süzülüyor. Tencerede tereyağında kuşbaşı et suyunu salıp çekene kadar kavruluyor, soğan ve salçalar ekleniyor. Haşlanmış bakliyat, yıkanmış yeşil mercimek ve sıcak su eklenip kısık ateşte 45 dakika pişiriliyor. Tuzla 5 dakika daha kaynatılan çorbanın üzerine tereyağında kızdırılmış nane ve pul biber gezdiriliyor.


    6 kişilik tarifin hazırlığı 20, pişirmesi 70 dakika; toplam 90 dakika. Bakliyatı bir gece önceden ıslatmayı unutma.

    '
  notes:
  - t: Bakliyatı ayrı haşlamak
    d: 'Nohut, kuru fasulye ve dövme buğday haşlanırken yoğun köpük ve nişastalı, bulanık bir su bırakır. Bunları ayrı haşlayıp süzmek, çorbanın berrak ve temiz tatlı kalmasını sağlar; ayrıca fasulyenin şişkinlik yapan bileşenlerinin bir kısmı da suyla gider. Düdüklü tencerede 20 dakika yeterlidir, normal tencerede daha uzun sürer. Konserve nohut ve fasulye kullanırsan bu adımı atlayabilir, pişirme süresini kısaltabilirsin. Islatma suyunu da dökmek ve bakliyatı haşlamadan önce yıkamak aynı amaca hizmet eder.

      '
  - t: Etin kavrulması
    d: 'Kuşbaşı eti tereyağında önce suyunu salıp sonra o suyu çekene kadar kavurmak, çorbanın tabanındaki derin tadın kaynağıdır. Tencereyi aşırı doldurma; et haşlanmak yerine kavrulmalı. Su tamamen çekildikten sonra soğanı ekleyip pembeleştir, ardından salçaları koyup kokusu çıkana kadar çevir. Dana yerine kuzu eti de olur; tavuk but kullanırsan pişme süresini yarıya indir, çünkü tavuk çok daha çabuk yumuşar. Biber salçası hem renk hem hafif acı bir tat verir; acı istemiyorsan tatlı biber salçası kullan.

      '
  - t: Kıvam ve ertesi gün
    d: 'Mevlana çorbası tane tane, bakliyatın şeklini koruduğu bir çorbadır. Daha koyu seversen bir kepçe çorbayı blenderdan geçirip tencereye geri eklemek kıvamı yoğunlaştırır. Çorba ertesi gün daha lezzetlidir, çünkü bakliyat tatları emmeye devam eder. Bekledikçe koyulaşacağı için ısıtırken biraz sıcak su eklemen gerekebilir. Nane ve pul biberli tereyağını ısıttıktan sonra, servis anında yeniden hazırlamak kokusunu canlı tutar. Tuzu pişirmenin sonunda eklemek bakliyatın kabuğunun sertleşmesini önler.

      '
  faq:
  - q: Mevlana çorbası kaç dakikada pişer?
    a: 'Bakliyat düdüklüde 20 dakika haşlanır, et 10 dakika kavrulur, ardından çorba 45 dakika pişer ve 5 dakika daha kaynatılır. Hazırlıkla toplam 90 dakika sürer.

      '
  - q: Mevlana çorbasında hangi bakliyatlar var?
    a: 'Nohut, kuru fasulye, dövme buğday ve yeşil mercimek. Nohut, fasulye ve buğday bir gece önceden ıslatılır.

      '
  - q: Mevlana çorbası konserve bakliyatla yapılır mı?
    a: 'Evet. Konserve nohut ve fasulye kullanırsan ıslatma ve haşlama adımını atlayabilir, pişirme süresini kısaltabilirsin.

      '
  - q: Dövme buğday yerine ne kullanılır?
    a: 'Aşurelik buğday ya da iri bulgur kullanılabilir. İri bulguru ıslatmaya gerek yoktur.

      '
minestrone:
  aramaBasligi: 'Minestrone tarifi: Fasulyeli, makarnalı İtalyan sebze çorbası'
  editorNote: 'Makarnayı ve fasulyeyi sebzelerle birlikte değil son 10 dakikada ekledik; erken giren makarna dağılıyor ve çorbanın suyunu çekiyor. Tarifi vegan tuttuk ve peyniri isteğe bırakıyoruz.

    '
  intro: 'Minestrone, mevsim sebzeleri, fasulye ve küçük makarnayla pişirilen bol malzemeli bir İtalyan çorbası. Sabit bir tarifi yoktur; evdeki sebzelere göre değişen, doyurucu bir sebze çorbası olarak bilinir.


    Bu tarifte zeytinyağında soğan, havuç, kereviz sapı ve sarımsak 5 dakika çevrilerek çorbanın aromatik tabanı hazırlanıyor. Patates, kabak, konserve domates ve sıcak sebze suyu eklenip 15 dakika pişiriliyor. Ardından haşlanmış barbunya ya da beyaz fasulye, küçük makarna, tuz ve kekik eklenip makarna pişene kadar 10 dakika daha kaynatılıyor.


    6 kişilik tarifin hazırlığı 15, pişirmesi 35 dakika; toplam 50 dakika. Vegan bir çorba; mevsime göre ıspanak, lahana ya da taze fasulye ekleyebilirsin.

    '
  notes:
  - t: Aromatik taban
    d: 'Soğan, havuç ve kereviz sapını zeytinyağında yavaşça çevirmek, İtalyan mutfağında pek çok çorba ve sosun başlangıcıdır. Bu üçlü 5 dakikada yumuşayıp tatlılaşır ve çorbaya sade suyla elde edilemeyecek bir derinlik verir. Sebzeleri küçük ve eşit doğramak hem hızlı pişmelerini hem kaşıkta dengeli durmalarını sağlar. Sarımsağı yakmamaya dikkat et; yanmış sarımsak çorbanın tamamına acı bir tat geçirir. Kereviz sapı bulamazsan çorba yine olur, ama bu üçlünün tamamlanması tadı belirgin biçimde zenginleştirir.

      '
  - t: Makarna ne zaman eklenir
    d: 'Küçük makarna çorbaya en sonda, fasulyeyle birlikte girer ve yaklaşık 10 dakikada pişer. Daha erken eklenirse aşırı pişip dağılır ve çorbayı bulanıklaştırır. Makarna pişerken suyun bir kısmını çeker; çorba koyulaşırsa biraz sıcak su ekleyebilirsin. Çorbayı önceden hazırlayıp saklayacaksan makarnayı ayrı haşlayıp her kaseye servis anında eklemek, ertesi gün şişmiş makarna sorununu önler. Glutensiz makarna da kullanılabilir. Makarnayı ekledikten sonra ara ara karıştırmak tencerenin dibine yapışmasını önler.

      '
  - t: Fasulye ve sebze esnekliği
    d: 'Tarifte haşlanmış barbunya ya da beyaz fasulye kullanılıyor; konserve fasulye bu çorba için en pratik seçimdir. Kuru fasulye kullanacaksan bir gece ıslatıp ayrıca haşlaman gerekir. Minestronenin güzelliği esnekliğidir: ıspanak, lahana ya da taze fasulye gibi mevsim sebzeleri ekleyebilirsin. Yapraklı sebzeleri son birkaç dakikada eklemek renklerini korur. Servis ederken rendelenmiş peynir çorbayı vegan olmaktan çıkarır ama tadına çok yakışır. Konserve fasulyeyi eklemeden önce süzüp durulamak salamura tadını giderir.

      '
  faq:
  - q: Minestrone çorbası nedir?
    a: 'Sebzeler, fasulye ve küçük makarnayla pişirilen bir İtalyan sebze çorbasıdır. İçine konan sebzeler mevsime göre değişebilir.

      '
  - q: Minestrone kaç dakikada pişer?
    a: 'Sebzeler 5 dakika çevrilir, domatesle 15 dakika pişer, makarna ve fasulyeyle 10 dakika daha kaynar. Hazırlıkla toplam 50 dakika sürer.

      '
  - q: Minestrone için hangi makarna kullanılır?
    a: 'Yüksük ya da arpa şehriye gibi küçük makarnalar uygundur. Tam buğday ya da glutensiz makarna da kullanılabilir.

      '
  - q: Minestrone ertesi gün ısıtılır mı?
    a: 'Evet, ama makarna bekledikçe suyu çeker. Isıtırken biraz sıcak su ekle ya da makarnayı ayrı haşlayıp servis anında ekle.

      '
muzlu-ekmek:
  aramaBasligi: 'Muzlu ekmek tarifi: Olgun muzlu, cevizli banana bread'
  editorNote: 'Mikser yerine çatal ve kaşıkla çalışan bir tarif seçtik; kuru malzemeleri sadece karışana kadar çevirmek keki nemli tutuyor. Kabartıcı olarak karbonat kullandık, çünkü muzun asitliğiyle tepkimeye girip keki kabartıyor.

    '
  intro: 'Muzlu ekmek (banana bread), çok olgun muzların ezilerek kek hamuruna katıldığı, baton kalıpta pişirilen nemli bir kek. Amerikan mutfağında yaygın olan bu tarif, kabuğu kararmış muzları değerlendirmenin en bilinen yollarından biri.


    Bu tarifte üç olgun muz çatalla eziliyor; eritilmiş tereyağı, esmer şeker, yumurta ve vanilin ekleniyor. Un, karbonat, tarçın ve tuz eklenip yalnızca karışana kadar çevriliyor, ceviz katılıyor. Hamur baton kek kalıbına dökülüp 175°C fırında kürdan temiz çıkana kadar pişiriliyor.


    10 dilimlik tarifin hazırlığı 10, pişirmesi 50 dakika; toplam 60 dakika. Mikser gerektirmiyor. Kahvaltıda dilimlenip sade ya da tereyağıyla yenebilir.

    '
  notes:
  - t: Muzun olgunluğu
    d: 'Muzlu ekmeğin tadı ve nemi muzun olgunluğuna bağlıdır. Kabuğu kararmış, hatta tamamen kahverengiye dönmüş muzlar en tatlı ve en kolay ezilen muzlardır; ayrıca keke yoğun bir muz aroması verir. Sarı ve sert muzla yapılan kek kuru ve daha az tatlı olur. Muzların çoğu olgunlaşmışsa ama vaktin yoksa kabuklarıyla dondurucuya atabilirsin; çözdükten sonra çıkan sıvıyla birlikte hamura katarsın. Esmer şeker de muzla birlikte kekin nemli ve karamelimsi olmasına katkı sağlar.

      '
  - t: Fazla karıştırmamak
    d: 'Un eklendikten sonra hamuru fazla karıştırmak glutenin gelişmesine ve kekin sıkı, lastiğimsi olmasına neden olur. Tarif bu yüzden kuru malzemelerin "sadece karışana kadar" çevrilmesini istiyor; birkaç un izi kalması sorun değil. Cevizi de bu aşamada birkaç hareketle kat. Karbonat muzdaki ve esmer şekerdeki asitlerle tepkimeye girerek keki kabartır; hamuru hazırladıktan sonra bekletmeden fırına vermek bu kabarmanın kaybolmasını önler. Cevizleri katmadan önce hafifçe una bulamak, pişerken kalıbın dibine çökmelerini azaltır.

      '
  - t: Pişme kontrolü ve saklama
    d: 'Baton kalıptaki kek kalın olduğu için içi dışından geç pişer. 50 dakikanın sonunda ortasına kürdan batır; temiz çıkıyorsa kek hazırdır. Üstü fazla erken kızarırsa üzerini alüminyum folyoyla gevşekçe örtebilirsin. Keki kalıpta biraz dinlendirip sonra tel üzerinde soğut. Ertesi gün dilimleri tavada hafifçe kızartıp tereyağıyla yemek, bayatlayan muzlu ekmeği değerlendirmenin güzel bir yolu. Soğuyan keki streç filme sararak oda sıcaklığında saklamak nemini korur.

      '
  faq:
  - q: Muzlu ekmek kaç derecede pişer?
    a: '175°C fırında yaklaşık 50 dakika, ortasına batırılan kürdan temiz çıkana kadar pişer.

      '
  - q: Banana bread için hangi muz kullanılır?
    a: 'Kabuğu kararmış, çok olgun muzlar en iyi sonucu verir. Bu muzlar daha tatlıdır ve keki nemli yapar.

      '
  - q: Muzlu ekmek neden içi çiğ kalır?
    a: 'Baton kalıp kalın olduğu için içi geç pişer. Süre dolunca kürdanla kontrol et; üstü erken kızarırsa folyoyla örtüp pişirmeye devam et.

      '
  - q: Muzlu ekmekte yumurta yerine ne kullanılır?
    a: 'Bir yemek kaşığı öğütülmüş keten tohumunu 3 yemek kaşığı suyla 10 dakika bekletip kullanabilirsin. Çeyrek su bardağı muz püresi de olur.

      '
