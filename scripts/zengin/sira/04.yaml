portakalli-kek:
  aramaBasligi: 'Portakallı kek tarifi: Taze portakal suyuyla, şuruplu'
  intro: 'Portakallı kek, taze sıkılmış portakal suyu ve kabuk rendesiyle hazırlanan, mutfağı kokusuyla dolduran nemli bir kek. Portakalın en sulu ve aromalı olduğu kış aylarında özellikle sık yapılır.


    Bu tarifte sıvı olarak süt yerine bir su bardağı portakal suyu kullanılıyor; keke hem rengini hem tadını o veriyor, kabuk rendesi de aromayı güçlendiriyor. İstersen yarım su bardağı portakal suyu ve 2 yemek kaşığı şekerle hazırlanan bir şurubu ılık kekin üzerine gezdirebilirsin; şurup keki birkaç gün nemli tutuyor.


    Hazırlık 15, pişirme 40 dakika; toplam 55 dakikada 10 kişilik bir kek. Hazır portakal suyu yerine taze sıkılmış su kullanmak sonucu belirgin biçimde değiştiriyor.

    '
  editorNote: 'Şurubu isteğe bağlı bir adım olarak ayırdık; sade hali kahvaltıya ve çaya uygun, şuruplu hali ise daha nemli ve tatlı bir sonuç vererek keki birkaç gün taze tutuyor.

    '
  notes:
  - t: Taze portakal suyu ve kabuk
    d: 'Kekin tadı neredeyse tamamen portakaldan geldiği için meyvenin kalitesi sonucu doğrudan etkiler. Sulu, eline ağır gelen ve kabuğu parlak portakalları seç. Suyunu sıkmadan önce kabuğu rendele; sıkılmış, yumuşamış portakalın kabuğunu rendelemek çok zordur. Kabuğun yalnızca turuncu kısmını al, beyaz zar keki acılaştırır. Hazır portakal suyu kullanacaksan şekersiz olanını tercih et, yoksa kek fazla tatlı olur. Kış portakalları hem daha sulu hem daha aromalı olduğu için bu keki mevsiminde yapmak fark yaratır.

      '
  - t: Şurubu doğru vermek
    d: 'Şurup için portakal suyu ve şekeri 2 dakika kaynatman yeterli; amaç şekeri eritmek, koyu bir şerbet yapmak değil. Kek ılıkken kürdanla birçok yerinden del ve şurubu kaşıkla yavaşça gezdir. Ilık kek şurubu daha eşit emer; fazla şurubu bir anda dökersen yüzey yumuşayıp dağılabilir. Şurubun hepsini kullanmak zorunda değilsin, kekin emişine bakarak miktarı ayarla. Şuruplu keki kapalı kapta saklamak nemini korur.

      '
  - t: Kabarma ve pişme
    d: 'Yumurta ve şekerin köpük köpük olana kadar çırpılması kekin kabarıklığını sağlar. Portakal suyu, kabuk rendesi ve yağı ekledikten sonra un, kabartma tozu ve vanilini eleyerek ekle ve spatulayla, fazla karıştırmadan birleştir. 170°C fırında 35-40 dakika pişir; pişmenin ilk bölümünde fırın kapağını açma. Kekin ortasına batırdığın kürdan kuru çıkıyorsa pişmiştir, üstü erken kızarıyorsa folyoyla gevşekçe örtebilirsin. Kalıptan çıkarmadan önce keki birkaç dakika ılıtmak kırılmasını önler; şurup vereceksen bu sırada hazırlayabilirsin.

      '
  faq:
  - q: Portakallı kek kaç dakika pişer?
    a: '170°C fırında 35-40 dakika. Ortasına batırdığın kürdan kuru çıktığında hazırdır.

      '
  - q: Portakallı kek nasıl nemli olur?
    a: 'Taze sıkılmış portakal suyu kullan ve ılık keki kürdanla delip portakal suyu ile şekerden yapılan şurubu üzerine gezdir. Şurup keki birkaç gün nemli tutar.

      '
  - q: Portakallı kek neden acı olur?
    a: 'Kabuk rendelenirken beyaz kısım da karıştığında. Yalnızca turuncu kabuğu rendele.

      '
  - q: Portakallı kekte hazır portakal suyu kullanılır mı?
    a: 'Kullanılabilir, ama taze sıkılmış suyun aroması daha belirgin olur. Hazır su kullanacaksan şekersiz olanını seç.

      '
havuclu-tarcinli-kek:
  aramaBasligi: 'Havuçlu tarçınlı kek tarifi: Cevizli, sütsüz ve nemli'
  intro: 'Havuçlu tarçınlı kek, rendelenmiş havucun nem verdiği, tarçın ve muskatın kokusunu taşıdığı yoğun dokulu bir kek. Havuç tatlıya şaşırtıcı gelebilir, ama pişince sebze tadı belirgin olmaz; keke hafif bir tatlılık ve kolay kolay kurumayan bir nem bırakır.


    Bu tarifte iki su bardağı rendelenmiş havuç ve yarım su bardağı ceviz, çırpılmış yumurta, şeker ve sıvı yağla birleştiriliyor. Un, kabartma tozu, tarçın, muskat ve bir tutam tuz eleyerek ekleniyor. Süt kullanılmıyor; hamurun nemi büyük ölçüde havuçtan geliyor.


    Hazırlık 20, pişirme 45 dakika; toplam 65 dakikada 10 kişilik bir kek. Sade haliyle çayın yanına uygun; üzerine labneli krema sürersen pasta gibi servis edebilirsin.

    '
  editorNote: 'Havucun suyunu sıkmamayı özellikle belirttik; tarifte süt olmadığı için kekin nemi havuçtan geliyor ve suyu sıkılmış havuçla kek kuru ve sıkı çıkıyor.

    '
  notes:
  - t: Havucu rendelemek
    d: 'Havucu rendenin ince ya da orta gözüyle rendele. Çok iri rendelenmiş havuç pişme süresinde tam yumuşamaz ve kekin içinde sert lifler kalır; çok ince rendelenmiş havuç ise lapa gibi olup hamurda kaybolur. Rendeledikten sonra suyunu süzme ya da sıkma, olduğu gibi hamura ekle. Ölçüyü rendelenmiş havuçla, su bardağına bastırmadan doldurarak al; bastırırsan fazla havuç girer ve kek ağırlaşıp ortası geç pişer.

      '
  - t: Baharat dengesi
    d: 'Tarçın bu kekin ana kokusu; tarifteki iki çay kaşığı belirgin ama baskın olmayan bir tat verir. Muskat çok güçlü bir baharat olduğu için bir tutamdan fazlasını koyma, aksi halde kekin tadı acımsı olabilir. Bir tutam tuz tatlılığı dengeler ve baharatların aromasını öne çıkarır, atlamamaya çalış. Baharatları un ve kabartma tozuyla birlikte elemek hamurda eşit dağılmalarını sağlar, böylece bazı dilimlerde tarçın topakları kalmaz.

      '
  - t: Ceviz ve servis
    d: 'Cevizi iri doğra; toz halindeki parçalar kekin içinde hissedilmez. Cevizi hamura eklemeden önce bir kaşık unla karıştırırsan pişerken dibe çökmeden hamura dağılır. Ceviz yerine fındık ya da badem de kullanabilirsin. 170°C fırında 45 dakika pişen keki kalıpta biraz ılıtıp sonra çıkar. Tamamen soğuduktan sonra üzerine labneli krema sürersen pasta havası kazanır; bu durumda keki buzdolabında saklaman gerekir. Keki tamamen soğuduktan sonra dilimlersen dilimler daha düzgün olur.

      '
  faq:
  - q: Havuçlu kek kaç dakika pişer?
    a: 'Yağlanmış kalıpta, 170°C fırında yaklaşık 45 dakika. Kürdan kuru çıktığında kek pişmiştir.

      '
  - q: Havuçlu kekte havucun suyu sıkılır mı?
    a: 'Hayır. Bu tarifte süt olmadığı için kekin nemi havucun suyundan geliyor; sıkarsan kek kuru olur.

      '
  - q: Havuçlu kekte ceviz yerine ne konur?
    a: 'Fındık ya da badem kullanabilirsin. Kuruyemiş istemiyorsan hiç koymadan da yapılabilir.

      '
  - q: Havuçlu kekin üzerine ne sürülür?
    a: 'Kek tamamen soğuduktan sonra labneli bir krema sürebilirsin. Kremalı keki buzdolabında sakla.

      '
elmali-kurabiye:
  aramaBasligi: 'Elmalı kurabiye tarifi: Tarçınlı iç harçlı, yumuşacık'
  intro: 'Elmalı kurabiye, yumuşak ve kolay açılan bir hamurun içine tarçınlı elma harcı konup yarım ay şeklinde kapatılan, Türkiye''de çok sevilen bir ev kurabiyesi. Fırından çıkınca pudra şekerine bulanıyor ve evi tarçın kokusuyla dolduruyor.


    Hamur tereyağı, sıvı yağ ve yoğurtla hazırlanıyor; yoğurt ve kabartma tozu hamura yumuşak, dağılmayan bir doku veriyor. İç harcı için rendelenmiş üç elma şekerle suyunu çekene kadar pişiriliyor, ardından tarçın ve ceviz ekleniyor. Harcın tamamen soğuması önemli, çünkü sıcak harç hamuru yumuşatır.


    Hazırlık 30, pişirme 25 dakika; toplam 55 dakikada 25 kurabiye çıkıyor. Hazırlık süresinin büyük kısmı şekil vermeye gidiyor, bu yüzden hamuru açmaya başlamadan önce iç harcını hazır et.

    '
  editorNote: 'Elma harcını önceden pişirip soğutmayı ilk adım yaptık, çünkü çiğ elma fırında su salar; bu su kurabiyelerin ağzını açar ve hamuru içeriden ıslatır.

    '
  notes:
  - t: Elma harcının suyu
    d: 'Rendelenmiş elma bol su salar. Harcı şekerle birlikte, tencerede su kalmayana kadar yaklaşık 10 dakika pişir; dibinde hâlâ sıvı görüyorsan biraz daha devam et. Suyunu tam çekmemiş harç kurabiyenin içinde buhar yaparak kenarları açar ve dolgunun dışarı akmasına neden olur. Harcı tarçın ve cevizle karıştırdıktan sonra tamamen soğut. Sert ve hafif ekşi elmalar pişince dağılmadan daha iyi bir doku verir.

      '
  - t: Hamurun kıvamı
    d: 'Tarifteki un miktarı yaklaşık 3,5 su bardağı olarak verildi, çünkü gereken un yoğurdun kıvamına göre değişir. Unu azar azar ekle ve ele yapışmayan yumuşak bir hamur elde ettiğinde dur. Fazla un hamuru sertleştirir, kurabiyeler kuru ve kırılgan olur. Hamuru açarken çok ince açma; ince hamur içteki harcın ağırlığıyla yırtılabilir. Yarım ay şeklinde kapattıktan sonra kenarları parmağınla ya da çatalla iyice bastır.

      '
  - t: Pişirme ve pudra şekeri
    d: '180°C fırında yaklaşık 22 dakika, altları kızarana kadar pişir. Üstlerin açık renkli kalması normal; bu kurabiyeler üstten fazla renk almaz. Pudra şekerine bulamak için kurabiyelerin ılımasını bekle: sıcakken bularsan şeker erir ve yapışkan bir tabaka oluşur, tamamen soğuduğunda ise şeker tutmaz. İstersen hamura bir tutam tarçın ekleyerek kokuyu artırabilirsin. Kapalı bir kutuda saklarsan birkaç gün yumuşaklığını korur. Kurabiyeleri tepsiye aralıklı dizmek de altlarının eşit kızarmasını sağlar.

      '
  faq:
  - q: Elmalı kurabiye kaç dakika pişer?
    a: '180°C fırında yaklaşık 22 dakika, altları kızarana kadar. Üstleri açık renkli kalabilir.

      '
  - q: Elmalı kurabiye neden açılır?
    a: 'Elma harcı suyunu tam çekmediğinde ya da kenarlar iyi bastırılmadığında. Harcı suyu kalmayana kadar pişirip soğut ve kenarları sıkıca kapat.

      '
  - q: Elmalı kurabiye nasıl yumuşak olur?
    a: 'Hamura fazla un ekleme, ele yapışmadığı anda dur ve kurabiyeleri altları kızarınca fırından al. Yoğurt da hamurun yumuşak kalmasına yardım eder.

      '
  - q: Elmalı kurabiyede ceviz yerine ne konur?
    a: 'Fındık ya da badem kullanabilirsin. Kuruyemişsiz yapmak istersen yalnızca tarçınlı elmayla da olur.

      '
un-kurabiyesi:
  aramaBasligi: 'Un kurabiyesi tarifi: Nişastalı, ağızda dağılan tereyağlı'
  intro: 'Un kurabiyesi, tereyağı, pudra şekeri ve unun birleşimiyle yapılan, ağza konduğunda dağılan sade bir kurabiye. Bayram ikramlıklarının ve misafir tabaklarının vazgeçilmezlerinden; az malzemesine rağmen doğru dokuyu yakalamak dikkat ister.


    Bu tarifte 250 g oda sıcaklığındaki tereyağı pudra şekeriyle krema kıvamına gelene kadar çırpılıyor. Hamura yarım su bardağı nişasta ekleniyor; nişasta kurabiyeye o kumlu, eriyen dokuyu veriyor. Yumurta ve kabartma tozu kullanılmıyor, bu yüzden kurabiyeler kabarmıyor ve şeklini koruyor.


    Hazırlık 20, pişirme 20 dakika; toplam 40 dakikada 30 kurabiye çıkıyor. Kurabiyeler fırında beyaz kalmalı, yalnızca altları hafif renk almalı; tamamen soğuduktan sonra üzerine pudra şekeri serpiliyor.

    '
  editorNote: 'Unu yaklaşık ölçüyle verdik, çünkü tereyağının yumuşaklığına göre gereken un değişiyor; fazla un, bu kurabiyenin ağızda dağılan dokusunu bozan en yaygın hata.

    '
  notes:
  - t: Tereyağının sıcaklığı
    d: 'Tereyağı oda sıcaklığında, parmakla bastırınca iz kalacak kadar yumuşak olmalı ama erimemeli. Soğuk tereyağı pudra şekeriyle krema kıvamına gelmez; erimiş tereyağı ise hamuru yağlı ve dağınık yapar, kurabiyeler fırında yayılır. Tereyağı ve şekeri açık renkli, kabarık bir krema olana kadar çırpman hamurun hafif olmasını sağlar. Bu adım, kurabiyenin ağızda eriyen dokusunun temelidir; acele etmeden yap. Pudra şekeri toz şekerden farklı olarak hamurda kolay erir ve kurabiyeye pürüzsüz bir doku verir.

      '
  - t: Unu azar azar eklemek
    d: 'Unu tek seferde dökme; azar azar ekleyip elinle yoğurarak ilerle. Hamur ele yapışmayan yumuşak bir top haline geldiğinde dur, tarifteki 2,5 su bardağının tamamı gerekmeyebilir. Fazla yoğurmak da hamuru sertleştirir, bu yüzden malzemeler birleşince bırak. Hamur çok yumuşak gelip şekil tutmuyorsa birkaç dakika buzdolabında dinlendir. Şekil verirken ceviz büyüklüğünde parçaları yuvarlayıp hafifçe bastırman yeterli. Unu nişastayla birlikte elersen hamura daha kolay karışır ve topak kalmaz.

      '
  - t: Pişirme ve kırılganlık
    d: '170°C fırında yaklaşık 18 dakika, rengi beyaz kalacak şekilde pişir. Altlarını kontrol et; hafif kızardığında hazırdır, üstlerin renk alması fazla piştiğini gösterir. Fırından çıkan kurabiyeler çok kırılgandır; tepside soğumalarını bekle, ancak sonra yerinden al. Pudra şekerini kurabiyeler tamamen soğuduktan sonra serp, sıcakken serpilen şeker erir ve görünümü bozulur. Kapalı bir kutuda saklarsan dokusunu korur. Tepsiye yağlı kâğıt sermek kırılgan kurabiyeleri kaldırırken işini kolaylaştırır; kurabiyeler kabarmadığı için aralarına çok boşluk gerekmez.

      '
  faq:
  - q: Un kurabiyesi nasıl ağızda dağılır?
    a: 'Oda sıcaklığındaki tereyağını pudra şekeriyle iyice çırp, hamura nişasta ekle ve unu fazla koyma. Hamuru az yoğurmak da dokuyu korur.

      '
  - q: Un kurabiyesi kaç dakika pişer?
    a: '170°C fırında yaklaşık 18 dakika. Rengi beyaz kalmalı, yalnızca altları hafif kızarmalı.

      '
  - q: Un kurabiyesi neden yayılır?
    a: 'Tereyağı fazla yumuşak ya da erimiş olduğunda hamur fırında yayılır. Hamur çok yumuşaksa şekil vermeden önce birkaç dakika buzdolabında dinlendir.

      '
  - q: Un kurabiyesinde nişasta yerine ne kullanılır?
    a: 'Mısır ve buğday nişastası birbirinin yerine geçer. Aynı ölçü pirinç unu da kullanabilirsin.

      '
tahinli-kurabiye:
  aramaBasligi: 'Tahinli kurabiye tarifi: Susamlı, tarçınlı, 30 dakikada'
  intro: 'Tahinli kurabiye, tahinin hem yağ hem aroma kaynağı olduğu, susamla kaplanan kıyır kıyır bir çay kurabiyesi. Tahinin kavrulmuş susam tadı tarçınla birleşince sade kurabiyelerden belirgin biçimde ayrılan bir lezzet çıkıyor.


    Bu tarifte tereyağı kullanılmıyor; yarım su bardağı tahin ve yarım su bardağı sıvı yağ hamurun yağını oluşturuyor. Tek bir yumurta hamuru bağlıyor, kabartma tozu da hafifçe kabarmasını sağlıyor. Toplar susama bulanıp tepsiye diziliyor ve hafifçe bastırılıyor. Tarçın ve vanilin, tahinin yoğun tadını yumuşatıyor.


    Hazırlık 15, pişirme 15 dakika; toplam yarım saatte 20 kurabiye çıkıyor. Kurabiyeler fırından yumuşak çıkar, soğudukça sertleşip kıyırlaşır; bu yüzden fazla pişirmemek önemli.

    '
  editorNote: 'Soğuyunca sertleştiği uyarısını pişirme adımının içine yazdık, çünkü fırından yumuşak çıkan kurabiyeyi pişmemiş sanıp süreyi uzatmak bu tarifte en sık yapılan hata.

    '
  notes:
  - t: Tahini karıştırmak
    d: 'Kavanozda bekleyen tahinin yağı üste çıkar, altı koyulaşır. Ölçmeden önce kavanozu iyice karıştırıp homojen hale getir; yalnızca üstteki yağlı kısmı alırsan hamur yağlı, alttaki koyu kısmı alırsan kuru olur. Tahinin sıvı yağ, şeker ve yumurtayla ilk adımda iyice çırpılması şekerin dağılmasına ve hamurun pürüzsüz olmasına yardım eder. Hamur ele yapışıyorsa biraz daha un ekleyerek ilerle. Tahin çok koyuysa ölçmeden önce kavanozu birkaç dakika ılık suyun içinde bekletmek karıştırmayı kolaylaştırır.

      '
  - t: Pişme süresi
    d: '180°C fırında 12-15 dakika, altları hafif kızarana kadar pişir. Bu noktada kurabiyeler hâlâ yumuşak görünür ve dokunduğunda hafifçe esner; bu normal. Soğudukça tahin ve şeker sertleşir ve kurabiye kıyırlaşır. Fazla pişirirsen soğuduktan sonra çok sert ve kuru olur, tahinin tadı da acılaşabilir. Kurabiyeleri tepside birkaç dakika bekletip sonra yerinden almak kırılmalarını önler. Fırınının altı fazla ısıtıyorsa tepsiyi orta rafa yerleştir; kurabiyelerin altı yanmadan pişer.

      '
  - t: Susam ve çeşitleme
    d: 'Topları susama bulamadan önce üst yüzeylerini çok hafif nemlendirirsen susam daha iyi tutar. Susamı önceden tavada hafifçe kavurmak aromasını güçlendirir, ama fırında da renk alacağı için fazla kavurma. Anadolu usulü bir lezzet için hamura biraz pekmez ekleyebilirsin; bu durumda hamur yumuşayacağı için biraz daha un gerekebilir. Kapalı bir kutuda saklandığında kurabiyeler kıyırlığını korur. Susamın bir kısmını hamurun içine de katabilirsin; böylece her lokmada susam tadı daha belirgin olur.

      '
  faq:
  - q: Tahinli kurabiye kaç dakika pişer?
    a: '180°C fırında 12-15 dakika, altları hafif kızarana kadar. Fırından yumuşak çıkar, soğuyunca sertleşir.

      '
  - q: Tahinli kurabiye neden taş gibi olur?
    a: 'Genellikle fazla pişirildiği için. Kurabiyeler yumuşak görünürken fırından al; soğudukça kendiliğinden kıyırlaşırlar.

      '
  - q: Tahinli kurabiye yumurtasız yapılır mı?
    a: 'Evet. 1 yumurta yerine 1 yemek kaşığı öğütülmüş keten tohumunu 3 yemek kaşığı suyla karıştırıp 10 dakika bekletip kullanabilirsin.

      '
  - q: Tahinli kurabiyeye pekmez konur mu?
    a: 'Konur; hamura biraz pekmez eklemek Anadolu usulü bir tat verir. Hamur yumuşarsa biraz daha un ekle.

      '
cikolatali-cookie:
  aramaBasligi: 'Çikolatalı cookie tarifi: Esmer şekerli, kenarı çıtır'
  intro: 'Çikolata parçacıklı cookie, kenarları çıtır ve ortası yumuşak, Amerikan mutfağının en bilinen kurabiyelerinden biri. Bildiğimiz pastane kurabiyelerinden farkı, hamurdaki esmer şekerin verdiği hafif karamelli tat ve pişerken yayılarak aldığı yassı şekil.


    Bu tarifte tereyağı esmer ve toz şekerle çırpılıyor, kabartıcı olarak karbonat kullanılıyor. 150 g bitter çikolata parçası hamura yedirildikten sonra hamur 30 dakika buzdolabında dinleniyor; bu bekleme kurabiyelerin fırında fazla yayılmasını önlüyor. Hava fritözünde pişirmek istersen tarifte ayrı süre ve sıcaklık var.


    Hazırlık 15, pişirme 12 dakika; toplam 27 dakikada 16 kurabiye çıkıyor, buzdolabı beklemesi bunun dışında. Kurabiyeleri ortası hâlâ yumuşak görünürken fırından almak, istenen dokunun anahtarı.

    '
  editorNote: 'Hamuru dinlendirmeyi ayrı bir adım yaptık; soğuk tereyağı fırında daha geç erir, böylece kurabiyeler incecik yayılmak yerine kenarları çıtır, ortası kalın kalır.

    '
  notes:
  - t: Esmer şekerin rolü
    d: 'Esmer şeker içindeki melas sayesinde nem tutar ve karamelimsi bir tat verir; cookie''nin ortasının yumuşak ve hafif çiğnenir olması büyük ölçüde ondan gelir. Toz şeker ise kenarların çıtırlaşmasına yardım eder. Tarifteki yarım su bardağı esmer ve üçte bir su bardağı toz şeker oranı bu iki dokuyu dengeler. Yalnızca toz şeker kullanırsan kurabiyeler daha kuru ve sert olur, rengi de açık kalır.

      '
  - t: Pişme noktası
    d: 'Cookie''yi fırından almanın doğru anı, kenarlar kızarmışken ortanın hâlâ yumuşak ve hafif parlak görünmesi. 180°C''de bu 10-12 dakika sürer. Ortası tamamen piştiğinde çıkarırsan soğuduktan sonra kurabiye sertleşir. Fırından çıkan kurabiyeleri tepside 5 dakika beklet; soğurken pişmeye devam ederler ve bu sürede toparlanırlar. Hemen kaldırmaya çalışırsan dağılırlar. Toplar tepside yayılacağı için aralarına bol boşluk bırak. Topları aynı büyüklükte tut; büyük toplarda kenarlar yanarken orta çiğ kalabilir.

      '
  - t: Hava fritözü ve servis
    d: 'Hava fritözünde pişireceksen hamur toplarını yağlı kâğıda aralıklı diz ve 160°C''de 8-9 dakika pişir; ortası yumuşak görünürken çıkar. Daha düşük ısı, küçük haznede kenarların yanmadan pişmesini sağlar. Kurabiyeler yayılacağı için sepete bir seferde az sayıda koy. Servis etmeden önce üzerlerine bir tutam deniz tuzu serpersen çikolatanın tadı derinleşir. Bitter yerine sütlü çikolata kullanırsan kurabiyeler daha tatlı olur. Kalan hamuru toplar halinde buzdolabında bekletip istediğin zaman taze kurabiye pişirebilirsin.

      '
  faq:
  - q: Cookie kaç dakika pişer?
    a: '180°C fırında 10-12 dakika; kenarları kızarıp ortası yumuşak görünürken çıkar. Hava fritözünde 160°C''de 8-9 dakika yeterli.

      '
  - q: Cookie neden çok yayılır?
    a: 'Çoğunlukla hamur dinlendirilmediği için. Hamuru pişirmeden önce 30 dakika buzdolabında soğut; tereyağı geç eriyeceği için kurabiyeler daha az yayılır.

      '
  - q: Cookie nasıl yumuşak kalır?
    a: 'Ortası hâlâ yumuşak görünürken fırından al ve tepside 5 dakika beklet. Esmer şeker de ortanın yumuşak kalmasına yardım eder.

      '
  - q: Cookie'de bitter çikolata yerine ne kullanılır?
    a: 'Sütlü çikolata kullanabilirsin, kurabiye daha tatlı olur. Kakao ve tereyağıyla hazırlanan bir karışım da alternatif olur ama parça çikolatanın dokusunu vermez.

      '
dubai-cikolatasi:
  aramaBasligi: 'Dubai çikolatası tarifi: Kadayıflı, antep fıstığı kremalı'
  intro: 'Dubai çikolatası, çikolata bir kabuğun içine tereyağında kavrulmuş tel kadayıf ve antep fıstığı kreması doldurulan, kırıldığında çıtırdayan bir tablet çikolata. Dubai''de bir çikolatacının ürünü olarak ortaya çıktı, sosyal medyada hızla yayıldı ve kısa sürede evde yapılan tariflerle her yere ulaştı.


    Bu tarifte 150 g tel kadayıf kırpılıp tereyağında altın rengi olana kadar kavruluyor, soğuyunca antep fıstığı kreması, 2 yemek kaşığı tahin ve bir tutam tuzla karıştırılıyor. Tahin ve tuz, fıstık kremasının yoğun tatlılığını dengeliyor. Kabuk için 300 g sütlü ya da bitter çikolata kullanılıyor.


    Hazırlık 30, pişirme 10 dakika; toplam 40 dakikada 8 kişilik. Kapatılan çikolatanın buzdolabında 1 saat donması gerektiği için servis zamanını buna göre planla.

    '
  editorNote: 'Kadayıfı kavurmayı ilk ve ayrı adım yaptık, çünkü bu tatlının bilinen çıtırtısı tamamen kadayıfın iyice kurumasına bağlı; az kavrulan kadayıf fıstık kremasıyla karışınca yumuşuyor.

    '
  notes:
  - t: Kadayıfı çıtır kavurmak
    d: 'Tel kadayıfı 1-2 cm boyunda kırpmak, dolgunun kalıba düzgün yayılmasını ve ısırırken uzun tellerin çekilmemesini sağlar. Kavururken orta ateşte sürekli karıştır; kadayıf ilk dakikalarda tereyağını çeker, sonra yavaş yavaş renk almaya başlar. Altın rengine dönüp hışırdamaya başladığında ocaktan al ve geniş bir tabağa yayarak soğut. Sıcak kadayıfı fıstık kremasıyla karıştırırsan krema erir, dolgu yağlanır ve çıtırlık kaybolur. Kavururken tereyağının yanmaması için ateşi yükseltme.

      '
  - t: Çikolatayı eritmek
    d: 'Çikolatayı benmaride, kâseyi kaynayan suya değdirmeden erit. Sıcaklığın 45°C''yi geçmemesi çikolatanın parlak ve kırılgan kalmasını sağlar; aşırı ısınan çikolata donduğunda mat ve yumuşak olur, üzerinde beyaz lekeler oluşabilir. Çikolataya su kaçarsa topaklanır, bu yüzden kâseyi ve kaşığı kuru tut. Termometren yoksa çikolatayı parçalar tamamen erimeden ocaktan al ve karıştırarak eritmeyi kalan ısıyla bitir. Sütlü çikolata bitterden daha hassastır ve daha düşük ısıda bozulur, bu yüzden onu daha da dikkatli erit.

      '
  - t: Kalıplama ve saklama
    d: 'Kabuğu yaparken kalıbı çevirerek kenarları kapla ve fazlasını boşalt; ince bir kabuk hem dolguya yer açar hem de ısırması kolay olur. Dolguyu yayarken kenarlardan biraz boşluk bırakmak, kapak çikolatasının kabuğa yapışıp tableti tamamen kapatmasını sağlar. Silikon kalıp yoksa küçük dikdörtgen bir kap da iş görür. Hazır tabletleri buzdolabında kapalı kapta sakla; kadayıf zamanla nem çekip çıtırlığını kaybedebileceği için çok bekletmeden tüket.

      '
  faq:
  - q: Dubai çikolatası nasıl yapılır?
    a: 'Tel kadayıf tereyağında çıtır olana kadar kavrulur, fıstık kreması, tahin ve tuzla karıştırılır. Bu dolgu erimiş çikolatayla kaplanmış kalıba yayılır, üstü yine çikolatayla kapatılıp buzdolabında 1 saat dondurulur.

      '
  - q: Dubai çikolatasında kadayıf yerine ne kullanılır?
    a: 'Tereyağında kavrulmuş tel şehriye ya da ezilmiş kadayıf yufkası kullanabilirsin.

      '
  - q: Dubai çikolatasında fıstık kreması yerine ne konur?
    a: 'Çiğ antep fıstığını biraz süt, şeker ve bir kaşık yağla robotta macun olana kadar çekerek kendi fıstık kremanı hazırlayabilirsin.

      '
  - q: Dubai çikolatası ne kadar sürede donar?
    a: 'Kabuk dondurucuda 10 dakikada donar. Dolgu konup üstü kapatıldıktan sonra buzdolabında 1 saat bekletip kalıptan çıkarabilirsin.

      '
spoonful:
  aramaBasligi: 'Spoonful tarifi: Kekli, muhallebili, çıtır çikolata kaplı'
  intro: 'Spoonful, kek kırıntısı, ipeksi bir muhallebi kreması ve üstte ince bir çikolata kabuğundan oluşan, kapta hazırlanıp kaşıkla yenen bir tatlı. Sosyal medyada kaşığın çikolata kabuğunu kırıp üç katı birden aldığı görüntülerle yayıldı ve kısa sürede evlerde sık yapılan tatlılardan biri oldu.


    Bu tarifte süt, şeker, un, nişasta ve yumurta sarısıyla ocakta bir muhallebi pişiriliyor; soğuduktan sonra çırpılmış sıvı kremayla birleştirilerek hafifletiliyor. Taban için hazır kek ya da pandispanya kullanılıyor. Kaplama çikolatasına bir kaşık ayçiçek yağı eklenmesi, kabuğun kaşıkla kırıldığında çatlayan ince bir tabaka olmasını sağlıyor.


    Hazırlık 20, pişirme 15 dakika; toplam 35 dakikada 4 kişilik. Muhallebinin soğuması ve çikolatanın donması için ayrıca bekleme süresi gerekiyor.

    '
  editorNote: 'Muhallebiyi soğuduktan sonra çırpılmış kremayla birleştirme adımını ayrıca yazdık; bu ek işlem kremayı ağır bir muhallebi olmaktan çıkarıp spoonful''a özgü hafif ve ipeksi kıvama getiriyor.

    '
  notes:
  - t: Muhallebinin kıvamı ve soğutma
    d: 'Muhallebiyi orta ateşte ve çırpıcıyla sürekli karıştırarak pişir; un ve nişasta dibe çöktüğü için karıştırmayı bırakırsan dibi tutar ve topaklanır. Koyulaştığında ocaktan al, tereyağı ve vanilini ekle. Soğuturken streç filmi doğrudan muhallebinin yüzeyine değdir; böylece kabuk bağlamaz. Muhallebi tamamen soğumadan kremayla birleştirirsen çırpılmış krema söner ve karışım sulanır, katlar da kaplarda birbirine geçer. Dibi tutarsa yanık tadı bütün kremaya geçer; böyle olursa üst kısmı başka bir kaba alıp dibi kullanma.

      '
  - t: Çikolata kabuğu
    d: 'Kaplamanın amacı kalın bir tabaka değil, kaşıkla vurulduğunda çatlayan ince bir kabuk. Sütlü çikolatayı bir kaşık ayçiçek yağıyla birlikte benmaride erit; yağ çikolatayı akışkan yapar, ince yayılmasını ve donduğunda kırılgan kalmasını sağlar. Çikolatayı kremanın üzerine dökmeden önce birkaç dakika ılıt; çok sıcak çikolata kremayı eritip karışabilir. Donması için buzdolabında 30 dakika yeterli. Çikolata tabakası kalınlaşırsa kaşıkla kırmak zorlaşır ve krema ezilir; dökerken ince ve eşit tutmaya çalış.

      '
  - t: Taban ve çeşitleme
    d: 'Hazır kek ya da pandispanyayı elinle ufalayıp kapların tabanına hafifçe bastır; çok sıkı bastırırsan taban sıkışıp ağırlaşır. Kek yerine bebe bisküvisi de kullanılabilir; bu durumda biraz sütle ıslatman gerekir. Krema ile tabanın arasına muz dilimleri ya da çilek koyarak meyveli bir spoonful yapabilirsin. Sütlü çikolata yerine bitter çikolata ve bir kaşık şeker de kullanılabilir. Hazırladığın kapları buzdolabında, üzeri kapalı olarak sakla.

      '
  faq:
  - q: Spoonful nasıl yapılır?
    a: 'Kapların tabanına ufalanmış kek bastırılır, üzerine çırpılmış kremayla hafifletilmiş muhallebi konur. En üste yağla eritilmiş çikolata dökülür ve buzdolabında 30 dakika dondurulur.

      '
  - q: Spoonful kreması nasıl yapılır?
    a: 'Süt, şeker, un, nişasta ve yumurta sarısı yaklaşık 8 dakika koyulaşana kadar pişirilir, tereyağı ve vanilin eklenir. Soğuyunca ayrı çırpılan sıvı kremayla mikserde 1 dakika çırpılır.

      '
  - q: Spoonful çikolatası nasıl çıtır olur?
    a: 'Çikolatayı bir kaşık ayçiçek yağıyla eritip kremanın üzerine ince bir tabaka halinde dök. Buzdolabında donunca kaşıkla kırılan bir kabuk oluşur.

      '
  - q: Spoonful'da kek yerine ne kullanılır?
    a: 'Bebe bisküvisi kullanabilirsin; tabana yerleştirmeden önce biraz sütle ıslat. Pandispanya da olur.

      '
palamut-tava:
  aramaBasligi: 'Palamut tava tarifi: Mısır unlu, dışı çıtır içi sulu'
  intro: 'Palamut tava, mısır ununa bulanıp kızgın yağda kızartılan, dışı çıtır içi sulu bir balık yemeği. Palamut sonbaharda Karadeniz''den İstanbul Boğazı''na doğru göç ederken bollaşır; en lezzetli olduğu dönem de bu mevsimdir.


    Bu tarifte balık 3 cm kalınlığında dilimleniyor, iyice kurulanıp tuzlanıyor ve yalnızca mısır ununa bulanıyor. Mısır unu buğday ununa göre daha çıtır bir kabuk veriyor ve yemeği glutensiz tutuyor. Yanında sumaklı kırmızı soğan, roka ve limon servis ediliyor. Hava fritözünde pişirmek istersen tarifte ayrı süre ve sıcaklık var.


    Hazırlık 10, pişirme 15 dakika; toplam 25 dakikada 4 kişilik. Sıcak servis edilmesi gerektiği için balığı sofraya oturmadan hemen önce kızart.

    '
  editorNote: 'Balığı kurulama adımını ayrı yazdık, çünkü ıslak balığa bulanan mısır unu hamurlaşıyor, kızgın yağda sıçrama yapıyor ve çıtır kabuk yerine yumuşak bir kaplama bırakıyor.

    '
  notes:
  - t: Yağın sıcaklığı
    d: 'Palamudu yağ iyice kızmadan tavaya koyarsan balık yağı çeker, kabuk çıtırlaşmaz ve yemek ağırlaşır. Yağın hazır olduğunu anlamak için bir tutam mısır ununu yağa at; hemen cızırdıyorsa doğru sıcaklıktadır. Dilimleri aralıklı diz ve tavayı kalabalık etme; aynı anda çok parça koymak yağın ısısını düşürür ve balık kızarmak yerine haşlanır. Gerekirse iki partide kızart, her partiden önce yağın yeniden ısınmasını bekle.

      '
  - t: Çevirme ve pişme
    d: 'Her yüzü 4-5 dakika kızartman yeterli; 3 cm kalınlığındaki dilimler bu sürede içine kadar pişer. Dilimleri ilk yüzü kızarmadan çevirmeye çalışma; kabuk oluştuğunda balık tavadan kendiliğinden ayrılır. Çevirmek için geniş bir spatula kullan ki dilimler kırılmasın. Kızaran balıkları kağıt havluya alarak fazla yağını süz. Mısır ununa bulanan dilimlerin fazla ununu silkelemek de yağın kararmasını önler. Kızaran dilimleri üst üste koyma, buhar kabuğu yumuşatır.

      '
  - t: Servis ve hava fritözü
    d: 'Palamut tava sıcak servis edilmeli; bekledikçe kabuk yumuşar. Kırmızı soğanı ince dilimleyip sumakla ovmak keskinliğini azaltır ve balığın yağlılığını dengeler; roka ve limon da aynı görevi görür. Daha az yağla pişirmek istersen mısır ununa bulanmış dilimleri hava fritözünde yağ sprey ederek 200°C''de 12-14 dakika pişir, yarısında çevir. Mısır unu bulamazsan ince irmik ya da glutensiz bir seçenek için pirinç unu kullanabilirsin.

      '
  faq:
  - q: Palamut tava kaç dakika kızarır?
    a: 'Kızgın yağda her yüzü 4-5 dakika; bir parti toplam 12 dakika kadar sürer.

      '
  - q: Palamut tavada un neden tutmaz?
    a: 'Balık iyi kurulanmadığında un hamurlaşıp dökülür. Dilimleri kağıt havluyla iyice kurula, mısır ununa bula ve fazlasını silkele.

      '
  - q: Palamut hangi aylarda yenir?
    a: 'Palamudun en lezzetli olduğu dönem Eylül-Kasım arasıdır.

      '
  - q: Palamut tavada mısır unu yerine ne kullanılır?
    a: 'İnce irmik ya da un kullanabilirsin. Glutensiz olması gerekiyorsa pirinç unu tercih et.

      '
firinda-levrek:
  aramaBasligi: 'Fırında levrek tarifi: Limonlu, patatesli, 40 dakikada'
  intro: 'Fırında levrek, bütün halde limon, sarımsak ve kekikle pişirilen, altındaki patates ve soğanla tek tepside tamamlanan hafif bir balık yemeği. Levreğin beyaz ve yumuşak eti fırında kolay pişer; bütün halde pişirmek etin suyunu korumasına yardım eder.


    Bu tarifte önce ince dilimlenmiş patates ve kırmızı soğan 200°C''de 10 dakika ön pişirmeye giriyor; böylece balıkla aynı anda hazır oluyorlar. Levreklerin iki yanına çizik atılıyor, içi ve dışı tuz, karabiber, kekik ve zeytinyağıyla ovuluyor, karınlarına limon dilimi ve sarımsak konuyor.


    Hazırlık 15, pişirme 25 dakika; toplam 40 dakikada 2 kişilik. Aynı yöntem çipura için de geçerli; hava fritözünde pişirmek istersen tarifte ayrı süre var.

    '
  editorNote: 'Sebzeleri balıktan önce fırına vermeyi ayrı adım yaptık, çünkü ince dilim patates bile levrekten daha uzun pişiyor; birlikte konduklarında ya patates çiğ kalıyor ya da balık kuruyor.

    '
  notes:
  - t: Çizik atmanın amacı
    d: 'Levreğin iki yanına atılan üçer çizik, ısının balığın en kalın yerine daha hızlı ulaşmasını sağlar; böylece ince kuyruk tarafı kurumadan sırt kısmı da pişer. Çizikler aynı zamanda tuz, kekik ve zeytinyağının ete işlemesine yardım eder. Çizikleri kılçığa kadar inecek şekilde ama balığı parçalamadan, keskin bir bıçakla at. Balığı ovmadan önce kağıt havluyla kurulamak derinin daha iyi kızarmasını sağlar. Karnına koyduğun limon ve sarımsak da eti içeriden kokulandırır.

      '
  - t: Piştiğini anlamak
    d: 'Bütün balığın piştiğini anlamanın en kolay yolu gözlerine bakmak: gözler beyazlaştığında balık büyük ölçüde pişmiştir. İkinci kontrol olarak çiziklerden birini çatalla hafifçe arala; et beyaz ve opaksa ve kılçıktan kolayca ayrılıyorsa hazırdır. Etin ortası hâlâ yarı saydam görünüyorsa birkaç dakika daha pişir. Balığın büyüklüğüne göre süre 20-25 dakika arasında değişir, küçük balıklarda 20. dakikada kontrol et. Fazla pişen levrek kuru ve lifli olur, bu yüzden süreyi uzatmak yerine sık kontrol et.

      '
  - t: Koku, kızarma ve çeşitleme
    d: 'Tepsiye yağlı kâğıt sermek balık kokusunun tepsiye sinmesini önler ve temizliği kolaylaştırır. Derinin kızarmasını istiyorsan son 3 dakika fırının ızgara modunu aç ama gözünü ayırma. Patates yerine tatlı patates kullanabilirsin; daha çabuk piştiği için ön pişirme süresini kısaltman gerekir. Hava fritözünde bütün levrek yağlı kâğıt üzerinde 190°C''de 14-16 dakikada pişer; sepete sığmazsa fileto kullan, 10-12 dakika yeter. Servis ederken üzerine taze limon sıkmak tatları canlandırır.

      '
  faq:
  - q: Fırında levrek kaç dakika pişer?
    a: 'Sebzeler 200°C''de 10 dakika ön pişirildikten sonra levrek aynı ısıda 20-25 dakika pişer.

      '
  - q: Levreğin piştiği nasıl anlaşılır?
    a: 'Gözleri beyazlaştığında ve eti kılçıktan kolayca ayrıldığında levrek pişmiştir.

      '
  - q: Levrek airfryerda kaç dakika pişer?
    a: 'Bütün levrek yağlı kâğıt üzerinde 190°C''de 14-16 dakika pişer. Sepete sığmazsa fileto kullan; 10-12 dakika yeter.

      '
  - q: Levrek yerine hangi balık kullanılır?
    a: 'Çipura aynı süre ve yöntemle pişirilebilir.

      '
kalamar-tava:
  aramaBasligi: 'Kalamar tava tarifi: Sodalı hamurla çıtır, taratorlu'
  editorNote: 'Kalamarın lastikleşmemesi için kızartma süresini parti başına 2 dakika olarak ayrıca belirttik. Hamuru soğuk maden suyu ve karbonatla kurduk; kaplamanın çıtırlığı büyük ölçüde bu iki malzemeye bağlı.

    '
  intro: 'Kalamar tava, halka halinde doğranmış kalamarın hafif bir hamura bulanıp kızgın yağda kısa sürede kızartıldığı bir ara sıcak. Balık lokantalarının ve meyhanelerin bilinen tabaklarından biri; yanında genellikle tarator ya da limonla gelir.


    Bu tarifte kaplama için un, tuz ve karbonatı soğuk maden suyuyla boza kıvamında çırpıyorsun. Kalamar halkaları iyice kurulandıktan sonra hamura bulanıp 180°C yağda parti parti kızarıyor. Yanındaki tarator ceviz, bayat ekmek içi, sarımsak, zeytinyağı, limon suyu ve yoğurdun rondodan geçirilmesiyle hazırlanıyor.


    Hazırlık 20, pişirme 10 dakika; toplam 30 dakikada 4 kişilik bir tabak çıkıyor. Airfryer kullanıyorsan tarifte ayrı bir yöntem de var.

    '
  notes:
  - t: Neden soğuk maden suyu ve karbonat
    d: 'Maden suyundaki gaz ve karbonat, hamurun içinde küçük hava kabarcıkları oluşturur. Bu kabarcıklar sıcak yağda genleşir ve kaplamayı hafif, gözenekli ve çıtır yapar. Hamurun soğuk olması da önemli: soğuk hamur kızgın yağa değdiğinde dış yüzey hızla sertleşir, kaplama fazla yağ çekmez. Hamuru kızartmaya başlamadan hemen önce hazırla ve beklerken buzdolabında tut; uzun süre oda sıcaklığında kalan hamurun gazı kaçar ve kaplama daha yumuşak olur.

      '
  - t: Kurulamak ve parti parti kızartmak
    d: 'Islak kalamar hem hamuru tutmaz hem de yağa girdiğinde sıçratır. Halkaları yıkadıktan sonra kâğıt havluyla tek tek, iyice kurula. Kızartırken tavayı kalabalık etme; bir seferde çok fazla halka atarsan yağın ısısı düşer, kaplama yağ çeker ve kalamar haşlanmış gibi olur. Her parti yaklaşık 2 dakika sürer. Bir partiyi çıkardıktan sonra yağın yeniden 180°C civarına gelmesini bekle, sonra yenisini at. Kızaran halkaları kevgirle alıp fazla yağı süzdür.

      '
  - t: Lastikleşmeyi önlemek ve servis
    d: 'Kalamar ya çok kısa ya da çok uzun pişirilince yumuşak kalır; aradaki süre onu sertleştirir. Kızartmada kısa yolu seçiyoruz, bu yüzden altın rengi yeterli işarettir, daha fazla bekletme. Kızaran halkaları kâğıt havlu serili bir tabağa al ve sıcakken servis et. Kalamar tava bekledikçe nemlenip çıtırlığını kaybeder, ısıtılınca da sertleşir; bu yüzden ihtiyacın kadar kızartmak en doğrusu. Taratoru ise önceden yapıp buzdolabında bekletebilirsin.

      '
  faq:
  - q: Kalamar tava kaç dakika kızartılır?
    a: '180°C yağda her parti yaklaşık 2 dakika kızartılır. Kaplama altın rengi olunca çıkar; daha uzun kalırsa kalamar lastik gibi sertleşir.

      '
  - q: Kalamar tava hamuru nasıl çıtır olur?
    a: 'Un, tuz ve yarım çay kaşığı karbonatı soğuk maden suyuyla boza kıvamında çırp. Hamur ne kadar soğuk olursa kaplama o kadar çıtır olur.

      '
  - q: Kalamar tava airfryerda yapılır mı?
    a: 'Evet. Unlanmış halkaları tek kat dizip bolca yağ spreyi sık ve 200°C''de 7-8 dakika pişir. Fazla pişirirsen lastikleşir.

      '
  - q: Taratorda ceviz yerine ne kullanılır?
    a: 'Ceviz yerine aynı ölçüde fındık ya da badem kullanabilirsin. Yoğurt yerine süzme yoğurt da olur.

      '
midye-dolma:
  aramaBasligi: 'Midye dolma tarifi: Kuş üzümlü iç pilavla, buharda'
  editorNote: 'İç pilavı tencerede yarım pişirip soğuttuktan sonra doldurma adımını ayrı yazdık, çünkü pirinç midyenin içinde buharda pişmeye devam ediyor. Temizleme adımını da ayrıntılı tuttuk; midye dolmanın en çok emek isteyen ve en kritik kısmı orası.

    '
  intro: 'Midye dolma, kabuğunda baharatlı iç pilavla doldurulup pişirilen ve limonla yenen bir meze. Türkiye''de özellikle sokak lezzeti olarak bilinir, ama evde taze midyeyle yapıldığında bambaşka bir tazelikte olur.


    Bu tarifte iri midyeleri tel fırçayla temizleyip menteşe gibi açıyorsun. İç pilav zeytinyağında kavrulan soğan, çam fıstığı, salça ve baldo pirinçle hazırlanıyor; karabiber, yenibahar, tarçın, kuş üzümü ve bir tatlı kaşığı şekerle tatlandırılıyor. Yarım pişen pilav soğuduktan sonra midyelere dolduruluyor, midyeler tencereye sıkıca dizilip üzerine ağır bir tabakla buharda pişiyor.


    Hazırlık 60, pişirme 30 dakika; toplam 90 dakikada 30 midyeyle 6 kişilik bir tabak çıkıyor. Zorluk derecesi yüksek, ama adımlar net.

    '
  notes:
  - t: Midyeyi seçmek ve temizlemek
    d: 'Taze midyenin kabuğu kapalı olmalı ya da hafifçe açıksa dokunduğunda kapanmalı. Açık durup dokununca kapanmayan, kabuğu kırık olan midyeleri kullanma. Kabukları tel fırçayla kazıyıp sakallarını çektikten sonra bıçağı düz kenarından sokarak aç; kabuğu tam ayırmadan menteşe gibi bırak ki doldurduktan sonra kapanabilsin. Açtığın midyeleri tuzlu suda beklet. Kabukları en sonda ıslak bezle silmek sunumda parlak görünmelerini sağlar. Temizlik bu tarifin en uzun kısmı, bu yüzden hazırlık süresinin büyük bölümünü buraya ayır.

      '
  - t: Pilavı neden yarım pişiriyoruz
    d: 'Pirinç, midyenin kabuğunda buharda 25-30 dakika daha pişecek. İç pilavı tencerede tamamen pişirirsen tencerede lapaya döner, midyenin içinde de hamurlaşır. Bu yüzden pilavı yarım su bardağı suyla, suyunu çekip yarım pişene kadar pişirip soğutuyoruz. Soğuk pilav doldurması da daha kolaydır. Her midyeye bir tatlı kaşığı yeterli; fazla doldurursan pirinç şiştiğinde kabuk açılır ve iç dışarı taşar. Pilavı soğuturken geniş bir tabağa yaymak süreyi kısaltır.

      '
  - t: Pişirme, saklama ve servis
    d: 'Midyeleri tencereye sıkı dizmek ve üzerine ağır bir tabak koymak, kabukların pişerken açılmasını önler. Sıcak suyu ekledikten sonra kısık ateşte pirinç pişene kadar beklet. Midye dolma soğuyunca servis edilir; limonu yemeden hemen önce sık. Deniz ürünü olduğu için kapalı bir kapta buzdolabında sakla ve uzun süre bekletme; en iyisi aynı gün ya da ertesi gün tüketmek. Kuş üzümü bulamazsan kıyılmış kuru üzüm kullanabilirsin.

      '
  faq:
  - q: Midye dolma kaç dakika pişer?
    a: 'Doldurulan midyeler sıcak su eklendikten sonra kısık ateşte, pirinç pişene kadar 25-30 dakika buharda pişer. Öncesinde iç pilav yaklaşık 15 dakika ön pişirilir.

      '
  - q: Midye dolma pirinci nasıl lapa olmaz?
    a: 'İç pilavı tencerede yalnızca yarım pişir ve soğut. Her midyeye bir tatlı kaşığından fazla koyma; pirinç buharda şişerek tamamlanır.

      '
  - q: Midye dolmada baldo yerine hangi pirinç kullanılır?
    a: 'Osmancık pirinç kullanabilirsin; bu durumda suyu bir parmak azalt.

      '
  - q: Ölü midye nasıl anlaşılır?
    a: 'Kabuğu açık olup dokununca kapanmayan ya da kabuğu kırık olan midyeler kullanılmamalı. Bunları temizlerken ayırıp at.

      '
kuzu-tandir:
  aramaBasligi: 'Kuzu tandır tarifi: Fırında 160°C''de, kemikten ayrılan'
  editorNote: 'Tandırı evde fırında yapılabilir hale getirmek için kabı önce pişirme kâğıdı, sonra folyoyla kapatma adımını özellikle yazdık. Etin yumuşaklığı buharın kaçmamasına bağlı; son 20 dakikalık kızartmayı ise ayrı bir adım olarak tuttuk.

    '
  intro: 'Kuzu tandır, kemikli kuzu etinin uzun süre kapalı bir kapta, kendi suyunda pişirildiği ve kemikten kolayca ayrılacak kadar yumuşadığı bir yemek. Geleneksel olarak toprağa gömülü tandır fırınlarında yapılır; evde aynı etkiyi kısık ısıda, sıkıca kapatılmış bir fırın kabıyla elde edebilirsin.


    Bu tarifte kuzu kol ya da but tuz, karabiber ve kekikle ovuluyor, sarımsaklar etin yarıklarına yerleştiriliyor. Et, halka soğan yatağının üzerinde tereyağı ve bir su bardağı sıcak suyla 160°C fırında 3,5 saat pişiyor. Ardından folyo açılıp 220°C''de 20 dakika üstü kızartılıyor.


    Hazırlık 15, pişirme 240 dakika; toplam 4 saat 15 dakikada 6 kişilik bir sofra hazır. Emeği az, ama zamanını planlaman gerekiyor.

    '
  notes:
  - t: Kapağın sıkılığı her şeyi belirliyor
    d: 'Tandırın yumuşaklığı, etin kendi buharında pişmesinden gelir. Kabın üstünü önce pişirme kâğıdıyla, sonra alüminyum folyoyla kapatıp kenarlarını iyice bastır. Pişirme kâğıdı etin ve suyun folyoya doğrudan değmesini engeller, folyo da buharın kaçmasını önler. Pişirme sırasında kapağı sık sık açma; her açışta buhar kaçar ve kaptaki su azalır. Kapağı ilk kez 3,5 saatin sonunda, kızartma aşamasına geçerken açman yeterli. Folyonun kenarlarını kabın dış çeperine bastırarak kapatmak en güvenli yöntemdir.

      '
  - t: Hangi et ve marinasyon
    d: 'Kol ve but, uzun pişirmede liflerine ayrılan ve suyunu koruyan kesimlerdir; kemikli olmaları hem tadı hem de dokuyu zenginleştirir. Sarımsakları ete bıçakla açtığın küçük yarıklara yerleştirmek, aromanın yalnızca yüzeyde kalmamasını sağlar. Vaktin varsa eti bir gün önceden tuz, karabiber ve kekikle ovup buzdolabında beklet; tat daha derinleşir. Eti pişirmeden önce buzdolabından çıkarıp bir süre oda sıcaklığında bekletmek de daha dengeli pişmesine yardım eder.

      '
  - t: Kaptaki su ve servis
    d: 'Pişme sonunda kabın dibinde soğan, tereyağı ve etin salgıladığı yoğun bir su kalır. Bu suyu atma; eti kemikten ayırdıktan sonra üzerine gezdirmek kuruluğu önler. Kalan kısmı pilavın suyuna katabilirsin; tarifteki sumaklı soğan ve pilavla birlikte sofranın tamamlayıcısı olur. Artan tandırı kendi suyuyla birlikte kapalı bir kapta buzdolabında sakla, ısıtırken de üzerini kapatarak düşük ısıda ısıt ki et kurumasın. Pilavı da kaptaki suyla pişirmek iki tabağı birbirine bağlar.

      '
  faq:
  - q: Kuzu tandır fırında kaç saat pişer?
    a: 'Üstü kapalı olarak 160°C fırında 3,5 saat pişer, ardından folyo açılıp 220°C''de 20 dakika üstü kızartılır.

      '
  - q: Kuzu tandır nasıl yumuşak olur?
    a: 'Kabı önce pişirme kâğıdı, sonra folyoyla sıkıca kapatıp buharın kaçmasını önle ve 160°C gibi düşük bir ısıda uzun pişir. Et kemikten kolayca ayrılıyorsa hazırdır.

      '
  - q: Kuzu tandır için hangi et alınır?
    a: 'Kemikli kuzu kol ya da but kullanılır. Tarif 1,5 kg et için yazıldı ve 6 kişiliktir.

      '
  - q: Kuzu tandırın yanına ne yakışır?
    a: 'Pilav ve sumaklı soğan klasik eşlikçilerdir. Kaptaki suyu pilavın suyuna katabilirsin.

      '
kuzu-incik:
  aramaBasligi: 'Kuzu incik tarifi: Fırında sebzeli, 170°C''de 2,5 saat'
  editorNote: 'İncikleri fırına vermeden önce tencerede mühürleme adımını ayrı yazdık, çünkü sosun rengi ve derinliği bu kızarmadan geliyor. Fırın yöntemini seçtik ama tencerede pişirmek isteyenler için kısık ateşte 2 saatlik alternatifi de ipucu olarak bıraktık.

    '
  intro: 'Kuzu incik, kuzunun bacağının alt kısmından gelen, kemiğin etrafında bol bağ dokusu bulunan bir kesim. Bu yapı onu uzun ve yavaş pişirmeye çok uygun yapar: saatlerce kısık ısıda kaldığında et kemikten ayrılır, bağ dokusu da sosu koyulaştırır.


    Bu tarifte 4 incik tuz ve karabiberle ovulup her yüzü mühürleniyor. Aynı tencerede soğan, havuç ve sarımsak tereyağında çevrilip salçayla birleşiyor. Sebzeler ve rendelenmiş domates fırın kabına alınıyor, incikler üzerine diziliyor, biberiye, defne ve sıcak suyla folyo altında 170°C''de 2,5 saat pişiyor. Son 15 dakikada folyo açılıp 200°C''de üstü kızartılıyor.


    Hazırlık 20, pişirme 180 dakika; toplam 3 saat 20 dakikada 4 kişilik bir yemek çıkıyor.

    '
  notes:
  - t: Mühürlemenin görevi
    d: 'İncikleri fırına vermeden önce yağda her yüzü kızarana kadar çevirmek, etin yüzeyinde koyu renkli ve aromalı bir kabuk oluşturur. Bu kızarma, sosa da renk ve derinlik verir. Tencerenin dibinde kalan kahverengi tabakayı atma; sebzeleri aynı tencerede kavurduğunda bu tabaka sebzelere geçer. Mühürlerken incikleri tencereye sıkıştırma, gerekirse ikişer ikişer çevir. Toplamda yaklaşık 10 dakika sürer, acele etmeden her yüzün renk almasını bekle.

      '
  - t: Uzun pişirmenin mantığı
    d: 'İncikte bol miktarda bağ dokusu bulunur. Kısa pişirmede bu doku sert ve lastik gibi kalır; düşük ısıda uzun süre kaldığında ise yumuşar ve jelatinimsi bir hal alarak sosa geçer. Bu yüzden 170°C''de folyo altında 2,5 saat pişirme önemli. Folyoyu sıkıca kapat ki su buharlaşıp kap kurumasın. Et kemikten kolayca ayrılıyorsa folyoyu açıp 200°C''de 15 dakika kızart ve bu sırada sosu inciklerin üzerine gezdir.

      '
  - t: Tencere alternatifi ve servis
    d: 'Fırın kullanmak istemiyorsan incikleri aynı tencerede, kapağı kapalı kısık ateşte yaklaşık 2 saat pişirebilirsin; arada suyunu kontrol et ve gerekirse biraz sıcak su ekle. Kışın taze domates yerine konserve küp doğranmış domates daha lezzetli sonuç verir. Kuzu inciği patates püresi ya da bulgur pilavıyla servis etmek, kaptaki sosu değerlendirmenin en iyi yolu. Artanı sosuyla birlikte sakla; ertesi gün ısıtıldığında da yumuşaklığını korur.

      '
  faq:
  - q: Kuzu incik fırında kaç saat pişer?
    a: 'Folyo altında 170°C''de 2,5 saat pişer, ardından folyo açılıp 200°C''de 15 dakika daha kızartılır.

      '
  - q: Kuzu incik tencerede nasıl pişirilir?
    a: 'Mühürleyip sebzeleri ekledikten sonra kapağı kapalı, kısık ateşte yaklaşık 2 saat pişir. Et kemikten ayrılıyorsa hazırdır.

      '
  - q: Kuzu incik neden sert olur?
    a: 'Genellikle yeterince uzun pişmediği için. İncik bağ dokusu bakımından zengindir ve ancak düşük ısıda saatlerce pişince yumuşar.

      '
  - q: Kuzu inciğin yanına ne gider?
    a: 'Patates püresi ya da bulgur pilavı, kaptaki sosu çektiği için en uygun eşlikçilerdir.

      '
kuzu-kapama:
  aramaBasligi: 'Kuzu kapama tarifi: Taze soğan, marul ve dereotuyla'
  editorNote: 'Suyu yalnızca bir su bardağıyla sınırlı tuttuk, çünkü marul ve taze soğan pişerken kendi suyunu salıyor. Dereotunu ayrı bir adım olarak en sona koyduk; erken eklenirse rengini ve kokusunu kaybediyor.

    '
  intro: 'Kuzu kapama, kuzu etinin taze soğan, marul ve dereotuyla kapağı kapalı bir tencerede, büyük ölçüde sebzelerin suyunda pişirildiği bir bahar yemeği. İstanbul mutfağının klasikleri arasında sayılır ve genellikle taze soğanın, marulun bol olduğu ilkbahar aylarında yapılır.


    Bu tarifte parçalanmış kuzu kol ya da gerdan tereyağında mühürleniyor. Üzerine 5 cm boyunda doğranmış taze soğan ve iri şeritler halinde marul yayılıyor, tuz, karabiber ve bir su bardağı sıcak su ekleniyor. Tencere çok kısık ateşte 80 dakika kapalı pişiyor, dereotu son 5 dakikada giriyor.


    Hazırlık 20, pişirme 90 dakika; toplam 110 dakikada 4 kişilik bir tencere hazır. Malzeme az, iş çoğunlukla ocağın.

    '
  notes:
  - t: Az su, sıkı kapak
    d: 'Kapama adını kapağı sıkıca kapatılarak pişirilmesinden alır. Marul ve taze soğan pişerken bol su salar; bu yüzden tarifteki bir su bardağı sıcak su yeterlidir, fazlası yemeği sulu ve tatsız yapar. Kapağın altına bir kat folyo koyarsan buhar kaçmaz ve et daha yumuşak olur. Pişirme sırasında kapağı sık açma, ateşi de çok kısık tut; kaynama sert olursa et sertleşir, sebzeler dağılır.

      '
  - t: Et seçimi ve mühürleme
    d: 'Kol ve gerdan, uzun ve kısık pişirmede yumuşayan, aynı zamanda suyuna tat veren kesimlerdir. Parçaları tereyağında her yüzü kızarana kadar yaklaşık 10 dakika mühürlemek, yemeğin hem rengini hem de aromasını belirler. Tencereyi kalabalık etme; etler üst üste binerse kızarmak yerine su salıp haşlanır. Gerekirse iki partide mühürle. Etleri tencerenin dibine dizdikten sonra sebzeleri üstüne katlar halinde yaymak, sebzelerin yanmadan pişmesini sağlar.

      '
  - t: Dereotu ve alternatifleri
    d: 'Dereotu yemeğe ferahlık katan son dokunuştur. Ocağı kapatmadan 5 dakika önce eklendiğinde rengi yeşil ve kokusu belirgin kalır; baştan konursa kararır ve aroması kaybolur. Dereotu bulamazsan maydanoz ve biraz taze nane kullanabilirsin. Kuzu kapama sade pilav ya da ekmekle iyi gider; tencerenin dibinde kalan suyu ekmekle değerlendirmek bu yemeğin keyfidir. Artanı kendi suyuyla birlikte kapalı bir kapta buzdolabında sakla. Isıtırken kısık ateş kullan.

      '
  faq:
  - q: Kuzu kapama kaç dakika pişer?
    a: 'Et mühürlendikten sonra kapağı kapalı, çok kısık ateşte 80 dakika pişer. Dereotu son 5 dakikada eklenir.

      '
  - q: Kuzu kapamaya ne kadar su konur?
    a: 'Bu tarifte bir su bardağı sıcak su yeterli. Marul ve taze soğan pişerken kendi suyunu salar, fazla su eklemek gerekmez.

      '
  - q: Kuzu kapama için hangi et kullanılır?
    a: 'Parçalanmış kuzu kol ya da gerdan kullanılır; tarif 800 g et ile 4 kişiliktir.

      '
  - q: Kuzu kapamada dereotu yerine ne kullanılır?
    a: 'Maydanoz ve biraz taze nane kullanabilirsin.

      '
tavuk-kapama:
  aramaBasligi: 'Tavuk kapama tarifi: Tavuk suyunda pirinçle tek tencere'
  editorNote: 'Haşlama sonrasında tavuk suyunu ölçme adımını özellikle yazdık, çünkü pilavın tane tane olması suyun tam 3 su bardağı olmasına bağlı. Tavukları önce mühürleyip sonra haşlamayı seçtik; bu sıra hem suya hem de deriye renk veriyor.

    '
  intro: 'Tavuk kapama, tavuk parçalarının pirinçle aynı tencerede pişip demlendiği bir yemek. Pirinç tavuğun kendi suyunda piştiği için ayrıca et suyuna gerek kalmaz; tencere sofraya ortaya konarak servis edilir.


    Bu tarifte derili tavuk butları tuz ve karabiberle ovulup derili tarafları kızarana kadar mühürleniyor. Ardından sıcak suyla 30 dakika haşlanıyor, tavuklar çıkarılıp suyu ölçülüyor. Aynı tencerede tereyağında soğan yumuşatılıyor, ıslatılıp süzülen baldo pirinç yenibaharla kavruluyor. Tavuk suyu ve tuz eklenip tavuklar pirincin üzerine yerleştiriliyor; suyunu çekince kâğıt havlu altında demleniyor.


    Hazırlık 15, pişirme 60 dakika; toplam 75 dakikada 4 kişilik bir sofra yemeği çıkıyor.

    '
  notes:
  - t: Suyu ölçmenin önemi
    d: 'Tarif 2 su bardağı baldo pirinç için 3 su bardağı tavuk suyu üzerine kurulu. Haşlama sırasında suyun bir kısmı buharlaşır; bu yüzden tavukları çıkardıktan sonra suyu mutlaka ölç. Eksikse sıcak suyla tamamla, fazlaysa kalanı başka bir yemek için ayır. Ölçmeden eklersen pilav ya lapa olur ya da çiğ kalır. Pirinci en az yarım saat ılık tuzlu suda ıslatıp süzmek de tanelerin dağılmadan pişmesine yardım eder.

      '
  - t: Derili but ve mühürleme
    d: 'Derili but, uzun pişirmede kurumayan ve suya tat veren bir parçadır. Tavukları önce derili taraflarından yaklaşık 8 dakika mühürlemek, derinin yağını salmasını ve renk almasını sağlar; bu yağ ve renk haşlama suyuna, oradan da pilava geçer. Haşlama sırasında deri yumuşar. Daha çıtır bir deri istersen, servis öncesinde tavukları son 5 dakika fırında kızartabilirsin; pilav bu sırada demlenmeye devam eder. Haşlama suyunun üstündeki köpüğü almak suyu daha berrak tutar.

      '
  - t: Demlendirme ve saklama
    d: 'Pilav suyunu çektikten sonra ocağı kapat, kapağın altına bir kâğıt havlu koyup 15 dakika demlendir. Kâğıt havlu buharı emer, damlaların pilavın üzerine düşüp tanelerin yapışmasını önler. Demlenirken kapağı açma. Yenibahar bulamazsan bir tutam tarçın ve bir tutam karanfil kullanabilirsin. Artan tavuk kapamayı kapalı bir kapta buzdolabında sakla; ısıtırken pilava birkaç kaşık su serpip üzerini kapatırsan kurumaz. Pilavı ısıtırken sık karıştırma ki taneler dağılmasın.

      '
  faq:
  - q: Tavuk kapama kaç dakika pişer?
    a: 'Tavuklar 8 dakika mühürlenip 30 dakika haşlanır. Pirinç tavuk suyunda 15 dakika pişer, ardından 15 dakika demlendirilir.

      '
  - q: Tavuk kapama pilavı nasıl tane tane olur?
    a: 'Pirinci en az yarım saat ılık tuzlu suda ıslatıp süz, 2 su bardağı pirince tam 3 su bardağı tavuk suyu ekle ve kapağın altına kâğıt havlu koyarak 15 dakika demlendir.

      '
  - q: Tavuk kapamada baldo yerine hangi pirinç olur?
    a: 'Osmancık pirinç kullanabilirsin; bu durumda suyu bir parmak azalt.

      '
  - q: Tavuk kapamanın derisi nasıl çıtır olur?
    a: 'Pilav demlenirken tavukları son 5 dakika fırında kızartırsan derisi çıtır olur.

      '
tikka-masala:
  aramaBasligi: 'Tavuk tikka masala tarifi: Yoğurtlu marine, kremalı sos'
  editorNote: 'Tavuğu sosta pişirmek yerine önce ayrı kızartmayı seçtik; isli tikka tadı bu kenarları kararan pişirmeden geliyor. Sosu blenderdan geçirme adımını da yazdık, çünkü kremanın eklendiği pürüzsüz dokuyu bu sağlıyor.

    '
  intro: 'Tikka masala, yoğurt ve baharatlarla marine edilip kızartılan tavuk parçalarının baharatlı, domatesli ve kremalı bir sosta buluştuğu bir yemek. Hint mutfağı kökenli tekniklerle yapılır ve özellikle İngiltere''de çok sevilen, restoran menülerinin bilinen tabaklarından biri olmuştur.


    Bu tarifte kuşbaşı tavuk yoğurt, garam masala, toz kırmızı biber ve tuzla en az 30 dakika marine ediliyor, sonra döküm tavada ya da fırın ızgarasında kenarları kararana kadar pişiyor. Sos için tereyağında soğan, sarımsak ve zencefil yumuşatılıyor, garam masala, kimyon ve zerdeçal çevriliyor, konserve domatesle pişip blenderdan geçiriliyor. Krema ve tavuk eklenip 5 dakika kaynatılıyor.


    Hazırlık 20, pişirme 30 dakika; marinasyon için en az yarım saati ayrıca planla. Tarif 4 kişilik.

    '
  notes:
  - t: Yoğurtlu marinasyon
    d: 'Yoğurt, tavuğun yüzeyini yumuşatır ve baharatların etin dışına tutunmasını sağlar. En az 30 dakika marinasyon yeterli; vaktin varsa daha uzun bekletmek tadı derinleştirir. Kuşbaşı parçaların yaklaşık aynı boyda olmasına dikkat et ki aynı sürede pişsinler. Tavuk göğsü daha yağsız, but ise daha sulu kalır; ikisi de bu tarifte kullanılabilir. Pişirmeden önce fazla yoğurdu hafifçe silkelemek, tavada kızarmayı kolaylaştırır. Marine edilen tavuğu buzdolabında bekletmeyi unutma.

      '
  - t: Kenarları kararana kadar kızartmak
    d: 'Tikka tadının kaynağı, tavuğun yüksek ısıda kısa sürede pişip kenarlarının hafifçe kararmasıdır. Döküm tavayı iyice kızdır ya da fırın ızgarasını kullan; parçaları sıkışık dizme, yoksa tavuk su salıp haşlanır. Yaklaşık 10 dakikada pişen tavukları ayır. Tavuk sosa döndüğünde 5 dakika daha pişeceği için bu aşamada içinin tamamen pişmiş olması yeterli, fazla bekletirsen kuruyabilir. Izgara kullanmak isli aromayı belirginleştirir. Tavadan aldığın parçaları bir tabakta bekletirken üstünü örtebilirsin.

      '
  - t: Sos, krema ve servis
    d: 'Baharatları tereyağında 1 dakika çevirmek, aromalarını açığa çıkarır; daha uzun tutarsan yanıp acılaşabilir. Domatesle 10 dakika pişen sosu blenderdan geçirmek kremamsı, pürüzsüz bir doku verir. Krema yerine süzme yoğurt kullanacaksan ocaktan aldıktan sonra ekle ve kaynatma, yoksa kesilir. Garam masala bulamazsan eşit ölçü kimyon ve kişniş tohumuna birer tutam tarçın, karanfil ve karabiber eklemek iş görür. Yanına basmati pilav ya da naan yakışır.

      '
  faq:
  - q: Tikka masala için tavuk ne kadar marine edilir?
    a: 'Yoğurt ve baharatlarla en az 30 dakika marine edilmelidir. Daha uzun beklemesi tadı derinleştirir.

      '
  - q: Tikka masalada krema yerine ne kullanılır?
    a: 'Süzme yoğurt kullanabilirsin; ocaktan aldıktan sonra ekle ve kaynatma. Bir su bardağı süte 2 yemek kaşığı tereyağı eklemek de bir seçenek.

      '
  - q: Garam masala yerine ne kullanılır?
    a: 'Eşit ölçü kimyon ve kişniş tohumuna birer tutam tarçın, karanfil ve karabiber ekleyerek benzer bir karışım hazırlayabilirsin.

      '
  - q: Tikka masalanın yanına ne yenir?
    a: 'Basmati pilav ya da naan en sık eşlik eden seçeneklerdir; ikisi de sosu çeker.

      '
biryani:
  aramaBasligi: 'Tavuklu biryani tarifi: Safranlı basmati, katlı demleme'
  editorNote: 'Pirinci 6 dakika yarı haşlama adımını süresiyle birlikte ayrı yazdık, çünkü biryanide tanelerin lapa olmaması buna bağlı. Soğanı karamelize etme süresini de 15 dakika olarak verdik; aceleye gelince biryaninin tatlımsı derinliği kayboluyor.

    '
  intro: 'Biryani, baharatlı et ya da tavuk ile kokulu pirincin katlar halinde demlendiği bir pilav. Hint alt kıtasının en bilinen yemeklerinden biri; bölgeden bölgeye pek çok çeşidi var ve özel günlerin sofralarında sık yer alıyor.


    Bu tarifte iri doğranmış tavuk but yoğurt, sarımsak, zencefil, garam masala, zerdeçal ve kırmızı biberle en az 30 dakika marine ediliyor. Soğanlar tereyağında koyu altın rengine kadar kavruluyor, yarısı süs için ayrılıyor. Tavuk aynı tencerede 15 dakika pişiyor. Basmati pirinç kakule, defne ve tarçınla 6 dakika yarı haşlanıp tavuğun üzerine yayılıyor; safranlı süt, soğan, nane ve kişnişle en kısık ateşte 20 dakika demleniyor.


    Hazırlık 40, pişirme 45 dakika; toplam 85 dakikada 6 kişilik bir tencere hazır.

    '
  notes:
  - t: Pirinci neden yarı haşlıyoruz
    d: 'Biryanide pirinç iki aşamada pişer: önce bol tuzlu suda kısa bir haşlama, sonra tavuğun üzerinde buharla demlenme. 30 dakika ıslatılmış basmatiyi baharatlarla 6 dakika haşladığında tane hâlâ sert olmalı. Bu aşamada tam pişirirsen demleme sırasında pirinç lapa olur ve katlar birbirine karışır. Süzdüğün pirinci bekletmeden tavuğun üzerine yay; demlenirken tavuğun ve baharatların buharını çekerek pişmeyi tamamlar. Haşlama suyuna eklenen kakule, defne ve tarçın pirince hafif bir koku verir.

      '
  - t: Karamelize soğan ve katlama
    d: 'Soğanları tereyağında 15 dakika, koyu altın rengi olana kadar kavurmak biryaninin tatlımsı, derin tadını verir. Ateşi orta tut ve sık karıştır; soğan bir anda yanarsa acılaşır. Yarısını süs için ayırıp diğer yarısını tavukla pişirmek, tadı hem tabanda hem üst katta toplar. Demleme öncesinde safranlı sütü, ayırdığın soğanı, nane ve kişnişi pirincin üzerine serp ama karıştırma; katların ayrı kalması biryaninin görüntüsü ve tadı için önemli.

      '
  - t: Demleme ve servis
    d: 'Kapağı bir bezle sarıp sıkıca kapatmak, buharın tencere içinde kalmasını sağlar. En kısık ateşte 20 dakika demledikten sonra servis ederken kepçeyi tencerenin dibine daldır ve katları bozmadan tabağa al; böylece her porsiyonda hem tavuk hem pirinç olur. Yanına yoğurt ya da salatalıklı raita yakışır. Kişniş sevmiyorsan sadece nane kullanabilirsin. Safran bulamazsan bir tutam zerdeçal renk verir, ama aroma aynı olmaz.

      '
  faq:
  - q: Biryani pirinci kaç dakika haşlanır?
    a: '30 dakika ıslatılmış basmati pirinç tuzlu bol kaynar suda 6 dakika haşlanır. Tane hâlâ sert olmalı; pişmeyi demleme tamamlar.

      '
  - q: Biryani kaç dakika demlenir?
    a: 'Pirinç tavuğun üzerine yayıldıktan sonra kapağı bezle kapatılıp en kısık ateşte 20 dakika demlenir.

      '
  - q: Biryanide safran yerine ne kullanılır?
    a: 'Renk için bir tutam zerdeçal kullanabilirsin. Görüntü benzer olur ama safranın aroması gelmez.

      '
  - q: Biryani neden lapa olur?
    a: 'Genellikle pirinç yarı haşlama aşamasında fazla pişirildiği için. Haşlamayı 6 dakikada kes ve katları demlerken karıştırma.

      '
tavuk-teriyaki:
  aramaBasligi: 'Tavuk teriyaki tarifi: Ballı soya soslu, 25 dakikada'
  editorNote: 'Sosu önceden tek kapta karıştırma adımını başa koyduk, çünkü tavuk piştikten sonra sos çok hızlı koyulaşıyor ve tavanın başından ayrılmaman gerekiyor. Kemiksiz but seçtik; yüksek ısıda göğüsten daha sulu kalıyor.

    '
  intro: 'Teriyaki, Japon mutfağından gelen ve soya sosu ile tatlandırıcının birlikte pişirilip parlak bir sır oluşturduğu bir pişirme yöntemi. Tavuk teriyaki da bu sosla kaplanmış, tavada karamelize olmuş tavuk parçalarından oluşuyor.


    Bu tarifte sos soya sosu, bal, pirinç ya da elma sirkesi, rendelenmiş sarımsak ve zencefil, mısır nişastası ve suyla önceden karıştırılıyor. Kuşbaşı kemiksiz tavuk but kızgın tavada her yüzü kızarana kadar yaklaşık 8 dakika pişiyor, ardından sos ekleniyor ve 2-3 dakika karıştırılarak tavuklar parlak bir sosla kaplanıyor. Üzerine susam ve taze soğan serpiliyor.


    Hazırlık 10, pişirme 15 dakika; toplam 25 dakikada 3 kişilik bir akşam yemeği hazır. Airfryer yöntemi de tarifte var.

    '
  notes:
  - t: Sosun parlaklığı ve kıvamı
    d: 'Teriyaki sosunun parlak ve tavuğa yapışan kıvamını mısır nişastası ve bal birlikte verir. Nişastayı sosun soğuk malzemeleriyle önceden karıştırmak topaklanmayı önler. Sos tavaya girdiğinde hızla koyulaşır; tavayı ocaktan ayrılmadan sürekli çevir. Fazla pişirirsen bal yanmaya başlar ve sos acılaşır. Sos tavukları sarıp parlak bir hal aldığında ocağı kapat. Koyulaşma fazla olursa bir iki kaşık su ekleyerek açabilirsin. Sarımsak ve zencefili ince rendelemek sosun pürüzsüz kalmasını sağlar.

      '
  - t: Tavuğu önce kızartmak
    d: 'Tavuk parçalarını sosla birlikte çiğken tavaya koyarsan tavuk kızarmak yerine sosun içinde haşlanır. Bu yüzden önce kızgın yağda her yüzü renk alana kadar pişiriyoruz. Parçaları tavaya tek kat yay ve ilk birkaç dakika karıştırma; tavaya değen yüzün kızarması için zaman gerekir. Kemiksiz but bu yöntemde sulu kalır. Göğüs kullanacaksan parçaları biraz daha küçük doğra ve pişirme süresini kısa tut ki kurumasın.

      '
  - t: Malzeme alternatifleri ve servis
    d: 'Bal yerine üzüm pekmezi, akçaağaç ya da hurma şurubu kullanabilirsin. Pirinç sirkesi yoksa elma sirkesi ya da yarı ölçü limon suyu olur. Glutensiz tüketiyorsan soya sosu yerine tamari tercih et. Aynı sos somonla da çok iyi gider. Tavuk teriyakiyi sade pilavla servis etmek klasik yöntem; sos pilavın üzerine akarak tadı tamamlar. Artanı kapalı kapta buzdolabında saklayıp tavada az suyla ısıtabilirsin.

      '
  faq:
  - q: Teriyaki sosu nasıl yapılır?
    a: '4 yemek kaşığı soya sosu, 2 yemek kaşığı bal, 1 yemek kaşığı sirke, sarımsak, zencefil, 1 tatlı kaşığı mısır nişastası ve 3 yemek kaşığı suyu karıştır. Tavukların üzerine ekleyip 2-3 dakika pişirince koyulaşır.

      '
  - q: Tavuk teriyaki kaç dakika pişer?
    a: 'Tavuklar kızgın tavada yaklaşık 8 dakika kızarır, sos eklendikten sonra 2-3 dakika daha pişer.

      '
  - q: Tavuk teriyaki airfryerda yapılır mı?
    a: 'Evet. Tavukları 200°C''de 10 dakika pişir, sosla karıştırıp 2 dakika daha pişir.

      '
  - q: Teriyaki sosunda bal yerine ne kullanılır?
    a: 'Üzüm pekmezi, akçaağaç şurubu ya da hurma şurubu kullanabilirsin.

      '
shakshuka:
  aramaBasligi: 'Shakshuka tarifi: Kimyonlu domates sosunda yumurta'
  editorNote: 'Sosun 10 dakika koyulaşma süresini ayrıca belirttik, çünkü sulu sosta açılan çukurlar dağılıyor ve yumurta yayılıyor. Kimyonu baharatlar arasında tuttuk; shakshukayı menemenden ayıran tat büyük ölçüde ondan geliyor.

    '
  intro: 'Shakshuka, baharatlı domates ve biber sosunda pişirilen yumurtalardan oluşan bir tava yemeği. Kuzey Afrika mutfağıyla bilinir ve Orta Doğu''da da çok yaygın bir kahvaltılık. Menemene benzese de yumurtalar karıştırılmaz; sosun içinde bütün olarak pişer.


    Bu tarifte zeytinyağında soğan ve kapya biber yumuşatılıyor, sarımsak, kimyon, tatlı toz kırmızı biber ve pul biber 1 dakika çevriliyor. Domates eklenip sos 10 dakika koyulaşıyor. Sosta dört çukur açılıp yumurtalar kırılıyor ve kapak kapalı, beyazlar pişip sarılar akışkan kalana kadar pişiyor. Üzerine beyaz peynir ve maydanoz serpiliyor.


    Hazırlık 10, pişirme 20 dakika; toplam 30 dakikada 2 kişilik bir kahvaltı hazır. Tavada, ekmekle servis edilir.

    '
  notes:
  - t: Sosun kıvamı
    d: 'Yumurtaların sosta yerinde durması için sosun yeterince koyulaşmış olması gerekir. Domatesi ekledikten sonra yaklaşık 10 dakika, sos kaşıkla çizdiğinde hemen kapanmayacak kıvama gelene kadar pişir. Sulu bir sosta açtığın çukurlar kapanır, yumurta beyazı sosa yayılır. Taze domates kullanacaksan dört olgun domates yeterli; kışın konserve domates daha lezzetli sonuç verir. Tuzu sos koyulaştıktan sonra kontrol etmek daha doğru olur. Tavanın geniş ve yayvan olması da sosun eşit koyulaşmasına yardım eder.

      '
  - t: Yumurtayı doğru pişirmek
    d: 'Shakshukanın amacı, beyazı tamamen pişmiş ama sarısı akışkan yumurtalardır. Yumurtaları sosta açtığın çukurlara kırdıktan sonra kapağı kapat; kapalı tava buharla yumurtanın üstünü de pişirir. Yaklaşık 6 dakika sonra kontrol et: beyaz opaklaşmış ve sarı hafif titriyorsa ocağı kapat. Tava sıcak olduğu için yumurta bir süre daha pişmeye devam eder, bu yüzden sofraya taşırken biraz erken almak iyi bir yöntemdir. Yumurtaları önce bir kaseye kırıp sonra çukura dökmek sarının dağılmasını önler.

      '
  - t: Baharat ve servis
    d: 'Kimyon shakshukaya karakterini veren baharattır; baharatları yağda 1 dakika çevirmek aromalarını açığa çıkarır, fazlası yakar. Kapya biber bulamazsan kırmızı dolmalık biber ya da közlenmiş kavanoz biber kullanabilirsin. Beyaz peynir yerine tuzlanmış lor ya da tulum peyniri olur. Shakshuka tavada, sofranın ortasında servis edilir; sosa ekmek banmak yemeğin önemli parçası. En iyisi sıcakken yemek, çünkü bekleyince sarılar katılaşır. Yanına sade yoğurt da yakışır.

      '
  faq:
  - q: Shakshuka ile menemen arasındaki fark nedir?
    a: 'Menemende yumurtalar sosla karıştırılır. Shakshukada ise yumurtalar sosta açılan çukurlara bütün kırılır ve karıştırılmadan pişer; sosta kimyon da belirgindir.

      '
  - q: Shakshukada yumurta kaç dakika pişer?
    a: 'Kapak kapalı olarak yaklaşık 6 dakika pişer. Beyazlar pişip sarılar akışkan kaldığında hazırdır.

      '
  - q: Shakshuka konserve domatesle yapılır mı?
    a: 'Evet, tarif 400 g konserve domates ya da 4 olgun domatesle yapılır. Kışın konserve domates daha lezzetli olur.

      '
  - q: Shakshukada kapya biber yerine ne kullanılır?
    a: 'Kırmızı dolmalık biber ya da közlenmiş kavanoz biber kullanabilirsin.

      '
serpme-kahvalti:
  aramaBasligi: 'Evde serpme kahvaltı nasıl hazırlanır: Sıra ve liste'
  editorNote: 'Bu sayfayı bir tarif olmaktan çok bir hazırlık planı olarak yazdık; serpme kahvaltıda zorluk tek tek tabaklarda değil, hepsini sıcak ve taze biçimde aynı anda sofraya getirmekte. Bu yüzden çayı başa, sıcak tavayı en sona koyduk.

    '
  intro: 'Serpme kahvaltı, peynirlerin, zeytinlerin, reçel ve balın, sebzelerin ve en az bir sıcak tavanın küçük tabaklar halinde sofraya yayıldığı kahvaltı biçimi. Türkiye''de özellikle hafta sonları ve misafirli sabahlarda kurulur; her şeyden biraz olması ve uzun sürmesi bu sofranın keyfidir.


    Bu sayfada beyaz peynir, kaşar ve tulum ya da örgü peyniri, siyah ve yeşil zeytin, bal-tereyağı, reçel, tahin-pekmez, domates, salatalık ve sivri biberden oluşan soğuk tabaklar var. Sıcak tarafta menemen ya da sucuklu yumurta ve fırında ısıtılan simit yer alıyor. Asıl önemli kısım sıralama: önce çay, sonra soğuklar, en son sıcaklar.


    Hazırlık 30, pişirme 15 dakika; toplam 45 dakikada 4 kişilik bir sofra kuruluyor.

    '
  notes:
  - t: Hazırlık sırası
    d: 'Serpme kahvaltının düzeni sırayla kurulur. İlk iş çayı demlemek; demlenmesi zaman aldığı için sen diğer işleri yaparken hazır olur. Ardından soğuk tabakları hazırla: peynirleri dilimle, zeytinleri kâselere paylaştır, sebzeleri doğra, tatlıları ayrı kâselere koy. Simitleri fırında 3-4 dakika ısıt. Menemen ya da sucuklu yumurtayı en son, herkes sofraya oturduğunda yap. Bu sıra, soğukların bayatlamasını ve sıcakların soğumasını önler. Bu planla dört kişilik sofra yaklaşık 45 dakikada kurulur.

      '
  - t: Peynirler ve zeytinler
    d: 'Peynirleri buzdolabından yarım saat önce çıkar; soğuk peynirin tadı ve kokusu belirgin olmaz, oda sıcaklığında çok daha lezzetli olur. Lokma büyüklüğünde dilimlemek, herkesin farklı peynirleri tadabilmesini kolaylaştırır. Zeytinlerin üzerine biraz zeytinyağı ve kekik gezdirmek basit ama etkili bir dokunuştur. Tulum peyniri bulamazsan beyaz peynir ve biraz eski kaşar karışımı kullanabilirsin; kaşar yerine eriyen herhangi bir peynir de olur. Tuzlu peynirlerin yanına sade dilimler eklemek dengeyi korur.

      '
  - t: Sofrayı kurmak
    d: 'Büyük bir tahta ya da tepsiyi sofranın ortasına koyup kâseleri etrafına yerleştirmek, herkesin her şeye kolayca uzanmasını sağlar. Küçük ve farklı boylarda kâseler kullanmak sofrayı kalabalık ve davetkâr gösterir, aynı zamanda malzemeyi az miktarda koyup gerektikçe tazelemeye imkân verir. Sıcak tavayı ortaya bırak. Domates ve salatalığı servisten kısa süre önce dilimle; uzun beklerlerse su salıp tabağı ıslatırlar. Sucuk isteğe bağlı, istersen çıkarabilirsin.

      '
  faq:
  - q: Serpme kahvaltıda neler olur?
    a: 'Beyaz peynir, kaşar, tulum ya da örgü peyniri, zeytin, bal-tereyağı, reçel, tahin-pekmez, domates, salatalık, sivri biber, yeşillik, simit ve menemen ya da sucuklu yumurta gibi bir sıcak tava. Yanında demli çay.

      '
  - q: Serpme kahvaltı kaç kişilik hazırlanır?
    a: 'Bu sayfadaki ölçüler 4 kişiliktir; örneğin 200 g beyaz peynir, 150 g kaşar ve 100 g tulum ya da örgü peyniri.

      '
  - q: Serpme kahvaltıyı ne kadar sürede hazırlarım?
    a: 'Yaklaşık 30 dakika hazırlık ve 15 dakika pişirmeyle toplam 45 dakikada kurulur. Sıcak tavayı en sona bırakmak süreyi verimli kullanmanı sağlar.

      '
  - q: Kahvaltıda peynir neden oda sıcaklığında olmalı?
    a: 'Soğuk peynirin tadı ve kokusu bastırılır. Peynirleri sofradan yarım saat önce buzdolabından çıkarmak lezzetlerini ortaya çıkarır.

      '
pastirmali-yumurta:
  aramaBasligi: 'Pastırmalı yumurta tarifi: Tereyağında sahanda, 8 dakika'
  editorNote: 'Pastırmayı yalnızca 30 saniye çevirme adımını ayrıca yazdık; daha uzun pişince sertleşip acılaşıyor. Tuz eklemeyi de bilerek tarifin dışında bıraktık, çünkü pastırmanın tuzu yumurtaya yetiyor.

    '
  intro: 'Pastırmalı yumurta, tereyağında hafifçe çevrilen pastırma dilimlerinin üzerine kırılan göz yumurtalardan oluşan bir kahvaltılık. Pastırma Kayseri ile özdeşleşmiş bir et ürünü ve bu sahan da Kayseri kahvaltısının bilinen tabaklarından biri.


    Bu tarifte tereyağı sahanda eritiliyor, 8 dilim pastırma diziliyor ve 30 saniye çevriliyor. Ardından 4 yumurta pastırmaların üzerine kırılıyor, kapak kapalı olarak beyazlar pişip sarılar akışkan kalana kadar yaklaşık 4 dakika pişiyor. En son bir tutam pul biber serpiliyor. Pastırma zaten tuzlu olduğu için tuz eklenmiyor.


    Hazırlık 2, pişirme 6 dakika; toplam 8 dakikada 2 kişilik bir kahvaltı hazır. Yanında sıcak ekmek bu tabağın tamamlayıcısı.

    '
  notes:
  - t: Pastırmayı kısa pişirmek
    d: 'Pastırma kurutulmuş bir et olduğu için uzun süre ısıya dayanmaz. Tereyağında 30 saniye çevirmek, yağının biraz erimesi ve kenarlarının hafifçe çıtırlaşması için yeterlidir. Daha uzun beklersen sertleşir ve çemenli kısmı acılaşabilir. Yumurtaları pastırmaların üzerine kırdıktan sonra pastırma pişmeye devam edeceği için ilk aşamayı kısa tutmak önemli. Ateşi orta seviyede tut ki tereyağı yanmasın. Sahan küçükse pastırmaları hafifçe üst üste bindirerek dizebilirsin; yumurtalar bu katmanın üzerinde pişer.

      '
  - t: Çemen ve tuz
    d: 'Pastırmanın dışındaki çemen, kendine özgü ve belirgin bir tat verir. Bu tadı sevmiyorsan kasaptan ya da şarküteriden çemeni sıyrılmış pastırma isteyebilirsin. Pastırma hem çemeni hem de kendisiyle oldukça tuzludur; bu yüzden yumurtalara tuz ekleme. Tadına bakmadan tuz atarsan tabak kolayca tuzlu olur. Tereyağı yerine zeytinyağı kullanacaksan, tuzlu yemeklerde önerildiği gibi yaklaşık dörtte üç ölçü yeterli. Pul biberi en sonda serpmek renginin canlı kalmasını sağlar.

      '
  - t: Yumurtanın kıvamı ve servis
    d: 'Kapağı kapatmak, yumurtanın üst yüzeyini buharla pişirerek beyazın sarıdan önce tamamen pişmesini sağlar. Yaklaşık 4 dakika sonra beyaz opaklaştığında ve sarı hâlâ akışkan olduğunda ocaktan al. Sarısını daha katı seviyorsan bir dakika daha bekleyebilirsin. Pastırmalı yumurta sahanında ve hemen servis edilir; bekledikçe pastırma sertleşir. Yanına sıcak ekmek koy, sarıyı ve tereyağını ekmekle toplamak bu tabağın en güzel kısmıdır. İki kişilik bu tarifte kişi başına iki yumurta düşüyor.

      '
  faq:
  - q: Pastırmalı yumurtaya tuz atılır mı?
    a: 'Hayır. Pastırma yeterince tuzlu olduğu için bu tarifte tuz eklenmiyor.

      '
  - q: Pastırmalı yumurta kaç dakikada pişer?
    a: 'Pastırma tereyağında 30 saniye çevrilir, yumurtalar kırıldıktan sonra kapak kapalı yaklaşık 4 dakika pişer. Toplam 8 dakikada hazır olur.

      '
  - q: Pastırma neden sertleşir?
    a: 'Fazla pişirildiği için. Pastırmayı yumurtadan önce yalnızca 30 saniye çevirmek yeterli; uzun pişince sertleşir ve acılaşır.

      '
  - q: Pastırmanın çemen tadı nasıl azaltılır?
    a: 'Çemen tadını sevmiyorsan çemeni sıyrılmış pastırma iste ya da dış kısmındaki çemeni pişirmeden önce bıçakla sıyır.

      '
ispanakli-yumurta:
  aramaBasligi: 'Ispanaklı yumurta tarifi: Soğanlı ıspanakta, 17 dakika'
  editorNote: 'Ispanağı suyunu çekene kadar soldurma adımına süre verdik, çünkü yumurtayı sulu ıspanağa kırınca beyaz yayılıp haşlanıyor. Servis için yoğurdu ayrı bir malzeme olarak ekledik; ıspanakla yumurtanın arasına ferahlık katıyor.

    '
  intro: 'Ispanaklı yumurta, soğanla soldurulmuş ıspanağın üzerine kırılan yumurtaların kapak altında pişirildiği hafif bir kahvaltılık. Menemenin yeşil bir versiyonu gibi düşünebilirsin; tek tavada, kısa sürede hazırlanıyor.


    Bu tarifte zeytinyağında soğan yumuşatılıyor, 300 g doğranmış ıspanak eklenip suyunu çekene kadar yaklaşık 6 dakika soldurulup tuzlanıyor. Ispanakta dört çukur açılıp yumurtalar kırılıyor ve kapak kapalı, kısık ateşte beyazlar pişene kadar 5 dakika pişiyor. Servis sırasında pul biber ve yoğurt ekleniyor.


    Hazırlık 5, pişirme 12 dakika; toplam 17 dakikada 2 kişilik bir kahvaltı hazır. Hafta içi sabahlar için de yetişecek kadar pratik. İstersen üzerine beyaz peynir de ufalayabilirsin.

    '
  notes:
  - t: Ispanağın suyunu çektirmek
    d: 'Ispanak pişerken bol su salar. Bu suyu tavada çektirmeden yumurtaları kırarsan beyazlar suya yayılır ve haşlanmış gibi olur, tabak da sulu kalır. Ispanağı ekledikten sonra ara ara karıştırarak suyunu çekene kadar yaklaşık 6 dakika soldur. Yıkadığın ıspanağı iyice süzmek ve mümkünse hafifçe kurulamak bu süreyi kısaltır. Tuzu ıspanak solduktan sonra eklemek de miktarı ayarlamayı kolaylaştırır, çünkü ıspanak hacminin büyük kısmını kaybeder.

      '
  - t: Kısık ateş ve kapak
    d: 'Yumurtaları ıspanakta açtığın çukurlara kırdıktan sonra ateşi kısıp kapağı kapat. Kısık ateş, tavanın dibindeki ıspanağın yanmasını önlerken kapak altındaki buhar yumurtanın üstünü pişirir. Yaklaşık 5 dakika sonra beyazlar pişmiş olur. Sarısını akışkan seviyorsan bu noktada ocaktan al, daha katı seviyorsan bir iki dakika daha bekle. Tava sıcaklığını koruduğu için servis ederken yumurta bir süre daha pişmeye devam eder. Kapağın sıkı oturması süreyi kısaltır.

      '
  - t: Servis ve alternatifler
    d: 'Yoğurt ve pul biber bu tabağın tamamlayıcısıdır; yoğurdu ocaktan aldıktan sonra ekle ki sıcakta kesilmesin. Üzerine beyaz peynir ufalarsan tuzlu ve kremamsı bir katman eklenir. Ispanak yerine pazı da kullanılabilir; pazının sapları daha sert olduğu için onları ince doğrayıp soğanla birlikte biraz daha uzun pişir. Kuru soğan yerine arpacık ya da mor soğan kullanırsan tat biraz daha tatlı olur. Yanına sıcak ekmek koymayı unutma.

      '
  faq:
  - q: Ispanaklı yumurta kaç dakikada pişer?
    a: 'Ispanak yaklaşık 6 dakika soldurulur, yumurtalar kırıldıktan sonra kapak kapalı kısık ateşte 5 dakika pişer. Toplam 17 dakikada hazırdır.

      '
  - q: Ispanaklı yumurta neden sulu olur?
    a: 'Ispanağın suyu çektirilmeden yumurta kırıldığı için. Ispanağı suyunu çekene kadar soldurduktan sonra yumurtaları ekle.

      '
  - q: Ispanaklı yumurtada ıspanak yerine ne kullanılır?
    a: 'Pazı kullanabilirsin. Saplarını ince doğrayıp biraz daha uzun pişir.

      '
  - q: Ispanaklı yumurtanın yanına ne yakışır?
    a: 'Yoğurt ve pul biber tarifin parçası. Üzerine beyaz peynir ufalamak da çok yakışır.

      '
patatesli-omlet:
  aramaBasligi: 'İspanyol omleti tarifi: Patatesli tortilla, dilimlik'
  editorNote: 'Patatesi kızartmadan, kısık ateşte zeytinyağında yumuşatma adımına 20 dakikalık süre verdik; tortillanın yumuşak dokusu bu yavaş pişirmeden geliyor. Patatesin yumurtayla 5 dakika bekletilmesini de ayrı yazdık, çünkü karışım bu sürede bütünleşiyor.

    '
  intro: 'İspanyol omleti ya da İspanyolca adıyla tortilla española, patates, soğan ve yumurtayla yapılan kalın bir omlet. İspanya''nın en bilinen tapalarından biri; pasta gibi dilimlenip ılık ya da soğuk yenir, bu yüzden kahvaltıda da öğle yemeğinde de olur.


    Bu tarifte ince dilimlenmiş 4 patates ve 1 soğan, yarım su bardağı zeytinyağında kısık ateşte kızarmadan yumuşayana kadar yaklaşık 20 dakika pişiyor ve süzgece alınıyor. 6 yumurta tuzla çırpılıp ılık patateslerle 5 dakika bekletiliyor. Karışım bir kaşık yağla tavaya dökülüyor, altı tutunca bir tabak yardımıyla ters çevrilip diğer yüzü pişiyor.


    Hazırlık 10, pişirme 30 dakika; toplam 40 dakikada 4 kişilik bir omlet çıkıyor.

    '
  notes:
  - t: Patatesi kızartmadan pişirmek
    d: 'Tortillada patates kızarmış değil, zeytinyağında yavaşça yumuşamış olmalı. Bu yüzden ateşi kısık tut ve patates ile soğanı ara ara karıştırarak yaklaşık 20 dakika pişir. Patates çatalla kolayca ezilecek kıvama geldiğinde hazırdır. Renk almaya başlarsa ateşi daha da kıs. Pişen patatesleri süzgece al; süzülen zeytinyağını atma, başka yemeklerde kullanabilirsin. Patates yerine tatlı patates kullanırsan pişirme süresi biraz kısalır. Patatesleri ince ve eşit dilimlemek eşit pişmelerini sağlar.

      '
  - t: Ters çevirme adımı
    d: 'Omleti çevirmek ilk denemede ürkütücü görünebilir. Karışımı tavaya döktükten sonra kısık ateşte, kenarları ve altı tutana kadar pişir; tavayı hafifçe sallayınca omlet bütün halde kayıyorsa çevirmeye hazırdır. Tavadan biraz büyük bir tabağı tavanın üzerine kapat, bir elinle tabağı tutarak tavayı hızla ters çevir. Omleti tabaktan tekrar tavaya kaydır ve diğer yüzünü pişir. Bu işlemi lavabonun üzerinde yapmak dökülme riskine karşı pratik bir önlemdir.

      '
  - t: Kıvam ve servis
    d: 'İspanyol omletinin içi hafif sulu kalabilir; bu bir hata değil, yaygın ve sevilen bir kıvamdır. Daha pişmiş seviyorsan her iki yüzü biraz daha uzun pişirebilirsin. Omleti tavadan aldıktan sonra biraz dinlendir; ılıdığında daha düzgün dilimlenir. Pasta gibi üçgen dilimler halinde servis et. Soğuk da yenebildiği için önceden yapılıp buzdolabında kapalı bir kapta saklanabilir; bu da onu iş yerine götürmek için uygun bir seçenek yapar.

      '
  faq:
  - q: İspanyol omleti nasıl ters çevrilir?
    a: 'Altı tutunca tavanın üzerine tavadan biraz büyük bir tabak kapat, tavayı hızla ters çevir ve omleti tabaktan tekrar tavaya kaydırarak diğer yüzünü pişir.

      '
  - q: İspanyol omletinde patates kaç dakika pişer?
    a: 'İnce dilimlenmiş patates ve soğan zeytinyağında kısık ateşte, kızartmadan yaklaşık 20 dakika pişer.

      '
  - q: Tortilla soğuk yenir mi?
    a: 'Evet. İspanyol omleti ılık ya da soğuk, pasta gibi dilimlenerek servis edilir.

      '
  - q: İspanyol omletinde patates yerine ne kullanılır?
    a: 'Tatlı patates kullanabilirsin; pişirme süresi biraz kısalır.

      '
kasarli-tost:
  aramaBasligi: 'Kaşarlı tost tarifi: Tavada ya da makinede, dışı çıtır'
  editorNote: 'Tereyağını ekmeğin iç yüzüne değil dış yüzüne sürmeyi seçtik; tostun çıtır kabuğu bu yağdan geliyor. Tavada yapanlar için ağırlık ve kapak ipuçlarını da ekledik, çünkü makine olmadan kaşarın erimesi daha uzun sürüyor.

    '
  intro: 'Kaşarlı tost, iki dilim ekmeğin arasına konan kaşar peynirinin ısıyla eritildiği, dışı çıtır içi uzayan bir kahvaltılık. Türkiye''de evde, kafede ve yolda en sık yenen hızlı atıştırmalıklardan biri.


    Bu tarifte tost ekmeklerinin dış yüzlerine ince tereyağı sürülüyor. İki dilimin iç yüzüne 150 g rendelenmiş ya da dilim kaşar yayılıyor, istersen bir tutam kekik serpiliyor ve diğer dilimlerle kapatılıyor. Tost makinesinde ya da tavada, üzerine ağırlık konarak her yüzü 2-3 dakika pişiyor. Airfryer yöntemi de tarifte ayrıca yer alıyor.


    Hazırlık 3, pişirme 6 dakika; toplam 9 dakikada 2 tost hazır. Doğru kaşar ve sabırlı bir ateş yeterli.

    '
  notes:
  - t: Kaşarın erimesi
    d: 'Tostun içi uzayan bir kıvamda olsun istiyorsan kaşarın tamamen erimesi gerekir. Rendelenmiş kaşar, dilime göre daha hızlı ve eşit erir. Ateşi orta seviyede tut; çok yüksek ateşte ekmek yanarken içindeki peynir hâlâ katı kalır. Tavada yapıyorsan üzerine bir tencere kapağı koymak ısıyı tutar ve kaşarın daha hızlı erimesini sağlar. Kaşar yerine eriyen başka bir peynir de kullanabilirsin, ama tat ve tuzluluk değişir.

      '
  - t: Ağırlık ve tereyağı
    d: 'Tost makinesi ekmeği bastırarak hem yüzeyin tavaya tam temas etmesini hem de peynirin dilimlere yapışmasını sağlar. Tavada yaparken bu etkiyi elde etmek için tostun üzerine ağır bir tencere ya da düz bir kap koy. Tereyağını ekmeğin dış yüzüne ince bir tabaka halinde sürmek, yüzeyin altın rengi ve çıtır olmasını sağlar. Fazla tereyağı sürersen tost yağlı olur ve tavada çabuk yanar.

      '
  - t: Airfryer ve varyasyonlar
    d: 'Airfryer kullanıyorsan tostu sepete koy ve hafif bir ağırlık olsun diye üzerine ters çevrilmiş küçük bir metal kap yerleştir; 180°C''de 6-8 dakika pişir ve yarısında çevir. Ağırlık olmazsa üst dilim fanla kalkabilir. Klasik varyasyonlar için içine domates dilimi ya da sucuk ekleyebilirsin; domates kullanacaksan dilimleri ince kes ki tost sulanmasın. Tost en iyi sıcakken yenir, bekledikçe kaşar sertleşir. Domates eklersen tostu hemen ye.

      '
  faq:
  - q: Kaşarlı tost tavada nasıl yapılır?
    a: 'Ekmeklerin dış yüzüne tereyağı sür, arasına kaşar koy ve tavada üzerine ağırlık koyarak her yüzü 2-3 dakika pişir. Üzerine tencere kapağı koyarsan kaşar daha hızlı erir.

      '
  - q: Kaşarlı tost airfryerda kaç dakika pişer?
    a: '180°C''de 6-8 dakika pişer; yarısında çevir ve üzerine küçük bir metal kap koyarak hafif ağırlık ver.

      '
  - q: Tost için kaşar mı rendelenir dilim mi konur?
    a: 'İkisi de olur. Rendelenmiş kaşar daha hızlı ve eşit erir.

      '
  - q: Kaşarlı tostun içine ne konur?
    a: 'Klasik varyasyonlar domates dilimi ve sucuktur. Bir tutam kekik de tarifte isteğe bağlı olarak yer alıyor.

      '
acai-chia-bowl:
  aramaBasligi: 'Açai bowl tarifi: Chia pudingli, granola ve muzlu'
  editorNote: 'Açai katmanının altına chia puding eklemeyi seçtik; bowl hem daha tok tutuyor hem de iki katmanlı bir tatlı gibi duruyor. Chia pudingin en az 2 saatlik bekleme süresini ilk adıma yazdık, çünkü bowl''u sabah yapacaksan pudingi önceki akşam hazırlaman gerekiyor.

    '
  intro: 'Açai bowl, dondurulmuş açai püresinin muz ve başka meyvelerle koyu, kaşıkla yenecek kıvamda çekilip üzerine granola ve taze meyve dizilerek servis edildiği bir kase. Açai, Güney Amerika''da yetişen koyu mor bir meyve; bowl biçimi ise dünyanın pek çok yerindeki kafelerde, örneğin Bali''nin Canggu bölgesindeki bowl dükkânlarında sık görülüyor.


    Bu tarifte altta chia tohumu, badem sütü, şurup ve vanilyayla yapılan bir chia puding var. Üzerine açai, dondurulmuş muz, orman meyvesi ve badem sütüyle blenderda çekilen yoğun açai katmanı yayılıyor. En üstte glutensiz granola, muz, çilek, hindistan cevizi pulu, fıstık ezmesi ve kakao çekirdeği yer alıyor.


    Aktif hazırlık 10 dakika, pişirme yok; chia pudingin buzdolabında en az 2 saat beklemesi gerekiyor. Tarif 2 kişilik.

    '
  notes:
  - t: Chia pudingi önceden hazırlamak
    d: 'Chia tohumu sıvıyla karıştırıldığında sıvıyı emip jelimsi bir doku oluşturur, ama bunun için zaman gerekir. Malzemeleri karıştırdıktan 5 dakika sonra bir kez daha karıştır; bu ikinci karıştırma tohumların dipte topaklanmasını önler. Ardından pudingi buzdolabında en az 2 saat beklet. Sabah kahvaltısında yapacaksan pudingi önceki akşam hazırlamak en pratik yol. Puding kapalı bir kapta buzdolabında birkaç gün dayanır, bu yüzden birden fazla porsiyonluk yapabilirsin.

      '
  - t: Açai katmanının kıvamı
    d: 'Açai katmanı smoothie gibi akışkan değil, kaşıkla yenecek kadar yoğun olmalı. Bu kıvamı donuk malzemeler verir: dondurulmuş açai, muz ve orman meyvesi. Blender zorlanırsa durdurup kaşıkla karıştır ve sıvıyı az az ekle; badem sütünü bir kerede eklemek karışımı sulandırır. Muzu dilimleyip dondurursan karışım daha kremamsı olur. Donuk açai püresi bulamazsan tarifteki gibi 2 yemek kaşığı açai tozu kullanabilirsin; toz dolapta uzun süre dayanır.

      '
  - t: Süsleme ve servis
    d: 'Granolayı servisten hemen önce ekle; açainin nemiyle kısa sürede yumuşar ve çıtırlığını kaybeder. Malzemeleri sıralar halinde dizmek hem görüntüyü düzenler hem de her kaşıkta farklı bir doku almanı sağlar. Fıstık ezmesini en son gezdir. Kakao çekirdeği isteğe bağlı; yerine aynı ölçü keçiboynuzu tozu kullanırsan tat daha tatlı ve hafif karamelli olur. Badem sevmiyorsan fındık ya da ceviz ezmesi de kullanabilirsin. Açai katmanı erimeye başladığı için bowl hazırlanır hazırlanmaz yenmeli.

      '
  faq:
  - q: Açai bowl nasıl yapılır?
    a: 'Dondurulmuş açai, dondurulmuş muz, orman meyvesi ve badem sütünü blenderda yoğun kıvamda çek. Kaseye yay, üzerine granola, muz, çilek ve hindistan cevizi pulu diz.

      '
  - q: Chia puding kaç saat bekletilir?
    a: 'Buzdolabında en az 2 saat bekletilmelidir. Önceki akşam hazırlarsan sabaha hazır olur.

      '
  - q: Açai püresi yerine açai tozu kullanılır mı?
    a: 'Evet. 200 g dondurulmuş açai püresi yerine 2 yemek kaşığı açai tozu kullanabilirsin; dondurulmuş muz ve meyveler kıvamı sağlar.

      '
  - q: Açai bowl önceden hazırlanır mı?
    a: 'Chia pudingi önceden hazırlanabilir, ama açai katmanı ve granola servisten hemen önce eklenmeli. Açai erir, granola yumuşar.

      '
acuka:
  aramaBasligi: 'Acuka tarifi: Biber salçalı cevizli ezme, pişirmeden'
  editorNote: 'Acukayı pişirmeden, tek kapta karıştırarak yapılan bir tarif olarak yazdık. Kıvamı ayarlama ve 30 dakika dinlendirme adımlarını ayrı tuttuk, çünkü tatlar ancak dinlendikten sonra dengeleniyor.

    '
  intro: 'Acuka, biber salçası, ceviz ve ekmek ya da galeta unu temelli, baharatlı ve sürülebilir bir ezme. Kahvaltı sofralarında ekmeğe sürülerek, akşam sofralarında da meze olarak yenir; rengi ve acılığıyla sofraya canlılık katar.


    Bu tarifte biber ve domates salçası, iri çekilmiş ceviz içi, galeta unu, zeytinyağı, sarımsak, pul biber, kimyon, nar ekşisi ve tuz bir kapta kaşıkla iyice karıştırılıyor. Kıvam sürülebilir olmalı; kuruysa biraz daha zeytinyağı ekleniyor, tuz ve acılık damak tadına göre ayarlanıyor. Ezme buzdolabında 30 dakika bekletilerek tatların birbirine geçmesi sağlanıyor.


    Hazırlık 10 dakika, pişirme yok; dinlendirme süresiyle birlikte 6 kişilik bir kâse hazırlanıyor. Vegan bir tarif.

    '
  notes:
  - t: Kıvamı ayarlamak
    d: 'Acukanın kıvamı kullandığın salçanın yoğunluğuna göre değişir. Ev salçası genellikle daha koyu, bazı hazır salçalar daha sulu olur. Malzemeleri karıştırdıktan sonra kıvama bak: sürülebilir ama akmayan bir doku istiyoruz. Kuruysa zeytinyağını kaşık kaşık ekle; fazla sulu kaldıysa biraz daha galeta unu eklemek toparlar. Galeta unu dinlenirken sıvıyı çekmeye devam edeceği için kıvamı biraz yumuşak bırakmak daha doğru olur. Sarımsağı ince rendelemek tadın eşit dağılmasını sağlar.

      '
  - t: Neden dinlendiriyoruz
    d: 'Karıştırdığın anda acukanın tadı keskin ve dağınık gelir: salça baskın, sarımsak sert, kimyon ayrı durur. Buzdolabında 30 dakika beklemek, galeta ununun ve cevizin yağı ve salçayı emmesini, baharatların da birbirine geçmesini sağlar. Tuzu ve acılığı son olarak bu bekleme sonrasında kontrol etmek daha doğru sonuç verir. Nar ekşisi ezmeye hafif ekşilik katar; bulamazsan limon suyu ve bir tatlı kaşığı bal ya da pekmez kullanabilirsin.

      '
  - t: Saklama ve alternatifler
    d: 'Acuka kavanozda, kapağı kapalı olarak buzdolabında bir hafta dayanır. Üzerine ince bir kat zeytinyağı gezdirmek yüzeyin kurumasını önler. Ceviz yerine fındık ya da badem, galeta unu yerine rendelenmiş bayat ekmek içi ya da yulaf ezmesi kullanabilirsin. Biber salçası yoksa domates salçasına bir tatlı kaşığı pul biber ekleyerek benzer bir tat elde edersin. Kahvaltıda ekmeğe, akşamları lavaşla meze olarak servis et.

      '
  faq:
  - q: Acuka nasıl yapılır?
    a: 'Biber ve domates salçası, ceviz, galeta unu, zeytinyağı, sarımsak, pul biber, kimyon, nar ekşisi ve tuzu bir kapta iyice karıştır. Buzdolabında 30 dakika dinlendir.

      '
  - q: Acuka buzdolabında kaç gün dayanır?
    a: 'Kapalı bir kavanozda buzdolabında bir hafta dayanır.

      '
  - q: Acukada galeta unu yerine ne kullanılır?
    a: 'Rendelenmiş bayat ekmek içi ya da yulaf ezmesi kullanabilirsin.

      '
  - q: Acuka pişirilir mi?
    a: 'Hayır. Bu tarifte tüm malzemeler çiğ olarak karıştırılıyor; yalnızca 30 dakika buzdolabında dinlendiriliyor.

      '
altin-bilezik-tatlisi:
  aramaBasligi: 'Altın bilezik tatlısı tarifi: Halka tulumba, şerbetli'
  editorNote: 'Şerbeti ilk adıma koyduk, çünkü tatlı sıcakken soğuk şerbete girmeli ve şerbetin soğumaya vakti olmalı. Halkaları yağlı kağıt parçalarına sıkıp kağıtla birlikte yağa bırakma yöntemini seçtik; hamur böylece şeklini bozmadan yağa giriyor.

    '
  intro: 'Altın bilezik tatlısı, tulumba hamurunun halka şeklinde sıkılıp kızartıldığı ve şerbete bırakıldığı bir hamur tatlısı. Adını bileziği andıran şeklinden ve kızarınca aldığı altın renkten alır. Dışı çıtır, içi yumuşak bir dokusu vardır.


    Bu tarifte önce şeker ve sudan bir şerbet kaynatılıp soğumaya bırakılıyor. Hamur için süt ve tereyağı kaynatılıyor, un bir kerede eklenip hamur tencereden ayrılana kadar karıştırılıyor, ılıyınca yumurtalar tek tek yediriliyor. Hamur yıldız uçlu sıkma torbasıyla yağlı kağıt parçalarına 6-7 cm çapında halkalar halinde sıkılıyor, orta ısıdaki yağda kızartılıyor ve soğuk şerbette 5 dakika bekletiliyor.


    Hazırlık 30, pişirme 25 dakika; toplam 55 dakikada 6 kişilik bir tabak çıkıyor.

    '
  notes:
  - t: Hamurun kıvamı
    d: 'Bu hamur tulumba hamuruyla aynı mantıkla yapılır: un, kaynayan süt ve tereyağına bir kerede eklenip pişirilir. Hamur tencereden ayrılıp top haline gelene kadar yaklaşık 2 dakika karıştırmak, unun pişmesini sağlar. Yumurtaları hamur ılıdıktan sonra ve tek tek ekle; sıcak hamura eklersen yumurta pişer, hepsini bir kerede eklersen hamur toparlanmaz. Doğru kıvam, sıkma torbasından zor ama akmadan çıkan bir hamurdur. Vanilini yumurtalardan sonra ekleyip karıştırman yeterli.

      '
  - t: Yağın ısısı
    d: 'Altın bilezikte en sık yapılan hata yağı çok kızdırmaktır. Kızgın yağda dış yüzey hızla kararır, ama içi pişmeden kalır ve tatlı şerbeti çekmez. Yağı orta ısıda tut; halkalar yağa girdiğinde hafifçe fokurdamalı, hemen kararmamalı. Halkaları yağlı kağıtla birlikte yağa bırak, kağıt ayrıldığında maşayla çıkar. Her yüzü altın rengi olana kadar yavaşça kızart. Tavayı kalabalık etme ki yağın ısısı düşmesin. Kızaran halkaları kısa bir süre kevgirde süzdürüp sonra şerbete al.

      '
  - t: Şerbet ve servis
    d: 'Sıcak tatlı, soğuk şerbet kuralı çıtırlığı korur. Şerbeti en başta kaynatmamızın nedeni, tatlılar kızarana kadar tamamen soğumasını sağlamak. Kızaran halkaları sıcakken soğuk şerbete at, 5 dakika bekletip çıkar. Daha uzun bekletirsen fazla şerbet çekip yumuşar. Limon suyu şerbetin şekerlenmesini önler. Üzerine toz antep fıstığı serperek servis et; fıstık yerine ceviz ya da fındık da kullanabilirsin. Tatlıyı oda sıcaklığında, üstü kapalı bekletmek en iyisi.

      '
  faq:
  - q: Altın bilezik tatlısı neden içi çiğ kalır?
    a: 'Yağ çok kızgın olduğunda dış yüzey kararırken içi pişmeden kalır. Yağı orta ısıda tut ve her yüzü yavaşça altın rengi olana kadar kızart.

      '
  - q: Altın bilezik şerbeti sıcak mı soğuk mu olmalı?
    a: 'Şerbet soğuk, tatlı sıcak olmalı. Sıcak halkaları soğuk şerbete atıp 5 dakika bekletmek çıtırlığı korur.

      '
  - q: Altın bilezik hamuru tulumba hamuruyla aynı mı?
    a: 'Evet, aynı mantıkla yapılır. Fark şeklinde: hamur yıldız uçlu torbayla 6-7 cm çapında halkalar halinde sıkılır.

      '
  - q: Altın bilezik tatlısında antep fıstığı yerine ne kullanılır?
    a: 'Ceviz ya da fındık kullanabilirsin.

      '
arabasi-corbasi:
  aramaBasligi: 'Arabaşı çorbası tarifi: Acılı tavuk çorbası ve soğuk hamur'
  editorNote: 'Hamuru ayrı bir adım olarak en başa koyduk, çünkü arabaşının hamuru çorbadan önce pişip buzdolabında sertleşmeli. Vaktin varsa hamuru bir gece önceden hazırlamanı öneriyoruz; iyice soğuyan hamur daha temiz kesiliyor.

    '
  intro: 'Arabaşı, acılı ve ekşimsi bir tavuk çorbasının yanında soğuk, kesilmiş hamur parçalarıyla yenen bir kış yemeği. İç Anadolu''da, özellikle Konya ve Kayseri çevresinde bilinir ve geleneksel olarak kalabalık kış sofralarında hazırlanır. Hamur parçası kaşıkla alınıp sıcak çorbaya batırılarak yenir.


    Bu tarifte un ve su çırpılıp sürekli karıştırılarak koyu bir muhallebi kıvamına kadar pişiriliyor, ıslatılmış bir tepsiye dökülüp buzdolabında sertleştiriliyor. Tavuk butlar tuzlu suda haşlanıp didikleniyor. Tereyağında un kavrulup salçalar ekleniyor, tavuk suyuyla açılıyor; tavuk, pul biber ve limonla 10 dakika pişiyor.


    Hazırlık 20, pişirme 60 dakika; toplam 80 dakikada 6 kişilik bir sofra hazır. Hamurun soğuma süresini ayrıca planla.

    '
  notes:
  - t: Hamurun kıvamı ve soğutma
    d: 'Arabaşı hamuru, un ve suyun birlikte pişirilmesiyle oluşan koyu bir muhallebiye benzer. Unu suyla soğukken çırpıp tencereye almak topaklanmayı önler; pişerken sürekli karıştırmak da dibin tutmasını engeller. Hamur koyulaşıp kaşıktan zor düşer hale geldiğinde ıslatılmış bir tepsiye dök. Tepsiyi ıslatmak, hamurun soğuyunca kolayca ayrılmasını sağlar. Hamur buzdolabında iyice sertleşmeli; bir gece önceden yapılırsa daha düzgün kesilir. Hamuru keserken bıçağı ıslatmak da işini kolaylaştırır.

      '
  - t: Meyane ve çorbanın tadı
    d: 'Tereyağında unu kavurmak çorbaya hem kıvam hem de hafif kavrulmuş bir tat verir. Unu kokusu çıkana kadar kavur, ardından salçaları ekleyip kısa bir süre çevir. Tavuk suyunu eklerken çırparak dökmek topaklanmayı önler. Çorba acılı ve ekşimsi olmalı; pul biber ve limon suyunu son 10 dakikada ekledikten sonra tadına bakıp ayarla. Tavuk but haşlama sırasında suya tat verir; göğüs kullanırsan pişirme süresini kısalt ki kurumasın.

      '
  - t: Servis ve yeme biçimi
    d: 'Soğumuş hamuru küp şeklinde kes ve ayrı bir tabakta servis et. Arabaşında hamur çorbanın içine konmaz; herkes kaşığıyla bir hamur parçası alıp sıcak çorbaya batırarak yer. Sıcak çorba ile soğuk hamur arasındaki zıtlık bu yemeğin özelliğidir. Hamur çorbaya katılırsa erir ve çorba bulanıklaşır. Artan çorbayı ve hamuru ayrı kaplarda buzdolabında sakla; çorbayı ısıtıp hamuru soğuk olarak kullanmaya devam edebilirsin. Bu yeme biçimi, kalabalık sofrada sohbetli bir kış akşamının parçasıdır.

      '
  faq:
  - q: Arabaşı hamuru nasıl yapılır?
    a: '1,5 su bardağı un ve 5 su bardağı su tuzla çırpılıp sürekli karıştırılarak koyu muhallebi kıvamına kadar pişirilir. Islatılmış tepsiye dökülüp buzdolabında sertleşmeye bırakılır.

      '
  - q: Arabaşı nasıl yenir?
    a: 'Soğuk hamur küp kesilir; kaşıkla bir parça alınıp sıcak çorbaya batırılarak yenir. Hamur çorbanın içine konmaz.

      '
  - q: Arabaşı hamuru önceden yapılır mı?
    a: 'Evet. Bir gece önceden hazırlanırsa iyice soğuyup sertleşir ve daha düzgün kesilir.

      '
  - q: Arabaşı çorbası glutensiz yapılır mı?
    a: 'Çorbanın meyanesinde un yerine aynı ölçü pirinç unu ya da mısır nişastası kullanabilirsin. Hamur kısmı için tarif buğday unuyla yazıldı.

      '
arnavut-cigeri:
  aramaBasligi: 'Arnavut ciğeri tarifi: Çıtır küp ciğer, sumaklı soğanla'
  editorNote: 'Tuzu ciğer kızardıktan sonra serpmeyi özellikle yazdık, çünkü önceden tuzlanan ciğer sertleşiyor. Kızartmayı tek kat ve 2-3 dakikayla sınırladık; içinin hafif pembe kalması ciğerin yumuşaklığı için gerekli.

    '
  intro: 'Arnavut ciğeri, küçük küpler halinde doğranan ciğerin una bulanıp kızgın yağda kısa sürede kızartıldığı ve sumaklı soğanla servis edildiği bir ara sıcak. Meyhanelerin ve esnaf lokantalarının bilinen tabaklarından biri; dakikalar içinde pişer ve sıcak yenmelidir.


    Bu tarifte kuzu ya da dana ciğerinin zarı soyulup küçük küpler halinde doğranıyor ve süzgeçte kanı akıtılıyor. Un toz kırmızı biberle karıştırılıyor, ciğerler bu karışıma bulanıp fazlası silkeleniyor. Kızgın yağda tek kat olacak şekilde 2-3 dakika kızartılıyor ve tuz kızardıktan sonra serpiliyor. Yanında yarım ay doğranmış kırmızı soğan sumak ve maydanozla ovuluyor.


    Hazırlık 15, pişirme 10 dakika; toplam 25 dakikada 4 kişilik bir tabak hazır.

    '
  notes:
  - t: Ciğeri hazırlamak
    d: 'Ciğerin dışındaki ince zar pişince büzülür ve lokmaları sertleştirir; bu yüzden doğramadan önce soy. Zarı bir köşesinden kaldırıp parmaklarınla çekmek genellikle yeterlidir. Ciğeri küçük ve eşit küpler halinde doğra ki hepsi aynı sürede pişsin. Doğradıktan sonra süzgeçte bekletip kanını akıtmak, kızartırken yağın sıçramasını ve kaplamanın ıslanmasını azaltır. Kokusundan rahatsız oluyorsan ciğeri sütte 30 dakika bekletebilirsin. Doğradığın ciğeri kâğıt havluyla hafifçe kurulamak unun eşit tutunmasını sağlar.

      '
  - t: Kısa ve tek kat kızartma
    d: 'Ciğer çok çabuk pişen bir sakatattır ve fazla pişince kuruyup sertleşir. Una bulanmış küpleri kızgın yağa tek kat olacak şekilde at ve 2-3 dakika kızart; içi hafif pembe kalmalı. Tavayı kalabalık edersen yağın ısısı düşer, ciğer kızarmak yerine su salar ve kaplaması yumuşar. Gerekirse iki partide kızart. Unun fazlasını silkelemek de önemli; fazla un yağda yanar ve hem yağı hem de ciğerin tadını bozar.

      '
  - t: Tuz, soğan ve servis
    d: 'Tuzu ciğer kızardıktan sonra serp. Önceden tuzlanan ciğer suyunu salar ve sertleşir. Sumaklı soğan bu tabağın vazgeçilmez eşlikçisidir: yarım ay doğradığın kırmızı soğanı sumak ve maydanozla ovmak soğanın keskinliğini yumuşatır. Sumak bulamazsan biraz limon kabuğu rendesi ve limon suyu kullanabilirsin. Arnavut ciğerini kızartır kızartmaz servis et; bekledikçe kaplaması yumuşar ve ciğer sertleşir. Yanına sıcak ekmek iyi gider; tabağı limonla da tamamlayabilirsin.

      '
  faq:
  - q: Arnavut ciğeri kaç dakika kızartılır?
    a: 'Kızgın yağda tek kat olacak şekilde 2-3 dakika kızartılır. İçi hafif pembe kalmalı.

      '
  - q: Ciğer neden sert olur?
    a: 'Fazla pişirildiği ya da önceden tuzlandığı için. Kızartmayı 2-3 dakikayla sınırla ve tuzu kızardıktan sonra serp.

      '
  - q: Ciğerin kokusu nasıl giderilir?
    a: 'Ciğeri doğradıktan sonra sütte 30 dakika bekletirsen kokusu azalır.

      '
  - q: Arnavut ciğeri kuzu mu dana mı olur?
    a: 'İkisi de olur. Tarif 500 g kuzu ya da dana ciğeriyle yazıldı ve 4 kişiliktir.

      '
