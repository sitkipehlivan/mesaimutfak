coban-salatasi:
  editorNote: |
    Çoban salatasında tuzu en sona saklamayı ve sebzeleri küçük doğramayı tarifin iki ana kuralı yaptık. Soğanı sumak ve tuzla ovmak da çiğ soğanın keskinliğini yumuşatıyor.
  intro: |
    Çoban salatası, domates, salatalık, biber ve soğanın küçük küpler halinde doğranıp zeytinyağı ve limonla tatlandırıldığı, Türk sofrasının en temel salatası. Izgaraların, kebapların ve pilavların yanında neredeyse her öğünde yer alır.

    Bu tarifte sebzeler küçük küp doğranıyor, kırmızı soğan sumak ve bir tutam tuzla ovularak keskinliği alınıyor. Tüm malzemeler maydanozla birleştiriliyor ve servis etmeden hemen önce zeytinyağı, limon ve tuzla tatlandırılıyor.

    4 kişilik tarif 10 dakikada hazır. Yaz domatesinin en iyi değerlendirildiği tabaklardan biri.
  notes:
    - t: Tuz neden en sona?
      d: |
        Tuz domates ve salatalığın suyunu çeker. Erken tuzlanan salata dakikalar içinde sulanır ve sebzeler yumuşar. Tuzu ve sosu servis etmeden hemen önce eklemek sebzelerin diri kalmasını sağlar.
    - t: Soğanı ovmak
      d: |
        Kırmızı soğanı sumak ve bir tutam tuzla ovmak, soğanın keskin ve acı tadını yumuşatır ve hafif ekşimsi bir lezzet katar. Ovulmuş soğan salataya daha dengeli bir tat verir.
    - t: Domates seçimi
      d: |
        Yazın olgun, sulu domatesler salatanın tadını belirler. Kış aylarında domates lezzetsiz olabilir; daha küçük, çeri domatesler ya da salkım domatesler daha iyi sonuç verir.
    - t: Saklama
      d: |
        Çoban salatası taze yenmelidir. Sosu eklenmemiş doğranmış sebzeler buzdolabında birkaç saat bekleyebilir; sos servis anında eklenmelidir.
  faq:
    - q: Çoban salatasına neler konur?
      a: Domates, salatalık, sivri biber, kırmızı soğan ve maydanoz. Sos olarak zeytinyağı, limon ve tuz kullanılır; isteğe göre sumak eklenir.
    - q: Çoban salatası neden sulanır?
      a: Tuz erken eklendiğinde sebzelerin suyu çıkar. Tuzu ve sosu servis etmeden hemen önce eklemek sulanmayı önler.
    - q: Çoban salatası ile gavurdağı salatası arasındaki fark nedir?
      a: Gavurdağı salatasında ceviz ve nar ekşisi bulunur, sebzeler daha ince kıyılır. Çoban salatası ise daha sade, limonlu ve zeytinyağlıdır.
    - q: Çoban salatası vegan mı?
      a: Evet, çoban salatası tamamen vegan ve glutensizdir.

piyaz:
  editorNote: |
    Piyazı iki usulde yazdık: sirkeli klasik ve tahinli Antalya usulü. Tahin isteğe bağlı olarak sosun içinde; böylece aynı tariften iki farklı piyaz çıkıyor.
  intro: |
    Piyaz, haşlanmış kuru fasulyenin soğan, domates ve maydanozla birlikte sirkeli ya da limonlu bir sosla tatlandırıldığı, ızgara köftenin klasik eşlikçisi. Antalya'da ise tahinli sosuyla ayrı bir lezzet olarak bilinir.

    Bu tarifte haşlanmış fasulye süzülüp kurulanıyor, yarım ay doğranmış soğan sumak ve tuzla ovuluyor. Zeytinyağı, sirke ya da limonla hazırlanan sos, Antalya usulü için tahinle zenginleştiriliyor. Tüm malzemeler karıştırılıp isteğe göre haşlanmış yumurta dilimleriyle süsleniyor.

    4 kişilik tarif 15 dakikada hazır.
  notes:
    - t: Klasik ve Antalya usulü
      d: |
        Klasik piyaz sirke ya da limon, zeytinyağı ve sumakla hazırlanır; hafif ve ferahtır. Antalya usulü piyazda sosa tahin eklenir ve biraz suyla açılır; sos daha kremamsı ve yoğun olur. Antalya'da piyaz genellikle köftenin yanında değil, başlı başına bir yemek olarak da servis edilir.
    - t: Fasulye seçimi
      d: |
        Kuru fasulyeyi bir gece ıslatıp kendin haşlamak en iyi dokuyu verir; taneler diri ama yumuşak olmalı. Konserve fasulye kullanılacaksa iyice yıkanmalı ve süzülmelidir. Fazla haşlanan fasulye salatada dağılır.
    - t: Sosu fasulye ılıkken eklemek
      d: |
        Kendin haşladığın fasulyeyi ılıkken sosla karıştırmak, fasulyenin sosu daha iyi çekmesini sağlar. Soğuk fasulye sosu yüzeyde tutar.
    - t: Saklama
      d: |
        Buzdolabında kapalı kapta 2 gün dayanır. Domates ve maydanoz zamanla su salar; uzun süre saklanacaksa servis öncesi eklenmeli.
  faq:
    - q: Piyaz nasıl yapılır?
      a: Haşlanmış kuru fasulye, soğan, domates ve maydanoz; zeytinyağı, sirke ya da limon ve sumakla hazırlanan bir sosla karıştırılır.
    - q: Antalya usulü piyaz nasıl yapılır?
      a: Sosa tahin eklenir ve biraz suyla açılarak kremamsı bir kıvam elde edilir. Haşlanmış yumurta da genellikle eklenir.
    - q: Piyaz vegan mı?
      a: Bu tarif yumurta olmadan vegan ve glutensizdir. Yumurta isteğe bağlıdır.
    - q: Piyaz hangi yemeğin yanında yenir?
      a: En klasik eşlikçisi ızgara köfte. Kebapların ve et yemeklerinin yanında da sıkça servis edilir.

hunkar-begendi:
  editorNote: |
    Hünkâr beğendinin iki ayrı parçasını, yani kısık ateşte lokum gibi pişen eti ve közlenmiş patlıcanlı beğendiyi, birbirini bekletmeden aynı anda hazırlanacak şekilde sıraladık. Patlıcanın kararmaması için limonlu su notu da bu yüzden var.
  intro: |
    Hünkâr beğendi, Osmanlı saray mutfağından günümüze gelen en ünlü yemeklerden biri. Köz patlıcan, beşamel ve kaşarla hazırlanan "beğendi"nin üzerine domatesli et yahnisi konularak servis edilir. Adının, 1869'da İstanbul'u ziyaret eden Fransız İmparatoriçesi Eugénie'nin yemeği çok beğenmesinden geldiği anlatılır.

    Bu tarifte kuşbaşı et tereyağında mühürlenip soğan, salça, domates ve biberle birlikte kısık ateşte uzun süre pişiriliyor. Bu sırada patlıcanlar közlenip ince kıyılıyor ve tereyağı, un, süt, kaşar ve muskatla hazırlanan beğendiye karıştırılıyor.

    4 kişilik tarif yaklaşık 2 saat sürüyor; düdüklü tencerede et 30 dakikada pişiyor.
  notes:
    - t: Patlıcanı közlemek
      d: |
        Beğendinin tadı patlıcanın közlenmesinden gelir. Patlıcanları doğrudan ocak alevinde, mangalda ya da fırının ızgarasında kabukları tamamen kararana ve içleri yumuşayana kadar közlemek gerekir. Közlenen patlıcan hafif dumanlı bir aroma kazanır.
    - t: Kararmasını önlemek
      d: |
        Közlenip soyulan patlıcanlar havayla temas edince kararır. Limonlu suda birkaç dakika bekletip süzmek patlıcanın açık renkte kalmasını sağlar ve beğendiye daha temiz bir görünüm verir.
    - t: Beğendinin kıvamı
      d: |
        Tereyağında un kokusu çıkana kadar kavrulmalı, süt azar azar eklenerek topaksız bir beşamel elde edilmeli. Patlıcan ve kaşar eklendikten sonra kıvam yumuşak püre gibi olmalı; çok koyu beğendi servis edildiğinde sertleşir.
    - t: Saklama
      d: |
        Et ve beğendi ayrı kaplarda buzdolabında 3 gün dayanır. Beğendi ısıtırken bir miktar süt ekleyerek kıvamı açılabilir.
  faq:
    - q: Hünkâr beğendi nedir?
      a: Közlenmiş patlıcan, beşamel ve kaşarla yapılan beğendinin üzerine domatesli et yahnisi konularak servis edilen bir Osmanlı saray yemeğidir.
    - q: Hünkâr beğendi için hangi et kullanılır?
      a: Dana ya da kuzu kuşbaşı. Kuzu daha geleneksel ve aromalıdır; dana ise daha yaygın olarak tercih edilir.
    - q: Beğendi neden topaklanır?
      a: Süt bir kerede eklendiğinde un topaklanır. Sütü azar azar ekleyip sürekli çırpmak pürüzsüz bir beğendi sağlar.
    - q: Hünkâr beğendi önceden hazırlanır mı?
      a: Et bir gün önceden pişirilebilir. Beğendi ise servis gününde hazırlanırsa daha iyi olur.

izmir-kofte:
  editorNote: |
    İzmir köfteyi patates ve köftenin önceden pişirilip fırında sosla birleştiği şekilde yazdık; böylece patatesler hamur kalmıyor, köfteler de dağılmıyor. Köfte harcını buzdolabında dinlendirme önerisi de şekil vermeyi kolaylaştırmak için.
  intro: |
    İzmir köfte, parmak şeklinde köftelerin patates, domates ve biberle birlikte salçalı sosta fırında pişirildiği, Ege mutfağının en sevilen ev yemeklerinden biri.

    Bu tarifte köfte harcı kıyma, rendelenmiş soğan, bayat ekmek içi, yumurta ve baharatlarla 5 dakika yoğruluyor. Patatesler elma dilimi kesilip hafifçe kızartılıyor ya da fırında ön pişiriliyor. Köfteler tavada mühürlendikten sonra tepside patates, domates ve biberle diziliyor, salçalı sos dökülerek fırında pişiriliyor.

    4 kişilik tarif yaklaşık 65 dakikada hazır.
  notes:
    - t: Patatesi ön pişirmek
      d: |
        Patatesler doğrudan fırına konursa köfteler pişip sos azalana kadar tam pişmeyebilir. Patatesleri önceden hafifçe kızartmak ya da fırında 15 dakika ön pişirmek, hepsinin aynı anda hazır olmasını sağlar.
    - t: Köfte harcı
      d: |
        Bayat ekmek içi ve yumurta, köftenin sosta pişerken dağılmamasını sağlar. Harcı en az 5 dakika yoğurmak ve yarım saat buzdolabında bekletmek köftelerin şeklini korumasını kolaylaştırır.
    - t: Köfteleri mühürlemek
      d: |
        Köfteleri tavada her yüzü renk alana kadar kısa süre çevirmek, sosta pişerken dağılmalarını önler ve köftelere kızarmış bir tat katar. Köfteler bu aşamada tam pişmemeli; fırında pişmeye devam eder.
    - t: Saklama
      d: |
        Buzdolabında 3 gün dayanır. Fırında üzeri folyoyla kapalı olarak ısıtılabilir. Dondurucuda 2 ay saklanabilir, ancak patates çözüldüğünde dokusu biraz değişir.
  faq:
    - q: İzmir köfte fırında kaç dakika pişer?
      a: Bu tarifte 200°C fırında sos azalana kadar, yaklaşık 25-30 dakika pişiyor.
    - q: İzmir köfteye patates konur mu?
      a: Evet, patates İzmir köftenin temel malzemelerinden biri. Elma dilimi kesilip önceden hafifçe kızartılır ya da fırında ön pişirilir.
    - q: İzmir köfte neden dağılır?
      a: Genelde harç yeterince yoğrulmadığı ya da köfteler önceden mühürlenmediği için. Harcı iyice yoğurmak ve köfteleri tavada kısa süre çevirmek dağılmayı önler.
    - q: İzmir köfte yanına ne yapılır?
      a: Pirinç pilavı ve cacık klasik eşlikçiler.

zeytinyagli-taze-fasulye:
  editorNote: |
    Zeytinyağlı taze fasulyede "az su, karıştırma, tencerede soğut" kuralını tarifin özü yaptık. Şekerin fasulyenin rengini korumasını da notlara ekledik; zeytinyağlılarda sık kullanılan küçük bir mutfak bilgisi.
  intro: |
    Zeytinyağlı taze fasulye, Türk mutfağının en bilinen zeytinyağlılarından biri. Yaz aylarında taze fasulyenin en lezzetli olduğu dönemde, soğan ve domatesle zeytinyağında kendi suyunda pişirilir ve soğuk servis edilir.

    Bu tarifte fasulyelerin uçları ve kenar lifleri ayıklanıp kırılıyor. Tencerenin dibine soğan ve zeytinyağı konup birkaç dakika çevriliyor; fasulye, domates, şeker ve tuz ekleniyor. Az miktarda sıcak su eklenip karıştırmadan, kapağı kapalı kısık ateşte pişiriliyor.

    4 kişilik tarif 60 dakikada hazır. Tencerede soğutulup soğuk servis ediliyor.
  notes:
    - t: Fasulye seçimi
      d: |
        Taze, ince ve kırıldığında çıtırdayan fasulyeler en iyisi. Ayşe kadın ve çalı fasulyesi yaygın tercihlerdir. Kenar lifleri olan fasulyelerde lifleri soymak gerekir; aksi halde yemekte sert iplikler kalır.
    - t: Neden az su?
      d: |
        Taze fasulye pişerken kendi suyunu salar. Fazla su eklemek fasulyeyi haşlar ve zeytinyağlının yoğun tadını sulandırır. Yarım su bardağı su yeterlidir.
    - t: Karıştırmamak
      d: |
        Fasulyeler pişerken karıştırılırsa kırılır ve dağılır. Tencereyi arada sallamak yeterli. Pişince tencerede soğumaya bırakmak, fasulyelerin kalan suyu ve zeytinyağını çekmesini sağlar.
    - t: Saklama
      d: |
        Buzdolabında kapalı kapta 4 gün dayanır; ertesi gün daha lezzetli olur. Servis etmeden önce oda sıcaklığına getirmek zeytinyağının donukluğunu giderir.
  faq:
    - q: Zeytinyağlı taze fasulyeye şeker konur mu?
      a: Evet, az miktarda şeker fasulyenin yeşil rengini korur ve domatesin ekşiliğini dengeler.
    - q: Taze fasulye kaç dakika pişer?
      a: Kısık ateşte yaklaşık 40-45 dakika. Fasulyeler yumuşayıp rengi koyulaştığında hazırdır.
    - q: Zeytinyağlı taze fasulye sıcak mı soğuk mu yenir?
      a: Zeytinyağlı olduğu için soğuk ya da oda sıcaklığında yenir.
    - q: Zeytinyağlı taze fasulye vegan mı?
      a: Evet, tamamen vegan ve glutensizdir.

sehriyeli-bulgur-pilavi:
  editorNote: |
    Bulgur pilavında su oranını 1'e 2 olarak yazdık ve demlenmeyi ayrı adım yaptık; pilavlık bulgurun tane tane kalması bu iki şeye bağlı. Biber salçası pilava hem renk hem hafif bir tat katıyor.
  intro: |
    Şehriyeli bulgur pilavı, pilavlık bulgurun tereyağında kavrulan arpa şehriye, soğan ve biber salçasıyla pişirildiği, Anadolu mutfağının en temel pilavlarından biri. Kuru fasulye, tavuk ve sebze yemeklerinin yanında pirinç pilavına sağlıklı bir alternatif.

    Bu tarifte şehriye tereyağı ve sıvı yağda kızarana kadar kavruluyor, soğan ve salça ekleniyor. Bulgur eklenip kısa süre çevriliyor, sıcak su ve tuz konup suyunu çekene kadar pişiriliyor ve havlu altında demlendiriliyor.

    4 kişilik tarif 30 dakikada hazır.
  notes:
    - t: Su oranı
      d: |
        Pilavlık bulgur için 1 ölçü bulgura 2 ölçü sıcak su doğru orandır. Daha az su bulguru çiğ bırakır, daha fazla su ise lapa yapar. Su mutlaka sıcak olmalı.
    - t: Bulgur çeşidi
      d: |
        Bu tarifte pilavlık (iri) bulgur kullanılıyor. Köftelik ince bulgur pilav için uygun değildir; kısa sürede lapa olur.
    - t: Demlenme
      d: |
        Suyunu çeken pilavı ocaktan alıp kapağın altına havlu koyarak 10 dakika demlendirmek, bulgur tanelerinin tam pişmesini ve tane tane kalmasını sağlar.
    - t: Saklama
      d: |
        Buzdolabında 3 gün dayanır. Isıtırken birkaç kaşık su serpip kapağı kapalı ısıtmak kurumasını önler.
  faq:
    - q: Bulgur pilavı neden lapa olur?
      a: Fazla su eklendiğinde ya da pişerken karıştırıldığında. 1 ölçü bulgura 2 ölçü su kullanmak ve pişerken karıştırmamak gerekir.
    - q: Bulgur pilavı için hangi bulgur kullanılır?
      a: Pilavlık (iri) bulgur. İnce bulgur köfte ve kısır için kullanılır.
    - q: Bulgur pilavı glutensiz mi?
      a: Hayır. Bulgur buğdaydan yapıldığı için gluten içerir.
    - q: Bulgur pilavının yanına ne yakışır?
      a: Yoğurt, cacık, közlenmiş biber, kuru fasulye ve sebze yemekleri.

ev-usulu-izgara-kofte:
  editorNote: |
    Izgara köftede kıymanın yağ oranını (yüzde 15-20) özellikle belirttik; kuru köftenin en yaygın sebebi yağsız kıyma. Rendelenmiş soğanın suyunu sıkmak da köftelerin ızgarada dağılmamasını sağlıyor.
  intro: |
    Ev usulü ızgara köfte, kıymanın rendelenmiş soğan, sarımsak, galeta unu ve baharatlarla yoğrulup ızgarada ya da döküm tavada pişirildiği, Türk mutfağının en temel et yemeklerinden biri. Yanında sumaklı soğan, piyaz ve közlenmiş domatesle servis edilir.

    Bu tarifte tüm malzemeler en az 5 dakika yoğruluyor ve harç buzdolabında dinlendiriliyor. Ceviz büyüklüğünde parçalar yassılaştırılıp iyice ısıtılmış döküm tavada ya da ızgarada her yüzü 3-4 dakika pişiriliyor.

    4 kişilik tarif 25 dakikada hazır.
  notes:
    - t: Kıymanın yağ oranı
      d: |
        Köftenin sulu olması için kıymanın yüzde 15-20 yağ içermesi gerekir. Yağsız kıyma köfteyi kuru ve sert yapar. Kasaptan orta yağlı kıyma istemek iyi bir ölçü.
    - t: Soğanın suyunu sıkmak
      d: |
        Rendelenmiş soğanın suyu sıkılmazsa harç sulanır ve köfteler ızgarada dağılır. Soğanı rendeleyip bir tülbent ya da ince süzgeçte sıkmak gerekir; aroma posada kalır.
    - t: Yoğurmak ve dinlendirmek
      d: |
        Harcı en az 5 dakika yoğurmak kıymanın proteinlerinin bağlanmasını sağlar; köfteler şeklini korur. Buzdolabında 30 dakika dinlendirmek şekil vermeyi kolaylaştırır.
    - t: Pişirirken bastırmamak
      d: |
        Köfteleri pişirirken spatulayla bastırmak suyunun akmasına ve köftenin kurumasına neden olur. Her yüzü bir kez çevirmek yeterli.
  faq:
    - q: Izgara köfte neden dağılır?
      a: Harç yeterince yoğrulmadığı ya da soğanın suyu sıkılmadığı için. 5 dakika yoğurmak ve harcı dinlendirmek dağılmayı önler.
    - q: Köfteye galeta unu yerine ne konur?
      a: Bayat ekmek içi ya da yulaf ezmesi kullanılabilir.
    - q: Izgara köfte kaç dakika pişer?
      a: İyice ısıtılmış ızgarada ya da döküm tavada her yüzü 3-4 dakika.
    - q: Köfte harcı dondurulur mu?
      a: Evet. Şekil verilmiş köfteler aralarına yağlı kâğıt konarak dondurulabilir; 2 ay saklanabilir.

etsiz-cig-kofte:
  editorNote: |
    Etsiz çiğ köftede yoğurma süresinin kısa tutulmasının bulguru çiğ bıraktığını tarifin en önemli uyarısı yaptık. İsot ve biber salçası tadı belirlediği için miktarları damak tadına göre artırılabilir.
  intro: |
    Etsiz çiğ köfte, ince bulgurun isot, salça ve baharatlarla uzun süre yoğrularak hazırlandığı, Güneydoğu Anadolu kökenli ve bugün Türkiye'nin her yerinde sevilen bir atıştırmalık. Marul yaprağı ve limonla servis edilir.

    Bu tarifte çiğ köftelik ince bulgur sıcak suyla ıslatılıyor, salçalar, isot, kimyon, tuz, rendelenmiş soğan ve sarımsakla bulgur kızarıp yumuşayana kadar elle yoğruluyor. Zeytinyağı ve nar ekşisi eklenip yeşilliklerle tamamlanıyor.

    6 kişilik tarif yaklaşık 40 dakikada hazır.
  notes:
    - t: Yoğurmanın önemi
      d: |
        Çiğ köftede bulgur pişirilmez; yoğurma sırasında salça ve isotun nemiyle ve elin sıcaklığıyla yumuşar. Yoğurma süresi kısa tutulursa bulgur çiğ ve sert kalır. En az 20-25 dakika yoğurmak gerekir; hamur yumuşak ve yapışkan bir kıvama gelmelidir.
    - t: İsot
      d: |
        İsot, Urfa'ya özgü, kurutulmuş ve hafif fermente edilmiş kırmızı biberdir. Çiğ köfteye koyu rengini ve dumanlı tadını verir. İsot bulunamazsa pul biber kullanılabilir, ancak tadı farklı olur.
    - t: Eldiven
      d: |
        İsot ve biber salçası ellerde yanma hissine yol açabilir. Yoğururken eldiven giymek önerilir.
    - t: Saklama
      d: |
        Buzdolabında kapalı kapta 3 gün dayanır. Yeşillikler eklenmeden saklanırsa daha uzun süre taze kalır.
  faq:
    - q: Etsiz çiğ köfte kaç dakika yoğrulur?
      a: En az 20-25 dakika. Bulgurun yumuşaması için yeterli süre yoğrulması gerekir.
    - q: Çiğ köfte için hangi bulgur kullanılır?
      a: Çiğ köftelik denilen çok ince bulgur. Pilavlık ya da köftelik iri bulgur uygun değildir.
    - q: Etsiz çiğ köfte vegan mı?
      a: Evet, tamamen vegan. Bulgur içerdiği için glutensiz değildir.
    - q: İsot yerine ne kullanılır?
      a: Pul biber ve bir tutam füme paprika karışımı isota en yakın tadı verir.

cilbir:
  editorNote: |
    Çılbırda yoğurdun oda sıcaklığında olmasını ve yumurtaların taze olmasını ayrıca belirttik; poşe yumurtanın düzgün olması tamamen yumurtanın tazeliğine bağlı. Sirke eklemek de yumurta beyazının dağılmadan pişmesine yardım ediyor.
  intro: |
    Çılbır, poşe yumurtanın sarımsaklı yoğurdun üzerine konulup pul biberli tereyağı gezdirilerek servis edildiği, Osmanlı saray mutfağına kadar uzanan bir kahvaltılık. Basit malzemelerle hazırlanan ama sunumuyla etkileyen bir tabak.

    Bu tarifte süzme yoğurt sarımsak ve tuzla çırpılıp tabaklara yayılıyor. Sirkeli, hafif kaynayan suda yumurtalar tek tek poşe ediliyor. Köpürmüş tereyağına pul biber eklenip yumurtaların üzerine gezdiriliyor ve dereotu serpiliyor.

    2 kişilik tarif 15 dakikada hazır.
  notes:
    - t: Poşe yumurta
      d: |
        Poşe yumurta için su kaynamamalı, hafifçe fokurdamalı. Suya biraz sirke eklemek yumurta beyazının hızla pıhtılaşmasını sağlar. Yumurtayı önce bir kaseye kırıp suyu kaşıkla girdap gibi çevirerek ortasına bırakmak, beyazın sarının etrafına sarılmasını sağlar.

        Yumurta ne kadar tazeyse beyazı o kadar yoğun olur ve poşe o kadar düzgün olur.
    - t: Yoğurdun sıcaklığı
      d: |
        Yoğurt buzdolabından yeni çıkmışsa sıcak yumurtayla uyumsuz olur. Oda sıcaklığında ya da hafif ılık yoğurt daha iyi sonuç verir.
    - t: Pul biberli tereyağı
      d: |
        Tereyağı köpürünce ocaktan alınıp pul biber eklenmeli; pul biber sıcak tereyağında renk verir ama yanmaz. Ocak üzerinde pul biber eklenirse yanar ve acılaşır.
    - t: Servis
      d: |
        Çılbır hemen servis edilmelidir; yanında taze ekmek ya da kızarmış köy ekmeği olmazsa olmaz.
  faq:
    - q: Çılbır nasıl yapılır?
      a: Sarımsaklı yoğurt tabağa yayılır, üzerine poşe yumurta konur ve pul biberli tereyağı gezdirilir.
    - q: Poşe yumurta nasıl yapılır?
      a: Sirkeli, hafif fokurdayan suda; yumurta önce bir kaseye kırılır ve suya bırakılır. Yaklaşık 3-4 dakikada beyazı pişer.
    - q: Çılbır glutensiz mi?
      a: Evet, çılbır glutensizdir. Yanında servis edilen ekmek gluten içerir.
    - q: Çılbıra hangi yoğurt kullanılır?
      a: Süzme yoğurt daha koyu ve kremamsı bir taban sağlar. Normal yoğurt da kullanılabilir.

kabak-tatlisi:
  editorNote: |
    Kabak tatlısını su eklemeden, kabağın kendi suyunda pişecek şekilde yazdık; bu yüzden şekerle bir gece bekletme adımı tarifin en önemli kısmı. Tahin ve cevizle vegan olarak bıraktık, kaymaklı versiyonu püf noktasında.
  intro: |
    Kabak tatlısı, bal kabağının şekerle kendi suyunda pişirildiği, tahin ve cevizle servis edilen, sonbahar ve kış aylarının en sevilen tatlılarından biri. Bal kabağının en lezzetli olduğu dönemde, ekim-aralık aylarında yapılır.

    Bu tarifte kabak soyulup çekirdekleri alınıyor, dilimlenip tencereye diziliyor ve üzerine şeker serpilerek en az 4 saat ya da bir gece bekletiliyor. Kabak suyunu saldıktan sonra su eklenmeden, kısık ateşte yumuşayıp şeffaflaşana kadar pişiriliyor.

    6 kişilik tarif 60 dakikada hazırlanıyor, ama şekerle bekleme süresi gerekiyor.
  notes:
    - t: Neden bekletiliyor?
      d: |
        Şekerle bekletilen bal kabağı ozmoz yoluyla kendi suyunu salar. Bu su, tatlının şerbetini oluşturur ve su eklemeye gerek kalmaz. Kabağın kendi suyunda pişmesi tatlıya daha yoğun bir tat verir.
    - t: Kabak seçimi
      d: |
        Bal kabağının olgun, turuncu renkli ve sulu olanları tercih edilmeli. Kabağın tazeliği salacağı su miktarını belirler; suyunu salmazsa yarım su bardağı su eklenebilir.
    - t: Pişirme
      d: |
        Kabak kısık ateşte, kapağı kapalı olarak pişmeli. Karıştırmak kabakların dağılmasına neden olur. Kabaklar şeffaflaşıp yumuşadığında ocaktan alınmalı; fazla pişen kabak dağılır.
    - t: Saklama
      d: |
        Buzdolabında kapalı kapta 5 gün dayanır. Soğuk servis edilir.
  faq:
    - q: Kabak tatlısına su konur mu?
      a: Bu tarifte su eklenmiyor; kabak şekerle bekletilerek kendi suyunu salıyor. Suyunu salmazsa yarım su bardağı su eklenebilir.
    - q: Kabak tatlısı kaç saat bekletilir?
      a: Şekerle en az 4 saat, tercihen bir gece bekletilmeli.
    - q: Kabak tatlısı vegan mı?
      a: Bu tarif tahin ve cevizle servis edildiği için vegan. Kaymakla servis edilirse vegan olmaz.
    - q: Kabak tatlısı üzerine ne konur?
      a: Tahin ve ceviz klasik. Kaymak, dövülmüş fındık ya da Antep fıstığı da kullanılabilir.
