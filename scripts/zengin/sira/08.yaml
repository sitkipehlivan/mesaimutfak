un-corbasi:
  aramaBasligi: 'Un çorbası tarifi: Tereyağlı ve salçalı, 20 dakikada'
  editorNote: 'Unu kavurma adımına süre ve koku tarifini birlikte yazdık; çorbanın bütün tadı unun çiğ kokusu gidip fındık gibi kokmaya başladığı o birkaç dakikada oluşuyor.

    '
  intro: 'Un çorbası, tereyağında kavrulan unun salça ve sıcak suyla açılmasıyla yapılan, Türk mutfağının en sade çorbalarından biri. Dolapta neredeyse hiçbir şey yokken bile tereyağı, un ve salçayla hazırlanabiliyor; kuru nane ve pul biberle tamamlanıyor.


    Bu tarifte üç kaşık tereyağında dört kaşık unu sürekli karıştırarak 5 dakika kavuruyoruz. Un hafif renk alıp fındık gibi kokmaya başladığında salça ekleniyor ve bir dakika çevriliyor. Sıcak su azar azar eklenip çırpıldığı için topak kalmıyor; ardından çorba kısık ateşte 10 dakika pişiyor.


    4 kişilik tarif 5 dakika hazırlık ve 15 dakika pişirmeyle toplam 20 dakikada hazır. Et suyu kullanırsan daha doyurucu, suyla yaparsan daha hafif bir çorba olur.

    '
  notes:
  - t: Unu kavurmak
    d: 'Unun çiğ tadı yalnızca kavrulunca gider. Tereyağı eridikten sonra unu ekleyip orta-kısık ateşte, tencerenin dibini kazıyarak sürekli karıştır. Un önce topaklanır, sonra gevşeyip kumlu bir dokuya geçer ve hafif renk alır. Fındık kokusu geldiğinde doğru noktadasın. Ateşi yüksek tutarsan un birkaç saniyede yanar ve çorbaya acı tat geçer; yanan unu kurtarmanın yolu yoktur, baştan başlamak gerekir. Tereyağını eritirken de ateşi yüksek tutma; yanmış tereyağı da çorbaya acı tat verir.

      '
  - t: Topaksız açmak
    d: 'Sıcak suyu tek seferde dökersen un yumak yumak toplanır. Önce yarım su bardağı kadar su ekleyip tel çırpıyla koyu bir macun haline getir, sonra kalan suyu azar azar ekleyerek çırpmaya devam et. Suyun sıcak olması önemli; soğuk su kavrulmuş unla karışınca topaklanma riski artar. Yine de topak kalırsa çorbayı bir süzgeçten geçirebilir ya da el blenderıyla birkaç saniye çekebilirsin. Su ekledikten sonra çorba kaynamaya başlayana kadar karıştırmaya devam et, çünkü un tam bu aşamada dibe çöker.

      '
  - t: Çeşitleme ve servis
    d: 'Et suyu yoksa sıcak suya bir tatlı kaşığı tereyağı ve bir tutam tuz ya da yarım bulyon ekleyebilirsin. Salça yerine 2-3 rendelenmiş domates kullanırsan pişirme süresini 5 dakika uzat. Kuru naneyi ve pul biberi çorbanın üstüne serpebilir ya da az tereyağında kızdırıp gezdirebilirsin. Servis sırasında biraz limon sıkmak ve yanına kıtır ekmek koymak çorbanın sadeliğini tamamlar. Çorba bekledikçe koyulaşır, ısıtırken biraz sıcak su ekleyebilirsin.

      '
  faq:
  - q: Un çorbası kaç dakikada pişer?
    a: 'Un 5 dakika kavrulur, su eklendikten sonra kısık ateşte 10 dakika pişer. Toplam süre hazırlıkla birlikte 20 dakikadır.

      '
  - q: Un çorbası nasıl topaksız olur?
    a: 'Sıcak suyu azar azar ekleyip her seferinde tel çırpıyla çırparsan topak kalmaz.

      '
  - q: Un çorbasında tereyağı yerine ne kullanılır?
    a: 'Tereyağının dörtte üçü kadar zeytinyağı kullanabilirsin. Tat biraz daha hafif olur.

      '
  - q: Un çorbası et suyuyla mı yapılır?
    a: 'İkisiyle de olur. Et suyu çorbayı daha doyurucu yapar, sıcak suyla da sade ve hafif bir çorba elde edersin.

      '
yaban-mersinli-muffin:
  aramaBasligi: 'Yaban mersinli muffin tarifi: 12 adet, şekerli kıtır üstlü'
  editorNote: 'Hamuru yalnızca karışana kadar çevirmeyi ve topakların kalabileceğini özellikle yazdık, çünkü muffinin yumuşak ve kabarık olması fazla karıştırmamaya bağlı.

    '
  intro: 'Yaban mersinli muffin, kahve dükkânlarından tanıdığın, kabarık tepeli ve içi meyve dolu küçük kekler. Hamuru mikser gerektirmiyor; kuru ve ıslak malzemeler ayrı kaplarda hazırlanıp spatula ile kısaca birleştiriliyor.


    Bu tarifte un, şeker, kabartma tozu ve tuzu bir kapta, yumurta, sıvı yağ, süt ve vanilini başka bir kapta karıştırıyoruz. Islak karışım kuruya eklenip yalnızca un kaybolana kadar çevriliyor, ardından yaban mersini katılıyor. Kalıplar dörtte üçüne kadar dolduruluyor ve üzerine serpilen şeker fırında kıtır bir kabuk oluşturuyor. Muffinler 190°C fırında 20-22 dakikada kabarıp kızarıyor.


    Tarif 12 muffin çıkarıyor; 15 dakika hazırlık ve 22 dakika pişirmeyle toplam 37 dakikada hazır. Airfryer''da 160°C''de 14-16 dakika da pişirebilirsin.

    '
  notes:
  - t: Fazla karıştırmamak
    d: 'Un sıvıyla karıştırıldıkça gluten gelişir. Kekte bu istenmeyen bir durum; fazla karıştırılan muffin hamuru sert, içi tünel gibi delikli olur ve tepesi düzgün kabarmaz. Islak malzemeleri kuruya döktükten sonra spatulayı kabın dibinden yukarı doğru birkaç kez çevir, kuru un görünmediği anda dur. Hamurda küçük topakların kalması normal, fırında kaybolurlar. Yaban mersinini katarken de aynı nazikliği koru. Kuru malzemeleri önceden iyice karıştırmak, kabartma tozunun hamura eşit dağılmasını sağlar.

      '
  - t: Dondurulmuş yaban mersini
    d: 'Dondurulmuş yaban mersini kullanacaksan çözdürme; çözülen meyve suyunu salar, hamuru mora boyar ve muffinin içini ıslak bırakır. Donmuş meyveleri bir kaşık una bulayıp hamura hemen kat. Un kaplaması meyvelerin kalıbın dibine çökmesini de azaltır. Donmuş meyve hamuru biraz soğuttuğu için pişirme süresinin üst sınırına, 22 dakikaya yakın bir süre gerekebilir. Kürdan testini mutlaka yap. Taze yaban mersinini de yıkadıktan sonra iyice kurula; ıslak meyve hamuru sulandırır.

      '
  - t: Alternatifler ve saklama
    d: 'Süt yerine yoğurt kullanırsan muffin biraz daha nemli ve hafif ekşimsi olur; kefir ya da ayran da olur. Glutensiz bir versiyon için hazır glutensiz un karışımını birebir kullanabilirsin. Vanilin yerine bir tatlı kaşığı vanilya özütü koyabilirsin. Muffinler oda sıcaklığında kapalı bir kapta birkaç gün yumuşak kalır. Tek tek sarıp dondurabilir, kahvaltıdan önce oda sıcaklığında çözdürebilirsin. Üzerine serpilen şekeri atlama; fırında eriyip sertleşerek muffinin kıtır tepesini oluşturur.

      '
  faq:
  - q: Muffin fırında kaç dakika pişer?
    a: '190°C fırında 20-22 dakika, kabarıp kızarana kadar pişer. Ortasına batırılan kürdan kuru çıkmalı.

      '
  - q: Muffin neden sert olur?
    a: 'En sık neden hamuru fazla karıştırmaktır. Islak ve kuru malzemeleri spatula ile yalnızca birleşene kadar çevirmek yeterli.

      '
  - q: Muffin airfryer'da yapılır mı?
    a: 'Evet. Silikon ya da kâğıt kaplarda 160°C''de 14-16 dakika pişir; kürdan kuru çıkmalı.

      '
  - q: Muffinde yaban mersini dibe çökmesin diye ne yapılır?
    a: 'Yaban mersinini hamura katmadan önce biraz una bula. Dondurulmuş meyveyi çözdürmeden kullan.

      '
yogurtlu-havuc:
  aramaBasligi: 'Yoğurtlu havuç tarator tarifi: Cevizli meze, 18 dakikada'
  editorNote: 'Havucu yoğurda katmadan önce soğutmayı ayrı bir uyarı olarak yazdık; sıcak havuç yoğurdu sulandırır ve mezenin kıvamını bozar.

    '
  intro: 'Yoğurtlu havuç tarator, rendelenmiş havucun zeytinyağında sotelenip sarımsaklı süzme yoğurtla karıştırıldığı, üzerine ceviz serpilen bir meze. Havucun doğal tatlılığı sarımsağın keskinliğiyle dengeleniyor; renkli görüntüsüyle meze tabaklarının sık görülen parçalarından.


    Bu tarifte dört havucu rendeleyip iki kaşık zeytinyağında 6-8 dakika, yumuşayana kadar çeviriyoruz. Sotelemek havucun şekerini öne çıkarıyor ve çiğ havucun sert dokusunu yumuşatıyor. Havuç soğuduktan sonra tuz ve sarımsakla çırpılan bir buçuk su bardağı süzme yoğurda ekleniyor, en son kırılmış ceviz serpiliyor.


    4 kişilik tarif 10 dakika hazırlık ve 8 dakika pişirmeyle toplam 18 dakikada hazır. Soğuk servis edilen, glutensiz bir meze.

    '
  notes:
  - t: Neden süzme yoğurt
    d: 'Normal yoğurt havuçla karışınca sulanır ve meze tabakta yayılır. Süzme yoğurt daha koyu olduğu için havucu taşır ve servis sırasında şeklini korur. Süzme yoğurdun yoksa normal yoğurdu tülbente koyup 2 saat süzerek kendin hazırlayabilirsin; labne de iyi bir alternatif. Yoğurdu sarımsak ve tuzla önce ayrı çırpmak sarımsağın her lokmaya eşit dağılmasını sağlar. Sarımsağı çok ince rendelemek ya da ezmek, yoğurtta iri parçalar kalmasını önler; bir diş, dört kişilik meze için yeterli bir keskinlik verir.

      '
  - t: Havucu pişirmek mi çiğ mi
    d: 'Tarifte havuç zeytinyağında sotelenerek tatlılığı artırılıyor ve dokusu yumuşatılıyor. Havucu çiğ kullanmak da mümkün; meze daha çıtır ve ferah olur, ancak tatlılık azalır. Sotelerken ateşi orta tut ve sık karıştır, havuç kızarmamalı, yalnızca yumuşamalı. Soteledikten sonra havucu tamamen soğut; sıcak havuç yoğurdu ılıtır, kıvamı incelir ve mezenin tadı sertleşir. Havucu ince rende tarafında rendelersen hem daha çabuk yumuşar hem de yoğurtla daha iyi bütünleşir. Kalın rende daha belirgin bir doku bırakır, tercih senin.

      '
  - t: Servis ve saklama
    d: 'Meze soğuk servis edilir. Cevizi en son, servis sırasında serp; yoğurtla uzun süre bekleyen ceviz yumuşar. Ceviz yerine fındık ya da badem kullanabilirsin. Bir tutam kimyon havuçla çok iyi anlaşır. Yoğurtlu havuç buzdolabında kapalı kapta saklanabilir, ancak bekledikçe sarımsağın tadı belirginleşir. Önceden hazırlayacaksan sarımsağı biraz az tutmak iyi bir fikir. Mezeyi servis tabağına alırken üzerine birkaç damla zeytinyağı gezdirmek hem parlaklık hem de havuçla uyumlu hafif bir meyvemsi tat ekler.

      '
  faq:
  - q: Havuç tarator nasıl yapılır?
    a: 'Rendelenmiş havuç zeytinyağında 6-8 dakika sotelenip soğutulur, sarımsak ve tuzla çırpılmış süzme yoğurtla karıştırılır ve üzerine ceviz serpilir.

      '
  - q: Yoğurtlu havuç için havuç pişirilir mi?
    a: 'Bu tarifte havuç zeytinyağında sotelenir. İstersen çiğ de kullanabilirsin; meze daha çıtır olur.

      '
  - q: Yoğurtlu havuç neden sulanır?
    a: 'Normal yoğurt kullanmak ya da havucu sıcakken yoğurda katmak meze sulanmasına yol açar. Süzme yoğurt kullan ve havucu tamamen soğut.

      '
  - q: Yoğurtlu havuçta süzme yoğurt yerine ne kullanılır?
    a: 'Labne kullanabilirsin ya da normal yoğurdu tülbentte 2 saat süzerek kendin süzme yoğurt hazırlayabilirsin.

      '
yogurtlu-kabak:
  aramaBasligi: 'Yoğurtlu kabak mezesi tarifi: Dereotlu, 18 dakikada'
  editorNote: 'Kabağın suyunu sıkmayı rendeleme adımının hemen içine koyduk; bu adım atlanırsa sotelenen kabak suyunu yoğurda bırakır ve meze tabakta sulanır.

    '
  intro: 'Yoğurtlu kabak mezesi, rendelenip sotelenen kabağın sarımsaklı süzme yoğurt ve dereotuyla karıştırıldığı hafif bir meze. Meze tabağında yeşil ve serin bir köşe oluşturuyor, yaz aylarında özellikle sık yapılıyor.


    Bu tarifte üç kabağı rendeleyip suyunu sıkıyoruz, ardından iki kaşık zeytinyağında 6-8 dakika suyunu çekene kadar soteliyoruz. Bu iki adım kabağın fazla suyunu atıp tadını yoğunlaştırıyor. Soğuyan kabak, sarımsak ve tuzla çırpılmış süzme yoğurda dereotuyla birlikte ekleniyor ve üzerine zeytinyağı gezdirilerek soğuk servis ediliyor.


    4 kişilik tarif 10 dakika hazırlık ve 8 dakika pişirmeyle toplam 18 dakikada hazır. Glutensiz, hafif ve önceden hazırlanabilen bir meze.

    '
  notes:
  - t: Suyunu sıkmak
    d: 'Kabak çok su içerir ve bu su yoğurtla birleşince mezeyi sulandırır. Rendelenmiş kabağı bir tülbente ya da temiz bir mutfak bezine alıp iyice sık; ne kadar çok su çıkarsan kıvam o kadar koyu olur. Sıkmadan önce bir tutam tuz serpip birkaç dakika beklemek daha fazla suyun çıkmasına yardım eder, bu durumda yoğurda eklediğin tuzu azalt. Sıkılan kabak sotede de daha hızlı kurur.

      '
  - t: Sotelemenin amacı
    d: 'Kabağı zeytinyağında 6-8 dakika sotelemek kalan suyunu buharlaştırır ve çiğ kabağın otsu tadını yumuşatır. Kabak kızarmamalı, rengini koruyarak suyunu çekmeli; bu yüzden ateşi orta tut ve sık karıştır. Sotelenen kabağı yoğurda katmadan önce mutlaka soğut. Sıcak kabak yoğurdu ılıtır ve sulanmasına yol açar. Geniş bir tabağa yaymak soğumayı hızlandırır. Kabağı sotelerken tavaya bir anda yığma; geniş bir tavada ince bir tabaka halinde yaymak suyun daha hızlı uçmasını sağlar ve süreyi tarifteki 6-8 dakikada tutar.

      '
  - t: Çeşitleme ve servis
    d: 'Dereotu yoksa maydanoz ve biraz taze nane kullanabilirsin. Süzme yoğurdun yoksa normal yoğurdu tülbentte 2 saat süzebilir ya da labne kullanabilirsin. Servis sırasında üzerine zeytinyağı yerine pul biberli tereyağı gezdirmek mezeye sıcak bir dokunuş katar. Meze soğuk servis edilir ve buzdolabında kapalı kapta saklanabilir; bekledikçe sarımsak tadı belirginleşir. Dereotunu ince kıyıp yoğurda en son eklemek rengini ve kokusunu korur. Mezeyi servis tabağına aldıktan sonra kaşığın tersiyle hafif bir çukur açıp zeytinyağını oraya dökebilirsin.

      '
  faq:
  - q: Yoğurtlu kabak mezesi nasıl sulanmaz?
    a: 'Rendelenmiş kabağın suyunu iyice sık, 6-8 dakika soteleyerek kalan suyunu çektir ve soğuduktan sonra süzme yoğurda kat.

      '
  - q: Yoğurtlu kabak için kabak pişirilir mi?
    a: 'Evet, bu tarifte rendelenmiş kabak zeytinyağında 6-8 dakika sotelenir. Böylece suyunu çeker ve tadı yumuşar.

      '
  - q: Kabak mezesinde dereotu yerine ne kullanılır?
    a: 'Maydanoz ve biraz taze nane kullanabilirsin.

      '
  - q: Yoğurtlu kabak mezesi sıcak mı soğuk mu servis edilir?
    a: 'Soğuk servis edilir. İstersen servis sırasında üzerine pul biberli tereyağı gezdirebilirsin.

      '
yogurtlu-meyveli-parfe:
  aramaBasligi: 'Yoğurtlu meyveli parfe tarifi: Granolalı, 10 dakikada'
  editorNote: 'Granolayı katlar arasında ve servisten hemen önce eklemeyi seçtik; yoğurtla bekleyen granola birkaç dakikada yumuşayıp parfenin çıtırlığını kaybettiriyor.

    '
  intro: 'Yoğurtlu meyveli parfe, süzme yoğurt, granola ve meyvenin bardakta kat kat dizildiği, pişirme gerektirmeyen bir tatlı ve kahvaltılık. Her katman farklı bir doku getiriyor: yoğurt kremamsı, meyve sulu, granola çıtır.


    Bu tarifte bir buçuk su bardağı süzme yoğurdu bir kaşık balla tatlandırıyoruz. Bardakların dibine yoğurt, üzerine mevsim meyvesi ve granola koyup katları tekrarlıyoruz. En üste yine meyve ve ceviz geliyor. Çilek, yaban mersini ve muz iyi gidiyor, ama mevsimde ne varsa kullanabilirsin.


    2 kişilik tarif yalnızca 10 dakika hazırlıkla hazır, ocak ya da fırın kullanılmıyor. Sabah kahvaltısı olarak da, akşam hafif bir tatlı olarak da servis edebilirsin.

    '
  notes:
  - t: Neden süzme yoğurt
    d: 'Parfede katların birbirine karışmadan durması yoğurdun koyuluğuna bağlı. Normal yoğurt meyvenin suyuyla birleşince sulanır ve katlar bardakta birbirine akar. Süzme yoğurt meyveyi ve granolayı taşır, bardak dışından katlar net görünür. Elinde yalnızca normal yoğurt varsa tülbentte 2 saat süzerek kendin süzme yoğurt yapabilirsin; labne de kullanılabilir ama daha tuzlu olabileceği için balı artırman gerekebilir. Balı yoğurtla iyice çırpmak tatlılığın bütün katlara eşit dağılmasını sağlar.

      '
  - t: Meyve seçimi
    d: 'Çok sulu meyveler, örneğin karpuz ya da olgun şeftali, bekledikçe suyunu yoğurda bırakır. Bu tür meyveleri kullanacaksan küçük doğrayıp kısa süre süzgeçte bekletmek iyi olur. Çilek, yaban mersini ve muz şeklini koruduğu için parfeye uygun. Muzu en son dilimle ki kararmasın. Dondurulmuş meyve kullanırsan önceden çözdürüp suyunu süz. Bal yerine üzüm pekmezi, akçaağaç ya da hurma şurubu olur. Renkli meyveleri bardağın kenarına yakın yerleştirmek katların dışarıdan görünmesini sağlar.

      '
  - t: Önceden hazırlamak
    d: 'Parfe en iyi hazırlandıktan hemen sonra yenir. Sabah aceleniz varsa yoğurdu balla akşamdan karıştırıp buzdolabında bekletebilir, meyveyi ayrı bir kapta tutabilirsin. Granolayı ve cevizi ise ayrı sakla ve yalnızca servis sırasında ekle. Ofise götürmek istiyorsan kapaklı bir kavanozda yoğurt ve meyveyi taşı, granolayı küçük ayrı bir kapta yanına koy. Ceviz yerine fındık ya da badem kullanabilirsin. Şeffaf bardak kullanmak katları görünür kılar ve sunumu kolaylaştırır.

      '
  faq:
  - q: Parfe nasıl yapılır?
    a: 'Balla tatlandırılmış süzme yoğurt, meyve ve granola bardakta kat kat dizilir, en üste meyve ve ceviz konur. Hazırlığı 10 dakika sürer.

      '
  - q: Parfe önceden hazırlanır mı?
    a: 'Yoğurt ve meyve önceden hazırlanabilir, ancak granola servisten hemen önce eklenmeli. Aksi halde yumuşar.

      '
  - q: Parfe için hangi yoğurt kullanılır?
    a: 'Süzme yoğurt en iyisidir, çünkü koyu olduğu için katlar birbirine karışmaz.

      '
  - q: Parfede bal yerine ne kullanılır?
    a: 'Üzüm pekmezi, akçaağaç şurubu ya da hurma şurubu kullanabilirsin.

      '
yulaf-lapasi:
  aramaBasligi: 'Muzlu yulaf lapası tarifi: Sütlü ve tarçınlı, 10 dakikada'
  editorNote: 'Muzun yarısını lapanın içinde ezip yarısını üstüne dilimlemeyi seçtik; ezilen muz ek şekere gerek bırakmadan lapayı tatlandırıyor, dilimler ise dokuya çeşitlilik katıyor.

    '
  intro: 'Muzlu yulaf lapası, yulaf ezmesinin sütte pişirilip muz, tarçın, ceviz ve chia tohumuyla tamamlandığı sıcak bir kahvaltı. Kısa sürede hazırlanıyor, tek tencere ve bir kase yetiyor.


    Bu tarifte beş kaşık yulaf ezmesini bir su bardağı sütle küçük bir tencerede, kısık ateşte karıştırarak 5 dakika pişiriyoruz. Lapa koyulaşınca muzun yarısı çatalla ezilip ekleniyor ve tarçın serpiliyor; ezilen muz hem tatlılık hem kremamsı bir kıvam veriyor. Kaseye alınan lapanın üzerine kalan muz dilimleri, ceviz, chia tohumu ve bir tatlı kaşığı bal geliyor.


    1 kişilik tarif 2 dakika hazırlık ve 8 dakika pişirmeyle toplam 10 dakikada hazır. Bitki sütüyle de yapılabiliyor.

    '
  notes:
  - t: Kıvamı tutturmak
    d: 'Yulaf ezmesi ısındıkça nişastasını bırakır ve sütü koyulaştırır. Kısık ateşte ve sürekli karıştırarak pişirmek lapanın dibe yapışmasını ve sütün taşmasını önler. Lapa ocaktan alındıktan sonra da koyulaşmaya devam eder, bu yüzden biraz akışkanken ocaktan almak iyi bir fikir. Fazla koyulaştıysa bir iki kaşık sıcak süt ekleyip karıştırabilirsin. Chia tohumu da sıvı çektiği için üzerine serpildikten sonra kıvamı biraz daha artırır.

      '
  - t: Süt ve tatlandırıcı seçimi
    d: 'İnek sütü yerine laktozsuz süt birebir kullanılabilir. Bitki sütü tercih edersen yulaf sütü lapayı daha iyi koyulaştırır, badem sütü daha hafif bir sonuç verir. Bal yerine üzüm pekmezi, akçaağaç ya da hurma şurubu kullanabilirsin; muz yeterince olgunsa tatlandırıcıyı azaltabilirsin bile. Chia yoksa öğütülmüş keten tohumu kullan, ancak keten tohumu da sıvı çektiği için biraz daha az süt yeterli olur. Tarçını ezilen muzla birlikte eklemek kokusunun lapanın her yerine yayılmasını sağlar.

      '
  - t: Gece yulafı ve glutensiz seçenek
    d: 'Sabah ocak başında beklemek istemiyorsan yulafı pişirmeden süt ve yoğurtla karıştırıp buzdolabında bir gece bekletebilirsin; yulaf sıvıyı çekerek yumuşar. Sabah üzerine muz, ceviz ve bal ekleyip soğuk yiyebilirsin. Yulaf doğal olarak glutensiz olsa da işleme sırasında başka tahıllarla temas edebilir. Glutensiz beslenmen gerekiyorsa paketinde glutensiz yazan yulaf ezmesi kullan. Gece yulafında chia tohumu da eklersen sabaha daha koyu bir kıvam elde edersin. Ceviz ve muzu sabah eklemek, cevizin çıtırlığını ve muzun rengini korur.

      '
  faq:
  - q: Yulaf lapası kaç dakikada pişer?
    a: 'Kısık ateşte karıştırarak yaklaşık 5 dakikada koyulaşır. Hazırlıkla birlikte toplam 10 dakika sürer.

      '
  - q: Yulaf lapası suyla mı sütle mi yapılır?
    a: 'Bu tarifte süt kullanılıyor; süt lapayı daha kremamsı yapar. Bitki sütü de olur, yulaf sütü iyi koyulaşır.

      '
  - q: Yulaf lapası pişirmeden yapılır mı?
    a: 'Evet. Yulafı süt ve yoğurtla karıştırıp bir gece buzdolabında bekletirsen gece yulafı elde edersin.

      '
  - q: Yulaf lapası glutensiz mi?
    a: 'Paketinde glutensiz yazan yulaf ezmesi kullanırsan glutensiz olur.

      '
yumurtali-ekmek:
  aramaBasligi: 'Yumurtalı ekmek tarifi: Bayat ekmekle, 15 dakikada'
  editorNote: 'Tarifi özellikle bayat ekmekle yazdık; kurumuş ekmek yumurtalı sütü emip dağılmadan kızarıyor, taze ekmek ise çok çekip tavada parçalanıyor.

    '
  intro: 'Yumurtalı ekmek, ekmek dilimlerinin yumurta ve süt karışımına batırılıp tavada kızartıldığı, pek çok evin kahvaltı sofrasında tanıdık bir yer tutan kahvaltılık. Evde kalan bayat ekmeği değerlendirmenin en kolay yollarından biri.


    Bu tarifte üç yumurtayı yarım su bardağı süt, tuz ve pul biberle geniş bir kapta çırpıyoruz. Sekiz dilim bayat ekmek karışıma iki yüzüyle batırılıyor ve fazlası süzdürülüyor. Dilimler orta ateşte tereyağında iki yüzü altın rengi olana kadar 6-8 dakikada kızartılıyor. Süt yumurtayı yumuşatıyor, böylece ekmeğin içi nemli, dışı kızarmış kalıyor.


    4 kişilik tarif 5 dakika hazırlık ve 10 dakika pişirmeyle toplam 15 dakikada hazır. Tuz yerine şeker ve tarçınla tatlı bir versiyonu da yapılabiliyor.

    '
  notes:
  - t: Ekmeği batırma süresi
    d: 'Ekmeği karışımda uzun süre bekletmek dilimin dağılmasına yol açar. Her yüzü birkaç saniye batırmak, dilimin karışımı emmesine ama yapısını korumasına yetiyor. Bayat ekmek daha kuru olduğu için biraz daha uzun bekletilebilir. Karışımdan çıkardıktan sonra dilimi kabın üzerinde birkaç saniye tutup fazlasını süzdür; tavaya damlayan fazla yumurta yanar ve ekmeğin çevresinde istenmeyen kabuklar oluşturur. Elinde yalnızca taze ekmek varsa dilimleri birkaç dakika fırında kurutarak bayat ekmeğe yakın bir doku elde edebilirsin.

      '
  - t: Orta ateşte kızartmak
    d: 'Ateş çok yüksek olursa ekmeğin dışı hızla kararır, içindeki yumurta pişmeden kalır. Orta ateş, yumurtanın içten pişmesine ve dışın eşit altın rengi almasına zaman tanır. Tereyağı tavada köpürmeye başladığında dilimleri koy. Tavayı kalabalık etme; dilimleri parti parti kızart ve gerekirse her partide biraz daha yağ ekle. Tereyağı yanmaya başlarsa sıvı yağla karıştırarak kullanabilirsin. Kızaran dilimleri kâğıt havluya almak fazla yağı alır ve dışının çıtırlığını korur.

      '
  - t: Tatlı versiyon ve alternatifler
    d: 'Tatlı bir yumurtalı ekmek için karışımda tuz ve pul biber yerine şeker ve tarçın kullan, servis sırasında üzerine bal gezdir. Süt yerine laktozsuz süt birebir kullanılabilir. Tereyağı yerine sıvı yağ da olur; tereyağı daha kokulu bir kızartma verir. Tuzlu versiyonun yanına beyaz peynir, domates ve zeytin iyi gider. Yumurtalı ekmek en lezzetli halini sıcakken verir, beklerse yumuşar. Kalan karışımı atmak yerine tavada çırpılmış yumurta olarak pişirebilirsin.

      '
  faq:
  - q: Yumurtalı ekmek nasıl yapılır?
    a: 'Yumurta, süt, tuz ve pul biber çırpılır, ekmek dilimleri bu karışıma iki yüzüyle batırılıp tereyağında altın rengi olana kadar kızartılır.

      '
  - q: Yumurtalı ekmek neden dağılır?
    a: 'Taze ekmek karışımı çok çeker ve tavada parçalanır. Bayat ekmek kullanmak ve dilimleri karışımda uzun bekletmemek dağılmayı önler.

      '
  - q: Yumurtalı ekmek kaç dakikada kızarır?
    a: 'Orta ateşte iki yüzü toplam 6-8 dakikada altın rengi olur.

      '
  - q: Yumurtalı ekmeğe süt konur mu?
    a: 'Evet, bu tarifte üç yumurtaya yarım su bardağı süt ekleniyor. Süt karışımı inceltip ekmeğin içinin yumuşak kalmasını sağlar.

      '
yumurtali-patates:
  aramaBasligi: 'Yumurtalı patates tarifi: Tavada kahvaltılık, 25 dakikada'
  editorNote: 'Patatesi kapağı kapalı pişirmeyi seçtik; kapak altındaki buhar patatesin içini yumuşatırken tava tabanı dışını kızartıyor ve önceden haşlama ihtiyacını ortadan kaldırıyor.

    '
  intro: 'Yumurtalı patates, küp doğranmış patatesin tavada kızartılıp soğanla birleştirildiği, ardından üzerine yumurta kırılarak pişirildiği bir kahvaltılık. Az malzemeyle hazırlanıyor ve doyurucu olduğu için öğrenci evlerinden aile kahvaltılarına kadar sık yapılıyor.


    Bu tarifte üç patatesi küp doğrayıp zeytinyağında kapağı kapalı, ara ara çevirerek 12 dakika pişiriyoruz. Patatesler hem yumuşayıp hem kızardıktan sonra yarım ay doğranmış soğan ekleniyor ve 3 dakika çevriliyor; tuz, pul biber ve kekik bu aşamada giriyor. Son olarak dört yumurta kırılıyor, ister karıştırılıyor ister göz göz bırakılıyor ve kapak altında 4 dakika pişiyor.


    2 kişilik tarif 5 dakika hazırlık ve 20 dakika pişirmeyle toplam 25 dakikada hazır. Glutensiz bir kahvaltı.

    '
  notes:
  - t: Patates küplerinin boyutu
    d: 'Küpleri aynı boyutta doğramak eşit pişmeleri için önemli. Büyük küplerin içi pişmeden küçükler yanabilir. Yaklaşık bir santimlik küpler 12 dakikada hem yumuşar hem kızarır. Doğradıktan sonra patatesleri suda bekletmeyi seçersen tavaya atmadan önce iyice kurula; ıslak patates yağı sıçratır ve kızarmak yerine buharda pişer. Geniş bir tava kullanmak da küplerin tabana temas etmesini sağlar. Ara ara çevirmek önemli; hiç çevirmezsen alt yüz yanar, sürekli çevirirsen küpler ezilir ve kızarmaz.

      '
  - t: Süreyi kısaltmak
    d: 'Sabahları vaktin azsa patatesleri önceden haşlayabilirsin; böylece yaklaşık 10 dakika kazanırsın. Haşlanmış patatesler tavada yalnızca kızarmak için kısa süre bekler, kapağı kapatmana gerek kalmaz. Haşlarken patatesleri fazla yumuşatma, çatal zorlanarak girecek kadar yeterli; yoksa tavada ezilir. Bir akşam önce haşlayıp buzdolabında saklarsan sabah daha da hızlı olur, soğuk patates de daha iyi kızarır. Soğanı patatesle birlikte en baştan eklememek de bilinçli bir seçim; soğan 12 dakika boyunca tavada kalırsa yanar ve acılaşır.

      '
  - t: Yumurta seçenekleri
    d: 'Yumurtaları karıştırırsan patatesin aralarına dolar ve omlete yakın bir sonuç alırsın. Göz göz bırakırsan sarılar akışkan kalabilir; bunun için kapağı kapatıp 4 dakika pişirmek genelde yeterli. Ateşi orta tut, çok yüksek ateşte alttaki patatesler yanarken yumurta üstten pişmez. Servis sırasında üzerine rendelenmiş kaşar serpebilir, kapağı bir dakika daha kapatarak eritebilirsin. Pul biberi ve kekiği soğanla birlikte eklemek, baharatların yağda kısa süre açılıp kokularını patatese vermesini sağlar.

      '
  faq:
  - q: Yumurtalı patates kaç dakikada pişer?
    a: 'Patatesler 12 dakikada kızarır, soğan 3 dakika çevrilir, yumurtalar 4 dakikada pişer. Hazırlıkla birlikte toplam 25 dakika sürer.

      '
  - q: Yumurtalı patateste patates haşlanır mı?
    a: 'Gerekmez; bu tarifte patates kapağı kapalı tavada pişiyor. Önceden haşlarsan yaklaşık 10 dakika kazanırsın.

      '
  - q: Yumurtalı patates nasıl kızarır?
    a: 'Aynı boyda küplere kesip geniş tavada, kapağı kapalı ve ara ara çevirerek pişirirsen hem içi yumuşar hem dışı kızarır.

      '
  - q: Yumurtalı patatese ne eklenir?
    a: 'Bu tarifte soğan, pul biber ve kekik kullanılıyor. Üzerine rendelenmiş kaşar serpmek de çok yakışır.

      '
zeytinyagli-karnabahar:
  aramaBasligi: 'Zeytinyağlı karnabahar tarifi: Limonlu ve havuçlu, kokusuz'
  editorNote: 'Kapağı aralık bırakarak pişirmeyi tarifin içine yazdık; karnabaharın keskin kokusu buharla çıkıp gidiyor ve yemek soğuduğunda daha temiz bir tat kalıyor.

    '
  intro: 'Zeytinyağlı karnabahar, karnabahar çiçeklerinin soğan ve havuçla, limon suyu ve zeytinyağında pişirildiği, soğuk servis edilen bir yemek. Türk mutfağındaki zeytinyağlıların genel mantığını izliyor: az suda, kısık ateşte pişip kendi suyuyla soğuyor.


    Bu tarifte önce zeytinyağında soğan ve havuç halkalarını 5 dakika çeviriyoruz. Ardından karnabahar çiçekleri, şeker, tuz, limon suyu ve bir su bardağı sıcak su ekleniyor. Kapak aralık bırakılarak karnabahar yumuşayana kadar 20 dakika pişiyor. Limon karnabaharın rengini beyaz tutuyor, bir tatlı kaşığı şeker ise ekşiliği yumuşatıyor. Yemek maydanoz serpilip soğuk servis ediliyor.


    4 kişilik tarif 10 dakika hazırlık ve 25 dakika pişirmeyle toplam 35 dakikada hazır. Vegan ve glutensiz.

    '
  notes:
  - t: Karnabaharı fazla pişirmemek
    d: 'Karnabahar yumuşadığı anda ocaktan alınmalı; fazla pişince çiçekler dağılır, dokusu lapalaşır ve kokusu da artar. 20 dakikanın sonunda bir çiçeğe çatal batırarak kontrol et; zorlanmadan giriyor ama çiçek bütünlüğünü koruyorsa hazırdır. Çiçekleri aynı boyda ayırmak hepsinin aynı anda pişmesini sağlar. Zeytinyağlılar soğurken de pişmeye devam ettiği için biraz diri bırakmak iyi bir fikir. Kararmış ya da lekeli çiçek uçlarını pişirmeden önce bıçakla kazımak yemeğin görünüşünü de iyileştirir.

      '
  - t: Limon ve şekerin görevi
    d: 'Limon suyu karnabaharın beyaz rengini korur ve yemeğe zeytinyağlılara özgü ferah ekşiliği verir. Bir tatlı kaşığı şeker tatlı bir yemek yapmak için değil, limonun ekşiliğini ve karnabaharın hafif acımsı tadını dengelemek için eklenir. Limon yoksa misket limonu ya da yarı ölçü elma sirkesi kullanabilirsin. Rengi altın sarısı olsun istersen pişirmeye bir tutam zerdeçal ekle. Limon suyunu karnabaharla birlikte en başta eklemek, rengi pişirme boyunca korur.

      '
  - t: Soğuk servis ve saklama
    d: 'Zeytinyağlı karnabahar tenceresinde, kendi suyunun içinde soğumalı; böylece zeytinyağı ve limon çiçeklere iyice siner. Soğuduktan sonra servis tabağına alıp maydanoz serp. Buzdolabında kapalı kapta birkaç gün saklanabilir ve ertesi gün tadı daha oturmuş olur. Servis etmeden önce buzdolabından biraz erken çıkarırsan zeytinyağı donukluğunu kaybeder ve tat daha iyi açılır. Zeytinyağlıların genelinde olduğu gibi, servis sırasında üzerine biraz çiğ zeytinyağı gezdirmek kokusunu tazeler. Yanına ekmek koymayı unutma, tencerenin suyu da yenir.

      '
  faq:
  - q: Zeytinyağlı karnabahar kaç dakika pişer?
    a: 'Sebzeler 5 dakika kavrulduktan sonra karnabahar kapağı aralık şekilde yaklaşık 20 dakika, yumuşayana kadar pişer.

      '
  - q: Karnabahar pişerken kokusu nasıl azalır?
    a: 'Tencerenin kapağını aralık bırakarak pişirmek kokunun buharla çıkmasını sağlar. Karnabaharı fazla pişirmemek de kokuyu azaltır.

      '
  - q: Zeytinyağlı karnabahar sıcak mı soğuk mu yenir?
    a: 'Soğuk servis edilir. Tenceresinde kendi suyuyla soğuması tadını oturtur.

      '
  - q: Karnabahar nasıl beyaz kalır?
    a: 'Pişirme suyuna eklenen limon suyu karnabaharın rengini beyaz tutar. Altın sarısı istersen bir tutam zerdeçal ekleyebilirsin.

      '
zeytinyagli-kereviz:
  aramaBasligi: 'Zeytinyağlı kereviz tarifi: Portakallı ve bezelyeli'
  editorNote: 'Kerevizi doğrar doğramaz limonlu suya atmayı ayrı bir adım yaptık; kesilen kereviz havayla temas edince birkaç dakikada kararıyor ve yemeğin açık rengi bozuluyor.

    '
  intro: 'Zeytinyağlı kereviz, kereviz kökünün havuç, soğan ve bezelyeyle portakal suyu içinde pişirildiği, soğuk servis edilen bir kış yemeği. Portakal suyu kerevizin hafif acımsı tadını yumuşatıp tatlımsı ve ferah bir sonuç veriyor.


    Bu tarifte kerevizleri soyup iri dilimliyor ve kararmasın diye hemen limonlu suya atıyoruz. Zeytinyağında soğan yumuşatılıp küp havuçlar ekleniyor. Ardından kerevizler, bezelye, bir portakalın suyu, şeker, tuz ve bir su bardağı sıcak su ekleniyor; yemek kapağı kapalı, kısık ateşte 30 dakika, kerevizler yumuşayana kadar pişiyor. Soğuduktan sonra dereotu serpilip servis ediliyor.


    4 kişilik tarif 20 dakika hazırlık ve 30 dakika pişirmeyle toplam 50 dakikada hazır. Vegan ve glutensiz bir zeytinyağlı.

    '
  notes:
  - t: Kerevizi soymak ve korumak
    d: 'Kereviz kökünün kabuğu kalın ve topraklıdır; sebze soyacağı yerine keskin bir bıçakla soymak daha kolaydır. Önce üst ve alt uçlarını düz kesip kökü tezgâha oturt, ardından kabuğu yukarıdan aşağı doğru dilimleyerek çıkar. Kestiğin her parçayı hemen limonlu suya at; kereviz havayla temas edince kararır. Tarifteki limonu bu su için kullanıyoruz, pişirme sırasında ekşiliği portakal suyu veriyor. Dilimleri aynı kalınlıkta kesmek, hepsinin 30 dakikada eşit yumuşamasını sağlar.

      '
  - t: Portakal suyunun rolü
    d: 'Kerevizin kendine has, hafif acımsı bir tadı vardır ve bu yüzden bazı insanlar onu sevmez. Portakal suyu bu acılığı dengeler, şeker de portakalın ekşiliğini yumuşatır. Taze sıkılmış portakal suyu kullanmak daha temiz bir tat verir. Pişirme sonunda tadına bakıp tuzu ayarla. Kapağı kapalı ve kısık ateşte pişirmek kerevizlerin dağılmadan, dilim şekliyle yumuşamasını sağlar. Portakal suyunu tencereye eklemeden hemen önce sıkmak aromasının kaybolmasını önler.

      '
  - t: Bezelye ve servis
    d: 'Taze bezelye kerevizle birlikte 30 dakika pişebilir. Dondurulmuş bezelye kullanıyorsan pişirmenin son 10 dakikasında ekle; erken eklenirse rengini kaybeder ve ezilir. Dereotu yoksa maydanoz ve biraz taze nane kullanabilirsin. Zeytinyağlı kereviz soğuk servis edilir; tenceresinde kendi suyuyla soğuması tadını oturtur. Buzdolabında kapalı kapta birkaç gün saklanabilir. Servis sırasında kerevizleri tabağa dizip havuç ve bezelyeyi üzerine yaymak, pişirme suyunu da üstüne gezdirmek klasik bir sunumdur. Dereotunu en son serp ki solmasın.

      '
  faq:
  - q: Zeytinyağlı kereviz kaç dakika pişer?
    a: 'Kapağı kapalı, kısık ateşte yaklaşık 30 dakika, kerevizler yumuşayana kadar pişer.

      '
  - q: Kereviz neden kararır, nasıl önlenir?
    a: 'Kesilen kereviz havayla temas edince kararır. Doğradığın parçaları hemen limonlu suya atarsan rengini korur.

      '
  - q: Zeytinyağlı kerevize portakal suyu neden konur?
    a: 'Portakal suyu kerevizin hafif acı tadını dengeler ve yemeğe tatlımsı, ferah bir lezzet verir.

      '
  - q: Zeytinyağlı kerevizde dondurulmuş bezelye kullanılır mı?
    a: 'Evet. Dondurulmuş bezelyeyi pişirmenin son 10 dakikasında ekle ki rengini ve dokusunu korusun.

      '
